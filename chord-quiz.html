<script>
/* 和音クイズ：Ⅰ・Ⅳ・Ⅴ・Ⅴ7 を、いろいろな「もんだいのしゅるい」（CATS）でれんしゅうする。長調・短調。
 *   けんばんでおさえる（🎤 ピアノでひいても・🎹 電子ピアノでも）／4つからえらぶ／はじまりの音／たりない音／がくふを見て／
 *   Ⅴ7にするには／まちがいさがし／ならびの「？」／（短調だけ）7ばんめの音・どの記号？
 *   ステップ（STEPS）：長調・短調それぞれ、やさしいじゅん（まねる→うめる→つくる→べつの出しかた→ならび）の5もんセット。
 *     5もん中4もんいじょう、じぶんで（ヒントなしで）できたら ✓（PA.store 'chord-quiz-steps'＝{'major:root-easy':いちばんよかった数}）
 * リンクのパラメータ（先生のしゅくだい。わからない値はすてる）：
 *   key＝調（M0〜M12長調・m0〜m12短調。その調だけ）、chord＝I,IV,V,V7（カンマでいくつでも）、mode＝keys｜choice（まえから）、
 *   cat＝もんだいのしゅるい（CATS の id。mode よりさき）、tier＝easy｜normal｜hard｜all、keyset＝major｜minor｜both（このページだけ）、
 *   n＝れんしゅうのもんだいの数（1〜20）、step＝ステップの番号（keyset の長調／短調の。5もん）
 *   keyset だけのリンク（ホームの①長調・②短調）は、その調のステップのいちらんをひらく
 * きろく：けんばん・えらぶは前からの 'chord-quiz'（keystats・session。ホームの★・チェック表）。
 *   ほかのしゅるいは 'chord-quiz-<しゅるい>'（keystats-chord-quiz-root など。べつべつにのこす） */
// <cq-logic>（test/chord-quiz.test.mjs でここだけ切りだしてたしかめる。DOM はつかわない）
const CHORDS={I:{deg:0,n:3,label:'Ⅰ'},IV:{deg:3,n:3,label:'Ⅳ'},V:{deg:4,n:3,label:'Ⅴ'},V7:{deg:4,n:4,label:'Ⅴ7'}};
const CHORD_IDS=Object.keys(CHORDS);
const QUIZ='chord-quiz', KD=PA.keyDeck;
const TIER_IDS=KD.TIERS.map(t=>t.id);
const KEYSETS=[['major','長調'],['minor','短調'],['both','りょうほう']];
/* もんだいのしゅるい。stage＝ステップの段階（STAGES）、minor＝短調だけ、chords＝出す和音がきまっているもの
 *   keys・choice はまえからのもの（Q.type とおなじ。リンクの mode） */
const CATS=[
  {id:'root',emoji:'🔍',name:'はじまりの音',desc:'「ト長調のⅣは、どの音から？」',stage:'copy'},
  {id:'fill',emoji:'🧩',name:'たりない音',desc:'「ソ・□・レ」の□に入る音は？',stage:'fill'},
  {id:'add7',emoji:'➕',name:'Ⅴ7にするには',desc:'Ⅴにどの音をたすとⅤ7？',stage:'fill',chords:['V7']},
  {id:'choice',emoji:'✋',name:'名前からえらぶ',desc:'4つの音のくみあわせから選ぶ',stage:'make'},
  {id:'keys',emoji:'🎹',name:'名前からおさえる',desc:'けんばんで和音をおさえる',stage:'make'},
  {id:'staff',emoji:'🎼',name:'がくふを見て',desc:'がくふの和音はⅠ・Ⅳ・Ⅴ・Ⅴ7のどれ？',stage:'other'},
  {id:'inv',emoji:'🔄',name:'がくふで転回形',desc:'がくふの和音と、基本形・第1転回形などのかたち',stage:'other'},
  {id:'fix',emoji:'🔎',name:'まちがいさがし',desc:'1つだけちがう音をさがす',stage:'other'},
  {id:'prog',emoji:'🎶',name:'ならびの「？」',desc:'Ⅰ→？→Ⅴ7→Ⅰの「？」は？',stage:'prog'},
  {id:'chromatic',emoji:'⏱',name:'12の調をじゅんばんに',desc:'半音ずつ上の調へ。Ⅰ・Ⅳ・Ⅴ・Ⅴ7をひいて時間をはかる',stage:'time'},
  {id:'lt',emoji:'🪜',name:'7ばんめの音',desc:'短調の7ばんめと、Ⅴで上げた音',stage:'copy',minor:true,chords:['V']},
  {id:'mark',emoji:'♯',name:'どの記号？',desc:'7ばんめにつけるのは♯・♮・ダブルシャープのどれ？',stage:'fill',minor:true}
];
const CAT_IDS=CATS.map(c=>c.id);
const TYPES=CAT_IDS; // Q.type＝もんだいのしゅるい
const OLD_TYPES=['keys','choice'];
const catOf=id=>CATS.find(c=>c.id===id)||CATS[4];
const isTimed=id=>id==='chromatic'; // ⏱ 12の調をじゅんばんに（もんだいではなく、時間をはかる）
const isDrill=id=>CAT_IDS.includes(id)&&!OLD_TYPES.includes(id)&&!isTimed(id); // えらんでこたえる新しいしゅるい
const quizOf=id=>isDrill(id)||isTimed(id)?QUIZ+'-'+id:QUIZ;
const STAGES={copy:'まねる',fill:'うめる',make:'つくる',other:'べつの出しかた',prog:'ならび',time:'すらすら'};
// ステップのいちらんの段階の字。ならび（prog）のあとのステップは、しゅるいの段階ではなく「もっと」（調号がふえる）・「ぜんぶの調」
const stageText=(list,i)=>{
  const s=list[i], c=catOf(s.cat), pi=list.findIndex(x=>x.cat==='prog');
  if(isTimed(s.cat)||pi<0||i<=pi) return STAGES[c.stage];
  return s.tier==='all'?'ぜんぶの調':'もっと';
};
// ステップ：1つのステップでむずかしくするのは1つだけ（しゅるい・調号の数・和音のどれか）
const ST=(cat,tier,chords,note)=>({id:cat+'-'+tier,cat,tier,chords:chords.split(','),note:note||''});
const ALL4='I,IV,V,V7';
const STEPS={
  major:[ST('root','easy','I,IV,V'),ST('fill','easy','I,IV,V'),ST('add7','easy','V7','Ⅴに1つたしてⅤ7'),ST('choice','easy',ALL4),ST('keys','easy',ALL4),
    ST('keys','normal',ALL4),ST('staff','easy',ALL4),ST('inv','easy',ALL4),ST('fix','easy',ALL4),ST('prog','easy',ALL4),
    ST('keys','hard',ALL4),ST('keys','all',ALL4),ST('chromatic','all',ALL4)],
  minor:[ST('lt','easy','V'),ST('root','easy','I,IV,V'),ST('fill','easy','I,IV,V'),ST('add7','easy','V7'),
    ST('mark','normal','V,V7','♮をつける調も出るよ'),ST('choice','easy',ALL4),ST('keys','easy',ALL4),ST('keys','normal',ALL4),
    ST('staff','easy',ALL4),ST('inv','easy',ALL4),ST('fix','easy',ALL4),ST('prog','easy',ALL4),ST('mark','hard','V,V7','ダブルシャープ（x）の調も出るよ'),ST('keys','all',ALL4),
    ST('chromatic','all',ALL4)]
};
// さいごのステップ（⏱ 12の調をじゅんばんに）は5もんではなく、12の調をさいごまでひけたら ✓（きろくは STEP_N）
const STEP_N=5, STEP_PASS=4; // 5もん中4もんいじょう、じぶんでできたら ✓
const stepOf=(ks,n)=>STEPS[ks]&&Number.isInteger(n)&&n>=1&&n<=STEPS[ks].length?Object.assign({ks,n},STEPS[ks][n-1]):null;
const stepById=sid=>{const r=/^(major|minor):([a-z0-9]+-[a-z]+)$/.exec(String(sid||''));if(!r) return null;const i=STEPS[r[1]].findIndex(s=>s.id===r[2]);return i<0?null:stepOf(r[1],i+1);};
const stepKey=s=>s.ks+':'+s.id;
const stepSig=s=>'step='+stepKey(s);
// その しゅるいで出す和音（えらんだ和音 on から）
function catChords(cat,on){
  const c=catOf(cat);
  if(cat==='mark'){const v=on.filter(x=>x==='V'||x==='V7');return v.length?v:['V7'];}
  if(c.chords) return c.chords.slice();
  return on.length?on.slice():['I'];
}
// その しゅるいの調（短調だけのしゅるいは短調だけ）
const catModes=(cat,keyset)=>catOf(cat).minor?['minor']:keyset==='both'?['major','minor']:[keyset];
// はじめてひらいた人（きろくがない）：長調・やさしい（調号0〜1）・ⅠⅣⅤ・けんばんでこたえる
const FIRST={type:'keys',tier:'easy',keyset:'major',chords:{I:true,IV:true,V:true,V7:false}};
const chordTones=(key,ch)=>{const c=CHORDS[ch];return Array.from({length:c.n},(_,j)=>PA.at(key.scale,c.deg+2*j));};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// まちがえやすい答え：ほかの和音・♯♭をわすれた・7ばんめを上げわすれた・となりどうし・ひとつずれ
function makeChoices(q){
  const key=PA.keyOf(q.minor,q.keyIdx,60), c=CHORDS[q.chord], t=chordTones(key,q.chord);
  const sig=a=>a.map(n=>n.letter+':'+n.acc).join(',');
  // kind＝どんなまちがいか（こたえのメッセージでつかう）。おなじ音のくみあわせなら前のほう（ほかの和音 → 上げわすれ → 調号）をのこす
  const cands=[];
  CHORD_IDS.forEach(ch=>{if(ch!==q.chord) cands.push({notes:chordTones(key,ch),kind:'chord',ch});});
  if(t.some(n=>n.raised)) cands.push({notes:t.map(n=>n.raised?{letter:n.letter,acc:key.sig[n.letter]}:n),kind:'raise'});
  cands.push({notes:t.map(n=>({letter:n.letter,acc:0})),kind:'sig'});
  cands.push({notes:Array.from({length:c.n},(_,j)=>PA.at(key.scale,c.deg-1+2*j)),kind:'shift'});
  cands.push({notes:Array.from({length:c.n},(_,j)=>PA.at(key.scale,c.deg+1+2*j)),kind:'shift'});
  cands.push({notes:Array.from({length:c.n},(_,j)=>PA.at(key.scale,c.deg+j)),kind:'step'});
  const seen=new Set([sig(t)]), uniq=[];
  cands.forEach(o=>{const k=sig(o.notes);if(!seen.has(k)){seen.add(k);uniq.push(o);}});
  const out=shuffle(uniq).slice(0,3).map(o=>({notes:o.notes,ok:false,kind:o.kind,ch:o.ch}));
  out.push({notes:t,ok:true});
  return shuffle(out);
}
// リンクのパラメータ → せってい（その1回つかう）。きまった値だけとる
function linkSettings(p){
  const o={}, has=k=>!!p&&Object.prototype.hasOwnProperty.call(p,k)&&typeof p[k]==='string';
  if(has('mode')&&OLD_TYPES.includes(p.mode)) o.type=p.mode;
  if(has('cat')&&CAT_IDS.includes(p.cat)) o.type=p.cat;
  if(has('step')&&/^\d{1,2}$/.test(p.step)&&+p.step>=1) o.step=+p.step;
  if(has('tier')&&TIER_IDS.includes(p.tier)) o.tier=p.tier;
  if(has('keyset')&&KEYSETS.some(([v])=>v===p.keyset)) o.keyset=p.keyset;
  if(has('chord')){
    const cs=p.chord.split(',').map(x=>x.trim()).filter(x=>CHORD_IDS.includes(x));
    if(cs.length){o.chords={};CHORD_IDS.forEach(x=>o.chords[x]=cs.includes(x));}
  }
  if(has('key')){const k=KD.parse(p.key);if(k&&k.id===p.key) o.key=k.id;}
  if(has('n')&&/^\d{1,2}$/.test(p.n)&&+p.n>=1&&+p.n<=20) o.n=+p.n;
  return o;
}
// リンクのしるし（おなじしゅくだいならつづきから）。keyset も入れる

}
const validQ=q=>!!q&&typeof q==='object'&&typeof q.minor==='boolean'&&isInt(q.keyIdx,0,PA.keyCount(q.minor)-1)&&Object.prototype.hasOwnProperty.call(CHORDS,q.chord);
// ステップのせってい → RUN
const chordsObj=list=>{const c={};CHORD_IDS.forEach(k=>c[k]=list.includes(k));return c;};
const stepRun=s=>({type:s.cat,tier:s.tier,keyset:s.ks,chords:chordsObj(s.chords),key:null,sig:stepSig(s),id:String(Date.now()),step:stepKey(s)});
// 短調だけのしゅるいは長調だけにしない
function fitKeyset(){if(catOf(Q.type).minor&&Q.keyset==='major') Q.keyset='minor';}
const curStep=()=>RUN&&RUN.step?stepById(RUN.step):null;
// ステップのきろく：{'major:root-easy':5もん中じぶんでできたいちばん多い数}
function stepRec(){const d=PA.store.get('chord-quiz-steps',{});return d&&typeof d==='object'&&!Array.isArray(d)?d:{};}
const stepDone=(rec,s)=>isInt(rec[stepKey(s)],STEP_PASS,STEP_N);
// おわった回（10分すぎたもの）はつかわない
const AFTER_END=10*6e4;
const liveState=s=>{const st=s.state();if(!st) return null;return st.done.length<st.n||(st.endedAt!=null&&Date.now()-st.endedAt<AFTER_END)?st:null;};

/* ===== 🎤 マイク（assets/mic.js）。phase：off・intro（はじめての説明）・wait（じゅんび中）・on（きいている）・error ===== */
const MIC_OK=!!(PA.mic&&PA.mic.supported());
const MIC={phase:'off',err:'',verdict:null,L:null,qid:-1,lstate:'idle',quietUntil:0,needReset:false};
function stopMic(){
  if(PA.mic&&(MIC.phase==='on'||MIC.phase==='wait')) PA.mic.stop();
  MIC.phase='off'; MIC.err=''; MIC.L=null; MIC.verdict=null; MIC.lstate='idle';
}

(function load(){
  const raw=PA.store.get('chord-quiz',{}), d=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};
  if(!Object.keys(d).length) Object.assign(Q,{type:FIRST.type,tier:FIRST.tier,keyset:FIRST.keyset,chords:Object.assign({},FIRST.chords)}); // はじめての人はやさしく
  else{
    if(TYPES.includes(d.type)) Q.type=d.type;
    if(TIER_IDS.includes(d.tier)) Q.tier=d.tier;

    const ltype=LINK.type||(onlyKs||OLD_TYPES.includes(BASE.type)?BASE.type:'keys');
    RUN={type:ltype,tier:LINK.tier||BASE.tier,keyset:LINK.keyset||BASE.keyset,chords:Object.assign({},LINK.chords||BASE.chords),
      key:LINK.key||null,sig:LINK.n?linkSig(LINK):'',id:String(Date.now()),step:null};
  }else{
    const R=readRun(d.run), ls=R&&R.sig?liveState(PA.session(quizOf(R.type))):null;
    // おなじれきしのページの読みなおし（「つくりかたを見る」からもどったなど）か、そのリンク・ステップではじめた回のつづき
    if(R&&((histId&&histId===R.id)||(ls&&ls.sig===R.sig))) RUN=R;
  }
  // リンクのパラメータは1回だけつかう：アドレスからけす（読みなおしてもリンクでもとにもどさない）
  if(location.search){try{history.replaceState({cqLink:RUN&&Object.keys(LINK).length?RUN.id:histId},'',PA.url(QUIZ)+location.hash);}catch(e){}}
  if(RUN){
    Object.assign(Q,{type:RUN.type,tier:RUN.tier,keyset:RUN.keyset,chords:Object.assign({},RUN.chords)});
    if(RUN.key){Q.only=RUN.key;Q.onlyBy='link';}
  }
  fitKeyset();
  // れんしゅうの回（しゅるいごと）：リンクに n・step があればその回（おなじリンクのとちゅうならつづき）。なければのこっている回をよむ
  const qz=quizOf(Q.type);
  // ⏱ 12の調をじゅんばんに は n もんの回をつかわない
  sess=isTimed(Q.type)?PA.session(qz):linkStep?PA.session(qz,{n:STEP_N,sig:RUN.sig}):LINK.n?PA.session(qz,{n:LINK.n,sig:linkSig(LINK)}):PA.session(qz);
  let st=sess.state();
  if(sess.finished()){ // おわった回：おわってすぐ（「もどる」の読みなおし）かリンクの n のときだけけっかを出す
    const recent=!!st&&st.endedAt!=null&&Date.now()-st.endedAt<AFTER_END;
    if(recent||LINK.n||linkStep) Q.view='summary';
    else{sess.clear();st=null;}

  // ステップのいちらん：keyset だけのリンク・まえにいちらんを見ていた（リンクなし）

  if(onlyKs||(!Object.keys(LINK).length&&d.view==='steps'&&Q.view!=='summary')){
    Q.view='steps';

    if(onlyKs) Q.stepsKs=LINK.keyset;
  }
  // チェック表の3もんのつづき
  if(!Q.only&&!Object.keys(LINK).length&&d.onlyBy==='pick'&&typeof d.only==='string'&&KD.parse(d.only)&&st&&st.sig==='pick='+KD.parse(d.only).id){
    Q.only=KD.parse(d.only).id;Q.onlyBy='pick';
  }
  makeDecks();
  // ひらきなおしてもふくろのつづきから（24調をじゅんばんにまわす）。ほぞんしたふくろがこのしゅるいのものなら
  const hasBag=(d.deckQuiz||QUIZ)===qz&&deck.restore(d.deck);
  // まだこたえていないもんだいはそのままつづける（「つくりかたを見る」からもどったときなど）。えらぶしゅるいはおなじしゅるい・おなじ seed のときだけ
  const q=d.q, sameType=isDrill(Q.type)?d.qtype===Q.type&&isInt(d.dseed,1,2**31):!isDrill(d.qtype);
  if(validQ(q)&&sameType){
    const s={minor:q.minor,keyIdx:q.keyIdx,chord:q.chord};
    if(!d.answered&&inPool(s)){
      startQuestion(s,d.dseed);
      if(!hasBag&&!Q.only) deck.draw(x=>x.id===keyIdOf(s)); // ふくろのきろくがないときも、この調は「出た」ことに
      if(d.scored===true&&Q.total>0) Q.result=false; // もうかぞえてあるもんだい（1回目が × で「もういちど」のとちゅう。まえのきまりで見たら × にしたものも）
      Q.recorded=d.recorded===true; // チェック表にもう入れたもんだい（2回かぞえない）
      Q.peeked=d.peeked===true;
      if(isInt(d.hint,0,2)) Q.hint=d.hint;
      // 2つめのパートのとちゅう（1つめはあっていた）
      if(Q.dr&&Array.isArray(d.dpick)&&d.dpick.length===1&&isInt(d.dpick[0],0,Q.dr.parts[0].opts.length-1)&&Q.dr.parts.length>1&&Q.dr.parts[0].opts[d.dpick[0]].ok) Q.dpick=[d.dpick[0]];
    }else lastQ=s;
  }else if(validQ(q)) lastQ={minor:q.minor,keyIdx:q.keyIdx,chord:q.chord};
})();
// 調のふくろ（しゅるいごと）。deckOne は「この調だけ」のとき（むずかしさ・長調／短調にかかわらず）
function makeDecks(){
  const qz=quizOf(Q.type);
  deck=KD.create({quiz:qz,tier:Q.tier,modes:catModes(Q.type,Q.keyset),weak:Q.weak});
  deckOne=KD.create({quiz:qz,tier:'all',modes:CHECK_MODES,weak:false});
}
// しゅるいがかわった：きろくの名前がかわるなら、ふくろと回をそのしゅるいのものに（おわった回はしまう）
function switchQuiz(){
  if(deck&&deck.quiz===quizOf(Q.type)){deck.setOptions({tier:Q.tier,modes:catModes(Q.type,Q.keyset)});return;}
  makeDecks();
  sess=PA.session(quizOf(Q.type));
  if(sess.finished()) sess.clear();
}
// せっていは BASE をほぞん。リンク・ステップの回（RUN）のあいだにかえたものは RUN だけに入れる
function save(){
  if(RUN){Object.assign(RUN,settingsOf(Q));RUN.key=Q.onlyBy==='link'?Q.only:null;}
  else BASE=settingsOf(Q);
  PA.store.set('chord-quiz',{type:BASE.type,tier:BASE.tier,weak:Q.weak,keyset:BASE.keyset,chords:BASE.chords,right:Q.right,total:Q.total,hinted:Q.hinted,streak:Q.streak,openSet:Q.openSet,run:RUN,
    q:Q.q?{minor:Q.q.minor,keyIdx:Q.q.keyIdx,chord:Q.q.chord}:null,qtype:Q.type,dseed:Q.dr?Q.dseed:0,dpick:Q.dpick.slice(),answered:isDone(),scored:Q.result!==null,recorded:Q.recorded,peeked:Q.peeked,hint:Q.hint,
    only:Q.only,onlyBy:Q.onlyBy,view:Q.view,stepsKs:Q.stepsKs,deckQuiz:deck.quiz,deck:deck.state()});
}
function isDone(){return Q.type==='keys'?Q.checked:Q.dr?drillDone(Q.dr,Q.dpick):Q.chosen!=null;}

/* ===== もんだい（調は PA.keyDeck のふくろから。和音はえらんだ中から） ===== */
// （ひらいたときの load からもよぶので function でかく）
function chordsOn(){return CHORD_IDS.filter(k=>Q.chords[k]);}
function poolChords(){return catChords(Q.type,chordsOn());}
function inPool(q){return (Q.only?sameKeyIds(Q.only):deck.ids).includes(keyIdOf(q))&&poolChords().includes(q.chord)&&(!catOf(Q.type).minor||q.minor);}
// seed＝えらぶしゅるいのもんだいの seed（つづきのときだけわたす）
function startQuestion(q,seed){
  stopMic(); stopProg(); // もんだいがかわったらマイク・ならびの音はとめる
  Object.assign(Q,{q,qid:Q.qid+1,picked:new Set(),checked:false,result:null,recorded:false,lastOk:null,hint:0,peeked:false,wasHint:false,byMic:false,chosen:null,dr:null,dseed:0,dpick:[]});
  if(isDrill(Q.type)){Q.dseed=seed||1+Math.floor(Math.random()*(2**31-1));Q.dr=makeDrill(Q.type,q,Q.dseed);}
  else Q.choices=makeChoices(q);
}
function newQuestion(){
  const prev=Q.q||lastQ, pid=prev?keyIdOf(prev):null;
  let k;
  if(Q.only){ // この調だけ（おなじ音の2つの書きかたはかわりばんこ）
    const ids=sameKeyIds(Q.only).filter(id=>!catOf(Q.type).minor||id[0]==='m');
    k=deckOne.draw(x=>ids.includes(x.id)&&x.id!==pid)||deckOne.draw(x=>ids.includes(x.id));
  }else{
    // まえとちがう調をとる（まえの調はふくろにのこる）。ふつうは deck がつづけて同じ調を出さない
    k=deck.draw(x=>x.id!==pid)||deck.draw();
  }
  k=k||{minor:catOf(Q.type).minor===true,idx:0};
  let chs=poolChords();
  if(prev&&k.minor===prev.minor&&k.idx===prev.keyIdx&&chs.length>1) chs=chs.filter(c=>c!==prev.chord); // 調がおなじなら和音をかえる
  lastQ=null;
  startQuestion({minor:k.minor,keyIdx:k.idx,chord:chs[Math.floor(Math.random()*chs.length)]});
}
// 1もんめの答え：⭐・チェック表・れんしゅうの回にきろく（1もんに1回だけ）
function answered(ok){
  const hinted=Q.peeked||Q.hint>=1;
  Q.result=ok; Q.wasHint=ok&&hinted;
  scoreAnswer(Q,ok,hinted);
  if(!Q.recorded&&Q.q){Q.recorded=true;deck.record(keyIdOf(Q.q),ok,ok&&hinted?{hint:true}:undefined);}
  const r=sess&&sess.active()?sess.record({ok,hint:ok&&hinted,label:qLabel(),key:keyIdOf(Q.q)}):null;
  // ステップの5もんがおわった：5もん中4もんいじょう、じぶんでできたら ✓（いちばんよかった数をのこす）
  const s=curStep();
  if(r&&r.finished&&s&&sess.state().sig===stepSig(s)){
    const rec=stepRec(), self=sess.tally().self;
    if(!(isInt(rec[stepKey(s)],0,STEP_N)&&rec[stepKey(s)]>=self)){rec[stepKey(s)]=self;PA.store.set('chord-quiz-steps',rec);}
  }
}
// けっかのカードにのこすもんだいのことば（ただの文字）
function qLabel(){
  const key=keyOfQ(Q.q), kn=PA.keyName(key), lab=CHORDS[Q.q.chord].label;
  switch(Q.type){
    case 'keys': case 'choice': return `${kn}の${lab}`;
    case 'add7': return `${kn}のⅤ7（Ⅴにたす音）`;
    case 'lt': return `${kn}の7ばんめの音`;
    case 'mark': return `${kn}の${lab}（7ばんめの記号）`;
    case 'staff': case 'prog': return `${kn}の${lab}（${catOf(Q.type).name}）`;
    case 'inv': return Q.dr&&Q.dr.cat==='inv'?`${kn}の${lab}・${SHAPES[Q.dr.inv]}（${catOf(Q.type).name}）`:`${kn}の${lab}（${catOf(Q.type).name}）`;
    default: return `${kn}の${lab}（${catOf(Q.type).name}）`;
  }
}
function okMsg(key,c,t){
  return `🎉 ${Q.byMic?'🎤 ピアノで':''}正解！${PA.keyName(key)}の${c.label}は<b>${PA.namesH(t)}</b>`
    +(Q.wasHint?`<br><small>💡 ヒントを見てできたね。次は見ないでやってみよう</small>`:'');
}
// おさえた音をピッチクラスでくらべる（どのオクターブでも OK）
function gradeKeys(t){
  const ans=new Set(t.map(n=>PA.mod(n.midi,12))), pk=new Set([...Q.picked].map(m=>PA.mod(m,12)));
  const extra=[...pk].filter(p=>!ans.has(p)), missing=t.filter(n=>!pk.has(PA.mod(n.midi,12)));
  return {ok:!extra.length&&!missing.length,extra,missing,count:pk.size};
}
function checkKeys(){
  const t=chordTones(keyOfQ(Q.q),Q.q.chord), ok=gradeKeys(t).ok;
  Q.checked=true; Q.lastOk=ok; PA.answerFx(ok);
  if(Q.result===null) answered(ok); // スコアは1回目だけ
  if(ok) PA.chord(t.map(n=>n.midi));
}
// こたえのメッセージは毎回いまの音名でつくる（⚙️で音名をかえてもそろう）
function fbHTML(key,c,t){
  if(Q.type==='choice'){
    if(Q.chosen==null) return '';
    const pick=Q.choices[Q.chosen];
    return pick.ok?okMsg(key,c,t):`🤔 おしい！こたえは<b>${PA.namesH(t)}</b><br>`+choiceHint(key,c,t,pick);
  }
  if(!Q.checked) return '';
  const g=gradeKeys(t);
  if(g.ok) return okMsg(key,c,t);
  const hints=[];
  g.missing.forEach(n=>{
    const from=n.raised?{letter:n.letter,acc:key.sig[n.letter]}:{letter:n.letter,acc:0};
    const fpc=PA.mod(PA.NAT[from.letter]+from.acc,12);
    if((n.raised||n.acc!==0)&&g.extra.includes(fpc))
      hints.push(n.raised?`「${PA.nmH(from)}」は短調の${c.label}なので半音上げて「${PA.nmH(n)}」だよ。`:`「${PA.nmH(from)}」は調号で「${PA.nmH(n)}」になるよ。がくふの調号を見てみよう。`);
  });
  if(g.count!==c.n) hints.push(`${c.label}は<b>${c.n}つ</b>の音だよ（いま${g.count}つ）。`);
  return `🤔 おしい！こたえは<b>${PA.namesH(t)}</b><br>`+(hints.length?hints.join('<br>'):`音階の<b>${c.deg+1}ばんめ</b>から、ひとつとばしで音をかさねてみよう。`);
}
// えらんだまちがいにあわせたヒント
function choiceHint(key,c,t,pick){
  const base=`${c.label}は音階の<b>${c.deg+1}ばんめ</b>から、ひとつとばしで音をかさねるよ。`;
  const raiseTxt=()=>{const n=t.find(x=>x.raised);return `短調の${c.label}は7ばんめ「${PA.nmH({letter:n.letter,acc:key.sig[n.letter]})}」を半音上げて「${PA.nmH(n)}」にするよ。`;};
  switch(pick.kind){
    case 'chord': return `それは<b>${CHORDS[pick.ch].label}</b>の音だよ。${base}`;
    case 'raise': return raiseTxt();
    case 'sig': {
      const s=t.filter(n=>!n.raised&&n.acc!==0).map(n=>`「${PA.nmH({letter:n.letter,acc:0})}」は「${PA.nmH(n)}」`);
      const r=t.some(n=>n.raised&&n.acc!==0)?raiseTxt():'';
      return (s.length?`調号を見てみよう。${PA.keyName(key)}では${s.join('、')}になるよ。`:'')+r||base;
    }
    case 'step': return `となりの音ではなく、<b>ひとつとばし</b>でかさねよう。${base}`;
    case 'shift': return `はじまりの音がずれているよ。${c.deg+1}ばんめの「${PA.nmH(t[0])}」から始めよう。`;
    default: return base;
  }
}
function choose(i){
  const ok=!!Q.choices[i].ok;
  Q.chosen=i; Q.lastOk=ok; PA.answerFx(ok);
  if(Q.result===null) answered(ok); // スコアは1回目だけ
  PA.chord(chordTones(keyOfQ(Q.q),Q.q.chord).map(n=>n.midi));
}

/* ===== 🎤 ピアノでひいてこたえる ===== */
const micTargets=()=>chordTones(keyOfQ(Q.q),Q.q.chord).map(n=>PA.mod(n.midi,12));
const micStatus=()=>MIC.phase==='wait'?'マイクをじゅんびしているよ…':MIC.lstate==='listen'?'きいているよ…':MIC.verdict?'もういちどひいてね…':'ひいてね…';
function startMic(){ // タップの中でよぶ（iOS はタップの中でないと音のしくみがうごかない）
  if(!MIC_OK||Q.view!=='quiz'||Q.type!=='keys'||Q.checked) return;
  stopMic();
  PA.store.set('mic-intro',true);
  const qid=Q.qid;
  Object.assign(MIC,{phase:'wait',err:'',verdict:null,qid,lstate:'idle',quietUntil:0,needReset:false});
  MIC.L=new PA.mic.Listener({target:micTargets(),onVerdict:onMicVerdict,onState:s=>{MIC.lstate=s;const el=document.getElementById('micst');if(el) el.textContent=micStatus();}});
  PA.mic.start({
    onFrame:f=>{
      if(MIC.qid!==Q.qid||!MIC.L||(MIC.phase!=='on'&&MIC.phase!=='wait')) return;
      const bar=document.getElementById('micbar');
      if(bar) bar.style.width=Math.max(0,Math.min(100,(f.level+70)/60*100)).toFixed(0)+'%';
      // 画面のけんばんの音が鳴っているあいだはきかない（おわったら新しくひいた音だけ）
      if(Date.now()<MIC.quietUntil){MIC.needReset=true;return;}
      if(MIC.needReset){MIC.needReset=false;MIC.L.reset();}
      MIC.L.feed(f);
    },
    onError:msg=>{if(MIC.qid!==Q.qid) return;stopMic();MIC.phase='error';MIC.err=msg;MIC.qid=qid;render();}
  }).then(ok=>{if(ok&&MIC.phase==='wait'&&MIC.qid===Q.qid){MIC.phase='on';render();}});
  render();
}
function onMicVerdict(v){
  if(MIC.qid!==Q.qid||Q.view!=='quiz'||Q.type!=='keys'||Q.checked) return;
  if(v.ok){ // けんばんでただしくおさえたのとおなじ
    stopMic();
    Q.picked=new Set(chordTones(keyOfQ(Q.q),Q.q.chord).map(n=>n.midi)); Q.byMic=true;
    checkKeys(); save(); render(); showFeedback();
    return;
  }
  MIC.verdict={missing:v.missing.slice(),extra:v.extra.slice()}; // ×にはしない（マイクのききまちがいもあるので）。もういちどひける
  render();
}
// きこえなかった音・よぶんな音（こたえの音はそのつづりで、よぶんな音は調のつづりで）
function micMissHTML(key,t){
  const v=MIC.verdict; if(!v) return '';
  const nmPc=pc=>{const n=t.find(x=>PA.mod(x.midi,12)===pc);return PA.nmH(n||PA.spellMidi(60+pc,key));};
  const q=a=>a.map(pc=>`「${nmPc(pc)}」`).join('');
  const out=[];
  if(v.missing.length) out.push(`${q(v.missing)}がきこえないよ。`);
  if(v.extra.length) out.push(`${q(v.extra)}も鳴っているみたい。`);
  if(!out.length) out.push('きこえにくかったよ。');
  return `<p class="micv" role="alert">🤔 ${out.join('')}もういちどひいてね。</p>`;
}
function micHTML(key,t){
  if(!MIC_OK||Q.type!=='keys'||Q.checked) return '';
  if(MIC.phase==='intro') return `<div class="micbox" role="group" aria-labelledby="mic-h"><p id="mic-h" class="mict">🎤 マイクでピアノの音をきいてしらべるよ。音はこの端末の中だけでしらべて、どこにもおくらないよ。</p>
    <p class="note">録音はしないよ。「マイクを使ってもいい？」ときかれたら「許可」をおしてね。しずかな部屋で、端末をピアノの近く（譜面台など）におくと、よくきこえるよ。</p>
    <div class="row"><button class="btn primary small" data-act="micstart">${PA.icon('mic')}始める</button><button class="btn small" data-act="micoff">やめる</button></div></div>`;
  const on=MIC.phase==='on'||MIC.phase==='wait';
  let h=`<div class="row microw"><button class="btn small mic" data-act="mic" aria-pressed="${on}">${PA.icon('mic')}ピアノでひいてこたえる</button></div>`;
  if(MIC.phase==='error') h+=`<p class="msg" role="alert" style="margin-top:8px">${PA.esc(MIC.err)}</p>`;
  if(on) h+=`<div class="micbox"><div class="micmeter" aria-hidden="true"><i id="micbar"></i></div><p id="micst" class="mict" role="status">${micStatus()}</p>${micMissHTML(key,t)}
    <div class="row"><button class="btn small" data-act="micoff">${PA.icon('piano')}けんばんでこたえる</button></div></div>`;
  return h;
}

/* ===== 音階のかいだん（和音のしくみと同じ図。rootHint＝いちばん下の音のヒント） ===== */
function ladderSVG(key,o){
  const CW=58,G=5,CH=50,R=7,X0=8,BASE=220,N=14;
  const W=X0*2+N*(CW+G)-G, H=BASE+30, tones=o.tones||[], skips=o.skips||[];
  let s=`<svg viewBox="0 0 ${W} ${H}" class="ladder" role="img" aria-label="音階のかいだん">`;
  const dx=X0+7*(CW+G)-G/2, dTop=BASE-CH-7*R-56;
  s+=`<line x1="${dx}" y1="${dTop}" x2="${dx}" y2="${BASE+6}" stroke="#d9cfc2" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  s+=`<text x="${dx+6}" y="${dTop+12}" font-size="13" fill="#a99f93">ここから1オクターブ上 →</text>`;
  const pos=k=>({x:X0+k*(CW+G),y:BASE-CH-k*R});
  for(let k=0;k<N-1;k++){ // となりどうし（半音）の目印
    if(PA.at(key.scale,k+1).midi-PA.at(key.scale,k).midi===1){const p=pos(k);s+=`<rect x="${p.x+CW+G/2-2.5}" y="${p.y+CH-22}" width="5" height="20" rx="2.5" fill="#f4a100"/>`;}
  }
  for(let k=0;k<N;k++){
    const {x,y}=pos(k), n=PA.at(key.scale,k), d=k%7, isT=tones.includes(k), isRoot=o.rootHint===k;
    s+=`<rect x="${x}" y="${y}" width="${CW}" height="${CH}" rx="10" fill="${isT?o.color:'#fff'}" stroke="${isT?o.color:isRoot?'#f4a100':(d===0?'#bfb3a5':'#ddd2c4')}" stroke-width="${isRoot?4:2}"/>`;
    s+=`<text x="${x+CW/2}" y="${y+CH/2+6}" text-anchor="middle" font-size="${PA.nm(n).length>3?15:19}" font-weight="800" fill="${isT?'#fff':'#3a3245'}">${PA.Svg(PA.nm(n))}</text>`;
    if(n.raised) s+=`<text x="${x+CW/2}" y="${y+CH-4}" text-anchor="middle" font-size="11" font-weight="800" fill="${isT?'#fff':'#d1495b'}">半音上げ</text>`;
    const big=[0,3,4].includes(d);
    s+=`<text x="${x+CW/2}" y="${y+CH+19}" text-anchor="middle" font-size="${big?18:15}" font-weight="${big?800:400}" fill="${big?degColor(d):'#b0a597'}" opacity="${k<7?1:.55}">${ROM[d]}</text>`;
    if(skips.includes(k)) s+=`<text x="${x+CW/2}" y="${y-7}" text-anchor="middle" font-size="13" font-weight="700" fill="#a99f93">とばす</text>`;
    if(isRoot&&!isT) s+=`<text x="${x+CW/2}" y="${y-8}" text-anchor="middle" font-size="14" font-weight="800" fill="#c98500">ここから</text>`;
  }
  for(let i=1;i<tones.length;i++){
    const a=pos(tones[i-1]), b=pos(tones[i]), ax=a.x+CW/2, bx=b.x+CW/2, top=Math.min(a.y,b.y)-38;
    s+=`<path d="M${ax+6} ${a.y-2} Q${(ax+bx)/2} ${top} ${bx-6} ${b.y-2}" fill="none" stroke="${o.color}" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>`;
    s+=`<circle cx="${bx-6}" cy="${b.y-2}" r="3.5" fill="${o.color}"/>`;
  }
  return s+'</svg>';
}
// スマホ（375px）でかいだんを横スクロールするとき、見せたい音（和音 or いちばん下の音）がまん中にくるように
function ladderStart(kCenter){
  const W=8*2+14*63-5, cx=8+kCenter*63+29;
  return Math.max(0,Math.round((cx/W-0.26)*100))+'%';
}

/* ===== けんばんの印（sr＝読み上げで鍵の名前のあとにつけることば） ===== */
function kbMarks(key,t,col,done){
  const marks=new Map(), set=(m,o)=>marks.set(m,Object.assign(marks.get(m)||{},o));
  if(Q.hint>=1||done) for(let m=LO;m<=HI;m++){ // 音階のなんばんめ
    const i=key.scale.findIndex(s=>PA.mod(s.midi,12)===PA.mod(m,12));
    if(i>=0) set(m,{sub:ROM[i],subColor:degColor(i)});
  }
  if(Q.type!=='keys'){ t.forEach(n=>set(n.midi,{fill:col,tc:'#fff',label:PA.nm(n),focus:true,sr:'こたえの音'})); return marks; }
  if(!Q.checked){
    Q.picked.forEach(m=>set(m,{fill:isBlack(m)?'#e9a800':'#ffd66b',tc:'#3a3245',label:nameOf(m,key),sr:'選んだ'}));
    if(Q.hint>=2){ // いちばん下の音：どのオクターブでおさえていても OK
      const rpc=PA.mod(t[0].midi,12), hit=[...Q.picked].filter(m=>PA.mod(m,12)===rpc);
      if(hit.length) hit.forEach(m=>set(m,{ring:'#f4a100',sr:'選んだ・いちばん下の音'})); else set(t[0].midi,{ring:'#f4a100',tc:col,label:'ここ?',sr:'ヒント・いちばん下の音'});
    }
  }else{
    const ans=new Set(t.map(n=>PA.mod(n.midi,12))), pk=new Set([...Q.picked].map(m=>PA.mod(m,12)));
    Q.picked.forEach(m=>{const ok=ans.has(PA.mod(m,12));set(m,{fill:ok?'#22a06b':'#d1495b',tc:'#fff',label:(ok?'○':'×')+nameOf(m,key),focus:true,sr:ok?'選んだ・正解':'選んだ・まちがい'});});
    t.forEach(n=>{if(!pk.has(PA.mod(n.midi,12))) set(n.midi,{fill:isBlack(n.midi)?undefined:'#fff',ring:col,tc:col,label:PA.nm(n),focus:true,sr:'たりない音'});});
  }
  return marks;
}

/* ===== えらんでこたえるしゅるい（makeDrill）の画面 ===== */
// ならびの「？」：PA.prog のならび（右手3つ・左手1つ）と、それを鳴らす（つぎのもんだい・とめるで progTok がかわる）
const progData=()=>Q.dr&&Q.dr.cat==='prog'?PA.prog.buildT(PA.prog.keyFor(Q.q.minor,Q.q.keyIdx,Q.dr.t),Q.dr.t):null;
function stopProg(){progTok++;}
async function playProg(){
  const data=progData(); if(!data) return;
  PA.stopSound(); const my=++progTok;
  for(let i=0;i<data.length;i++){
    const last=i===data.length-1;
    PA.chord([...data[i].lh,...data[i].rh].map(n=>n.midi),{dur:last?2.6:1.15});
    if(last) return;
    await PA.sleep(1000); if(my!==progTok) return;
  }
}
const markGlyph=a=>a===2?'<span class="ds">x</span>':a===1?'♯':a===0?'♮':'♭';
const markWord=a=>a===2?'ダブルシャープ':a===1?'シャープ':a===0?'ナチュラル':'フラット';
const letterH=n=>PA.nmH({letter:n.letter,acc:0});
// 短調で7ばんめを上げる記号のわけ（短調クイズとおなじことば）
const ltWhy=key=>key.ltType===0?'調号の♭をとると半音上がるよ。':key.ltType===2?'調号でもう♯がついているので、もう1つ上げてダブルシャープ（<span class="ds">x</span>）。':'調号に何もついていない音なので、♯で上げるよ。';
const raiseTxt=key=>`短調のⅤ・Ⅴ7は、7ばんめ「${PA.nmH(key.natLT)}」を半音上げて「${PA.nmH(key.lt)}」にするよ。`;
const degNo=n=>n.deg||PA.mod(n.k,7)+1; // 音階のなんばんめ（1〜7）
// ボタンの中身
function optHTML(o){
  if(o.note) return PA.nmH(o.note);
  if(o.ch) return CHORDS[o.ch].label;
  if(o.inv!=null) return SHAPES[o.inv];
  return `${markGlyph(o.acc)}<span class="cn">${markWord(o.acc)}</span>`;
}
// パートごとのといかけ（カードの見出し）
function partAsk(dr,j){
  const key=keyOfQ(Q.q);
  switch(dr.cat){
    case 'root': return '音をえらぼう';
    case 'fill': return '□に入る音をえらぼう';
    case 'add7': return 'たす音をえらぼう';
    case 'staff': case 'prog': return '和音の名前をえらぼう';
    case 'inv': return j?`かたちはどれ？<small>いちばん下の音が根音なら基本形、第3音なら第1転回形、第5音なら第2転回形${dr.voice.length>3?'、第7音なら第3転回形':''}</small>`:'和音の名前をえらぼう';
    case 'mark': return '記号をえらぼう';
    case 'fix': {
      if(!j) return '1つだけまちがっている音はどれ？';
      const w=dr.written[dr.wrong];
      return w.acc?`「${PA.nmH(w)}」をただしくするには、「${letterH(w)}」にどの記号をつける？`:`「${letterH(w)}」には、どの記号をつける？`;
    }
    case 'lt': return j?`Ⅴ・Ⅴ7では、「${PA.nmH(key.natLT)}」を何にする？`:'7ばんめの音をえらぼう（調号どおり）';
  }
  return '';
}
// ヒーローの問題文（HTML）。hide＝こたえるまでは和音の色を出さない（色でこたえがわかるもの）
const hideCol=cat=>cat==='staff'||cat==='prog'||cat==='inv';
function drillTitle(key,c,col){
  const kn=`<span class="qkey">${PA.keyName(key)}</span>`, badge=(lab,cl)=>`<span class="badge sm" style="--c:${cl}">${lab}</span>`;
  switch(Q.dr.cat){
    case 'root': return `${kn}<span>の</span>${badge(c.label,col)}<span>は、どの音から？</span>`;
    case 'fill': return `${kn}<span>の</span><span class="tg">${badge(c.label,col)}<span>、□は？</span></span>`;
    case 'add7': return `${kn}<span>の</span>${badge('Ⅴ',PA.COL.V)}<span>に、どの音をたすと</span>${badge('Ⅴ7',PA.COL.V7)}<span>？</span>`;
    case 'staff': return `<span class="tg">${kn}<span>の、</span></span><span>この和音は？</span>`;
    case 'inv': return `<span class="tg">${kn}<span>の、</span></span><span>この和音は？かたちは？</span>`;
    case 'fix': return `${kn}<span>の</span>${badge(c.label,col)}<span>をかいたよ。1つだけまちがい！</span>`;
    case 'prog': return `${kn}<span>のならび。「？」の和音は？</span>`;
    case 'lt': return `${kn}<span>の7ばんめの音は？</span>`;
    case 'mark': return `${kn}<span>の</span><span class="tg">${badge(c.label,col)}<span>で、</span></span><span>「${letterH(key.natLT)}」につける記号は？</span>`;
  }
  return '';
}
// 問題文の下：音のならび（たりない音の□・Ⅴ＋□・記号の？）
function drillNotes(key,t,done){
  const dr=Q.dr;
  if(dr.cat==='fill') return t.map((n,i)=>i!==dr.blank?PA.nmH(n):done?`<b class="qans">${PA.nmH(n)}</b>`:'<span class="qblank" role="img" aria-label="たりない音">□</span>').join('・');
  if(dr.cat==='add7') return PA.namesH(t.slice(0,3))+'＋'+(done?`<b class="qans">${PA.nmH(t[3])}</b>`:'<span class="qblank" role="img" aria-label="たす音">□</span>');
  if(dr.cat==='mark') return t.map(n=>!n.raised?PA.nmH(n):done?`<b class="qans">${PA.nmH(n)}</b>`:`<b class="qans">${letterH(n)}？</b>`).join('・');
  return '';
}
// がくふの高さ：いちばん上が五線の上にとび出しすぎる和音は1オクターブ下に（加線を読みやすく）
const lowered=ns=>Math.max(...ns.map(n=>n.midi))>81?ns.map(n=>Object.assign({},n,{midi:n.midi-12})):ns;
// ヒーローのがくふ（調号つき）
function drillStaff(key,t0,col,done){
  const dr=Q.dr, ink='#3a3245', t=lowered(t0);
  if(dr.cat==='prog') return '';
  if(dr.cat==='staff'&&!done) return PA.staffSVG(key,[{notes:t,color:ink,accColor:ink}],{maxScale:1.3});
  if(dr.cat==='inv') return PA.staffSVG(key,[done?{notes:dr.voice,color:col,ltColor:'#d1495b',accColor:'#d1495b',label:CHORDS[Q.q.chord].label,sub:SHAPES[dr.inv],labelColor:col}:{notes:dr.voice,color:ink,accColor:ink}],{maxScale:1.3});
  if(dr.cat==='mark'&&!done) return PA.staffSVG(key,[{notes:t.map(n=>n.raised?respell(n,key.sig[n.letter]):n),color:ink,accColor:ink}],{maxScale:1.3});
  return PA.staffSVG(key,[{notes:done?t:[],color:col,ltColor:'#d1495b',accColor:'#d1495b'}],{maxScale:1.3});
}
// ならびのがくふ（大譜表。「？」の列はうすい黄色）
function progHTML(key,done){
  const data=progData(); if(!data) return '';
  const dr=Q.dr, ink='#3a3245', pk=PA.prog.keyFor(Q.q.minor,Q.q.keyIdx,dr.t);
  const cols=data.map((c,i)=>{
    const ask=i===dr.i, hid=ask&&!done;
    return {notes:c.rh,lh:c.lh,color:hid?ink:PA.COL[c.ch],accColor:hid?ink:'#d1495b',label:hid?'？':c.label,labelColor:hid?ink:PA.COL[c.ch],hl:ask?'#fff3c4':null};
  });
  const ns=PA.sigInfo(pk).letters.length, W=50+ns*10+(ns?24:14)+data.length*66+8;
  return `<section class="card"><h2>🎼 ならび<small>うすい黄色が「？」のところ。下の「ならびを聴く」で聴けるよ</small></h2>`
    +`<div class="scroll" data-sk="prog"><div style="min-width:${Math.round(W*0.64)}px">${PA.staffSVG(pk,cols,{grand:true,colW:66})}</div></div></section>`;
}
// こたえ（HTML）
function drillAnswer(key,c,t){
  const dr=Q.dr, kn=PA.keyName(key), lab=c.label, ns=PA.namesH(t);
  switch(dr.cat){
    case 'root': return `${kn}の${lab}は<b>「${PA.nmH(t[0])}」</b>から。音階の${c.deg+1}ばんめの音だよ（${lab}＝${ns}）。`;
    case 'fill': return `□は<b>「${PA.nmH(t[dr.blank])}」</b>。${kn}の${lab}は${ns}。`;
    case 'add7': return `Ⅴに<b>「${PA.nmH(t[3])}」</b>をたすとⅤ7（${ns}）。Ⅴのいちばん上「${PA.nmH(t[2])}」から、ひとつとばしでもう1つ。`;
    case 'staff': return `この和音は<b>${lab}</b>（${ns}）。いちばん下の「${PA.nmH(t[0])}」が音階の${c.deg+1}ばんめだから${lab}。`;
    case 'inv': return `この和音は<b>${lab}の${SHAPES[dr.inv]}</b>。音をひとつとばしにならべると${ns}で、根音は「${PA.nmH(t[0])}」（音階の${c.deg+1}ばんめ）。いちばん下の「${PA.nmH(dr.voice[0])}」は${ROLES[dr.inv]}だから${SHAPES[dr.inv]}。`;
    case 'prog': return `「？」は<b>${lab}</b>（${ns}）。いちばん下の音（根音）「${PA.nmH(t[0])}」が音階の${c.deg+1}ばんめだから${lab}。`;
    case 'fix': return `まちがいは<b>「${PA.nmH(dr.written[dr.wrong])}」</b>。ただしくは「${PA.nmH(t[dr.wrong])}」で、${lab}は${ns}。`;
    case 'lt': return `${kn}の7ばんめは「${PA.nmH(key.natLT)}」。Ⅴ・Ⅴ7では半音上げて<b>「${PA.nmH(key.lt)}」</b>にするよ。`;
    case 'mark': return `「${letterH(key.natLT)}」に<b>${markGlyph(key.ltType)}</b>（${markWord(key.ltType)}）をつけるよ${key.ltType?`。「${PA.nmH(key.lt)}」になる`:''}。${ltWhy(key)}`;
  }
  return '';
}
// まちがえたわけ（えらんだボタン o・パート j）
function drillWhy(key,c,t,j,o){
  const dr=Q.dr, kn=PA.keyName(key), lab=c.label;
  if(o.ch&&!o.note){ // 和音の名前をえらんだ
    const p=CHORDS[o.ch];
    if(p.deg===c.deg){
      // ならびの「？」は、どの和音も4つの音（右手3つ＋左手1つ）でかくので、数ではなく Ⅴ7 でたす音で見わける
      if(dr.cat==='prog'){const s7=PA.nmH(chordTones(key,'V7')[3]);return `Ⅴ7は、Ⅴに「${s7}」をたした和音。「？」の和音に「${s7}」があるか見てみよう。`;}
      return `音の数を見てみよう。Ⅴは3つ、Ⅴ7は4つの音だよ（いまは${t.length}つ）。`;
    }
    // 転回形では、いちばん下の音が根音とはかぎらない
    if(dr.cat==='inv') return (dr.inv?'いちばん下の音が根音とはかぎらないよ。音をひとつとばしにならべなおして、根音（ならべなおしたときのいちばん下の音）を見つけよう。':'この和音は基本形なので、いちばん下の音が根音だよ。')+`${p.label}なら根音は「${PA.nmH(PA.at(key.scale,p.deg))}」。`;
    return `いちばん下の音で見わけよう。${p.label}なら、音階の${p.deg+1}ばんめ「${PA.nmH(PA.at(key.scale,p.deg))}」からだよ。`;
  }
  if(o.inv!=null) return `いちばん下の「${PA.nmH(dr.voice[0])}」は、${lab}の${ROLES[dr.inv]}だよ。${SHAPES[o.inv]}なら、いちばん下は${ROLES[o.inv]}「${PA.nmH(t[o.inv])}」。`;
  if(dr.cat==='mark'){
    const nl=key.natLT, d=o.acc-(key.sig[nl.letter]||0), cn=PA.nmH({letter:nl.letter,acc:o.acc});
    return (d>=2?`「${cn}」だと主音「${PA.nmH(key.nat[0])}」と同じ高さ（かそれより上）になっちゃう。上げるのは、すぐ上のけんばんまで。`
      :d===0?`その記号だと「${PA.nmH(nl)}」のまま。上がらないよ。`:`それだと「${cn}」で下がっちゃう。`);
  }
  if(dr.cat==='fix'){
    const w=dr.written[dr.wrong];
    if(j) return `「${letterH(w)}」に${markGlyph(o.acc)}をつけると「${PA.nmH({letter:w.letter,acc:o.acc})}」になっちゃう。`+(dr.kind==='raise'?raiseTxt(key)+ltWhy(key):`調号を見てみよう。${kn}では「${letterH(w)}」は「${PA.nmH(t[dr.wrong])}」になるよ。`);
    return `「${PA.nmH(o.note)}」は合っているよ。`+(dr.kind==='sig'?'調号をわすれた音があるよ。':dr.kind==='raise'?'7ばんめを上げわすれた音があるよ。':'ひとつとばしになっていない音があるよ。');
  }
  const n=o.note;
  switch(o.kind){
    case 'sig': return `調号を見てみよう。${kn}では「${PA.nmH(n)}」は「${PA.nmH(respell(n,key.sig[n.letter]||0))}」になるよ。`;
    case 'raise': return raiseTxt(key);
    case 'shift': return dr.cat==='root'?`それは音階の${degNo(n)}ばんめの音。${lab}は${c.deg+1}ばんめの音からだよ。`
      :dr.cat==='lt'?`それは${degNo(n)}ばんめの音。7ばんめは、主音のすぐ下の音だよ。`:'となりの音だよ。和音は、音階の音をひとつとばしでかさねるよ。';
    case 'chord': return `それは${CHORDS[o.ch].label}のはじまりの音だよ。${lab}は音階の${c.deg+1}ばんめから。`;
    case 'acc': {
      const a=dr.cat==='fill'?t[dr.blank]:t[3];
      return a.raised?raiseTxt(key):`${kn}の音階では「${PA.nmH(a)}」。調号にない♯・♭は、つけないよ。`;
    }
    case 'oct': return `「${PA.nmH(n)}」は、はじまりの音とおなじ音。Ⅴ7は、Ⅴのいちばん上「${PA.nmH(t[2])}」から、ひとつとばしでもう1つ。`;
    case 'tonic': return `「${PA.nmH(n)}」は主音（1ばんめ）。7ばんめは、主音のすぐ下の音だよ。`;
    case 'keep': return `そのままでは、上げていないよ。短調のⅤ・Ⅴ7では、7ばんめを半音上げて、主音のすぐ下（となり）にするよ。`;
    case 'over': return `「${PA.nmH(n)}」は主音。上げるのは、すぐ上のけんばんまでだよ。`;
    case 'down': return 'それだと下がっちゃう。7ばんめは上げるよ。';
  }
  return '';
}
// こたえあわせのメッセージ（とちゅう＝1つめのパートだけあっている）
function drillFb(key,c,t){
  const dr=Q.dr, pk=Q.dpick;
  if(!pk.length) return '';
  if(!drillDone(dr,pk)){
    if(dr.cat==='fix') return `⭕ そう！まちがいは「${PA.nmH(dr.written[dr.wrong])}」。つぎは、なおしかた。`;
    if(dr.cat==='lt') return `⭕ そう！7ばんめは「${PA.nmH(key.natLT)}」。`;
    if(dr.cat==='inv') return `⭕ そう！${c.label}。つぎは、かたち。`;
    return '⭕ そう！';
  }
  if(drillOk(dr,pk)) return `🎉 正解！${drillAnswer(key,c,t)}`+(Q.wasHint?`<br><small>💡 ヒントを見てできたね。次は見ないでやってみよう</small>`:'');
  const j=pk.findIndex((p,i)=>!dr.parts[i].opts[p].ok), o=dr.parts[j].opts[pk[j]];
  return `🤔 おしい！${drillAnswer(key,c,t)}<br>${drillWhy(key,c,t,j,o)}`;
}
// えらぶボタン（パートごと。こたえたパートはうごかない）
function drillParts(){
  const dr=Q.dr, done=drillDone(dr,Q.dpick), cur=Q.dpick.length;
  return dr.parts.map((p,j)=>{
    if(j>cur||(j===cur&&done)) return '';
    const picked=Q.dpick[j], answered=picked!=null, cls=j===cur?' cur':'';
    return `<section class="card dpart${cls}"><h2>${partAsk(dr,j)}</h2><div class="choices two">`+p.opts.map((o,i)=>{
      let c='';
      if(answered){if(o.ok&&(done||i===picked)) c='right'; else if(i===picked) c='wrong';}
      return `<button class="choice ${c}" data-act="qdpick" data-p="${j}" data-v="${i}" ${answered?'disabled':''}>${c==='right'?'⭕ ':c==='wrong'?'❌ ':''}${optHTML(o)}</button>`;
    }).join('')+`</div></section>`;
  }).join('');
}
function drillChoose(j,i){
  const dr=Q.dr; if(!dr||j!==Q.dpick.length||drillDone(dr,Q.dpick)||!dr.parts[j]||!dr.parts[j].opts[i]) return false;
  Q.dpick=Q.dpick.concat([i]);
  const done=drillDone(dr,Q.dpick);
  if(!done) return true; // 1つめがあっていた：2つめへ（音は出さない）
  const ok=drillOk(dr,Q.dpick);
  Q.lastOk=ok; PA.answerFx(ok);
  if(Q.result===null) answered(ok);
  if(dr.cat==='prog') playProg(); else PA.chord(quizMidis());
  return true;
}

function drillHint(key,c){
  switch(Q.dr.cat){
    case 'root': return `${PA.keyName(key)}の音階を出したよ。${c.label}は<b>${c.deg+1}ばんめ</b>の音から。`;
    case 'lt': return `7ばんめは、主音「${PA.nmH(key.nat[0])}」のすぐ下の音。調号を見てね。`;
    case 'mark': return '調号の♭がついた音は♮で、何もついていない音は♯で、調号の♯がついた音はダブルシャープ（<span class="ds">x</span>）で上げるよ。';
    case 'staff': case 'prog': return `${PA.keyName(key)}の音階を出したよ。いちばん下の音が、音階のなんばんめか見てみよう。`;
    case 'inv': return `${PA.keyName(key)}の音階を出したよ。転回形では、いちばん下の音が根音とはかぎらない。音を「ひとつとばし」にならべなおすと、根音（はじまりの音）がわかるよ。`;
    default: return `${PA.keyName(key)}の音階を出したよ。和音は、音階の音をひとつとばしでかさねるよ。`;
  }
}

    if(done) h+=`<section class="card"><h2>🎹 こたえのけんばん<small>${PA.keyName(key)}の${c.label}。下のローマ数字は音階のなんばんめ</small></h2><div class="scroll" data-sk="kb">${PA.kbSVG(LO,HI,kbMarks(key,Q.dr.cat==='inv'?Q.dr.voice:t,col,done))}</div></section>`;
  }else{
    h+=`<section class="card hero" style="--c:${col}">
      <div class="score">${scoreText(Q)} <span>れんぞく${Q.streak}</span> ${sessHead()}</div>
      <div class="qwrap"><div class="qtext">
        <div class="qtitle"><span class="qkey">${PA.keyName(key)}</span><span>の</span><span class="badge sm" style="--c:${col}">${c.label}</span><span>は？</span></div>
        <div class="qsub">${PA.sigLabel(key)}・${c.n}つの音</div></div>
        <div class="qstaff">${PA.staffSVG(key,[{notes:done?t:[],color:col,ltColor:'#d1495b',accColor:'#d1495b'}],{maxScale:1.3})}</div>
      </div>${now}</section>`;
    const msg=fbHTML(key,c,t);
    const fb=msg?`<div class="fb ${Q.lastOk?'good':'bad'}" id="fb" role="status">${msg}</div>`
      :Q.hint>=1?`<div class="msg" role="status">💡 ヒント${Q.hint}：${Q.hint===1?`${PA.keyName(key)}の音階を出したよ。${c.label}は<b>${c.deg+1}ばんめ</b>の音から。`:`いちばん下の音は<b>「${PA.nmH(t[0])}」</b>。そこから、ひとつとばし！`}</div>`:'';
    const explain=`<div class="row center"><button class="btn small" data-act="qexplain">🐸 つくりかたを見る</button></div>`+(done||Q.result!==null?'':PA.once('hint-rule',`<p class="qsub" style="text-align:center;margin:0">💡 ${PA.esc(PA.HINT_NOTE)}</p>`));
    const kb=`<div class="scroll" data-sk="kb">${PA.kbSVG(LO,HI,kbMarks(key,t,col,done))}</div>`;
    if(Q.type==='keys'){
      const names=[...Q.picked].sort((a,b)=>a-b).map(m=>PA.H(nameOf(m,key)));
      h+=`<section class="card"><h2>🎹 和音をおさえよう<small>${Q.checked?'緑の○＝あたり・赤の×＝ちがう音・わくだけ＝たりない音':`<b>${c.n}つ</b>の音をタップ・どのオクターブでも OK`}</small></h2>
        ${kb}<div class="picked">おさえた音：<b>${names.length?names.join('・'):'まだなし'}</b>${Q.checked?'':PA.once('tap-erase','<small>もういちどタップするとけせるよ</small>')}</div>${!Q.checked&&PA.midi.active()?PA.once('midi-answer','<p class="note" style="margin:6px 0 0">🎹 つないだ電子ピアノでひいても、こたえられるよ（和音をいっしょにおさえてね）</p>'):''}${micHTML(key,t)}</section>${fb}${explain}`;
    }else{
      h+=`<section class="card"><h2>✋ どれかな？<small>${c.n}つの音のくみあわせを選ぼう</small></h2><div class="choices">`+Q.choices.map((ch,i)=>{
        let cls='';
        if(Q.chosen!=null){if(ch.ok)cls='right';else if(i===Q.chosen)cls='wrong';}
        return `<button class="choice ${cls}" data-act="qchoose" data-v="${i}" ${Q.chosen!=null?'disabled':''}>${cls==='right'?'⭕ ':cls==='wrong'?'❌ ':''}${PA.namesH(ch.notes)}</button>`;
      }).join('')+`</div></section>${fb}${explain}`;
      if(done) h+=`<section class="card"><h2>🎹 こたえのけんばん<small>下のローマ数字は音階のなんばんめ</small></h2>${kb}</section>`;
    }
  }
  // 音階のかいだん：ヒント・こたえたあと（7ばんめ・記号のヒントでは出さない。上げた音が見えてしまうので）
  if(done||(Q.hint>=1&&!(drill&&(Q.dr.cat==='lt'||Q.dr.cat==='mark')))){
    const lad=done?{tones:t.map(n=>n.k),skips:skipsOf(q.chord),color:col}:{tones:[],color:col,rootHint:Q.hint>=2?c.deg:null};
    h+=`<section class="card"><h2>🪜 音階のかいだん<small>下のローマ数字は「音階のなんばんめ」。オレンジの印＝となりどうし（半音）</small></h2><div class="scroll" data-sk="ladder" data-start="${ladderStart(done?c.deg+c.n-1:c.deg)}">${ladderSVG(key,lad)}</div></section>`;
  }
  h+=settingsHTML()+checkHTML()+tipsHTML()+`</div>`;
  PA.paint(document.getElementById('view'),h,Q.qid+':'+Q.type+':'+(done?1:0)+':'+Q.dpick.length);
  renderActions(done);
}
function renderActions(done){
  const drill=isDrill(Q.type)&&!!Q.dr, prog=drill&&Q.dr.cat==='prog';
  const hint=`<button class="btn" data-act="qhint" ${Q.hint>=(drill?1:2)?'disabled':''}>${PA.icon('hint')}${Q.hint&&!drill?'ヒント2':'ヒント'}</button>`;
  const listen=prog?`<button class="btn" data-act="qprog" data-hot="listen">${PA.icon('listen')}ならびを聴く</button>`:`<button class="btn" data-act="qplay" data-hot="listen">${PA.icon('listen')}こたえを聴く</button>`;
  const next=sess&&sess.finished()?'🎉 けっかを見る':null;
  let a;
  if(Q.type==='keys'&&!Q.checked) a=`<button class="btn ok" data-act="qcheck" data-hot="check" ${Q.picked.size?'':'disabled'}>${PA.icon('check')}こたえあわせ</button><button class="btn" data-act="qclear" ${Q.picked.size?'':'disabled'}>${PA.icon('erase')}けす</button>${hint}`;
  else if(!done) a=hint+(prog?listen:'');
  else if(Q.type==='keys'&&!Q.lastOk) a=`<button class="btn primary" data-act="qnext" data-hot="next">${next||PA.icon('next')+'次へ'}</button><button class="btn" data-act="qretry">${PA.icon('retry')}もういちど</button>${listen}`;
  else a=`<button class="btn primary" data-act="qnext" data-hot="next">${next||PA.icon('next')+'次の問題'}</button>${listen}`;
  if(a!==lastActions){PA.paint(document.getElementById('actions'),a,'bar');lastActions=a;}
}
function showFeedback(){
  const el=document.getElementById('fb')||document.querySelector('#view .dpart.cur');
  if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest',behavior:PA.reduceMotion()?'auto':'smooth'});
}
// 「この調だけ」をやめる（その回のれんしゅうもおわり）
function clearOnly(){
  if(!Q.only) return;
  Q.only=null; Q.onlyBy=null;
  if(sess&&sess.active()) sess.clear();
}
// せっていがかわって今のもんだいが出ないものになったら、つぎのもんだいへ
function ensureQuestion(){if(!Q.q||isDone()||!inPool(Q.q)) newQuestion();}
// れんしゅうの回をはじめるとき：もうかぞえたもんだい（×のあと「もういちど」のとちゅう）は回に入らないので新しいもんだいに
function freshQuestion(){if(Q.result!==null) newQuestion(); else ensureQuestion();}
// リンク・ステップのせってい（RUN）をおわりにして、生徒がじぶんでえらんだせってい（BASE）にもどす
function endRun(){
  if(!RUN) return;
  RUN=null;
  Object.assign(Q,settingsOf(BASE));
  if(Q.onlyBy==='link'){Q.only=null;Q.onlyBy=null;}
  fitKeyset(); switchQuiz();
  try{history.replaceState({cqLink:null},'',location.href);}catch(e){}
}
// ステップをはじめる（そのステップのせっていで5もん。おなじステップのとちゅうならつづき）
function startStep(s){
  if(!s) return;
  stopMic(); stopProg(); PA.stopSound();
  if(Q.onlyBy==='pick'&&sess&&sess.active()) sess.clear(); // チェック表の3もんはおしまい
  Q.only=null; Q.onlyBy=null;
  RUN=stepRun(s);
  Object.assign(Q,settingsOf(RUN)); fitKeyset(); switchQuiz();
  if(isTimed(Q.type)){sess=PA.session(quizOf(Q.type));stopChroma();} // ⏱ は5もんの回ではなく、スタートをおしてはかる
  else{
    sess=PA.session(quizOf(Q.type),{n:STEP_N,sig:RUN.sig});
    if(sess.finished()) sess.start(STEP_N); // おわったばかりの回ではなく、新しい5もん
  }
  try{history.replaceState({cqLink:RUN.id},'',location.href);}catch(e){}
  Q.view='quiz'; Q.stepsKs=s.ks; newQuestion();
}

/* ===== ⏱ 12の調をじゅんばんに（画面） =====
 * CR.phase：idle（スタートまえ）・run（はかっている）・done（おわり）。run＝chromaNew。picked＝画面のけんばんでおさえた音、
 * wrong＝まちがえたときのようす（つぎにおすまで出す）、stale＝電子ピアノでまえの和音からおさえたままの音、tok＝はかっている回（かわったらタイマーをとめる）
 * きろく：PA.store 'chord-quiz-chromatic'（chromaRec）、調ごとに keystats-chord-quiz-chromatic（その調を1つもまちがえずにひけたら ○）、
 *   ステップのときは 'chord-quiz-steps' に STEP_N（12の調をさいごまでひけたら ✓） */
const CR={phase:'idle',run:null,picked:new Set(),wrong:null,stale:[],tok:0,heldSig:'',result:null,left:false};
// left＝とちゅうで画面をはなれたので、はかるのをやめた（スタートのカードに出す。つぎにスタートしたらけす）
const CR_KEY='chord-quiz-chromatic';
const crRec=()=>chromaRec(PA.store.get(CR_KEY,null));
const crMode=()=>{const s=curStep();return s?s.ks:Q.keyset==='minor'?'minor':'major';};
const crKey=cur=>PA.keyOf(cur.minor,cur.keyIdx,60);
const afterPaint=f=>{if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>requestAnimationFrame(f)); else setTimeout(f,32);};
function stopChroma(){CR.tok++;CR.phase='idle';CR.run=null;CR.picked=new Set();CR.wrong=null;CR.result=null;}
function startChroma(){
  stopChroma(); PA.stopSound();
  const my=CR.tok;
  CR.run=chromaNew(crMode(),crRec().gb); CR.phase='run'; CR.stale=PA.midi.active()?[...PA.midi.held()]:[]; CR.heldSig=''; CR.left=false;
  render();
  // フォーカスはひくけんばんへ（スタートのボタンは「さいしょから」に入れかわるので、そこにのこさない）
  const k=document.querySelector('#view [data-sk="kb"] [data-m][tabindex="0"]'); if(k&&k.focus) k.focus({preventScroll:true});
  // 1つめの和音が画面に出てから、時間をはかりはじめる（描いたあとのつぎのコマ）
  afterPaint(()=>{if(my!==CR.tok||CR.phase!=='run') return;if(CR.run.startAt==null) CR.run.startAt=Date.now();crTick(my);});
}
// 時計の字をかえる（0.1秒ごと）。電子ピアノは、はなした音もここでたしかめる（はなしただけでは知らせがこないので）
function crTick(my){
  if(my!==CR.tok||CR.phase!=='run') return;
  const el=document.getElementById('crtime'); if(el) el.textContent=chromaClock(chromaElapsed(CR.run,Date.now()));
  if(PA.midi.active()){
    const held=[...PA.midi.held()].sort((a,b)=>a-b), sig=held.join(',');
    CR.stale=CR.stale.filter(m=>held.indexOf(m)>=0);
    if(sig!==CR.heldSig){
      CR.heldSig=sig;
      const cur=chromaNow(CR.run);
      if(cur&&held.length){const use=chromaMidiPick(crKey(cur),cur.chord,held,CR.stale);if(use&&chromaJudge(crKey(cur),cur.chord,use).ok){crAnswer(use,true);render();}}
    }
  }
  setTimeout(()=>crTick(my),100);
}
// 答える（ms＝おさえた音）。fromMidi＝電子ピアノ（おさえたままの音をおぼえる）
function crAnswer(ms,fromMidi){
  const r=CR.run; if(CR.phase!=='run'||!r) return 'idle';
  const res=chromaAnswer(r,ms,Date.now());
  if(res.v==='miss'){CR.wrong={ms:ms.slice(),j:res.j};PA.answerFx(false);}
  if(res.v!=='ok') return res.v;
  PA.answerFx(true);
  CR.picked=new Set(); CR.wrong=null; CR.stale=fromMidi?ms.slice():[];
  if(res.keyDone) deck.record(res.keyDone.id,res.keyDone.ok);
  if(res.finished) finishChroma();
  return 'ok';
}
function finishChroma(){
  const r=CR.run, ms=chromaElapsed(r,Date.now()), rec=crRec(), prev=rec.best[r.mode]||null;
  const best=chromaBest(rec,r.mode,ms,r.misses,Date.now());
  if(best) PA.store.set(CR_KEY,rec);
  const s=curStep();
  if(s&&s.cat==='chromatic'&&s.ks===r.mode){const sr=stepRec();if(sr[stepKey(s)]!==STEP_N){sr[stepKey(s)]=STEP_N;PA.store.set('chord-quiz-steps',sr);}}
  CR.phase='done'; CR.tok++; CR.result={ms,misses:r.misses,best,prev,mode:r.mode,gb:r.gb,step:s&&s.cat==='chromatic'?s:null,at:Date.now()};
  PA.announce(`ぜんぶおわり！${chromaClock(ms)}`);
}
// まちがえたわけ（みじかく）
function crWrongHTML(key,ch,j){
  const t=chordTones(key,ch);
  if(j.notesOk) return `音はあっているよ。基本形は、いちばん下を根音「${PA.nmH(t[0])}」にしてね。`;
  const out=[];
  if(j.extra.length) out.push(j.extra.map(pc=>`「${PA.nmH(PA.spellMidi(60+pc,key))}」`).join('')+'はちがう音。');
  if(j.missing.length) out.push(j.missing.map(n=>`「${PA.nmH(n)}」`).join('')+'がたりないよ。');
  return out.join('');
}
// 12の調のならび（いまの調・おわった調）
function crKeysHTML(ids,ki){
  return `<ol class="crkeys" aria-label="調のじゅん">`+ids.map((id,i)=>{const cl=i<ki?'done':i===ki?'cur':'';
    return `<li class="${cl}">${i<ki?'<span aria-hidden="true">✓</span>':''}${keyNameOfId(id)}${i===ki?'<span class="pa-sr">（いまここ）</span>':''}</li>`;}).join('')+`</ol>`;
}
const crBestText=b=>b?`${chromaClock(b.ms)}（まちがい${b.misses}）`:'まだなし';
function renderChroma(){
  stopMic(); stopProg();
  const rec=crRec(), mode=crMode(), st=curStep(), ph=CR.phase, r=CR.run;
  let h=`<div class="stack">${catRowHTML()}`;
  if(ph==='run'&&r){
    const cur=chromaNow(r), key=crKey(cur), c=CHORDS[cur.chord], col=PA.COL[cur.chord];
    h+=`<section class="card hero crhero" style="--c:${col}">
      <p class="crtime" id="crtime" role="timer" aria-label="かかった時間">${chromaClock(chromaElapsed(r,Date.now()))}</p>
      <div class="crnow" role="status"><span class="crn">${cur.n}／${cur.of}</span><span class="qkey">${PA.keyName(key)}</span><span>の</span><span class="badge sm" style="--c:${col}">${c.label}</span></div>
      <div class="crdots" aria-hidden="true">${CHROMA_CHORDS.map((x,i)=>`<span class="${i<r.ci?'ok':i===r.ci?'cur':''}" style="--c:${PA.COL[x]}">${CHORDS[x].label}</span>`).join('')}</div>
      <p class="qsub" style="text-align:center">${PA.sigLabel(key)}・基本形（いちばん下が根音）</p>
      ${crKeysHTML(r.ids,r.ki)}</section>`;
    const msg=CR.wrong?`<div class="fb bad" id="fb" role="alert"><span aria-hidden="true">❌</span>${crWrongHTML(key,cur.chord,CR.wrong.j)}もういちど！</div>`:'';
    const marks=new Map(), t=chordTones(key,cur.chord), ans=new Set(t.map(pcOf));
    if(CR.wrong){
      const low=CR.wrong.j.low;
      [...CR.picked].forEach(m=>{const ok=ans.has(PA.mod(m,12));marks.set(m,{fill:ok?'#22a06b':'#d1495b',tc:'#fff',label:(ok?'○':'×')+nameOf(m,key),ring:m===low&&!CR.wrong.j.rootOk?'#f4a100':undefined,sr:ok?'選んだ・あっている音':'選んだ・ちがう音'});});
    }else CR.picked.forEach(m=>marks.set(m,{fill:isBlack(m)?'#e9a800':'#ffd66b',tc:'#3a3245',label:nameOf(m,key),sr:'選んだ'}));
    h+=msg+`<section class="card"><h2><span aria-hidden="true">🎹</span>ひこう<small>${PA.midi.active()?'つないだ電子ピアノでひいてね（画面のけんばんでも OK）':'けんばんをタップ。音がそろうと、すぐしらべるよ'}</small></h2>
      <div class="scroll" data-sk="kb">${PA.kbSVG(LO,HI,marks)}</div></section>`;
  }else if(ph==='done'&&CR.result){
    const R=CR.result, b=rec.best[R.mode];
    h+=`<section class="card hero crhero good" style="--c:#15804f">
      <h2><span aria-hidden="true">🎉</span>12の調、ぜんぶおわり！</h2>
      <p class="crtime">${chromaClock(R.ms)}</p>
      <p class="crres">${R.best?'<b><span aria-hidden="true">🏆</span>じぶんのベスト！</b>':`じぶんのベスト：${crBestText(b)}`}　まちがい${R.misses}回</p>
      ${R.step?`<p class="dok"><span aria-hidden="true">✓</span>ステップ${R.step.n}「${catOf('chromatic').name}」クリア！</p>`:''}
      <details class="sess-teacher" data-d="cr-teacher"><summary><span aria-hidden="true">👩‍🏫</span>先生に見せる</summary><dl>
        <dt>れんしゅう</dt><dd>和音クイズ・12の調をじゅんばんに（${KS_NAME[R.mode]}${R.mode==='major'?`・${R.gb?'変ト長調':'嬰ヘ長調'}`:''}）</dd>
        <dt>時間</dt><dd>${chromaClock(R.ms)}（まちがい${R.misses}回）</dd>
        <dt>日づけ</dt><dd>${PA.esc(new Date(R.at).toLocaleString('ja-JP'))}</dd></dl>
        <div class="row">${PA.shareHTML('chord-quiz',{cat:'chromatic',keyset:R.mode},PA.icon('link')+'同じれんしゅうのリンク')}</div></details>
    </section>`;
  }else{
    const ids=chromaIds(mode,rec.gb);
    h+=`<section class="card hero crhero" style="--c:${PA.COL.V7}">
      <h2><span aria-hidden="true">⏱</span> 12の調をじゅんばんに<small>ハ${mode==='minor'?'短調':'長調'}から、半音ずつ上の調へ。それぞれの調でⅠ→Ⅳ→Ⅴ→Ⅴ7をひこう</small></h2>
      <ul class="tips crrule"><li><b>基本形</b>でひく：いちばん下の音を<b>根音</b>（和音のはじまりの音）にする。</li><li>上の音のならべかた・オクターブは、どれでもOK。</li><li>まちがえたら、おなじ和音をもういちど。スタートをおすと、時間をはかりはじめるよ。</li></ul>
      ${st?`<p class="note"><span aria-hidden="true">📋</span>ステップ${st.n}（${KS_NAME[st.ks]}）：12の調をさいごまでひけたら ✓</p>`:`<div class="opt"><span class="lab">調</span>${PA.seg('crmode',[['major','<span aria-hidden="true">☀️</span> 長調'],['minor','<span aria-hidden="true">🌙</span> 短調']],mode,'full')}</div>`}
      ${mode==='major'?`<div class="opt"><span class="lab">ファ♯・ソ♭の調</span>${PA.seg('crgb',[['fs','嬰ヘ長調'],['gb','変ト長調']],rec.gb?'gb':'fs','full')}<small>どちらも調号は6つ</small></div>`:''}
      ${crKeysHTML(ids,-1)}
      ${CR.left?'<p class="note" role="status">とちゅうで画面をはなれたので、はかるのをやめたよ。もういちどスタートしてね。</p>':''}
      <p class="crres">じぶんのベスト（${KS_NAME[mode]}）：<b>${crBestText(rec.best[mode])}</b></p>
      ${PA.midi.active()?'<p class="note"><span aria-hidden="true">🎹</span>つないだ電子ピアノでひけるよ</p>':''}</section>`;
  }
  h+=`</div>`;
  PA.paint(document.getElementById('view'),h,'cr:'+ph+':'+(r?r.ki+'.'+r.ci:''));
  crActions();
}
function crActions(){
  let a;
  if(CR.phase==='run') a=`<button class="btn" data-act="crclear" ${CR.picked.size?'':'disabled'}>${PA.icon('erase')}けす</button><button class="btn" data-act="crrestart" data-confirm="もう1回おす">${PA.icon('retry')}さいしょから</button><button class="btn" data-act="crstop">やめる</button>`;
  else if(CR.phase==='done') a=`<button class="btn primary" data-act="crstart" data-hot="next">${PA.icon('retry')}もういちど</button>`+(CR.result&&CR.result.step?`<button class="btn" data-act="steps">📋 ステップのいちらん</button>`:`<button class="btn" data-act="crstop">もどる</button>`);
  else a=`<button class="btn primary" data-act="crstart" data-hot="check"><span aria-hidden="true">⏱</span>スタート</button>`;
  if(a!==lastActions){PA.paint(document.getElementById('actions'),a,'bar');lastActions=a;}
}
// 電子ピアノの和音
function crMidi(ms){
  if(CR.phase!=='run') return;
  const cur=chromaNow(CR.run); if(!cur) return;
  const fold=m=>{while(m<LO)m+=12;while(m>HI)m-=12;return m;};
  CR.wrong=null; CR.picked=new Set(ms.map(fold)); CR.heldSig=ms.join(',');
  const use=chromaMidiPick(crKey(cur),cur.chord,ms,CR.stale);
  if(use&&crAnswer(use,true)==='miss') CR.picked=new Set(use.map(fold));
  render();
}
// 画面のけんばん（音のなまえが和音の数そろったら、すぐしらべる）
function crKeyTap(m){
  if(CR.phase!=='run') return;
  if(CR.wrong){CR.wrong=null;CR.picked=new Set();}
  CR.picked.has(m)?CR.picked.delete(m):CR.picked.add(m);
  crAnswer([...CR.picked],false);
  render();
}

/* ===== 操作 ===== */
PA.mountBar({title:'和音クイズ',app:'chord-quiz'});
PA.onPageShow=()=>{PA.stopSound();stopMic();location.reload();}; // 「もどる」でもどったら読みなおす（べつのページですすめたきろくを古いきろくで上書きしない）
PA.onSettings=render;
PA.onKey=m=>{ // 音は core が鳴らす
  if(Q.view==='quiz'&&Q.type==='chromatic'){crKeyTap(m);return;}
  if(Q.view!=='quiz'||Q.type!=='keys'||Q.checked) return;
  if(MIC.phase==='on'||MIC.phase==='wait') MIC.quietUntil=Date.now()+1500; // 画面のけんばんの音をマイクがひろわないように
  Q.picked.has(m)?Q.picked.delete(m):Q.picked.add(m); render();
};
// 🎹 電子ピアノ（MIDI）：和音をひいたら、そのままこたえあわせ（けんばんでおさえて「こたえあわせ」をおしたのとおなじ）。
// 音のなまえが和音の数そろうまでは、おさえた音を見せるだけ（1つずつおさえても、とちゅうで ×にならない）
PA.onMidiChord=ms=>{
  if(Q.view==='quiz'&&Q.type==='chromatic'){crMidi(ms);return;}
  if(Q.view!=='quiz'||Q.type!=='keys'||Q.checked) return;
  if(MIC.phase==='on'||MIC.phase==='wait') stopMic();
  const fold=m=>{while(m<LO)m+=12;while(m>HI)m-=12;return m;}; // 画面のけんばんの高さへ（×の印が見えて、タップでけせるように）
  Q.picked=new Set(ms.map(fold));
  if(new Set(ms.map(m=>PA.mod(m,12))).size<CHORDS[Q.q.chord].n){render();return;}
  checkKeys(); save(); render(); showFeedback();
};
PA.onMidiChange=render;
const quizMidis=()=>(Q.dr&&Q.dr.cat==='inv'?Q.dr.voice:chordTones(keyOfQ(Q.q),Q.q.chord)).map(n=>n.midi); // 転回形はがくふの形で鳴らす
// もんだいのしゅるいをかえる（ステップのとちゅうなら、ステップはおしまい）
function setCat(v){
  if(Q.type===v||!CAT_IDS.includes(v)) return false;
  if(curStep()){if(sess&&sess.active()) sess.clear(); endRun();}
  if(quizOf(v)!==quizOf(Q.type)) clearOnly(); // きろくがべつのしゅるい：チェック表の3もんはおしまい
  Q.type=v; fitKeyset(); switchQuiz();
  if(Q.only&&catOf(v).minor&&!KD.parse(Q.only).minor){Q.only=null;Q.onlyBy=null;}
  newQuestion(); return true;
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act, v=el.dataset.v;
  switch(a){
    case 'qcat': {
      const d=document.getElementById('qcatd'); if(d) d.open=false;
      if(!setCat(v)) return;
      PA.stopSound(); save(); render(); PA.scrollTop(); return;
    }
    case 'qtier': if(curStep()||Q.tier===v||!TIER_IDS.includes(v)) return; Q.tier=v; clearOnly(); deck.setOptions({tier:v}); newQuestion(); break;
    case 'qkeyset': // 長調にしたら、短調だけのしゅるいは「名前からおさえる」に
      if(curStep()||Q.keyset===v||!KEYSETS.some(([x])=>x===v)) return; Q.keyset=v; clearOnly();
      if(v==='major'&&catOf(Q.type).minor) Q.type='keys';
      switchQuiz(); newQuestion(); break;
    case 'qweak': Q.weak=!Q.weak; deck.setOptions({weak:Q.weak}); break; // えらべる調はかわらないのでふくろののこりはそのまま。つぎのふくろから
    case 'qchord': if(curStep()) return; if(!Object.prototype.hasOwnProperty.call(CHORDS,v)) return; Q.chords[v]=!Q.chords[v]; if(!Object.values(Q.chords).some(x=>x)) Q.chords[v]=true; newQuestion(); break;
    case 'qonlyoff': clearOnly(); endRun(); newQuestion(); break; // ふつうのれんしゅう＝じぶんのせってい
    case 'qsetopen': {
      Q.openSet=true; save(); render();
      const d=document.getElementById('qsetd'); if(!d) return;
      d.open=true;
      if(d.scrollIntoView) d.scrollIntoView({block:'start',behavior:PA.reduceMotion()?'auto':'smooth'});
      const s=d.querySelector('summary'); if(s&&s.focus) s.focus({preventScroll:true});
      return;
    }
    case 'keystats-reset': if(v!==deck.quiz) return; deck.reset(); deckOne.reset(); break; // core の2回おすしくみでたしかめてある
    case 'kd-pick': { // チェック表のます：その調を3もん
      const k=KD.parse(v); if(!k||k.id!==v) return;
      if(catOf(Q.type).minor&&!k.minor) return;
      Q.only=k.id; Q.onlyBy='pick'; Q.view='quiz';
      sess=PA.session(quizOf(Q.type),{sig:'pick='+k.id}); sess.start(3);
      if(RUN){RUN.sig=sess.state().sig;RUN.step=null;} // リンク・ステップのせってい（しゅるい・和音）のまま。つづきもおなじせっていで（ステップの5もんではない）
      PA.stopSound(); newQuestion(); save(); render();
      const d=document.getElementById('kdcheck'); if(d) d.open=false;
      PA.scrollTop(); return;
    }
    case 'sess5': // きょうの5もん（いまのせっていで。チェック表の「この調だけ」はやめる）
      if(Q.onlyBy==='pick'){Q.only=null;Q.onlyBy=null;}
      sess=PA.session(quizOf(Q.type),{sig:linkSig({key:Q.only,chords:Q.chords,type:Q.type,tier:Q.tier,keyset:Q.keyset})}); sess.start(5);
      if(RUN) RUN.sig=sess.state().sig; // リンクのせっていのままはじめた回：ホームからひらいてもこのせっていでつづき
      freshQuestion(); break;
    case 'session-again': if(!sess) return; sess.start(sess.n()); Q.view='quiz'; freshQuestion(); save(); render(); PA.scrollTop(); return;
    case 'session-free':
      // じゆうにれんしゅう：リンクのせっていも「この調だけ」もやめて、じぶんのせっていにもどる
      if(sess) sess.clear();
      endRun();
      Q.only=null; Q.onlyBy=null;
      Q.view='quiz'; newQuestion(); save(); render(); PA.scrollTop(); return;
    case 'qreset': Q.right=Q.total=Q.hinted=Q.streak=0; break;
    case 'qcheck': if(Q.type!=='keys'||Q.checked||!Q.picked.size) return; checkKeys(); save(); render(); showFeedback(); return;
    case 'qclear': Q.picked=new Set(); break;
    case 'qhint': Q.hint=Math.min(isDrill(Q.type)?1:2,Q.hint+1); break;
    case 'qnext':
      PA.stopSound(); stopProg(); newQuestion();
      if(sess&&sess.finished()) Q.view='summary'; // n もんおわった：けっかのカード
      save(); render(); PA.scrollTop(); return;
    case 'qretry': Q.picked=new Set(); Q.checked=false; break;
    case 'qplay': PA.chord(quizMidis()); return;
    case 'qchoose': if(Q.type!=='choice'||Q.chosen!=null) return; choose(+v); save(); render(); showFeedback(); return;
    case 'qdpick': if(!drillChoose(+el.dataset.p,+v)) return; save(); render(); showFeedback(); return;
    case 'qprog': playProg(); return;
    case 'crstart': if(Q.type!=='chromatic') return; startChroma(); PA.scrollTop(); return;
    case 'crrestart': if(Q.type!=='chromatic') return; startChroma(); return;
    case 'crstop': stopChroma(); break;
    case 'crclear': CR.picked=new Set(); CR.wrong=null; break;
    case 'crmode': // 長調／短調（ステップのあいだはかえない）
      if(curStep()||CR.phase==='run'||(v!=='major'&&v!=='minor')||Q.keyset===v) return;
      Q.keyset=v; CR.result=null; CR.phase='idle'; switchQuiz(); break;
    case 'crgb': { // 嬰ヘ長調／変ト長調
      if(CR.phase==='run'||(v!=='fs'&&v!=='gb')) return;
      const rec=crRec(); rec.gb=v==='gb'; PA.store.set(CR_KEY,rec); break;
    }
    case 'steps': // ステップのいちらん（いまのステップ・調の長調／短調）
      stopMic(); stopProg(); PA.stopSound();
      Q.view='steps'; Q.stepsKs=curStep()?curStep().ks:Q.keyset==='minor'||catOf(Q.type).minor?'minor':'major';
      save(); render(); PA.scrollTop(); return;
    case 'stepks': if(v!=='major'&&v!=='minor') return; Q.stepsKs=v; break;
    case 'step-go': {
      const s=stepOf(el.dataset.ks==='minor'?'minor':'major',+v); if(!s) return;
      startStep(s); save(); render(); PA.scrollTop(); return;
    }
    case 'steps-free': // ステップでなく、じぶんで選んで：ステップの回はおわりにして、じぶんのせってい（BASE）にもどす
      Q.view='quiz';
      if(curStep()){
        if(sess&&sess.active()) sess.clear();
        endRun(); // しゅるいのきろくの名前がおなじだと sess はそのままなので、ここでつくりなおす
        sess=PA.session(quizOf(Q.type)); if(sess.finished()) sess.clear();
        newQuestion();
      }else ensureQuestion();
      save(); render(); PA.scrollTop(); return;
    case 'qstepoff': if(sess&&sess.active()) sess.clear(); endRun(); newQuestion(); break; // ステップをやめる：じぶんのせっていにもどる
    case 'qexplain': {
      if(!isDone()&&Q.result===null) Q.peeked=true; // こたえるまえに見た：できたら「ヒントでできた」（×にはしない）
      stopMic(); save();
      const cb=PA.store.get('chord-build',{})||{};
      PA.store.set('chord-build',{minor:Q.q.minor,keyIdx:Q.q.keyIdx,chord:Q.q.chord,speed:cb.speed==='slow'?'slow':'normal'});
      PA.store.set('chord-build-auto',true);
      PA.go('chord-build.html'); return;
    }
    case 'mic': // 🎤 のオン・オフ（はじめては説明を出す）
      if(MIC.phase==='on'||MIC.phase==='wait'){stopMic();break;}
      if(!PA.store.get('mic-intro',false)){stopMic();MIC.phase='intro';MIC.qid=Q.qid;break;}
      startMic(); return;
    case 'micstart': startMic(); return;
    case 'micoff': stopMic(); break;
    default: return;
  }
  save(); render();
});
document.addEventListener('toggle',e=>{
  if(e.target.id!=='qsetd') return;
  const b=document.querySelector('[data-act="qsetopen"]'); if(b) b.setAttribute('aria-expanded',e.target.open?'true':'false');
  if(Q.openSet!==e.target.open){Q.openSet=e.target.open;save();}
},true);
// 画面をはなれたらマイクをとめる。⏱ 12の調もやめる（はなれていた時間が足されないように。もどったらスタートから）
function leaveChroma(){if(CR.phase!=='run') return false;stopChroma();CR.left=true;return true;}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) return;
  let re=false;
  if(MIC.phase==='on'||MIC.phase==='wait'){stopMic();re=true;}
  if(leaveChroma()) re=true;
  if(re) render();
});
window.addEventListener('pagehide',()=>{stopMic();leaveChroma();});
if(!Q.q) newQuestion();
save(); render();
</script>
