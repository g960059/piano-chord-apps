<script>
/* 和音クイズ：「ト長調のⅤ7は？」をけんばんでおさえる／4つからえらぶ／🎤 ピアノでひいてこたえる
 * リンクのパラメータ（先生のしゅくだい。わからない値はすてる）：
 *   key＝調（M0〜M12長調・m0〜m12短調。その調だけ）、chord＝I,IV,V,V7（カンマでいくつでも）、mode＝keys｜choice、
 *   tier＝easy｜normal｜hard｜all、keyset＝major｜minor｜both（このページだけ）、n＝れんしゅうのもんだいの数（1〜20） */
// <cq-logic>（test/chord-quiz.test.mjs でここだけ切りだしてたしかめる。DOM はつかわない）
const CHORDS={I:{deg:0,n:3,label:'Ⅰ'},IV:{deg:3,n:3,label:'Ⅳ'},V:{deg:4,n:3,label:'Ⅴ'},V7:{deg:4,n:4,label:'Ⅴ7'}};
const CHORD_IDS=Object.keys(CHORDS);
const QUIZ='chord-quiz', KD=PA.keyDeck;
const TIER_IDS=KD.TIERS.map(t=>t.id);
const KEYSETS=[['major','長調'],['minor','短調'],['both','りょうほう']];
const TYPES=['keys','choice'];
// はじめてひらいた人（きろくがない）：長調・やさしい（調号0〜1）・ⅠⅣⅤ・けんばんでこたえる
const FIRST={type:'keys',tier:'easy',keyset:'major',chords:{I:true,IV:true,V:true,V7:false}};
const chordTones=(key,ch)=>{const c=CHORDS[ch];return Array.from({length:c.n},(_,j)=>PA.at(key.scale,c.deg+2*j));};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// まちがえやすい答え：ほかの和音・♯♭をわすれた・7ばんめを上げわすれた・となりどうし・ひとつずれ
function makeChoices(q){
  const key=PA.keyOf(q.minor,q.keyIdx,60), c=CHORDS[q.chord], t=chordTones(key,q.chord);
  const sig=a=>a.map(n=>n.letter+':'+n.acc).join(',');
  // kind＝どんなまちがいか（こたえのメッセージでつかう）。おなじ音のくみあわせなら前のほう（ほかの和音 → 上げわすれ → 調号）をのこす
  const cands=[];
  CHORD_IDS.forEach(ch=>{if(ch!==q.chord) cands.push({notes:chordTones(key,ch),kind:'chord',ch});});
  if(t.some(n=>n.raised)) cands.push({notes:t.map(n=>n.raised?{letter:n.letter,acc:key.sig[n.letter]}:n),kind:'raise'});
  cands.push({notes:t.map(n=>({letter:n.letter,acc:0})),kind:'sig'});
  cands.push({notes:Array.from({length:c.n},(_,j)=>PA.at(key.scale,c.deg-1+2*j)),kind:'shift'});
  cands.push({notes:Array.from({length:c.n},(_,j)=>PA.at(key.scale,c.deg+1+2*j)),kind:'shift'});
  cands.push({notes:Array.from({length:c.n},(_,j)=>PA.at(key.scale,c.deg+j)),kind:'step'});
  const seen=new Set([sig(t)]), uniq=[];
  cands.forEach(o=>{const k=sig(o.notes);if(!seen.has(k)){seen.add(k);uniq.push(o);}});
  const out=shuffle(uniq).slice(0,3).map(o=>({notes:o.notes,ok:false,kind:o.kind,ch:o.ch}));
  out.push({notes:t,ok:true});
  return shuffle(out);
}
// リンクのパラメータ → せってい（その1回つかう）。きまった値だけとる
function linkSettings(p){
  const o={}, has=k=>!!p&&Object.prototype.hasOwnProperty.call(p,k)&&typeof p[k]==='string';
  if(has('mode')&&TYPES.includes(p.mode)) o.type=p.mode;
  if(has('tier')&&TIER_IDS.includes(p.tier)) o.tier=p.tier;
  if(has('keyset')&&KEYSETS.some(([v])=>v===p.keyset)) o.keyset=p.keyset;
  if(has('chord')){
    const cs=p.chord.split(',').map(x=>x.trim()).filter(x=>CHORD_IDS.includes(x));
    if(cs.length){o.chords={};CHORD_IDS.forEach(x=>o.chords[x]=cs.includes(x));}
  }
  if(has('key')){const k=KD.parse(p.key);if(k&&k.id===p.key) o.key=k.id;}
  if(has('n')&&/^\d{1,2}$/.test(p.n)&&+p.n>=1&&+p.n<=20) o.n=+p.n;
  return o;
}
// リンクのしるし（おなじしゅくだいならつづきから）。keyset も入れる
const linkSig=o=>[o.key?'key='+o.key:'',o.chords?'chord='+CHORD_IDS.filter(x=>o.chords[x]).join(','):'',o.type?'mode='+o.type:'',o.tier?'tier='+o.tier:'',o.keyset?'keyset='+o.keyset:''].filter(Boolean).join('&');
// おなじ音の調（嬰ヘ長調と変ト長調など）はいっしょに出す
function sameKeyIds(id){
  const k=KD.parse(id); if(!k) return [];
  const tpc=PA.keyOf(k.minor,k.idx).tpc;
  return KD.ids({tier:'all',modes:[k.minor?'minor':'major']}).filter(x=>{const p=KD.parse(x);return PA.keyOf(p.minor,p.idx).tpc===tpc;});
}
// ⭐の数えかた（1もんめの答えだけ）：ヒントや「つくりかた」を見てできたときは「じぶんで」にはかぞえず hinted に（×ではない）。れんぞくもそのまま
function scoreAnswer(s,ok,hinted){
  s.total++;
  if(ok&&!hinted){s.right++;s.streak++;}
  else if(ok){if(typeof s.hinted==='number') s.hinted++;}
  else s.streak=0;
  return s;
}
// ⭐の行（ただの文字）：ヒントでできたものがあればべつに出す（まちがいに見えないように）
function scoreText(s){
  const h=s.hinted||0;
  return h?`⭐ じぶんで${s.right}・💡 ヒントで${h}／${s.total}もん`:`⭐ ${s.right} / ${s.total}もんせいかい`;
}
// </cq-logic>
const ROM=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ'];
// まえの「調号の数（〜つまで）」＝0〜N の調 → 出る調がいちばん近いむずかしさ（ちがう調の数が少ないもの）。
// まえのきほん（1つまで）は「やさしい」とおなじ調なので、そのままやさしいに（いきなりむずかしくしない）
const LEVEL_TIER=new Map([[0,'easy'],[1,'easy'],[2,'easy'],[3,'normal'],[4,'all'],[7,'all']]);
const LO=60, HI=88; // けんばん：ド4〜ミ6（主音はド4〜シ4なのでⅤ7までぜんぶ入る）
const keyOfQ=q=>PA.keyOf(q.minor,q.keyIdx,60);
const keyIdOf=q=>KD.id(q.minor,q.keyIdx);
const modesOf=ks=>ks==='both'?['major','minor']:[ks];
const CHECK_MODES=['major','minor'];
const skipsOf=ch=>{const c=CHORDS[ch];return Array.from({length:c.n-1},(_,j)=>c.deg+2*j+1);};
const isBlack=m=>PA.BLACK.has(PA.mod(m,12));
const nameOf=(m,key)=>PA.nm(PA.spellMidi(m,key));
const degColor=d=>d===0?PA.COL.I:d===3?PA.COL.IV:d===4?PA.COL.V:'#9b8f83';
const keyNameOfId=id=>{const p=KD.parse(id);return p?PA.keyName(PA.keyOf(p.minor,p.idx)):'';};

/* ===== 状態（せってい・スコアは保存する） =====
 * peeked＝こたえるまえに「つくりかたを見る」をおした。hint＝💡ヒントの段（0〜2）。どちらかでできたら「ヒントでできた」
 * only＝この調だけ（id。チェック表のます→onlyBy 'pick'、リンクの key→'link'）。view＝'quiz'｜'summary'（れんしゅうの回のけっか）
 * hinted＝ヒントを見てできた数（right には入れない。×でもない）
 * BASE＝生徒がじぶんでえらんだせってい（ほぞんする）。RUN＝リンクのせってい（その1回だけ。BASE はかえない）
 *   RUN＝{type,tier,keyset,chords,key,sig,id}。sig＝リンクではじめた回のしるし、id＝このれきしのページ（history.state.cqLink）
 *   RUN は「もどる」の読みなおし（おなじれきしのページ）と、そのリンクの回のつづきのときだけつかう */
const Q={type:'keys',tier:'all',weak:true,keyset:'major',chords:{I:true,IV:true,V:true,V7:true},right:0,total:0,hinted:0,streak:0,openSet:false,
  q:null,qid:0,picked:new Set(),checked:false,result:null,recorded:false,lastOk:null,hint:0,peeked:false,wasHint:false,byMic:false,choices:null,chosen:null,
  only:null,onlyBy:null,view:'quiz'};
const LINK=linkSettings(PA.params());
const isInt=(v,lo,hi)=>Number.isInteger(v)&&v>=lo&&v<=hi;
let deck=null, deckOne=null, sess=null, lastQ=null; // lastQ＝ひらいたとき、まえに出ていたもんだい（つづけておなじもんだいにしない）
let BASE=null, RUN=null;
const settingsOf=o=>({type:o.type,tier:o.tier,keyset:o.keyset,chords:Object.assign({},o.chords)});
// ほぞんした RUN をたしかめてよむ（形がちがえば null）
function readRun(r){
  if(!r||typeof r!=='object'||!TYPES.includes(r.type)||!TIER_IDS.includes(r.tier)||!KEYSETS.some(([v])=>v===r.keyset)) return null;
  if(!r.chords||typeof r.chords!=='object'||typeof r.id!=='string'||typeof r.sig!=='string') return null;
  const c={}; CHORD_IDS.forEach(k=>c[k]=r.chords[k]===true);
  if(!Object.values(c).some(x=>x)) return null;
  const k=typeof r.key==='string'?KD.parse(r.key):null;
  return {type:r.type,tier:r.tier,keyset:r.keyset,chords:c,key:k&&k.id===r.key?k.id:null,sig:r.sig,id:r.id};
}
const validQ=q=>!!q&&typeof q==='object'&&typeof q.minor==='boolean'&&isInt(q.keyIdx,0,PA.keyCount(q.minor)-1)&&Object.prototype.hasOwnProperty.call(CHORDS,q.chord);

/* ===== 🎤 マイク（assets/mic.js）。phase：off・intro（はじめての説明）・wait（じゅんび中）・on（きいている）・error ===== */
const MIC_OK=!!(PA.mic&&PA.mic.supported());
const MIC={phase:'off',err:'',verdict:null,L:null,qid:-1,lstate:'idle',quietUntil:0,needReset:false};
function stopMic(){
  if(PA.mic&&(MIC.phase==='on'||MIC.phase==='wait')) PA.mic.stop();
  MIC.phase='off'; MIC.err=''; MIC.L=null; MIC.verdict=null; MIC.lstate='idle';
}

(function load(){
  const raw=PA.store.get('chord-quiz',{}), d=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};
  if(!Object.keys(d).length) Object.assign(Q,{type:FIRST.type,tier:FIRST.tier,keyset:FIRST.keyset,chords:Object.assign({},FIRST.chords)}); // はじめての人はやさしく
  else{
    if(TYPES.includes(d.type)) Q.type=d.type;
    if(TIER_IDS.includes(d.tier)) Q.tier=d.tier;
    else if(LEVEL_TIER.has(d.level)) Q.tier=LEVEL_TIER.get(d.level);
    if(KEYSETS.some(([v])=>v===d.keyset)) Q.keyset=d.keyset;
    if(d.chords&&typeof d.chords==='object'){
      const c={}; CHORD_IDS.forEach(k=>c[k]=d.chords[k]!==false);
      if(Object.values(c).some(x=>x)) Q.chords=c;
    }
  }
  if(typeof d.weak==='boolean') Q.weak=d.weak;
  if(isInt(d.total,0,1e6)&&isInt(d.right,0,d.total)&&isInt(d.streak,0,d.right)){
    Q.total=d.total;Q.right=d.right;Q.streak=d.streak;
    if(isInt(d.hinted,0,d.total-d.right)) Q.hinted=d.hinted;
  }
  Q.openSet=d.openSet===true;
  BASE=settingsOf(Q);
  // れんしゅうの回：リンクに n があればその回（おなじリンクのとちゅうならつづき）。なければのこっている回をよむ
  sess=LINK.n?PA.session(QUIZ,{n:LINK.n,sig:linkSig(LINK)}):PA.session(QUIZ);
  let st=sess.state();
  if(sess.finished()){ // おわった回：おわってすぐ（「もどる」の読みなおし）かリンクの n のときだけけっかを出す
    const recent=!!st&&st.endedAt!=null&&Date.now()-st.endedAt<10*6e4;
    if(recent||LINK.n) Q.view='summary';
    else{sess.clear();st=null;}
  }
  // リンクのせってい（その1回だけ。BASE はかえない）
  let histId=null; try{histId=history.state&&history.state.cqLink||null;}catch(e){}
  if(Object.keys(LINK).length){
    RUN={type:LINK.type||BASE.type,tier:LINK.tier||BASE.tier,keyset:LINK.keyset||BASE.keyset,chords:Object.assign({},LINK.chords||BASE.chords),
      key:LINK.key||null,sig:LINK.n?linkSig(LINK):'',id:String(Date.now())};
  }else{
    const R=readRun(d.run);
    // おなじれきしのページの読みなおし（「つくりかたを見る」からもどったなど）か、そのリンクではじめた回のつづき
    if(R&&((histId&&histId===R.id)||(R.sig&&st&&st.sig===R.sig))) RUN=R;
  }
  // リンクのパラメータは1回だけつかう：アドレスからけす（読みなおしてもリンクでもとにもどさない）
  if(location.search){try{history.replaceState({cqLink:RUN&&Object.keys(LINK).length?RUN.id:histId},'',PA.url(QUIZ)+location.hash);}catch(e){}}
  if(RUN){
    Object.assign(Q,{type:RUN.type,tier:RUN.tier,keyset:RUN.keyset,chords:Object.assign({},RUN.chords)});
    if(RUN.key){Q.only=RUN.key;Q.onlyBy='link';}
  }
  // チェック表の3もんのつづき
  if(!Q.only&&!Object.keys(LINK).length&&d.onlyBy==='pick'&&typeof d.only==='string'&&KD.parse(d.only)&&st&&st.sig==='pick='+KD.parse(d.only).id){
    Q.only=KD.parse(d.only).id;Q.onlyBy='pick';
  }
  deck=KD.create({quiz:QUIZ,tier:Q.tier,modes:modesOf(Q.keyset),weak:Q.weak});
  deckOne=KD.create({quiz:QUIZ,tier:'all',modes:CHECK_MODES,weak:false}); // 「この調だけ」のときにつかう（むずかしさ・長調／短調にかかわらず）
  const hasBag=deck.restore(d.deck); // ひらきなおしてもふくろのつづきから（24調をじゅんばんにまわす）
  // まだこたえていないもんだいはそのままつづける（「つくりかたを見る」からもどったときなど）
  const q=d.q;
  if(validQ(q)){
    const s={minor:q.minor,keyIdx:q.keyIdx,chord:q.chord};
    if(!d.answered&&inPool(s)){
      startQuestion(s);
      if(!hasBag&&!Q.only) deck.draw(x=>x.id===keyIdOf(s)); // ふくろのきろくがないときも、この調は「出た」ことに
      if(d.scored===true&&Q.total>0) Q.result=false; // もうかぞえてあるもんだい（1回目が × で「もういちど」のとちゅう。まえのきまりで見たら × にしたものも）
      Q.recorded=d.recorded===true; // チェック表にもう入れたもんだい（2回かぞえない）
      Q.peeked=d.peeked===true;
      if(isInt(d.hint,0,2)) Q.hint=d.hint;
    }else lastQ=s;
  }
})();
// せっていは BASE をほぞん。リンクの回（RUN）のあいだにかえたものは RUN だけに入れる
function save(){
  if(RUN){Object.assign(RUN,settingsOf(Q));RUN.key=Q.onlyBy==='link'?Q.only:null;}
  else BASE=settingsOf(Q);
  PA.store.set('chord-quiz',{type:BASE.type,tier:BASE.tier,weak:Q.weak,keyset:BASE.keyset,chords:BASE.chords,right:Q.right,total:Q.total,hinted:Q.hinted,streak:Q.streak,openSet:Q.openSet,run:RUN,
    q:Q.q?{minor:Q.q.minor,keyIdx:Q.q.keyIdx,chord:Q.q.chord}:null,answered:isDone(),scored:Q.result!==null,recorded:Q.recorded,peeked:Q.peeked,hint:Q.hint,
    only:Q.only,onlyBy:Q.onlyBy,view:Q.view,deck:deck.state()});
}
function isDone(){return Q.type==='keys'?Q.checked:Q.chosen!=null;}

/* ===== もんだい（調は PA.keyDeck のふくろから。和音はえらんだ中から） ===== */
const chordsOn=()=>CHORD_IDS.filter(k=>Q.chords[k]);
function inPool(q){return (Q.only?sameKeyIds(Q.only):deck.ids).includes(keyIdOf(q))&&!!Q.chords[q.chord];}
function startQuestion(q){
  stopMic(); // もんだいがかわったらマイクはとめる
  Object.assign(Q,{q,qid:Q.qid+1,picked:new Set(),checked:false,result:null,recorded:false,lastOk:null,hint:0,peeked:false,wasHint:false,byMic:false,chosen:null});
  Q.choices=makeChoices(q);
}
function newQuestion(){
  const prev=Q.q||lastQ, pid=prev?keyIdOf(prev):null;
  let k;
  if(Q.only){ // この調だけ（おなじ音の2つの書きかたはかわりばんこ）
    const ids=sameKeyIds(Q.only);
    k=deckOne.draw(x=>ids.includes(x.id)&&x.id!==pid)||deckOne.draw(x=>ids.includes(x.id));
  }else{
    // まえとちがう調をとる（まえの調はふくろにのこる）。ふつうは deck がつづけて同じ調を出さない
    k=deck.draw(x=>x.id!==pid)||deck.draw();
  }
  k=k||{minor:false,idx:0};
  let chs=chordsOn(); if(!chs.length) chs=['I'];
  if(prev&&k.minor===prev.minor&&k.idx===prev.keyIdx&&chs.length>1) chs=chs.filter(c=>c!==prev.chord); // 調がおなじなら和音をかえる
  lastQ=null;
  startQuestion({minor:k.minor,keyIdx:k.idx,chord:chs[Math.floor(Math.random()*chs.length)]});
}
// 1もんめの答え：⭐・チェック表・れんしゅうの回にきろく（1もんに1回だけ）
function answered(ok){
  const hinted=Q.peeked||Q.hint>=1;
  Q.result=ok; Q.wasHint=ok&&hinted;
  scoreAnswer(Q,ok,hinted);
  if(!Q.recorded&&Q.q){Q.recorded=true;deck.record(keyIdOf(Q.q),ok,ok&&hinted?{hint:true}:undefined);}
  if(sess&&sess.active()) sess.record({ok,hint:ok&&hinted,label:`${PA.keyName(keyOfQ(Q.q))}の${CHORDS[Q.q.chord].label}`,key:keyIdOf(Q.q)});
}
function okMsg(key,c,t){
  return `🎉 ${Q.byMic?'🎤 ピアノで ':''}せいかい！${PA.keyName(key)}の${c.label}は<b>${PA.namesH(t)}</b>`
    +(Q.wasHint?`<br><small>💡 ヒントを見てできたね。つぎは見ないでやってみよう</small>`:'');
}
// おさえた音をピッチクラスでくらべる（どのオクターブでも OK）
function gradeKeys(t){
  const ans=new Set(t.map(n=>PA.mod(n.midi,12))), pk=new Set([...Q.picked].map(m=>PA.mod(m,12)));
  const extra=[...pk].filter(p=>!ans.has(p)), missing=t.filter(n=>!pk.has(PA.mod(n.midi,12)));
  return {ok:!extra.length&&!missing.length,extra,missing,count:pk.size};
}
function checkKeys(){
  const t=chordTones(keyOfQ(Q.q),Q.q.chord), ok=gradeKeys(t).ok;
  Q.checked=true; Q.lastOk=ok;
  if(Q.result===null) answered(ok); // スコアは1回目だけ
  if(ok) PA.chord(t.map(n=>n.midi));
}
// こたえのメッセージは毎回いまの音名でつくる（⚙️で音名をかえてもそろう）
function fbHTML(key,c,t){
  if(Q.type==='choice'){
    if(Q.chosen==null) return '';
    const pick=Q.choices[Q.chosen];
    return pick.ok?okMsg(key,c,t):`🤔 おしい！こたえは<b>${PA.namesH(t)}</b><br>`+choiceHint(key,c,t,pick);
  }
  if(!Q.checked) return '';
  const g=gradeKeys(t);
  if(g.ok) return okMsg(key,c,t);
  const hints=[];
  g.missing.forEach(n=>{
    const from=n.raised?{letter:n.letter,acc:key.sig[n.letter]}:{letter:n.letter,acc:0};
    const fpc=PA.mod(PA.NAT[from.letter]+from.acc,12);
    if((n.raised||n.acc!==0)&&g.extra.includes(fpc))
      hints.push(n.raised?`「${PA.nmH(from)}」は短調の${c.label}なので半音上げて「${PA.nmH(n)}」だよ。`:`「${PA.nmH(from)}」は調号で「${PA.nmH(n)}」になるよ。がくふの調号を見てみよう。`);
  });
  if(g.count!==c.n) hints.push(`${c.label}は<b>${c.n}つ</b>の音だよ（いま${g.count}つ）。`);
  return `🤔 おしい！こたえは<b>${PA.namesH(t)}</b><br>`+(hints.length?hints.join('<br>'):`音階の<b>${c.deg+1}ばんめ</b>から、ひとつとばしでかさねてみよう。`);
}
// えらんだまちがいにあわせたヒント
function choiceHint(key,c,t,pick){
  const base=`${c.label}は音階の<b>${c.deg+1}ばんめ</b>から、ひとつとばしでかさねるよ。`;
  const raiseTxt=()=>{const n=t.find(x=>x.raised);return `短調の${c.label}は7ばんめ「${PA.nmH({letter:n.letter,acc:key.sig[n.letter]})}」を半音上げて「${PA.nmH(n)}」にするよ。`;};
  switch(pick.kind){
    case 'chord': return `それは<b>${CHORDS[pick.ch].label}</b>の音だよ。${base}`;
    case 'raise': return raiseTxt();
    case 'sig': {
      const s=t.filter(n=>!n.raised&&n.acc!==0).map(n=>`「${PA.nmH({letter:n.letter,acc:0})}」は「${PA.nmH(n)}」`);
      const r=t.some(n=>n.raised&&n.acc!==0)?raiseTxt():'';
      return (s.length?`調号を見てみよう。${PA.keyName(key)}では${s.join('、')}になるよ。`:'')+r||base;
    }
    case 'step': return `となりどうしではなく、<b>ひとつとばし</b>でかさねよう。${base}`;
    case 'shift': return `はじまりの音がずれているよ。${c.deg+1}ばんめの「${PA.nmH(t[0])}」からはじめよう。`;
    default: return base;
  }
}
function choose(i){
  const ok=!!Q.choices[i].ok;
  Q.chosen=i; Q.lastOk=ok;
  if(Q.result===null) answered(ok); // スコアは1回目だけ
  PA.chord(chordTones(keyOfQ(Q.q),Q.q.chord).map(n=>n.midi));
}

/* ===== 🎤 ピアノでひいてこたえる ===== */
const micTargets=()=>chordTones(keyOfQ(Q.q),Q.q.chord).map(n=>PA.mod(n.midi,12));
const micStatus=()=>MIC.phase==='wait'?'マイクをじゅんびしているよ…':MIC.lstate==='listen'?'きいているよ…':MIC.verdict?'もういちどひいてね…':'ひいてね…';
function startMic(){ // タップの中でよぶ（iOS はタップの中でないと音のしくみがうごかない）
  if(!MIC_OK||Q.view!=='quiz'||Q.type!=='keys'||Q.checked) return;
  stopMic();
  PA.store.set('mic-intro',true);
  const qid=Q.qid;
  Object.assign(MIC,{phase:'wait',err:'',verdict:null,qid,lstate:'idle',quietUntil:0,needReset:false});
  MIC.L=new PA.mic.Listener({target:micTargets(),onVerdict:onMicVerdict,onState:s=>{MIC.lstate=s;const el=document.getElementById('micst');if(el) el.textContent=micStatus();}});
  PA.mic.start({
    onFrame:f=>{
      if(MIC.qid!==Q.qid||!MIC.L||(MIC.phase!=='on'&&MIC.phase!=='wait')) return;
      const bar=document.getElementById('micbar');
      if(bar) bar.style.width=Math.max(0,Math.min(100,(f.level+70)/60*100)).toFixed(0)+'%';
      // 画面のけんばんの音が鳴っているあいだはきかない（おわったら新しくひいた音だけ）
      if(Date.now()<MIC.quietUntil){MIC.needReset=true;return;}
      if(MIC.needReset){MIC.needReset=false;MIC.L.reset();}
      MIC.L.feed(f);
    },
    onError:msg=>{if(MIC.qid!==Q.qid) return;stopMic();MIC.phase='error';MIC.err=msg;MIC.qid=qid;render();}
  }).then(ok=>{if(ok&&MIC.phase==='wait'&&MIC.qid===Q.qid){MIC.phase='on';render();}});
  render();
}
function onMicVerdict(v){
  if(MIC.qid!==Q.qid||Q.view!=='quiz'||Q.type!=='keys'||Q.checked) return;
  if(v.ok){ // けんばんでただしくおさえたのとおなじ
    stopMic();
    Q.picked=new Set(chordTones(keyOfQ(Q.q),Q.q.chord).map(n=>n.midi)); Q.byMic=true;
    checkKeys(); save(); render(); showFeedback();
    return;
  }
  MIC.verdict={missing:v.missing.slice(),extra:v.extra.slice()}; // ×にはしない（マイクのききまちがいもあるので）。もういちどひける
  render();
}
// きこえなかった音・よぶんな音（こたえの音はそのつづりで、よぶんな音は調のつづりで）
function micMissHTML(key,t){
  const v=MIC.verdict; if(!v) return '';
  const nmPc=pc=>{const n=t.find(x=>PA.mod(x.midi,12)===pc);return PA.nmH(n||PA.spellMidi(60+pc,key));};
  const q=a=>a.map(pc=>`「${nmPc(pc)}」`).join('');
  const out=[];
  if(v.missing.length) out.push(`${q(v.missing)}がきこえないよ。`);
  if(v.extra.length) out.push(`${q(v.extra)}も鳴っているみたい。`);
  if(!out.length) out.push('よくきこえなかったよ。');
  return `<p class="micv" role="alert">🤔 ${out.join('')}もういちどひいてみてね。</p>`;
}
function micHTML(key,t){
  if(!MIC_OK||Q.type!=='keys'||Q.checked) return '';
  if(MIC.phase==='intro') return `<div class="micbox" role="group" aria-labelledby="mic-h"><p id="mic-h" class="mict">🎤 マイクでピアノの音をきいてしらべるよ。音はこの端末の中だけでしらべて、どこにもおくらないよ。</p>
    <p class="note">録音はしないよ。「マイクをつかってもいい？」ときかれたら「許可」をおしてね。しずかな部屋で、端末をピアノの近く（譜面台など）におくとよくきこえるよ。</p>
    <div class="row"><button class="btn primary small" data-act="micstart">🎤 はじめる</button><button class="btn small" data-act="micoff">やめる</button></div></div>`;
  const on=MIC.phase==='on'||MIC.phase==='wait';
  let h=`<div class="row microw"><button class="btn small mic" data-act="mic" aria-pressed="${on}">🎤 ピアノでひいてこたえる</button></div>`;
  if(MIC.phase==='error') h+=`<p class="msg" role="alert" style="margin-top:8px">${PA.esc(MIC.err)}</p>`;
  if(on) h+=`<div class="micbox"><div class="micmeter" aria-hidden="true"><i id="micbar"></i></div><p id="micst" class="mict" role="status">${micStatus()}</p>${micMissHTML(key,t)}
    <div class="row"><button class="btn small" data-act="micoff">🎹 けんばんでこたえる</button></div></div>`;
  return h;
}

/* ===== 音階のかいだん（和音のしくみと同じ図。rootHint＝いちばん下の音のヒント） ===== */
function ladderSVG(key,o){
  const CW=58,G=5,CH=50,R=7,X0=8,BASE=220,N=14;
  const W=X0*2+N*(CW+G)-G, H=BASE+30, tones=o.tones||[], skips=o.skips||[];
  let s=`<svg viewBox="0 0 ${W} ${H}" class="ladder" role="img" aria-label="音階のかいだん">`;
  const dx=X0+7*(CW+G)-G/2, dTop=BASE-CH-7*R-56;
  s+=`<line x1="${dx}" y1="${dTop}" x2="${dx}" y2="${BASE+6}" stroke="#d9cfc2" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  s+=`<text x="${dx+6}" y="${dTop+12}" font-size="13" fill="#a99f93">ここから1オクターブ上 →</text>`;
  const pos=k=>({x:X0+k*(CW+G),y:BASE-CH-k*R});
  for(let k=0;k<N-1;k++){ // となりどうし（半音）の目印
    if(PA.at(key.scale,k+1).midi-PA.at(key.scale,k).midi===1){const p=pos(k);s+=`<rect x="${p.x+CW+G/2-2.5}" y="${p.y+CH-22}" width="5" height="20" rx="2.5" fill="#f4a100"/>`;}
  }
  for(let k=0;k<N;k++){
    const {x,y}=pos(k), n=PA.at(key.scale,k), d=k%7, isT=tones.includes(k), isRoot=o.rootHint===k;
    s+=`<rect x="${x}" y="${y}" width="${CW}" height="${CH}" rx="10" fill="${isT?o.color:'#fff'}" stroke="${isT?o.color:isRoot?'#f4a100':(d===0?'#bfb3a5':'#ddd2c4')}" stroke-width="${isRoot?4:2}"/>`;
    s+=`<text x="${x+CW/2}" y="${y+CH/2+6}" text-anchor="middle" font-size="${PA.nm(n).length>3?15:19}" font-weight="800" fill="${isT?'#fff':'#3a3245'}">${PA.Svg(PA.nm(n))}</text>`;
    if(n.raised) s+=`<text x="${x+CW/2}" y="${y+CH-4}" text-anchor="middle" font-size="11" font-weight="800" fill="${isT?'#fff':'#d1495b'}">半音上げ</text>`;
    const big=[0,3,4].includes(d);
    s+=`<text x="${x+CW/2}" y="${y+CH+19}" text-anchor="middle" font-size="${big?18:15}" font-weight="${big?800:400}" fill="${big?degColor(d):'#b0a597'}" opacity="${k<7?1:.55}">${ROM[d]}</text>`;
    if(skips.includes(k)) s+=`<text x="${x+CW/2}" y="${y-7}" text-anchor="middle" font-size="13" font-weight="700" fill="#a99f93">とばす</text>`;
    if(isRoot&&!isT) s+=`<text x="${x+CW/2}" y="${y-8}" text-anchor="middle" font-size="14" font-weight="800" fill="#c98500">ここから</text>`;
  }
  for(let i=1;i<tones.length;i++){
    const a=pos(tones[i-1]), b=pos(tones[i]), ax=a.x+CW/2, bx=b.x+CW/2, top=Math.min(a.y,b.y)-38;
    s+=`<path d="M${ax+6} ${a.y-2} Q${(ax+bx)/2} ${top} ${bx-6} ${b.y-2}" fill="none" stroke="${o.color}" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>`;
    s+=`<circle cx="${bx-6}" cy="${b.y-2}" r="3.5" fill="${o.color}"/>`;
  }
  return s+'</svg>';
}
// スマホ（375px）でかいだんを横スクロールするとき、見せたい音（和音 or いちばん下の音）がまん中にくるように
function ladderStart(kCenter){
  const W=8*2+14*63-5, cx=8+kCenter*63+29;
  return Math.max(0,Math.round((cx/W-0.26)*100))+'%';
}

/* ===== けんばんの印（sr＝読み上げで鍵の名前のあとにつけることば） ===== */
function kbMarks(key,t,col,done){
  const marks=new Map(), set=(m,o)=>marks.set(m,Object.assign(marks.get(m)||{},o));
  if(Q.hint>=1||done) for(let m=LO;m<=HI;m++){ // 音階のなんばんめ
    const i=key.scale.findIndex(s=>PA.mod(s.midi,12)===PA.mod(m,12));
    if(i>=0) set(m,{sub:ROM[i],subColor:degColor(i)});
  }
  if(Q.type==='choice'){ t.forEach(n=>set(n.midi,{fill:col,tc:'#fff',label:PA.nm(n),focus:true,sr:'こたえの音'})); return marks; }
  if(!Q.checked){
    Q.picked.forEach(m=>set(m,{fill:isBlack(m)?'#e9a800':'#ffd66b',tc:'#3a3245',label:nameOf(m,key),sr:'えらんだ'}));
    if(Q.hint>=2){ // いちばん下の音：どのオクターブでおさえていても OK
      const rpc=PA.mod(t[0].midi,12), hit=[...Q.picked].filter(m=>PA.mod(m,12)===rpc);
      if(hit.length) hit.forEach(m=>set(m,{ring:'#f4a100',sr:'えらんだ・いちばん下の音'})); else set(t[0].midi,{ring:'#f4a100',tc:col,label:'ここ?',sr:'ヒント・いちばん下の音'});
    }
  }else{
    const ans=new Set(t.map(n=>PA.mod(n.midi,12))), pk=new Set([...Q.picked].map(m=>PA.mod(m,12)));
    Q.picked.forEach(m=>{const ok=ans.has(PA.mod(m,12));set(m,{fill:ok?'#22a06b':'#d1495b',tc:'#fff',label:(ok?'○':'×')+nameOf(m,key),focus:true,sr:ok?'えらんだ・せいかい':'えらんだ・まちがい'});});
    t.forEach(n=>{if(!pk.has(PA.mod(n.midi,12))) set(n.midi,{fill:isBlack(n.midi)?undefined:'#fff',ring:col,tc:col,label:PA.nm(n),focus:true,sr:'たりない音'});});
  }
  return marks;
}

function renderSummary(){
  stopMic();
  const h=`<div class="stack">${sess.summaryHTML({title:'和音クイズ',page:'chord-quiz',params:shareParams(),settings:settingsText()})}${checkHTML()}</div>`;
  PA.paint(document.getElementById('view'),h,'sum');
  if(lastActions!==''){PA.paint(document.getElementById('actions'),'','bar');lastActions='';}
}
function render(){
  if(Q.view==='summary'&&sess&&sess.finished()){renderSummary();return;}
  Q.view='quiz';
  if((MIC.phase==='on'||MIC.phase==='wait')&&(Q.type!=='keys'||Q.checked||MIC.qid!==Q.qid)) stopMic();
  const q=Q.q, key=keyOfQ(q), c=CHORDS[q.chord], col=PA.COL[q.chord], t=chordTones(key,q.chord), done=isDone();
  let h=`<div class="stack">${PA.seg('qtype',[['keys','🎹 けんばんでおさえる'],['choice','✋ 4つからえらぶ']],Q.type,'full')}
    <section class="card hero" style="--c:${col}">
      <div class="score">${scoreText(Q)} <span>れんぞく${Q.streak}</span> ${'🌟'.repeat(Math.min(Q.streak,10))}${sessHead()}</div>
      <div class="qwrap"><div class="qtext">
        <div class="qtitle"><span class="qkey">${PA.keyName(key)}</span><span>の</span><span class="badge sm" style="--c:${col}">${c.label}</span><span>は？</span></div>
        <div class="qsub">${PA.sigLabel(key)}・${c.n}つの音</div></div>
        <div class="qstaff">${PA.staffSVG(key,[{notes:done?t:[],color:col,ltColor:'#d1495b',accColor:'#d1495b'}],{maxScale:1.3})}</div>
      </div>
      <div class="qnow"><span>いまのれんしゅう：<b>${PA.esc(nowText())}</b></span><button class="btn small" data-act="qsetopen" aria-controls="qsetd" aria-expanded="${Q.openSet?'true':'false'}" aria-label="れんしゅうのせっていをかえる">かえる</button></div>
    </section>`;
  const msg=fbHTML(key,c,t);
  const fb=msg?`<div class="fb ${Q.lastOk?'good':'bad'}" id="fb" role="status">${msg}</div>`
    :Q.hint>=1?`<div class="msg" role="status">💡 ヒント${Q.hint}：${Q.hint===1?`${PA.keyName(key)}の音階を出したよ。${c.label}は<b>${c.deg+1}ばんめ</b>の音から。`:`いちばん下の音は<b>「${PA.nmH(t[0])}」</b>。そこからひとつとばし！`}</div>`:'';
  const explain=`<div class="row center"><button class="btn small" data-act="qexplain">🐸 つくりかたを見る</button></div>`+(done||Q.result!==null?'':`<p class="qsub" style="text-align:center;margin:0">💡 ${PA.esc(PA.HINT_NOTE)}</p>`);
  const kb=`<div class="scroll" data-sk="kb">${PA.kbSVG(LO,HI,kbMarks(key,t,col,done))}</div>`;
  if(Q.type==='keys'){
    const names=[...Q.picked].sort((a,b)=>a-b).map(m=>PA.H(nameOf(m,key)));
    h+=`<section class="card"><h2>🎹 けんばんでおさえよう<small>${Q.checked?'緑の○＝あたり・赤の×＝ちがう音・わくだけ＝たりない音':`<b>${c.n}つ</b>の音をタップ・どのオクターブでも OK`}</small></h2>
      ${kb}<div class="picked">おさえた音：<b>${names.length?names.join('・'):'まだなし'}</b>${Q.checked?'':'<small>もういちどタップするとけせるよ</small>'}</div>${micHTML(key,t)}</section>${fb}${explain}`;
  }else{
    h+=`<section class="card"><h2>✋ どれかな？<small>${c.n}つの音のくみあわせをえらぼう</small></h2><div class="choices">`+Q.choices.map((ch,i)=>{
      let cls='';
      if(Q.chosen!=null){if(ch.ok)cls='right';else if(i===Q.chosen)cls='wrong';}
      return `<button class="choice ${cls}" data-act="qchoose" data-v="${i}" ${Q.chosen!=null?'disabled':''}>${cls==='right'?'⭕ ':cls==='wrong'?'❌ ':''}${PA.namesH(ch.notes)}</button>`;
    }).join('')+`</div></section>${fb}${explain}`;
    if(done) h+=`<section class="card"><h2>🎹 こたえのけんばん<small>下のローマ数字は音階のなんばんめ</small></h2>${kb}</section>`;
  }
  if(Q.hint>=1||done){
    const lad=done?{tones:t.map(n=>n.k),skips:skipsOf(q.chord),color:col}:{tones:[],color:col,rootHint:Q.hint>=2?c.deg:null};
    h+=`<section class="card"><h2>🪜 音階のかいだん<small>下のローマ数字は「音階のなんばんめ」。オレンジの印＝となりどうし（半音）</small></h2><div class="scroll" data-sk="ladder" data-start="${ladderStart(done?c.deg+c.n-1:c.deg)}">${ladderSVG(key,lad)}</div></section>`;
  }
  h+=settingsHTML()+checkHTML()+tipsHTML()+`</div>`;
  PA.paint(document.getElementById('view'),h,Q.qid+':'+Q.type+':'+(done?1:0));
  renderActions(done);
}
function renderActions(done){
  const hint=`<button class="btn" data-act="qhint" ${Q.hint>=2?'disabled':''}>💡 ${Q.hint?'ヒント2':'ヒント'}</button>`;
  const next=sess&&sess.finished()?'🎉 けっかを見る':null;
  let a;
  if(Q.type==='keys'&&!Q.checked) a=`<button class="btn ok" data-act="qcheck" data-hot="check" ${Q.picked.size?'':'disabled'}>✅ こたえあわせ</button><button class="btn" data-act="qclear" ${Q.picked.size?'':'disabled'}>🧽 けす</button>${hint}`;
  else if(Q.type==='choice'&&!done) a=hint;
  else if(Q.type==='keys'&&!Q.lastOk) a=`<button class="btn primary" data-act="qnext" data-hot="next">${next||'➡️ つぎへ'}</button><button class="btn" data-act="qretry">🔁 もういちど</button><button class="btn" data-act="qplay" data-hot="listen">🔊 こたえを聴く</button>`;
  else a=`<button class="btn primary" data-act="qnext" data-hot="next">${next||'➡️ つぎのもんだい'}</button><button class="btn" data-act="qplay" data-hot="listen">🔊 こたえを聴く</button>`;
  if(a!==lastActions){PA.paint(document.getElementById('actions'),a,'bar');lastActions=a;}
}
function showFeedback(){
  const el=document.getElementById('fb');
  if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest',behavior:PA.reduceMotion()?'auto':'smooth'});
}
// 「この調だけ」をやめる（その回のれんしゅうもおわり）
function clearOnly(){
  if(!Q.only) return;
  Q.only=null; Q.onlyBy=null;
  if(sess&&sess.active()) sess.clear();
}
// せっていがかわって今のもんだいが出ないものになったら、つぎのもんだいへ
function ensureQuestion(){if(!Q.q||isDone()||!inPool(Q.q)) newQuestion();}
// れんしゅうの回をはじめるとき：もうかぞえたもんだい（×のあと「もういちど」のとちゅう）は回に入らないので新しいもんだいに
function freshQuestion(){if(Q.result!==null) newQuestion(); else ensureQuestion();}
// リンクのせってい（RUN）をおわりにして、生徒がじぶんでえらんだせってい（BASE）にもどす
function endRun(){
  if(!RUN) return;
  RUN=null;
  Object.assign(Q,settingsOf(BASE));
  if(Q.onlyBy==='link'){Q.only=null;Q.onlyBy=null;}
  deck.setOptions({tier:Q.tier,modes:modesOf(Q.keyset)});
  try{history.replaceState({cqLink:null},'',location.href);}catch(e){}
}

/* ===== 操作 ===== */
PA.mountBar({title:'和音クイズ',app:'chord-quiz'});
PA.onPageShow=()=>{PA.stopSound();stopMic();location.reload();}; // 「もどる」でもどったら読みなおす（べつのページですすめたきろくを古いきろくで上書きしない）
PA.onSettings=render;
PA.onKey=m=>{ // 音は core が鳴らす
  if(Q.view!=='quiz'||Q.type!=='keys'||Q.checked) return;
  if(MIC.phase==='on'||MIC.phase==='wait') MIC.quietUntil=Date.now()+1500; // 画面のけんばんの音をマイクがひろわないように
  Q.picked.has(m)?Q.picked.delete(m):Q.picked.add(m); render();
};
const quizMidis=()=>chordTones(keyOfQ(Q.q),Q.q.chord).map(n=>n.midi);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act, v=el.dataset.v;
  switch(a){
    case 'qtype': if(Q.type===v||!TYPES.includes(v)) return; Q.type=v; newQuestion(); break;
    case 'qtier': if(Q.tier===v||!TIER_IDS.includes(v)) return; Q.tier=v; clearOnly(); deck.setOptions({tier:v}); newQuestion(); break;
    case 'qkeyset': if(Q.keyset===v||!KEYSETS.some(([x])=>x===v)) return; Q.keyset=v; clearOnly(); deck.setOptions({modes:modesOf(v)}); newQuestion(); break;
    case 'qweak': Q.weak=!Q.weak; deck.setOptions({weak:Q.weak}); break; // えらべる調はかわらないのでふくろののこりはそのまま。つぎのふくろから
    case 'qchord': if(!Object.prototype.hasOwnProperty.call(CHORDS,v)) return; Q.chords[v]=!Q.chords[v]; if(!Object.values(Q.chords).some(x=>x)) Q.chords[v]=true; newQuestion(); break;
    case 'qonlyoff': clearOnly(); endRun(); newQuestion(); break; // ふつうのれんしゅう＝じぶんのせってい
    case 'qsetopen': {
      Q.openSet=true; save(); render();
      const d=document.getElementById('qsetd'); if(!d) return;
      d.open=true;
      if(d.scrollIntoView) d.scrollIntoView({block:'start',behavior:PA.reduceMotion()?'auto':'smooth'});
      const s=d.querySelector('summary'); if(s&&s.focus) s.focus({preventScroll:true});
      return;
    }
    case 'keystats-reset': if(v!==QUIZ) return; deck.reset(); deckOne.reset(); break; // core の2回おすしくみでたしかめてある
    case 'kd-pick': { // チェック表のます：その調を3もん
      const k=KD.parse(v); if(!k||k.id!==v) return;
      Q.only=k.id; Q.onlyBy='pick'; Q.view='quiz';
      sess=PA.session(QUIZ,{sig:'pick='+k.id}); sess.start(3);
      if(RUN) RUN.sig=sess.state().sig; // リンクのせってい（こたえかた・和音）のまま。つづきもおなじせっていで
      PA.stopSound(); newQuestion(); save(); render();
      const d=document.getElementById('kdcheck'); if(d) d.open=false;
      PA.scrollTop(); return;
    }
    case 'sess5': // きょうの5もん（いまのせっていで。チェック表の「この調だけ」はやめる）
      if(Q.onlyBy==='pick'){Q.only=null;Q.onlyBy=null;}
      sess=PA.session(QUIZ,{sig:linkSig({key:Q.only,chords:Q.chords,type:Q.type,tier:Q.tier,keyset:Q.keyset})}); sess.start(5);
      if(RUN) RUN.sig=sess.state().sig; // リンクのせっていのままはじめた回：ホームからひらいてもこのせっていでつづき
      freshQuestion(); break;
    case 'session-again': if(!sess) return; sess.start(sess.n()); Q.view='quiz'; freshQuestion(); save(); render(); PA.scrollTop(); return;
    case 'session-free':
      // じゆうにれんしゅう：リンクのせっていも「この調だけ」もやめて、じぶんのせっていにもどる
      if(sess) sess.clear();
      endRun();
      Q.only=null; Q.onlyBy=null;
      Q.view='quiz'; newQuestion(); save(); render(); PA.scrollTop(); return;
    case 'qreset': Q.right=Q.total=Q.hinted=Q.streak=0; break;
    case 'qcheck': if(Q.type!=='keys'||Q.checked||!Q.picked.size) return; checkKeys(); save(); render(); showFeedback(); return;
    case 'qclear': Q.picked=new Set(); break;
    case 'qhint': Q.hint=Math.min(2,Q.hint+1); break;
    case 'qnext':
      PA.stopSound(); newQuestion();
      if(sess&&sess.finished()) Q.view='summary'; // n もんおわった：けっかのカード
      save(); render(); PA.scrollTop(); return;
    case 'qretry': Q.picked=new Set(); Q.checked=false; break;
    case 'qplay': PA.chord(quizMidis()); return;
    case 'qchoose': if(Q.chosen!=null) return; choose(+v); save(); render(); showFeedback(); return;
    case 'qexplain': {
      if(!isDone()&&Q.result===null) Q.peeked=true; // こたえるまえに見た：できたら「ヒントでできた」（×にはしない）
      stopMic(); save();
      const cb=PA.store.get('chord-build',{})||{};
      PA.store.set('chord-build',{minor:Q.q.minor,keyIdx:Q.q.keyIdx,chord:Q.q.chord,speed:cb.speed==='slow'?'slow':'normal'});
      PA.store.set('chord-build-auto',true);
      PA.go('chord-build.html'); return;
    }
    case 'mic': // 🎤 のオン・オフ（はじめては説明を出す）
      if(MIC.phase==='on'||MIC.phase==='wait'){stopMic();break;}
      if(!PA.store.get('mic-intro',false)){stopMic();MIC.phase='intro';MIC.qid=Q.qid;break;}
      startMic(); return;
    case 'micstart': startMic(); return;
    case 'micoff': stopMic(); break;
    default: return;
  }
  save(); render();
});
document.addEventListener('toggle',e=>{
  if(e.target.id!=='qsetd') return;
  const b=document.querySelector('[data-act="qsetopen"]'); if(b) b.setAttribute('aria-expanded',e.target.open?'true':'false');
  if(Q.openSet!==e.target.open){Q.openSet=e.target.open;save();}
},true);
// 画面をはなれたらマイクをとめる
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(MIC.phase==='on'||MIC.phase==='wait')){stopMic();render();}});
window.addEventListener('pagehide',()=>{stopMic();});
if(!Q.q) newQuestion();
save(); render();
</script>
</body>
</html>
