<body>
<header class="appbar" id="appbar"></header>
<main class="page" id="view"></main>
<div class="actionbar" id="actions"></div>
<script src="assets/core.js"></script>
<script>
/* 異名同音の読みかえ（画面では減七のなかまを ①②③ とよぶので、2つの話は 🔀・↔️ でわける）：
 *  🔀 減七の和音は3つのなかまだけ。おなじけんばんを4つの短調の減七（Ⅴ9の根音省略）として書きわけると、4つの調へ解決する（第9音がいちばん下の読みはⅠ6/4 → Ⅴ → Ⅰ）
 *  🔥 チャレンジ：増六に読みかえる（ドイツの6とⅤ7/♭Ⅱ。ふだんはたたんでおく）：おなじけんばん、♯4と♭5の書きかえで、行き先がⅤと♭Ⅱにわかれる。
 *     先生の意見（docs/TEACHER-FEEDBACK.md）：読みかえのクイズに増六が入る問題は「チャレンジ」としてわける。
 *     ふつうの読みかえ（🎲 どこへ行った？・ためしてみる）は減七だけ。増六の問題（🎲 どっちに読んだ？・ドイツの6を5問）はこのカードの中だけ
 * 和音のつづり・高さ・解決はすべて PA.henka（dimReadings・ger6Vs7）と PA.chroma（↔️ は aug6.html とおなじ高さ・名前：gerSet）、Ⅴ→Ⅰは vToI */
const H=PA.henka;
const NIGHT='#3b4fa8', LT='#d1495b', LOW='#2f7ee8', VCOL='#2f7ee8', GER='#8a4fe0', V7C='#1f8a5b', GHOST='#9b9184', ICOL=PA.COL.I;
const RCOL=['#e07a00','#22a06b','#2f7ee8','#8a4fe0']; // 4つの読みかた（行き先）の色
// 減七の3つのなかま（Ⅴの家族のページとおなじ書き方）。家族 i ＝導音の高さを3でわったあまり
// よびかたは ①②③（Ａ・Ｂ・Ｃだと音の名前（CDE）とまちがえやすい）
const DIM_FAMS=[[[0,0],[2,-1],[4,-1],[5,0]],[[0,1],[2,0],[4,0],[6,-1]],[[1,0],[3,0],[5,-1],[6,0]]];
const FAM_NO=['①','②','③'];
const NK=PA.keyCount(true);
const famOf=idx=>PA.mod(PA.minorKey(idx).lt.midi,3);
const famPcs=f=>[0,3,6,9].map(x=>x+f);

const saved=PA.store.get('enharmonic',{})||{};
// res／resT：鳴らしおわったあとも解決の和音を見せる（resT＝その読みかたの主音の高さ）。quiz.ans・pick も主音の高さ
// gq＝🔥 チャレンジの問題（{ans:'ger'|'v7', pick}）。gOk・gN＝そのせいかいの数
const state={fam:2,keyIdx:0,res:0,resT:null,anim:null,autoWait:false,play:null,g:null,quiz:null,qOk:0,qN:0,gq:null,gOk:0,gN:0};
if(Number.isInteger(saved.keyIdx)&&saved.keyIdx>=0&&saved.keyIdx<NK) state.keyIdx=saved.keyIdx;
state.fam=famOf(state.keyIdx); // 家族は調からきまる（保存した fam がずれていても調にあわせる）
const save=()=>PA.store.set('enharmonic',{fam:state.fam,keyIdx:state.keyIdx});
// 先生のリンク：key＝短調（m0〜m12）。ちがう値はつかわない。いまの設定にもする
(()=>{
  const k=PA.keyDeck.parse(PA.params().key); if(!k||!k.minor) return;
  state.keyIdx=k.idx; state.fam=famOf(k.idx); save();
})();
const curKey=()=>PA.minorKey(state.keyIdx);

/* ===== 減七の4つの読みかた（PA.henka.dimReadings） ===== */
// えらんだ調の読みが given。表の列のじゅんばんは調がかわってもうごかないように主音の高さでならべる（ラから）
// 第9音がいちばん下の読み（ninthInBass）はⅠ6/4 → Ⅴ → Ⅰとすすめて、fin（さいごのⅠ）で解決させる
const readingsOf=idx=>H.dimReadings(PA.minorKey(idx)).map(r=>({...r,fin:r.next?vToI(r.key,r.next):null}))
  .sort((a,b)=>PA.mod(a.key.tpc-9,12)-PA.mod(b.key.tpc-9,12));
// 読みかたの和音のならび：減七 → 解決（→ Ⅴ → Ⅰ）
const stagesOf=r=>[r.spelling,r.resolution].concat(r.next?[r.next,r.fin]:[]);
// Ⅴ → Ⅰ（おなじ声のならび）：ベースは主音へ、導音は主音へ（上へ）、第5音は主音か第3音へ、根音はのこすか主音・第3音へ。
// 交差なし・連続5度／8度なし・第3音はかならず入れる。動きの合計がいちばん小さいものをえらぶ（第3音の重複・第5音の省略はすこし減点）
function vToI(key,V){
  const t=key.tpc, O=(d,midi,role)=>({letter:key.nat[d].letter,acc:key.nat[d].acc,midi,role,tag:null});
  const opts=V.map((n,i)=>{
    const rel=PA.mod(n.midi-t,12);
    if(i===0) return [O(0,n.midi-7,'主音（根音）'),O(0,n.midi+5,'主音（根音）')];
    if(rel===11) return [O(0,n.midi+1,'主音（根音）')];
    if(rel===2) return [O(0,n.midi-2,'主音（根音）'),O(2,n.midi+1,'第3音')];
    return [O(4,n.midi,'第5音'),O(0,n.midi+5,'主音（根音）'),O(2,n.midi-4,'第3音')];
  });
  let best=null;
  const walk=(i,acc)=>{
    if(i===opts.length){
      for(let j=1;j<acc.length;j++) if(acc[j].midi<=acc[j-1].midi) return;
      const rels=acc.map(n=>PA.mod(n.midi-t,12));
      if(!rels.includes(3)||!rels.includes(0)) return;
      for(let a=0;a<acc.length;a++) for(let b=a+1;b<acc.length;b++){
        const x=PA.mod(V[b].midi-V[a].midi,12), y=PA.mod(acc[b].midi-acc[a].midi,12);
        if(x===y&&(x===0||x===7)&&V[a].midi!==acc[a].midi&&V[b].midi!==acc[b].midi) return;
      }
      const cost=acc.reduce((s,n,j)=>s+Math.abs(n.midi-V[j].midi),0)+(rels.filter(r=>r===3).length>1?6:0)+(rels.includes(7)?0:2);
      if(!best||cost<best.cost) best={cost,acc:[...acc]};
      return;
    }
    opts[i].forEach(o=>{acc.push(o);walk(i+1,acc);acc.pop();});
  };
  walk(0,[]);
  return best?best.acc:null;
}
// 家族のボタンをおしたとき：その家族で調号のいちばんすくない調
function easiestIn(f){
  const rs=H.dimReadings(famPcs(f));
  return rs.reduce((a,r)=>!a||PA.sigInfo(r.key).letters.length<PA.sigInfo(a.key).letters.length?r:a,null).key.idx;
}
// けんばんのはんい：3つのなかまぜんぶ（どの読みかた・解決でもおなじはんいのけんばん）
const whiteDown=m=>{while(PA.BLACK.has(PA.mod(m,12)))m--;return m;};
const whiteUp=m=>{while(PA.BLACK.has(PA.mod(m,12)))m++;return m;};
const kbRange=lists=>{const ms=lists.flat().filter(Boolean).map(n=>n.midi);return [whiteDown(Math.min(...ms)-2),whiteUp(Math.max(...ms)+2)];};
const DIM_RANGE=kbRange([0,1,2].flatMap(f=>H.dimReadings(famPcs(f)).flatMap(r=>[r.spelling,r.resolution,r.next||[],r.next?vToI(r.key,r.next):[]])));

/* ===== 音のよびかた ===== */
const nH=n=>{const c=n.tag==='lt'?'up':n.tag==='low'?'lo':'';return `<span class="nw ${c}">${PA.nmH(n)}</span>`;};
const q=n=>`「${nH(n)}」`;
const namesC=(ns,sep='・')=>ns.map(nH).join(sep);
const I64H='Ⅰ<span class="fig"><span>6</span><span>4</span></span>';
const I64S='Ⅰ<tspan font-size="11" dy="-7">6</tspan><tspan font-size="11" dx="-6.5" dy="11">4</tspan>';
const resLabel=(r,svg)=>r.resInv===2?(svg?I64S:I64H):r.resInv===1?'Ⅰ6':'Ⅰ';
const tonicOf=key=>key.nat[0];
const sigAcc=(key,L)=>key.sig[L]||0;
// C♭・F♭・E♯・B♯・重変・重嬰：けんばんのふつうの名前もそえる（ハ長調の名前＝♯）
const oddName=n=>Math.abs(n.acc)>1||(n.acc===-1&&(n.letter===0||n.letter===3))||(n.acc===1&&(n.letter===2||n.letter===6));
const plainOf=n=>PA.spellMidi(n.midi,PA.majorKey(0));

/* ===== がくふ（大譜表。いちばん下の音とド4より下の音はヘ音記号）＋矢印 ===== */
const prep=n=>({letter:n.letter,acc:n.acc,midi:n.midi,raised:n.tag==='lt'||undefined});
// cols:[{notes,color,label,op}]、arrows:[{c1,n1,c2,n2,color,text,dash,dy}]（n1・n2は cols の音そのもの）
function staff(key,cols,arrows=[],o={}){
  const cw=o.cw||110;
  const sc=cols.map(c=>{
    const lo=c.notes.length?c.notes.reduce((a,b)=>b.midi<a.midi?b:a):null;
    const lh=c.notes.filter(n=>n===lo||n.midi<60), tr=c.notes.filter(n=>!lh.includes(n));
    const col={notes:tr.map(prep),lh:lh.map(prep),color:c.color,ltColor:LT,accColor:LT,label:c.label,labelColor:c.color,op:c.op};
    return {col,tr,lh};
  });
  const ns=PA.sigInfo(key).letters.length, nx=50+ns*10+(ns?24:14);
  const tw=t=>[...(t||'')].reduce((w,ch)=>w+(ch.charCodeAt(0)>255?14:8.5),0);
  const pad=Math.max(44,...arrows.map(a=>tw(a.text)-cw/2+22));
  let svg=PA.staffSVG(key,sc.map(s=>s.col),{grand:true,autoCarry:true,colW:cw,minW:Math.max(o.minW||0,arrows.length?nx+cols.length*cw+pad:0)});
  const posOf=(ci,n)=>{
    const s=sc[ci]; if(!s) return null;
    const inT=s.tr.includes(n), arr=inT?s.tr:s.lh.includes(n)?s.lh:null; if(!arr) return null;
    const P=arr.map(m=>({m,s:PA.stepOf(m)})).sort((a,b)=>a.s-b.s);
    let ps=-99,po=false; P.forEach(p=>{p.off=(p.s-ps===1&&!po);po=p.off;ps=p.s;});
    const p=P.find(p=>p.m===n);
    return {x:nx+ci*cw+cw/2+(p.off?13:0),y:inT?96-(p.s-30)*5:178-(p.s-26)*5};
  };
  let add='';
  const cs=new Set();
  arrows.forEach(a=>{
    const p=posOf(a.c1,a.n1), r=posOf(a.c2,a.n2); if(!p||!r) return;
    const id='en'+a.color.slice(1); cs.add(a.color);
    add+=`<path d="M${p.x+12} ${p.y} L${r.x-22} ${r.y}" stroke="${a.color}" stroke-width="2.4" fill="none" stroke-dasharray="${a.dash||''}" marker-end="url(#${id})"/>`;
    if(a.text) add+=`<text x="${r.x+14}" y="${r.y+5+(a.dy||0)}" font-size="14" font-weight="800" fill="${a.color}">${a.text}</text>`;
  });
  if(cs.size) add+=`<defs>${[...cs].map(c=>`<marker id="en${c.slice(1)}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${c}"/></marker>`).join('')}</defs>`;
  svg=svg.replace(/<\/svg>$/,add+'</svg>');
  // 小さくなりすぎないように（文字が読めるように）横スクロールにする
  const m=svg.match(/viewBox="0 0 ([\d.]+) /), W=m?+m[1]:400;
  return `<div class="scroll" data-sk="${o.sk||'staff'}"><div style="min-width:${Math.round(W*0.66)}px">${svg}</div></div>`;
}

/* ===== 🔀 減七の読みかえ ===== */
// いま見せる読みかた（つくりかたのとちゅうはアニメの読みかた）
function view(){
  const rs=readingsOf(state.keyIdx), A=state.anim;
  // 鳴らしおわったあと（state.res>0）は、鳴らした読みかたの解決をそのまま見せる
  const ri=state.res>0?rs.findIndex(r=>r.key.tpc===state.resT):-1;
  const si=A?A.i:state.play?state.play.i:ri>=0?ri:rs.findIndex(r=>r.given);
  const res=A?A.stage:state.play?state.play.stage:ri>=0?Math.min(state.res,stagesOf(rs[ri]).length-1):0;
  return {rs,si,r:rs[si],res};
}
function famButtons(){
  return `<div class="fams">`+DIM_FAMS.map((ns,i)=>`<button class="fbtn ${i===state.fam?'on':''}" data-act="fam" data-v="${i}" aria-pressed="${i===state.fam}"><span class="num">${FAM_NO[i]}のなかま</span><span class="nm">${PA.namesH(ns.map(([l,a])=>({letter:l,acc:a})))}</span></button>`).join('')+`</div>`;
}
function staticMsg(r){
  const key=r.key, t=tonicOf(key), root=PA.at(key.harm,4);
  let m=`<b>${PA.keyName(key)}</b>として読むと、${q(r.lt)}が<b class="up">導音</b>。導音は半音上の${q(t)}へすすむから、行き先は<b>${PA.keyName(key)}</b>。`;
  m+=`<br>減七は、短調のⅤ9から根音（和音の土台の音）をはぶいた和音。${PA.keyName(key)}なら、かくれた根音は${q(root)}だよ。`;
  if(r.ninthInBass) m+=`<br>※ この読みかたは、第9音${q(r.spelling[0])}がいちばん下になる形。ふつうはあまり使わない形だけれど、同じけんばんのまま、くらべるために鳴らしているよ。${I64H} → Ⅴ → Ⅰとすすんで、さいごのⅠにおちつくよ。`;
  return m;
}
// 書くと1か所だけとなりの文字（増2度：第9音–導音）。おなじ2つのけんばんを主音が短3度上の調の名前で書くとひとつとばしの文字（第7音–第9音）
function aug2Msg(rs,r){
  const b9=r.spelling.find(n=>n.tag==='b9'), lt=r.lt, up=rs.find(x=>x.key.tpc===PA.mod(r.key.tpc+3,12));
  const s7=up&&up.spelling.find(n=>n.midi===b9.midi), n2=up&&up.spelling.find(n=>n.midi===lt.midi);
  if(!b9||!s7||!n2) return '';

// おなじけんばんで名前がちがう例（名前の種類がいちばん多いけんばん。おなじ数なら上のけんばん）
function enhExample(rs){
  const ms=rs[0].spelling.map(n=>n.midi).sort((a,b)=>b-a);

  ms.forEach(m=>{
    const seen=new Set(), out=[];
    rs.forEach(r=>{const n=r.spelling.find(x=>x.midi===m), k=PA.nm(n);if(!seen.has(k)){seen.add(k);out.push(n);}});
    if(out.length>best.length) best=out;
  });
  return best;
}

// ↔️ の和音：aug6.html とおなじ高さ（PA.chroma のまま。ger6Vs7のベースのオクターブ下げ bassShift はもどす。
//   ♭Ⅱのベースは aug6.html とおなじく5度下）。♭6がけんばんのふつうでない名前（変ホ短調のド♭）のときは、aug6.html と
//   おなじくⅤ7と♭Ⅱをぜんぶけんばんのふつうの名前で書く（重変をさける）
function gerSet(key){
  const g=H.ger6Vs7(key), sh=-g.bassShift, up=ns=>ns.map((n,i)=>i?n:{...n,midi:n.midi+sh});
  const ger=up(g.ger), gerRes=g.gerRes.map(up);
  let v7=up(g.v7), v7Res=g.v7Res.map((n,i)=>i?n:{...n,midi:ger[0].midi-7});
  const plain=oddName(ger[0]);
  if(plain){
    const rt=plainOf(ger[0]), rpc=PA.NAT[rt.letter]+rt.acc;
    const nt=(dl,dp,n)=>{const L=(rt.letter+dl)%7;return {...n,letter:L,acc:PA.spell(L,rpc+dp)};};
    v7=[nt(0,0,v7[0]),nt(2,4,v7[1]),nt(4,7,v7[2]),nt(6,10,v7[3])];
    v7Res=[nt(3,5,v7Res[0]),nt(3,5,v7Res[1]),nt(3,5,v7Res[2]),nt(5,9,v7Res[3])];
  }
  return {ger,gerRes,v7,v7Res,diff:g.diff,plain,v7Name:H.chordName(v7[0],'7'),bII:H.chordName(v7Res[0],'')};
}
const sameName=(a,b)=>a.letter===b.letter&&a.acc===b.acc;

  let h=`<details class="card fold chal" id="ger" data-d="ger"><summary><h2><span class="chalbadge"><span aria-hidden="true">🔥</span> チャレンジ</span>増六に読みかえる<small>つぎのレベル。増六の和音をならったら挑戦しよう</small></h2></summary>

    <div class="vs">

      [{c1:0,n1:gn,c2:1,n2:i64[d],color:LT,text:'半音↑'},{c1:0,n1:g.ger[0],c2:1,n2:i64[0],color:LOW,text:'半音↓'}],{sk:'g1',cw:100})}
    ${staff(key,[{notes:g.v7,color:V7C,label:'Ⅴ7/♭Ⅱ'},{notes:g.v7Res,color:V7C,label:'♭Ⅱ'}],

    ${chalQuizHTML(key,g)}

  return h;

    <dt>異名同音<span class="yomi">（いめいどうおん）</span></dt>
      <dd>名前（書き方）はちがうけれど、けんばんは同じ音（${ex.map(q).join('と')}など）。調にもあって、嬰ヘ長調と変ト長調は同じけんばんの調。</dd>
    <dt>転調<span class="yomi">（てんちょう）</span></dt>
      <dd>曲のとちゅうでべつの調へうつること。このページの読みかえ（🔀 減七と、<span aria-hidden="true">🔥</span> チャレンジのドイツの6）は、音の名前を書きかえて、べつの調へうつるやりかた（本では「異名同音的転調<span class="yomi">（いめいどうおんてきてんちょう）</span>」と書く）。1つの減七は、書き方をかえると4つの短調のⅦ7になる（${FAM_NO[state.fam]}のなかまなら${rs.map(x=>PA.keyName(x.key)).join('・')}）ので、遠い調へもいっきに行けるよ。同じ主音の長調の○Ⅶ7（準固有和音）と読めば、長調へも行ける。</dd>
    <dt>解決<span class="yomi">（かいけつ）</span></dt>
      <dd>ドキドキする和音が、おちつく和音（Ⅰなど）へすすむこと。このページの「Ⅰへすすむ」のこと。</dd>
    <dt>増2度<span class="yomi">（ぞう2ど）</span></dt>
      <dd>となりの文字どうしなのに、けんばんでは、ひとつとばしの文字と同じはばになる2つの音。いまの読みかたでは${q(b9)}と${q(r.lt)}。</dd>
  </dl></details>`;
}

/* ===== 画面 ===== */
let lastActions='';
function render(){
  const key=curKey(), A=state.anim;
  let h=`<div class="stack">
    <div class="toprow">${PA.keyChip(key)}<span class="note" style="margin:0">減七は3つのなかまだけ</span></div>
    ${famButtons()}
    ${heroCard()}
    ${kbCard()}
    ${staffCard()}
    ${tryCard()}
    ${quizCard()}
    ${gerCard()}
    ${linksCard()}
    ${termsHTML()}`;
  // この画面に出てくる記号だけ、音の名前の表の下で説明する（出てこないときは出さない）
  const ds=h.includes('class="ds"'), df=h.includes('class="df"');
  h=h.replace('<!--sym-->',(ds?'<span><span class="ds">x</span>＝ダブルシャープ（楽譜での書き方）</span>':'')+(df?'<span><span class="df" style="letter-spacing:-.12em">♭♭</span>＝ダブルフラット（楽譜での書き方）</span>':''));
  h+=`</div>`;
  PA.paint(document.getElementById('view'),h,state.keyIdx+':'+state.fam);
  // 光るけんばんが見えるように：鳴らしているほうのけんばんだけうごかす（もう一方は手でうごかした位置のまま）
  const box=sk=>{const b=document.querySelector(`[data-sk="${sk}"]`);return b&&b.parentElement;};
  if(A||state.play){const b=box('kb');if(b) PA.follow(b);}
  if(state.g){const b=document.getElementById('ger');if(b) PA.follow(b);}
  const acts=(A?`<button class="btn" data-act="stop">${PA.icon('stop')}とめる</button>`:`<button class="btn night" data-act="tour">🔀 4つの調</button>`)+
    `<button class="btn" data-act="play" data-hot="listen">${PA.icon('listen')}減七</button><button class="btn primary" data-act="resolve">${PA.icon('next')}Ⅰへすすむ</button>`;
  if(acts!==lastActions){PA.paint(document.getElementById('actions'),acts,'bar');lastActions=acts;}
}

/* ===== 音・アニメ ===== */
let token=0;
function stop(){token++;state.anim=null;state.autoWait=false;state.play=null;state.g=null;PA.stopSound();}
const midis=ns=>[...new Set(ns.map(n=>n.midi))];
// 読みかた r を鳴らす：減七 → 解決（→ Ⅴ → Ⅰ）。i＝表の列。おわったら解決の和音を出したまま
async function playReading(i){
  stop(); const my=token;
  const rs=readingsOf(state.keyIdx), r=rs[i]; if(!r) return;
  state.res=0;
  const seq=stagesOf(r);
  for(let s=0;s<seq.length;s++){
    state.play={i,stage:s}; render();
    PA.chord(midis(seq[s]),{dur:s===seq.length-1?2.2:1.4});
    await PA.sleep(1300); if(my!==token) return;
  }
  await PA.sleep(900); if(my!==token) return;
  state.play=null; state.res=seq.length-1; state.resT=r.key.tpc; render();
}
async function runTour(){
  stop(); const my=token, alive=()=>my===token;
  const rs=readingsOf(state.keyIdx), A={i:0,stage:0,msg:''}; state.anim=A; state.res=0; state.quiz=null;
  const upd=m=>{if(m!==undefined)A.msg=m;render();};
  const wait=async ms=>{await PA.sleep(ms);return alive();};
  upd(`<b>${FAM_NO[state.fam]}のなかま</b>の減七を、4つの調の名前で書いて、それぞれⅠへすすめてみよう。<b>けんばんはずっと同じ</b>だよ。`);
  PA.chord(midis(rs[0].spelling),{dur:1.6});
  if(!await wait(2000)) return;
  for(let i=0;i<rs.length;i++){
    const r=rs[i], kn=PA.keyName(r.key);
    A.i=i; A.stage=0;
    upd(`<b>${i+1}.</b> <b style="color:${RCOL[i]}">${kn}</b>として読むと<b class="big">${namesC(r.spelling)}</b><br>導音は${q(r.lt)}。`);
    PA.chord(midis(r.spelling),{dur:1.5});
    if(!await wait(1700)) return;
    A.stage=1;
    if(!r.next) upd(`<b>${i+1}.</b>導音${q(r.lt)}→${q(tonicOf(r.key))}。<b style="color:${RCOL[i]}">${kn}</b>の${resLabel(r)}におちついた！`);
    else upd(`<b>${i+1}.</b>導音${q(r.lt)}→${q(tonicOf(r.key))}。※ 第9音がいちばん下の形なので、<b style="color:${RCOL[i]}">${kn}</b>の${I64H} → Ⅴ → Ⅰとすすむよ。`);
    PA.chord(midis(r.resolution),{dur:r.next?1.4:1.9});
    if(!await wait(r.next?1300:2000)) return;
    if(r.next){
      A.stage=2;render();PA.chord(midis(r.next),{dur:1.4});if(!await wait(1300)) return;
      A.stage=3;upd(`<b>${i+1}.</b> <b style="color:${RCOL[i]}">${kn}</b>のⅠにおちついた！`);PA.chord(midis(r.fin),{dur:1.9});if(!await wait(2000)) return;
    }
  }
  A.i=rs.findIndex(r=>r.given); A.stage=0;
  upd(`🎉 同じけんばんの減七から、<b>${rs.map((r,i)=>`<span style="color:${RCOL[i]}">${PA.keyName(r.key)}</span>`).join('・')}</b>の4つの調へ行けたね！<br>名前（書き方）をかえると、行き先がかわる。これが「異名同音の読みかえ」。`);
  if(!await wait(3800)) return;
  state.anim=null; render();
}
async function playResolve(){
  const rs=readingsOf(state.keyIdx); playReading(rs.findIndex(r=>r.given));
}
// ↔️ の和音をじゅんに鳴らす
async function playGer(which){
  stop(); const my=token;
  const key=curKey(), g=gerSet(key), {v7Name,bII}=g;
  const steps=which==='ger'
    ?[{notes:g.ger,color:GER,cap:'ドイツの6'},{notes:g.gerRes[0],color:ICOL,cap:`${I64H}（Ⅰの第2転回形＝第5音がいちばん下）`},{notes:g.gerRes[1],color:VCOL,cap:'Ⅴ'}]
    :[{notes:g.v7,color:V7C,cap:`${v7Name}（♭ⅡのためのⅤ7）`},{notes:g.v7Res,color:V7C,cap:`${bII}（♭Ⅱ）`}];
  for(let i=0;i<steps.length;i++){
    state.g={steps,i}; render();
    PA.chord(midis(steps[i].notes),{dur:i===steps.length-1?2.2:1.4});
    await PA.sleep(1300); if(my!==token) return;
  }
  await PA.sleep(900); if(my!==token) return;
  state.g=null; render();
}
// どこへ行った？：減七 → 解決（けんばんには出さない）
function quizPlay(){
  const Q=state.quiz; if(!Q) return;
  stop(); render(); const my=token;
  const r=readingsOf(state.keyIdx).find(x=>x.key.tpc===Q.ans); if(!r) return;
  const seq=stagesOf(r);
  seq.forEach((ns,s)=>setTimeout(()=>{if(my===token)PA.chord(midis(ns),{dur:s===seq.length-1?2.2:1.4});},s*1300));
}
// 🔥 チャレンジの問題：同じけんばんの和音 → すすむ先（けんばんには出さない）
function gqPlay(){
  const Q=state.gq; if(!Q) return;
  stop(); render(); const my=token;
  const g=gerSet(curKey()), seq=Q.ans==='ger'?[g.ger,g.gerRes[0],g.gerRes[1]]:[g.v7,g.v7Res];
  seq.forEach((ns,s)=>setTimeout(()=>{if(my===token)PA.chord(midis(ns),{dur:s===seq.length-1?2.2:1.4});},s*1300));
}
const dimMidis=()=>midis(view().r.spelling);
function pickKey(idx,sound=true){
  if(idx!==state.keyIdx) state.gq=null; // 調がかわったら 🔥 チャレンジの問題はおしまい（音がかわるので）
  stop(); state.keyIdx=idx; state.fam=famOf(idx); state.res=0; save(); render();
  if(sound) PA.chord(dimMidis());
}

/* ===== 操作 ===== */
PA.mountBar({title:'異名同音の読みかえ',app:'enharmonic'});
PA.onSettings=render;
PA.onPageShow=()=>{stop();render();};
PA.onStopDown=stop;
PA.onStopCancel=render; // ⏹ をおしたのに click が来なかったとき画面をもどす
PA.onKeySheet=()=>PA.openKeySheet({minor:true,idx:state.keyIdx,onPick:(minor,idx)=>{
  if(Number.isInteger(idx)&&idx>=0&&idx<NK){if(famOf(idx)!==state.fam) state.quiz=null; pickKey(idx);}
}});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v, n=+v;
  if(a==='fam'){
    if(![0,1,2].includes(n)) return;
    if(n===state.fam){stop();render();PA.chord(dimMidis());return;}
    state.quiz=null; pickKey(easiestIn(n));
  }
  else if(a==='pick'){if(Number.isInteger(n)&&n>=0&&n<NK&&famOf(n)===state.fam) pickKey(n);}
  else if(a==='rplay'){ // その列の読みかたを鳴らすだけ（調はかえない）
    const i=readingsOf(state.keyIdx).findIndex(r=>r.key.idx===n);
    if(i>=0) playReading(i);
  }
  else if(a==='play'){
    if(state.anim){PA.chord(dimMidis(),{dur:2});return;} // アニメ中はとめずに鳴らす
    stop(); state.res=0; render(); PA.chord(dimMidis(),{dur:2});
  }
  else if(a==='resolve'){playResolve();}
  else if(a==='tour'){runTour();}
  else if(a==='stop'){stop();render();}
  else if(a==='gplay'){if(v==='ger'||v==='v7') playGer(v);}
  else if(a==='qnext'){
    const rs=readingsOf(state.keyIdx), prev=state.quiz&&state.quiz.ans;
    let ans; do{ans=rs[Math.floor(Math.random()*rs.length)].key.tpc;}while(ans===prev&&rs.length>1);
    state.quiz={ans,pick:null}; quizPlay();
  }
  else if(a==='qplay'){quizPlay();}
  else if(a==='gqnext'){state.gq={ans:GQ_ANS[Math.floor(Math.random()*GQ_ANS.length)],pick:null}; gqPlay();}
  else if(a==='gqplay'){gqPlay();}
  else if(a==='gqchoose'){
    const Q=state.gq; if(!Q||Q.pick!=null||!GQ_ANS.includes(v)) return;
    stop(); Q.pick=v; state.gN++; if(v===Q.ans) state.gOk++; render();
  }
  else if(a==='qchoose'){
    const Q=state.quiz; if(!Q||Q.pick!=null) return;
    if(!readingsOf(state.keyIdx).some(r=>r.key.tpc===n)) return;
    stop(); Q.pick=n; state.qN++; if(n===Q.ans) state.qOk++; render();
  }
  else if(a==='go'){
    stop(); render();
    if(v==='minor-family'){PA.store.set('minor-family',{keyIdx:state.keyIdx,fam:'DIM'});PA.go('minor-family.html');}
    else if(v==='aug6'){PA.store.set('aug6',{minor:true,keyIdx:state.keyIdx,type:'ger'});PA.go('aug6.html');}
    else if(v==='dim-halfdim'){const p=PA.store.get('dim-halfdim',{});PA.store.set('dim-halfdim',{...(p&&typeof p==='object'?p:{}),minor:true,keyIdx:state.keyIdx});PA.go('dim-halfdim.html');}
  }
});
render();
// ほかのアプリから「4つの行き先」を見に来たとき：音が出せるようになってからはじめる
// （音がとまっているあいだに音をよやくすると、あとでいっぺんに鳴ってしまう）
if(PA.store.get('enharmonic-auto',false)) (async()=>{
  PA.store.set('enharmonic-auto',false);
  const t0=token; // まっているあいだにほかの操作をしたらやめる
  if(PA.settings.sound){
    PA.audio();
    for(let i=0;i<5&&!PA.audioRunning();i++) await PA.sleep(30);
  }
  if(token!==t0) return;
  if(!PA.settings.sound||!PA.audio()||PA.audioRunning()){runTour();return;} // 音が出せないブラウザでは待たずにはじめる
  state.autoWait=true; render();
  const EV=['pointerup','touchend','keydown'];
  let busy=false;
  const off=()=>EV.forEach(t=>document.removeEventListener(t,go,true));
  async function go(e){
    if(!state.autoWait){off();return;}
    // ボタン・リンク・シート・けんばんはそれぞれの操作にまかせる
    const t=e&&e.target;
    if(t&&t.closest&&t.closest('button,a,dialog,summary,.appbar,[data-act],[data-pa],[data-m]')) return;
    if(busy) return; busy=true;
    PA.audio();
    for(let i=0;i<15&&PA.settings.sound&&!PA.audioRunning();i++) await PA.sleep(30);
    busy=false;
    if(!state.autoWait){off();return;}
    if(PA.settings.sound&&PA.audio()&&!PA.audioRunning()) return; // まだ音が出せない：つぎのタッチをまつ
    off(); runTour();
  }
  EV.forEach(t=>document.addEventListener(t,go,true));
})();
</script>
