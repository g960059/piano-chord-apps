<link rel="stylesheet" href="assets/app.css">
<style>
.hero{border-top:6px solid var(--c);scroll-margin-top:64px}
.score{font-size:16px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin-bottom:6px}
.stars{font-size:13px;letter-spacing:-.05em}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:4px 10px;flex-wrap:wrap}
.qhead .qtitle{flex:1 1 170px}
.qtitle{font-size:clamp(20px,6vw,28px);font-weight:800;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;line-height:1.3}
.qkey{background:var(--soft);border-radius:12px;padding:2px 12px}
.qbadge{min-width:56px;height:48px;font-size:clamp(17px,5vw,22px);border-radius:14px;padding:0 10px;white-space:nowrap}
.qsub{color:var(--sub);font-size:15px;margin:4px 0 0}
.sigstaff{width:130px;flex:0 0 auto;margin-left:auto}
.inst{margin:4px 0 6px;font-size:15px}
.picked{font-size:17px;margin:8px 0 0}
.picked small{display:block;font-size:13px;color:var(--sub);font-weight:400}
.fb,.msg{scroll-margin-bottom:96px;scroll-margin-top:72px}
.fb .sm{display:block;font-size:15px;margin-top:6px}
.center{justify-content:center}
.qstaff{max-width:420px;margin:4px auto 0}
.roles{margin-top:8px}
.roles .chip{font-size:14px;background:var(--soft2)}
.roles .chip.lt{background:var(--redl);color:#a3273a}
.roles .chip small{font-weight:400;color:var(--sub);margin-left:4px}
.roles .chip.lt small{color:#a3273a}
.roles .chip.lo{background:#dfeafd;color:#1d5bb8}
.roles .chip.lo small{color:#1d5bb8}
.fig{display:inline-flex;flex-direction:column;font-size:.62em;line-height:.95;vertical-align:middle;margin-left:1px;text-align:center}
.sumtx{display:flex;flex-direction:column;line-height:1.35;padding:6px 0}
.sumtx small{font-weight:400;color:var(--sub);font-size:13px}
.opt{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.opt>.lab{font-size:14px;color:var(--sub);font-weight:700}
.seg.grid4{display:grid;grid-template-columns:repeat(3,1fr);border-radius:18px}
.seg.grid4 button{padding:6px 4px;border-radius:16px}
.seg.tight button{padding:6px 6px;line-height:1.25}

.tog button.on{color:var(--c);border-color:var(--c)}
.tog button small{display:block;font-size:12px;font-weight:700;color:var(--sub)}
.opt>.grp{font-size:13px;color:var(--sub);font-weight:700;margin-top:4px}
.diff b.lo{color:#1d5bb8}

/* 聴きわけ */

.echoices.n3 .echoice:last-child{grid-column:1/-1}

  background:var(--soft2);color:var(--c);border:3px solid transparent;font-weight:800;line-height:1.25;text-align:center}

.echoice .em{font-size:30px;line-height:1.1}
.echoice .wd{font-size:19px}
.echoice .lb{font-size:14px;font-weight:700;opacity:.85}
.echoice.right{background:#dcf5e8;border-color:var(--ok);color:#137a4f}
.echoice.wrong{background:#fde4e7;border-color:var(--ng);color:#a3273a}

.fb.still{animation:none}

.cmpbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:8px 14px;border-radius:16px;background:var(--soft2);text-align:left;border-left:6px solid var(--c)}

/* スマホを 横にしたとき：こたえの ボタンを 少し ひくく（上下の バーの あいだに おさまるように） */

<header class="appbar" id="appbar"></header>
<main class="page" id="view"></main>
<div class="actionbar" id="actions"></div>
<script src="assets/core.js"></script>
<script>
/* 変化和音クイズ：Ⅱ7・ドッペルドミナント・減七/Ⅴ・増六（イタリア・フランス・ドイツ）・ナポリの六・準固有（Ⅳm・♭Ⅵ）・
 *   副属和音（Ⅴ7/x）・Ⅶ7（半減七・減七）を 🎹 けんばんで おさえる ／ 👂 ひびきで 聴きわける。
 *   和音の つづりと 高さは ぜんぶ PA.chroma・PA.henka から（ほかの ページと そろえる）
 *   保存（'chroma-quiz'）の 形は まえと おなじ（types に 新しい 和音が ふえただけ・earLv に 3 が ふえただけ） */
const C=PA.chroma, H=PA.henka, mod=PA.mod;
const T={
  ii7: {label:'Ⅱ7',     long:'Ⅱ7（にどしち）',             sub:'調の音だけで つくる Ⅱ の 七の和音', color:'#22a06b', emoji:'🌿', word:'やわらかい'},
  dd:  {label:'ドッペル', long:'ドッペルドミナント（Ⅴ7/Ⅴ）', sub:'Ⅴ の ための Ⅴ7',                 color:'#8a4fe0', emoji:'🧲', word:'Ⅴを つよく よぶ'},
  ddim:{label:'減七/Ⅴ',  long:'減七/Ⅴ（Ⅴ9/Ⅴ の 根音を はぶいた形）',  sub:'Ⅴ9/Ⅴ から 根音を はぶいた形',     color:'#b0307a'},
  it:  {label:'イタリア', long:'イタリアの6',                 sub:'増六の和音・根音なし',             color:'#1f8a99', emoji:'🍕', word:'うすい・かるい'},
  fr:  {label:'フランス', long:'フランスの6',                 sub:'増六の和音・根音あり',             color:'#5b5fc7', emoji:'🥐', word:'ふしぎ・ふわっと'},
  ger: {label:'ドイツ',   long:'ドイツの6',                   sub:'増六の和音・短9度つき',            color:'#9a5b13', emoji:'🥨', word:'こい・Ⅴ7みたい'},
  // ここから 変化和音（PA.henka）。only＝その 調だけで 出る、tg＝副属和音の 目標（度数）、staff＝がくふの 和音記号
  n6:  {label:'ナポリ',   long:'ナポリの六',                  sub:'♭Ⅱ の 第1転回形（いちばん下は 第3音）', color:'#c4462a', emoji:'🌋', word:'ドラマチック', staff:'N6'},
  iv:  {label:'Ⅳ',       long:'Ⅳ（ふつうの Ⅳ）',            sub:'調の音だけの Ⅳ',                   color:'#22a06b', emoji:'☀️', word:'あかるい'}, // 聴きわけ レベル3 だけ
  ivm: {label:'Ⅳm',      long:'Ⅳm（準固有の ○Ⅳ）',         sub:'同主短調から かりた Ⅳ',             color:'#3d63b8', emoji:'🌙', word:'せつない', staff:'○Ⅳ', only:'major'},
  bvi: {label:'♭Ⅵ',      long:'♭Ⅵ（準固有の ○Ⅵ）',         sub:'同主短調から かりた Ⅵ',             color:'#7a4cc2', staff:'○Ⅵ', only:'major'},
  s2:  {label:'Ⅴ7/Ⅱ',    tg:2, color:'#b85c00', only:'major'},
  s3:  {label:'Ⅴ7/Ⅲ',    tg:3, color:'#b85c00', only:'minor'},
  s4:  {label:'Ⅴ7/Ⅳ',    tg:4, color:'#b85c00'},
  s6:  {label:'Ⅴ7/Ⅵ',    tg:6, color:'#b85c00'},
  vii7:{label:'Ⅶ7',      long:'Ⅶ7',                          sub:'導音を 根音に した 七の和音（Ⅴ9 の 根音を はぶいた 形）', color:'#0f7a72', staff:'Ⅶ7'}
};
// 設定で ならべる まとまり（TYPES の じゅんばんも これ。まえからの 6つが さき）
const GROUPS=[['ドッペル・増六',['ii7','dd','ddim','it','fr','ger']],['ナポリ・準固有',['n6','ivm','bvi']],['副属和音',['s2','s3','s4','s6']],['半減七・減七',['vii7']]];
const TYPES=GROUPS.flatMap(g=>g[1]), AUG=['it','fr','ger'];
const NEWT=['n6','ivm','bvi','s2','s3','s4','s6','vii7','iv'];
const isNew=t=>NEWT.includes(t);
const okFor=(t,minor)=>!T[t].only||(T[t].only==='minor')===minor; // その 調で 出せる 和音か
const LEVELS=[[0,'なし'],[1,'1つまで'],[2,'2つまで'],[3,'3つまで'],[4,'4つまで'],[7,'ぜんぶ']];
const KEYSETS=[['major','長調'],['minor','短調'],['both','りょうほう']];
const EAR_LV={1:['ii7','dd'],2:['it','fr','ger'],3:['iv','ivm','n6']};
const EAR_SHIFT={1:[0,12],2:[0,12],3:[0]}; // 毎回 高さを かえる（オクターブ）。レベル3は カデンツが 音域いっぱいなので 調だけ かえる
const KB_LO=45, KB_HI=76; // ラ2〜ミ5：けんばんは すくなくとも この はんい（こたえの 音が はみ出す もんだいは そこまで ひろげる）
const LT_C='#d1495b', LOW_C='#2f7ee8', V_C='#3b4fa8'; // 赤＝Ⅴへの導音・上げた音、青＝下げた第5音、Ⅴ（aug6.html と おなじ）
const isRed=n=>n.tag==='lt'||n.tag==='raised'; // 赤：Ⅴへの導音・半音上げた音（doppel.html と おなじ）
const isLow=n=>n.tag==='low'; // 青：半音下げた 第5音（aug6.html と おなじ）
// Ⅱ7・ドッペルは doppel.html と おなじ 根音・第3音・第5音・第7音 の じゅんで 名前を ならべる（がくふと 音は 和音の ならびの まま）
const byRole=ns=>[ns[0],ns[3],ns[1],ns[2]];
// 変化和音は 根音・第3音・第5音・第7音 の じゅんに、おなじ 音（重ねた音）は 1つだけ
const RANK=['根音','第3音','第5音','第7音','第9音'];
const rank=n=>{const i=RANK.findIndex(p=>n.role.startsWith(p));return i<0?9:i;};
const roleSort=ns=>{const seen=new Set();return [...ns].sort((a,b)=>rank(a)-rank(b)).filter(n=>{const p=mod(n.midi,12);if(seen.has(p))return false;seen.add(p);return true;});};
const disp=(t,ns)=>t==='ii7'||t==='dd'?byRole(ns):isNew(t)?roleSort(ns):ns;
const nPc=ns=>new Set(ns.map(n=>mod(n.midi,12))).size; // 音の数（重ねた音は 1つ）
const I64H='Ⅰ<span class="fig"><span>6</span><span>4</span></span>';
const labH=s=>s==='Ⅰ6/4'?I64H:s; // HTML の 文では Ⅰ6/4 を 重ねて 書く
const keyOfQ=q=>PA.keyOf(q.minor,q.keyIdx);
const isInt=(v,lo,hi)=>Number.isInteger(v)&&v>=lo&&v<=hi;
const isBlack=m=>PA.BLACK.has(mod(m,12));
// 主音から letterOff 文字・semis 半音 上の 音の つづり（ヒントで 名前を 出すため）
const tn=(key,lo,semis)=>{const L=(key.l+lo)%7;return {letter:L,acc:PA.spell(L,key.tpc+semis)};};
const rel=(key,m)=>mod(m-key.tpc,12); // 主音から なん半音（ピッチクラスの くらべっこ だけに つかう）
// 音名の とちゅう（「ファ」と「♯」の あいだ など）で 改行しない。折りかえすのは「・」の あとだけ
const nwH=s=>`<span class="nw">${s}</span>`;
const namesN=ns=>ns.map(n=>nwH(PA.nmH(n))).join('・');
// その もんだいの けんばん：KB_LO〜KB_HI を ふくみ、こたえの 音（鳴らす 高さ）が ぜんぶ 入る はんい（はしは 白鍵）
function kbOf(key,t){
  const ms=chordOf(key,t).map(n=>n.midi);
  let lo=Math.min(KB_LO,...ms), hi=Math.max(KB_HI,...ms);
  while(isBlack(lo)) lo--; while(isBlack(hi)) hi++;
  return [lo,hi];
}
// ヒントの わくの 音を けんばんの 中へ（オクターブで うつす。こたえの 音は kbOf の 中なので そのまま）
const inKb=(m,[lo,hi]=[KB_LO,KB_HI])=>{while(m<lo)m+=12;while(m>hi)m-=12;return m;};
// 和音の 名前（調で かわる もの：Ⅴ7/Ⅲ（自然）、Ⅶ7 の 半減七・減七）
const labOf=(key,t)=>T[t].tg?H.label(key,'secondary',T[t].tg,'V7'):t==='vii7'?(key.minor?'Ⅶ7（減七）':'Ⅶ7（半減七）'):t==='n6'?T[t].long:T[t].label;
const longOf=(key,t)=>T[t].tg?'副属和音 '+labOf(key,t):t==='vii7'?labOf(key,t):T[t].long;
const subOf=(key,t)=>T[t].tg?`${H.label(key,'target',T[t].tg)} を いっときの 主和音に する Ⅴ7`:T[t].sub;
const staffLab=t=>T[t].tg?'Ⅴ7/'+H.ROMAN[T[t].tg-1]:T[t].staff||T[t].label;
// 色：赤＝半音上げた音（Ⅶ7 は 導音）、青＝半音下げた音（調号から 見て）。まえからの 和音は doppel.html・aug6.html と おなじ
function hl(key,t,n){
  if(!isNew(t)) return isRed(n)?'red':isLow(n)?'blue':null;
  if(t==='vii7') return n.tag==='lt'?'red':null;
  const s=key.sig[n.letter]||0;
  return n.acc>s?'red':n.acc<s?'blue':null;
}

/* ===== 和音（PA.chroma・PA.henka） ===== */
function chordOf(key,t){
  if(t==='ii7') return C.ii7(key);
  if(t==='dd') return C.dd(key);
  if(t==='ddim') return C.ddStack(key,'ddim');
  if(t==='n6') return H.neapolitan(key);
  if(t==='ivm') return H.borrowed(key,'iv');
  if(t==='bvi') return H.borrowed(key,'bVI');
  if(T[t]&&T[t].tg) return H.secondary(key,T[t].tg,'V7');
  if(t==='vii7') return H.vii7(key,'vii'); // 名前は Ⅶ7 から 見た もの（導音＝根音）
  if(t==='iv') return cadOf(key,'iv').X;
  return C.aug6(key,t);
}
/* 聴きわけ レベル3：長調の カデンツ Ⅰ → X → Ⅴ7 → Ⅰ（X＝Ⅳ・Ⅳm・ナポリの六）
 *   ナポリの六（PA.henka.neapolitan：[4 | 4, ♭6, ♭2]）と おなじ ならび・高さで、
 *   Ⅳm＝いちばん上の ♭2 を 主音に（[4 | 4, ♭6, 1]）、Ⅳ＝さらに ♭6 を ♮6 に（[4 | 4, 6, 1]）。
 *   となりどうし（Ⅳ↔Ⅳm・Ⅳm↔ナポリ）は 1つの 音だけ ちがうので、ひびきの ちがいだけを くらべられる。
 *   どれも n6ToV7 の Ⅴ7（第5音なし）[5 | 4, 5, 7] へ すすむ（neapolitan.html の すぐ すすむ ときと おなじ）。
 *   はじめと おわりの Ⅰ＝[1 | 3, 5, 1]（上の声は ナポリの 上の声の 半音下。Ⅴ7 からは 4→3、5→5、7→1 で おなじ 高さに もどる） */
function cadOf(key,t){
  const n6=H.neapolitan(key), V=n6ToV7(key), [b,u4,u6,u2]=n6;
  const at=(n,lo,semis,d,role,tag)=>({...tn(key,lo,semis),midi:n.midi+d,role,tag:tag||null});
  const X=t==='n6'?n6:[at(b,3,5,0,'根音（いちばん下）'),at(u4,3,5,0,'根音'),
    t==='iv'?at(u6,5,9,1,'第3音'):at(u6,5,8,0,'第3音（下げた 第6音）','borrowed'),at(u2,0,0,-1,'第5音')];
  const ib=b.midi-5>=40?b.midi-5:b.midi+7; // Ⅰ の ベース：Ⅳ の 根音の 4度下（低すぎれば 5度上）
  const I=[at(b,0,0,ib-b.midi,'Ⅰの根音'),at(u4,2,4,-1,'Ⅰの第3音'),at(u6,4,7,-1,'Ⅰの第5音'),at(u2,0,0,-1,'Ⅰの根音')];
  return {I,X,V};
}
// ナポリの六 → Ⅴ7（第5音なし。neapolitan.html の toV7 と おなじ 音）：ベースは 上へ、上の 第4音は そのまま のこって 第7音に、
//   ♭6 → 第5音（Ⅴの根音）、♭2 → 導音（減3度 下へ）。PA.henka.toV の Ⅴ 三和音だと ♭2 の すぐあとに アルトで ♮2 が 鳴る 対斜に なる
function n6ToV7(key){
  const [b,u4,u6,u2]=H.neapolitan(key);
  const mk=(n,d,lo,semis,role,tag)=>({...tn(key,lo,semis),midi:n.midi+d,role,tag:tag||null});
  return [mk(b,2,4,7,'Ⅴの根音'),{...u4,role:'Ⅴの第7音',tag:'seventh'},mk(u6,-1,4,7,'Ⅴの根音'),mk(u2,-2,6,11,'Ⅴの第3音（導音）','lt')];
}
// 減七/Ⅴ → Ⅴ（core に ないので ここで）：導音は 半音上、第5音は 全音下、第7音・第9音は 半音下
function ddimToV(key){
  const [l3,l5,l7,l9]=C.ddStack(key,'ddim');
  const mk=(n,d,lo,semis,role)=>({...tn(key,lo,semis),midi:n.midi+d,role,tag:null});
  return [mk(l3,1,4,7,'Ⅴの根音'),mk(l5,-2,4,7,'Ⅴの根音'),mk(l7,-1,6,11,'Ⅴの第3音'),mk(l9,-1,1,14,'Ⅴの第5音')];
}
// つぎの 和音（ならびは まえの 和音と おなじ ＝ おなじ ばんごうの 音が すすむ）
function stepsOf(key,t){
  if(t==='ii7'||t==='dd') return [{label:'Ⅴ',notes:C.toV(key)}];
  if(t==='ddim') return [{label:'Ⅴ',notes:ddimToV(key)}];
  if(t==='n6') return [{label:'Ⅴ7',notes:n6ToV7(key)}];
  if(t==='ivm') return [{label:'Ⅰ',notes:H.nextOf(key,'iv')}];
  if(t==='bvi') return [{label:'Ⅴ',notes:H.nextOf(key,'bVI')}];
  if(T[t].tg) return [{label:H.ROMAN[T[t].tg-1],notes:H.resolveSecondary(key,T[t].tg,'V7')}];
  if(t==='vii7') return [{label:'Ⅰ',notes:H.vii7ToI(key)}];
  if(t==='ger') return [{label:'Ⅰ6/4',notes:C.gerToI64(key)},{label:'Ⅴ',notes:C.aug6ToV(key,'ger')}];
  return [{label:'Ⅴ',notes:C.aug6ToV(key,t)}];
}
const shiftN=(ns,s)=>ns.map(n=>({...n,midi:n.midi+s}));
const uniqM=ns=>ns.filter((n,i)=>ns.findIndex(x=>x.midi===n.midi)===i);

/* ===== 状態（せってい・スコア・いまの もんだいは 保存する） ===== */
const Q={mode:'keys',keyset:'major',level:1,types:Object.fromEntries(TYPES.map(t=>[t,t==='ii7'||t==='dd'])),earLv:1,openSet:false,
  sc:{keys:{right:0,total:0,streak:0},ear:{right:0,total:0,streak:0}},
  q:null,qid:0,picked:new Set(),checked:false,result:null,lastOk:null,hint:0,
  eq:null,ans:null,resShown:false,eqid:0,fresh:false};
const saved=(d=>d&&typeof d==='object'?d:{})(PA.store.get('chroma-quiz',{}));
function poolKeys(both){
  const out=[], sets=both||Q.keyset==='both'?[false,true]:[Q.keyset==='minor'];
  sets.forEach(mi=>{for(let i=0;i<PA.keyCount(mi);i++) if(PA.sigInfo(PA.keyOf(mi,i)).letters.length<=Q.level) out.push({minor:mi,keyIdx:i});});
  return out;
}
// えらんだ 調では 出せない 和音だけの ときは（短調で Ⅳm だけ など）、長調・短調の りょうほうから えらぶ（＝その 和音が 出る 調だけに なる）
const poolOf=ks=>{const ts=TYPES.filter(t=>Q.types[t]), out=[];ks.forEach(k=>ts.forEach(t=>{if(okFor(t,k.minor)) out.push({...k,type:t});}));return out;};
const poolFallback=()=>!poolOf(poolKeys()).length;
const pool=()=>{const P=poolOf(poolKeys());return P.length?P:poolOf(poolKeys(true));};
// レベル3（Ⅳ・Ⅳm・ナポリ）は 長調だけ
const earKeys=lv=>{const out=[], sets=lv===3?[false]:Q.keyset==='both'?[false,true]:[Q.keyset==='minor'];sets.forEach(mi=>{for(let i=0;i<PA.keyCount(mi);i++) out.push({minor:mi,keyIdx:i});});return out;};
(function load(){
  const d=saved;
  if(['keys','ear'].includes(d.mode)) Q.mode=d.mode;
  if(KEYSETS.some(([v])=>v===d.keyset)) Q.keyset=d.keyset;
  if(LEVELS.some(([v])=>v===d.level)) Q.level=d.level;
  if(d.types&&typeof d.types==='object'){
    const t={}; TYPES.forEach(k=>t[k]=d.types[k]===true);
    if(TYPES.some(k=>t[k])) Q.types=t;
  }
  if([1,2,3].includes(d.earLv)) Q.earLv=d.earLv;
  Q.openSet=d.openSet===true;
  ['keys','ear'].forEach(m=>{const s=d.sc&&d.sc[m];if(s&&isInt(s.total,0,1e6)&&isInt(s.right,0,s.total)&&isInt(s.streak,0,s.right)) Q.sc[m]={right:s.right,total:s.total,streak:s.streak};});
  // まだ こたえていない もんだいは そのまま つづける（「つくりかたを見る」から もどったとき）
  const q=d.q;
  if(q&&typeof q==='object'&&!d.answered&&typeof q.minor==='boolean'&&isInt(q.keyIdx,0,PA.keyCount(q.minor)-1)&&TYPES.includes(q.type)
     &&pool().some(p=>p.minor===q.minor&&p.keyIdx===q.keyIdx&&p.type===q.type)){
    startQ({minor:q.minor,keyIdx:q.keyIdx,type:q.type});

  }
  const e=d.eq;
  if(e&&typeof e==='object'&&e.lv===Q.earLv&&typeof e.minor==='boolean'&&isInt(e.keyIdx,0,PA.keyCount(e.minor)-1)
     &&EAR_LV[e.lv].includes(e.type)&&EAR_SHIFT[e.lv].includes(e.shift)&&(e.lv===3?e.minor===false:(Q.keyset==='both'||e.minor===(Q.keyset==='minor')))){
    Q.eq={lv:e.lv,minor:e.minor,keyIdx:e.keyIdx,type:e.type,shift:e.shift}; Q.eqid=1;
    if(EAR_LV[e.lv].includes(d.ans)) Q.ans=d.ans;

})();
function save(){
  PA.store.set('chroma-quiz',{mode:Q.mode,keyset:Q.keyset,level:Q.level,types:Q.types,earLv:Q.earLv,openSet:Q.openSet,sc:Q.sc,
    q:Q.q?{minor:Q.q.minor,keyIdx:Q.q.keyIdx,type:Q.q.type}:null,answered:Q.checked,scored:Q.result!==null,
    eq:Q.eq,ans:Q.ans,resShown:Q.resShown});

const score=(m,ok)=>{const s=Q.sc[m];s.total++;if(ok){s.right++;s.streak++;}else s.streak=0;};

/* ===== 🎹 おさえる：もんだい ===== */
function startQ(q){Object.assign(Q,{q,qid:Q.qid+1,picked:new Set(),checked:false,result:null,lastOk:null,hint:0});}
function newQ(){
  const P=pool(); if(!P.length) P.push({minor:false,keyIdx:0,type:'ii7'});
  let q,tries=0;
  do{q=P[Math.floor(Math.random()*P.length)];}
  while(Q.q&&P.length>1&&q.minor===Q.q.minor&&q.keyIdx===Q.q.keyIdx&&q.type===Q.q.type&&++tries<30);
  startQ(q);
}
// おさえた音を ピッチクラスで くらべる（どの オクターブでも OK）
function grade(key,t){
  const ans=chordOf(key,t), A=new Set(ans.map(n=>rel(key,n.midi))), P=new Set([...Q.picked].map(m=>rel(key,m)));
  const extra=[...P].filter(r=>!A.has(r)), missing=[...A].filter(r=>!P.has(r));
  return {ans,A,P,extra,missing,ok:!extra.length&&!missing.length,count:P.size};
}
// 副属和音で 調号どおりの こたえの 音 n を おさずに、となりの 音（d＝+1 上・-1 下）を おしたとき、その 音を n と おなじ 文字で 書く
//   （ハ長調の Ⅴ7/Ⅵ で 第7音「レ」を 上げすぎた 音は「レ♯」）。ミ♯・シ♯・ファ♭・ド♭ や 重嬰・重変に なるときは null（ふつうの つづりで）
const oddSp=n=>Math.abs(n.acc)>1||(n.acc===-1&&(n.letter===0||n.letter===3))||(n.acc===1&&(n.letter===2||n.letter===6));
const nbSp=(n,d)=>{const x={letter:n.letter,acc:n.acc+d};return oddSp(x)?null:x;};
// 副属和音の こたえあわせ：調号どおりの 音を おさずに となりを おした ところ [{n, d, r}]
function secNb(key,t,g){
  const out=[];
  if(!g||!T[t].tg) return out;
  chordOf(key,t).forEach(n=>{
    const p=rel(key,n.midi); if(g.P.has(p)||n.acc!==(key.sig[n.letter]||0)) return;
    [1,-1].forEach(d=>{const r=mod(p+d,12);if(g.P.has(r)&&!g.A.has(r)&&!out.some(o=>o.r===r)) out.push({n,d,r});});
  });
  return out;
}
// おさえた音の 名前：こたえの つづり →（副属和音の こたえあわせ：となりを おした 音）→ よく まちがえる 音の つづり → 調の つづり
function spellBook(key,t,g){
  const b=new Map(), add=n=>{const r=mod(PA.NAT[n.letter]+n.acc-key.tpc,12);if(!b.has(r)) b.set(r,n);};
  chordOf(key,t).forEach(add);
  secNb(key,t,g).forEach(({n,d})=>{const x=nbSp(n,d);if(x) add(x);});
  // 変化和音：まちがえて おした 調の 音は 調の つづりで（副属和音で「よその 調」と くらべる ため）。そのあと 下げた 2・3・6・7 番め
  if(isNew(t)){[...(key.minor?[...key.nat,key.harm[6]]:key.scale)].forEach(add);[tn(key,1,1),tn(key,2,3),tn(key,5,8),tn(key,6,10)].forEach(add);}
  C.ddStack(key,'dd9').forEach(add);
  [tn(key,3,5),tn(key,4,7),tn(key,5,8),tn(key,5,9),tn(key,2,4),tn(key,2,3),tn(key,1,2)].forEach(add);
  return b;
}
const nameOf=(m,key,book)=>{const n=book.get(rel(key,m));return PA.nm(n?{letter:n.letter,acc:n.acc}:PA.spellMidi(m,key));};
const parName=key=>PA.keyName({l:key.l,a:key.a,minor:true});
// 副属和音の 手がかり：目標の 和音・その音を 主音と する 調（いっときの 調）
function secInfo(key,t){
  const tg=T[t].tg, ans=chordOf(key,t), tr=H.targetTriad(key,tg)[0];
  return {tg,ans,tr,root:ans.find(n=>n.role==='根音'),lt:ans.find(n=>n.tag==='lt'),sev:ans.find(n=>n.tag==='seventh'),
    tk:PA.keyName({l:tr.letter,a:tr.acc,minor:H.targetIsMinor(key,tg)}),rn:H.ROMAN[tg-1],lab:labOf(key,t)};

const at0=(key,lo,semis)=>({...tn(key,lo,semis),midi:key.tonicMidi+semis}); // 主音の 高さから（ヒントの わく用）
function recipeNew(key,t){

  if(t==='ivm') return `Ⅳ（${namesN([tn(key,3,5),tn(key,5,9),tn(key,7,12)])}）の <b>第3音を 半音下げる</b>。${par}から かりた 音だよ。`;
  if(t==='bvi') return `6ばんめと 3ばんめを <b>半音下げて</b>、「${nm(tn(key,5,8))}」から ひとつとばしに 3つ（${par}の Ⅵ と おなじ 音）。`;
  if(T[t].tg){const S=secInfo(key,t);return `${S.rn}「${nm(S.tr)}」を 主音と する <b>${S.tk}</b>の Ⅴ7 を つくろう。根音は「${nm(S.tr)}」の 5度上の「${nm(S.root)}」。`;}
  if(t==='vii7') return key.minor
    ?`<b>導音</b>「${nm(tn(key,6,11))}」（音階の 7ばんめを 半音上げた 音）から ひとつとばしに 4つ。上の 音は 調号どおり（減七）。`
    :`<b>導音</b>「${nm(tn(key,6,11))}」から、調の 音だけで ひとつとばしに 4つ（半減七）。`;

function recipe(key,t){
  const ii=C.ii7(key);
  if(isNew(t)) return recipeNew(key,t);
  switch(t){
    case 'ii7': return `音階の <b>2ばんめ</b>「${PA.nmH(ii[0])}」から、調の音だけで ひとつとばしに 4つ。`;
    case 'dd': return `Ⅱ7 の <b>第3音を 半音上げる</b>${key.minor?'（短調では <b>第5音も</b> 半音上げる）':''}。上げた 第3音は Ⅴ の 導音に なるよ。`;
    case 'ddim': return `ドッペルに <b>第9音（短9度）</b>を のせて、<b>根音を はぶく</b>。`;
    case 'it': return `ドッペルの <b>第5音を 半音下げて</b> いちばん下へ。<b>根音は はぶいて</b> 3つ。`;
    case 'fr': return `ドッペルの <b>第5音を 半音下げて</b> いちばん下へ。<b>根音は のこして</b> 4つ。`;
    case 'ger': return `Ⅴ9/Ⅴ（短9度つき）の <b>第5音を 半音下げて</b> いちばん下へ。<b>根音は はぶいて</b> 4つ。`;
  }

// ヒント2で オレンジの わくで 見せる「もとの 和音」
function baseOf(key,t){
  if(t==='ii7') return {name:'いちばん下の 根音',notes:[C.ii7(key)[0]],root:true};
  if(t==='dd') return {name:'Ⅱ7',notes:byRole(C.ii7(key))};
  if(t==='ddim'||t==='ger') return {name:'Ⅴ9/Ⅴ',notes:C.ddStack(key,'dd9')};
  if(t==='n6') return {name:'Ⅱ',notes:[at0(key,1,2),at0(key,3,5),at0(key,5,key.minor?8:9)]};
  if(t==='ivm') return {name:'Ⅳ',notes:[at0(key,3,5),at0(key,5,9),at0(key,7,12)]};
  if(t==='bvi') return {name:'Ⅵ',notes:[at0(key,5,9),at0(key,7,12),at0(key,9,16)]};
  if(T[t].tg) return {name:'根音',notes:[secInfo(key,t).root],root:true};
  if(t==='vii7') return {name:'根音',notes:[chordOf(key,t)[0]],root:true};

}
// 変化和音の こたえあわせの ヒント（r＝主音から 見た ピッチクラス。くらべる ためだけに つかい、ことばには 出さない）
function hintsNew(key,t,g,book){
  const L=[], has=r=>g.P.has(r), miss=r=>g.A.has(r)&&!g.P.has(r), nm=PA.nmH, par=parName(key);
  const D2=tn(key,1,2), L2=tn(key,1,1), F4=tn(key,3,5), N6=tn(key,5,9), L6=tn(key,5,8), M3=tn(key,2,4), L3=tn(key,2,3), I1=tn(key,0,0);
  if(t==='n6'){
    if(miss(1)&&has(2)) L.push(`音階の 2ばんめ「${nm(D2)}」を <b>半音下げる</b>のを わすれていない？ ナポリの六の 根音は「${nm(L2)}」だよ。`);
    if(miss(8)&&has(9)) L.push(key.minor?`第5音は 調号どおり「${nm(L6)}」だよ。`:`第5音は「${nm(N6)}」では なく「${nm(L6)}」。長調でも ${par}から かりて <b>半音下げた 6ばんめ</b>を つかうよ。`);
    if(miss(1)&&has(0)&&!has(2)){
      // おさえた 6ばんめで 名前を きめる（長調：♭6＝Ⅳm（○Ⅳ）・6＝Ⅳ、短調：♭6＝Ⅳ）。どちらも ないときは 名前を 出さない
      const c=!has(5)?null:key.minor?(has(8)?'Ⅳ':null):has(8)?'Ⅳm（○Ⅳ）':has(9)?'Ⅳ':null, two=!key.minor&&c==='Ⅳ';
      L.push(`${c?`それは ${c}。`:''}${two?`ナポリの六に するには <b>2つの 音</b>を かえるよ：「${nm(N6)}」→「${nm(L6)}」と、`:''}上の「${nm(I1)}」の かわりに 半音上の「${nm(L2)}」${two?'。':'に すると ナポリの六に なるよ。'}`);
    }
    if(miss(5)&&(has(4)||has(6))) L.push(`いちばん下に おく 第3音は 調の 4ばんめ「${nm(F4)}」だよ。`);
  }
  if(t==='ivm'){
    if(miss(8)&&has(9)) L.push(`第3音「${nm(N6)}」のままだと ふつうの Ⅳ。<b>半音下げて</b>「${nm(L6)}」に しよう。${par}から かりた 音だよ。`);
    if(miss(0)&&has(1)) L.push(has(5)&&has(8)?`それは ナポリの六。Ⅳm の 第5音は「${nm(I1)}」のまま だよ。`:`Ⅳm の 第5音は「${nm(I1)}」のまま。半音上げなくて いいよ。`);
    else if((miss(5)&&has(4))||(miss(0)&&has(11))) L.push(`半音下げるのは <b>第3音</b>（6ばんめの 音）だけ だよ。`);
  }
  if(t==='bvi'){
    if(miss(8)&&has(9)) L.push(`根音は 6ばんめ「${nm(N6)}」を <b>半音下げた</b>「${nm(L6)}」。${par}から かりた 音だよ。`);
    if(miss(3)&&has(4)) L.push(`第5音も 3ばんめ「${nm(M3)}」を <b>半音下げて</b>「${nm(L3)}」に。♭Ⅵ は ${par}の Ⅵ と おなじ 音だよ。`);
    if(miss(0)&&has(11)) L.push(`第3音は 主音「${nm(I1)}」のまま。♭Ⅵ は 長三和音だよ。`);
  }

    const LT=tn(key,6,11), B7=tn(key,6,10);
    if(!key.minor&&miss(9)&&has(8)) L.push(`それは <b>減七</b>（長調では ${par}から かりる ○Ⅶ7）。長調の Ⅶ7 は <b>半減七</b>：第7音は「${nm(N6)}」のまま だよ。`);
    if(key.minor&&miss(8)&&has(9)) L.push(`それは <b>半減七</b>（長調の Ⅶ7 の 形）。短調の Ⅶ7 は <b>減七</b>：第7音は 調号どおり「${nm(L6)}」だよ。`);
    if(key.minor&&miss(11)&&has(10)) L.push(`根音は <b>導音</b>。音階の 7ばんめ「${nm(B7)}」を 半音上げて「${nm(LT)}」に しよう（和声的短音階）。`);

// 副属和音：ちがう 目標の Ⅴ7 を つくった／よその 調（もとの 調）の 音の まま・上げすぎ 下げすぎ
function secHints(key,t,g,book){
  const L=[], has=r=>g.P.has(r), nm=PA.nmH, S=secInfo(key,t), home=PA.keyName(key);
  const same=set=>set.size===g.P.size&&[...set].every(r=>g.P.has(r));
  if(same(new Set([7,11,2,5]))){L.push(`それは この 調の <b>Ⅴ7</b>。${S.lab} は ${S.rn}「${nm(S.tr)}」の <b>5度上</b>「${nm(S.root)}」が 根音だよ。`);return L;}
  for(const x of H.targets(key)){
    if(x===S.tg) continue;
    const ns=H.secondary(key,x,'V7'); if(!ns||!same(new Set(ns.map(n=>rel(key,n.midi))))) continue;
    L.push(`それは <b>${x===5?'Ⅴ7/Ⅴ（ドッペル）':H.label(key,'secondary',x,'V7')}</b>。${S.lab} は ${S.rn}「${nm(S.tr)}」の <b>5度上</b>「${nm(S.root)}」が 根音だよ。`);
    return L;
  }

    const p=rel(key,n.midi); if(g.P.has(p)) return;
    const s=key.sig[n.letter]||0, hk={letter:n.letter,acc:s}, up=mod(p+1,12), dn=mod(p-1,12);

    else if(n.acc<s&&has(up)) L.push(`「${nm(hk)}」は ${home}の 音。${S.tk}の Ⅴ7 では <b>半音下げて</b>「${nm(n)}」に するよ。`);
    else if(n.acc>s&&has(up)&&!g.A.has(up)) L.push(`上げすぎ！ ${role}は「${nm(hk)}」を <b>半音上げた</b>「${nm(n)}」${lt}だよ。`);
    else if(n.acc<s&&has(dn)&&!g.A.has(dn)) L.push(`下げすぎ！ ${role}は「${nm(hk)}」を <b>半音下げた</b>「${nm(n)}」だよ。`);
    else if(n.acc===s&&(has(up)||has(dn))){
      const d=has(up)?1:-1, x=nbSp(n,d);
      L.push(`「${x?nm(x):PA.H(nameOf(key.tonicMidi+(d>0?up:dn),key,book))}」に しなくて いいよ。${S.tk}の Ⅴ7 なので ${role}は「${nm(n)}」のまま。`);
    }
  });
  if(!L.length&&!g.P.has(rel(key,S.root.midi))) L.push(`根音は ${S.rn}「${nm(S.tr)}」の 5度上の「${nm(S.root)}」。${S.tk}の Ⅴ7 だよ。`);
  return L;
}
// こたえあわせの メッセージ（描くたびに つくるので、音名の 設定を かえても あう）

function symNew(key,t){

}

    :`${par}から 第7音を かりて「${nm(tn(key,5,8))}」に すると 減七（○Ⅶ7）に なるよ。`);

function okExtra(key,t,ans){
  if(isNew(t)) return okExtraNew(key,t,ans);

// ドイツの6 は けんばんでは ♭Ⅱ の Ⅴ7 と おなじ音（つづりと すすみかたが ちがう）
function gerTwin(key){
  const g=C.aug6(key,'ger'), lo=g[0], up=g[3], L7=(lo.letter+6)%7, s7={letter:L7,acc:PA.spell(L7,PA.NAT[up.letter]+up.acc)};
  const nm=n=>PA.LET_EN[n.letter]+PA.ACC[n.acc];
  // C♭・F♭・B𝄫 などに なる 調では、けんばんの ふつうの 名前（B7・E7・A7・D7）で くらべる
  const odd=n=>Math.abs(n.acc)>1||(n.acc===-1&&(n.letter===0||n.letter===3))||(n.acc===1&&(n.letter===2||n.letter===6));
  const tw=PA.H(nm(odd(lo)?PA.spellMidi(lo.midi,PA.keyOf(false,0)):lo)+'7');
  let s=`けんばんでは <b>${tw}</b> と おなじ音${odd(lo)||Math.abs(s7.acc)>1?'':`（「${PA.nmH(up)}」を「${PA.nmH(s7)}」と 書くと ${tw}）`}。でも 書きかたも すすむ先も ちがうよ。`;
  const alt=C.gerMajorAlt(key);
  if(alt) s+=`<br>長調で ${I64H} へ すすむときは「${PA.nmH(g[2])}」を「${PA.nmH(alt[2])}」と 書くことも あるよ（おなじ けんばん）。`;
  return s;
}
function keysFb(key,t){

function checkKeys(){

/* ===== 図 ===== */
// 調号だけの 小さな 五線（こたえる前に 見せる）。上下の あきを けずって 低くする
const sigStaff=key=>PA.staffSVG(key,[],{minW:130,maxScale:1}).replace(/viewBox="0 0 (\d+(?:\.\d+)?) \d+(?:\.\d+)?"/,'viewBox="0 38 $1 100"');
// 大譜表：和音 → つぎの 和音。導音・下げた音は 赤。導音が ト音記号の 中で すすむときは 矢印
// 変化和音（t）は 赤＝半音上げた音、青＝半音下げた音（どちらか 一方しか 出ない）。矢印も 青い音から 出す
function progStaff(key,chord,label,color,steps,t){
  const nw=isNew(t), mark=n=>nw?hl(key,t,n):(isRed(n)?'red':null), red=!nw||chord.some(n=>mark(n)==='red'), hc=red?LT_C:LOW_C;
  const all=[{label,notes:chord,first:true},...steps], carry={}, cols=[], idx=[];
  all.forEach((c,ci)=>{
    const ns=c.notes.map(n=>({...n,raised:c.first&&!!mark(n)}));
    const tr=[],lh=[],map=[];
    ns.forEach(n=>{if(n.midi>=60){map.push(['t',tr.length]);tr.push(n);}else{map.push(['b',lh.length]);lh.push(n);}});
    cols.push({notes:tr,lh,color:c.first?color:'#3a3245',ltColor:hc,accColor:hc,label:c.label,labelColor:c.first?color:'#3a3245',carry:{...carry}});
    idx.push(map);
    ns.forEach(n=>{if(n.acc!==(key.sig[n.letter]||0)||carry[n.letter]!==undefined) carry[n.letter]=n.acc;});
  });
  const arrows=[];
  chord.forEach((n,i)=>{
    const m=nw?mark(n):null;
    if(n.tag!=='lt'&&!m) return;
    const a=idx[0][i], b=idx[1]&&idx[1][i];
    if(a&&b&&a[0]==='t'&&b[0]==='t'&&(!nw||chord[i].midi!==steps[0].notes[i].midi)) arrows.push({c1:0,i1:a[1],c2:1,i2:b[1],color:n.tag==='lt'||m==='red'?LT_C:LOW_C});
  });
  return PA.staffSVG(key,cols,{grand:true,colW:84,minW:260,arrows,maxScale:1.3});
}
const rolesHTML=(ns,key,t)=>`<div class="chips roles">${ns.map(n=>{const m=hl(key,t,n);return `<span class="chip ${m==='red'?'lt':m==='blue'?'lo':''}">${PA.nmH(n)}<small>${n.role}</small></span>`;}).join('')}</div>`;
// がくふの 見出しの 色の せつめい（変化和音）
function capNew(key,t,ans){
  const R=roleSort(ans.filter(n=>hl(key,t,n)==='red')), B=roleSort(ans.filter(n=>hl(key,t,n)==='blue'));
  if(t==='vii7') return `赤＝導音（主音へ 上がる）`;
  const out=[];
  if(R.length) out.push(`赤＝半音上げた音（${namesN(R)}）${T[t].tg&&R.some(n=>n.tag==='lt')?`・${PA.nmH(R.find(n=>n.tag==='lt'))} は ${H.ROMAN[T[t].tg-1]}への 導音`:''}`);
  const par=parName(key), bor=B.filter(n=>n.tag==='borrowed');
  if(B.length) out.push(t==='ivm'||t==='bvi'?`青＝${par}から かりた 音（半音下げた音：${namesN(B)}）`
    :`青＝半音下げた音（${namesN(B)}${bor.length?`。${namesN(bor)} は ${par}から かりた 音`:''}）`);
  return out.length?out.join('・'):'この 和音は 調の 音だけ（自然的短音階）';
}
// 赤い音の せつめい
function redLabel(ns,t){
  if(AUG.includes(t)) return 'Ⅴへの 導音';
  return ns.some(n=>n.tag==='raised')?'半音上げた音・第3音は Ⅴ への 導音':'Ⅴ への 導音';
}
function kbRange(ms){
  let lo=Math.min(...ms)-2, hi=Math.max(...ms)+2;
  while(isBlack(lo)) lo--; while(isBlack(hi)) hi++;
  if(hi-lo<24){lo-=5;while(isBlack(lo))lo--;hi+=5;while(isBlack(hi))hi++;}
  return [lo,hi];
}

function keysMarks(key,t,book){
  const ans=chordOf(key,t), kr=kbOf(key,t), marks=new Map(), set=(m,o)=>marks.set(m,Object.assign(marks.get(m)||{},o)), col=T[t].color;
  if(!Q.checked){
    Q.picked.forEach(m=>set(m,{fill:isBlack(m)?'#e9a800':'#ffd66b',tc:'#3a3245',label:nameOf(m,key,book)}));
    if(Q.hint>=2){
      const b=baseOf(key,t);
      b.notes.forEach(n=>{
        const hit=[...Q.picked].filter(m=>mod(m,12)===mod(n.midi,12));
        if(hit.length) hit.forEach(m=>set(m,{ring:'#f4a100'}));
        else set(inKb(n.midi,kr),{ring:'#f4a100',tc:'#c98500',label:b.root?'ここ?':PA.nm(n)});
      });
    }
  }else{
    const g=grade(key,t), shown=new Set();
    Q.picked.forEach(m=>{const ok=g.A.has(rel(key,m));set(m,{fill:ok?'#22a06b':'#d1495b',tc:'#fff',label:(ok?'○':'×')+nameOf(m,key,book),focus:true});});
    // たりない音（重ねた音は 1つだけ）
    ans.forEach(n=>{const r=rel(key,n.midi);if(!g.P.has(r)&&!shown.has(r)){shown.add(r);const m=n.midi;set(m,{fill:isBlack(m)?undefined:'#fff',ring:col,tc:col,label:PA.nm(n),focus:true});}});
  }
  // はじめに 見せる 位置：こたえの音の あたり（色は つけない）
  [ans[0].midi,ans[ans.length-1].midi].forEach(m=>set(m,{focus:true}));
  return marks;
}

/* ===== 👂 聴きわけ ===== */
function earData(e){
  const key=keyOfQ(e);
  if(e.lv===3){const c=cadOf(key,e.type);return {key,pre:c.I,chord:c.X,steps:[{label:'Ⅴ7',notes:c.V},{label:'Ⅰ',notes:c.I}]};}
  const chord=shiftN(e.lv===1?C[e.type](key):C.aug6(key,e.type),e.shift);
  const steps=stepsOf(key,e.type).map(s=>({label:s.label,notes:shiftN(s.notes,e.shift)}));
  return {key,chord,steps};
}
function newEar(){
  const types=EAR_LV[Q.earLv], ks=earKeys(Q.earLv), pick=a=>a[Math.floor(Math.random()*a.length)];
  let type=pick(types); if(Q.eq&&Q.eq.type===type&&Math.random()<0.5) type=pick(types);
  let k,tries=0; do{k=pick(ks);}while(Q.eq&&ks.length>1&&k.minor===Q.eq.minor&&k.keyIdx===Q.eq.keyIdx&&++tries<20);
  Q.eq={lv:Q.earLv,minor:k.minor,keyIdx:k.keyIdx,type,shift:pick(EAR_SHIFT[Q.earLv])};
  Q.ans=null; Q.resShown=false; Q.eqid++; save();
}
// レベル1：和音 → Ⅴ（ⅡかⅤへの すすみかたで くらべる）。レベル2：和音だけ（すすみかたは こたえてから）。
// レベル3：カデンツ Ⅰ → ？ → Ⅴ7 → Ⅰ（2ばんめの 和音を 当てる）
function playCad(pre,chord,steps){
  PA.chord(pre.map(n=>n.midi),{dur:1.2}); PA.chord(chord.map(n=>n.midi),{when:1.1,dur:1.4});
  PA.chord(steps[0].notes.map(n=>n.midi),{when:2.4,dur:1.2}); PA.chord(steps[1].notes.map(n=>n.midi),{when:3.5,dur:2.2});
}
function playEar(arp){
  const e=Q.eq; if(!e) return; const d=earData(e);
  PA.stopSound();
  if(arp){PA.chord(d.chord.map(n=>n.midi),{arp:true});return;}
  if(e.lv===3){playCad(d.pre,d.chord,d.steps);return;}
  if(e.lv===1){PA.chord(d.chord.map(n=>n.midi),{dur:1.4});PA.chord(d.steps[0].notes.map(n=>n.midi),{when:1.3,dur:2.2});}
  else PA.chord(d.chord.map(n=>n.midi),{dur:2.2});
}
function playSeq(chord,steps){
  PA.stopSound(); PA.chord(chord.map(n=>n.midi),{dur:1.4});
  steps.forEach((s,i)=>PA.chord(s.notes.map(n=>n.midi),{when:1.3*(i+1),dur:i===steps.length-1?2.2:1.4}));
}

function tipsHTML(){

    <li>Ⅴ の家族と おなじで、短9度を のせた <b>Ⅴ9/Ⅴ</b>、その 根音を はぶいた <b>減七/Ⅴ</b> も あるよ。</li>
    <li><b>増六の和音</b>は ドッペルの <b>第5音を 半音下げて</b>、その音を <b>いちばん下</b>に おいた形。<br>イタリア＝根音なし（3つ）、フランス＝根音あり、ドイツ＝根音の かわりに 第9音（短9度）。</li>

    <li><b>ナポリの六</b>は 第2音を 半音下げた ♭Ⅱ の <b>第1転回形</b>（いちばん下は 第3音＝調の 4ばんめ）。根音は Ⅴ の 導音へ <b>減3度</b> 下がるよ。長調では 第5音（6ばんめを 半音下げた 音）も 同主短調から かりる。</li>

    const [page,extra]=T[type].tg?['secondary',{target:T[type].tg,kind:'V7'}]:NEW_PAGE[type];
    const p=PA.store.get(page,{});
    PA.store.set(page,{...(p&&typeof p==='object'?p:{}),minor:page==='borrowed'?false:minor,keyIdx,...extra});
    if(type!=='iv') PA.store.set(page+'-auto',true); // Ⅳ は ふつうの Ⅳ（かりる スイッチ オフ）を 見せる。アニメは ○Ⅳ で おわるので はじめない
    PA.go(page+'.html');
  }else if(AUG.includes(type)){
    const p=PA.store.get('aug6',{});
    PA.store.set('aug6',{...(p&&typeof p==='object'?p:{}),minor,keyIdx,type});
    PA.store.set('aug6-auto',true);
    PA.go('aug6.html');
  }else{
    const p=PA.store.get('doppel',{});
    PA.store.set('doppel',{...(p&&typeof p==='object'?p:{}),minor,keyIdx,raised:type!=='ii7'});
    PA.go('doppel.html');
  }
}

/* ===== 操作 ===== */
PA.mountBar({title:'変化和音クイズ',app:'chroma-quiz'});
PA.onSettings=render;
PA.onPageShow=render;
PA.onKey=m=>{ // 音は core が 鳴らす
  if(Q.mode!=='keys'||Q.checked) return;
  Q.picked.has(m)?Q.picked.delete(m):Q.picked.add(m); render();
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act, v=el.dataset.v;
  switch(a){
    case 'qmode': if(Q.mode===v||!['keys','ear'].includes(v)) return; PA.stopSound(); Q.mode=v; break;
    case 'qkeyset': if(Q.keyset===v||!KEYSETS.some(([x])=>x===v)) return; PA.stopSound(); Q.keyset=v; newQ(); Q.eq=null; Q.ans=null; Q.resShown=false; Q.eqid++; break;
    case 'qlevel': if(Q.level===+v||!LEVELS.some(([x])=>x===+v)) return; Q.level=+v; newQ(); break;
    case 'qtype': if(!TYPES.includes(v)) return; Q.types[v]=!Q.types[v]; if(!TYPES.some(t=>Q.types[t])) Q.types[v]=true; newQ(); break;
    case 'qreset': Q.sc[Q.mode]={right:0,total:0,streak:0}; if(Q.mode==='keys'&&!Q.checked) Q.result=null; break;
    case 'qcheck': if(Q.mode!=='keys'||Q.checked||!Q.picked.size) return; checkKeys(); save(); render(); showFb(); return;
    case 'qclear': Q.picked=new Set(); break;
    case 'qhint': Q.hint=Math.min(2,Q.hint+1); save(); render(); showFb(); return;
    case 'qnext': PA.stopSound(); newQ(); save(); render(); PA.scrollTop(); return;
    case 'qretry': Q.picked=new Set(); Q.checked=false; Q.lastOk=null; break;
    case 'qplay': {PA.stopSound(); PA.chord(chordOf(keyOfQ(Q.q),Q.q.type).map(n=>n.midi)); return;}
    case 'qres': {const key=keyOfQ(Q.q); playSeq(chordOf(key,Q.q.type),stepsOf(key,Q.q.type)); return;}
    case 'qexplain': {
      if(!Q.checked&&Q.result===null){Q.result=false;score('keys',false);} // こたえを 見てから こたえても ⭐には しない
      goExplain(Q.q.minor,Q.q.keyIdx,Q.q.type); return;
    }
    case 'elevel': {const lv=+v; if(lv===Q.earLv||!EAR_LV[lv]) return; PA.stopSound(); Q.earLv=lv; Q.eq=null; Q.ans=null; Q.resShown=false; Q.eqid++; break;}
    case 'enew': newEar(); render(); playEar(); reveal(document.querySelector('#view .echoices'),document.querySelector('#view .hero')); return;
    case 'eplay': playEar(false); return;
    case 'earp': playEar(true); return;
    case 'epair': playPair(); return;
    case 'eans': {
      if(!Q.eq||Q.ans||!EAR_LV[Q.eq.lv].includes(v)) return;
      Q.ans=v; score('ear',v===Q.eq.type); save(); Q.fresh=true; render(); playEar(false);
      const fb=document.querySelector('#view .fb'); reveal(fb,fb,true); return;
    }
    case 'eres': if(!Q.eq||!Q.ans) return; Q.resShown=true; save(); render(); playEarRes(); return;
    case 'eexplain': if(!Q.eq||!Q.ans) return; goExplain(Q.eq.minor,Q.eq.keyIdx,Q.eq.type); return;
    case 'ecmp': {if(!EAR_LV[Q.earLv].includes(v)) return; const k=cmpKey(); if(Q.earLv===3){const c=cadOf(k,v);PA.stopSound();playCad(c.I,c.X,[{notes:c.V},{notes:c.I}]);return;} playSeq(v==='ii7'||v==='dd'?C[v](k):C.aug6(k,v),stepsOf(k,v)); return;}
    default: return;
  }
  save(); render();
});
document.addEventListener('toggle',e=>{if(e.target.id==='qsetd'&&Q.openSet!==e.target.open){Q.openSet=e.target.open;save();}},true);
if(Q.mode==='keys'&&!Q.q) newQ();
save(); render();
</script>
