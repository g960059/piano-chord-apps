<script>
/* 変化和音クイズ：Ⅱ7・ドッペルドミナント・減七/Ⅴ・増六（イタリア・フランス・ドイツ）・ナポリの六・準固有（Ⅳm・♭Ⅵ）・
 *   副属和音（Ⅴ7/x）・Ⅶ7（半減七・減七）を 🎹 けんばんで おさえる ／ 👂 ひびきで 聴きわける。
 *   和音の つづりと 高さは ぜんぶ PA.chroma・PA.henka から（ほかの ページと そろえる）
 *   保存（'chroma-quiz'）：kLv（おさえる の レベル 1〜5・0＝じぶんで えらぶ）・types・tier（PA.keyDeck の むずかしさ）・weak（にがてな調を 多めに）。
 *   まえの 形（level＝調号の 数・types だけ）は 読みこむとき tier・kLv に なおす。まえの level は「調号 N つまで」（0 から つみかさね）、
 *   tier は 帯（easy 0〜1・normal 2〜3・hard 4〜5）なので、帯に なおすと えらんでいた 調が 出なくなる。だから level 0（ハ長調・イ短調だけ）は easy、
 *   それ いがい（まえの はじめの 値 1 も ふくむ）は ぜんぶ all に する。keyset が ない 保存（はじめて）は both（24調）から。
 *   調の きろくは PA.keyDeck（'keystats-chroma-quiz'）
 *
 *   リンクの パラメータ（先生の 宿題・学ぶ ページの「ためしてみる」。しらべかたは linkOf）：
 *     mode＝keys（🎹 おさえる）｜ear（👂 聴きわけ）。mode が なくて level・chord・tier の どれかが あれば keys
 *     level＝🎹 は 1〜5（KLV）、👂 は 1〜3（EAR_LV）
 *       🎹 1＝Ⅱ7・ドッペル  2＝＋減七/Ⅴ  3＝増六 3しゅるい  4＝増六＋ナポリ・Ⅳm・♭Ⅵ  5＝ぜんぶ（副属和音・Ⅶ7 も）
 *       👂 1＝Ⅱ7・ドッペル  2＝増六 3しゅるい  3＝Ⅳ・Ⅳm・ナポリ（長調だけ）
 *       学ぶ ページから：doppel → keys 1（家族まで 2）・ear 1、aug6 → keys 3・ear 2、neapolitan → keys 4・ear 3、
 *         borrowed → keys 4・ear 3、secondary → keys 5、dim-halfdim → keys 5、enharmonic → keys 5
 *         （その 和音だけに したい ときは chord：neapolitan → n6、borrowed → ivm,bvi、secondary → s2,s3,s4,s6、
 *          dim-halfdim → vii7,ddim、enharmonic → ger,ddim,vii7）
 *     chord＝🎹 の 和音の id を , で（ii7 dd ddim it fr ger n6 ivm bvi s2 s3 s4 s6 vii7）。level より さき（「じぶんで えらぶ」に なる）
 *     tier＝easy｜normal｜hard｜all（🎹 の 調の むずかしさ）、key＝M0〜M12・m0〜m12（その 調だけ 出す。🎹・👂 どちらも）、n＝1〜20（📝 n もん）
 *     リンクの せっていは ほぞんする（いまの せっていに なる）。おなじ タブで 読みなおした とき（「もどる」）は もういちど つかわない
 *   こたえる まえに 💡 ヒント・🐸 つくりかたを見る を ひらいた もんだいは、できたら「ヒントで できた」（×に しない。⭐ の せいかいにも ならない） */
const C=PA.chroma, H=PA.henka, mod=PA.mod, KD=PA.keyDeck, QUIZ='chroma-quiz';
const T={
  ii7: {label:'Ⅱ7',     long:'Ⅱ7（にどしち）',             sub:'調の音だけで つくる Ⅱ の 七の和音', color:'#22a06b', emoji:'🌿', word:'やわらかい'},
  dd:  {label:'ドッペル', long:'ドッペルドミナント（Ⅴ7/Ⅴ）', sub:'Ⅴ の ための Ⅴ7',                 color:'#8a4fe0', emoji:'🧲', word:'Ⅴを つよく よぶ'},
  ddim:{label:'減七/Ⅴ',  long:'減七/Ⅴ（Ⅴ9/Ⅴ の 根音を はぶいた形）',  sub:'Ⅴ9/Ⅴ から 根音を はぶいた形',     color:'#b0307a'},
  it:  {label:'イタリア', long:'イタリアの6',                 sub:'増六の和音・根音なし',             color:'#1f8a99', emoji:'🍕', word:'うすい・かるい'},
  fr:  {label:'フランス', long:'フランスの6',                 sub:'増六の和音・根音あり',             color:'#5b5fc7', emoji:'🥐', word:'ふしぎ・ふわっと'},
  ger: {label:'ドイツ',   long:'ドイツの6',                   sub:'増六の和音・第9音つき',            color:'#9a5b13', emoji:'🥨', word:'こい・Ⅴ7みたい'},
  // ここから 変化和音（PA.henka）。only＝その 調だけで 出る、tg＝副属和音の 目標（度数）、staff＝がくふの 和音記号
  n6:  {label:'ナポリ',   long:'ナポリの六',                  sub:'2ばんめを 半音下げた ♭Ⅱ。いちばん下は 第3音', color:'#c4462a', emoji:'🌋', word:'ドラマチック', staff:'N6'},
  iv:  {label:'Ⅳ',       long:'Ⅳ（ふつうの Ⅳ）',            sub:'調の音だけの Ⅳ',                   color:'#22a06b', emoji:'☀️', word:'あかるい'}, // 聴きわけ レベル3 だけ
  ivm: {label:'Ⅳm',      long:'Ⅳm（かりた 和音 ○Ⅳ）',         sub:'おなじ 主音の 短調から かりた Ⅳ',             color:'#3d63b8', emoji:'🌙', word:'せつない', staff:'○Ⅳ', only:'major'},
  bvi: {label:'♭Ⅵ',      long:'♭Ⅵ（かりた 和音 ○Ⅵ）',         sub:'おなじ 主音の 短調から かりた Ⅵ',             color:'#7a4cc2', staff:'○Ⅵ', only:'major'},
  s2:  {label:'Ⅴ7/Ⅱ',    tg:2, color:'#b85c00', only:'major'},
  s3:  {label:'Ⅴ7/Ⅲ',    tg:3, color:'#b85c00', only:'minor'},
  s4:  {label:'Ⅴ7/Ⅳ',    tg:4, color:'#b85c00'},
  s6:  {label:'Ⅴ7/Ⅵ',    tg:6, color:'#b85c00'},
  vii7:{label:'Ⅶ7',      long:'Ⅶ7',                          sub:'導音を 根音に した 七の和音（Ⅴ9 の 根音を はぶいた 形）', color:'#0f7a72', staff:'Ⅶ7'}
};
// <cq-link>（test/chroma-quiz.test.mjs が ここだけ 切りだして、レベルの なかみと リンクの しらべかたを たしかめる）
// 設定で ならべる まとまり（TYPES の じゅんばんも これ。まえからの 6つが さき）
const GROUPS=[['ドッペル・増六',['ii7','dd','ddim','it','fr','ger']],['ナポリ・準固有',['n6','ivm','bvi']],['副属和音',['s2','s3','s4','s6']],['半減七・減七',['vii7']]];
const TYPES=GROUPS.flatMap(g=>g[1]), AUG=['it','fr','ger'];
// 🎹 おさえる の レベル（👂 聴きわけ と おなじ ように）。0＝じぶんで えらぶ（🎛 もんだいの えらびかた の 和音の ボタン）
//   学ぶ ページの リンクが この ばんごうを つかうので、ならびを かえない（ふやすなら うしろに）
const KLV=[
  {lv:1,types:['ii7','dd'],name:'Ⅱ7・ドッペル',desc:'Ⅱ7 と ドッペルドミナント'},
  {lv:2,types:['ii7','dd','ddim'],name:'＋減七/Ⅴ',desc:'Ⅱ7・ドッペル ＋ 減七/Ⅴ'},
  {lv:3,types:AUG,name:'増六 3しゅるい',desc:'増六の和音（イタリアの6・フランスの6・ドイツの6）'},
  {lv:4,types:[...AUG,'n6','ivm','bvi'],name:'＋ナポリ・Ⅳm・♭Ⅵ',desc:'増六 ＋ ナポリの六・Ⅳm・♭Ⅵ（おなじ 主音の 短調から かりる 和音）'},
  {lv:5,types:TYPES,name:'ぜんぶ',desc:'ぜんぶ（副属和音 Ⅴ7/Ⅱ・Ⅴ7/Ⅳ など、Ⅶ7 も）'}
];
const EAR_LV={1:['ii7','dd'],2:['it','fr','ger'],3:['iv','ivm','n6']};
const EAR_NAME={1:'Ⅱ7・ドッペル',2:'増六 3しゅるい',3:'Ⅳ・Ⅳm・ナポリ'};
// リンクの パラメータ（PA.params() の 文字）→ {mode, kLv, types, earLv, tier, key, n}（つかえない 値は null。なにも なければ null）
//   tiers＝えらべる むずかしさの id。key は PA.keyDeck の id だけ（ほかの 文字は すてる）
function linkOf(p,tiers){
  p=p&&typeof p==='object'?p:{};
  const str=k=>Object.prototype.hasOwnProperty.call(p,k)&&typeof p[k]==='string'?p[k]:null;
  const int=(k,lo,hi)=>{const v=str(k);return v!=null&&/^\d{1,2}$/.test(v)&&+v>=lo&&+v<=hi?+v:null;};
  const out={mode:null,kLv:null,types:null,earLv:null,tier:null,key:null,n:null};
  out.mode=str('mode')==='keys'||str('mode')==='ear'?str('mode'):null;
  if(!out.mode&&(str('level')!=null||str('chord')!=null||str('tier')!=null)) out.mode='keys';
  if(out.mode==='ear') out.earLv=int('level',1,3);
  else{
    out.kLv=int('level',1,KLV.length);
    const ch=str('chord');
    if(ch!=null){const ts=TYPES.filter(t=>ch.split(',').includes(t));if(ts.length){out.types=ts;out.kLv=null;}}
  }
  if(tiers.includes(str('tier'))) out.tier=str('tier');
  const k=str('key'), kp=k!=null&&PA.keyDeck?PA.keyDeck.parse(k):null;
  if(kp&&kp.id===k) out.key=k;
  out.n=int('n',1,20);
  return Object.keys(out).some(x=>out[x]!=null)?out:null;
}
// </cq-link>
const NEWT=['n6','ivm','bvi','s2','s3','s4','s6','vii7','iv'];
const isNew=t=>NEWT.includes(t);
const okFor=(t,minor)=>!T[t].only||(T[t].only==='minor')===minor; // その 調で 出せる 和音か
const typesOf=lv=>{const L=KLV.find(x=>x.lv===lv)||KLV[0];return Object.fromEntries(TYPES.map(t=>[t,L.types.includes(t)]));};
const levelOf=ts=>(KLV.find(L=>TYPES.every(t=>!!ts[t]===L.types.includes(t)))||{lv:0}).lv; // 0＝どの レベルとも ちがう
const TIER_IDS=KD.TIERS.map(x=>x.id);
const OLD_TIER={0:'easy',1:'all',2:'all',3:'all',4:'all',7:'all'}; // まえの「調号の数」（〜つまで）→ むずかしさ（帯で へらさない。上の コメント）
const KEYSETS=[['major','長調'],['minor','短調'],['both','りょうほう']];
const EAR_SHIFT={1:[0,12],2:[0,12],3:[0]}; // 毎回 高さを かえる（オクターブ）。レベル3は カデンツが 音域いっぱいなので 調だけ かえる
const KB_LO=45, KB_HI=76; // ラ2〜ミ5：けんばんは すくなくとも この はんい（こたえの 音が はみ出す もんだいは そこまで ひろげる）
const LT_C='#d1495b', LOW_C='#2f7ee8', V_C='#3b4fa8'; // 赤＝Ⅴへの導音・上げた音、青＝下げた第5音、Ⅴ（aug6.html と おなじ）
const isRed=n=>n.tag==='lt'||n.tag==='raised'; // 赤：Ⅴへの導音・半音上げた音（doppel.html と おなじ）
const isLow=n=>n.tag==='low'; // 青：半音下げた 第5音（aug6.html と おなじ）
// Ⅱ7・ドッペルは doppel.html と おなじ 根音・第3音・第5音・第7音 の じゅんで 名前を ならべる（がくふと 音は 和音の ならびの まま）
const byRole=ns=>[ns[0],ns[3],ns[1],ns[2]];
// 変化和音は 根音・第3音・第5音・第7音 の じゅんに、おなじ 音（重ねた音）は 1つだけ
const RANK=['根音','第3音','第5音','第7音','第9音'];
const rank=n=>{const i=RANK.findIndex(p=>n.role.startsWith(p));return i<0?9:i;};
const roleSort=ns=>{const seen=new Set();return [...ns].sort((a,b)=>rank(a)-rank(b)).filter(n=>{const p=mod(n.midi,12);if(seen.has(p))return false;seen.add(p);return true;});};
const disp=(t,ns)=>t==='ii7'||t==='dd'?byRole(ns):isNew(t)?roleSort(ns):ns;
const nPc=ns=>new Set(ns.map(n=>mod(n.midi,12))).size; // 音の数（重ねた音は 1つ）
const I64H='Ⅰ<span class="fig"><span>6</span><span>4</span></span>';
const labH=s=>s==='Ⅰ6/4'?I64H:s; // HTML の 文では Ⅰ6/4 を 重ねて 書く
const keyOfQ=q=>PA.keyOf(q.minor,q.keyIdx);

function chordOf(key,t){
  if(t==='ii7') return C.ii7(key);
  if(t==='dd') return C.dd(key);
  if(t==='ddim') return C.ddStack(key,'ddim');
  if(t==='n6') return H.neapolitan(key);
  if(t==='ivm') return H.borrowed(key,'iv');

  if(T[t]&&T[t].tg) return H.secondary(key,T[t].tg,'V7');
  if(t==='vii7') return H.vii7(key,'vii'); // 名前は Ⅶ7 から 見た もの（導音＝根音）
  if(t==='iv') return cadOf(key,'iv').X;

}
/* 聴きわけ レベル3：長調の カデンツ Ⅰ → X → Ⅴ7 → Ⅰ（X＝Ⅳ・Ⅳm・ナポリの六）
 *   ナポリの六（PA.henka.neapolitan：[4 | 4, ♭6, ♭2]）と おなじ ならび・高さで、
 *   Ⅳm＝いちばん上の ♭2 を 主音に（[4 | 4, ♭6, 1]）、Ⅳ＝さらに ♭6 を ♮6 に（[4 | 4, 6, 1]）。
 *   となりどうし（Ⅳ↔Ⅳm・Ⅳm↔ナポリ）は 1つの 音だけ ちがうので、ひびきの ちがいだけを くらべられる。
 *   どれも n6ToV7 の Ⅴ7（第5音なし）[5 | 4, 5, 7] へ すすむ（neapolitan.html の すぐ すすむ ときと おなじ）。
 *   はじめと おわりの Ⅰ＝[1 | 3, 5, 1]（上の声は ナポリの 上の声の 半音下。Ⅴ7 からは 4→3、5→5、7→1 で おなじ 高さに もどる） */
function cadOf(key,t){
  const n6=H.neapolitan(key), V=n6ToV7(key), [b,u4,u6,u2]=n6;
  const at=(n,lo,semis,d,role,tag)=>({...tn(key,lo,semis),midi:n.midi+d,role,tag:tag||null});
  const X=t==='n6'?n6:[at(b,3,5,0,'根音（いちばん下）'),at(u4,3,5,0,'根音'),
    t==='iv'?at(u6,5,9,1,'第3音'):at(u6,5,8,0,'第3音（下げた 6ばんめ）','borrowed'),at(u2,0,0,-1,'第5音')];
  const ib=b.midi-5>=40?b.midi-5:b.midi+7; // Ⅰ の ベース：Ⅳ の 根音の 4度下（低すぎれば 5度上）
  const I=[at(b,0,0,ib-b.midi,'Ⅰの根音'),at(u4,2,4,-1,'Ⅰの第3音'),at(u6,4,7,-1,'Ⅰの第5音'),at(u2,0,0,-1,'Ⅰの根音')];
  return {I,X,V};
}
// ナポリの六 → Ⅴ7（第5音なし。neapolitan.html の toV7 と おなじ 音）：ベースは 上へ、上の 第4音は そのまま のこって 第7音に、
//   ♭6 → 第5音（Ⅴの根音）、♭2 → 導音（減3度 下へ）。PA.henka.toV の Ⅴ 三和音だと ♭2 の すぐあとに アルトで ♮2 が 鳴る 対斜に なる
function n6ToV7(key){
  const [b,u4,u6,u2]=H.neapolitan(key);
  const mk=(n,d,lo,semis,role,tag)=>({...tn(key,lo,semis),midi:n.midi+d,role,tag:tag||null});
  return [mk(b,2,4,7,'Ⅴの根音'),{...u4,role:'Ⅴの第7音',tag:'seventh'},mk(u6,-1,4,7,'Ⅴの根音'),mk(u2,-2,6,11,'Ⅴの第3音（導音）','lt')];
}
// 減七/Ⅴ → Ⅴ（core に ないので ここで）：導音は 半音上、第5音は 全音下、第7音・第9音は 半音下
function ddimToV(key){
  const [l3,l5,l7,l9]=C.ddStack(key,'ddim');
  const mk=(n,d,lo,semis,role)=>({...tn(key,lo,semis),midi:n.midi+d,role,tag:null});
  return [mk(l3,1,4,7,'Ⅴの根音'),mk(l5,-2,4,7,'Ⅴの根音'),mk(l7,-1,6,11,'Ⅴの第3音'),mk(l9,-1,1,14,'Ⅴの第5音')];
}

function stepsOf(key,t){

  if(t==='ddim') return [{label:'Ⅴ',notes:ddimToV(key)}];
  if(t==='n6') return [{label:'Ⅴ7',notes:n6ToV7(key)}];
  if(t==='ivm') return [{label:'Ⅰ',notes:H.nextOf(key,'iv')}];
  if(t==='bvi') return [{label:'Ⅴ',notes:H.nextOf(key,'bVI')}];
  if(T[t].tg) return [{label:H.ROMAN[T[t].tg-1],notes:H.resolveSecondary(key,T[t].tg,'V7')}];
  if(t==='vii7') return [{label:'Ⅰ',notes:H.vii7ToI(key)}];
  if(t==='ger') return [{label:'Ⅰ6/4',notes:C.gerToI64(key)},{label:'Ⅴ',notes:C.aug6ToV(key,'ger')}];

}
const shiftN=(ns,s)=>ns.map(n=>({...n,midi:n.midi+s}));

const Q={mode:'keys',keyset:'both',tier:'all',weak:true,kLv:1,types:typesOf(1),earLv:1,openSet:false,

function lockOn(m){

(function load(){
  const d=saved;

  // 調の むずかしさ（まえの「調号の数」level から なおす）
  if(TIER_IDS.includes(d.tier)) Q.tier=d.tier;

  if(typeof d.weak==='boolean') Q.weak=d.weak;

  let ts=null;

    else if(LINK.kLv){Q.kLv=LINK.kLv;Q.types=typesOf(LINK.kLv);}

//   まえの もんだいと おなじ 調は さける（ふくろが さける。「つくりかたを見る」から もどった もんだいも）
function newQ(){
  syncDeck();

  // 「この 調だけ」の ときは ふくろを つかわない（ふくろの のこりは そのまま）
  const k=lk&&fits(lk)?lk:Q.deck.draw(p=>fits(p)&&!(prev&&p.minor===prev.minor&&p.idx===prev.keyIdx))||Q.deck.draw(fits)||{minor:false,idx:0};

// 1回目の こたえ（スコア・調の きろく・📝 の 回）。こたえる まえに ヒント・つくりかたを 見て できた ときは「ヒントで できた」（×に しない）
function scoreKeys(ok){
  const hint=ok&&Q.peek, key=keyOfQ(Q.q), id=keyId(Q.q);
  Q.result=ok; score('keys',ok,hint); Q.deck.record(id,ok,{hint});
  sessRecord(ok,hint,`${PA.keyName(key)}の ${nameT(key,Q.q.type)}`,id);

// おさえた音を ピッチクラスで くらべる（どの オクターブでも OK）
function grade(key,t){

function secNb(key,t,g){
  const out=[];
  if(!g||!T[t].tg) return out;
  chordOf(key,t).forEach(n=>{
    const p=rel(key,n.midi); if(g.P.has(p)||n.acc!==(key.sig[n.letter]||0)) return;

const nameOf=(m,key,book)=>{const n=book.get(rel(key,m));return PA.nm(n?{letter:n.letter,acc:n.acc}:PA.spellMidi(m,key));};

  return {tg,ans,tr,root:ans.find(n=>n.role==='根音'),lt:ans.find(n=>n.tag==='lt'),sev:ans.find(n=>n.tag==='seventh'),

    :`<b>導音</b>「${nm(tn(key,6,11))}」から、調の 音だけで ひとつとばしに 4つ（半減七）。`;

function recipe(key,t){
  const ii=C.ii7(key);
  if(isNew(t)) return recipeNew(key,t);
  switch(t){
    case 'ii7': return `音階の <b>2ばんめ</b>「${PA.nmH(ii[0])}」から、調の音だけで ひとつとばしに 4つ。`;
    case 'dd': return `Ⅱ7 の <b>第3音を 半音上げる</b>${key.minor?'（短調では <b>第5音も</b> 半音上げる）':''}。上げた 第3音は Ⅴ の 導音に なるよ。`;
    case 'ddim': return `ドッペルに <b>第9音</b>を のせて、<b>根音を はぶく</b>。`;
    case 'it': return `ドッペルの <b>第5音を 半音下げて</b> いちばん下へ。<b>根音は はぶいて</b> 3つ。`;
    case 'fr': return `ドッペルの <b>第5音を 半音下げて</b> いちばん下へ。<b>根音は のこして</b> 4つ。`;
    case 'ger': return `Ⅴ9/Ⅴ の <b>第5音を 半音下げて</b> いちばん下へ。<b>根音は はぶいて</b> 4つ。`;
  }

// ヒント2で オレンジの わくで 見せる「もとの 和音」
function baseOf(key,t){
  if(t==='ii7') return {name:'いちばん下の 根音',notes:[C.ii7(key)[0]],root:true};
  if(t==='dd') return {name:'Ⅱ7',notes:byRole(C.ii7(key))};
  if(t==='ddim'||t==='ger') return {name:'Ⅴ9/Ⅴ',notes:C.ddStack(key,'dd9')};
  if(t==='n6') return {name:'Ⅱ',notes:[at0(key,1,2),at0(key,3,5),at0(key,5,key.minor?8:9)]};
  if(t==='ivm') return {name:'Ⅳ',notes:[at0(key,3,5),at0(key,5,9),at0(key,7,12)]};
  if(t==='bvi') return {name:'Ⅵ',notes:[at0(key,5,9),at0(key,7,12),at0(key,9,16)]};
  if(T[t].tg) return {name:'根音',notes:[secInfo(key,t).root],root:true};

// 変化和音の こたえあわせの ヒント（r＝主音から 見た ピッチクラス。くらべる ためだけに つかい、ことばには 出さない）

// 副属和音：ちがう 目標の Ⅴ7 を つくった／よその 調（もとの 調）の 音の まま・上げすぎ 下げすぎ

    const was={it:'根音も 第9音も なしの 3つの音',fr:`根音「${nm(R)}」あり`,ger:`第9音「${nm(T9)}」あり`}[other];
    const want={it:'根音も 第9音も 入れずに <b>3つだけ</b>',fr:`第9音では なく <b>根音</b>「${nm(R)}」を のこすよ`,ger:`根音の かわりに <b>第9音</b>「${nm(T9)}」を 入れるよ`}[t];
    L.push(`それは <b>${AUG_NAME[other]}</b>（${was}）。${AUG_NAME[t]} は ${want}。`);
    if(g.count!==g.A.size) L.push(cnt);
    return L;
  }
  if(same(C.ddStack(key,'dd'))) L.push(`それは <b>ドッペルドミナント</b>。増六は ドッペルの 第5音を 半音下げて いちばん下に おく 形だよ。`);
  // 第5音を 下げていない
  if(!has(lo)&&has(T5)) say(`ドッペルの 第5音「${nm(T5)}」を <b>半音下げる</b>のを わすれていない？「${nm(lo)}」に して、いちばん下に おくよ。`,T5);
  else if(!has(lo)) L.push(`いちばん下の「${nm(lo)}」（ドッペルの 第5音を 半音下げた 音）を 入れよう。`);
  // 第3音（Ⅴへの 導音）
  if(!has(T3)&&has(P4)) say(`第3音「${nm(P4)}」を <b>半音上げる</b>のを わすれていない？「${nm(T3)}」に すると Ⅴ の 導音に なるよ。`,P4);

  if(!has(T7)) L.push(`第7音「${nm(T7)}」（主音）も 入れるよ。`);
  // 根音の ある・なし（フランスだけ のこす）と 第9音（ドイツだけ 短9度）
  if(t==='it'){
    if(has(R)) say(`イタリアの6 は 根音「${nm(R)}」を <b>はぶく</b>よ（3つの音）。根音を 入れると フランスの6。`,R);
    if(has(T9)) say(`「${nm(T9)}」を 入れると ドイツの6 に なっちゃう。イタリアは 3つだけ。`,T9);
  }
  if(t==='fr'){
    if(!has(R)) L.push(`フランスの6 は 根音「${nm(R)}」を <b>のこす</b>よ（4つの音）。根音なしは イタリアの6。`);
    if(has(T9)) say(`「${nm(T9)}」は ドイツの6 の 音（第9音）。フランスの6 には 入れないよ。`,T9);
  }
  if(t==='ger'){
    if(has(R)) say(`ドイツの6 は 根音「${nm(R)}」を <b>はぶいて</b>、かわりに 第9音を 入れるよ。`,R);
    if(!has(T9)&&has(M9)) say(`第9音は 下げた ほうの <b>「${nm(T9)}」</b>。「${nm(M9)}」の ままでは ちがうよ。${key.minor?'':`長調でも ${par}から かりて 半音下げた 音を つかうよ。`}`,M9);
    else if(!has(T9)) L.push(`<b>第9音</b>「${nm(T9)}」を のせるよ${key.minor?'':`（長調でも ${par}から かりた 音）`}。`);
  }
  // ここまでで 言っていない よけいな 音（ドッペルの 第5音・根音・第9音 など いがい）は 名前を 出して「いらない」と 言う
  const odd=g.extra.filter(r=>!ex.has(r)).sort((a,b)=>a-b);
  if(odd.length) L.push(`${odd.map(r=>`「${PA.H(nameOf(key.tonicMidi+r,key,book))}」`).join('・')}は いらないよ。`);
  if(g.count!==g.A.size) L.push(cnt);
  return L;
}

function okExtra(key,t,ans){

// ドイツの6 は けんばんでは ♭Ⅱ の Ⅴ7 と おなじ音（つづりと すすみかたが ちがう）
function gerTwin(key){
  const g=C.aug6(key,'ger'), lo=g[0], up=g[3], L7=(lo.letter+6)%7, s7={letter:L7,acc:PA.spell(L7,PA.NAT[up.letter]+up.acc)};

  const odd=n=>Math.abs(n.acc)>1||(n.acc===-1&&(n.letter===0||n.letter===3))||(n.acc===1&&(n.letter===2||n.letter===6));
  const tw=PA.H(nm(odd(lo)?PA.spellMidi(lo.midi,PA.keyOf(false,0)):lo)+'7');
  let s=`けんばんでは <b>${tw}</b> と おなじ音${odd(lo)||Math.abs(s7.acc)>1?'':`（「${PA.nmH(up)}」を「${PA.nmH(s7)}」と 書くと ${tw}）`}。でも 書きかたも すすむ先も ちがうよ。`;

// 調号だけの 小さな 五線（こたえる前に 見せる）。上下の あきを けずって 低くする
const sigStaff=key=>PA.staffSVG(key,[],{minW:130,maxScale:1}).replace(/viewBox="0 0 (\d+(?:\.\d+)?) \d+(?:\.\d+)?"/,'viewBox="0 38 $1 100"');
// 大譜表：和音 → つぎの 和音。導音・下げた音は 赤。導音が ト音記号の 中で すすむときは 矢印
// 変化和音（t）は 赤＝半音上げた音、青＝半音下げた音（どちらか 一方しか 出ない）。矢印も 青い音から 出す
function progStaff(key,chord,label,color,steps,t){
  const nw=isNew(t), mark=n=>nw?hl(key,t,n):(isRed(n)?'red':null), red=!nw||chord.some(n=>mark(n)==='red'), hc=red?LT_C:LOW_C;
  const all=[{label,notes:chord,first:true},...steps], cols=[], idx=[];
  all.forEach((c,ci)=>{
    const ns=c.notes.map(n=>({...n,raised:c.first&&!!mark(n)}));
    const tr=[],lh=[],map=[];
    ns.forEach(n=>{if(n.midi>=60){map.push(['t',tr.length]);tr.push(n);}else{map.push(['b',lh.length]);lh.push(n);}});
    cols.push({notes:tr,lh,color:c.first?color:'#3a3245',ltColor:hc,accColor:hc,label:c.label,labelColor:c.first?color:'#3a3245'});
    idx.push(map);
  });
  const arrows=[];
  chord.forEach((n,i)=>{
    const m=nw?mark(n):null;
    if(n.tag!=='lt'&&!m) return;
    const a=idx[0][i], b=idx[1]&&idx[1][i];
    if(a&&b&&a[0]==='t'&&b[0]==='t'&&(!nw||chord[i].midi!==steps[0].notes[i].midi)) arrows.push({c1:0,i1:a[1],c2:1,i2:b[1],color:n.tag==='lt'||m==='red'?LT_C:LOW_C});
  });
  return PA.staffSVG(key,cols,{grand:true,autoCarry:true,colW:84,minW:260,arrows,maxScale:1.3});
}
const rolesHTML=(ns,key,t)=>`<div class="chips roles">${ns.map(n=>{const m=hl(key,t,n);return `<span class="chip ${m==='red'?'lt':m==='blue'?'lo':''}">${PA.nmH(n)}<small>${n.role}</small></span>`;}).join('')}</div>`;

function capNew(key,t,ans){
  const R=roleSort(ans.filter(n=>hl(key,t,n)==='red')), B=roleSort(ans.filter(n=>hl(key,t,n)==='blue'));
  if(t==='vii7') return `赤＝導音（主音へ 上がる）`;

  if(R.length) out.push(`赤＝半音上げた音（${namesN(R)}）${T[t].tg&&R.some(n=>n.tag==='lt')?`・${PA.nmH(R.find(n=>n.tag==='lt'))} は ${H.ROMAN[T[t].tg-1]}への 導音`:''}`);

    :`青＝半音下げた音（${namesN(B)}${bor.length?`。${namesN(bor)} は ${par}から かりた 音`:''}）`);

// 赤い音の せつめい
function redLabel(ns,t){
  if(AUG.includes(t)) return 'Ⅴへの 導音';
  return ns.some(n=>n.tag==='raised')?'半音上げた音・第3音は Ⅴ への 導音':'Ⅴ への 導音';

function kbRange(ms){
  let lo=Math.min(...ms)-2, hi=Math.max(...ms)+2;
  while(isBlack(lo)) lo--; while(isBlack(hi)) hi++;
  if(hi-lo<24){lo-=5;while(isBlack(lo))lo--;hi+=5;while(isBlack(hi))hi++;}
  return [lo,hi];
}

      <div class="qstaff">${progStaff(key,ans,isNew(t)?staffLab(t):M.label,M.color,st,t)}</div>${rolesHTML(disp(t,ans),key,t)}${t==='vii7'?'<p class="note">名前は Ⅶ7 として 見た よびかた（Ⅴ9 から 見ると 導音＝第3音、第7音＝第9音）</p>':t==='ddim'?'<p class="note">名前は Ⅴ9/Ⅴ から 見た よびかた（根音を はぶいたので、いちばん下の 導音が 第3音）</p>':''}
      <div class="row" style="margin-top:10px"><button class="btn small wide" data-act="qres">🔔 ${lab} → ${st.map(x=>labH(x.label)).join(' → ')} を きく</button></div></section>`;
  }
  return h;
}

/* ===== 👂 聴きわけ ===== */
function earData(e){
  const key=keyOfQ(e);
  if(e.lv===3){const c=cadOf(key,e.type);return {key,pre:c.I,chord:c.X,steps:[{label:'Ⅴ7',notes:c.V},{label:'Ⅰ',notes:c.I}]};}
  const chord=shiftN(e.lv===1?C[e.type](key):C.aug6(key,e.type),e.shift);
  const steps=stepsOf(key,e.type).map(s=>({label:s.label,notes:shiftN(s.notes,e.shift)}));
  return {key,chord,steps};
}
function newEar(){
  const types=EAR_LV[Q.earLv], ks=earKeys(Q.earLv), pick=a=>a[Math.floor(Math.random()*a.length)];
  let type=pick(types); if(Q.eq&&Q.eq.type===type&&Math.random()<0.5) type=pick(types);
  let k,tries=0; do{k=pick(ks);}while(Q.eq&&ks.length>1&&k.minor===Q.eq.minor&&k.keyIdx===Q.eq.keyIdx&&++tries<20);
  Q.eq={lv:Q.earLv,minor:k.minor,keyIdx:k.keyIdx,type,shift:pick(EAR_SHIFT[Q.earLv])};
  Q.ans=null; Q.resShown=false; Q.eqid++; save();
}
// レベル1：和音 → Ⅴ（ⅡかⅤへの すすみかたで くらべる）。レベル2：和音だけ（すすみかたは こたえてから）。
// レベル3：カデンツ Ⅰ → ？ → Ⅴ7 → Ⅰ（2ばんめの 和音を 当てる）
function playCad(pre,chord,steps){
  PA.chord(pre.map(n=>n.midi),{dur:1.2}); PA.chord(chord.map(n=>n.midi),{when:1.1,dur:1.4});
  PA.chord(steps[0].notes.map(n=>n.midi),{when:2.4,dur:1.2}); PA.chord(steps[1].notes.map(n=>n.midi),{when:3.5,dur:2.2});
}
function playEar(arp){
  const e=Q.eq; if(!e) return; const d=earData(e);
  PA.stopSound();
  if(arp){PA.chord(d.chord.map(n=>n.midi),{arp:true});return;}
  if(e.lv===3){playCad(d.pre,d.chord,d.steps);return;}
  if(e.lv===1){PA.chord(d.chord.map(n=>n.midi),{dur:1.4});PA.chord(d.steps[0].notes.map(n=>n.midi),{when:1.3,dur:2.2});}
  else PA.chord(d.chord.map(n=>n.midi),{dur:2.2});
}
function playSeq(chord,steps){
  PA.stopSound(); PA.chord(chord.map(n=>n.midi),{dur:1.4});
  steps.forEach((s,i)=>PA.chord(s.notes.map(n=>n.midi),{when:1.3*(i+1),dur:i===steps.length-1?2.2:1.4}));
}
function playEarRes(){const e=Q.eq; if(!e) return; const d=earData(e); if(e.lv===3){PA.stopSound();playCad(d.pre,d.chord,d.steps);return;} playSeq(d.chord,d.steps);}
// レベル1の くらべっこ：Ⅱ7 → Ⅴ、ドッペル → Ⅴ（おなじ 調・高さ）。レベル2：イタリア・フランス・ドイツ。レベル3：Ⅳ → Ⅴ7、Ⅳm → Ⅴ7、ナポリ → Ⅴ7
function playPair(){
  const e=Q.eq; if(!e) return; const key=keyOfQ(e);
  if(e.lv===3){
    PA.stopSound();
    EAR_LV[3].forEach((t,i)=>{const c=cadOf(key,t), w=i*3; PA.chord(c.X.map(n=>n.midi),{when:w,dur:1.4}); PA.chord(c.V.map(n=>n.midi),{when:w+1.3,dur:1.5});});
    return;
  }
  if(e.lv===2){ // イタリア → フランス → ドイツ（ひびきだけ。おなじ 調・高さ）
    PA.stopSound();
    AUG.forEach((t,i)=>PA.chord(shiftN(C.aug6(key,t),e.shift).map(n=>n.midi),{when:i*2.2,dur:1.9}));
    return;
  }
  const V=shiftN(C.toV(key),e.shift);
  PA.stopSound();
  [C.ii7(key),C.dd(key)].forEach((c,i)=>{const w=i*3; PA.chord(shiftN(c,e.shift).map(n=>n.midi),{when:w,dur:1.4}); PA.chord(V.map(n=>n.midi),{when:w+1.3,dur:1.5});});
}
function echoiceHTML(t){
  const e=Q.eq, A=Q.ans, M=T[t];
  let cls=''; if(A&&e){if(t===e.type)cls='right';else if(t===A)cls='wrong';}

}

function earFb(){
  const e=Q.eq, ok=Q.ans===e.type, M=T[e.type], d=earData(e), key=d.key;
  if(e.lv===3) return earFb3();
  let h=`<div class="fb ${ok?'good':'bad'}${Q.fresh?'':' still'}" role="status">${ok?'🎉 せいかい！':'🤔 おしい！'} これは <b>${M.long}</b>。「${M.word}」 ひびき。<br>${PA.keyName(key)}で 音は <b>${namesN(disp(e.type,d.chord))}</b>`;

    h+=`<span class="sm diff">Ⅱ7：${namesN(ii)}<br>ドッペル：${namesN(dd)}<br>ちがうのは ${diff.join('と ')}（半音上げた音）。上げた 第3音が Ⅴ の 根音「${PA.nmH(d.steps[0].notes[3])}」へ ぐっと 引っぱられるよ。</span>`;

  const marks=new Map(), last=resAll.length?resAll[resAll.length-1].notes:[];

    <li><b>ドッペルドミナント</b>は Ⅱ7 の <b>第3音を 半音上げた</b> 和音（短調では 第5音も 上げる）。上げた音が Ⅴ の 導音に なって、Ⅴ の 根音へ すすむ。「Ⅴ の ための Ⅴ7」（Ⅴ7/Ⅴ）だよ。</li>
    <li>Ⅴ の家族と おなじで、第9音を のせた <b>Ⅴ9/Ⅴ</b>、その 根音を はぶいた <b>減七/Ⅴ</b> も あるよ。</li>
    <li><b>増六の和音</b>は ドッペルの <b>第5音を 半音下げて</b>、その音を <b>いちばん下</b>に おいた形。<br>イタリア＝根音なし（3つ）、フランス＝根音あり、ドイツ＝根音の かわりに 第9音。</li>
    <li>下げた音と 上げた音の あいだが <b>増6度</b>。外へ ひらいて Ⅴ の オクターブへ。ドイツの6 は、そのまま Ⅴ へ すすむと 2つの 声が 5度の まま ならんで うごいて しまうので、あいだに ${I64H} を はさむことが 多いよ。</li>
    <li>長調の 増六は、下げた音（ドイツは 第9音も）を おなじ主音の 短調から かりてくるよ。</li>
    <li><b>ナポリの六</b>は 音階の 2ばんめを 半音下げた ♭Ⅱ を、<b>第3音（調の 4ばんめ）が いちばん下</b>に なるように おいた 和音（第1転回形）。根音は 文字で 2つ下の Ⅴ の 導音へ 下がるよ。長調では 第5音（6ばんめを 半音下げた 音）も おなじ 主音の 短調から かりる。</li>
    <li><b>準固有和音</b>は 長調で <b>おなじ 主音の 短調から かりる</b> 和音（○Ⅳ＝Ⅳm、○Ⅵ＝♭Ⅵ など）。かりた 音（半音下げた 6ばんめ）は 半音下の 5ばんめへ すすむ。</li>
    <li><b>副属和音</b>（Ⅴ7/Ⅱ など）は、Ⅱ・Ⅲ・Ⅳ・Ⅴ・Ⅵ（短調は Ⅲ・Ⅳ・Ⅴ・Ⅵ・Ⅶ）を いっとき Ⅰ に みたてた Ⅴ7（Ⅴ7/Ⅴ が ドッペル）。その音を 主音と する 調の Ⅴ7 を つくるよ。この クイズでは Ⅴ7/Ⅱ・Ⅴ7/Ⅳ・Ⅴ7/Ⅵ（短調は Ⅴ7/Ⅲ・Ⅴ7/Ⅳ・Ⅴ7/Ⅵ）を 出すよ。</li>
    <li><b>Ⅶ7</b> は Ⅴ9 の 根音を はぶいた 形。長調＝<b>半減七</b>（調の 音だけ）、短調＝<b>減七</b>（導音は 半音上げ、第7音は 調号どおり）。音で くらべると ちがうのは 第7音だけ。</li>
  </ul><div class="row"><span class="note" style="margin:0">くわしくは</span><a class="btn small" href="doppel.html">🔺 Ⅱ7と ドッペルドミナント</a><a class="btn small" href="aug6.html">↔️ 増六の和音</a><a class="btn small" href="neapolitan.html">🌋 ナポリの六</a><a class="btn small" href="borrowed.html">🎁 準固有和音</a><a class="btn small" href="secondary.html">🧭 副属和音</a><a class="btn small" href="dim-halfdim.html">⚖️ 減七と 半減七</a></div></details>`;
}
// 📝 の 回が おわった ときの けっかの カード
const summaryHTML=()=>sess.summaryHTML({title:'変化和音クイズ',page:QUIZ,params:linkParams(),settings:settingsText()});
function render(){
  if(Q.mode==='keys'&&!Q.q) newQ();
  const sum=sumOn();
  let h=`<div class="stack">${PA.seg('qmode',[['keys','🎹 おさえる'],['ear','👂 聴きわけ']],Q.mode,'full')}
    ${sum?summaryHTML():Q.mode==='keys'?keysView():earView()}
    ${settingsHTML()}${Q.mode==='keys'?checkHTML():''}${tipsHTML()}</div>`;
  PA.paint(document.getElementById('view'),h,sum?'s:'+sess.n():Q.mode==='keys'?'k:'+Q.qid+':'+(Q.checked?1:0):'e:'+Q.eqid+':'+(Q.ans?1:0));
  Q.fresh=false;
  renderActions();
}
let lastActions=null;
// 下の ボタン。キーボード・ペダル：スペース＝data-hot="listen"、Enter＝"check"、→＝"next"（core）
function renderActions(){
  let a;
  const end=sess.finished()&&!Q.sumOpen; // 📝 の さいごの もんだいに こたえた → つぎは けっか
  if(sumOn()) a=''; // けっかの カードに ボタンが ある
  else if(Q.mode==='keys'){
    const nx=end?'🎉 けっかを 見る':null;
    if(!Q.checked) a=`<button class="btn ok" data-act="qcheck" data-hot="check" ${Q.picked.size?'':'disabled'}>✅ こたえあわせ</button><button class="btn" data-act="qclear" ${Q.picked.size?'':'disabled'}>🧽 けす</button><button class="btn" data-act="qhint" ${Q.hint>=2?'disabled':''}>💡 ${Q.hint?'ヒント2':'ヒント'}</button>`;
    else if(!Q.lastOk) a=`<button class="btn primary" data-act="qnext" data-hot="next">${nx||'➡️ つぎへ'}</button><button class="btn" data-act="qretry">🔁 もういちど</button><button class="btn" data-act="qplay" data-hot="listen">🔊 こたえ</button>`;
    else a=`<button class="btn primary" data-act="qnext" data-hot="next">${nx||'➡️ つぎの もんだい'}</button><button class="btn" data-act="qplay" data-hot="listen">🔊 こたえを聴く</button>`;
  }else{
    const e=Q.eq;
    if(!e) a=`<button class="btn night" data-act="enew" data-hot="listen next">▶️ はじめる</button>`;
    else if(!Q.ans) a=`<button class="btn night" data-act="eplay" data-hot="listen">🔁 もういちど きく</button><button class="btn" data-act="earp">🎶 ばらばら</button>`;
    else a=`<button class="btn" data-act="eplay" data-hot="listen">🔁 きく</button><button class="btn" data-act="epair">⚖️ くらべる</button><button class="btn primary" data-act="enew" data-hot="next">${end?'🎉 けっか':'➡️ つぎ'}</button>`;
  }
  const bar=document.getElementById('actions');
  bar.style.display=a?'':'none';
  if(a!==lastActions){PA.paint(bar,a,'bar');lastActions=a;}
}
function reveal(el,target,bottomOnly){
  if(!el||!target||!el.getBoundingClientRect) return;
  const r=el.getBoundingClientRect(), bar=document.getElementById('appbar'), ab=document.getElementById('actions');
  const top=bar?bar.offsetHeight:0, bottom=innerHeight-(ab?ab.offsetHeight:0);
  if(r.bottom>bottom||(!bottomOnly&&r.top<top)) target.scrollIntoView({block:bottomOnly?'nearest':'start',behavior:PA.reduceMotion()?'auto':'smooth'});
}
const showFb=()=>{const el=document.getElementById('fb'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest',behavior:PA.reduceMotion()?'auto':'smooth'});};
// 「つくりかたを見る」：その ページの 保存に 調・和音を 書いて ひらく
// 変化和音の ページ：保存の 名前＝ページの 名前。{minor, keyIdx} と、borrowed は id（PA.henka.BORROWED_IDS）、
//   secondary は target（度数）・kind（'V7'）。'<ページ>-auto'＝true で ひらいたら つくりかたを はじめる
const NEW_PAGE={n6:['neapolitan',{}],iv:['borrowed',{id:'iv'}],ivm:['borrowed',{id:'iv'}],bvi:['borrowed',{id:'bVI'}],vii7:['dim-halfdim',{}]};
function goExplain(minor,keyIdx,type){
  PA.stopSound(); save();
  if(isNew(type)){
    const [page,extra]=T[type].tg?['secondary',{target:T[type].tg,kind:'V7'}]:NEW_PAGE[type];
    const p=PA.store.get(page,{});
    PA.store.set(page,{...(p&&typeof p==='object'?p:{}),minor:page==='borrowed'?false:minor,keyIdx,...extra});
    if(type!=='iv') PA.store.set(page+'-auto',true); // Ⅳ は ふつうの Ⅳ（かりる スイッチ オフ）を 見せる。アニメは ○Ⅳ で おわるので はじめない
    PA.go(page+'.html');
  }else if(AUG.includes(type)){
    const p=PA.store.get('aug6',{});
    PA.store.set('aug6',{...(p&&typeof p==='object'?p:{}),minor,keyIdx,type});
    PA.store.set('aug6-auto',true);
    PA.go('aug6.html');
  }else{
    const p=PA.store.get('doppel',{});
    PA.store.set('doppel',{...(p&&typeof p==='object'?p:{}),minor,keyIdx,raised:type!=='ii7'});
    PA.go('doppel.html');
  }
}

/* ===== 操作 ===== */
PA.mountBar({title:'変化和音クイズ',app:'chroma-quiz'});
PA.onSettings=render;
PA.onPageShow=()=>{PA.stopSound();location.reload();}; // 「もどる」で もどったら 読みなおす（べつの ページで すすめた きろくを 古い きろくで 上書きしない）
PA.onKey=m=>{ // 音は core が 鳴らす
  if(Q.mode!=='keys'||Q.checked) return;
  Q.picked.has(m)?Q.picked.delete(m):Q.picked.add(m); render();
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act, v=el.dataset.v;
  switch(a){
    case 'qmode': if(Q.mode===v||!['keys','ear'].includes(v)) return; PA.stopSound(); Q.mode=v; break;
    // 調を えらびなおしたら「この 調だけ」は やめる
    case 'qkeyset': if(Q.keyset===v||!KEYSETS.some(([x])=>x===v)) return; PA.stopSound(); Q.keyset=v; Q.lock=null; Q.lockSess=false; newQ(); Q.eq=null; Q.ans=null; Q.resShown=false; Q.eqid++; break;
    case 'qtier': if(Q.tier===v||!TIER_IDS.includes(v)) return; Q.tier=v; Q.lock=null; Q.lockSess=false; newQ(); break;
    case 'qkeyfree': Q.lock=null; Q.lockSess=false; break; // いまの もんだいは そのまま。つぎから ふくろの 調
    // 📝 きょうの 5もん：こたえた あとの もんだいなら 新しい もんだいから
    case 'sess5': {
      if(sess.finished()&&!Q.sumOpen) return; // けっかを 見る まえに 新しい 回に しない
      PA.stopSound(); sess.start(5); Q.sumOpen=false;
      if(Q.mode==='keys'){if(Q.checked||Q.result!==null) newQ(); break;}
      if(!Q.eq||Q.ans){newEar();render();playEar();PA.scrollTop();return;}
      break;
    }
    case 'session-again': case 'session-free': {
      PA.stopSound();
      if(a==='session-again'){sess.start(sess.n()||5);}
      else{sess.clear(); if(Q.lockSess){Q.lock=null;Q.lockSess=false;}}
      Q.sumOpen=false;
      if(Q.mode==='keys'){newQ(); save(); render(); PA.scrollTop(); return;}
      if(a==='session-again'){newEar(); render(); playEar(); PA.scrollTop(); return;}
      Q.eq=null; Q.ans=null; Q.resShown=false; Q.eqid++; break;
    }
    // チェック表の ます：その 調を 3もん（🎹 おさえる）
    case 'kd-pick': {
      const p=KD.parse(v); if(!p||p.id!==v) return;
      PA.stopSound(); Q.mode='keys'; Q.lock=p.id; Q.lockSess=true; sess.start(3); Q.sumOpen=false;
      newQ(); save(); render(); PA.scrollTop(); return;
    }
    case 'qweak': Q.weak=!Q.weak; syncDeck(); break; // つぎの ふくろから
    case 'klevel': {
      const lv=+v;
      if(lv===0){ // じぶんで えらぶ：和音の ボタンを ひらいて 見せる（和音は いまの まま）
        Q.kLv=0; Q.openSet=true; save(); render();
        const el=document.getElementById('qtypes'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'start',behavior:PA.reduceMotion()?'auto':'smooth'});
        return;
      }
      if(lv===Q.kLv||!KLV.some(x=>x.lv===lv)) return;
      PA.stopSound(); Q.kLv=lv; Q.types=typesOf(lv); newQ(); break;
    }
    case 'qtype': if(!TYPES.includes(v)) return; Q.types[v]=!Q.types[v]; if(!TYPES.some(t=>Q.types[t])) Q.types[v]=true; Q.kLv=levelOf(Q.types); newQ(); break;
    case 'keystats-reset': if(v!==QUIZ) return; Q.deck.reset(); break; // 2回 おす（data-confirm）は core が たしかめる
    case 'qreset': Q.sc[Q.mode]={right:0,total:0,streak:0}; break; // いまの もんだいが きろくずみ（つくりかたを 見た）なら そのまま（2回 きろくしない）
    case 'qcheck': if(Q.mode!=='keys'||Q.checked||!Q.picked.size) return; checkKeys(); save(); render(); showFb(); return;
    case 'qclear': Q.picked=new Set(); break;
    case 'qhint': Q.hint=Math.min(2,Q.hint+1); if(!Q.checked&&Q.result===null) Q.peek=true; save(); render(); showFb(); return;
    case 'qnext': PA.stopSound(); if(sess.finished()&&!Q.sumOpen) Q.sumOpen=true; else newQ(); save(); render(); PA.scrollTop(); return;
    case 'qretry': Q.picked=new Set(); Q.checked=false; Q.lastOk=null; break;
    case 'qplay': {PA.stopSound(); PA.chord(chordOf(keyOfQ(Q.q),Q.q.type).map(n=>n.midi)); return;}
    case 'qres': {const key=keyOfQ(Q.q); playSeq(chordOf(key,Q.q.type),stepsOf(key,Q.q.type)); return;}
    case 'qexplain': {
      if(!Q.checked&&Q.result===null) Q.peek=true; // こたえる まえに 見た：できたら「ヒントで できた」（×には しない）
      goExplain(Q.q.minor,Q.q.keyIdx,Q.q.type); return;
    }
    case 'elevel': {const lv=+v; if(lv===Q.earLv||!EAR_LV[lv]) return; PA.stopSound(); Q.earLv=lv; Q.eq=null; Q.ans=null; Q.resShown=false; Q.eqid++; break;}
    case 'enew':
      if(sess.finished()&&!Q.sumOpen){PA.stopSound();Q.sumOpen=true;save();render();PA.scrollTop();return;}
      newEar(); render(); playEar(); reveal(document.querySelector('#view .echoices'),document.querySelector('#view .hero')); return;
    case 'eplay': playEar(false); return;
    case 'earp': playEar(true); return;
    case 'epair': playPair(); return;
    case 'eans': {
      if(!Q.eq||Q.ans||!EAR_LV[Q.eq.lv].includes(v)) return;
      const ok=v===Q.eq.type, key=keyOfQ(Q.eq);
      Q.ans=v; score('ear',ok);
      sessRecord(ok,false,`👂 ${PA.keyName(key)}の ${T[Q.eq.type].long}${ok?'':`（えらんだ：${T[v].long}）`}`,KD.id(Q.eq.minor,Q.eq.keyIdx));
      save(); Q.fresh=true; render(); playEar(false);
      const fb=document.querySelector('#view .fb'); reveal(fb,fb,true); return;
    }
    case 'eres': if(!Q.eq||!Q.ans) return; Q.resShown=true; save(); render(); playEarRes(); return;
    case 'eexplain': if(!Q.eq||!Q.ans) return; goExplain(Q.eq.minor,Q.eq.keyIdx,Q.eq.type); return;
    case 'ecmp': {if(!EAR_LV[Q.earLv].includes(v)) return; const k=cmpKey(); if(Q.earLv===3){const c=cadOf(k,v);PA.stopSound();playCad(c.I,c.X,[{notes:c.V},{notes:c.I}]);return;} playSeq(v==='ii7'||v==='dd'?C[v](k):C.aug6(k,v),stepsOf(k,v)); return;}
    default: return;
  }
  save(); render();
});
document.addEventListener('toggle',e=>{if(e.target.id==='qsetd'&&Q.openSet!==e.target.open){Q.openSet=e.target.open;save();}},true);
if(Q.mode==='keys'&&!Q.q) newQ();
save(); render();
</script>
