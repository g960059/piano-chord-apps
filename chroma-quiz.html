<script>
/* 変化和音クイズ：Ⅱ7・ドッペルドミナント・減七/Ⅴ・増六（イタリア・フランス・ドイツ）・ナポリの六・準固有（○Ⅳ・○Ⅵ）・
 *   副属和音（Ⅴ7/x）・Ⅶ7（Ⅴ9の根音をはぶいた形：長調の形・減七）を 🎹 けんばんでおさえる／ 👂 ひびきで聴きわける。
 *   ならびとステップは先生のじゅん（docs/TEACHER-FEEDBACK.md）：Ⅱ7・ドッペル → 副属和音 → 準固有和音 → ナポリの六 → 増六 → 異名同音（ぜんぶ）。
 *   まえにならっていない和音が、さきのステップで出ないようにする。画面に「半減七」ということばは出さない
 *   和音のつづりと高さはぜんぶ PA.chroma・PA.henka から（ほかのページとそろえる）
 *   保存（'chroma-quiz'）：kStep（おさえるのステップ1〜6・0＝じぶんでえらぶ）・types・tier（PA.keyDeck のむずかしさ）・weak（にがてな調を多めに）。
 *   まえの形の kLv（レベル1〜5。kStep がない保存）は、そのレベルとおなじ和音（OLD_KLV）にしてよむ。
 *   まえの形（level＝調号の数・types だけ）は読みこむとき tier・kLv になおす。まえの level は「調号 N つまで」（0からつみかさね）、
 *   tier は帯（easy 0〜1・normal 2〜3・hard 4〜5）なので、帯になおすとえらんでいた調が出なくなる。だから level 0（ハ長調・イ短調だけ）は easy、
 *   それいがい（まえのはじめの値1もふくむ）はぜんぶ all にする。keyset がない保存（はじめて）は both（24調）から。
 *   調のきろくは PA.keyDeck（'keystats-chroma-quiz'）
 *
 *   リンクのパラメータ（先生の宿題・学ぶページの「ためしてみる」。しらべかたは linkOf）：
 *     mode＝keys（🎹 おさえる）｜ear（👂 聴きわけ）。mode がなくて step・level・chord・tier のどれか、または key と n のりょうほうがあれば keys
 *     step＝🎹 のステップ1〜6（KLV）：1＝Ⅱ7・ドッペル（減七/Ⅴも）  2＝副属和音  3＝準固有（○Ⅳ・○Ⅵ）  4＝ナポリの六  5＝増六3しゅるい  6＝ぜんぶ（Ⅶ7も）
 *     level＝👂 は1〜3（EAR_LV）：1＝Ⅱ7・ドッペル  2＝増六3しゅるい  3＝Ⅳ・○Ⅳ・ナポリ（長調だけ）。画面では先生のじゅん（1・3・2）にならべる
 *       🎹 の level（1〜5）はまえのリンク：そのときとおなじ和音（OLD_KLV）にする（ステップとおなじならそのステップ）。step があれば step
 *       学ぶページから：doppel → step 1・ear 1、secondary → chord dd,s2,s3,s4,s6、borrowed → step 3、
 *         neapolitan → step 4・ear 3、aug6 → step 5・ear 2、enharmonic → chord vii7（step 6）、enharmonic の 🔥 チャレンジ → chord ger・chal 1
 *         （その和音だけにしたいときは chord：neapolitan → n6、borrowed → ivm,bvi、secondary → s2,s3,s4,s6、enharmonic → vii7）
 *       🔥 チャレンジ（先生：読みかえのクイズに増六が入る問題は「チャレンジ」としてわける）：読みかえの和音（READ_SET＝減七/Ⅴ・Ⅶ7）と
 *         ドイツの6だけを「じぶんで選ぶ」で出すとき、ドイツの6の問題に 🔥 チャレンジのしるし（chalOf）。読みかえのチャレンジから来たとき
 *         （chal＝1。enharmonic の chord=ger&chal=1）か、読みかえの和音もいっしょに出すとき（まえのリンクの ger,ddim,vii7 など）だけ。
 *         🎛 でドイツだけを選んで増六の練習をするときや、ステップ5（増六）・6（ぜんぶ）では出さない（ふつうの増六の問題）
 *     chal＝1（読みかえのチャレンジから来た。その回だけ。保存しない。🎛・ステップをかえるとおしまい）
 *     chord＝🎹 の和音の id を , で（ii7 dd ddim it fr ger n6 ivm bvi s2 s3 s4 s6 vii7）。level よりさき（「じぶんでえらぶ」になる）
 *     tier＝easy｜normal｜hard｜all（🎹 の調のむずかしさ）、key＝M0〜M12・m0〜m12（その調だけ出す。🎹・👂 どちらも）、n＝1〜20（📝 n もん）
 *     リンクのせっていはほぞんする（いまのせっていになる）。おなじタブで読みなおしたとき（「もどる」）はもういちどつかわない
 *   こたえるまえに 💡 ヒント・🐸 つくりかたを見るをひらいたもんだいは、できたら「ヒントでできた」（×にしない。⭐ のせいかいにもならない） */
const C=PA.chroma, H=PA.henka, mod=PA.mod, KD=PA.keyDeck, QUIZ='chroma-quiz';
const T={
  ii7: {label:'Ⅱ7',     long:'Ⅱ7（にどしち）',             sub:'調の音だけでつくるⅡの七の和音', color:'#22a06b', emoji:'🌿', word:'やわらかい'},
  dd:  {label:'ドッペル', long:'ドッペルドミナント（ⅤのⅤ7）', sub:'ⅤのためのⅤ7',                 color:'#8a4fe0', emoji:'🧲', word:'Ⅴをつよくよぶ'},
  ddim:{label:'ⅤのⅤ9の根音省略',  long:'ⅤのⅤ9の根音省略（減七）',  sub:'ⅤのⅤ9から根音をはぶいた形（減七）',     color:'#b0307a'},
  it:  {label:'イタリア', long:'イタリアの6',                 sub:'増六の和音・根音なし',             color:'#1f8a99', emoji:'🍕', word:'うすい・かるい'},
  fr:  {label:'フランス', long:'フランスの6',                 sub:'増六の和音・根音あり',             color:'#5b5fc7', emoji:'🥐', word:'ふしぎ・ふわっと'},
  ger: {label:'ドイツ',   long:'ドイツの6',                   sub:'増六の和音・第9音つき',            color:'#9a5b13', emoji:'🥨', word:'こい・Ⅴ7みたい'},
  // ここから変化和音（PA.henka）。only＝その調だけで出る、tg＝副属和音の目標（度数）、staff＝がくふの和音記号
  n6:  {label:'ナポリ',   long:'ナポリの六',                  sub:'2ばんめを半音下げたナポリの和音。いちばん下は第3音', color:'#c4462a', emoji:'🌋', word:'ドラマチック'},
  iv:  {label:'Ⅳ',       long:'Ⅳ（ふつうのⅣ）',            sub:'調の音だけのⅣ',                   color:'#22a06b', emoji:'☀️', word:'あかるい'}, // 聴きわけレベル3だけ
  ivm: {label:'○Ⅳ',      long:'○Ⅳ（短調からかりたⅣ）',        sub:'同じ主音の短調からかりたⅣ',             color:'#3d63b8', emoji:'🌙', word:'せつない', only:'major'},
  bvi: {label:'○Ⅵ',      long:'○Ⅵ（短調からかりたⅥ）',        sub:'同じ主音の短調からかりたⅥ',             color:'#7a4cc2', only:'major'},
  s2:  {label:'ⅡのⅤ7',    tg:2, color:'#b85c00', only:'major'},
  s3:  {label:'ⅢのⅤ7',    tg:3, color:'#b85c00', only:'minor'},
  s4:  {label:'ⅣのⅤ7',    tg:4, color:'#b85c00'},
  s6:  {label:'ⅥのⅤ7',    tg:6, color:'#b85c00'},
  vii7:{label:'Ⅴ9の根音省略', long:'Ⅴ9の根音省略',               sub:'導音からひとつとばしに4つ（Ⅴ9の根音をはぶいた形）', color:'#0f7a72'}
};
/* 和音記号（藝大式・PA.rn の部品）。label・long はただの文字（きろく・読み上げ）、画面の記号はここから PA.rn で描く
 *   key がないとき（🎛 のボタン）は長調・短調でかわらない形。長調の増六・ナポリ・ⅤのⅤ9の根音省略は○（短調からかりる）
 *   voiced：このクイズのならびの記号（Ⅴ9の根音省略はいちばん下が導音なので第1転回形） */
const RN={ii7:{deg:2,form:7},dd:{of:5,deg:5,form:7},ddim:{of:5,deg:5,form:9,omit:true},iv:{deg:4},ivm:{deg:4,borrowed:true},bvi:{deg:6,borrowed:true},vii7:{deg:5,form:9,omit:true}};
const rnT=(key,t,voiced)=>{
  const maj=!!key&&!key.minor, b=maj?{borrowed:true}:{};
  if(T[t].tg) return key?H.rnParts(key,'secondary',T[t].tg,'V7'):{of:T[t].tg,deg:5,form:7};
  if(t==='n6') return key?H.rnParts(key,'N6'):{deg:2,rootDown:true,inv:1};
  if(['it','fr','ger'].includes(t)) return {of:5,deg:5,form:t==='ger'?9:7,inv:2,alt5:'down',...(t==='fr'?{}:{omit:true}),...b};
  if(t==='ddim') return {...RN.ddim,...b,...(voiced?{inv:1}:{})};
  if(t==='vii7') return {...RN.vii7,...(voiced?{inv:1}:{})};
  return RN[t]||null;
};
// 画面の和音名（HTML）：名前でよぶ和音（ドッペル・増六・ナポリ）はことば、ほかは記号
const NAMED=['dd','it','fr','ger','n6'];
const labelH=t=>NAMED.includes(t)?T[t].label:PA.rn(rnT(null,t))+(t==='ddim'?'<small>減七</small>':'');
const LONG_H={ii7:()=>`${PA.rn(RN.ii7)}（にどしち）`,dd:()=>`ドッペルドミナント（${PA.rn(RN.dd)}）`,ddim:k=>`${PA.rn(rnT(k,'ddim'))}（減七）`,
  iv:()=>`${PA.rn(RN.iv)}（ふつうのⅣ）`,ivm:()=>`${PA.rn(RN.ivm)}（短調からかりたⅣ）`,bvi:()=>`${PA.rn(RN.bvi)}（短調からかりたⅥ）`,vii7:()=>`${PA.rn(RN.vii7)}（Ⅴ9の根音省略）`};
const longH=(t,key)=>LONG_H[t]?LONG_H[t](key||null):T[t].long;
// <cq-link>（test/chroma-quiz.test.mjs がここだけ切りだして、レベルのなかみとリンクのしらべかたをたしかめる）
// 設定でならべるまとまり（TYPES のじゅんばんもこれ。先生のじゅん）
const GROUPS=[['Ⅱ7・ドッペル',['ii7','dd','ddim']],['副属和音',['s2','s3','s4','s6']],['準固有・ナポリ',['ivm','bvi','n6']],['増六',['it','fr','ger']],['Ⅴ9の根音省略（減七など）',['vii7']]];
const TYPES=GROUPS.flatMap(g=>g[1]), AUG=['it','fr','ger'];
// 🎹 おさえるのステップ（lv＝ステップの番号。リンクの step）。0＝じぶんでえらぶ（🎛 もんだいのえらびかたの和音のボタン）
//   先生のじゅん。そのステップでならう和音だけを出す（さきのステップの和音は出さない）。さいごは「ぜんぶ」
//   学ぶページのリンクがこのばんごうをつかうので、ならびをかえない（ふやすならうしろに）
const KLV=[
  {lv:1,types:['ii7','dd','ddim'],name:'Ⅱ7・ドッペル',desc:'Ⅱ7とドッペルドミナント（ⅤのⅤ9の根音省略も）'},
  {lv:2,types:['s2','s3','s4','s6'],name:'副属和音',desc:'副属和音（ⅡのⅤ7・ⅣのⅤ7・ⅥのⅤ7など）'},
  {lv:3,types:['ivm','bvi'],name:'準固有',desc:'準固有和音（○Ⅳ・○Ⅵ：同じ主音の短調からかりる和音。長調だけ）'},
  {lv:4,types:['n6'],name:'ナポリ',desc:'ナポリの六'},
  {lv:5,types:AUG,name:'増六',desc:'増六の和音（イタリアの6・フランスの6・ドイツの6）'},
  {lv:6,types:TYPES,name:'ぜんぶ',desc:'ぜんぶ（ステップ1〜5と、異名同音の読みかえで出てくるⅤ9の根音省略）'}
];

// こたえあわせのメッセージ（描くたびにつくるので、音名の設定をかえてもあう）
function hintsOf(key,t,g){

  if((t==='dd'||t==='ddim')&&miss(9)&&has(8)) H.push(key.minor
    ?`短調のドッペルは<b>第5音も半音上げる</b>よ：「${nm(N6)}」→「${nm(T5)}」。`
    :`第5音は「${nm(T5)}」のまま。半音下げていちばん下におくと増六の和音（${t==='dd'?'フランスの6':'ドイツの6'}）になるよ。`);
  if(t==='ddim'&&has(2)) H.push(`${PA.rn(RN.ddim)}（減七）は根音「${nm(R)}」を<b>はぶく</b>よ（ななめの線＝根音省略）。`);
  if(t==='ddim'&&miss(3)&&has(4)) H.push(`第9音は下げたほうの<b>「${nm(T9)}」</b>。「${nm(M9)}」のままではちがうよ。${key.minor?'':`長調でも${parName(key)}からかりて半音下げた音を使うよ。`}`);

/* 増六のこたえあわせ：こたえもヒントも PA.chroma の音（ドッペルの家族 ddStack・増六 aug6）のピッチクラスでくらべる。
 *   3つの増六のちがいは根音（フランス）と第9音＝短9度（ドイツ）だけ。どれも第5音を半音下げていちばん下 */
const AUG_NAME={it:'イタリアの6',fr:'フランスの6',ger:'ドイツの6'};
function augHints(key,t,g,book){
  const L=[], nm=PA.nmH, pc=n=>rel(key,n.midi), has=n=>g.P.has(pc(n)), ex=new Set(), say=(s,...ns)=>{L.push(s);ns.forEach(n=>ex.add(pc(n)));};
  const [R,T3,T5,T7,T9]=C.ddStack(key,'dd9'), lo=C.aug6(key,t)[0];
  const at=(lo_,semis)=>({...tn(key,lo_,semis),midi:key.tonicMidi+semis});
  const P4=at(3,5), V1=at(4,7), M9=at(2,4), par=parName(key), cnt=`${AUG_NAME[t]}は<b>${g.A.size}つ</b>の音だよ（いま${g.count}つ）。`;
  // ほかの増六そのもの（音がぴったりおなじ）
  const same=ns=>{const S=new Set(ns.map(pc));return S.size===g.P.size&&[...S].every(r=>g.P.has(r));};
  const other=AUG.find(x=>x!==t&&same(C.aug6(key,x)));
  if(other){
    const was={it:'根音も第9音もなしの3つの音',fr:`根音「${nm(R)}」あり`,ger:`第9音「${nm(T9)}」あり`}[other];
    const want={it:'根音も第9音も入れずに<b>3つだけ</b>',fr:`第9音ではなく<b>根音</b>「${nm(R)}」をのこすよ`,ger:`根音のかわりに<b>第9音</b>「${nm(T9)}」を入れるよ`}[t];
    L.push(`それは<b>${AUG_NAME[other]}</b>（${was}）。${AUG_NAME[t]}は${want}。`);
    if(g.count!==g.A.size) L.push(cnt);
    return L;
  }
  if(same(C.ddStack(key,'dd'))) L.push(`それは<b>ドッペルドミナント</b>。増六はドッペルの第5音を半音下げていちばん下におく形だよ。`);
  // 第5音を下げていない
  if(!has(lo)&&has(T5)) say(`ドッペルの第5音「${nm(T5)}」を<b>半音下げる</b>のをわすれていない？「${nm(lo)}」にして、いちばん下におくよ。`,T5);
  else if(!has(lo)) L.push(`いちばん下の「${nm(lo)}」（ドッペルの第5音を半音下げた音）を入れよう。`);
  // 第3音（Ⅴへの導音）
  if(!has(T3)&&has(P4)) say(`第3音「${nm(P4)}」を<b>半音上げる</b>のをわすれていない？「${nm(T3)}」にするとⅤの導音になるよ。`,P4);
  else if(!has(T3)&&has(V1)) say(`上げすぎ！「${nm(V1)}」はⅤの根音。第3音はすぐ下のけんばん「${nm(T3)}」まで。`,V1);
  else if(!has(T3)) L.push(`いちばん上に、Ⅴへの導音「${nm(T3)}」（第3音を半音上げた音）を入れよう。`);
  if(!has(T7)) L.push(`第7音「${nm(T7)}」（主音）も入れるよ。`);
  // 根音のある・なし（フランスだけのこす）と第9音（ドイツだけ短9度）
  if(t==='it'){
    if(has(R)) say(`イタリアの6は根音「${nm(R)}」を<b>はぶく</b>よ（3つの音）。根音を入れるとフランスの6。`,R);
    if(has(T9)) say(`「${nm(T9)}」を入れるとドイツの6になっちゃう。イタリアは3つだけ。`,T9);
  }
  if(t==='fr'){
    if(!has(R)) L.push(`フランスの6は根音「${nm(R)}」を<b>のこす</b>よ（4つの音）。根音なしはイタリアの6。`);
    if(has(T9)) say(`「${nm(T9)}」はドイツの6の音（第9音）。フランスの6には入れないよ。`,T9);
  }
  if(t==='ger'){
    if(has(R)) say(`ドイツの6は根音「${nm(R)}」を<b>はぶいて</b>、かわりに第9音を入れるよ。`,R);
    if(!has(T9)&&has(M9)) say(`第9音は下げたほうの<b>「${nm(T9)}」</b>。「${nm(M9)}」のままではちがうよ。${key.minor?'':`長調でも${par}からかりて半音下げた音を使うよ。`}`,M9);
    else if(!has(T9)) L.push(`<b>第9音</b>「${nm(T9)}」をのせるよ${key.minor?'':`（長調でも${par}からかりた音）`}。`);
  }
  // ここまでで言っていないよけいな音（ドッペルの第5音・根音・第9音などいがい）は名前を出して「いらない」と言う
  const odd=g.extra.filter(r=>!ex.has(r)).sort((a,b)=>a-b);
  if(odd.length) L.push(`${odd.map(r=>`「${PA.H(nameOf(key.tonicMidi+r,key,book))}」`).join('・')}はいらないよ。`);
  if(g.count!==g.A.size) L.push(cnt);
  return L;
}

    const tr=[],lh=[],map=[];

function kbRange(ms){

/* ===== 👂 聴きわけ ===== */
function earData(e){
  const key=keyOfQ(e);
  if(e.lv===3){const c=cadOf(key,e.type);return {key,pre:c.I,chord:c.X,steps:[{label:'Ⅴ7',notes:c.V},{label:'Ⅰ',notes:c.I}]};}
  const chord=shiftN(e.lv===1?C[e.type](key):C.aug6(key,e.type),e.shift);
  const steps=stepsOf(key,e.type).map(s=>({label:s.label,notes:shiftN(s.notes,e.shift)}));
  return {key,chord,steps};
}
function newEar(){
  const types=EAR_LV[Q.earLv], ks=earKeys(Q.earLv), pick=a=>a[Math.floor(Math.random()*a.length)];
  let type=pick(types); if(Q.eq&&Q.eq.type===type&&Math.random()<0.5) type=pick(types);
  let k,tries=0; do{k=pick(ks);}while(Q.eq&&ks.length>1&&k.minor===Q.eq.minor&&k.keyIdx===Q.eq.keyIdx&&++tries<20);
  Q.eq={lv:Q.earLv,minor:k.minor,keyIdx:k.keyIdx,type,shift:pick(EAR_SHIFT[Q.earLv])};
  Q.ans=null; Q.resShown=false; Q.eHint=false; Q.eqid++; save();
}
// レベル1：和音 → Ⅴ（ⅡかⅤへのすすみかたでくらべる）。レベル2：和音だけ（すすみかたはこたえてから）。
// レベル3：カデンツⅠ → ？ → Ⅴ7 → Ⅰ（2ばんめの和音を当てる）
function playCad(pre,chord,steps){
  PA.chord(pre.map(n=>n.midi),{dur:1.2}); PA.chord(chord.map(n=>n.midi),{when:1.1,dur:1.4});
  PA.chord(steps[0].notes.map(n=>n.midi),{when:2.4,dur:1.2}); PA.chord(steps[1].notes.map(n=>n.midi),{when:3.5,dur:2.2});
}
function playEar(arp){
  const e=Q.eq; if(!e) return; const d=earData(e);
  PA.stopSound();
  if(arp){PA.chord(d.chord.map(n=>n.midi),{arp:true});return;}
  if(e.lv===3){playCad(d.pre,d.chord,d.steps);return;}
  if(e.lv===1){PA.chord(d.chord.map(n=>n.midi),{dur:1.4});PA.chord(d.steps[0].notes.map(n=>n.midi),{when:1.3,dur:2.2});}
  else PA.chord(d.chord.map(n=>n.midi),{dur:2.2});
}
function playSeq(chord,steps){
  PA.stopSound(); PA.chord(chord.map(n=>n.midi),{dur:1.4});
  steps.forEach((s,i)=>PA.chord(s.notes.map(n=>n.midi),{when:1.3*(i+1),dur:i===steps.length-1?2.2:1.4}));
}
function playEarRes(){const e=Q.eq; if(!e) return; const d=earData(e); if(e.lv===3){PA.stopSound();playCad(d.pre,d.chord,d.steps);return;} playSeq(d.chord,d.steps);}
// レベル1のくらべっこ：Ⅱ7 → Ⅴ、ドッペル → Ⅴ（おなじ調・高さ）。レベル2：イタリア・フランス・ドイツ。レベル3：Ⅳ → Ⅴ7、○Ⅳ → Ⅴ7、ナポリ → Ⅴ7
function playPair(){
  const e=Q.eq; if(!e) return; const key=keyOfQ(e);
  if(e.lv===3){
    PA.stopSound();
    EAR_LV[3].forEach((t,i)=>{const c=cadOf(key,t), w=i*3; PA.chord(c.X.map(n=>n.midi),{when:w,dur:1.4}); PA.chord(c.V.map(n=>n.midi),{when:w+1.3,dur:1.5});});
    return;
  }
  if(e.lv===2){ // イタリア → フランス → ドイツ（ひびきだけ。おなじ調・高さ）
    PA.stopSound();
    AUG.forEach((t,i)=>PA.chord(shiftN(C.aug6(key,t),e.shift).map(n=>n.midi),{when:i*2.2,dur:1.9}));
    return;
  }
  const V=shiftN(C.toV(key),e.shift);
  PA.stopSound();
  [C.ii7(key),C.dd(key)].forEach((c,i)=>{const w=i*3; PA.chord(shiftN(c,e.shift).map(n=>n.midi),{when:w,dur:1.4}); PA.chord(V.map(n=>n.midi),{when:w+1.3,dur:1.5});});
}

    <p class="note" style="margin-top:0">${Q.earLv===1?'和音の後にⅤが鳴るよ。Ⅴへ引っぱるちからのつよさを聴きくらべよう。毎回、調と高さがかわるよ。':Q.earLv===2?'増六の和音だけが鳴るよ。ひびきの「こさ」で当てよう。毎回、調と高さがかわるよ。':'長調の和音のならび<b>Ⅰ → ？ → Ⅴ7 → Ⅰ</b>が鳴るよ。2ばんめの和音を当てよう。となりどうし（Ⅳと○Ⅳ、○Ⅳとナポリ）は1つの音だけちがうよ。毎回、調がかわるよ（長調だけ）。'}</p>
    ${mute&&!(e&&Q.ans)?`<div class="msg">🔇 音がオフになっているので、${e?'いまは何も鳴っていないよ':'おしても和音が鳴らないよ'}。上の<b>音を出す</b>をおしてから${e?'<b>もういちどきく</b>':'<b>始める</b>'}をおしてね。</div>`
      :e?'':PA.once('ear-start','<div class="msg">下の<b>始める</b>をおすと和音が鳴るよ。</div>')}
    <div class="echoices n${types.length}">${types.map(echoiceHTML).join('')}</div>
    ${e&&Q.ans?earFb():''}
  </section>`;
  const k=cmpKey();
  h+=`<section class="card"><h2>🎧 くらべてきく<small>${PA.keyName(k)}でならべたよ</small></h2>${e&&!Q.ans?PA.once('hint-rule',`<p class="qsub" style="margin:0 0 8px">${PA.HINT_NOTE}</p>`):''}<div class="cmpgrid">`+types.map(t=>{
    if(Q.earLv===3){const c=cadOf(k,t);return `<button class="cmpbtn" style="--c:${T[t].color}" data-act="ecmp" data-v="${t}"><b>${T[t].emoji}Ⅰ → ${longH(t,k)} → Ⅴ7 → Ⅰ</b><small>${namesN(roleSort(c.X))} → ${namesN(uniqM(c.V))}</small></button>`;}
    const c=t==='ii7'||t==='dd'?C[t](k):C.aug6(k,t), st=stepsOf(k,t);
    return `<button class="cmpbtn" style="--c:${T[t].color}" data-act="ecmp" data-v="${t}"><b>${T[t].emoji} ${longH(t,k)} → ${st.map(x=>labH(x.label)).join(' → ')}</b><small>${namesN(disp(t,c))} → ${st.map(x=>namesN(uniqM(x.notes))).join(' → ')}</small></button>`;
  }).join('')+`</div></section>`;
  return h;
}

function tipsHTML(){
  return `<details class="more tips" data-d="tips"><summary>💡 おぼえておこう</summary><ul>
    <li><b>Ⅱ7（にどしち）</b>は調の音だけでつくる和音。Ⅳとにたはたらきで、Ⅴの前におくよ。</li>
    <li><b>ドッペルドミナント</b>はⅡ7の<b>第3音を半音上げた</b>和音（短調では第5音も上げる）。上げた音がⅤの導音になって、Ⅴの根音へすすむ。「ⅤのためのⅤ7」（${PA.rn(RN.dd)}）だよ。</li>
    <li>Ⅴの家族と同じで、第9音をのせた<b>${PA.rn({of:5,deg:5,form:9})}</b>、その根音をはぶいた<b>${PA.rn(RN.ddim)}</b>（減七）もあるよ。</li>
    <li><b>副属和音</b>（${PA.rn({of:2,deg:5,form:7})}など）は、Ⅱ・Ⅲ・Ⅳ・Ⅴ・Ⅵ（短調はⅢ・Ⅳ・Ⅴ・Ⅵ・Ⅶ）をいっときⅠにみたてたⅤ7（${PA.rn(RN.dd)}がドッペル）。その音を主音とする調のⅤ7をつくるよ。記号は上の小さい数字が目標、下の大きい数字がⅤ7。このクイズでは${[2,4,6].map(x=>PA.rn({of:x,deg:5,form:7})).join('・')}（短調は${[3,4,6].map(x=>PA.rn({of:x,deg:5,form:7})).join('・')}）を出すよ。</li>
    <li><b>準固有和音</b>は長調で<b>同じ主音の短調からかりる</b>和音（${PA.rn(RN.ivm)}・${PA.rn(RN.bvi)}など）。かりた音（半音下げた6ばんめ）は半音下の5ばんめへすすむ。</li>
    <li><b>ナポリの六</b>（${PA.rn({deg:2,rootDown:true,inv:1})}）は音階の2ばんめを半音下げた音を根音にした長三和音（ナポリの和音）を、<b>第3音（調の4ばんめ）がいちばん下</b>になるようにおいた和音（第1転回形）。根音は文字で2つ下のⅤの導音へ下がるよ。長調では第5音（6ばんめを半音下げた音）も同じ主音の短調からかりる。</li>
    <li><b>増六の和音</b>はドッペルの<b>第5音を半音下げて</b>、その音を<b>いちばん下</b>においた形。<br>イタリア＝根音なし（3つ）、フランス＝根音あり、ドイツ＝根音のかわりに第9音。</li>
    <li>下げた音と上げた音のあいだが<b>増6度</b>。外へひらいてⅤのオクターブへ。ドイツの6は、そのままⅤへすすむと2つの声が5度のままならんで動いてしまうので、あいだに${I64H}をはさむことが多いよ。</li>
    <li>長調の増六は、下げた音（ドイツは第9音も）を同じ主音の短調からかりてくるよ。</li>
    <li><b>Ⅴ9の根音省略</b>（${PA.rn(RN.vii7)}）は、導音からひとつとばしに4つ（Ⅶ7の形）。短調＝<b>減七</b>（導音は半音上げ、第9音（音階の6ばんめ）は調号どおり）。長調は、第9音が半音高いので減七にならない（長調の形）。ちがうのはその音だけ。</li>
  </ul><div class="row"><span class="note" style="margin:0">くわしくは</span><a class="btn small" href="doppel.html"><span aria-hidden="true">🔺</span> Ⅱ7とドッペルドミナント</a><a class="btn small" href="secondary.html"><span aria-hidden="true">🧭</span> 副属和音</a><a class="btn small" href="borrowed.html"><span aria-hidden="true">🎁</span> 準固有和音</a><a class="btn small" href="neapolitan.html"><span aria-hidden="true">🌋</span> ナポリの六</a><a class="btn small" href="aug6.html"><span aria-hidden="true">↔️</span> 増六の和音</a><a class="btn small" href="enharmonic.html"><span aria-hidden="true">🔀</span> 異名同音の読みかえ</a><a class="btn small" href="dim-halfdim.html"><span aria-hidden="true">⚖️</span> Ⅴ9の根音省略</a></div></details>`;
}

    else a=`<button class="btn primary" data-act="qnext" data-hot="next">${nx||PA.icon('next')+'次の問題'}</button><button class="btn" data-act="qplay" data-hot="listen">${PA.icon('listen')}こたえを聴く</button>`;
  }else{

    else a=`<button class="btn" data-act="eplay" data-hot="listen">${PA.icon('repeat')}きく</button><button class="btn" data-act="epair">⚖️ くらべる</button><button class="btn primary" data-act="enew" data-hot="next">${end?'🎉 けっか':PA.icon('next')+'次'}</button>`;

function reveal(el,target,bottomOnly){
  if(!el||!target||!el.getBoundingClientRect) return;
  const r=el.getBoundingClientRect(), bar=document.getElementById('appbar'), ab=document.getElementById('actions');
  const top=bar?bar.offsetHeight:0, bottom=innerHeight-(ab?ab.offsetHeight:0);
  if(r.bottom>bottom||(!bottomOnly&&r.top<top)) target.scrollIntoView({block:bottomOnly?'nearest':'start',behavior:PA.reduceMotion()?'auto':'smooth'});
}
const showFb=()=>{const el=document.getElementById('fb'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest',behavior:PA.reduceMotion()?'auto':'smooth'});};
// 「つくりかたを見る」：そのページの保存に調・和音を書いてひらく
// 変化和音のページ：保存の名前＝ページの名前。{minor, keyIdx}と、borrowed は id（PA.henka.BORROWED_IDS）、
//   secondary は target（度数）・kind（'V7'）。'<ページ>-auto'＝true でひらいたらつくりかたをはじめる
const NEW_PAGE={n6:['neapolitan',{}],iv:['borrowed',{id:'iv'}],ivm:['borrowed',{id:'iv'}],bvi:['borrowed',{id:'bVI'}],vii7:['dim-halfdim',{}]};
function goExplain(minor,keyIdx,type){
  PA.stopSound(); save();
  if(isNew(type)){
    const [page,extra]=T[type].tg?['secondary',{target:T[type].tg,kind:'V7'}]:NEW_PAGE[type];
    const p=PA.store.get(page,{});
    PA.store.set(page,{...(p&&typeof p==='object'?p:{}),minor:page==='borrowed'?false:minor,keyIdx,...extra});
    if(type!=='iv') PA.store.set(page+'-auto',true); // ⅣはふつうのⅣ（かりるスイッチオフ）を見せる。アニメは ○Ⅳでおわるのではじめない
    PA.go(page+'.html');
  }else if(AUG.includes(type)){
    const p=PA.store.get('aug6',{});
    PA.store.set('aug6',{...(p&&typeof p==='object'?p:{}),minor,keyIdx,type});
    PA.store.set('aug6-auto',true);
    PA.go('aug6.html');
  }else{
    const p=PA.store.get('doppel',{});
    PA.store.set('doppel',{...(p&&typeof p==='object'?p:{}),minor,keyIdx,raised:type!=='ii7'});
    PA.go('doppel.html');
  }
}

PA.mountBar({title:'変化和音クイズ',app:'chroma-quiz'});

PA.onPageShow=()=>{PA.stopSound();location.reload();}; // 「もどる」でもどったら読みなおす（べつのページですすめたきろくを古いきろくで上書きしない）
PA.onKey=m=>{ // 音は core が鳴らす
  if(Q.mode!=='keys'||Q.checked) return;
  if(PA.midiIn) m=inKb(m); // 電子ピアノ：画面のけんばんの高さへ（KB_LO〜KB_HI はいつも見えている）
  Q.picked.has(m)?Q.picked.delete(m):Q.picked.add(m); render();
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act, v=el.dataset.v;
  switch(a){
    case 'qmode': if(Q.mode===v||!['keys','ear'].includes(v)) return; PA.stopSound(); Q.mode=v; break;
    // 調をえらびなおしたら「この調だけ」はやめる
    case 'qkeyset': if(Q.keyset===v||!KEYSETS.some(([x])=>x===v)) return; PA.stopSound(); Q.keyset=v; Q.lock=null; Q.lockSess=false; newQ(); Q.eq=null; Q.ans=null; Q.resShown=false; Q.eqid++; break;
    case 'qtier': if(Q.tier===v||!TIER_IDS.includes(v)) return; Q.tier=v; Q.lock=null; Q.lockSess=false; newQ(); break;
    case 'qkeyfree': Q.lock=null; Q.lockSess=false; break; // いまのもんだいはそのまま。つぎからふくろの調
    // 📝 きょうの5もん：こたえたあとのもんだいなら新しいもんだいから
    case 'sess5': {
      if(sess.finished()&&!Q.sumOpen) return; // けっかを見るまえに新しい回にしない
      PA.stopSound(); sess.start(5); Q.sumOpen=false;
      if(Q.mode==='keys'){if(Q.checked||Q.result!==null) newQ(); break;}
      if(!Q.eq||Q.ans){newEar();render();playEar();PA.scrollTop();return;}
      break;
    }
    case 'session-again': case 'session-free': {
      PA.stopSound();
      if(a==='session-again'){sess.start(sess.n()||5);}
      else{sess.clear(); if(Q.lockSess){Q.lock=null;Q.lockSess=false;}}
      Q.sumOpen=false;
      if(Q.mode==='keys'){newQ(); save(); render(); PA.scrollTop(); return;}
      if(a==='session-again'){newEar(); render(); playEar(); PA.scrollTop(); return;}
      Q.eq=null; Q.ans=null; Q.resShown=false; Q.eHint=false; Q.eqid++; break;
    }
    // チェック表のます：その調を3もん（🎹 おさえる）
    case 'kd-pick': {
      const p=KD.parse(v); if(!p||p.id!==v) return;
      PA.stopSound(); Q.mode='keys'; Q.lock=p.id; Q.lockSess=true; sess.start(3); Q.sumOpen=false;
      newQ(); save(); render(); PA.scrollTop(); return;
    }
    case 'qweak': Q.weak=!Q.weak; syncDeck(); break; // つぎのふくろから
    case 'klevel': {
      const lv=+v;
      if(lv===0){ // じぶんでえらぶ：和音のボタンをひらいて見せる（和音はいまのまま）
        Q.kLv=0; Q.openSet=true; save(); render();
        const el=document.getElementById('qtypes'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'start',behavior:PA.reduceMotion()?'auto':'smooth'});
        return;
      }
      if(lv===Q.kLv||!KLV.some(x=>x.lv===lv)) return;
      PA.stopSound(); Q.kLv=lv; Q.types=typesOf(lv); Q.chal=false; newQ(); break;
    }
    case 'qtype': if(!TYPES.includes(v)) return; Q.types[v]=!Q.types[v]; if(!TYPES.some(t=>Q.types[t])) Q.types[v]=true; Q.kLv=levelOf(Q.types); Q.chal=false; newQ(); break;
    case 'keystats-reset': if(v!==QUIZ) return; Q.deck.reset(); break; // 2回おす（data-confirm）は core がたしかめる
    case 'qreset': Q.sc[Q.mode]={right:0,total:0,streak:0,hint:0}; break; // いまのもんだいがきろくずみ（つくりかたを見た）ならそのまま（2回きろくしない）
    case 'qcheck': if(Q.mode!=='keys'||Q.checked||!Q.picked.size) return; checkKeys(); save(); render(); showFb(); return;
    case 'qclear': Q.picked=new Set(); break;
    case 'qhint': Q.hint=Math.min(2,Q.hint+1); if(!Q.checked&&Q.result===null) Q.peek=true; save(); render(); showFb(); return;
    case 'qnext': PA.stopSound(); if(sess.finished()&&!Q.sumOpen) Q.sumOpen=true; else newQ(); save(); render(); PA.scrollTop(); return;
    case 'qretry': Q.picked=new Set(); Q.checked=false; Q.lastOk=null; break;
    case 'qplay': {PA.stopSound(); PA.chord(chordOf(keyOfQ(Q.q),Q.q.type).map(n=>n.midi)); return;}
    case 'qres': {const key=keyOfQ(Q.q); playSeq(chordOf(key,Q.q.type),stepsOf(key,Q.q.type)); return;}
    case 'qexplain': {
      if(!Q.checked&&Q.result===null) Q.peek=true; // こたえるまえに見た：できたら「ヒントでできた」（×にはしない）
      goExplain(Q.q.minor,Q.q.keyIdx,Q.q.type); return;
    }
    case 'elevel': {const lv=+v; if(lv===Q.earLv||!EAR_LV[lv]) return; PA.stopSound(); Q.earLv=lv; Q.eq=null; Q.ans=null; Q.resShown=false; Q.eHint=false; Q.eqid++; break;}
    case 'enew':
      if(sess.finished()&&!Q.sumOpen){PA.stopSound();Q.sumOpen=true;save();render();PA.scrollTop();return;}
      newEar(); render(); playEar(); reveal(document.querySelector('#view .echoices'),document.querySelector('#view .hero')); return;
    case 'eplay': playEar(false); return;
    case 'earp': playEar(true); return;
    case 'epair': playPair(); return;
    case 'eans': {
      if(!Q.eq||Q.ans||!EAR_LV[Q.eq.lv].includes(v)) return;
      const ok=v===Q.eq.type, key=keyOfQ(Q.eq), hint=ok&&Q.eHint; // こたえるまえに 🎧 くらべてきくをつかった：できたら「ヒントでできた」
      Q.ans=v; score('ear',ok,hint); PA.answerFx(ok);
      sessRecord(ok,hint,`👂 ${PA.keyName(key)}の${T[Q.eq.type].long}${ok?'':`（選んだ：${T[v].long}）`}`,KD.id(Q.eq.minor,Q.eq.keyIdx));
      save(); Q.fresh=true; render(); playEar(false);
      const fb=document.querySelector('#view .fb'); reveal(fb,fb,true); return;
    }
    case 'eres': if(!Q.eq||!Q.ans) return; Q.resShown=true; save(); render(); playEarRes(); return;
    case 'eexplain': if(!Q.eq||!Q.ans) return; goExplain(Q.eq.minor,Q.eq.keyIdx,Q.eq.type); return;
    case 'ecmp': {
      if(!EAR_LV[Q.earLv].includes(v)) return;
      // こたえるまえにきいたら「ヒントでできた」（音がオフのときは鳴らないのでしない）
      if(Q.eq&&!Q.ans&&!Q.eHint&&PA.settings.sound){Q.eHint=true;save();} // 見た目はかわらない（ボタンのフォーカスをのこす）
      const k=cmpKey(); if(Q.earLv===3){const c=cadOf(k,v);PA.stopSound();playCad(c.I,c.X,[{notes:c.V},{notes:c.I}]);return;} playSeq(v==='ii7'||v==='dd'?C[v](k):C.aug6(k,v),stepsOf(k,v)); return;}
    default: return;
  }
  save(); render();
});
document.addEventListener('toggle',e=>{if(e.target.id==='qsetd'&&Q.openSet!==e.target.open){Q.openSet=e.target.open;save();}},true);
if(Q.mode==='keys'&&!Q.q) newQ();
save(); render();
</script>
</body>
