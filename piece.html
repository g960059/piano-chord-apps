<body>
<header class="appbar" id="appbar"></header>
<main class="page" id="view"></main>
<div class="actionbar" id="actions"></div>
<script src="assets/vendor/vexflow-bravura.js"></script>
<script src="assets/core.js"></script>
<script src="assets/piece.js"></script>
<script src="assets/score.js"></script>
<script>
/* 名曲で楽曲分析：本物の曲（コンクールでひくような曲）の和音を、記号で穴うめする（先生の案。docs/REPERTOIRE-ANALYSIS.md）
 *   曲のデータ：assets/pieces/<id>.json（しくみと形は assets/piece.js のコメント）。ページ：piece.html?id=k545-1
 *   がくふは本物の楽譜（pc.score を assets/score.js が VexFlow で描く。スマホは1段に1小節、はばの広い画面は2小節）。
 *     その下の列（楽曲分析で記号を書く所。調は左はしに、さいしょの段と調がかわる段だけ）に、和音がかわる拍ごとに「？」。和音だけにした「骨組み」（全音符。PA.staffSVG）は、段ごとの「ヒント」で見る
 *     （VexFlow が読めなかったときは、骨組みの下に「？」をならべる、まえの形）
 *   答えかた（先生：人では分けない。何を答えるかを自分でえらぶ）：'deg'＝和音の番号だけ（4択）、'inv'＝転回形も、
 *     'full'＝ぜんぶ（番号・7／9・転回形・○・ⅤのⅤを部品でつくる。調とおわりかたの問題も）
 *   音：この和音・この小節・ぜんぶ。本物の楽譜の音をリズムどおりに鳴らす（鳴っている和音の所を、がくふの色と「？」のわくで見せる）。
 *     「和音にして聴く」は骨組みの和音をいっしょに鳴らす
 * リンク：id＝曲（なければさいごにひらいた曲）、mode＝deg｜inv｜full（その答えかたで。ほぞんもする）
 * 保存：PA.store 'piece-<id>'＝{lv, tempo, ans:{deg:{問題の id:{a（部品か文字）, ok}}, inv:{…}, full:{…}}}（いちど答えたらかえない）
 *       PA.store 'pieces'＝{<id>:{t（さいごにひらいた時こく）, n（答えた数）, best:{deg|inv|full:{ok, n}}}}（ホームの ★ でつかう） */
const PC=PA.piece, ESC=PA.esc, LEVELS=PC.LEVELS;
const LV_NAME={deg:'和音の番号だけ',inv:'転回形も',full:'ぜんぶ'};
const LV_SUB={deg:'この曲に出てくる和音（Ⅰ〜Ⅶの番号と、ⅤのⅤなど）から、えらぶよ。',inv:'番号と、転回形（いちばん下の音で決まる形）を答えるよ。ⅤのⅤ・○のしるしもつけてね。',full:'番号・7の和音・転回形・○・ⅤのⅤまで、記号をぜんぶつくるよ。調とおわりかたの問題もあるよ。'};
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
// 地図にある曲（PA.UNITS の 'pieces' の課題の href から）
const READY=[];
PA.UNITS.filter(u=>u.kind==='pieces').forEach(u=>u.tasks.forEach(t=>{const m=/[?&]id=([a-z0-9-]+)/.exec(t.href||'');if(m) READY.push(m[1]);}));
const META=(()=>{const m=PA.store.get('pieces',{});return isObj(m)?m:{};})();
const P=PA.params();
// 曲：リンクの id → さいごにひらいた曲 → さいしょの曲。地図にない id は「見つからない」
const ID=(()=>{
  if(P.id!=null) return READY.includes(P.id)?P.id:null;
  let best=null; READY.forEach(id=>{const t=isObj(META[id])?META[id].t:0;if(t>0&&(!best||t>META[best].t)) best=id;});
  return best||READY[0]||null;
})();
const SKEY='piece-'+ID;
const S={pc:null,err:ID?null:'notfound',lv:'deg',tempo:'slow',ans:{deg:{},inv:{},full:{}},sel:null,
  B:{deg:null,form:0,inv:0,borrowed:false,of:false},playing:null,cur:-1,muteHint:false,focusNext:false,
  hint:{}}; // hint：ヒント（骨組み）をひらいている段（段のさいしょの小節の番号：true）。ほぞんしない
// 1段の小節の数：はばの広い画面は2、スマホは1（線のあいだが7pxいじょうになるように）
const WIDE='(min-width: 700px)';
const perNow=()=>{try{return window.matchMedia&&window.matchMedia(WIDE).matches?2:1;}catch(e){return 1;}};
if(LEVELS.includes(P.mode)) S.lv=P.mode;

/* ===== 保存 ===== */
function load(){
  const d=PA.store.get(SKEY,{}), o=isObj(d)?d:{};
  if(!LEVELS.includes(P.mode)&&LEVELS.includes(o.lv)) S.lv=o.lv;
  if(o.tempo==='slow'||o.tempo==='normal') S.tempo=o.tempo;
  // こたえ：いまの曲の問題で、形があっているものだけ
  const pc=S.pc, ans=isObj(o.ans)?o.ans:{};
  LEVELS.forEach(lv=>{
    const r=isObj(ans[lv])?ans[lv]:{}, out={};
    PC.items(pc,lv).forEach(x=>{
      const a=r[x.id]; if(!isObj(a)||typeof a.ok!=='boolean') return;
      if(x.kind==='q'){if(x.item.choices.includes(a.a)) out[x.id]={a:a.a,ok:PC.check(x.item,a.a,lv)};}
      else if(isObj(a.a)&&Number.isInteger(a.a.deg)) out[x.id]={a:PA.rnNorm(a.a),ok:PC.check(x.item,a.a,lv)};
    });
    S.ans[lv]=out;
  });
  // ホームの ★：曲のデータをなおして問題の数がかわったら、まえのけっかはけす（ちがう問題のけっかなので）
  const m=PA.store.get('pieces',{}), me=isObj(m)&&isObj(m[ID])?m[ID]:null;
  if(me&&isObj(me.best)&&LEVELS.some(lv=>isObj(me.best[lv])&&me.best[lv].n!==PC.items(pc,lv).length))
    saveMeta(x=>{LEVELS.forEach(lv=>{if(isObj(x.best[lv])&&x.best[lv].n!==PC.items(pc,lv).length) delete x.best[lv];});return x;});
}
function save(){PA.store.set(SKEY,{lv:S.lv,tempo:S.tempo,ans:S.ans});}
// ホームの ★：ひらいた時こく・答えた数・答えかたごとのいちばんよいけっか
function saveMeta(f){
  const m=PA.store.get('pieces',{}), all=isObj(m)?m:{}, me=isObj(all[ID])?all[ID]:{};
  const best=isObj(me.best)?me.best:{};
  all[ID]=f({t:typeof me.t==='number'?me.t:0,n:Number.isInteger(me.n)&&me.n>=0?me.n:0,best});
  PA.store.set('pieces',all);
}

/* ===== 問題 ===== */
const items=()=>PC.items(S.pc,S.lv);
const ansOf=id=>S.ans[S.lv][id]||null;
const evById=id=>S.pc.events.find(e=>e.id===id)||null;
const qById=id=>(S.pc.questions||[]).find(q=>q.id===id)||null;
function tally(){
  const its=items(); let done=0, ok=0;
  its.forEach(x=>{const a=ansOf(x.id);if(a){done++;if(a.ok) ok++;}});
  return {n:its.length,done,ok,all:its.length>0&&done===its.length};
}
function record(it,id,a){
  if(ansOf(id)) return;
  const ok=PC.check(it,a,S.lv);
  S.ans[S.lv][id]={a,ok};
  PA.answerFx(ok);
  save();
  const t=tally();
  saveMeta(me=>{
    me.n++;
    if(t.all){const b=me.best[S.lv];if(!isObj(b)||b.n!==t.n||!(b.ok/b.n>=t.ok/t.n)) me.best[S.lv]={ok:t.ok,n:t.n};} // 問題の数がかわったら（曲のデータのなおし）、まえのけっかはおきかえる
    return me;
  });
  PA.announce(ok?'せいかい':'ざんねん');
}
// つぎのまだの和音（いまの和音のあとから。なければ調・おわりかたの問題 → null）
function nextOpen(){
  const its=items(), i=its.findIndex(x=>x.id===S.sel);
  for(let k=1;k<=its.length;k++){const x=its[(i+k)%its.length];if(x.kind==='ev'&&!ansOf(x.id)) return x;}
  return its.find(x=>!ansOf(x.id))||null;
}
const resetB=()=>{S.B={deg:null,form:0,inv:0,borrowed:false,of:false};};
const built=()=>{const B=S.B,p={deg:B.deg||1};if(B.form) p.form=B.form;if(B.inv) p.inv=B.inv;if(B.borrowed) p.borrowed=true;if(B.of) p.of=5;return PA.rnNorm(p);};

/* ===== 音 ===== */
let token=0;
const midis=ev=>ev.skel.lh.concat(ev.skel.rh).map(s=>PC.note(s).midi);
const bpm=()=>S.tempo==='normal'?S.pc.tempo.normal:S.pc.tempo.slow;
function stop(){token++;S.playing=null;S.cur=-1;PA.stopSound();}
// 本物の楽譜の音を、リズムどおりにいっぺんに予約する（とめるときは PA.stopSound が、まだ鳴っていない音もけす）
//   a・b＝ぬき出しのはじめから何拍めから何拍めまで。トリルは上の音からの32分音符（ソファソファ）
let TL=null;
function schedule(a,b){
  const spb=60/bpm(), k=PC.key(S.pc.key), sig=k&&k.sig||{};
  if(!TL) TL=PC.timeline(S.pc);
  TL.forEach(n=>{
    if(n.at<a-1e-9||n.at>=b-1e-9) return;
    const vel=n.rh?0.2:0.13, len=Math.min(n.len,b-n.at);
    if(n.orn.includes('tr')&&len>=0.5){
      // 上の音：調号の音（ハ長調ならファの上はソ）
      const um=n.midi+(PA.NAT[(n.letter+1)%7]+(sig[(n.letter+1)%7]||0)-PA.NAT[n.letter]-(n.acc||0)+12)%12;
      for(let j=0;j<4;j++) PA.playNote(j%2?n.midi:um,(n.at-a+j*len/4)*spb,len/4*spb+0.08,vel);
      return;
    }
    PA.playNote(n.midi,(n.at-a)*spb,len*spb+0.15,vel);
  });
}
// list＝鳴らす和音の番号（S.pc.events の）。what＝鳴らしているボタン（'all'・'m3'・'e:m2a'・'k:m2a'（和音にして聴く））
//   鳴らしているあいだはページを描きなおさない（フォーカス・こたえの読み上げ（role=status）・組み立ての aria-live をこわさない）。
//   鳴っている所の色・ボタンのようすは syncPlay() で、その所だけかえる
async function playList(list,what){
  if(!PA.settings.sound){S.muteHint=true;render();return;}
  const hint=S.muteHint;
  stop(); const my=token; S.playing=what; S.muteHint=false;
  if(hint) render();
  const real=what.slice(0,2)!=='k:';
  // 本物の楽譜：はじめの和音のはじめから、さいごの和音のおわりまでを予約して、色だけ和音ごとにすすめる
  if(real) schedule(PC.evSpan(S.pc,S.pc.events[list[0]])[0],PC.evSpan(S.pc,S.pc.events[list[list.length-1]])[1]);
  for(const i of list){
    if(my!==token) return;
    S.cur=i; syncPlay();
    const ev=S.pc.events[i], sec=ev.dur*60/bpm();
    if(!real) PA.chord(midis(ev),{dur:Math.max(1.2,sec+0.3)});
    await PA.sleep((real?sec:Math.max(1.2,sec))*1000);
  }
  if(my!==token) return;
  S.playing=null; S.cur=-1; syncPlay();
}
// 鳴らすボタンの中身（鳴っていれば ■ とめる）。data-act は鳴っていてもかえない（キーボードでおしたあとも、おなじボタンにフォーカスがのこる）
const PLAYBTN={pm:(on,v)=>`${PA.icon(on?'stop':'play')}${ESC(v)}小節`,pplay:on=>`${PA.icon(on?'stop':'listen')}この和音`,pskel:on=>`${PA.icon(on?'stop':'listen')}和音にして聴く`};
const playWhat={pm:v=>'m'+v,pplay:v=>'e:'+v,pskel:v=>'k:'+v};
function playBtn(act,v,extra){
  const on=S.playing===playWhat[act](v);
  return `<button type="button" class="btn small${on?' night':''}" data-act="${act}" data-v="${ESC(v)}" aria-pressed="${on}"${extra||''}>${PLAYBTN[act](on,v)}</button>`;
}
const SEL_HL='#e6eefc', PLAY_HL='#ffe9a8';
const hlColor=i=>{const ev=S.pc&&S.pc.events[i];return i===S.cur?PLAY_HL:ev&&S.sel===ev.id?SEL_HL:'transparent';};
// 鳴っている所（「？」のわく・がくふの列の色）と、鳴らすボタン・下のバーだけをかえる
function syncPlay(){
  document.querySelectorAll('.slot[data-i]').forEach(el=>{el.classList.toggle('play',+el.dataset.i===S.cur);});
  document.querySelectorAll('.sys rect[data-hl]').forEach(r=>{
    const i=+r.getAttribute('data-ev'), ev=S.pc&&S.pc.events[i];
    r.setAttribute('fill',i===S.cur?PLAY_HL:ev&&S.sel===ev.id?SEL_HL:'none');
  });
  document.querySelectorAll('.sheet .hl[data-ev]').forEach(r=>{r.style.background=hlColor(+r.getAttribute('data-ev'));});
  document.querySelectorAll('[data-act="pm"],[data-act="pplay"],[data-act="pskel"]').forEach(b=>{
    const a=b.dataset.act, v=b.dataset.v, on=S.playing===playWhat[a](v);
    b.classList.toggle('night',on); b.setAttribute('aria-pressed',String(on)); b.innerHTML=PLAYBTN[a](on,v);
  });
  renderActions();
}
const idxOf=pred=>S.pc.events.map((e,i)=>pred(e)?i:-1).filter(i=>i>=0);

/* ===== 画面 ===== */
const where=ev=>`${ev.m}小節${PC.beatText(ev.beat)}`;
// 調の問題（ぜんぶ）にまだ答えていない：調のしるしは「？」、見出しは調を書かない名前（titleShort）
function keyOpen(){
  const kq=(S.pc.questions||[]).find(q=>q.type==='key'&&q.level==='full');
  return S.lv==='full'&&!!kq&&!ansOf(kq.id);
}
function keyPre(ev){
  if(keyOpen()) return '？:';
  return PA.rnKey(PC.key(ev.key));
}
// 調（C: など）は楽曲分析とおなじく、さいしょの段と、調がかわる段だけ
function keyShow(i){
  const ev=S.pc.events[i], prev=i?S.pc.events[i-1]:null;
  return !prev||prev.key!==ev.key?keyPre(ev):'';
}
function headHTML(){
  const pc=S.pc, ex=pc.excerpts[0];
  return `<section class="card phead" aria-labelledby="ph"><p class="pcomp">${ESC(pc.composer)}</p>
    <h2 id="ph">${ESC(keyOpen()&&pc.titleShort?pc.titleShort:pc.title)}<small>${ESC(pc.movement)}・${ex.from}〜${ex.to}小節（${ESC(ex.label)}）</small></h2>
    <p class="msg" style="margin-top:10px"><span aria-hidden="true">📖 </span>${realOK()?'下は本物の楽譜だよ。メロディーや左手の動きのまま、和音を見つけよう。こまったら「ヒント」で、和音の音だけにした形も見られるよ。じぶんの楽譜もひらいて、いっしょに見てね。'
      :'じぶんの楽譜もひらいて、いっしょに見てね。下のがくふは、和音の音だけを全音符にした「骨組み」だよ。'}</p></section>`;
}
function lvHTML(){
  const t=tally(), pct=t.n?Math.round(t.done/t.n*100):0;
  return `<section class="card" aria-labelledby="lv-h"><h2 id="lv-h">なにを答える？<small>じぶんでえらんでね</small></h2>
    ${PA.seg('plv',LEVELS.map(l=>[l,LV_NAME[l]]),S.lv,'full')}
    <p class="note lvsub">${LV_SUB[S.lv]}</p>
    <div class="prog"><span>こたえた ${t.done} / ${t.n}もん</span><span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span><span><span aria-hidden="true">⭕ </span>正解${t.ok}</span></div>
    <div class="prow"><span class="lbl">音のはやさ</span>${PA.seg('ptempo',[['slow','ゆっくり'],['normal','ふつう']],S.tempo)}
      ${t.done?`<button type="button" class="btn small" data-act="preset" data-confirm="もういちどおすと、「${LV_NAME[S.lv]}」のこたえをけすよ">${PA.icon('retry')}さいしょから</button>`:''}</div></section>`;
}
// 1つの段（2小節）。Wmax＝いちばん和音の多い段のはば：どの段もおなじはば・おなじ大きさにして、和音の少ない段は列を広く
function sysHTML(ms,si,Wmax){
  const pc=S.pc, ev0=pc.events.map((e,i)=>({e,i})).filter(x=>ms.includes(x.e.m));
  const key=PC.key(ev0[0].e.key);
  // 臨時記号：おなじ小節の前の列の変化記号をおぼえる（もどすときは♮）
  let carry={}, lastM=null;
  const cols=ev0.map(({e,i})=>{
    if(e.m!==lastM){carry={};lastM=e.m;}
    const c={notes:e.skel.rh.map(PC.note),lh:e.skel.lh.map(PC.note),carry:{...carry},hlAttr:`data-ev="${i}"`};
    c.hl=S.cur===i?PLAY_HL:S.sel===e.id?SEL_HL:'none';
    c.notes.concat(c.lh).forEach(n=>{if(n.acc!==(key.sig[n.letter]||0)||carry[n.letter]!=null) carry[n.letter]=n.acc;});
    return c;
  });
  const measures=[]; ev0.forEach(({e},ci)=>{if(!ci||ev0[ci-1].e.m!==e.m) measures.push({ci,n:e.m});});
  const cw=(Wmax-PA.staffGeom(key,cols.length,{}).nx-8)/cols.length;
  const o={grand:true,measures,colW:Math.round(cw*100)/100}, G=PA.staffGeom(key,cols.length,o), pct=v=>(v/G.W*100).toFixed(3)+'%';
  const svg=PA.staffSVG(key,cols,o);
  const slots=ev0.map(({e,i})=>`<div class="slotc" style="width:${pct(G.cw)}">${slotHTML(e,i)}</div>`).join('');
  const mbtn=m=>playBtn('pm',String(m));
  let h=`<div class="sys" data-sys="${si}"><p class="pa-sr">${ms[0]}〜${ms[ms.length-1]}小節のがくふ（和音の骨組み）</p>
    <div class="sysbar">${ms.map(mbtn).join('')}</div>
    <div class="scroll"><div class="sysin" style="min-width:${Math.round(G.W*45/Math.min(G.cw,70))}px;max-width:${Math.round(G.W*1.5)}px">${svg}
      <div class="slots" style="padding-left:${pct(G.nx)};padding-right:${pct(G.W-G.nx-cols.length*G.cw)}"><span class="kpre" style="width:${pct(G.nx)}" aria-hidden="true">${ESC(keyShow(ev0[0].i))}</span>${slots}</div>
    </div></div>`;
  return h+sysTail(ms)+`</div>`;
}
// 段の下：えらんだ「？」の答える所と、おわりかた
function sysTail(ms){
  const pc=S.pc, sel=S.sel&&evById(S.sel);
  let h=sel&&ms.includes(sel.m)?pickHTML(sel):'';
  // おわりかた：その範囲（「10〜12小節」）の出題した和音にぜんぶ答えたら、ぜんぶ＝問題、ほか＝おしえる。
  //   それまでは出さない（説明に和音の答えが書いてあるので、先に見えないように）
  (pc.questions||[]).filter(q=>q.type==='cadence'&&ms.includes(q.m)).forEach(q=>{
    if(!cadOpen(q)){if(S.lv==='full') h+=`<p class="cadinfo"><span aria-hidden="true">🏁 </span>${ESC(q.range)}の「？」をうめたら、おわりかたの問題が出るよ</p>`;}
    else if(S.lv==='full') h+=qHTML(q);
    else h+=`<p class="cadinfo"><span aria-hidden="true">🏁 </span>${ESC(q.range)}のおわりかた：<b>${PC.CAD[q.answer]}</b>。${ESC(q.note)}</p>`;
  });
  return h;
}

/* ===== 本物の楽譜（assets/score.js）===== */
// 描けるか（VexFlow を読めた・曲に score がある）。描けなければ、まえの形（骨組みの下に「？」）
let realErr=false;
const realOK=()=>!realErr&&!!(PA.score&&PA.score.ready()&&S.pc&&S.pc.score);
function layoutNow(){
  try{return PA.score.layout(S.pc,perNow());}
  catch(e){realErr=true;if(window.console) console.error('score:',e);return null;}
}
// 「？」の列：拍の位置（符頭のまんなか）に50pxのボタン。せまい画面（1小節＝276px・2小節＝640px）でもかさならないように、右へずらす
const LANE_PX={1:276,2:640}, SLOT_PX=52;
function laneXs(sys,L){
  const u=L.W/LANE_PX[L.per], gap=SLOT_PX*u, half=gap/2, lo=(sys.bars[0].ns-sys.bars[0].x0)*0.55+half;
  const xs=sys.evs.map(v=>v.x);
  for(let i=0;i<xs.length;i++) xs[i]=Math.max(xs[i],i?xs[i-1]+gap:lo);
  for(let i=xs.length-1;i>=0;i--) xs[i]=Math.min(xs[i],i<xs.length-1?xs[i+1]-gap:L.W-half);
  return xs;
}
function realSysHTML(sys,si,L){
  const pc=S.pc, ms=sys.ms, pct=v=>(v/L.W*100).toFixed(3)+'%', ev0=pc.events[sys.evs[0].i];
  const xs=laneXs(sys,L), open=!!S.hint[ms[0]];
  const name=ms.length>1?`${ms[0]}〜${ms[ms.length-1]}小節`:`${ms[0]}小節`;
  const lane=sys.evs.map((v,k)=>`<div class="lslot" style="left:${pct(xs[k])}">${slotHTML(pc.events[v.i],v.i)}</div><i class="tick" style="left:${pct(v.x)}" aria-hidden="true"></i>`).join('');
  const hl=sys.evs.map(v=>`<i class="hl" data-ev="${v.i}" style="left:${pct(v.x0)};width:${pct(v.x1-v.x0)};background:${hlColor(v.i)}" aria-hidden="true"></i>`).join('');
  // スマホ（1小節）は広くしすぎない（線のあいだが大きくなりすぎないように）
  const maxW=L.per===1?480:760;
  let h=`<div class="sys" data-sys="${si}"><p class="pa-sr">${name}の楽譜（本物の楽譜）</p>
    <div class="sysbar">${ms.map(m=>playBtn('pm',String(m))).join('')}
      <button type="button" class="btn small hintbtn${open?' on':''}" data-act="phint" data-v="${ms[0]}" aria-pressed="${open}" aria-label="${name}のヒント：和音だけにした形を見る">${PA.icon('hint')}<span>ヒント<span class="hx">：和音だけ</span></span></button></div>
    <div class="score" style="max-width:${maxW}px">
      <div class="sheet" style="padding-top:${(L.H/L.W*100).toFixed(3)}%">${hl}${sys.svg}</div>
      <div class="lane"><span class="kpre" aria-hidden="true">${ESC(keyShow(sys.evs[0].i))}</span>${lane}</div>
    </div>`;
  if(open) h+=hintHTML(ms);
  return h+sysTail(ms)+`</div>`;
}
// ヒント：その段の小節を、和音の音だけの全音符（骨組み）で
function hintHTML(ms){
  const pc=S.pc, ev0=pc.events.map((e,i)=>({e,i})).filter(x=>ms.includes(x.e.m)), key=PC.key(ev0[0].e.key);
  let carry={}, lastM=null;
  const cols=ev0.map(({e,i})=>{
    if(e.m!==lastM){carry={};lastM=e.m;}
    const c={notes:e.skel.rh.map(PC.note),lh:e.skel.lh.map(PC.note),carry:{...carry},hlAttr:`data-ev="${i}"`};
    c.hl=S.cur===i?PLAY_HL:S.sel===e.id?SEL_HL:'none';
    c.notes.concat(c.lh).forEach(n=>{if(n.acc!==(key.sig[n.letter]||0)||carry[n.letter]!=null) carry[n.letter]=n.acc;});
    return c;
  });
  const measures=[]; ev0.forEach(({e},ci)=>{if(!ci||ev0[ci-1].e.m!==e.m) measures.push({ci,n:e.m});});
  // 線のあいだが本物の楽譜とおなじくらい（8px）になる大きさ
  const o={grand:true,measures,colW:58}, G=PA.staffGeom(key,cols.length,o);
  return `<div class="hintbox"><p><span aria-hidden="true">💡 </span>和音の音だけを、全音符にした形だよ（骨組み）</p><div class="hintin" style="max-width:${Math.round(G.W*0.8)}px">${PA.staffSVG(key,cols,o)}</div></div>`;
}
// おわりかたの問題を出してよいか：その範囲（q.range の「10〜12小節」の10から q.m まで）の、出題した和音にぜんぶ答えた
function cadOpen(q){
  const from=+((/^(\d+)/.exec(q.range||'')||[])[1]||q.m);
  return S.pc.events.every(e=>e.m<from||e.m>q.m||!PC.asked(e,S.lv)||ansOf(e.id));
}
function slotHTML(ev,i){
  const a=ansOf(ev.id), sel=S.sel===ev.id, cls=`slot${sel?' sel':''}${S.cur===i?' play':''}`, di=` data-i="${i}"`; // data-i：鳴っている所（syncPlay）
  if(!PC.asked(ev,S.lv)) return `<span class="${cls} given"${di}><span class="pa-sr">${where(ev)}：</span>${PA.rn(ev.rn)}</span>`;
  if(!a) return `<button type="button" class="${cls} q"${di} data-act="pick" data-v="${ev.id}" aria-pressed="${sel}" aria-label="${where(ev)}の和音（まだ）">？</button>`;
  return `<button type="button" class="${cls} ${a.ok?'ok':'ng'}"${di} data-act="pick" data-v="${ev.id}" aria-pressed="${sel}" aria-label="${ESC(where(ev)+'：'+(a.ok?'せいかい':'まちがい')+'。こたえは'+PA.rnAria(ev.rn))}">${PA.rn(ev.rn)}<span class="mk" aria-hidden="true">${a.ok?'⭕':'✗'}</span></button>`;
}
function pickHTML(ev){
  const a=ansOf(ev.id);
  let h=`<div class="pick" id="pick" role="group" aria-labelledby="pick-h"><h3 id="pick-h" tabindex="-1">${where(ev)}の和音は？</h3>
    <div class="row">${playBtn('pplay',ev.id,' data-hot="listen"')}${realOK()?playBtn('pskel',ev.id):''}
    <button type="button" class="btn small" data-act="pclose">${PA.icon('close')}とじる</button></div>`;
  if(a) h+=fbHTML(ev,a);
  else if(S.lv==='deg') h+=`<p class="plab">何の和音？</p><div class="choices pchoices n${PC.degChoices(ev,S.pc).length}">${PC.degChoices(ev,S.pc).map((c,k)=>`<button type="button" class="choice" data-act="adeg" data-v="${k}">${PA.rn(c)}</button>`).join('')}</div>`;
  else h+=builderHTML();
  return h+`</div>`;
}
// 部品をえらんで記号をつくる（転回形も・ぜんぶ）
function builderHTML(){
  const B=S.B, full=S.lv==='full';
  let h=`<p class="plab">① 何の和音？</p><div class="degs" role="group" aria-label="何の和音？">`
    +[1,2,3,4,5,6,7].map(d=>`<button type="button" class="dbtn${B.deg===d?' on':''}" data-act="bdeg" data-v="${d}" aria-pressed="${B.deg===d}">${PA.rn({deg:d})}</button>`).join('')+`</div>`;
  let no=1;
  if(full) h+=`<p class="plab">${'①②③④'[no++]} 7の和音？9の和音？</p>`+PA.seg('bform',[['0','なし'],['7','7の和音'],['9','9の和音']],String(B.form),'full');
  h+=`<p class="plab">${'①②③④'[no++]} 転回形は？（いちばん下の音）</p>`+PA.seg('binv',[['0','基本形'],['1','第1'],['2','第2'],['3','第3']],String(B.inv),'full');
  h+=`<p class="plab">${'①②③④'[no++]} しるし（あれば）</p><div class="row">`
    +`<button type="button" class="tog${B.borrowed?' on':''}" data-act="bborrow" aria-pressed="${B.borrowed}">○ 準固有</button>`
    +`<button type="button" class="tog${B.of?' on':''}" data-act="bof" aria-pressed="${B.of}">Ⅴの調（2だん）</button></div>`;
  h+=`<div class="pv" aria-live="polite">こたえ：${B.deg?PA.rn(built()):'<span class="note" style="margin:0">①をえらんでね</span>'}</div>`
    +`<button type="button" class="btn primary" data-act="bok" data-hot="check"${B.deg?'':' disabled'}>${PA.icon('check')}こたえる</button>`;
  return h;
}
// その答えかたで答える部品だけの記号（番号だけ＝Ⅴ、転回形も＝Ⅴ²）。記号ぜんぶとちがえば「（記号でかくと Ⅴ₇²）」をそえる
function ansRn(rn){
  const p=PA.rnNorm(rn), q=S.lv==='deg'?PC.markOf(p):S.lv==='inv'?PA.rnNorm({...PC.markOf(p),inv:p.inv}):p;
  return PA.rn(q)+(PA.rnText(q)!==PA.rnText(p)?`<span class="yours">（記号でかくと ${PA.rn(p)}）</span>`:'');
}
function fbHTML(ev,a){
  const nx=nextOpen(), exact=PC.check({rn:ev.rn},a.a,S.lv), alt=PC.altAccepts(ev,S.lv);
  let h=!a.ok?`<div class="fb bad" role="status"><span aria-hidden="true">✗ </span>ざんねん。こたえは ${ansRn(ev.rn)}<br><span class="yours">えらんだのは ${PA.rn(a.a)}</span></div>`
    :exact?`<div class="fb good" role="status"><span aria-hidden="true">⭕ </span>せいかい！ ${ansRn(ev.rn)}</div>`
    // べつの正解（accept）で答えた：えらんだ記号を先に
    :`<div class="fb good" role="status"><span aria-hidden="true">⭕ </span>せいかい！ ${PA.rn(a.a)}<span class="yours">（${PA.rn(ev.rn)}でも正解）</span></div>`;
  h+=`<p class="expl">${PC.explainHTML(ev)}。${ESC(ev.note||'')}</p>`;
  // こう答えても正解：この答えかたで、ちがいがわかるときだけ（番号だけ・転回形もでは7の和音をえらべない）
  if(alt.length&&exact) h+=`<p class="note">${ev.acceptNote?ESC(ev.acceptNote)+'、':''}${alt.map(p=>PA.rn(p)).join('・')}でも正解</p>`;
  if(ev.cad&&S.lv!=='full') h+=`<p class="note"><span aria-hidden="true">🏁 </span>ここで${PC.CAD[ev.cad]}</p>`;
  h+=`<div class="row" style="margin-top:10px">`+(nx?`<button type="button" class="btn primary" data-act="pnext" data-hot="next">${PA.icon('next')}${nx.kind==='ev'?'次の「？」へ':'のこりの問題へ'}</button>`
    :`<button type="button" class="btn primary" data-act="psum" data-hot="next">${PA.icon('next')}けっかを見る</button>`)+`</div>`;
  return h;
}
// 調・おわりかたの問題
function qHTML(q){
  const a=ansOf(q.id), ask=q.type==='key'?q.ask:q.range+'のおわりかたは？';
  const name=c=>q.type==='key'?`${PA.keyName(PC.key(c))}<small>${ESC(PA.rnKey(PC.key(c)))}</small>`:PC.CAD[c];
  const right=q.type==='key'?PA.keyName(PC.key(q.answer)):PC.CAD[q.answer];
  return `<div class="pq" id="q-${q.id}" role="group" aria-labelledby="qh-${q.id}"><h3 id="qh-${q.id}" tabindex="-1"><span aria-hidden="true">${q.type==='key'?'🔑':'🏁'} </span>${ESC(ask)}</h3>
    <div class="choices">${q.choices.map(c=>`<button type="button" class="choice${a?(c===q.answer?' right':c===a.a?' wrong':''):''}" data-act="aq" data-q="${q.id}" data-v="${c}"${a?' disabled':''}>${name(c)}</button>`).join('')}</div>
    ${a?`<div class="fb ${a.ok?'good':'bad'}" role="status" style="margin-top:10px">${a.ok?'<span aria-hidden="true">⭕ </span>せいかい！':'<span aria-hidden="true">✗ </span>ざんねん。こたえは<b>'+right+'</b>'}<br><span style="font-size:15px;font-weight:400">${ESC(q.note)}</span></div>`:''}</div>`;
}
let pcPainted=false; // 曲を1回描いたか（そのまえの「よみこんでいるよ…」はかぞえない）
function sumHTML(){
  const t=tally(); if(!t.all) return '';
  const r=t.ok/t.n, stars=r>=0.8?3:r>=0.5?2:1, other=LEVELS.filter(l=>l!==S.lv);
  const msg=stars===3?'すばらしい！ほんものの曲でも、和音が読めたね':stars===2?'よくできたね。✗のところを、もういちど楽譜で見てみよう':'さいごまでできたね。まちがえたところの説明を読んで、もういちどやってみよう';
  // さいごまで答えたときだけ、すっと出す（ひらいたときにもうおわっていたら .still でそのまま）
  return `<section class="card sumc${pcPainted?'':' still'}" id="sum" data-fx="piece-done" aria-labelledby="sum-h" tabindex="-1"><h2 id="sum-h"><span aria-hidden="true">🎉 </span>さいごまで答えたよ</h2>
    <p class="sess-big"><b>${t.ok}</b> / ${t.n}もん正解</p>
    <p class="stars" role="img" aria-label="ほし3こ中${stars}こ" style="font-size:26px;margin:4px 0">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</p>
    <p>${msg}</p>
    <div class="row" style="flex-wrap:wrap;gap:8px">${other.map(l=>`<button type="button" class="btn small" data-act="plv" data-v="${l}">「${LV_NAME[l]}」でやってみる</button>`).join('')}
      <button type="button" class="btn small" data-act="preset" data-confirm="もういちどおすと、「${LV_NAME[S.lv]}」のこたえをけすよ">${PA.icon('retry')}さいしょから</button></div></section>`;
}
// 楽譜の出どころ（おとなの人へ）。子どもが答えるページなので、とじておく
function srcHTML(){
  const s=S.pc.source;
  return `<details class="card fold src" data-d="src"><summary><h2 id="src-h"><span aria-hidden="true">📚 </span>この楽譜について（おとなの人へ）<small>曲も楽譜も、だれでもつかえるものだよ</small></h2></summary>
    <p class="note">${ESC(S.pc.composerFull)}。楽譜：${ESC(s.edition)}。${ESC(s.measures)}。</p>
    <p class="note">${ESC(s.made)}。${ESC(s.license)}。</p></details>`;
}
function render(){
  const v=document.getElementById('view');
  if(S.err){
    const msg=S.err==='notfound'?'その曲は見つからなかったよ。':'曲のデータをよみこめなかったよ。ネットにつながっているか見てね。';
    PA.paint(v,`<div class="stack"><section class="card"><p class="lead">${msg}</p><div class="row" style="margin-top:10px">`
      +(S.err==='notfound'?`<a class="btn" href="${READY[0]?'piece.html?id='+READY[0]:'index.html'}">${READY[0]?'さいしょの曲をひらく':'ホームへ'}</a>`:`<button type="button" class="btn" data-act="reload">${PA.icon('refresh')}もういちど</button>`)
      +`</div></section></div>`,'err');
    renderActions(); return;
  }
  if(!S.pc){PA.paint(v,`<div class="stack"><section class="card"><p class="lead" role="status">よみこんでいるよ…</p></section></div>`,'load');renderActions();return;}
  const pc=S.pc, ex=pc.excerpts[0], ms=[];
  for(let m=ex.from;m<=ex.to;m++) ms.push(m);
  const L=realOK()?layoutNow():null;
  let body;
  if(L) body=L.systems.map((sys,i)=>realSysHTML(sys,i,L)).join('');
  else{
    // VexFlow がないとき：まえの形（骨組みの下に「？」。1段に2小節）
    const groups=[]; for(let i=0;i<ms.length;i+=2) groups.push(ms.slice(i,i+2));
    const Wmax=Math.max(...groups.map(g=>{const es=pc.events.filter(e=>g.includes(e.m));return PA.staffGeom(PC.key(es[0].key),es.length,{}).W;}));
    body=groups.map((g,i)=>sysHTML(g,i,Wmax)).join('');
  }
  const kq=(pc.questions||[]).filter(q=>q.type==='key'&&PC.LV_RANK[q.level]<=PC.LV_RANK[S.lv]);
  let h=`<div class="stack">${headHTML()}${lvHTML()}<section class="card sysc" aria-labelledby="sys-h"><h2 id="sys-h"><span aria-hidden="true">🎼 </span>がくふと和音</h2>
    <p class="note">${L?'楽譜の下の「？」をおして、その拍からの和音の記号を答えよう。小節の番号のボタンで、その小節を聴けるよ。':'「？」をおして、和音の記号を答えよう。小節の番号のボタンで、その小節の音を聴けるよ。'}</p>`
    +(S.muteHint&&!PA.settings.sound?`<p class="msg soundhint" role="status" style="margin-top:8px"><span aria-hidden="true">🔇 </span>音がオフだよ <button type="button" class="btn small" data-pa="sound-on">${PA.icon('listen')}音を出す</button></p>`:'')
    +kq.map(qHTML).join('')+body+`</section>${sumHTML()}${srcHTML()}${PA.rnHelp()}</div>`;
  PA.paint(v,h,'piece:'+S.lv); pcPainted=true;
  renderActions();
}
let lastActions=null;
function renderActions(){
  const bar=document.getElementById('actions');
  // data-act は鳴っていても pall のまま（おなじボタンをもういちどおすと、とめる）
  const a=S.pc?(S.playing==='all'?`<button type="button" class="btn" data-act="pall" data-hot="listen" aria-pressed="true">${PA.icon('stop')}とめる</button>`
    :`<button type="button" class="btn night" data-act="pall" data-hot="listen" aria-pressed="false">${PA.icon('play')}ぜんぶ聴く（${S.pc.excerpts[0].from}〜${S.pc.excerpts[0].to}小節）</button>`):'';
  bar.style.display=a?'':'none';
  if(a!==lastActions){PA.paint(bar,a,'bar');lastActions=a;}
}
// 見えるところへ（下のボタンバーにかくれないように）
function reveal(sel,focus){
  const el=document.querySelector(sel); if(!el) return;
  if(el.scrollIntoView) el.scrollIntoView({block:'nearest'}); // まいかいのこたえなので、すぐに
  if(focus){const f=typeof focus==='string'?el.querySelector(focus):el;if(f&&f.focus) f.focus({preventScroll:true});}
}

/* ===== 操作 ===== */
function pick(id){
  if(!evById(id)) return;
  stop(); S.sel=id; resetB(); render(); reveal('#pick','#pick-h');
}
function goNext(){
  const nx=nextOpen();
  if(!nx){S.sel=null;render();reveal('#sum',true);return;}
  if(nx.kind==='ev'){pick(nx.id);return;}
  S.sel=null; render(); reveal('#q-'+nx.id,'h3');
}
function answered(){render();reveal('#pick','[data-act="pnext"],[data-act="psum"]');}
document.addEventListener('click',e=>{
  const el=e.target.closest&&e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act, v=el.dataset.v;
  if(a==='reload'){location.reload();return;}
  if(!S.pc) return;
  switch(a){
    case 'plv': if(!LEVELS.includes(v)||v===S.lv) return; stop(); S.lv=v; S.sel=null; resetB(); save(); render(); return;
    case 'ptempo': if(v!=='slow'&&v!=='normal') return; S.tempo=v; save(); render(); return;
    case 'preset': stop(); S.ans[S.lv]={}; S.sel=null; resetB(); save(); render(); PA.scrollTop(); return;
    case 'pick': if(S.sel===v){S.sel=null;render();return;} pick(v); return;
    case 'pclose': S.sel=null; render(); return;
    case 'pnext': goNext(); return;
    case 'psum': S.sel=null; render(); reveal('#sum',true); return;
    case 'adeg': {
      const ev=evById(S.sel), c=ev&&/^\d$/.test(v)?PC.degChoices(ev,S.pc)[+v]:null; if(!c||ansOf(ev.id)) return;
      stop(); record(ev,ev.id,c); answered(); return;
    }
    case 'bdeg': {const d=+v; if(!Number.isInteger(d)||d<1||d>7) return; S.B.deg=d; render(); return;}
    case 'bform': if(S.lv!=='full'||!['0','7','9'].includes(v)) return; S.B.form=+v; render(); return;
    case 'binv': if(!['0','1','2','3'].includes(v)) return; S.B.inv=+v; render(); return;
    case 'bborrow': if(S.lv==='deg') return; S.B.borrowed=!S.B.borrowed; render(); return;
    case 'bof': if(S.lv==='deg') return; S.B.of=!S.B.of; render(); return;
    case 'bok': {
      const ev=evById(S.sel); if(!ev||ansOf(ev.id)||!S.B.deg) return;
      stop(); record(ev,ev.id,built()); answered(); return;
    }
    case 'aq': {
      const q=qById(el.dataset.q); if(!q||ansOf(q.id)||!q.choices.includes(v)||(q.type==='cadence'&&!cadOpen(q))) return;
      record(q,q.id,v); render(); reveal('#q-'+q.id,'h3'); return;
    }
    // 鳴らすボタン：鳴っているボタンをもういちどおすと、とめる
    case 'pplay': {if(S.playing==='e:'+v){stop();syncPlay();return;} const i=S.pc.events.findIndex(x=>x.id===v); if(i<0) return; playList([i],'e:'+v); return;}
    case 'pm': {if(S.playing==='m'+v){stop();syncPlay();return;} const m=+v, l=idxOf(x=>x.m===m); if(!l.length) return; playList(l,'m'+m); return;}
    case 'pall': if(S.playing==='all'){stop();syncPlay();return;} playList(S.pc.events.map((x,i)=>i),'all'); return;
    case 'pskel': {if(S.playing==='k:'+v){stop();syncPlay();return;} const i=S.pc.events.findIndex(x=>x.id===v); if(i<0) return; playList([i],'k:'+v); return;}
    // ヒント（骨組み）をひらく・とじる。段のさいしょの小節の番号
    case 'phint': {const m=+v; if(!S.pc.events.some(e=>e.m===m)) return; if(S.hint[m]) delete S.hint[m]; else S.hint[m]=true; stop(); render(); return;}
    case 'pstop': stop(); syncPlay(); return;
    default: return;
  }
});
// 画面のはばがかわって1段の小節の数がかわったら描きなおす（鳴らしていればとめる）
try{const mq=window.matchMedia&&window.matchMedia(WIDE);if(mq){const f=()=>{if(S.playing){stop();}render();};if(mq.addEventListener) mq.addEventListener('change',f);else if(mq.addListener) mq.addListener(f);}}catch(e){}
PA.mountBar({title:'名曲で楽曲分析',app:'piece'});
PA.onSettings=render;
// ページをはなれたら音をとめる（「ぜんぶ聴く」はゆっくりで50秒ちかくある。タブをかえた・アプリをうしろへ・「もどる」でもどった）
PA.onPageShow=()=>{stop();render();};
window.addEventListener('pagehide',()=>{if(S.playing){stop();syncPlay();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.playing){stop();render();}});
// リンクの mode はつかったので、アドレスは id だけに（「もどる」の読みなおしでかわらないように）
if(ID&&(P.mode!=null||P.id!==ID)){try{history.replaceState(history.state,'',PA.url('piece',{id:ID})+location.hash);}catch(e){}}
render();
if(ID){
  fetch('assets/pieces/'+ID+'.json').then(r=>{if(!r.ok) throw new Error(r.status);return r.json();}).then(pc=>{
    const err=PC.validate(pc);
    if(err.length||pc.id!==ID) throw new Error(err.join(' / ')||'id');
    S.pc=pc; load(); save(); saveMeta(me=>{me.t=Date.now();return me;}); render();
  }).catch(err=>{if(window.console) console.error('piece:',err);S.err='load';render();});
}
</script>
