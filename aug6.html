<body>
<header class="appbar" id="appbar"></header>
<main class="page" id="view"></main>
<div class="actionbar" id="actions"></div>
<script src="assets/core.js"></script>
<script>
/* 増六の和音：ドッペルドミナントの第5音を半音下げていちばん下におく → 増6度が外へひらいてⅤへ
 * 和音のつづり・高さ・解決はすべて PA.chroma（ドッペル・クイズのページとおなじ） */
const AUG='#8a4fe0', LOW='#2f7ee8', LT='#d1495b', VCOL='#3b4fa8', ICOL=PA.COL.I, PAR='#e07a00', GHOST='#9b9184';
const TYPES={
  it:{name:'イタリアの6',short:'イタリア',src:'dd',from:'Ⅴ7/Ⅴ',root:false,n:3},
  fr:{name:'フランスの6',short:'フランス',src:'dd',from:'Ⅴ7/Ⅴ',root:true,n:4},
  ger:{name:'ドイツの6',short:'ドイツ',src:'dd9',from:'Ⅴ9/Ⅴ',root:false,n:4}
};
const TKEYS=['it','fr','ger'];
const C=PA.chroma;

const saved=PA.store.get('aug6',{})||{};
const state={minor:saved.minor===true,keyIdx:0,type:'it',gerPath:'i64',anim:null,res:0,msg:null,autoWait:false,alt:null,cmp:null};
if(Number.isInteger(saved.keyIdx)&&saved.keyIdx>=0&&saved.keyIdx<PA.keyCount(state.minor)) state.keyIdx=saved.keyIdx;
if(TKEYS.includes(saved.type)) state.type=saved.type;
if(PA.store.get('aug6-ger','i64')==='direct') state.gerPath='direct';
const save=()=>PA.store.set('aug6',{minor:state.minor,keyIdx:state.keyIdx,type:state.type});
const curKey=()=>PA.keyOf(state.minor,state.keyIdx);

/* ===== 音のよびかた ===== */
const nH=n=>{const c=n.tag==='low'?'lo':n.tag==='lt'?'up':'';return `<span class="nw ${c}">${PA.nmH(n)}</span>`;};
const q=n=>`「${nH(n)}」`;
const namesC=(ns,sep='・')=>ns.map(nH).join(sep);
// 𝄪 が出ているときだけ、がくふの下に書き方をそえる（cols の中に1つでも 𝄪 があれば）
const dsNote=cols=>cols.some(c=>c.notes.some(n=>n.acc===2))?'<p class="note"><span class="ds">x</span>はダブルシャープの楽譜での書き方です。</p>':'';
const I64H='Ⅰ<span class="fig"><span>6</span><span>4</span></span>';
const I64S='Ⅰ<tspan font-size="11" dy="-7">6</tspan><tspan font-size="11" dx="-6.5" dy="11">4</tspan>';
const sym=ns=>PA.H(PA.LET_EN[ns.letter]+PA.ACC[ns.acc]);
const parMinor=key=>PA.keyName({...key,minor:true}); // おなじ主音の短調
const sigAcc=(key,L)=>key.sig[L]||0;

/* ===== 和音（PA.chroma から） ===== */
const aug=(key,t)=>C.aug6(key,t);
// つくりかたでつみかさねる和音。第7音（調の主音）を増六の和音とおなじ高さにそろえる
// （そろえないと、調によっては ④でほかの音までオクターブうごいてしまう）
function buildStack(key,t){
  const st=C.ddStack(key,TYPES[t].src), s7=st.find(n=>n.role==='第7音'), a7=aug(key,t).find(n=>n.role==='第7音');
  const d=s7&&a7?a7.midi-s7.midi:0;
  return d?st.map(n=>({...n,midi:n.midi+d})):st;
}
const stagesOf=(key,t,path)=>{ // ［増六, (Ⅰ6/4), Ⅴ］
  const s=[{id:'aug',notes:aug(key,t),color:AUG,label:TYPES[t].short}];
  if(t==='ger'&&path==='i64') s.push({id:'i64',notes:C.gerToI64(key),color:ICOL,label:I64S});
  s.push({id:'V',notes:C.aug6ToV(key,t),color:VCOL,label:'Ⅴ'});
  return s;
};
// ドイツの6とおなじけんばんの「♭ⅡのⅤ7」（ハ長調なら A♭7）と、その解決先♭Ⅱ
// 根音が C♭・F♭・B𝄫 などになる調では、けんばんのふつうの名前（B7・E7・A7・D7）でくらべる（クイズとおなじきまり）
const oddName=n=>Math.abs(n.acc)>1||(n.acc===-1&&(n.letter===0||n.letter===3))||(n.acc===1&&(n.letter===2||n.letter===6));
function bIIinfo(key){
  const g=aug(key,'ger'), plain=oddName(g[0]);
  const rt=plain?PA.spellMidi(g[0].midi,PA.keyOf(false,0)):g[0], rpc=PA.NAT[rt.letter]+rt.acc;
  const nt=(_,dl,dp,midi,role)=>{const L=(rt.letter+dl)%7;return {letter:L,acc:PA.spell(L,rpc+dp),midi,role};};
  // ドイツの6とおなじけんばん：根音・第3音・第5音・第7音
  const dom=[nt(0,0,0,g[0].midi,'根音'),nt(1,2,4,g[1].midi,'第3音'),nt(2,4,7,g[2].midi,'第5音'),nt(3,6,10,g[3].midi,'第7音')];
  // 4つの音がそろったⅤ7 → ♭Ⅱは、第5音も根音へすすむ（第5音をはぶいた♭Ⅱ）。第5音へとぶと平行5度になる
  const r=g[0].midi-7;
  const res=[nt(0,3,5,r,'根音'),nt(0,3,5,r+12,'根音'),nt(0,5,9,r+16,'第3音')];
  return {g,dom,res,plain,domName:sym(dom[0])+'7',bII:sym(res[0])};
}
// この調で出てくる音がぜんぶ入るけんばんのはんい（白鍵から白鍵まで）
const whiteDown=m=>{while(PA.BLACK.has(PA.mod(m,12)))m--;return m;};
const whiteUp=m=>{while(PA.BLACK.has(PA.mod(m,12)))m++;return m;};
function kbRange(lists){
  const ms=lists.flat().map(n=>n.midi);
  return [whiteDown(Math.min(...ms)-2),whiteUp(Math.max(...ms)+2)];
}
function keyRange(key){
  const L=[C.gerToI64(key)];
  TKEYS.forEach(t=>{L.push(buildStack(key,t),aug(key,t),C.aug6ToV(key,t));});
  return kbRange(L);
}

/* ===== がくふ（大譜表。いちばん下の音とド4より下の音はヘ音記号）＋矢印 ===== */
const prep=n=>({letter:n.letter,acc:n.acc,midi:n.midi,raised:n.tag==='lt'||undefined});
// cols:[{notes,color,label,op}]、arrows:[{c1,n1,c2,n2,color,text,dash,dy}]（n1・n2は cols の音そのもの）
function staff(key,cols,arrows=[],o={}){
  const cw=o.cw||110;
  const sc=cols.map(c=>{
    const lo=c.notes.length?c.notes.reduce((a,b)=>b.midi<a.midi?b:a):null;
    const lh=c.notes.filter(n=>n===lo||n.midi<60), tr=c.notes.filter(n=>!lh.includes(n));
    const col={notes:tr.map(prep),lh:lh.map(prep),color:c.color,ltColor:LT,accColor:LT,label:c.label,labelColor:c.color,op:c.op};
    return {col,tr,lh};
  });
  // 矢印（ヘ音記号の音にもつけられるように、core のがくふとおなじ位置を計算する）
  const ns=PA.sigInfo(key).letters.length, nx=50+ns*10+(ns?24:14);
  // 右はしの矢印の字（「平行5度」など）がはみ出ないように少し広げる
  const tw=t=>[...(t||'')].reduce((w,ch)=>w+(ch.charCodeAt(0)>255?14:8.5),0);
  const pad=Math.max(44,...arrows.map(a=>tw(a.text)-cw/2+22));
  let svg=PA.staffSVG(key,sc.map(s=>s.col),{grand:true,autoCarry:true,colW:cw,minW:Math.max(o.minW||0,arrows.length?nx+cols.length*cw+pad:0)});
  const posOf=(ci,n)=>{
    const s=sc[ci]; if(!s) return null;
    const inT=s.tr.includes(n), arr=inT?s.tr:s.lh.includes(n)?s.lh:null; if(!arr) return null;
    const P=arr.map(m=>({m,s:PA.stepOf(m)})).sort((a,b)=>a.s-b.s);
    let ps=-99,po=false; P.forEach(p=>{p.off=(p.s-ps===1&&!po);po=p.off;ps=p.s;});
    const p=P.find(p=>p.m===n);
    return {x:nx+ci*cw+cw/2+(p.off?13:0),y:inT?96-(p.s-30)*5:178-(p.s-26)*5};
  };
  let add='';
  const cs=new Set();
  arrows.forEach(a=>{
    const p=posOf(a.c1,a.n1), r=posOf(a.c2,a.n2); if(!p||!r) return;
    const id='a6'+a.color.slice(1); cs.add(a.color);
    add+=`<path d="M${p.x+12} ${p.y} L${r.x-22} ${r.y}" stroke="${a.color}" stroke-width="2.4" fill="none" stroke-dasharray="${a.dash||''}" marker-end="url(#${id})"/>`;
    if(a.text) add+=`<text x="${r.x+14}" y="${r.y+5+(a.dy||0)}" font-size="14" font-weight="800" fill="${a.color}">${a.text}</text>`;
  });
  if(cs.size) add+=`<defs>${[...cs].map(c=>`<marker id="a6${c.slice(1)}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${c}"/></marker>`).join('')}</defs>`;
  svg=svg.replace(/<\/svg>$/,add+'</svg>');
  // 小さくなりすぎないように（文字が読めるように）横スクロールにする
  const m=svg.match(/viewBox="0 0 ([\d.]+) /), W=m?+m[1]:400;
  return `<div class="scroll" data-sk="${o.sk||'staff'}"><div style="min-width:${Math.round(W*0.66)}px">${svg}</div></div>`;
}

/* ===== けんばんの印 ===== */
function marksOf(notes,o={}){
  const mk=new Map();
  notes.forEach(n=>{
    const fill=n.tag==='low'?LOW:n.tag==='lt'?LT:(o.color||AUG);
    const m={fill,label:PA.nm(n),focus:true};
    if(o.pair&&n.tag==='low'){m.sub='↓ 下へ';m.subColor=LOW;}
    if(o.pair&&n.tag==='lt'){m.sub='↑ 上へ';m.subColor=LT;}
    if(!o.pair&&o.ltSub&&n.tag==='lt'){m.sub='導音';m.subColor=LT;}
    if(o.subs&&o.subs.has(n)){m.sub=o.subs.get(n);m.subColor=o.color||AUG;}
    mk.set(n.midi,m);
  });
  return mk;
}

/* ===== せつめい ===== */
function staticMsg(key,t){
  const a=aug(key,t), T=TYPES[t], low=a[0], up=a[a.length-1], V=C.aug6ToV(key,t)[0];
  let m=`${PA.keyName(key)}の<b>${T.name}</b>は、${T.from}${T.root?'（根音ものこす）':'の根音をはぶき'}、第5音を半音下げて<b>いちばん下</b>においた和音 → <b class="big">${namesC(a)}</b>`;
  m+=`<br>いちばん下${q(low)}といちばん上${q(up)}が<b>増6度</b>（ふつうの6度よりひろいはば）。だから「増六の和音」。この2つは<b>外へひらいて</b>、Ⅴの根音${q(V)}のオクターブへすすむよ。`;
  return m;
}
function heroCard(key,t){
  const a=aug(key,t), T=TYPES[t], low=a[0], up=a[a.length-1], A=state.anim;
  const src=C.symbol(key,T.src);
  const cur=A?A.cols[A.cols.length-1].notes:a; // つくりかたのとちゅうは、いまできている音だけ
  let h=`<section class="card hero" style="--c:${AUG}">
    <div class="hero-top"><span class="badge" style="--c:${AUG}">増6</span>
      <div style="min-width:0"><div class="hk">${PA.keyName(key)}の${T.name}</div>
      <div class="hs">もとの和音：${T.from}（${src}）　<span class="lo nw">青＝下げた第5音</span>・<span class="up nw">赤＝Ⅴへの導音</span></div></div></div>
    <div class="hn">${cur.length?namesC(cur):'…'}</div>
    ${A?'':`<div class="chips roles">${a.map(n=>`<span class="chip"><b class="${n.tag==='low'?'lo':n.tag==='lt'?'up':''}">${PA.nmH(n)}</b>：${n.role}</span>`).join('')}</div>
    <p class="note rcap">根音＝${T.from}のもとの音${T.root?'':'（この和音でははぶく）'}。そこから、ひとつとばしに第3音・第5音・第7音${t==='ger'?'・第9音':''}。<span class="up">導音</span>＝Ⅴの根音へのぼりたがる音。</p>
    <div class="pair">↕️ ${q(low)}と${q(up)}＝<b>増6度</b>。${q(low)}は半音下へ、${q(up)}は半音上へ。</div>`}
    <div class="msg" style="margin-top:10px">${A?A.msg:state.autoWait?'👆 どこかをタッチすると<b>つくりかた</b>が始まるよ':(state.msg||staticMsg(key,t))}</div>
  </section>`;
  return h;
}
function compareCard(key){
  let h=`<details class="card fold" data-d="cmp"><summary><h2>👂 3つを聴きくらべ<small>${PA.keyName(key)}で。どれも、いちばん下といちばん上は同じ増6度</small></h2></summary>`;
  TKEYS.forEach(t=>{
    const T=TYPES[t], a=aug(key,t);
    h+=`<div class="cmprow ${(state.cmp?state.cmp===t:t===state.type)?'on':''}" style="--c:${AUG}"><button class="btn" data-act="cmp" data-v="${t}" aria-pressed="${state.cmp===t}">${PA.icon('listen')}${T.short}</button>
      <div class="tx"><b>${a.map(n=>`<span class="nw">${PA.nmH(n)}</span>`).join('・')}</b><br>${T.from}・根音${T.root?'あり':'なし'}・${T.n}つの音</div></div>`;
  });
  return h+`<p class="note">イタリアは<b>うすくかるい</b>（3つの音）。フランスは根音が入って<b>ふしぎ・ふわっと</b>。ドイツは<b>こくてⅤ7みたい</b>。</p></details>`;
}
function staffCard(key,t){
  const A=state.anim;
  if(A) return `<section class="card"><h2>🎼 がくふ<small>${A.staffCap||''}</small></h2>${staff(key,A.cols.map(c=>({color:AUG,...c})),A.arrows,{sk:'staff'})}${dsNote(A.cols)}</section>`;
  const st=stagesOf(key,t,state.gerPath), a=st[0].notes, nx=st[1].notes, low=a[0], up=a[a.length-1];
  const cols=st.map((s,i)=>({notes:s.notes,color:s.color,label:s.label,op:state.res>0&&i!==state.res?0.45:1}));
  const arrows=[{c1:0,n1:low,c2:1,n2:nx[0],color:LOW,text:'半音↓'},{c1:0,n1:up,c2:1,n2:nx[nx.length-1],color:LT,text:'半音↑'}];
  if(t==='ger'&&state.gerPath==='direct') arrows.push({c1:0,n1:a[2],c2:1,n2:nx[2],color:PAR,text:'平行5度',dash:'5 4'});
  let h=`<section class="card"><h2>🎼 がくふ ── Ⅴへすすむ<small>${st.map(s=>s.id==='aug'?TYPES[t].name:s.id==='i64'?I64H:'Ⅴ').join(' → ')}</small></h2>`;
  if(t==='ger') h+=`<div style="margin-bottom:8px">${PA.seg('gpath',[['i64',`${I64H}をとおる<small>（ふつう）</small>`],['direct','Ⅴへちょくせつ']],state.gerPath,'full pseg')}</div>`;
  h+=staff(key,cols,arrows,{sk:'staff'})+dsNote(cols);
  const V=C.aug6ToV(key,t);
  h+=`<p class="note"><b class="lo">${PA.nmH(low)}</b>は半音下へ、<b class="up">${PA.nmH(up)}</b>は半音上へ。<b>外へひらいて</b>、Ⅴの根音${q(V[0])}がオクターブでならぶよ。</p>`;
  if(t==='ger'){
    const g=a;
    h+=`<p class="note">ドイツの6からすぐⅤへすすむと、${q(g[0])}と${q(g[2])}の5度が、そのまま${q(V[0])}と${q(V[2])}の5度へならんで動く（<b>平行5度</b>）。ひびきがうすくなるので、さけるきまり。あいだに<b>${I64H}</b>（Ⅰの第5音をいちばん下にした形）をはさむのがふつう。${state.gerPath==='direct'?`<span style="color:${PAR}">オレンジの線</span>が平行5度。「Ⅴへ」で聴いてみよう。`:''}</p>`;
  }
  return h+`</section>`;
}
function bIIDetails(key){
  const b=bIIinfo(key), g=b.g, d=b.dom, alt=state.alt, i64=C.gerToI64(key), gv=C.aug6ToV(key,'ger');
  let mk;
  if(alt) mk=marksOf(alt.notes,{color:alt.color});
  else{
    mk=marksOf(g,{});
    g.forEach((n,i)=>{if(n.letter!==d[i].letter||n.acc!==d[i].acc){const m=mk.get(n.midi);m.sub=PA.nm(d[i]);m.subColor=LT;}});
  }
  const [lo,hi]=kbRange([g,b.res,i64,gv]);
  let h=`<details class="more" data-d="bii"><summary>🎹 けんばんでは${b.domName}と同じ音</summary>

function borrowDetails(key,t){

      ${staff(key,[{notes:alt,color:AUG,label:'ドイツ'},{notes:i64,color:ICOL,label:I64S},{notes:C.aug6ToV(key,'ger'),color:VCOL,label:'Ⅴ'}],[{c1:0,n1:alt[2],c2:1,n2:i64[2],color:AUG,text:'半音↑'}],{sk:'alt',cw:100})}${dsNote([{notes:alt}])}

}

// 📖 ことばメモ：本や楽譜で見かける名前を、やさしいことばで。例はいまの調・えらんだ和音の音で
function termsHTML(key,t){
  const a=aug(key,t), low=a[0], up=a[a.length-1], g=aug(key,'ger'), gv=C.aug6ToV(key,'ger'), b=bIIinfo(key);
  const span=[0,1,2,3,4,5].map(i=>PA.nm({letter:(low.letter+i)%7,acc:0})).join('・'); // 増6度を文字で数える
  // けんばんでおなじはばの7度（上の音を書きかえる。♯♯・♭♭になるときは下の音を書きかえる）
  const pcN=n=>PA.mod(PA.NAT[n.letter]+n.acc,12);
  let s7=[low,{letter:(low.letter+6)%7,acc:PA.spell((low.letter+6)%7,pcN(up))}];
  if(Math.abs(s7[1].acc)>1){const L=(up.letter+1)%7;s7=[{letter:L,acc:PA.spell(L,pcN(low))},up];}
  const w7=Math.abs(s7[0].acc)>1||Math.abs(s7[1].acc)>1?'7度':`${q(s7[0])}から${q(s7[1])}（7度）`;
  return `<details class="more" data-d="terms"><summary>📖 ことばメモ（本や楽譜で見かける名前）</summary>
    <p class="note" style="margin:0 0 4px">例は${PA.keyName(key)}の${TYPES[t].name}だよ。</p><ul>
    <li><b>増六の和音</b> … いちばん下といちばん上のはばが増6度になる和音。ドッペルドミナントの第5音を半音下げて、いちばん下においた形。いまは${namesC(a,'・')}。</li>
    <li><b>イタリアの6</b>・<b>フランスの6</b>・<b>ドイツの6</b> … 増六の和音の3つの形。英語の本では It+6・Fr+6・Ger+6と書くよ。国の名前は、むかしからのよび名で、とくにいみはないよ。</li>
    <li><b>増6度</b> … ${q(low)}から${q(up)}は文字で数えて6つ（${span}）なので6度。でもふつうの6度よりひろいので「増」6度。けんばんでは${w7}と同じはばだよ。</li>
    <li><b>平行5度</b>（連続5度） … 2つの声が5度（${q({letter:0,acc:0})}と${q({letter:4,acc:0})}のようなはば）のまま、いっしょに動くこと。ひびきがうすくなるので、さける。ドイツの6からすぐⅤへすすむと、${q(g[0])}${q(g[2])} → ${q(gv[0])}${q(gv[2])}が平行5度になるよ。</li>
    <li><b>${I64H}</b>（四六の和音・終止四六） … Ⅰの第5音をいちばん下にした形。Ⅴの前におくと、Ⅴのなかまになるよ。Ⅰ²と書く本もあるよ。</li>
    ${key.minor?'':`<li><b>準固有</b> … 同じ主音の短調（${parMinor(key)}）から音をかりること。下げた第5音${t==='ger'?'と第9音':''}は、${parMinor(key)}の音だよ。</li>`}
    <li><b>異名同音</b> … 名前（書きかた）はちがうけど、けんばんでは同じ音。ドイツの6は${b.domName}（${b.bII}のためのⅤ7）と同じけんばんなので、この読みかえで、ちがう調へうつる曲もあるよ。</li>
    <li><b>ナポリの和音</b>（♭Ⅱ） … Ⅱの根音を半音下げた長三和音。${PA.keyName(key)}では${b.bII}。</li>
  </ul></details>`;
}
// 変化和音クイズへ：いまの調で、🎹 おさえるレベル3（増六3しゅるい）を5もん。👂 聴きわけはレベル2（増六）

let lastActions='';
function render(){
  const key=curKey(), t=state.type, A=state.anim, [lo,hi]=keyRange(key);
  let h=`<div class="stack">
    <div class="toprow">${PA.keyChip(key)}<span class="note" style="margin:0">${PA.keyEn(key)}</span></div>
    ${PA.seg('type',TKEYS.map(k=>[k,TYPES[k].name]),t,'full tseg')}
    ${heroCard(key,t)}`;
  // けんばん
  let mk, cap;
  if(A){mk=A.marks;cap=A.kbCap||'';}
  else if(state.cmp){mk=marksOf(aug(key,state.cmp),{pair:true});cap=`${TYPES[state.cmp].name}を鳴らしているよ`;}
  else{
    const st=stagesOf(key,t,state.gerPath), s=st[Math.min(state.res,st.length-1)];
    if(state.res===0){mk=marksOf(s.notes,{pair:true});cap='青＝下げた第5音、赤＝Ⅴへの導音。外へひらくよ';}
    else{
      const sub=new Map(); s.notes.forEach(n=>{if(s.id==='V'&&PA.mod(n.midi-s.notes[0].midi,12)===0) sub.set(n,'根音');});
      mk=marksOf(s.notes,{color:s.color,subs:sub});
      cap=s.id==='V'?'Ⅴ（根音がオクターブでならぶ）':`${I64H}（Ⅰの第5音がいちばん下）`;
    }
  }
  h+=`<section class="card"><h2>🎹 けんばん<small>${cap}${PA.once('tap-sound','　さわると音が出るよ')}</small></h2><div class="scroll" data-sk="kb">${PA.kbSVG(lo,hi,mk)}</div></section>`;
  h+=staffCard(key,t);
  h+=tryCard(key);
  h+=compareCard(key);
  if(t==='ger') h+=bIIDetails(key);
  if(!key.minor) h+=borrowDetails(key,t);
  h+=tipsHTML(key);
  h+=termsHTML(key,t);
  h+=linksCard();
  h+=`</div>`;
  PA.paint(document.getElementById('view'),h,state.minor+':'+state.keyIdx+':'+t);
  if(state.anim) PA.follow(document.getElementById('view')); // つくりかたで音の高さがかわっても鍵が見えるように
  const acts=(A?`<button class="btn" data-act="stop">${PA.icon('stop')}とめる</button>`:`<button class="btn night" data-act="build">🐸 つくりかた</button>`)+
    `<button class="btn" data-act="play" data-hot="listen">${PA.icon('listen')}いっしょに</button><button class="btn primary" data-act="resolve">${PA.icon('next')}Ⅴへ</button>`;
  if(acts!==lastActions){PA.paint(document.getElementById('actions'),acts,'bar');lastActions=acts;}
}

/* ===== つくりかたアニメ ===== */
let token=0;
function stop(){token++;state.anim=null;state.autoWait=false;state.alt=null;state.cmp=null;PA.stopSound();}
async function runBuild(){
  stop(); const my=token, alive=()=>my===token;
  const key=curKey(), t=state.type, T=TYPES[t], stack=buildStack(key,t);
  const [r,t3,t5,t7,t9]=stack, V=C.aug6ToV(key,t)[0];
  const A={cols:[{notes:[]}],arrows:[],marks:new Map(),msg:'',kbCap:'',staffCap:''};
  state.anim=A; state.res=0; state.msg=null;
  const upd=m=>{if(m!==undefined)A.msg=m;render();};
  const wait=async ms=>{await PA.sleep(ms);return alive();};
  // ① ドッペルドミナント（ドイツはⅤ9/Ⅴ）を1つずつつみかさねる
  const head=t==='ger'?`<b>①</b>まず${PA.keyName(key)}の<b>Ⅴ9/Ⅴ</b>（ドッペルドミナントに第9音をのせた和音）をつくるよ。`
    :`<b>①</b>まず${PA.keyName(key)}の<b>ドッペルドミナント</b>（Ⅴ7/Ⅴ）をつくるよ。Ⅴ${q(V)}のためのⅤ7だね。`;
  A.staffCap=t==='ger'?'Ⅴ9/Ⅴ':'ドッペルドミナント（Ⅴ7/Ⅴ）'; A.kbCap=A.staffCap;
  upd(head); if(!await wait(1300)) return;
  const ii3={letter:t3.letter,acc:sigAcc(key,t3.letter),midi:t3.midi};
  const lines=[
    `根音${q(r)}（音階の2ばんめ）`,
    `第3音${q(t3)}。Ⅱ7の${q(ii3)}を半音上げた音で、Ⅴ${q(V)}への<b class="up">導音</b>`,
    `第5音${q(t5)}${key.minor?'（短調ではこれも半音上げる）':''}`,
    `第7音${q(t7)}`,
    `第9音${q(t9||t7)}${key.minor?'':`。${parMinor(key)}からかりた音`}`
  ];
  for(let i=0;i<stack.length;i++){
    A.cols=[{notes:stack.slice(0,i+1)}]; A.arrows=[];
    A.marks=marksOf(stack.slice(0,i+1),{ltSub:true});
    upd(head+`<br>${i+1}. ${i?'ひとつとばして':''}${lines[i]}`); PA.playNote(stack[i].midi,0,1.1,0.22);
    if(!await wait(1500)) return;
  }
  PA.chord(stack.map(n=>n.midi)); if(!await wait(1400)) return;
  // ② 第5音を半音下げる
  const low={...t5,acc:t5.acc-1,midi:t5.midi-1,tag:'low',role:'下げた第5音'};
  const s2=stack.map(n=>n===t5?low:n);
  A.cols=[{notes:stack,op:.5},{notes:s2}]; A.arrows=[{c1:0,n1:t5,c2:1,n2:low,color:LOW,text:'半音↓'}];
  A.marks=marksOf(s2,{ltSub:true}); A.marks.get(low.midi).sub='半音下げ'; A.marks.get(low.midi).subColor=LOW;
  A.marks.set(t5.midi,{fill:'#fff',ring:LOW,tc:LOW,label:PA.nm(t5),sub:'もとの音',subColor:GHOST});
  A.staffCap='第5音を半音下げる'; A.kbCap='青＝下げた第5音';
  upd(`<b>②</b>第5音${q(t5)}を<b class="lo">半音下げて</b>${q(low)}にするよ。<br>`+
    (key.minor?`短調では、ドッペルドミナントで上げてあった第5音が、もとの調号の音にもどる形だね。`:`${q(low)}は<b>${parMinor(key)}</b>（同じ主音の短調）からかりてきた音。`));
  PA.playNote(low.midi,0,1.1,0.24); if(!await wait(1100)) return;
  PA.chord(s2.map(n=>n.midi)); if(!await wait(2200)) return;
  // ③ 根音をはぶく（イタリア・ドイツ）／のこす（フランス）
  const s3=T.root?s2:s2.filter(n=>n!==r);
  A.cols=[{notes:s3}]; A.arrows=[];
  A.marks=marksOf(s3,{ltSub:true});
  if(T.root){const m=A.marks.get(r.midi);m.ring='#f4a100';m.sub='のこす';m.subColor='#c98500';}
  else A.marks.set(r.midi,{fill:'#efe9e1',tc:GHOST,label:PA.nm(r),sub:'はぶく',subColor:GHOST});
  A.staffCap=T.root?'根音をのこす':'根音をはぶく'; A.kbCap=A.staffCap;
  upd(T.root?`<b>③</b>フランスの6は根音${q(r)}を<b>のこす</b>。4つの音でつくるよ。`
    :`<b>③</b>根音${q(r)}を<b>はぶく</b>。${t==='ger'?'（Ⅴ9の根音をはぶいた形は減七だったね。ドイツの6は減七/Ⅴの第5音を下げた形。）':'のこった3つの音でつくるよ。'}`);
  PA.chord(s3.map(n=>n.midi)); if(!await wait(2200)) return;
  // ④ 下げた音をいちばん下へ
  const fin=aug(key,t), lowF=fin[0], up=fin[fin.length-1];
  // 高さがかわる音（下げた音がオクターブ下へ、またはそれより下の音がオクターブ上へ）
  const moved=s3.map(n=>({n,f:fin.find(f=>f.letter===n.letter&&f.acc===n.acc)})).filter(m=>m.f&&m.f.midi!==m.n.midi);
  const lowDown=lowF.midi<low.midi, others=moved.filter(m=>m.n!==low);
  const ups=others.filter(m=>m.f.midi>m.n.midi), downs=others.filter(m=>m.f.midi<m.n.midi);
  A.cols=[{notes:s3,op:.5},{notes:fin}];
  A.arrows=moved.map(m=>m.n===low?{c1:0,n1:low,c2:1,n2:lowF,color:LOW,text:lowDown?'下へ':'上へ'}:{c1:0,n1:m.n,c2:1,n2:m.f,color:PAR});
  // 字は上へ・下へそれぞれいちばんはしの矢印だけに（向きは矢印とおなじ）
  const edge=(L,hi)=>L.reduce((a,m)=>!a||(hi?m.f.midi>a.f.midi:m.f.midi<a.f.midi)?m:a,null);
  [[edge(ups,true),'オクターブ上へ'],[edge(downs,false),'オクターブ下へ']].forEach(([m,tx])=>{if(m) A.arrows.find(a=>a.n1===m.n).text=tx;});
  A.marks=marksOf(fin,{pair:true});
  A.staffCap='下げた音をいちばん下へ'; A.kbCap='青＝いちばん下、赤＝いちばん上';
  const qs=L=>L.map(m=>q(m.n)).join('と');
  let m4=lowDown?`<b>④</b>下げた音${q(low)}を<b>いちばん下</b>へうつす`
    :`<b>④</b>下げた音${q(low)}が<b>いちばん下</b>になるように、`;
  if(ups.length) m4+=`${lowDown?'。':''}それより下の音${qs(ups)}を<b style="color:${PAR}">オクターブ上へ</b>うつす`;
  if(downs.length) m4+=`${lowDown||ups.length?'。':''}${qs(downs)}も<b style="color:${PAR}">オクターブ下へ</b>うつす`;
  upd(m4+'と…');
  const toPlay=(lowDown?[lowF]:[]).concat(others.map(m=>m.f));
  toPlay.forEach((n,i)=>PA.playNote(n.midi,i*0.32,1.1,0.24)); if(!await wait(1000+Math.max(0,toPlay.length-1)*320)) return;
  PA.chord(fin.map(n=>n.midi));
  const done=`🎉 <b>できあがり！</b>${PA.keyName(key)}の${T.name}は<b class="big">${namesC(fin)}</b><br>`+
    `いちばん下${q(lowF)}といちばん上${q(up)}のはばが<b>増6度</b>。この2つは<b>外へひらいて</b>（${q(lowF)}は半音下へ、${q(up)}は半音上へ）Ⅴの根音${q(V)}のオクターブになるよ。「Ⅴへ」で聴いてみよう！`;
  upd(done); if(!await wait(2200)) return;
  state.msg=done; state.anim=null; render();
}
async function playResolve(){
  stop(); const my=token;
  const st=stagesOf(curKey(),state.type,state.gerPath);
  for(let i=0;i<st.length;i++){
    state.res=i; render();
    PA.chord(st[i].notes.map(n=>n.midi),{dur:i===st.length-1?2.2:1.4});
    if(i<st.length-1){await PA.sleep(1300); if(my!==token) return;}
  }
}
// 和音をじゅんに鳴らして、details の小さなけんばんにも出す
async function playSeq(seq){
  stop(); const my=token;
  for(let i=0;i<seq.length;i++){
    state.alt=seq[i]; render();
    PA.chord([...new Set(seq[i].notes.map(n=>n.midi))],{dur:i===seq.length-1?2.2:1.4});
    await PA.sleep(1300); if(my!==token) return;
  }
  await PA.sleep(900); if(my!==token) return;
  state.alt=null; render();
}
const augMidis=()=>aug(curKey(),state.type).map(n=>n.midi);

/* ===== 操作 ===== */
PA.mountBar({title:'増六の和音',app:'aug6'});
PA.onSettings=render;
PA.onPageShow=()=>{stop();render();}; // 「もどる」でもどってきたとき、とちゅうの画面をのこさない
PA.onStopDown=stop;
PA.onStopCancel=render; // ⏹ をおしたのに click が来なかったとき画面をもどす
PA.onKeySheet=()=>PA.openKeySheet({minor:state.minor,idx:state.keyIdx,both:true,onPick:(minor,idx)=>{
  stop(); state.minor=minor; state.keyIdx=idx; state.res=0; state.msg=null; save(); render(); PA.chord(augMidis());
}});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v, key=curKey();
  if(a==='type'){if(!TKEYS.includes(v))return;stop();state.type=v;state.res=0;state.msg=null;save();render();PA.chord(augMidis());}
  else if(a==='play'){
    if(state.anim){PA.chord(state.anim.cols[state.anim.cols.length-1].notes.map(n=>n.midi),{dur:2});return;} // アニメ中はとめずに鳴らす
    stop(); state.res=0; render(); PA.chord(augMidis(),{dur:2});
  }
  else if(a==='resolve'){playResolve();}
  else if(a==='build'){runBuild();}
  else if(a==='stop'){stop();render();}
  else if(a==='gpath'){if(v!=='i64'&&v!=='direct')return;stop();state.gerPath=v;state.res=0;PA.store.set('aug6-ger',v);render();}
  else if(a==='cmp'){
    if(!TKEYS.includes(v)) return;
    stop(); state.cmp=v; render(); PA.chord(aug(key,v).map(n=>n.midi),{dur:2.2});
    const my=token; setTimeout(()=>{if(my===token&&state.cmp===v){state.cmp=null;render();}},2300);
  }
  else if(a==='biidom'){const b=bIIinfo(key);playSeq([{notes:b.dom,color:VCOL,cap:`${b.domName}（♭ⅡのためのⅤ7）`},{notes:b.res,color:VCOL,cap:`${b.bII}（♭Ⅱ）`}]);}
  else if(a==='biiger'){playSeq([{notes:aug(key,'ger'),color:AUG,cap:'ドイツの6'},{notes:C.gerToI64(key),color:ICOL,cap:`${I64H}（Ⅰの第5音がいちばん下）`},{notes:C.aug6ToV(key,'ger'),color:VCOL,cap:'Ⅴ'}]);}
  else if(a==='altplay'){
    const alt=C.gerMajorAlt(key); if(!alt) return;
    stop(); render(); const my=token; // つくりかたのとちゅうでも画面をもどしてから鳴らす
    [alt,C.gerToI64(key),C.aug6ToV(key,'ger')].forEach((ns,i)=>setTimeout(()=>{if(my===token)PA.chord(ns.map(n=>n.midi),{dur:i===2?2.2:1.4});},i*1300));
  }
  else if(a==='go'){
    stop(); render();
    if(v==='doppel'){PA.store.set('doppel',{minor:state.minor,keyIdx:state.keyIdx,raised:true});PA.go('doppel.html');}
    else if(v==='minor-family'){
      // 長調からはおなじ主音の短調へ（リストにない調なら、まえに見ていた短調）
      const mi=state.minor?state.keyIdx:PA.MINOR_KEYS.findIndex(([l,a])=>l===key.l&&a===key.a);
      const mf=PA.store.get('minor-family',{})||{};
      PA.store.set('minor-family',{keyIdx:mi>=0?mi:Number.isInteger(mf.keyIdx)?mf.keyIdx:0,fam:'DIM'});
      PA.go('minor-family.html');
    }
  }
});
render();
// ほかのアプリの「つくりかたを見る」から来たとき：えらばれた調・和音でアニメをはじめる
// iPhone などではこのページをタッチするまで音が出ないので、音が出せるようになってからはじめる
// （音がとまっているあいだに音をよやくすると、あとでいっぺんに鳴ってしまう）
if(PA.store.get('aug6-auto',false)) (async()=>{
  PA.store.set('aug6-auto',false);
  const t0=token; // まっているあいだにほかの操作をしたらやめる
  if(PA.settings.sound){ // パソコンなどですぐ音が出せるならそのままはじめる
    PA.audio();
    for(let i=0;i<5&&!PA.audioRunning();i++) await PA.sleep(30);
  }
  if(token!==t0) return;
  if(!PA.settings.sound||!PA.audio()||PA.audioRunning()){runBuild();return;} // 音が出せないブラウザでは待たずにはじめる
  state.autoWait=true; render();
  const EV=['pointerup','touchend','keydown'];
  let busy=false;
  const off=()=>EV.forEach(t=>document.removeEventListener(t,go,true));
  async function go(e){
    if(!state.autoWait){off();return;}
    // ボタン・リンク・シート・けんばんはそれぞれの操作にまかせる（つくりかた／調・和音をかえると待ちはおわる）
    const t=e&&e.target;
    if(t&&t.closest&&t.closest('button,a,dialog,summary,.appbar,[data-act],[data-pa],[data-m]')) return;
    if(busy) return; busy=true;
    PA.audio(); // core もこのタッチで音を起こすので、動きだすのを少しまつ
    for(let i=0;i<15&&PA.settings.sound&&!PA.audioRunning();i++) await PA.sleep(30);
    busy=false;
    if(!state.autoWait){off();return;}
    if(PA.settings.sound&&PA.audio()&&!PA.audioRunning()) return; // まだ音が出せない：つぎのタッチをまつ
    off(); runBuild();
  }
  EV.forEach(t=>document.addEventListener(t,go,true));
})();
</script>
</body>
