<title>伴奏づけ</title>
<link rel="stylesheet" href="assets/app.css">
<style>
:root{--model:#efe6ff;--modelink:#5b2fb0}
.lbl{font-size:14px;font-weight:700;color:var(--sub);margin:0 2px 4px}
.lbl .cnt{font-weight:400;font-size:13px}
/* 曲：やさしい順に横にならべてスクロール（スマホ） */
.songs{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity;
  margin-left:-16px;margin-right:-16px;padding:2px 16px 6px;scroll-padding-left:16px;scroll-padding-right:16px;scrollbar-width:thin}
.song{flex:none;width:160px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
  min-height:72px;padding:7px 8px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.song.on{border-color:var(--ink);box-shadow:0 2px 0 #eadfce}
.song b{font-size:15px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.song .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.song .lv{font-size:12px;color:#c98500;letter-spacing:.1em;line-height:1.2}
.song .mt{font-size:11.5px;font-weight:800;line-height:1.5;padding:0 6px;border-radius:6px;background:#fff0c9;color:#8a5a00}
.song .used{display:flex;gap:4px;flex-wrap:wrap}
/* iPad など：ぜんぶの曲をならべて見せる（横スクロールで切れたカードをのこさない）。スマホの横向きは1行のまま */
@media (min-width:700px) and (min-height:501px){
  .songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));overflow:visible;margin-left:0;margin-right:0;padding:2px 0 4px}
  .song{width:auto}
  .lbl .swipe{display:none}
}
.tag{font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--l);color:var(--c)}
.toprow{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.toprow .note{margin:0;flex:1 1 200px;font-size:14px}
/* 調のボタンと 🎲（せまい画面では2つで1行、メモはその下） */
.keyrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dice{padding-left:14px;padding-right:14px;font-size:15px;white-space:nowrap}
.toprow .note.keymsg{color:var(--ink)}
.randset{margin-top:8px}
.randset>summary{font-size:15px}
.randset .note{margin:6px 0 0}
/* がくふ */
.scorehead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:flex-start;justify-content:space-between}
.scorehead h2{margin:0;flex:1 1 220px}
.progress{font-size:15px;color:var(--sub);white-space:nowrap}
.progress b{color:var(--ink);font-size:18px}
.scorecard svg{margin:4px 0}
.hit{cursor:pointer;scroll-margin-top:calc(72px + env(safe-area-inset-top,0px));scroll-margin-bottom:calc(185px + env(safe-area-inset-bottom,0px))}
.banner{background:var(--model);color:var(--modelink);border-radius:12px;padding:6px 12px;font-weight:700;font-size:15px;margin-top:8px}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.btns .btn{padding-left:8px;padding-right:8px;font-size:15px;white-space:normal;line-height:1.25}
.btns .wide{grid-column:1/-1}
.btn.reveal{background:var(--model);color:var(--modelink)}
.fb{margin-top:10px}
.fb ul{margin:6px 0 0;padding-left:1.2em}
.fb li{margin:3px 0}
.legend{font-size:14px;margin-top:4px;opacity:.85}
/* なかま表 */
.fit{width:100%;border-collapse:separate;border-spacing:3px}
.fit th,.fit td{text-align:center;padding:6px 3px;border-radius:10px;font-size:15px;line-height:1.3}
.fit thead th{background:var(--soft2);font-weight:800;min-width:34px}
.fit thead th small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.fit thead th.first{background:#fff0c9}
.fit thead th.blank{background:none;min-width:0}
.fit thead th.cnth{font-size:12px;color:var(--sub);font-weight:400;white-space:nowrap}
.fit tbody th{text-align:left;white-space:nowrap;background:var(--l);color:var(--c);font-weight:800;padding-left:8px;padding-right:8px}
.fit tbody th small{display:block;font-weight:700;font-size:11.5px;white-space:normal}
.fit tbody th small .nw{white-space:nowrap}
.fit td.y{background:#dcf5e8;color:#137a4f;font-weight:800}
.fit td.n{background:#f6f1ea;color:#b3a99c}
.fit td.cnt{font-weight:800;white-space:nowrap}
.fit tr.chosen th{outline:3px solid var(--c)}
/* 伴奏の形・はやさ */
.ctrl{display:flex;flex-direction:column;gap:6px}
.ctrl .seg button{padding:6px 4px;font-size:14px}
.ctrl label{display:flex;gap:8px;align-items:center;font-size:15px;min-height:44px;cursor:pointer}
.tempo{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.tempo input{flex:1;min-width:0}
input[type=range]{accent-color:var(--ink);height:32px}
input[type=checkbox]{flex:none;width:22px;height:22px;accent-color:var(--ink)}
/* パレット（いつも下にくっつく。親指でえらべる） */
.palbar{position:-webkit-sticky;position:sticky;bottom:0;z-index:20;margin-left:-16px;margin-right:-16px;padding:6px 12px calc(8px + env(safe-area-inset-bottom,0px));
  background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 -4px 12px rgba(80,60,30,.10);border-radius:16px 16px 0 0;border-top:1px solid var(--line)}
.selrow{display:flex;align-items:center;gap:6px}
.selinfo{flex:1;min-width:0;margin:0;font-size:15px;line-height:1.35}
.pbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:44px;padding:4px 12px;border-radius:999px;
  background:var(--soft);font-weight:700;font-size:14px;white-space:nowrap}
.pbtn.primary{background:var(--ink);color:#fff}
.palette{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:6px;margin-top:6px}
.cbtn{border-radius:16px;padding:4px 2px;min-height:52px;background:var(--l);color:var(--c);border:3px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cbtn .num{font-size:24px;font-weight:800;line-height:1.15}
.cbtn .nm,.cbtn .sym{display:none}
.cbtn.on{background:var(--c);color:#fff}
.cbtn.clear{--c:#857c8f;--l:#f4efe8;padding:4px 10px}
.cbtn.clear .nm{display:block;font-size:12px;font-weight:700}
/* せまい画面：アイコンの下に小さな字をのこす（タッチでは title が見えないので） */
@media (max-width:420px){.selinfo .pre,.pbtn .long{display:none}.pbtn{flex-direction:column;width:auto;min-width:52px;padding:2px 6px;gap:0;font-size:18px;line-height:1.1}.pbtn .t{display:block;font-size:10.5px}}
@media (min-width:600px){
  .palette{gap:8px}
  .cbtn{padding:6px 4px}
  .cbtn .num{font-size:28px}
  .cbtn .nm{display:block;font-size:13px;font-weight:700}
  .cbtn .sym{display:block;font-size:12px;opacity:.85}
}
/* iPad など：パレットが横にのびすぎないように、中みをまん中にまとめる */
@media (min-width:700px){
  .palbar>.selrow,.palbar>.palette{max-width:640px;margin-left:auto;margin-right:auto}
}
/* スマホを横にしたとき：パレットを1行にまとめてうすくし、がくふが見えるように */
@media (max-height:500px) and (orientation:landscape){
  .hit{scroll-margin-top:calc(56px + env(safe-area-inset-top,0px));scroll-margin-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .palbar{display:flex;align-items:center;gap:8px;padding:4px 12px calc(4px + env(safe-area-inset-bottom,0px))}
  .palbar>.palette{flex:1 1 auto;min-width:0;max-width:520px;margin:0 0 0 auto;gap:6px}
  .palbar>.selrow{flex:none;order:2;max-width:none;margin:0 auto 0 0}
  .selinfo{display:none}
  .cbtn{min-height:44px;padding:2px;border-radius:14px}
  .cbtn .num{font-size:22px;line-height:1.1}
  .cbtn .nm,.cbtn .sym{display:none}
  .cbtn.clear{flex-direction:row;gap:2px;padding:2px 10px}
  .cbtn.clear .num{font-size:18px}
  .cbtn.clear .nm{display:block;font-size:13px}
}
.pbtn[aria-disabled="true"],.cbtn[aria-disabled="true"]{opacity:.4;cursor:default}
/* つぎのマスへ（えらんでもすすまないときだけパレットの右はし）。和音ボタンがせまくならないように、けすといっしょに細く */
.palette.wnext{grid-template-columns:repeat(4,minmax(0,1fr)) auto auto}
.palette.wnext .cbtn.clear{padding:4px 6px;min-width:44px}
.cbtn.go{--c:#3a3245;--l:#fff;padding:4px 6px;min-width:44px}
.cbtn.go .nm{display:block;font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap}
.cbtn.go .gl,.selinfo .mi{display:none}
.selinfo .mw{white-space:nowrap}
@media (min-width:600px){.cbtn.go .gs{display:none}.cbtn.go .gl{display:inline}}
@media (min-width:600px) and (max-width:699px){.palette.wnext{gap:6px}.palette.wnext .cbtn .nm{font-size:12px}}
/* とてもせまい画面：「メロディー」を ♪ にして、いまえらんでいるマスの行をみじかく */
@media (max-width:360px){.palette.wnext{gap:4px}.selinfo{font-size:14px}.selinfo .mw{display:none}.selinfo .mi{display:inline}}
@media (max-height:500px) and (orientation:landscape){.cbtn.go{flex-direction:row;gap:2px;padding:2px 8px}.cbtn.go .num{font-size:18px}.cbtn.go .nm{font-size:13px}.cbtn.go .gs{display:inline}.cbtn.go .gl{display:none}.cbtn.clear .nm{white-space:nowrap}.pbtn .long{display:none}}
/* がくふのマス：キーボードでえらんでいるとき */
.hit:focus{outline:none;stroke:#2f7ee8;stroke-width:3}
.hit:focus:not(:focus-visible){stroke:none} /* 古い Safari はこの行をよまないので、いつも青いわくが出る */
.sharerow{display:flex;justify-content:flex-end;margin-top:8px}
.tips ol{margin:0;padding-left:1.4em}
.tips li{margin:6px 0}
</style>

<body>
<header class="appbar" id="appbar"></header>
<main class="page" id="view"></main>
<p id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;margin:0"></p>
<script src="assets/core.js"></script>
<script>
/* 伴奏づけ：知っている曲のメロディーにⅠ・Ⅳ・Ⅴ・Ⅴ7をつける（長調のみ） */
const CHORDS={I:{deg:0,n:3,label:'Ⅰ'},IV:{deg:3,n:3,label:'Ⅳ'},V:{deg:4,n:3,label:'Ⅴ'},V7:{deg:4,n:4,label:'Ⅴ7'}};
const CH_KEYS=['I','IV','V','V7'];
const CH_DEGS={I:[1,3,5],IV:[4,6,1],V:[5,7,2],V7:[5,7,2,4]};
const COL=PA.COL, LCOL=PA.LCOL;
// 伴奏の形（なめらかな形）と根音：音階の何番目か（0＝主音）
const VOICE={I:[0,2,4],IV:[0,3,5],V:[-1,1,4],V7:[-1,3,4]};
const ROOTK={I:0,IV:3,V:4,V7:4};
const KEYS=PA.MAJOR_KEYS.map((_,i)=>PA.majorKey(i)); // 主音はド4〜シ4
const noteAt=(key,k)=>PA.at(key.scale,k);
function chordTones(key,ch){const c=CHORDS[ch];return Array.from({length:c.n},(_,j)=>noteAt(key,c.deg+2*j));}
function voicing(key,ch){
  const chord=VOICE[ch].map(k=>{const n=noteAt(key,k);return {...n,midi:n.midi-12};});
  const r=noteAt(key,ROOTK[ch]);
  return {chord,bass:{...r,midi:key.tonicMidi-24+PA.mod(r.midi-key.tonicMidi,12)}};
}

/* ===== 曲データ =====
   音の書き方：音階の何番目(1〜7)、「,」で1オクターブ下、「'」で1オクターブ上、「:」のあとは拍の長さ（省略＝1拍）
   休み：「r」（r:1＝4分休符、r:2＝2分休符…）。鳴らさない・和音えらびの音にも入れない
   マスの書き方：[メロディー, おてほんの和音, ほかに合う和音..., 「!」つき＝音は入っていても ×にする和音]
   曲：meter＝拍子（4か3。ないときは4）、pickup＝1小節目の前の弱起（アウフタクト）のメロディー（和音のマスはなし） */
function P(str){
  if(!str||!str.trim()) return [];
  return str.trim().split(/\s+/).map(tok=>{
    const r=tok.match(/^r(?::([\d.]+))?$/);
    if(r) return {rest:true,beats:r[1]?parseFloat(r[1]):1};
    const m=tok.match(/^([1-7])([,']*)(?::([\d.]+))?$/);
    if(!m) throw new Error('曲データの書きまちがい: '+tok);
    const oct=(m[2].match(/'/g)||[]).length-(m[2].match(/,/g)||[]).length;
    return {deg:+m[1],oct,k:(+m[1]-1)+7*oct,beats:m[3]?parseFloat(m[3]):1};
  });
}
const sounding=ns=>ns.filter(n=>!n.rest); // 休みをのぞいた鳴る音
const sumBeats=ns=>ns.reduce((a,n)=>a+n.beats,0);
const REST_BEATS=[0.5,0.75,1,1.5,2,3,4]; // がくふに描ける休符の長さ
const TW_A=[['1 1','I','!IV'],['5 5','I'],['6 6','IV'],['5:2','I'],['4 4','IV','V7'],['3 3','I'],['2 2','V7','V'],['1:2','I','!IV']];
const TW_B=[['5 5','I'],['4 4','IV','V7'],['3 3','I'],['2:2','V7','V']];
const OD_P=[['3 3 4 5','I'],['5 4 3 2','V7','I'],['1 1 2 3','I']];
const OD_4=['3:1.5 2:.5 2:2','V7'], OD_8=['2:1.5 1:.5 1:2','I'];
const OD_B=[['2 2 3 1','V7'],['2 3:.5 4:.5 3 1','V7','I'],['2 3:.5 4:.5 3 2','V7'],["1 2 5,:2",'V7','I']];
const JB_1=[['3 3 3:2','I'],['3 3 3:2','I'],['3 5 1:1.5 2:.5','I'],['3:4','I'],['4 4 4:1.5 4:.5','IV'],['4 3 3 3:.5 3:.5','I']];
const LB_1=['5:1.5 6:.5 5 4','I','!V','!V7'];
const HC_P=[['3 2','I','!V','!V7'],['1:2','I','!IV']];
const KA_2=['3 2 1:2','I','!IV','!V','!V7'], KA_5=['1 r:1 1 r:1','I','IV'];
const CH_1=[['5 3','I','!V','!V7'],['3:2','I'],['4 2','V7','V','!IV'],['2:2','V7','V']];
const MK_1=['1 1 1 5,','I','!IV','!V','!V7'], MK_23=[['6, 6, 5,:2','IV','I','!V','!V7'],['3 3 2 2','V7','V','I']];
const KK_1=['5:2 3','I','!V','!V7'];
const AL_1=['1 1 2 3','I','!IV','!V'], AL_9=['6 7 6 5','IV','!I'];
const SONGS=[
  {id:'mary',title:'メリーさんのひつじ',level:1,slotBeats:4,
   tip:k=>`ⅠとⅤ7の2つだけでできるよ。「${PA.nmH(noteAt(k,1))}」が多い小節はどっちかな？`,
   slots:[['3 2 1 2','I'],['3 3 3:2','I'],['2 2 2:2','V7','V'],['3 5 5:2','I'],['3 2 1 2','I'],['3 3 3 3','I'],['2 2 3 2','V7','V'],['1:4','I']]},
  {id:'london',title:'ロンドン橋',level:1,slotBeats:4,
   tip:()=>'これもⅠとⅤ7だけ。長い音をよく見よう。',
   slots:[LB_1,['3 4 5:2','I'],['2 3 4:2','V7','V'],['3 4 5:2','I'],LB_1,['3 4 5:2','I'],['2:2 5:2','V7','V'],['3 1:3','I']]},
  {id:'twinkle',title:'きらきら星',level:2,slotBeats:2,
   tip:()=>'2拍ごとに和音をかえるよ。Ⅳがはじめて出てくる曲。',
   slots:[...TW_A,...TW_B,...TW_B,...TW_A]},
  {id:'ode',title:'よろこびの歌（ベートーヴェン）',level:2,slotBeats:4,
   tip:()=>'ⅠとⅤ7でできるよ。まん中の部分はⅤ7がつづくよ。',
   slots:[...OD_P,OD_4,...OD_P,OD_8,...OD_B,...OD_P,OD_8]},
  {id:'jingle',title:'ジングルベル（サビ）',level:3,slotBeats:4,
   tip:k=>`Ⅰ・Ⅳ・Ⅴ7をぜんぶ使うよ。「${PA.nmH(noteAt(k,3))}」が多い小節はどの和音？`,
   slots:[...JB_1,['3 2 2 3','V7','I'],['2:2 5:2','V7','V'],...JB_1,['5 5 4 2','V7'],['1:4','I']]},
  {id:'hotcross',title:'ホットクロスバン',level:1,slotBeats:2,
   tip:()=>'ⅠとⅤだけ。3小節目は前半と後半で音がかわるね。',
   slots:[...HC_P,...HC_P,['1:.5 1:.5 1:.5 1:.5','I','!IV'],['2:.5 2:.5 2:.5 2:.5','V','V7'],...HC_P]},
  {id:'kaeru',title:'かえるのうた',level:1,slotBeats:4,
   tip:k=>`「${namesH([noteAt(k,0),noteAt(k,2),noteAt(k,4)],'・')}」がたくさん出てくるよ。休みのところは鳴らないよ。`,
   slots:[['1 2 3 4','I','!IV','!V7'],KA_2,['3 4 5 6','I','IV','!V','!V7'],['5 4 3:2','I','!IV','!V','!V7'],KA_5,KA_5,
     ['1:.5 1:.5 2:.5 2:.5 3:.5 3:.5 4:.5 4:.5','I','V7','!IV'],KA_2]},
  {id:'chocho',title:'ちょうちょう',level:2,slotBeats:2,
   tip:k=>`ⅠとⅤ7でできるよ。2拍ごとにえらぼう。「${PA.nmH(noteAt(k,1))}」が多いところはどっちかな？`,
   slots:[...CH_1,['1 2','I','!IV','!V','!V7'],['3 4','I','!IV','!V7'],['5 5','I'],['5:2','I','V','V7'],
     ['5 3','I','!V','!V7'],['3 3','I'],['4 2','V7','V','!IV'],['2 2','V7','V'],['1 3','I','!IV'],['5 5','I','!V','!V7'],['3 3','I'],['3:2','I'],
     ['2 2','V7','V'],['2 2','V7','V'],['2 3','V7','V','!I'],['4:2','V7','V','!IV'],['3 3','I'],['3 3','I'],['3 4','I','!IV','!V7'],['5:2','I','V'],
     ['5 3','I','!V','!V7'],['3 3','I'],['4 2','V7','V','!IV'],['2:2','V7','V'],['1 3','I','!IV'],['5 5','I'],['3 2','V7','V','!I'],['1:2','I','!IV']]},
  {id:'makiba',title:'ゆかいな牧場',level:2,slotBeats:4,
   tip:k=>`Ⅰ・Ⅳ・Ⅴ7を使うよ。まん中の「チッチッチッ」はずっと「${PA.nmH(noteAt(k,0))}」だね。`,
   slots:[MK_1,...MK_23,['1:3 5,','I','!IV'],MK_1,...MK_23,['1:3 5,:.5 5,:.5','I','!IV'],
     ['1 1 1 5,:.5 5,:.5','I','!IV'],['1 1 1:2','I','!IV'],['1:.5 1:.5 1 1:.5 1:.5 1','I','!IV'],['1:.5 1:.5 1:.5 1:.5 1 1','I','!IV'],
     MK_1,...MK_23,['1:4','I','!IV']]},
  {id:'kakko',title:'かっこう',level:2,meter:3,slotBeats:3,
   tip:()=>'3拍子の曲。1小節に和音は1つ。ⅠとⅤ7でできるよ。',

/* ===== 判定 ===== */

function fitInfo(slot,ch){

  return {strong:!!ns.length&&set.includes(ns[0].deg),frac:total?inBeats/total:0,inBeats,total,count:hit.length};

  const w=Math.floor(b+1e-9);

}
function grade(slot,ch){
  if(!ch) return null;
  if(slot.ans===ch) return 'best';
  if(slot.ok.includes(ch)) return 'good';
  if(slot.start||slot.cadence||slot.ng.includes(ch)) return 'bad';
  if((ch==='V'&&slot.ans==='V7')||(ch==='V7'&&slot.ans==='V')) return 'good';
  const f=fitInfo(slot,ch);
  return f.strong&&f.frac>0.5?'good':'bad';
}
function whyBad(key,song,si,ch){
  const slot=song.slots[si];
  if(slot.cadence) return 'さいごはⅠでおわると「おしまい」の感じが出るよ';
  if(slot.start) return '曲のはじめはⅠではじめると、何調かよくわかるよ';
  if(slot.ng.includes(ch)) return `${CHORDS[ch].label}の音も入っているけれど、ここでは曲の流れに合わないよ`;
  const f=fitInfo(slot,ch), ns=sounding(slot.notes), names=namesH(chordTones(key,ch));
  if(!ns.length) return 'このマスは休みだけだよ';
  const first=noteAt(key,ns[0].k);
  if(!f.strong) return `${strongBeatJa(song,si)}の「${PA.nmH(first)}」が${CHORDS[ch].label}（${names}）に入っていないよ`;
  return `${CHORDS[ch].label}（${names}）に入っている音は、${beatsJa(f.total)}のうち${beatsJa(f.inBeats)}だけ`;
}

/* ===== 音（共通の PA.playNote：平均律・A4＝設定の基準ピッチ） ===== */
// 伴奏のきざみ方：t＝マスの中の拍、d＝長さ（拍）
// meter＝拍子、off＝マスが小節の何拍目からはじまるか（0から）。3拍子はズン・チャッ・チャッ、ドソミソミソ
function accEvents(key,ch,L,meter=4,off=0){
  const v=voicing(key,ch), ch3=v.chord.map(n=>n.midi).sort((a,b)=>a-b), bass=v.bass.midi, ev=[];
  if(state.style==='block') ev.push({t:0,d:L,ms:[bass,...ch3],vel:0.1});
  else if(state.style==='oompah'){
    const down=b=>meter===3?(off+b)%3===0:b%2===0;
    for(let b=0;b<L;b++) ev.push(down(b)?{t:b,d:1,ms:[bass],vel:0.17}:{t:b,d:0.9,ms:ch3,vel:0.085});
  }else{
    const pat=meter===3?[ch3[0],ch3[2],ch3[1],ch3[2],ch3[1],ch3[2]]:[ch3[0],ch3[2],ch3[1],ch3[2]];
    const o=meter===3?off*2:0;
    ev.push({t:0,d:L,ms:[bass],vel:0.13});
    for(let i=0;i<L*2;i++) ev.push({t:i/2,d:0.6,ms:[pat[(o+i)%pat.length]],vel:0.09});
  }

}
let playToken=0,playTimers=[],playTick=null;
function stopPlay(){
  const was=!!state.play;
  playToken++; playTimers.forEach(clearTimeout); playTimers=[]; clearTimeout(playTick); playTick=null;
  if(was) PA.stopSound();
  state.play=null;
}
/* 少しずつ先に鳴らす：曲ぜんぶの音をいちどに用意すると古いスマホではおもいので、
 * TICK ごとに「いまから LOOK 秒先まで」の音と光る場所だけを用意する。画面がかくれているときはタイマーがおそくなるので長めに */
const LOOK=1.2, LOOK_HIDDEN=4, TICK=250;
// withPickup：はじめからきくときは弱起のメロディーを先に（slot＝-1のあいだは弱起）。「このマスだけ」はマスだけ
function playRange(from,to,model=false,withPickup=false){
  stopPlay();
  const my=playToken, song=curSong(), key=curKey(), chs=model?song.slots.map(s=>s.ans):choices().slice();
  const spb=60/state.tempo, ac=PA.settings.sound?PA.audio():null, lead=0.3;
  // 時計：音が鳴っているときは音の時計（光る場所と音がずれない）。音がまだ出ないときはふつうの時計
  const useAc=!!ac&&ac.state==='running', clock=useAc?()=>ac.currentTime:()=>Date.now()/1000;
  const pk=withPickup&&from===0?song.pickupNotes:[], pre=sumBeats(pk);
  state.play={slot:pk.length?-1:from,note:0,model,from,to};
  // notes：{t(はじめからの秒), d, m, vel, mel}、marks：光る場所 {t, si, ni}。休みは鳴らさない（光る場所だけうごかす）
  const notes=[], marks=[];
  const mel=(si,ns,start)=>{
    let b=start;
    ns.forEach((n,ni)=>{
      if(!n.rest) notes.push({t:b*spb,d:n.beats*spb+0.3,m:noteAt(key,n.k).midi,vel:0.27,mel:true});
      marks.push({t:b*spb,si,ni});
      b+=n.beats;
    });
  };
  mel(-1,pk,0);
  for(let si=from;si<=to;si++){
    const sl=song.slots[si], rel=pre+(si-from)*song.slotBeats, ch=chs[si];
    if(ch) accEvents(key,ch,song.slotBeats,song.meter,firstBeat(song,si)-1).forEach(e=>e.ms.forEach(m=>notes.push({t:(rel+e.t)*spb,d:e.d*spb+0.35,m,vel:e.vel,mel:false})));
    mel(si,sl.notes,rel);
  }
  notes.sort((x,y)=>x.t-y.t);
  const total=(pre+(to-from+1)*song.slotBeats)*spb;
  const light=k=>()=>{if(my!==playToken||!state.play)return;const prev=state.play.slot;state.play.slot=k.si;state.play.note=k.ni;renderPlayback();if(k.si!==prev)followSlot(Math.max(k.si,0));};
  const finish=()=>{
    if(my!==playToken)return;
    state.play=null; playTimers=[];
    if(renderSafe()) return;
    // はやさをうごかしているとちゅう：スライダーはそのまま、がくふ・けんばん・ボタンだけもどす
    renderPlayback();
    const st=document.querySelector('[data-act="stop"]'); if(st) st.outerHTML=playBtnHTML(false);
    const bn=document.querySelector('.banner'); if(bn) bn.remove();
  };
  const t0=clock()+lead;
  let ni=0, mi=0;
  const tick=()=>{
    if(my!==playToken) return;
    const now=clock()-t0, until=now+(document.hidden?LOOK_HIDDEN:LOOK);
    // メロディー・伴奏のオン・オフは鳴らすときに見る（とちゅうでかえてもすぐきく）
    for(;ni<notes.length&&notes[ni].t<until;ni++){
      const n=notes[ni], when=n.t-now;
      if(!ac||when<-0.05) continue; // おくれすぎた音はとばす（画面がかくれていたなど）
      if(n.mel?state.melOn:state.accOn) PA.playNote(n.m,Math.max(0,when),n.d,n.vel);
    }
    for(;mi<marks.length&&marks[mi].t<until;mi++){
      const k=marks[mi];
      if(mi+1<marks.length&&marks[mi+1].t<=now) continue; // もうすぎた場所は光らせない（さいごの1つだけ）
      playTimers.push(setTimeout(light(k),Math.max(0,k.t-now)*1000));
    }
    if(ni>=notes.length&&mi>=marks.length){playTick=null;playTimers.push(setTimeout(finish,Math.max(0,total-now)*1000+300));return;}
    playTick=setTimeout(tick,TICK);
  };

}

    for(let i=0;i<items.length-1;i++){
      const a=items[i], b=items[i+1];
      if(!a.n.rest&&!b.n.rest&&a.n.beats===0.5&&b.n.beats===0.5&&Math.abs((a.mb!=null?a.mb:a.b)%1)<1e-9&&Math.abs(b.b-a.b-0.5)<1e-9&&b.si===a.si){a.beamWith=b;b.beamed=true;}
    }
    const head=(it)=>{
      let g='';
      if(it.playing) g+=`<circle cx="${it.x}" cy="${it.y}" r="14" fill="#ffd66b" opacity=".85"/>`;
      for(let q=28;q>=it.st;q-=2) g+=`<line x1="${it.x-11}" x2="${it.x+11}" y1="${ty(q)}" y2="${ty(q)}" stroke="#6b6273" stroke-width="1.4"/>`;
      for(let q=40;q<=it.st;q+=2) g+=`<line x1="${it.x-11}" x2="${it.x+11}" y1="${ty(q)}" y2="${ty(q)}" stroke="#6b6273" stroke-width="1.4"/>`;
      const hollow=it.n.beats>=2;
      g+=`<ellipse cx="${it.x}" cy="${it.y}" rx="6.4" ry="4.7" fill="${hollow?'#fff':it.color}" stroke="${it.color}" stroke-width="${hollow?2.4:1}" transform="rotate(-20 ${it.x} ${it.y})"/>`;
      if(it.n.beats===1.5||it.n.beats===3) g+=`<circle cx="${it.x+11}" cy="${it.st%2===0?it.y-4:it.y}" r="2.2" fill="${it.color}"/>`;
      return g;
    };
    items.forEach(it=>{
      if(it.n.rest){
        const rx=it.whole?it.wx:it.x;
        if(it.playing) s+=`<circle cx="${rx}" cy="${TB-20}" r="14" fill="#ffd66b" opacity=".85"/>`;
        s+=restSVG(rx,it.n.beats,TB,it.whole);
        return;
      }
      if(it.beamed) return; // 連桁の2つめは1つめといっしょに描く
      const {x,y,st,color,n}=it;
      s+=head(it);
      if(n.beats>=4) return;
      if(it.beamWith){
        const o=it.beamWith, up=(st+o.st)/2<34, ys=up?Math.min(y,o.y)-30:Math.max(y,o.y)+30, dx=up?6:-6;
        s+=head(o);
        s+=`<line x1="${x+dx}" x2="${x+dx}" y1="${y}" y2="${ys}" stroke="${color}" stroke-width="1.6"/>`;
        s+=`<line x1="${o.x+dx}" x2="${o.x+dx}" y1="${o.y}" y2="${ys}" stroke="${o.color}" stroke-width="1.6"/>`;
        s+=`<line x1="${x+dx}" x2="${o.x+dx}" y1="${ys}" y2="${ys}" stroke="#3a3245" stroke-width="5"/>`;
        return;
      }
      if(st<34){
        s+=`<line x1="${x+6}" x2="${x+6}" y1="${y}" y2="${y-32}" stroke="${color}" stroke-width="1.6"/>`;
        if(n.beats===0.5) s+=`<path d="M${x+6} ${y-32} q4 9 10 13 q-3 -6 -10 -7" fill="${color}" stroke="${color}" stroke-width="1.4"/>`;
      }else{
        s+=`<line x1="${x-6}" x2="${x-6}" y1="${y}" y2="${y+32}" stroke="${color}" stroke-width="1.6"/>`;
        if(n.beats===0.5) s+=`<path d="M${x-6} ${y+32} q4 -9 10 -13 q-3 6 -10 7" fill="${color}" stroke="${color}" stroke-width="1.4"/>`;
      }
    });
    return s;
  };
  let out='';
  for(let r=0;r*perRow<nMeasures;r++){
    let s=''; // 絵（読み上げではよまない）。マス（hits）はボタンとして読む
    const mCount=Math.min(perRow,nMeasures-r*perRow), X0=HW+(r===0?PW:0), endX=X0+mCount*MW;
    for(let i=0;i<5;i++) s+=`<line x1="6" x2="${endX}" y1="${TB-i*10}" y2="${TB-i*10}" stroke="#6b6273" stroke-width="1.2"/>`;
    s+=`<line x1="6" x2="6" y1="${TB-40}" y2="${TB}" stroke="#6b6273" stroke-width="1.2"/>`;
    s+=PA.gClef(10,TB-10);
    sig.letters.forEach((L,i)=>{s+=PA.accGlyph(50+i*10,ty(TS[i]),sig.type);});
    if(r===0){
      const tx=50+ns*10+12;
      s+=`<text x="${tx}" y="${TB-21}" text-anchor="middle" font-size="22" font-weight="800" fill="#3a3245" font-family="Georgia,serif">${song.meter}</text>`;
      s+=`<text x="${tx}" y="${TB-1}" text-anchor="middle" font-size="22" font-weight="800" fill="#3a3245" font-family="Georgia,serif">4</text>`;
      // 弱起：さいしょの小節線の前（和音のマス・小節の番号はなし）
      if(PW){
        let b=0;
        const items=song.pickupNotes.map((n,ni)=>{const it={si:-1,ni,n,b,mb:song.meter-song.pickupBeats+b,x:HW+PADL+b*BW+8,ch:null};b+=n.beats;return it;});
        s+=drawItems(items);
        s+=`<line x1="${X0}" x2="${X0}" y1="${TB-40}" y2="${TB}" stroke="#6b6273" stroke-width="1.2"/>`;
      }
    }
    const hits=[];
    for(let mi=0;mi<mCount;mi++){
      const m=r*perRow+mi, mx=X0+mi*MW, last=m===nMeasures-1, cw=(MW-12)/spm;
      s+=`<line x1="${mx+MW}" x2="${mx+MW}" y1="${TB-40}" y2="${TB}" stroke="#6b6273" stroke-width="1.2"/>`;
      if(last) s+=`<line x1="${mx+MW+4}" x2="${mx+MW+4}" y1="${TB-40}" y2="${TB}" stroke="#3a3245" stroke-width="4"/>`;
      if(!P){
        for(let k=0;k<spm;k++) if(state.sel===m*spm+k) s+=`<rect x="${mx+6+k*cw}" y="${TB-56}" width="${cw}" height="94" rx="10" fill="#fff6d6"/>`;
      }
      const items=[];
      for(let k=0;k<spm;k++){
        const si=m*spm+k, sl=song.slots[si];
        let b=k*song.slotBeats;
        sl.notes.forEach((n,ni)=>{
          // 1小節まるごとの休みは全休符をまん中に
          const whole=n.rest&&b===0&&n.beats===song.meter;
          items.push({si,ni,n,b,x:mx+PADL+b*BW+8,ch:showChs[si],whole,wx:mx+MW/2});b+=n.beats;
        });
      }
      s+=drawItems(items);
      // 小節の番号（1拍目の音に上の加線があるときはその上に）
      const f0=items[0], numY=f0&&!f0.n.rest&&f0.b===0&&f0.st>=40?Math.min(TB-48,f0.y-10):TB-48;
      s+=`<text x="${mx+3}" y="${numY}" font-size="${big?13:10}" fill="#a99f93">${m+1}</text>`;
      // 和音のマス
      for(let k=0;k<spm;k++){
        const si=m*spm+k, ch=showChs[si], sl=song.slots[si];
        const cx=mx+6+k*cw, cy=TB+40;
        const isSel=state.sel===si&&!P, playing=P&&P.slot===si;
        const g=state.checked&&!modelShown?grade(sl,ch):null;
        s+=`<rect x="${cx+2}" y="${cy}" width="${cw-4}" height="${CHH}" rx="10" fill="${ch?LCOL[ch]:'#f4efe8'}" stroke="${playing?'#e9a800':isSel?'#3a3245':ch?COL[ch]:'#cfc4b6'}" stroke-width="${playing||isSel?3.5:2}" ${ch?'':'stroke-dasharray="5 4"'}/>`;
        s+=`<text x="${cx+cw/2}" y="${cy+CHH/2+CFS*0.36}" text-anchor="middle" font-size="${CFS}" font-weight="800" fill="${ch?COL[ch]:'#b3a99c'}">${ch?CHORDS[ch].label:'？'}</text>`;
        if(g){
          const gc=g==='bad'?'#d1495b':'#22a06b', gt=g==='best'?'◎':g==='good'?'○':'×', rr=big?12:10;
          s+=`<circle cx="${cx+cw-8}" cy="${cy+2}" r="${rr}" fill="${gc}" pointer-events="none"/><text x="${cx+cw-8}" y="${cy+2+rr*0.45}" text-anchor="middle" font-size="${big?15:13}" font-weight="800" fill="#fff">${gt}</text>`;
        }
        let under=ch?PA.Svg(chordSym(key,ch)):'', uc='#a99f93';
        if(state.checked&&!modelShown){
          if(!ch){under='まだ';uc='#b3a99c';}
          else if(g==='bad'&&state.reveal){under='→ '+CHORDS[sl.ans].label;uc='#d1495b';}
        }
        if(under) s+=`<text x="${cx+cw/2}" y="${cy+CHH+UFS+5}" text-anchor="middle" font-size="${UFS}" font-weight="700" fill="${uc}">${under}</text>`;
        // キーボード：えらんでいるマスだけ Tab で来る（←→ でとなりへ）
        hits.push(`<rect class="hit" data-slot="${si}" role="button" tabindex="${si===state.sel?0:-1}" ${si===state.sel?'aria-current="true"':''} aria-label="${PA.esc(slotAria(song,si,ch,g,modelShown))}" x="${cx}" y="${TB-56}" width="${cw}" height="${cy+CHH-(TB-56)}" fill="transparent"/>`);
      }
    }
    out+=`<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="がくふ${r*perRow+1}小節目から"><g aria-hidden="true">${s}</g>${hits.join('')}</svg>`;
  }
  return out;
}

/* ===== けんばんの印 ===== */
// 黄色＝メロディー、こい色＝ベース、うすい色＝左手の和音
function kbMarks(){
  const song=curSong(), key=curKey(), chs=choices(), P=state.play, marks=new Map(), inPick=!!P&&P.slot<0;
  const showSlot=P?Math.max(P.slot,0):state.sel;
  let showCh=P?(P.model?(state.reveal?song.slots[showSlot].ans:null):chs[showSlot]):chs[showSlot];
  if(P&&(!state.accOn||inPick)) showCh=null; // 弱起には和音がない
  const black=m=>PA.BLACK.has(PA.mod(m,12));
  if(showCh){
    const v=voicing(key,showCh), c=COL[showCh];
    v.chord.forEach(n=>marks.set(n.midi,black(n.midi)?{fill:c,light:true,label:PA.nm(n),tc:'#fff',focus:true}:{fill:LCOL[showCh],label:PA.nm(n),tc:c,focus:true}));
    // ベースは左にはなれているので focus に入れない（和音とメロディーがいっしょに見えるように）
    marks.set(v.bass.midi,{fill:c,label:PA.nm(v.bass),sub:'ベース',subColor:c});
  }
  const melNotes=sounding((P?[(inPick?song.pickupNotes:song.slots[P.slot].notes)[P.note]]:song.slots[showSlot].notes).filter(Boolean)); // 休みのあいだはメロディーの印なし
  melNotes.forEach(n=>{
    const nt=noteAt(key,n.k), had=marks.get(nt.midi);
    if(had&&had.pick) return;
    const mk={fill:black(nt.midi)?'#e9a800':'#ffd66b',bubble:'#ffd66b',tc:'#3a3245',label:PA.nm(nt),focus:true,pick:true}; // 黒鍵のメロディーはこい黄色の鍵＋うすい黄色のふきだし
    if(had) mk.ring=COL[showCh];
    marks.set(nt.midi,mk);
  });
  return marks;
}
// けんばんの右はし：ふつうは84（高いド）。曲のメロディーがもっと高い調ではその音まで（白鍵でおわる）
function kbHi(){
  const s=curSong(), k=curKey(); let hi=84;
  [...s.pickupNotes,...s.slots.flatMap(x=>x.notes)].forEach(n=>{if(!n.rest) hi=Math.max(hi,noteAt(k,n.k).midi);});
  if(PA.BLACK.has(PA.mod(hi,12))) hi++;
  return hi;
}
const kbHTML=()=>PA.kbSVG(36,kbHi(),kbMarks());

function fitTableHTML(song,key,si,cur){
  const sl=song.slots[si], sn=sounding(sl.notes), notes=sn.map(n=>noteAt(key,n.k)), total=sumBeats(sn); // 休みは表に入れない
  // 「あう拍」は和音の名前のすぐ右（せまい画面でも見えるように）
  let h=`<table class="fit"><thead><tr><th class="blank"></th><th class="blank cnth">あう拍<br>（${beatsJa(total)}中）</th>`+
    notes.map((n,i)=>`<th class="${i===0?'first':''}">${PA.nmH(n)}<small>${i===0?`${strongBeatJa(song,si)}・`:''}${beatsJa(sn[i].beats)}</small></th>`).join('')+`</tr></thead><tbody>`;
  CH_KEYS.forEach(ch=>{
    const set=CH_DEGS[ch], f=fitInfo(sl,ch);
    h+=`<tr class="${cur===ch?'chosen':''}" style="--c:${COL[ch]};--l:${LCOL[ch]}"><th>${CHORDS[ch].label}<small>${chordTones(key,ch).map(n=>`<span class="nw">${PA.nmH(n)}</span>`).join('・')}</small></th><td class="cnt">${f.inBeats?beatsJa(f.inBeats):'0拍'}</td>`+
      sn.map(n=>set.includes(n.deg)?`<td class="y">○</td>`:`<td class="n">×</td>`).join('')+`</tr>`;
  });
  return h+`</tbody></table>`;
}
function feedbackHTML(song,key,chs){
  const gs=song.slots.map((sl,i)=>grade(sl,chs[i]));
  const best=gs.filter(g=>g==='best').length, good=gs.filter(g=>g==='good').length, bad=gs.filter(g=>g==='bad').length, empty=gs.filter(g=>!g).length;
  const items=[];
  song.slots.forEach((sl,i)=>{
    if(gs[i]==='bad') items.push(`<b>${whereLabel(song,i)}</b>：${whyBad(key,song,i,chs[i])}${state.reveal?`。おてほんは<b>${CHORDS[sl.ans].label}</b>`:''}`);
  });
  song.slots.forEach((sl,i)=>{
    if(gs[i]==='good') items.push(`<b>${whereLabel(song,i)}</b>：${CHORDS[chs[i]].label}でも合うよ${state.reveal?`（おてほんは${CHORDS[sl.ans].label}）`:''}`);
  });
  const allOk=!bad&&!empty;
  let h=`<div class="fb ${allOk?'good':'bad'}" role="status">`;
  h+=allOk?`🎉 ぜんぶ合っているよ！（◎ ${best}・○ ${good}）「▶️ はじめから」で自分の伴奏をきいてみよう。`
          :`◎ ${best}　○ ${good}　× ${bad}${empty?`　まだ${empty}マス`:''}　<span style="font-size:14px">（×のマスをなおすと、その場で ◎○ にかわるよ）</span>`;
  h+=`<div class="legend">◎＝おてほんとおなじ　○＝これでも合う　×＝合わない</div>`;
  if(items.length){
    h+=`<ul>${items.slice(0,8).map(x=>`<li>${x}</li>`).join('')}`;
    if(items.length>8) h+=`<li>ほかに${items.length-8}こ（がくふの ◎○× を見てね）</li>`;
    h+=`</ul>`;
  }
  return h+`</div>`;
}

        ${playBtnHTML(!!P)}
      </div>
      <div class="palette ${state.autoNext?'':'wnext'}">`+CH_KEYS.map((c,i)=>`<button class="cbtn ${cur===c?'on':''}" style="--c:${COL[c]};--l:${LCOL[c]}" data-act="pick" data-v="${c}" aria-pressed="${cur===c}" aria-label="${CHORDS[c].label}（キー${[1,4,5,7][i]}）"><span class="num">${CHORDS[c].label}</span><span class="nm">${namesH(chordTones(key,c))}</span><span class="sym">${PA.H(chordSym(key,c))}</span></button>`).join('')+
      `<button class="cbtn clear" data-act="pick" data-v="" aria-label="けす"><span class="num">？</span><span class="nm">けす</span></button>`+
      (state.autoNext?'':`<button class="cbtn go" data-act="next" aria-label="つぎのマスへ" ${si<N-1?'':'aria-disabled="true"'}><span class="num">➡</span><span class="nm"><span class="gs">つぎへ</span><span class="gl">つぎの<br>マスへ</span></span></button>`)+`</div>
    </div>`;
  const mi=PA.nmH(noteAt(key,2)), la=PA.nmH(noteAt(key,5)), re_si=namesH([noteAt(key,1),noteAt(key,6)]), shared=namesH([noteAt(key,0),noteAt(key,3),noteAt(key,4)]);
  h+=`<details class="more tips" ${state.tipsOpen?'open':''}><summary>💡 伴奏づけのコツ</summary><p class="note" style="margin:0 0 6px">${PA.keyName(key)}の音名で書いているよ</p><ol>
    <li>マスの<b>はじめの音</b>と<b>長い音</b>を見る。</li>
    <li>その音が入っている和音（Ⅰ・Ⅳ・Ⅴ7）をえらぶ。なかま表の「あう拍」が多いほど合いやすい。</li>
    <li><b>${mi}</b>が長く鳴ればⅠ、<b>${la}</b>ならⅣ、<b>${re_si}</b>ならⅤ7。<b>${shared}</b>は2つの和音に入っているので、ほかの音できめよう。</li>
    <li>曲の<b>はじめ</b>と<b>さいご</b>はⅠ。さいごの前はⅤ7が多いよ。</li>
    <li>えらんだらきいてみよう。にごってきこえたら、べつの和音をためそう。</li></ol>
    <p class="note">※ キーボードでも操作できます：1＝Ⅰ、4＝Ⅳ、5＝Ⅴ、7＝Ⅴ7、←→＝マスの移動、Delete＝けす、Ctrl（⌘）＋Z＝ひとつもどす、スペース＝再生／停止、Enter＝こたえあわせ。<br>※ 曲はどれも古くから歌われている曲や、作曲者が亡くなって長い年月がたった曲のメロディーです。</p></details>`;
  return h+`</div>`;
}

let lastCenterKey='', rendering=false;
// えらんだマスのメロディーがけんばんの外ならまん中へ（見えていれば動かさない）
function centerKb(){
  const box=document.querySelector('[data-sk="kb"]');
  if(!box||box.scrollWidth<=box.clientWidth) return;
  const keys=[...box.querySelectorAll('[data-focus]')]; if(!keys.length) return;
  const br=box.getBoundingClientRect();
  const L=Math.min(...keys.map(r=>r.getBoundingClientRect().left)), R=Math.max(...keys.map(r=>r.getBoundingClientRect().right));
  if(L>=br.left&&R<=br.right) return;
  box.scrollLeft+=(L+R)/2-(br.left+br.right)/2;
}
function render(){
  const viewEl=document.getElementById('view');
  deferRender=false;
  const ae=document.activeElement, focusId=ae&&ae.id, fa=ae&&ae.dataset?ae.dataset.act:null, wasBtn=!!ae&&ae.tagName==='BUTTON';
  const wasSlot=!!ae&&!!ae.getAttribute&&ae.getAttribute('data-slot')!=null;
  try{
    PA.paint(viewEl,view(),state.songId+':'+state.keyIdx);
  }catch(err){
    console.error(err);
    if(rendering) throw err;
    rendering=true;
    PA.store.set(STORE,null);
    state.choices={}; state.sel=0; state.checked=false; state.reveal=false; stopPlay();
    try{render();}finally{rendering=false;} return;
  }
  // フォーカスをもどす（チェックボックス・スライダー、再生⇔停止、こたえを見る→こたえあわせ）
  const lost=document.activeElement===document.body||document.activeElement==null||!document.contains(document.activeElement);
  if(lost){
    if(focusId&&document.getElementById(focusId)) document.getElementById(focusId).focus({preventScroll:true});
    else if(wasSlot){ // がくふのマス：えらんでいるマスへ（←→ でフォーカスもいっしょにうごく）
      const el=viewEl.querySelector(`[data-sk="score"] [data-slot="${state.sel}"]`);
      if(el) el.focus({preventScroll:true});
    }
    else if(wasBtn&&fa){
      const act=fa==='stop'?'playall':fa==='playall'?'stop':fa==='reveal'?'check':fa;
      const el=viewEl.querySelector(`[data-act="${act}"]`);
      if(el) el.focus({preventScroll:true});
    }
  }
  const ck=state.songId+'|'+state.sel+'|'+state.keyIdx;
  if(!state.play&&ck!==lastCenterKey){lastCenterKey=ck;centerKb();}
}
// 再生中は、がくふとけんばんだけを書きかえる（ボタンやスライダーはそのまま）
function renderPlayback(){
  const sb=document.querySelector('[data-sk="score"]'), kb=document.querySelector('[data-sk="kb"]');
  if(!sb||!kb) return render();
  const l=kb.scrollLeft, ae=document.activeElement;
  const hadSlot=!!ae&&!!ae.getAttribute&&ae.getAttribute('data-slot')!=null&&sb.contains(ae);
  const html=scoreRows();
  if(!patchScore(sb,html)){
    sb.innerHTML=html;
    if(hadSlot){const el=sb.querySelector(`[data-slot="${state.sel}"]`);if(el)el.focus({preventScroll:true});} // キーボードでいたマスをわすれない
  }
  kb.innerHTML=kbHTML();
  kb.scrollLeft=l;
}
// がくふの絵だけを入れかえ、マス（data-slot）は同じものをのこして中みだけなおす
// （キーボードや読み上げでマスにいる人のフォーカスが音ごとにとんだり、読みなおされたりしないように）。形がちがえば false
function patchScore(sb,html){
  const t=document.createElement('div'); t.innerHTML=html;
  const A=sb.children, B=t.children;
  if(A.length!==B.length) return false;
  for(let i=0;i<A.length;i++){
    if(A[i].children.length!==B[i].children.length||A[i].getAttribute('viewBox')!==B[i].getAttribute('viewBox')) return false;
  }
  const sync=(o,n)=>{
    [...o.attributes].forEach(x=>{if(!n.hasAttribute(x.name))o.removeAttribute(x.name);});
    [...n.attributes].forEach(x=>{if(o.getAttribute(x.name)!==x.value)o.setAttribute(x.name,x.value);});
  };
  for(let i=0;i<A.length;i++){
    const o=A[i], n=B[i], oc=[...o.children], nc=[...n.children];
    sync(o,n);
    o.replaceChild(nc[0],oc[0]); // 音符などの絵（aria-hidden の g）
    for(let j=1;j<oc.length;j++) sync(oc[j],nc[j]);
  }
  return true;
}
// 再生中、光っているマスが画面の外（上のバーや下のパレットのうら）に出たら見える所へ。がくふを見ていないときは動かさない
function followSlot(si){
  const box=document.querySelector('[data-sk="score"]'), r=box&&box.querySelector(`[data-slot="${si}"]`); if(!r) return;
  const pb=document.querySelector('.palbar'), top=70, bot=window.innerHeight-(pb&&pb.offsetHeight?pb.offsetHeight+10:170), bb=box.getBoundingClientRect();
  if(bb.bottom<top||bb.top>bot) return;
  const b=r.getBoundingClientRect();
  if(b.top<top||b.bottom>bot){try{r.scrollIntoView({block:'center',inline:'nearest',behavior:PA.reduceMotion()?'auto':'smooth'});}catch(e){}}
}
// はやさのスライダーをゆびでうごかしている間はぜんたいを書きかえない（つまみがはなれないように）。はなしたら書きかえる
let tempoDrag=false, deferRender=false;
function renderSafe(){if(tempoDrag){deferRender=true;return false;}render();return true;}
function scrollSelIntoView(){
  const el=document.querySelector(`[data-sk="score"] [data-slot="${state.sel}"]`);
  if(!el) return;
  try{el.scrollIntoView({block:'nearest',inline:'nearest',behavior:PA.reduceMotion()?'auto':'smooth'});}catch(e){}
}

/* ===== 操作 ===== */
/* ↩ ひとつもどす：曲ごとのかえたきろく（このページをひらいているあいだだけ）
 * {si, prev}＝1つのマスをかえた、{all, sel}＝🧽 ぜんぶけした */
const hist={}, HIST_MAX=60;
const histOf=id=>hist[id]||(hist[id]=[]);
const canUndo=()=>histOf(state.songId).length>0;
function pushHist(e){const h=histOf(state.songId);h.push(e);if(h.length>HIST_MAX)h.shift();}
function undo(){
  const e=histOf(state.songId).pop(); if(!e) return;
  stopPlay();
  const song=curSong(), chs=choices();
  if(e.all){e.all.forEach((c,i)=>{chs[i]=c;});state.sel=e.sel;announce('けした和音をもとにもどしたよ');}
  else{chs[e.si]=e.prev;state.sel=e.si;announce(`${whereLabel(song,e.si)}を${e.prev?CHORDS[e.prev].label:'まだえらんでいない'}にもどしたよ`);}
  save(); render(); scrollSelIntoView();
  if(state.autoPlay&&chs[state.sel]) playChordNow(curKey(),chs[state.sel]);
}
function pick(ch){
  const song=curSong(), chs=choices();
  stopPlay();
  const si=state.sel, prev=chs[si];
  if((ch||null)!==prev) pushHist({si,prev});
  chs[si]=ch||null; save();
  if(ch&&state.autoNext&&state.sel<song.slots.length-1) state.sel++;
  if(ch&&state.autoPlay&&PA.settings.sound) playRange(si,si); else render();
  scrollSelIntoView();
}
// となりのマスへ（←→・「➡ つぎのマスへ」）
function moveSel(d){
  const song=curSong(), to=Math.max(0,Math.min(song.slots.length-1,state.sel+d));
  if(state.play) stopPlay();
  if(to===state.sel){render();return;}
  state.sel=to; render(); scrollSelIntoView();
}
// マスをえらぶ（タップ・キーボードの Enter）
function selectSlot(si){
  if(state.play) stopPlay();
  state.sel=si; render();
  const ch=choices()[state.sel];
  if(ch) playChordNow(curKey(),ch);
}
let clearTimer=null;
// マウス・指でマスをおしたときはマスにフォーカスをうつさず、さっきおしたボタンからもはずす
// （そのあとのスペースが和音ボタンなどをおしてしまわず、これまでどおり再生／停止になるように）
document.addEventListener('mousedown',e=>{
  if(!(e.target.closest&&e.target.closest('[data-slot]'))) return;
  e.preventDefault();
  const ae=document.activeElement; if(ae&&ae!==document.body&&ae.blur) ae.blur();
});
document.addEventListener('click',e=>{
  const hit=e.target.closest('[data-slot]');
  if(hit){selectSlot(+hit.dataset.slot);return;}
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v;
  if(a!=='clear'&&state.clearArm){state.clearArm=false;clearTimeout(clearTimer);}
  switch(a){
    case 'song': if(v===state.songId) break; stopPlay(); state.songId=v; state.randKey=null; state.sel=0; state.checked=false; state.reveal=false; save(); break;
    case 'pick': pick(v); return;
    case 'undo': if(canUndo()) undo(); return;
    case 'next': moveSel(1); return;
    case 'randkey': randomKey(); return;
    case 'randtier': if(v===state.randTier||!PA.keyDeck.TIERS.some(t=>t.id===v)) break; state.randTier=v; state.randSeen=[]; state.diceUsed=true; randDeck().setOptions({tier:v}); save(); break;
    case 'playall': playRange(0,curSong().slots.length-1,false,true); return;
    case 'playsel': playRange(state.sel,state.sel); return;
    case 'stop': stopPlay(); break;
    case 'model': playRange(0,curSong().slots.length-1,true,true); return;
    case 'check': stopPlay(); state.checked=true; break;
    case 'reveal': state.reveal=true; break;
    case 'style': state.style=v; save(); break;
    case 'clear':
      if(!state.clearArm){state.clearArm=true;clearTimeout(clearTimer);clearTimer=setTimeout(()=>{
        state.clearArm=false;
        if(renderSafe()) return;
        const b=document.querySelector('[data-act="clear"]'); if(b){b.classList.remove('warn');b.textContent='🧽 ぜんぶけす';}
      },3000);break;}
      clearTimeout(clearTimer); state.clearArm=false; stopPlay();
      if(choices().some(Boolean)) pushHist({all:choices().slice(),sel:state.sel});
      state.choices[curSong().id]=Array(curSong().slots.length).fill(null); state.sel=0; state.checked=false; state.reveal=false; save(); break;
    default: return;
  }
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(['melOn','accOn','hint','autoPlay','autoNext'].includes(t.id)){state[t.id]=t.checked;save();render();}
  else if(t.id==='tempo'){state.tempo=+t.value;save();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='tempo'){state.tempo=+e.target.value;save();const tv=document.getElementById('tempoVal');if(tv)tv.textContent=state.tempo;}
});
const tempoDown=e=>{if(e.target&&e.target.id==='tempo')tempoDrag=true;};
document.addEventListener('pointerdown',tempoDown);
if(!window.PointerEvent){ // iOS 12の Safari など：Pointer Events がないのでタッチ・マウスで
  document.addEventListener('touchstart',tempoDown,{passive:true});
  document.addEventListener('mousedown',tempoDown);
}
function endTempoDrag(){
  if(!tempoDrag) return;
  tempoDrag=false;
  if(deferRender) setTimeout(()=>{if(tempoDrag||!deferRender)return;deferRender=false;render();},0); // change のあとで
}
document.addEventListener('pointerup',endTempoDrag);
if(!window.PointerEvent){document.addEventListener('touchend',endTempoDrag);document.addEventListener('touchcancel',endTempoDrag);document.addEventListener('mouseup',endTempoDrag);}
document.addEventListener('pointercancel',()=>{
  endTempoDrag();
});
// コツのひらき方をおぼえておく（toggle は上につたわらないので capture で）
document.addEventListener('toggle',e=>{if(e.target&&e.target.matches&&e.target.matches('details.tips'))state.tipsOpen=e.target.open;},true);
document.addEventListener('keydown',e=>{
  if(e.isComposing) return;
  if(e.target.closest&&e.target.closest('input,select,textarea,dialog')) return;
  if(document.querySelector('dialog[open]')) return; // 調やせっていのシートがひらいているときは何もしない
  // Ctrl（⌘）＋Z：ひとつもどす
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&!e.shiftKey&&(e.key==='z'||e.key==='Z')){if(canUndo())undo();e.preventDefault();return;}
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const song=curSong(), map={'1':'I','4':'IV','5':'V','7':'V7'};
  if(e.repeat&&(map[e.key]||e.key===' '||e.key==='Delete'||e.key==='Backspace')){e.preventDefault();return;}
  // がくふのマスにフォーカス：Enter でそのマスをえらぶ（スペースはほかとおなじ再生／停止）
  const hs=e.target.closest&&e.target.closest('[data-slot]');
  if(hs&&e.key==='Enter'){selectSlot(+hs.dataset.slot);e.preventDefault();return;}
  if(map[e.key]){pick(map[e.key]);e.preventDefault();}
  else if(e.key==='ArrowRight'){moveSel(1);e.preventDefault();}
  else if(e.key==='ArrowLeft'){moveSel(-1);e.preventDefault();}
  else if(e.key==='Delete'||e.key==='Backspace'){pick('');e.preventDefault();}
  else if(e.key===' '&&(hs||!(e.target.closest&&e.target.closest('button,summary,a,[role="button"]')))){state.play?(stopPlay(),render()):playRange(0,song.slots.length-1,false,true);e.preventDefault();}
});
// 画面の幅で1行の小節数（4か2）がかわったら書きなおす
let resizeTimer=null;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(perRowNow(curSong(),curKey())!==lastPerRow) state.play?renderPlayback():render();},120);});

PA.mountBar({title:'伴奏づけ',app:'accompaniment'});
let lastPitch=PA.settings.pitchA;
PA.onSettings=()=>{
  // 音を消した・基準の音をかえたときは再生をとめる（鳴っている音と表示をそろえる）
  if(state.play&&(!PA.settings.sound||PA.settings.pitchA!==lastPitch)) stopPlay();
  lastPitch=PA.settings.pitchA;
  render();
};
PA.onStopDown=()=>stopPlay(); // 描きなおしは click 側で（ボタンが入れかわって再生し直さないように）
// ⏹ をおしてそのままスクロールした・指がずれた（click が来ない）：音はもう止まっているので画面をもどす
PA.onStopCancel=()=>render();
PA.onKeySheet=()=>PA.openKeySheet({minor:false,both:false,idx:state.keyIdx,onPick:(minor,idx)=>{
  stopPlay(); state.keyIdx=idx; state.randKey=null; save(); render(); playChordNow(curKey(),'I');
}});
load(); applyLink(); render();
</script>
