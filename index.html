<style>
/* 入口は「ぼうけんの地図」：基本の島①〜⑥（🐸＝いまやっている島）・耳のひろば（きらきらのカード）・レベルアップの地図（とじておく、しずかな色） */
.home h2{margin:0;font-size:17px;line-height:1.35}
.home h2 small{display:block;font-weight:400;color:var(--sub);font-size:13px;margin-top:2px}
/* はじめての人：ぼうけんへのさそい */
.hero{text-align:center;padding:18px 16px;background:linear-gradient(160deg,#e3f2ff 0%,#fff6dc 70%)}
.hero .big{font-size:44px;line-height:1;letter-spacing:4px}
.hero h2{font-size:22px;margin-top:8px;word-break:keep-all;overflow-wrap:anywhere}
.hero .lead{color:var(--ink);font-size:16px;margin:6px 0 12px;word-break:keep-all;overflow-wrap:anywhere}
.hero .btn{display:flex;width:100%;min-height:56px;font-size:18px;background:#ffd66b;color:var(--ink);box-shadow:0 3px 0 #e0a92a}
.hero .btn svg.ic{width:1.1em;height:1.1em}
.hero .site{margin:12px 0 0;color:var(--sub);font-size:13px;line-height:1.6;text-align:left}
/* つづきから（明るい黄色）＋にがて */
.go{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 14px;border-radius:18px;background:linear-gradient(135deg,#ffe07a,#ffb547);color:var(--ink);text-decoration:none;box-shadow:0 3px 0 #e0a92a}
.go .ic{flex:none;width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px}
.go .tx{flex:1;min-width:0}
.go b{display:block;font-size:18px;line-height:1.3}
.go .meta{display:block;font-size:13px;line-height:1.45}
.go .eye{display:block;font-size:12.5px;font-weight:800;line-height:1.3}
.go .eye svg.ic{display:inline-block;width:1.1em;height:1.1em;background:none;border-radius:0;font-size:inherit;margin-right:3px;vertical-align:-.2em}
.go::after{content:"›";flex:none;font-size:30px;font-weight:800}
.weakrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.weakrow .wl{flex-basis:100%;font-size:13px;font-weight:800;color:var(--sub)}
.weakrow .wl svg.ic{width:1.15em;height:1.15em;margin-right:4px;vertical-align:-.22em}
#view .weakrow a{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:4px 12px;border-radius:999px;background:var(--soft2);color:var(--ink);text-decoration:none;font-size:14px;font-weight:700;border:2px solid var(--line)}
.weakrow a small{font-weight:400;color:var(--sub);font-size:12px}
/* 耳のひろば：夜空のきらきら。白い字は いちばん明るいところ（#8a2f6e）でも7:1いじょう */
.plaza{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#2a1b5e 0%,#5b2a86 55%,#8a2f6e 100%);box-shadow:0 3px 0 #1d1240,0 8px 22px rgba(60,20,90,.25)}
.plaza::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.75;
  background:radial-gradient(circle,rgba(255,236,160,.95) 0 1.3px,transparent 2px) 12px 10px/46px 38px,radial-gradient(circle,rgba(255,255,255,.75) 0 1px,transparent 1.6px) 30px 24px/58px 44px}
.plaza>*{position:relative}
.plaza h2{color:#fff;font-size:20px}
.plaza h2 small{color:#f3e8ff;font-size:13px}
.plaza .spark{position:absolute;top:10px;right:14px;font-size:28px;line-height:1}
@media (prefers-reduced-motion:no-preference){
  .plaza .spark{animation:twinkle 2.8s ease-in-out infinite}
  @keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(1.18) rotate(12deg);opacity:.8}}
}
#view .plaza a.today{display:flex;align-items:center;gap:12px;min-height:64px;margin-top:10px;padding:8px 14px;border-radius:18px;background:linear-gradient(135deg,#ffe58a,#ffc94d);color:var(--ink);text-decoration:none;box-shadow:0 3px 0 #c9962a}
.today .ic{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px}
.today .tx{flex:1;min-width:0}
.today b{display:block;font-size:19px;line-height:1.3}
.today small{display:block;font-size:13px;line-height:1.4;font-weight:700}
.today::after{content:"›";flex:none;font-size:30px;font-weight:800}
.plaza .ways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
#view .plaza .ways a{display:flex;align-items:center;gap:6px;min-height:52px;padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.5);color:#fff;text-decoration:none;font-size:14.5px;font-weight:800;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
#view .plaza .ways a.wide{grid-column:1/-1}
#view .plaza .ways a small{display:block;font-size:12px;font-weight:700;color:#f3e8ff}
@media (hover:hover){#view .plaza .ways a:hover{background:rgba(255,255,255,.22)}#view .plaza a.today:hover{filter:brightness(1.04)}}
.plaza a:focus-visible{outline:3px solid #ffd66b;outline-offset:2px}
.recs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.recs li{font-size:13px;font-weight:700;line-height:1.4;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff}
.recs.none li{background:none;padding:0;font-weight:400;color:#f3e8ff}
/* ぼうけんの地図 */
.map{background:#fff radial-gradient(circle,#efe6d8 1.2px,transparent 1.6px) 0 0/18px 18px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0 0;font-size:12.5px;color:var(--sub)}
.legend b{color:#a35f00;font-weight:400;letter-spacing:1px}
.trail{margin-top:10px}
.trail .start{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:2px 12px;border-radius:999px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:800}
details.stage{position:relative}
/* 島と島をつなぐ点線（島の列のまん中） */
details.stage::before{content:"";position:absolute;top:0;bottom:0;left:28px;border-left:4px dashed #d6c6b0;z-index:0}
details.stage.r::before{left:auto;right:28px}
details.stage>summary{position:relative;z-index:1;display:flex;align-items:center;gap:10px;min-height:84px;padding:10px 0;cursor:pointer;list-style:none;border-radius:16px}
details.stage>summary::-webkit-details-marker,details.xmap>summary::-webkit-details-marker{display:none}
details.stage>summary:focus-visible,details.xmap>summary:focus-visible,.foot>summary:focus-visible{outline:3px solid var(--c5);outline-offset:2px}
details.stage.r>summary{flex-direction:row-reverse}
details.stage.here>summary{padding-top:22px}
.isle{flex:none;position:relative;width:60px;height:60px;border-radius:50%;background:var(--l);border:4px solid var(--c);display:grid;place-items:center;font-size:28px;line-height:1;box-shadow:0 4px 0 rgba(58,50,69,.16)}
.stage.here .isle::after,.goal.here .isle::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px dashed var(--c)}
.isle .frog{position:absolute;top:-24px;right:-14px;font-size:30px;line-height:1}
.isle .ok{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;font-size:14px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
@media (prefers-reduced-motion:no-preference){
  .isle .frog{animation:hop 2.4s ease-in-out infinite}
  @keyframes hop{0%,62%,100%{transform:translateY(0)}70%{transform:translateY(-8px)}78%{transform:translateY(0)}84%{transform:translateY(-3px)}90%{transform:translateY(0)}}
}
.sign{flex:1;min-width:0;position:relative;background:#fff;border:2px solid var(--l);border-radius:16px;padding:8px 30px 8px 12px;box-shadow:0 2px 0 var(--line)}
.sign::after{content:"▾";position:absolute;right:10px;top:9px;color:var(--sub);font-size:14px;transition:transform .15s}
details.stage[open] .sign::after{transform:rotate(180deg)}
.sign b{font-size:16px;line-height:1.35}
.sign .num{margin-right:2px}
.sign small{display:block;color:var(--sub);font-size:12.5px;line-height:1.4}
.sign .tag{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:800;padding:0 8px;border-radius:999px;vertical-align:2px;line-height:1.6;white-space:nowrap}
.sign .tag.now{background:var(--ink);color:#fff}
.sign .tag.clear{background:var(--ok);color:#fff}
/* ほし：★（ぬった）は #a35f00、☆ は #a08c70（白の上でどちらも3:1いじょう。読み上げは aria-label で） */
.stars{display:inline-block;font-size:15px;line-height:1.2;letter-spacing:1px;color:#a08c70;white-space:nowrap}
.stars .on{color:#a35f00}
.sign .ssum{display:block;margin-top:2px;font-size:13px;font-weight:800;color:#a35f00}
.stage.here .sign{border-color:var(--c);box-shadow:0 3px 0 var(--c)}
@media (hover:hover){details.stage>summary:hover .sign{background:var(--soft2)}}
/* 島をあけたときのページ（クイズ・耳はその色で） */
.alist{position:relative;z-index:1;list-style:none;margin:2px 0 10px;padding:6px;display:flex;flex-direction:column;gap:4px;background:#fff;border-radius:16px;border:2px solid var(--l);border-top:5px solid var(--c);box-shadow:0 2px 0 var(--line)}
#view li a.arow{display:flex;margin:0;align-items:center;gap:10px;min-height:56px;padding:6px 8px;border-radius:12px;color:var(--ink);text-decoration:none}
@media (hover:hover){#view li a.arow:hover{background:var(--soft2)}}
.arow .ic{flex:none;width:38px;height:38px;border-radius:50%;background:var(--soft2);display:grid;place-items:center;font-size:20px}
.arow .tx{flex:1;min-width:0;line-height:1.35}
.arow .tx b{font-size:15.5px}
.arow .d{display:block;color:var(--sub);font-size:12.5px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .st{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;font-weight:700;white-space:nowrap}
.arow .kd{color:var(--ink);font-size:12px}
#view li a.arow.game{background:var(--tl);border:2px solid var(--tc)}
#view li a.arow.game .ic{background:#fff;border:2px solid var(--tc)}
@media (hover:hover){#view li a.arow.game:hover{filter:brightness(.98)}}
.arow .ty{display:inline-block;margin-right:6px;font-size:11.5px;font-weight:800;padding:0 7px;border-radius:999px;background:var(--td);color:#fff;line-height:1.6;vertical-align:1px}
/* ゴール */
.goal{display:flex;align-items:center;gap:10px;min-height:84px;padding:10px 0 2px}
.goal.r{flex-direction:row-reverse}
.goal.here{padding-top:22px}
.goal .isle{--c:#c97a00;--l:#fff1cc}
.goal .sign{padding-right:12px;border-color:#fff1cc}
.goal .sign::after{content:none}
/* 島と島のあいだ：S字の点線（左→右。右→左は鏡にうつす） */
.link{position:relative;height:30px;margin:0 28px}
.link::before,.link::after{content:"";position:absolute;width:calc(50% + 2px);height:calc(50% + 2px);border:0 dashed #d6c6b0}
.link::before{left:0;top:0;border-left-width:4px;border-bottom-width:4px;border-bottom-left-radius:16px}
.link::after{right:0;bottom:0;border-top-width:4px;border-right-width:4px;border-top-right-radius:16px}
.link.r{transform:scaleX(-1)}
/* レベルアップしたい人へ：もう1つの地図。基本よりしずかな色で、はじめはとじておく */
details.xmap{padding:0;background:#fbf9f6;border:2px dashed #d9cfc1;box-shadow:none}
details.xmap>summary{display:flex;align-items:center;gap:12px;min-height:72px;padding:12px 14px;cursor:pointer;list-style:none;border-radius:16px}
details.xmap>summary::after{content:"▾";flex:none;color:var(--sub);font-size:14px;transition:transform .15s}
details.xmap[open]>summary::after{transform:rotate(180deg)}
@media (hover:hover){details.xmap>summary:hover{background:var(--soft2)}}
.xmap .xic{flex:none;width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid #d9cfc1;display:grid;place-items:center;font-size:24px}
.xmap .xt{flex:1;min-width:0}
.xmap .xt b{display:block;font-size:16px;line-height:1.35}
.xmap .xt small{display:block;color:var(--sub);font-size:12.5px;line-height:1.45}
.xmap .xt .ssum{display:block;margin-top:2px;font-size:13px;font-weight:800;color:#a35f00}
.xsteps{list-style:none;margin:0;padding:4px 12px 12px}
.xsteps li{position:relative;padding-left:40px}
/* 石をつなぐ細い点線 */
.xsteps li::before{content:"";position:absolute;left:15px;top:0;bottom:0;border-left:2px dashed #d9cfc1}
.xsteps li:first-child::before{top:28px}
.xsteps li:last-child::before{bottom:calc(100% - 28px)}
.xsteps .stone{position:absolute;left:0;top:13px;width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid #b9ac99;display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--ink);z-index:1}
.xsteps li.done .stone{background:var(--ok);border-color:var(--ok);color:#fff}
#view .xsteps li a.arow{background:#fff;border:1.5px solid var(--line)}
/* せまい画面（320px）：島を小さくして、看板の文字をすこし小さく */
@media (max-width:360px){
  .isle{width:52px;height:52px;font-size:24px}
  details.stage::before{left:24px} details.stage.r::before{right:24px}
  .link{margin:0 24px}
  .sign{padding-left:10px}
  .sign b{font-size:15px}
  #view .plaza .ways a{font-size:13.5px;padding:6px 8px}
}
.foot{margin:4px 4px 0;font-size:13px;line-height:1.6}
.foot>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.foot p{margin:0 0 4px}
</style>

<body data-nosound>
<header class="appbar" id="appbar"></header>
<main class="page" id="view"></main>
<script src="assets/core.js"></script>
<script>
/* 入口：つづきから（＋にがて）・耳のひろば・ぼうけんの地図（基本①〜⑥）・レベルアップしたい人へ（もう1つの地図）
 *   目次は core の PA.UNITS（kind：basic＝基本の島、daily＝耳のひろば、extra＝レベルアップ）・PA.APPS・PA.APP_TYPES（このページではもたない）。
 *   島の名前・色（LOOK）だけこのページのもの。しらない単元は PA.UNITS の名前と PALETTE の色。app.title・task.title はただの文字、app.d は HTML
 *   ひらいたアプリ：PA.store 'visited'（PA.mountBar がきろく）。まえからの人は 'last'・'keystats-…' なども見る
 *   島・レベルアップの地図のひらく／とじる：PA.store 'home-units'＝{unit の id: true/false}（じぶんでおしたときだけほぞん）
 *   耳のひろばのきろく（よむだけ）：'ear'（right・total・ch.best）、'progression'（rec[ステップ].best）、'session-ear'（とちゅうの5もん）
 *
 * ★ のきまり（課題ごと。開いただけでは ★1つ）
 *   ★　　＝ひらいた（見た）
 *   ★★　＝そこで問題をやった
 *          クイズ：その課題の調（和音クイズは①が長調・②が短調。href の keyset）で1もんでもこたえた（keystats）。
 *            keyset のないクイズは、のこっている5もんの回（PA.session）でこたえたのも入れる（聴きわけのもんだいは keystats にのこらないので）
 *          しくみ・れんしゅう・いちらんのページ：そのページの練習クイズ（app.practice）で1もんでもこたえた。伴奏づけ：曲に和音を1つでもつけた
 *          耳：れんしゅう・チャレンジで1もんでもこたえた
 *   ★★★＝クイズのページのみ：その課題の調の半分いじょうが「できた」（PA.keyDeck.tally の good。チェック表の ✓ とおなじ）
 *   練習の問題がないページ（7つの和音・和音のかたち・音のへだたり）は ★ まで。
 *   島のクリア＝どの課題も ★★ いじょう（★ までのページは ★）。
 * 🐸 のいる島＝基本の島のうち、さいごにやったページ（'visited' の時こく・'last-…'）がある島。
 *   和音クイズのように2つの島にあるときは、まだクリアしていないほう。その島がもうクリアなら、そのつぎのまだクリアしていない島。
 *   基本の島をまだなにもひらいていなければ、さいしょのまだクリアしていない島。ぜんぶクリアならゴール */
const T=PA.APP_TYPES, ESC=PA.esc;
const TALLY_MODES={'minor-quiz':['minor']}; // 短調クイズは短調だけ（12）。ほかは長調・短調（24）
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const isInt=(v,lo,hi)=>Number.isInteger(v)&&v>=lo&&v<=hi;
const rec=k=>{const v=PA.store.get(k,null);return isObj(v)&&typeof v.app==='string'&&PA.app(v.app)?v:null;};
const typeOf=a=>T[a.type]||T.learn;
const isGame=a=>a.type==='quiz'||a.type==='ear';
const NUMS='①②③④⑤⑥⑦⑧⑨';
// 島の名前と色（c＝ふちの色、l＝うすい色。どちらも文字はのせない）。名前は「なにをするか」がわかることばに
const LOOK={
  major:{name:'長調の4つの和音',sub:'Ⅰ・Ⅳ・Ⅴ・Ⅴ7。いちばん大事！まずはここから',c:'#f4a100',l:'#fff1cc'},
  minor:{name:'短調の4つの和音',sub:'Ⅰ・Ⅳ・Ⅴ・Ⅴ7。7ばんめを上げるので、Ⅴ・Ⅴ7にはかならず臨時記号',c:'#3b4fa8',l:'#e6eafb'},
  minor9:{name:'短調のⅤ9と減七',c:'#8a4fe0',l:'#ece2fb'},
  more:{c:'#2f7ee8',l:'#dfeafd'},
  ending:{c:'#0f9d9a',l:'#d5f3f2'},
  accomp:{c:'#22a06b',l:'#daf3e6'}
};
const PALETTE=[['#f4a100','#fff1cc'],['#22a06b','#daf3e6'],['#2f7ee8','#dfeafd'],['#8a4fe0','#ece2fb'],['#d6458a','#fbe1ee']];
const EMOJI_RE=/^((?:[\uD800-\uDBFF][\uDC00-\uDFFF]|[☀-♬♰-➿])️?)\s*/;
const look=(u,i)=>{
  const m=String(u.title).match(EMOJI_RE), lk=LOOK[u.id]||{}, pl=PALETTE[i%PALETTE.length];
  return {id:u.id,emoji:m?m[1]:'🏝️',name:lk.name||String(u.title).replace(EMOJI_RE,''),sub:lk.sub||u.sub||'',c:lk.c||pl[0],l:lk.l||pl[1],tasks:u.tasks,apps:u.apps};
};
const units=kind=>PA.UNITS.filter(u=>u.tasks.length&&(kind==='basic'?(u.kind!=='daily'&&u.kind!=='extra'):u.kind===kind));
const BASIC=units('basic').map(look);   // 基本の地図（しらない kind も基本に）
const DAILY=units('daily').map(look);   // 耳のひろば（地図ではなくカードに）
const EXTRA=units('extra').map(look);   // レベルアップしたい人へ（もう1つの地図）

// ひらいたことのあるアプリ（id の Set）
function visitedSet(){
  const out=new Set(), v=PA.store.get('visited',{});
  if(isObj(v)) Object.keys(v).forEach(id=>{if(PA.app(id)) out.add(id);});
  ['last','last-practice','last-learn'].forEach(k=>{const r=rec(k);if(r) out.add(r.app);});
  // 'visited' ができる前からつかっている人：クイズのきろくやページの設定があればひらいたことがある
  PA.store.keys().forEach(k=>{const id=k.replace(/^(keystats|session)-/,'');if(PA.app(id)) out.add(id);});
  return out;
}
// アプリごとの、さいごにひらいた時こく（'visited' と 'last…' の新しいほう）
function lastTimes(){
  const out={}, v=PA.store.get('visited',{});
  if(isObj(v)) Object.keys(v).forEach(id=>{const t=v[id];if(PA.app(id)&&typeof t==='number'&&t>0) out[id]=t;});
  ['last','last-practice','last-learn'].forEach(k=>{const r=rec(k);if(r&&typeof r.t==='number'&&r.t>(out[r.app]||0)) out[r.app]=r.t;});
  return out;
}
// 「きょう」「きのう」「3日まえ」
function when(t){
  if(!(t>0)) return '';
  const d0=new Date(); d0.setHours(0,0,0,0);
  const days=Math.ceil((d0.getTime()-t)/864e5);
  return days<=0?'きょう':days===1?'きのう':days<7?days+'日前':days<30?Math.floor(days/7)+'週間前':'しばらく前';
}
// のこっている5もんの回（なければ null）
function sessOf(id){let st=null; try{st=PA.session(id).state();}catch(e){} return st;}
// そのアプリでさいごにやったこと（わかれば）。ただの文字
function lastDone(app){
  if(!/^(quiz|ear)$/.test(app.type)) return '';
  const st=sessOf(app.id);
  if(st&&st.done.length<st.n) return `📝 ${st.n}もんのとちゅう（${st.done.length} / ${st.n}）`;
  if(st){const t=PA.sessionTally(st.done,st.n);return `📝 ${st.n}もん中${t.ok}もんできた`;}
  if(app.type!=='quiz') return '';
  const s=PA.keyDeck.stats(app.id); let best=null;
  Object.keys(s).forEach(id=>{if(!best||(s[id].last||0)>(s[best].last||0)) best=id;});
  const p=best&&PA.keyDeck.parse(best);
  return p?'さいごの調：'+PA.keyName(PA.keyOf(p.minor,p.idx)):'';
}

/* ----- ★ （くわしくは上のコメント） ----- */
// 課題の調：href の keyset（和音クイズ）、なければそのクイズの調
function modesOf(t){
  const m=/[?&]keyset=(major|minor)(?:&|$)/.exec(t.href||'');
  return m?[m[1]]:(TALLY_MODES[t.app]||['major','minor']);
}
function quizStat(id,modes){
  const t=PA.keyDeck.tally(id,{modes:modes||TALLY_MODES[id]||['major','minor']});
  return {good:t.good,total:t.total,tried:t.total-t.none>0};
}
const sessTried=id=>{const st=sessOf(id);return !!st&&st.done.length>0;};
// 練習クイズでこたえたことがある（調はとわない）
const quizTried=id=>quizStat(id).tried||sessTried(id);
function earTried(id){
  const d=PA.store.get(id,{}), o=isObj(d)?d:{};
  if(id==='ear') return (isInt(o.total,1,1e9))||(isObj(o.ch)&&isInt(o.ch.best,1,99))||sessTried(id);
  if(id==='progression') return (isObj(o.rec)&&Object.keys(o.rec).some(k=>isObj(o.rec[k])&&isInt(o.rec[k].total,1,1e9)))||sessTried(id);
  return sessTried(id);
}
function accompTried(){
  const d=PA.store.get('accompaniment',{}), c=isObj(d)&&isObj(d.choices)?d.choices:{};
  return Object.keys(c).some(k=>Array.isArray(c[k])&&c[k].some(x=>typeof x==='string'&&x));
}
// その課題でとれるほしの数（3・2・1）
function maxStars(a){
  if(a.type==='quiz') return 3;
  if(a.type==='ear'||(a.practice&&PA.app(a.practice))||a.id==='accompaniment') return 2;
  return 1;
}
// → {n（いまのほし）, max, q（クイズの「できた調」。クイズでなければ null）}
function taskStars(t,vis){
  const a=PA.app(t.app), max=maxStars(a);
  const q=a.type==='quiz'?quizStat(a.id,modesOf(t)):null;
  if(!vis.has(a.id)) return {n:0,max,q};
  let n=1;
  if(q){
    if(q.tried||(!/[?&]keyset=/.test(t.href||'')&&sessTried(a.id))) n=2;
    if(q.total&&q.good*2>=q.total) n=3;
  }
  else if(a.type==='ear'){if(earTried(a.id)) n=2;}
  else if(a.practice&&PA.app(a.practice)){if(quizTried(a.practice)) n=2;}
  else if(a.id==='accompaniment'){if(accompTried()) n=2;}
  return {n:Math.min(n,max),max,q};
}
const taskDone=s=>s.n>=Math.min(2,s.max);
// 島ごと：{tasks:[★], got, max, clear}
function islandStars(s,vis){
  const ts=s.tasks.map(t=>taskStars(t,vis));
  return {tasks:ts,got:ts.reduce((a,x)=>a+x.n,0),max:ts.reduce((a,x)=>a+x.max,0),clear:ts.every(taskDone)};
}
const starsHTML=(n,max)=>`<span class="stars" role="img" aria-label="ほし${max}こ中${n}こ">`
  +Array.from({length:max},(_,i)=>i<n?'<span class="on">★</span>':'☆').join('')+`</span>`;
const sumHTML=st=>`<span class="ssum" role="img" aria-label="ほし${st.max}こ中${st.got}こ">★${st.got}／${st.max}</span>`;

// 🐸 のいる島の id（ぜんぶクリアなら null＝ゴール）
function hereId(stars,times){
  const firstOpen=from=>{for(let i=Math.max(0,from);i<BASIC.length;i++) if(!stars[BASIC[i].id].clear) return BASIC[i].id;return null;};
  let app=null, bt=0;
  BASIC.forEach(s=>s.apps.forEach(id=>{const t=times[id]||0;if(t>bt){bt=t;app=id;}}));
  if(!app) return firstOpen(0);
  const idx=[]; BASIC.forEach((s,i)=>{if(s.apps.indexOf(app)>=0) idx.push(i);});
  for(let k=0;k<idx.length;k++) if(!stars[BASIC[idx[k]].id].clear) return BASIC[idx[k]].id;
  return firstOpen(idx[idx.length-1]+1)||firstOpen(0);
}

/* ----- 上：はじめての人／つづきから ----- */
// 'last…' がないけれどひらいたことがある人：さいごにひらいたアプリ（'visited' の時こく）、なければ 🐸 の島のまだひらいていないページ
function fallbackRec(vis,here){
  const v=PA.store.get('visited',{}); let best=null;
  if(isObj(v)) Object.keys(v).forEach(id=>{const t=v[id];if(PA.app(id)&&typeof t==='number'&&t>0&&(!best||t>best.t)) best={app:id,t};});
  if(best) return best;
  const s=BASIC.find(s=>s.id===here)||BASIC[0];
  const id=s&&(s.apps.find(a=>!vis.has(a))||s.apps[0]);
  return id?{app:id,t:0}:null;
}
function topHTML(vis,here){
  const lp=rec('last-practice'), ll=rec('last-learn'), old=rec('last');
  if(!vis.size&&!lp){
    const s0=BASIC[0], t0=s0&&s0.tasks[0];
    return `<section class="card hero" aria-labelledby="hero-h"><div class="big" aria-hidden="true">🐸🗺️</div>
      <h2 id="hero-h">${ESC(s0?s0.name:'長調の4つの和音')}から始めよう</h2>
      <p class="lead">Ⅰ・Ⅳ・Ⅴ・Ⅴ7は、いちばん大事な和音。見て、聴いて、つくってみよう</p>
      ${t0?`<a class="btn" href="${ESC(t0.href)}">${PA.icon('play')}ここから始める</a>`:''}
      <p class="site">島を①から順にまわって、和音を「見て・聴いて・さわって」おぼえよう。耳のひろばは、いつでも遊べるよ。</p></section>`;
  }
  // つづき：さいごにひらいたページ（クイズ・しくみの新しいほう）
  const main=(lp&&ll?(ll.t>lp.t?ll:lp):lp||ll)||old||fallbackRec(vis,here);
  // にがてふくしゅう：クイズのページだけ（key と n でその調の3もん）
  const ws0=PA.weakSummary(30).filter(w=>{const a=PA.app(w.quiz);return a&&a.type==='quiz';});
  const ws=ws0.filter(w=>w.quiz===ws0[0].quiz).slice(0,3); // いちばんにがてのクイズだけ（1行に）
  if(!main&&!ws.length) return '';
  let h=`<section class="card" aria-labelledby="today-h"><h2 id="today-h" class="pa-sr">つづきから</h2>`;
  if(main){
    const app=PA.app(main.app), meta=[when(main.t),lastDone(app)].filter(Boolean).join('・');
    h+=`<a class="go" href="${app.id}.html"><span class="ic" aria-hidden="true">${app.ic}</span><span class="tx"><span class="eye">${PA.icon('play')}つづきから</span><b>${ESC(app.title)}</b>${meta?`<span class="meta">${ESC(meta)}</span>`:''}</span></a>`;
  }
  // すすめは1つだけ：つづきがしくみのページならそのれんしゅう、ちがえば にがての調（1つのクイズ）
  const pr=main?PA.app(PA.app(main.app).practice||''):null;
  if(pr) h+=`<div class="weakrow"><a href="${pr.id}.html"><span aria-hidden="true">${pr.ic}</span>${ESC(pr.title)}でれんしゅう</a></div>`;
  else if(ws.length){
    // クイズが1つだけなら見出しに書き、ボタンは調の名前だけ
    const one=ws.every(w=>w.quiz===ws[0].quiz), q0=PA.app(ws[0].quiz);
    h+=`<div class="weakrow"><span class="wl">${PA.icon('retry')}にがてを3もん${one?`（${ESC(q0.title)}）`:''}</span>`
      +ws.map(w=>{const a=PA.app(w.quiz);
        return `<a href="${ESC(PA.url(w.quiz,{key:w.id,n:3}))}" aria-label="${ESC(w.name+'（'+a.title+'）を3もん')}">${ESC(w.name)}${one?'':`<small>${ESC(a.title)}</small>`}</a>`;}).join('')
      +`</div>`;
  }
  return h+`</section>`;
}

/* ----- 耳のひろば：きょうの5もん・聴きわけ・チャレンジと、じぶんのきろく ----- */
function earRecs(){
  const out=[], e0=PA.store.get('ear',{}), e=isObj(e0)?e0:{}, p0=PA.store.get('progression',{}), p=isObj(p0)?p0:{};
  const chBest=isObj(e.ch)&&isInt(e.ch.best,1,99)?e.ch.best:0;
  if(chBest) out.push(`🏆 チャレンジ：レベル${chBest}までクリア`);
  if(isInt(e.total,1,1e9)&&isInt(e.right,0,e.total)) out.push(`⭐ 和音の聴きわけ：${e.right}もん正解`);
  let pb=0; if(isObj(p.rec)) Object.keys(p.rec).forEach(k=>{const r=p.rec[k];if(isObj(r)&&isInt(r.best,1,1e6)&&r.best>pb) pb=r.best;});
  if(pb) out.push(`🧩 ならび：さいこう${pb}もんれんぞく正解`);
  return out;
}
function plazaHTML(){
  if(!DAILY.length) return '';
  const tasks=[]; DAILY.forEach(u=>u.tasks.forEach(t=>tasks.push(t)));
  const ear=PA.app('ear')&&tasks.some(t=>t.app==='ear');
  let h=`<section class="card plaza" aria-labelledby="plaza-h"><span class="spark" aria-hidden="true">✨</span>`
    +`<h2 id="plaza-h"><span aria-hidden="true">👂 </span>${ESC(DAILY[0].name)}<small>毎日すこしずつ。聴いてパッとわかるかな？</small></h2>`;
  if(ear){
    // きょうの5もん：ear.html?n=5（れんしゅうの5もんの回。とちゅうならつづきから）
    const st=sessOf('ear'), mid=!!st&&st.done.length<st.n&&st.done.length>0;
    h+=`<a class="today" href="${ESC(PA.url('ear',{n:5}))}"><span class="ic" aria-hidden="true">🎧</span><span class="tx"><b>きょうの5もん</b>`
      +`<small>${mid?`とちゅうから（${st.done.length} / ${st.n}）`:'和音を聴いて、明るい？さびしい？'}</small></span></a>`;
  }
  h+=`<div class="ways">`+tasks.map(t=>{const a=PA.app(t.app);
      return `<a href="${ESC(t.href)}"><span aria-hidden="true">${a.ic}</span>${ESC(t.title)}</a>`;}).join('');
  if(ear) h+=`<a class="wide" href="${ESC(PA.url('ear',{mode:'challenge'}))}"><span aria-hidden="true">🏆</span><span>チャレンジ<small>${PA.native?'ライフ3つで、どこまで行けるかな？':'ライフ3つで、どこまで行けるかな？ランキングにものせられるよ'}</small></span></a>`;
  h+=`</div>`;
  const rs=earRecs();
  h+=rs.length?`<ul class="recs" aria-label="じぶんのきろく">${rs.map(r=>`<li>${ESC(r)}</li>`).join('')}</ul>`
    :`<ul class="recs none"><li>まだきろくはないよ。きょうの5もんからやってみよう</li></ul>`;
  return h+`</section>`;
}

/* ----- 島の中のページ ----- */
// 行は アイコン＋名前＋ほし だけ。説明は まだひらいていない行だけ1行で（ひらいたことがあれば中身はわかっているので）
function rowHTML(t,s,vis){
  const app=PA.app(t.app), seen=vis.has(app.id), ty=typeOf(app), game=isGame(app);
  const kd=s.q&&seen?`<span class="kd">できた調${s.q.good}／${s.q.total}</span>`:'';
  return `<a class="arow${game?' game':''}" href="${ESC(t.href)}"${game?` style="--tc:${ty.c};--tl:${ty.l};--td:${ty.dk}"`:''}><span class="ic" aria-hidden="true">${app.ic}</span>`
    +`<span class="tx">${game?`<span class="ty">${ESC(ty.label)}</span>`:''}<b>${ESC(t.title)}</b>${seen?'':`<span class="d">${app.d}</span>`}</span>`
    +`<span class="st">${starsHTML(s.n,s.max)}${kd}</span></a>`;
}
const savedOpen=()=>{const s=PA.store.get('home-units',{});return isObj(s)?s:{};};

/* ----- ぼうけんの地図（基本①〜⑥）：島をS字の点線でつなぐ ----- */
function mapHTML(vis,stars,here){
  if(!BASIC.length) return '';
  const sv=savedOpen();
  let h=`<section class="card map" aria-labelledby="map-h"><h2 id="map-h"><span aria-hidden="true">🗺️ </span>ぼうけんの地図<small>①〜⑥が基本の島。🐸のいる島が、いまやっているところ。島をおすとページが出てくるよ</small></h2>`
    +`<p class="legend"><span><b aria-hidden="true">★</b>見た</span><span><b aria-hidden="true">★★</b>問題をやった</span><span><b aria-hidden="true">★★★</b>自分でできた</span></p>`
    +`<div class="trail"><div class="start"><span aria-hidden="true">🚩</span>スタート</div>`;
  BASIC.forEach((s,i)=>{
    const st=stars[s.id], done=st.clear, isHere=s.id===here, side=i%2?'r':'l';
    const open=typeof sv[s.id]==='boolean'?sv[s.id]:isHere;
    h+=`<details class="stage ${side}${isHere?' here':''}${done?' done':''}" data-d="stage-${s.id}" data-u="${s.id}" style="--c:${s.c};--l:${s.l}"${open?' open':''}>`
      +`<summary><span class="isle" aria-hidden="true">${s.emoji}${isHere?'<span class="frog">🐸</span>':''}${done?'<span class="ok">✓</span>':''}</span>`
      +`<span class="sign"><b><span class="num">${NUMS[i]||i+1}</span>${ESC(s.name)}</b>${isHere?'<span class="tag now">いまここ</span>':''}${done?'<span class="tag clear">クリア！</span>':''}`
      +`${s.sub?`<small>${ESC(s.sub)}</small>`:''}${sumHTML(st)}</span></summary>`
      +`<ul class="alist">${s.tasks.map((t,k)=>`<li>${rowHTML(t,st.tasks[k],vis)}</li>`).join('')}</ul></details>`
      +`<div class="link ${side}" aria-hidden="true"></div>`;
  });
  const gside=BASIC.length%2?'r':'l', all=!here;
  h+=`<div class="goal ${gside}${all?' here':''}"><span class="isle" aria-hidden="true">🏆${all?'<span class="frog">🐸</span>':''}</span>`
    +`<span class="sign"><b>ゴール</b>${all?'<span class="tag now">いまここ</span>':''}<small>${all?'ぜんぶの島をクリアしたね！レベルアップの地図にも行ってみよう':'ぜんぶの島をクリアすると、ここにつくよ'}</small></span></div>`;
  return h+`</div></section>`;
}

/* ----- レベルアップしたい人へ：もう1つの地図（先生のじゅん。はじめはとじておく） ----- */
function extraHTML(vis,stars,times){
  const sv=savedOpen();
  return EXTRA.map(u=>{
    const st=stars[u.id];
    // ひらくのは、じぶんでひらいたとき か、さいごにやったページがこの地図にあるとき
    let mine=0, other=0; Object.keys(times).forEach(id=>{if(u.apps.indexOf(id)>=0) mine=Math.max(mine,times[id]);else other=Math.max(other,times[id]);});
    const open=typeof sv[u.id]==='boolean'?sv[u.id]:mine>0&&mine>=other;
    let no=0;
    return `<details class="card xmap" data-d="xmap-${u.id}" data-u="${u.id}"${open?' open':''}>`
      +`<summary><span class="xic" aria-hidden="true">${u.emoji}</span><span class="xt"><b>${ESC(u.name)}</b>`
      +`<small>①〜⑥のあとで。${ESC(u.sub)}</small>${sumHTML(st)}</span></summary>`
      +`<ol class="xsteps">${u.tasks.map((t,k)=>{const s=st.tasks[k], a=PA.app(t.app), mark=a.type==='quiz'?'🎯':String(++no);
        return `<li class="${taskDone(s)?'done':''}"><span class="stone" aria-hidden="true">${mark}</span>${rowHTML(t,s,vis)}</li>`;}).join('')}</ol></details>`;
  }).join('');
}

/* ----- さいごのおしらせ ----- */
function footHTML(){
  return `<details class="note foot" data-d="foot"><summary>ℹ️ 使いかたのメモ（⚙️ 設定${PA.native?'':'・ホーム画面'}・きろくのひかえ）</summary>
    <p>⚙️（右上）：音の名前（ドレミ／CDE／ハニホ）と基準の音（ラ＝440〜443Hz）。どのアプリも同じ設定です。</p>
    ${PA.native?'':'<p>📱 ホーム画面に追加すると、アプリのようにひらけて、ネットがなくても使えます。</p>'}
    <p>💾 きろくはこの端末の中だけ。ときどき ⚙️ → 💾 でファイルにひかえておこう。</p>
    ${PA.native?'':'<p>🏆 ランキングには、「和音の聴きわけ」の 🏆 チャレンジでのせられるよ（名前はニックネームで）。</p>'}
    <p><a href="support.html">🛟 こまったとき・おといあわせ</a>　<a href="privacy.html">🔒 プライバシーポリシー</a></p></details>`;
}

function render(){
  const vis=visitedSet(), times=lastTimes(), stars={};
  BASIC.concat(EXTRA).forEach(s=>{stars[s.id]=islandStars(s,vis);});
  const here=hereId(stars,times);
  const h=`<div class="stack home">${topHTML(vis,here)}${plazaHTML()}${mapHTML(vis,stars,here)}${extraHTML(vis,stars,times)}${footHTML()}</div>`;
  PA.paint(document.getElementById('view'),h,'home');
}
// じぶんでひらいた／とじた島・地図だけおぼえる
document.getElementById('view').addEventListener('click',e=>{
  const sm=e.target.closest&&e.target.closest('details.stage>summary,details.xmap>summary'); if(!sm) return;
  const d=sm.parentNode;
  setTimeout(()=>{const s=PA.store.get('home-units',{}), sv=isObj(s)?s:{};sv[d.dataset.u]=d.open;PA.store.set('home-units',sv);},0);
});
PA.store.set('return-to',null);
PA.mountBar({title:'ピアノ和音アプリ',back:'#'});
document.querySelector('#appbar a.iconbtn').outerHTML='<span class="iconbtn" aria-hidden="true">🎹</span>';
PA.onSettings=render;
PA.onPageShow=render;
render();
</script>
