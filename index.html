<meta property="og:site_name" content="ピアノ和音アプリ">

<meta property="og:description" content="ピアノを習う人のための、和音を「見て・聴いて・さわって」おぼえる小さなアプリ集。Ⅰ・Ⅳ・Ⅴ7から短調・おわりかた・変化和音、伴奏づけ、聴きわけまで。">

<title>ピアノ和音アプリ</title>
<link rel="stylesheet" href="assets/app.css">
<style>
/* 入口は「しずかに」：目立たせるのは「つづき」と「つぎ」の単元だけ（こい墨色）。種類のラベルは灰色の文字で、和音の色（赤・緑・青・むらさき）はつかわない */
.home h2{margin:0;font-size:17px}
.home h2 small{display:block;font-weight:400;color:var(--sub);font-size:13px;margin-top:2px}
.lbl{margin:4px 4px -4px;font-size:15px;font-weight:800;color:var(--ink)}
/* はじめての人 */
.hero{text-align:center;padding:18px 16px}
.hero .big{font-size:44px;line-height:1}
.hero h2{font-size:22px;margin-top:6px}
.hero .lead{color:var(--ink);font-size:16px;margin:6px 0 12px;word-break:keep-all;overflow-wrap:anywhere}
.hero .btn{display:flex;width:100%;min-height:56px;font-size:18px}
.hero .site{margin:12px 0 0;color:var(--sub);font-size:13px;line-height:1.6;text-align:left}
/* きょうのれんしゅう（つづき＋にがて） */
.go{display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 14px;border-radius:16px;background:var(--ink);color:#fff;text-decoration:none}
.go .ic{flex:none;width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:24px}
.go .tx{flex:1;min-width:0}
.go b{display:block;font-size:18px;line-height:1.3}
.go .meta{display:block;font-size:13px;line-height:1.45;opacity:.9}
.go .eye{display:block;font-size:12px;font-weight:800;line-height:1.3;opacity:.85}
.go::after{content:"›";flex:none;font-size:28px}
.weakrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.weakrow .wl{flex-basis:100%;font-size:13px;font-weight:800;color:var(--sub)}
#view .weakrow a{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:4px 12px;border-radius:999px;background:var(--soft2);color:var(--ink);text-decoration:none;font-size:14px;font-weight:700;border:2px solid var(--line)}
.weakrow a small{font-weight:400;color:var(--sub);font-size:12px}
/* いつでも（どうぐ） */
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:76px;padding:8px 4px;border-radius:16px;background:var(--card);box-shadow:0 2px 0 #eadfce;color:var(--ink);text-decoration:none;text-align:center}
.tool .ic{font-size:24px;line-height:1.1}
.tool b{font-size:14px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.tool small{color:var(--sub);font-size:11.5px;line-height:1.3;white-space:nowrap}
@media (max-width:360px){.tool{padding:8px 2px}.tool b{font-size:13px}.tool small{font-size:11px}}
/* コース：番号つきの単元。ひらくのは「つぎ」の単元だけ */
.units{display:flex;flex-direction:column;gap:8px}
details.unit{background:var(--card);border-radius:16px;box-shadow:0 2px 0 #eadfce;min-width:0}
details.unit>summary{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;cursor:pointer;list-style:none}
details.unit>summary::-webkit-details-marker{display:none}
details.unit>summary::after{content:"▾";flex:none;color:var(--sub);font-size:14px;transition:transform .15s}
details.unit[open]>summary::after{transform:rotate(180deg)}
.unit .no{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--soft);color:var(--ink)}
.unit.done .no{background:var(--ok);color:#fff}
.unit .ut{flex:1;min-width:0}
.unit .ut b{display:block;font-size:16px;line-height:1.35}
.unit .ut small{display:block;color:var(--sub);font-size:12.5px;line-height:1.4}
.unit .prog{flex:none;font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
.unit.next{box-shadow:0 0 0 3px var(--ink)}
.unit.next .no{background:var(--ink);color:#fff}
.unit .nexttag{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:800;padding:0 7px;border-radius:999px;background:var(--ink);color:#fff;vertical-align:2px}
.alist{list-style:none;margin:0;padding:0 8px 8px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line)}
#view li a.arow{display:flex;margin:0;align-items:center;gap:10px;min-height:56px;padding:6px 6px;border-radius:12px;color:var(--ink);text-decoration:none}
.arow:hover{background:var(--soft2)}
.arow .ic{flex:none;width:36px;height:36px;border-radius:11px;background:var(--soft2);display:grid;place-items:center;font-size:20px}
.arow .tx{flex:1;min-width:0;line-height:1.35}
.arow .tx b{font-size:15.5px}
.arow .d{display:block;color:var(--sub);font-size:12.5px;line-height:1.45}
.arow .st{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;font-weight:700;white-space:nowrap}
.ty{display:inline-block;font-size:11.5px;font-weight:800;padding:0 7px;border-radius:999px;border:1.5px solid var(--line);color:var(--sub);background:#fff;line-height:1.5}
.arow .seen{color:var(--ok);font-size:12px}
.arow .kd{color:var(--ok);font-size:12px}
.foot{margin:4px 4px 0;font-size:13px;line-height:1.6}
.foot>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.foot p{margin:0 0 4px}
</style>
</head>
<body data-nosound>
<header class="appbar" id="appbar"></header>
<main class="page" id="view"></main>
<script src="assets/core.js"></script>
<script>
/* 入口：きょうのれんしゅう（つづき＋にがて）・いつでも（どうぐ）・コース（番号つきの単元）
 *   目次は core の PA.UNITS・PA.APPS・PA.APP_TYPES（このページではもたない）。app.title はただの文字、app.d は HTML
 *   「いつでも」の3つ（TOOLS）はコースの単元にはならべない（おなじものを2回出さない）
 *   ひらいたアプリ：PA.store 'visited'（PA.mountBar がきろく）。まえからの人は 'last'・'keystats-…' なども見る
 *   コースのひらく／とじる：PA.store 'home-units'＝{unit の id: true/false}（じぶんでおしたときだけほぞん） */
const T=PA.APP_TYPES, ESC=PA.esc;
const TOOLS=[['accompaniment','曲につける'],['ear','まいにちすこし'],['chord-table','ぜんぶの調']];
const TOOL_IDS=TOOLS.map(t=>t[0]);
const TALLY_MODES={'minor-quiz':['minor']}; // 短調クイズは短調だけ（12）。ほかは長調・短調（24）
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const rec=k=>{const v=PA.store.get(k,null);return isObj(v)&&typeof v.app==='string'&&PA.app(v.app)?v:null;};
const typeOf=a=>T[a.type]||T.learn;
// コースにならべる単元（「いつでも」のアプリをのぞいて、のこりがある単元だけ）
const COURSE=PA.UNITS.map(u=>({id:u.id,title:u.title,sub:u.sub,apps:u.apps.filter(id=>PA.app(id)&&TOOL_IDS.indexOf(id)<0)})).filter(u=>u.apps.length);
// 単元の名前の先頭の絵文字は番号にかえる（「🎹 はじめの和音」→「はじめの和音」）
const plainTitle=t=>String(t).replace(/^(?:[\uD800-\uDBFF][\uDC00-\uDFFF]|[\u2600-\u266C\u2670-\u27BF])\uFE0F?\s*/,'');

// ひらいたことのあるアプリ（id の Set）
function visitedSet(){
  const out=new Set(), v=PA.store.get('visited',{});
  if(isObj(v)) Object.keys(v).forEach(id=>{if(PA.app(id)) out.add(id);});
  ['last','last-practice','last-learn'].forEach(k=>{const r=rec(k);if(r) out.add(r.app);});
  // 'visited' ができる前からつかっている人：クイズのきろくやページの設定があればひらいたことがある
  PA.store.keys().forEach(k=>{const id=k.replace(/^(keystats|session)-/,'');if(PA.app(id)) out.add(id);});
  return out;
}
// 「きょう」「きのう」「3日まえ」
function when(t){
  if(!(t>0)) return '';
  const d0=new Date(); d0.setHours(0,0,0,0);
  const days=Math.ceil((d0.getTime()-t)/864e5);
  return days<=0?'きょう':days===1?'きのう':days<7?days+'日前':days<30?Math.floor(days/7)+'週間前':'しばらく前';
}
// そのアプリでさいごにやったこと（わかれば）。ただの文字
function lastDone(app){
  if(!/^(quiz|ear)$/.test(app.type)) return '';
  let st=null; try{st=PA.session(app.id).state();}catch(e){}
  if(st&&st.done.length<st.n) return `📝 ${st.n}もんのとちゅう（${st.done.length} / ${st.n}）`;
  if(st){const t=PA.sessionTally(st.done,st.n);return `📝 ${st.n}もん中${t.ok}もんできた`;}
  if(app.type!=='quiz') return '';
  const s=PA.keyDeck.stats(app.id); let best=null;
  Object.keys(s).forEach(id=>{if(!best||(s[id].last||0)>(s[best].last||0)) best=id;});
  const p=best&&PA.keyDeck.parse(best);
  return p?'さいごの調：'+PA.keyName(PA.keyOf(p.minor,p.idx)):'';
}

/* ----- 上：はじめての人／きょうのれんしゅう ----- */
// 'last…' がないけれどひらいたことがある人：さいごにひらいたアプリ（'visited' の時こく）、なければつぎの単元のまだひらいていないアプリ
function fallbackRec(vis){
  const v=PA.store.get('visited',{}); let best=null;
  if(isObj(v)) Object.keys(v).forEach(id=>{const t=v[id];if(PA.app(id)&&typeof t==='number'&&t>0&&(!best||t>best.t)) best={app:id,t};});
  if(best) return best;
  const nx=COURSE.find(u=>u.id===nextUnitId(vis))||COURSE[0];
  const id=nx&&(nx.apps.find(a=>!vis.has(a))||nx.apps[0]);
  return id?{app:id,t:0}:null;
}
function topHTML(vis){
  const lp=rec('last-practice'), ll=rec('last-learn'), old=rec('last');
  if(!vis.size&&!lp){
    return `<section class="card hero" aria-labelledby="hero-h"><div class="big" aria-hidden="true">🐸</div>
      <h2 id="hero-h">はじめての和音</h2>
      <p class="lead">ド・ミ・ソを見て・聴いて・つくってみよう</p>
      <a class="btn primary" href="chord-build.html">ここから始める ›</a>
      <p class="site">Ⅰ・Ⅳ・Ⅴから7つの和音、短調、おわりかた、変化和音、伴奏づけ、耳のれんしゅうまで。「見て・聴いて・さわって」おぼえよう。</p></section>`;
  }
  const main=lp||ll||old||fallbackRec(vis);
  // にがてふくしゅう：クイズのページだけ（key と n でその調の3もん）
  const ws=PA.weakSummary(30).filter(w=>{const a=PA.app(w.quiz);return a&&a.type==='quiz';}).slice(0,3);
  if(!main&&!ws.length) return '';
  let h=`<section class="card" aria-labelledby="today-h"><h2 id="today-h" class="pa-sr">きょうのれんしゅう</h2>`;
  if(main){
    const app=PA.app(main.app), meta=[when(main.t),lastDone(app)].filter(Boolean).join('・');
    h+=`<a class="go" href="${app.id}.html"><span class="ic" aria-hidden="true">${app.ic}</span><span class="tx"><span class="eye">▶️ つづきから</span><b>${ESC(app.title)}</b>${meta?`<span class="meta">${ESC(meta)}</span>`:''}</span></a>`;
  }
  // さいごがしくみのページ（練習はまだ）：その練習をすすめる
  const pr=!lp&&main?PA.app(PA.app(main.app).practice||''):null;
  if(pr) h+=`<div class="weakrow"><a href="${pr.id}.html"><span aria-hidden="true">${pr.ic}</span>${ESC(pr.title)}でれんしゅう</a></div>`;
  if(ws.length){
    // クイズが1つだけなら見出しに書き、ボタンは調の名前だけ
    const one=ws.every(w=>w.quiz===ws[0].quiz), q0=PA.app(ws[0].quiz);
    h+=`<div class="weakrow"><span class="wl">🔁 にがてを3もん${one?`（${ESC(q0.title)}）`:''}</span>`
      +ws.map(w=>{const a=PA.app(w.quiz);
        return `<a href="${ESC(PA.url(w.quiz,{key:w.id,n:3}))}" aria-label="${ESC(w.name+'（'+a.title+'）を3もん')}">${ESC(w.name)}${one?'':`<small>${ESC(a.title)}</small>`}</a>`;}).join('')
      +`</div>`;
  }
  return h+`</section>`;
}

/* ----- いつでも：伴奏づけ・聴きわけ・いちらん表 ----- */
function toolsHTML(){
  return `<h2 class="lbl" id="tools-h">いつでも</h2><nav class="tools" aria-labelledby="tools-h">`
    +TOOLS.map(([id,sub])=>{const a=PA.app(id);if(!a) return '';
      return `<a class="tool" href="${a.id}.html"><span class="ic" aria-hidden="true">${a.ic}</span><b>${ESC(a.title)}</b><small>${sub}</small></a>`;}).join('')
    +`</nav>`;
}

/* ----- コース：番号つきの単元 ----- */
function nextUnitId(vis){
  const u=COURSE.find(u=>u.apps.some(id=>!vis.has(id)));
  return u?u.id:null;
}
function quizStat(id){
  const t=PA.keyDeck.tally(id,{modes:TALLY_MODES[id]||['major','minor']});
  return {good:t.good,total:t.total};
}
function appRow(app,vis){
  const ty=typeOf(app), seen=vis.has(app.id);
  let st=`<span class="ty">${ty.label}</span>`;
  if(app.type==='quiz'&&seen){const q=quizStat(app.id);st+=`<span class="kd">できた調${q.good}／${q.total}</span>`;}
  else if(seen) st+=`<span class="seen">✓ ひらいた</span>`;
  return `<li><a class="arow" href="${app.href?ESC(app.href):app.id+'.html'}"><span class="ic" aria-hidden="true">${app.ic}</span>`
    +`<span class="tx"><b>${ESC(app.title)}</b><span class="d">${app.d}</span></span><span class="st">${st}</span></a></li>`;
}
function courseHTML(vis){
  const saved=PA.store.get('home-units',{}), sv=isObj(saved)?saved:{};
  const nx=nextUnitId(vis);
  const cards=COURSE.map((u,i)=>{
    const apps=u.apps.map(PA.app), n=apps.filter(a=>vis.has(a.id)).length, done=n===apps.length;
    const isNext=u.id===nx, open=typeof sv[u.id]==='boolean'?sv[u.id]:isNext;
    return `<details class="unit${isNext?' next':''}${done?' done':''}" data-d="unit-${u.id}" data-u="${u.id}"${open?' open':''}>`
      +`<summary><span class="no" aria-hidden="true">${done?'✓':i+1}</span><span class="ut"><b>${ESC(plainTitle(u.title))}${isNext?'<span class="nexttag">次</span>':''}</b>${u.sub?`<small>${ESC(u.sub)}</small>`:''}</span>`
      +`<span class="prog">${done?'<span class="pa-sr">おわった、</span>':''}${n}/${apps.length}<span class="pa-sr">ひらいた</span></span></summary>`
      +`<ul class="alist">${apps.map(a=>appRow(a,vis)).join('')}</ul></details>`;
  }).join('');
  return `<h2 class="lbl">コース</h2><div class="units">${cards}</div>`;
}

/* ----- さいごのおしらせ ----- */
function footHTML(){
  return `<details class="note foot" data-d="foot"><summary>ℹ️ 使いかたのメモ（⚙️ 設定${PA.native?'':'・ホーム画面'}・きろくのひかえ）</summary>
    <p>⚙️（右上）：音の名前（ドレミ／CDE／ハニホ）と基準の音（ラ＝440〜443Hz）。どのアプリも同じ設定です。</p>
    ${PA.native?'':'<p>📱 ホーム画面に追加すると、アプリのようにひらけて、ネットがなくても使えます。</p>'}
    <p>💾 きろくはこの端末の中だけ。ときどき ⚙️ → 💾 でファイルにひかえておこう。</p>
    ${PA.native?'':'<p>🏆 ランキングには、「和音の聴きわけ」の 🏆 チャレンジでのせられるよ（名前はニックネームで）。</p>'}</details>`;
}

function render(){
  const vis=visitedSet();
  const h=`<div class="stack home">${topHTML(vis)}${toolsHTML()}${courseHTML(vis)}${footHTML()}</div>`;
  PA.paint(document.getElementById('view'),h,'home');
}
// じぶんでひらいた／とじた単元だけおぼえる
document.getElementById('view').addEventListener('click',e=>{
  const sm=e.target.closest&&e.target.closest('details.unit>summary'); if(!sm) return;
  const d=sm.parentNode;
  setTimeout(()=>{const s=PA.store.get('home-units',{}), sv=isObj(s)?s:{};sv[d.dataset.u]=d.open;PA.store.set('home-units',sv);},0);
});
PA.store.set('return-to',null);
PA.mountBar({title:'ピアノ和音アプリ',back:'#'});
document.querySelector('#appbar a.iconbtn').outerHTML='<span class="iconbtn" aria-hidden="true">🎹</span>';
PA.onSettings=render;
PA.onPageShow=render;
render();
</script>
</body>
</html>
