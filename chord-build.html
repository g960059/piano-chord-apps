<style>
.chords{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cbtn{border-radius:16px;padding:6px 2px;background:var(--l);color:var(--d,var(--c));border:3px solid var(--c);display:flex;flex-direction:column;align-items:center;min-height:64px;justify-content:center}
.cbtn .num{font-size:26px;font-weight:800;line-height:1.1}
.cbtn .nm{font-size:12px;font-weight:700;line-height:1.3}
.cbtn.on{background:var(--d,var(--c));border-color:var(--d,var(--c));color:#fff}
.hero{border-top:6px solid var(--c)}
.hero-top{display:flex;gap:12px;align-items:center}
.hn{font-size:clamp(24px,7vw,36px);font-weight:800;color:var(--c);line-height:1.2}
.hk{font-weight:700;font-size:15px}
.hs{font-size:13px;color:var(--sub)}
.msg b.big{font-size:20px;color:var(--c)}
.ladder{min-width:600px}
.tips ol{margin:0;padding-left:1.3em}
.tips li{margin:6px 0}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.toprow .ken b{color:var(--ink);font-size:17px}
.ladder-more{margin-top:8px}
.ladder-more a{color:var(--ink);font-weight:700}
.nw{white-space:nowrap}
.hn{text-wrap:balance}
/* 📖 ことばメモ（くわしく知りたい人むけ。ふだんはとじておく） */
.terms dl{margin:0}
.terms dt{font-weight:800;margin:12px 0 2px}
.terms dt:first-child{margin-top:2px}
.terms dd{margin:0;line-height:1.65;overflow-wrap:break-word}
.terms rt{font-weight:400;font-size:.6em;color:var(--sub)}
</style>

<body>
<header class="appbar" id="appbar"></header>
<main class="page duo" id="view"></main>
<div class="actionbar" id="actions"></div>
<script src="assets/core.js"></script>
<script>
/* 和音のしくみ：各調のⅠ・Ⅳ・Ⅴ・Ⅴ7を「音階のなんばんめ」から「ひとつとばし」でつくる */
const CHORDS={I:{deg:0,n:3,label:'Ⅰ'},IV:{deg:3,n:3,label:'Ⅳ'},V:{deg:4,n:3,label:'Ⅴ'},V7:{deg:4,n:4,label:'Ⅴ7'}};
const ROM=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ'];
// 「ためしてみる」の和音クイズ：Ⅰ・Ⅳ・Ⅴと、いま見ている和音（Ⅴ7ならたす）
const tryChords=ch=>['I','IV','V'].concat(ch==='V7'?['V7']:[]);
// 文字につかうこい色（PA.COL のうすい地の上でも読みやすいこさ）
const DK={I:'#b8361f',IV:'#127048',V:'#1c5bb8',V7:'#6a32c0'};
const GREY='#6f667a'; // 小さな字のグレー（白の上でも読みやすいこさ）
const saved=PA.store.get('chord-build',{})||{};
const state={minor:!!saved.minor,keyIdx:0,chord:'I',speed:saved.speed==='slow'?'slow':'normal',anim:null,msg:null,autoWait:false};
if(Number.isInteger(saved.keyIdx)&&saved.keyIdx>=0&&saved.keyIdx<PA.keyCount(state.minor)) state.keyIdx=saved.keyIdx;
if(Object.prototype.hasOwnProperty.call(CHORDS,saved.chord)) state.chord=saved.chord;
const save=()=>PA.store.set('chord-build',{minor:state.minor,keyIdx:state.keyIdx,chord:state.chord,speed:state.speed});
// リンクの key（M0〜M12・m0〜m12）と chord（I・IV・V・V7）。ほかの値はすてる。
// 「もどる」で来たときはつかわない（あとからえらびなおした調・和音をもとにもどさない）
(function(){
  let back=false;
  try{const ne=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];back=ne?ne.type==='back_forward':!!(performance.navigation&&performance.navigation.type===2);}catch(e){}
  if(back) return;
  const p=PA.params(), k=p.key!=null?PA.keyDeck.parse(p.key):null, c=p.chord!=null&&Object.prototype.hasOwnProperty.call(CHORDS,p.chord)?p.chord:null;
  if(k){state.minor=k.minor;state.keyIdx=k.idx;}
  if(c) state.chord=c;
  if(k||c) save();
})();
const curKey=()=>PA.keyOf(state.minor,state.keyIdx,60); // 主音はド4〜シ4
const chordTones=(key,ch)=>{const c=CHORDS[ch];return Array.from({length:c.n},(_,j)=>PA.at(key.scale,c.deg+2*j));};
// 名前ごとに改行しないように（「フ|ァ」「ド|♯」とわれない）
const namesW=(ns,sep)=>ns.map(n=>`<span class="nw">${PA.nmH(n)}</span>`).join(sep);
// 白鍵どうしがとなりのところ（音の名前のせっていにあわせる）
const mifaH=()=>PA.nmH({letter:2,acc:0})+PA.nmH({letter:3,acc:0})+'・'+PA.nmH({letter:6,acc:0})+PA.nmH({letter:0,acc:0});
const skipsOf=ch=>{const c=CHORDS[ch];return Array.from({length:c.n-1},(_,j)=>c.deg+2*j+1);};
function chordSym(t){
  const r=PA.LET_EN[t[0].letter]+PA.ACC[t[0].acc];
  if(t.length===4) return PA.H(r+'7');
  return PA.H(r+((t[1].midi-t[0].midi)===3?'m':''));
}
function sigSentence(key){
  const s=PA.sigInfo(key);
  if(!s.letters.length) return key.minor?`調号なし → 白いけんばんを使うよ。でも7ばんめ「${PA.nmH(key.natLT)}」を半音上げた<b>「${PA.nmH(key.lt)}」</b>だけは黒いけんばん。`:'調号なし → <b>白いけんばんだけ</b>を使うよ。';
  return `調号は${s.type>0?'♯':'♭'}${s.letters.length}つ → <b>${s.letters.map(L=>PA.nmH({letter:L,acc:0})).join('・')}</b>にはいつも${s.type>0?'♯':'♭'}がつくよ。`;
}

/* ===== 音階のかいだん ===== */
function ladderSVG(key,o){
  const CW=58,G=5,CH=50,R=7,X0=8,BASE=220,N=14;
  const W=X0*2+N*(CW+G)-G, H=BASE+30, tones=o.tones||[], skips=o.skips||[], counts=o.counts||[];
  let s=`<svg viewBox="0 0 ${W} ${H}" class="ladder" role="img" aria-label="音階のかいだん">`;
  const dx=X0+7*(CW+G)-G/2, dTop=BASE-CH-7*R-56;
  s+=`<line x1="${dx}" y1="8" x2="${dx}" y2="${BASE+6}" stroke="#d9cfc2" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  s+=`<text x="${dx+6}" y="24" font-size="17" fill="${GREY}">ここから1オクターブ上 →</text>`; // スマホでは約0.67倍になるので大きめ
  const pos=k=>({x:X0+k*(CW+G),y:BASE-CH-k*R});
  for(let k=0;k<N-1;k++){ // となりどうし（半音）の目印
    if(PA.at(key.scale,k+1).midi-PA.at(key.scale,k).midi===1){const p=pos(k);s+=`<rect x="${p.x+CW+G/2-2.5}" y="${p.y+CH-22}" width="5" height="20" rx="2.5" fill="#f4a100"/>`;}
  }
  for(let k=0;k<N;k++){
    const {x,y}=pos(k), n=PA.at(key.scale,k), d=k%7;
    const isT=tones.includes(k), lit=!o.lit||o.lit.has(k);
    s+=`<g opacity="${lit||isT?1:0.4}">`;
    s+=`<rect x="${x}" y="${y}" width="${CW}" height="${CH}" rx="10" fill="${isT?o.color:(lit?'#fff':'#f4efe8')}" stroke="${isT?o.color:(d===0?'#bfb3a5':'#ddd2c4')}" stroke-width="2"/>`;
    s+=`<text x="${x+CW/2}" y="${y+CH/2+(n.raised?2:6)}" text-anchor="middle" font-size="${PA.nm(n).length>3?15:19}" font-weight="800" fill="${isT?'#fff':'#3a3245'}">${PA.Svg(PA.nm(n))}</text>`;
    if(n.raised) s+=`<text x="${x+CW/2}" y="${y+CH-3}" text-anchor="middle" font-size="14" font-weight="800" fill="${isT?'#fff':'#d1495b'}">半音上げ</text>`;
    // Ⅰ・Ⅳ・Ⅴは色つきの大きな太い字、Ⅱ・Ⅲ・Ⅵ・Ⅶは小さなグレー（どちらも読みやすいこさ）。上のオクターブは少し細く
    const big=[0,3,4].includes(d), rc=d===0?DK.I:d===3?DK.IV:d===4?DK.V:GREY;
    s+=`<text x="${x+CW/2}" y="${y+CH+19}" text-anchor="middle" font-size="${big?18:15}" font-weight="${big?(k<7?800:600):400}" fill="${rc}">${ROM[d]}</text>`;
    s+=`</g>`;
    if(skips.includes(k)) s+=`<text x="${x+CW/2}" y="${y-7}" text-anchor="middle" font-size="17" font-weight="700" fill="${GREY}">とばす</text>`;
    const ci=counts.indexOf(k);
    if(ci>=0) s+=`<circle cx="${x+CW/2}" cy="${y-15}" r="13" fill="#ffc93c"/><text x="${x+CW/2}" y="${y-10}" text-anchor="middle" font-size="15" font-weight="800" fill="#3a3245">${ci+1}</text>`;
  }
  for(let i=1;i<tones.length;i++){
    const a=pos(tones[i-1]), b=pos(tones[i]), ax=a.x+CW/2, bx=b.x+CW/2, top=Math.min(a.y,b.y)-38;
    s+=`<path d="M${ax+6} ${a.y-2} Q${(ax+bx)/2} ${top} ${bx-6} ${b.y-2}" fill="none" stroke="${o.color}" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>`;
  }
  if(o.frog!=null){const p=pos(o.frog);s+=`<text x="${p.x+CW/2}" y="${p.y-32}" text-anchor="middle" font-size="28">🐸</text>`;}
  return s+'</svg>';
}

/* ===== 画面 ===== */
function staticMsg(key,ch,tones){
  const c=CHORDS[ch];
  let m=`${PA.keyName(key)}の<b>${c.label}</b>は、音階の<b>${c.deg+1}ばんめ「${PA.nmH(tones[0])}」</b>からひとつとばしで${c.n}つ → <b class="big">${PA.namesH(tones)}</b>`;
  const r=tones.find(t=>t.raised);
  if(r) m+=`<br>🌙 短調なので、7ばんめの音は半音上げて<b>「${PA.nmH(r)}」</b>にするよ。`;
  return m;
}
function tipsHTML(key){
  const s=PA.sigInfo(key);
  const li=[
    `<b>ローマ数字＝音階のなんばんめ</b>。Ⅰは1ばんめ、Ⅳは4ばんめ、Ⅴは5ばんめの音からはじまる。`,
    `<b>ひとつとばし</b>で3つかさねる（だんご3きょうだい 🍡）。がくふでは<b>線・線・線</b>か<b>間・間・間</b>になる。`,
    `<b>Ⅴ7</b>は、Ⅴの上にもう1つ、ひとつとばしで音をのせた<b>4つの音</b>。`,
    s.letters.length?`<b>♯・♭は調号の音だけ</b>。この調では<b>${s.letters.map(L=>PA.nmH({letter:L,acc:0})).join('・')}</b>がいつも${s.type>0?'♯':'♭'}。まず白いけんばんで作って、調号の音だけ、となりのけんばんへ動かそう。`
      :`<b>${PA.keyName(key)}は調号なし</b>。${key.minor?'Ⅰ・Ⅳは白いけんばんだけを使うよ。Ⅴ・Ⅴ7はいちばん下の 🌙 を見てね。':'白いけんばんだけを使うよ。'}`,
    `けんばんの<b style="color:#9a5b00">オレンジの印</b>は${mifaH()}（白鍵どうしがとなり）。`
  ];
  if(key.minor) li.push(`🌙 <b>短調のⅤ・Ⅴ7</b>は、7ばんめの音「${PA.nmH(key.natLT)}」を<b>半音上げて</b>「${PA.nmH(key.lt)}」にする。だからⅤはいつも明るいひびき。`);
  return `<ol>${li.map(x=>`<li>${x}</li>`).join('')}</ol>`;
}
/* 📖 ことばメモ：本や楽譜で見かける名前をやさしく（いまの調・和音の音をれいに） */
const yomi=(w,y)=>`<ruby>${w}<rt>${y}</rt></ruby>`; // ふりがな
function termsHTML(key,ch,tones){
  const c=CHORDS[ch], dg=d=>`「${PA.nmH(PA.at(key.scale,d))}」`;
  const ROLE=['根音','第3音','第5音','第7音'];
  const roles=tones.map((t,j)=>`${ROLE[j]}「${PA.nmH(t)}」`).join('・');
  const lt=key.minor
    ?`音階の7ばんめの音。主音のすぐ下（となり）にあって、主音へ行きたがる音。短調では「${PA.nmH(key.natLT)}」を半音上げて「${PA.nmH(key.lt)}」にするよ。`
    :`音階の7ばんめの音${dg(6)}。主音のすぐ下（となり）にあって、主音へ行きたがる音。`;
  return `<details class="more terms" data-d="terms"><summary>📖 ことばメモ（本や楽譜で見かける名前）</summary><dl>
    <dt>${yomi('主音','しゅおん')}</dt>
    <dd>音階の1ばんめの音。いまの調では${dg(0)}。調の名前にもなる音だよ。</dd>
    <dt>${yomi('主和音','しゅわおん')}・${yomi('下属和音','かぞくわおん')}・${yomi('属和音','ぞくわおん')}</dt>
    <dd>Ⅰ・Ⅳ・Ⅴのべつのよびかた。いまの調ではⅠは${dg(0)}、Ⅳは${dg(3)}、Ⅴは${dg(4)}からつくる和音。</dd>
    <dt>${yomi('属七の和音','ぞくしちのわおん')}</dt>
    <dd>Ⅴ7のべつのよびかた。Ⅴの上にもう1つ、ひとつとばしで音をのせた4つの音の和音。</dd>
    <dt>${yomi('根音','こんおん')}・第3音・第5音・第7音</dt>
    <dd>「ひとつとばし」でつんだ和音の、それぞれの音の名前。いちばん下が<b>根音</b>、2つめが<b>第3音</b>、3つめが<b>第5音</b>、Ⅴ7の4つめが<b>第7音</b>。いまの${c.label}は${roles}。</dd>
    <dt>${yomi('導音','どうおん')}</dt>
    <dd>${lt}</dd>${key.minor?`
    <dt>${yomi('和声的短音階','わせいてきたんおんかい')}</dt>
    <dd>7ばんめの音を半音上げた短調の音階。🪜 かいだんの短調はこの音階だよ。</dd>`:''}
  </dl></details>`;
}
function render(){
  const key=curKey(), ch=state.chord, c=CHORDS[ch], tones=chordTones(key,ch), A=state.anim, col=PA.COL[ch];
  const kid=PA.keyDeck.id(state.minor,state.keyIdx);
  // 広い画面：左に説明（和音・かいだん）、右にけんばん・がくふ（下へすすんでもついてくる）。スマホではこれまでどおりたてにならぶ
  let h=`<div class="duo-grid"><div class="stack">
    <div class="toprow">${PA.keyChip(key)}<span class="note ken" style="margin:0">英語で書くと<b>${PA.keyEn(key)}</b></span></div>
    <div class="chords">`+Object.keys(CHORDS).map(k=>`<button class="cbtn ${k===ch?'on':''}" style="--c:${PA.COL[k]};--l:${PA.LCOL[k]};--d:${DK[k]}" data-act="chord" data-v="${k}" aria-pressed="${k===ch}"><span class="num">${CHORDS[k].label}</span><span class="nm">${namesW(chordTones(key,k),'<wbr>')}</span></button>`).join('')+`</div>
    <section class="card hero" style="--c:${col}">
      <div class="hero-top"><span class="badge" style="--c:${col}">${c.label}</span>
        <div style="min-width:0"><div class="hk">${PA.keyName(key)}の${c.label}</div><div class="hn">${namesW(tones,'・')}</div><div class="hs">コードネーム${chordSym(tones)}</div></div></div>
      <div class="msg" style="margin-top:10px">${A?A.msg:state.autoWait?'👆 どこかをタッチすると<b>つくりかた</b>がはじまるよ':(state.msg||staticMsg(key,ch,tones))}</div>
      <div class="row" style="margin-top:10px">${PA.seg('speed',[['normal','🐇 ふつう'],['slow','🐢 ゆっくり']],state.speed)}</div>
    </section>`;
  const shown=A?tones.filter(t=>A.tones.includes(t.k)):tones;
  const lad=A?{lit:A.scaleLit,counts:A.count,tones:A.tones,skips:A.skips,frog:A.frog,color:col}:{lit:null,counts:[],tones:tones.map(t=>t.k),skips:skipsOf(ch),color:col};
  h+=`<section class="card"><h2>🪜 音階のかいだん<small>下のローマ数字は「音階のなんばんめ」。オレンジの印＝となりどうし（半音）</small></h2><div class="scroll" data-sk="ladder" data-start="0%">${ladderSVG(key,lad)}</div>
    <p class="note ladder-more">グレーのⅡ・Ⅲ・Ⅵ・Ⅶからはじまる和音は<a href="${PA.esc(PA.url('diatonic',{key:kid}))}">「7つの和音」</a>で見られるよ。</p></section></div>`;
  const marks=new Map();
  shown.forEach(t=>marks.set(t.midi,{fill:col,label:PA.nm(t),focus:true}));
  if(A&&A.ghost) marks.set(A.ghost.midi,{fill:'#fff',ring:col,tc:col,label:PA.nm(A.ghost.note),focus:true});
  if(A){
    // いま鳴っている音（かえるのいる音、音階をならべているときは最後に光った音）を見えるところへ
    const lit=[...A.scaleLit], curK=A.frog!=null?A.frog:(lit.length&&lit.length<=8?lit[lit.length-1]:null);
    lit.forEach(k=>{const m=PA.at(key.scale,k).midi;if(!marks.has(m))marks.set(m,{fill:PA.BLACK.has(m%12)?'#8a7440':'#fff3c4',focus:k===curK&&!shown.length});});
  }
  h+=`<div class="stack duo-side"><section class="card"><h2>🎹 けんばん<small>さわると音が出るよ</small></h2><div class="scroll" data-sk="kb">${PA.kbSVG(60,88,marks)}</div></section>`;
  let staffNote='';
  if(shown.length){const st=PA.stepOf(shown[0]);staffNote=`ひとつとばしだから、この和音は<b>${(st-30)%2===0?'線・線・線':'間・間・間'}</b>にならぶよ。`;}
  h+=`<section class="card"><h2>🎼 がくふ</h2><div class="scroll" data-sk="staff">${PA.staffSVG(key,[{notes:shown,color:col,ltColor:'#d1495b',accColor:'#d1495b'}],{minW:220})}</div><p class="note">${staffNote}</p></section></div></div>`;
  h+=`<div class="duo-grid"><div class="stack"><details class="more tips"><summary>💡 おぼえかたのコツ</summary>${tipsHTML(key)}</details>${termsHTML(key,ch,tones)}</div>`
    // おなじ調のⅠ・Ⅳ・Ⅴ（いま見ている和音も入れる）。和音がかわるので3もんともおなじもんだいにならない
    +PA.tryHTML({to:'chord-quiz',params:{key:kid,chord:tryChords(ch).join(','),mode:'keys',n:3},
      title:`<span class="nw">${PA.keyName(key)}の</span><span class="nw">${tryChords(ch).map(x=>CHORDS[x].label).join('・')}を、</span><span class="nw">じぶんで</span><span class="nw">つくろう</span>`,
      sub:'「和音クイズ」で、けんばんをおさえて3もん。',btn:PA.icon('target')+'けんばんで3もん',
      links:[{to:'cadence',params:{key:kid},label:'🎵 カデンツできく'},{to:'chord-table',params:{key:kid,chord:ch},label:'📋 いちらん表で見る'}]})+`</div>`;
  PA.paint(document.getElementById('view'),h,state.minor+':'+state.keyIdx);
  if(state.anim) PA.follow(document.getElementById('view')); // アニメで光る鍵が見えるように
  PA.paint(document.getElementById('actions'),
    (A?`<button class="btn" data-act="stop">${PA.icon('stop')}とめる</button>`:`<button class="btn night" data-act="build">🐸 つくりかた</button>`)+
    `<button class="btn" data-act="play" data-hot="listen">${PA.icon('listen')}いっしょに</button><button class="btn" data-act="arp">${PA.icon('music')}ひとつずつ</button>`,'bar');
}

/* ===== つくりかたアニメ ===== */
let token=0;
function stop(){token++;state.anim=null;state.autoWait=false;PA.stopSound();}
async function build(){
  stop(); const my=token, alive=()=>my===token;
  const key=curKey(), ch=state.chord, c=CHORDS[ch], tones=chordTones(key,ch), D=state.speed==='slow'?1.6:1;
  const A={scaleLit:new Set(),count:[],tones:[],skips:[],frog:null,ghost:null,msg:''};
  state.anim=A; state.msg=null;
  const upd=m=>{if(m!==undefined)A.msg=m;render();};
  upd(`<b>①</b>まず${PA.keyName(key)}の音階（スケール）をならべるよ。<br>${sigSentence(key)}${key.minor&&PA.sigInfo(key).letters.length?'<br>🌙 短調の7ばんめは半音上げておくよ。':''}`);
  await PA.sleep(1300*D); if(!alive())return;
  for(let k=0;k<8;k++){A.scaleLit.add(k);upd();PA.playNote(PA.at(key.scale,k).midi,0,0.7,0.2);await PA.sleep(360*D);if(!alive())return;}
  for(let k=8;k<14;k++) A.scaleLit.add(k);
  upd(`<b>②</b> ${c.label}は、音階の<b>${c.deg+1}ばんめ</b>の音からはじまるよ。いっしょにかぞえよう！`);
  await PA.sleep(1300*D); if(!alive())return;
  for(let k=0;k<=c.deg;k++){A.count.push(k);A.frog=k;upd();PA.playNote(PA.at(key.scale,k).midi,0,0.5,0.17);await PA.sleep(620*D);if(!alive())return;}
  for(let j=0;j<c.n;j++){
    const t=tones[j];
    if(j===0){A.count=[];upd(`<b>③</b> ${c.deg+1}ばんめは<b>「${PA.nmH(t)}」</b>。ここが和音のいちばん下（根音）だよ。`);}
    else{
      const sk=c.deg+2*j-1; A.skips.push(sk); A.frog=sk;
      upd(`<b>${j===3?'⑤':'④'}</b>ひとつ<b>とばして</b>…`);
      await PA.sleep(800*D); if(!alive())return;
      A.frog=t.k;
      upd(j===3?`<b>⑤</b>Ⅴ7は、もうひとつとばして4つめの<b>「${PA.nmH(t)}」</b>をのせる！`:`<b>④</b>ひとつとばして<b>「${PA.nmH(t)}」</b>をのせる！`);
    }
    if(t.raised||t.acc!==0){
      const from=t.raised?{letter:t.letter,acc:key.sig[t.letter]}:{letter:t.letter,acc:0};
      A.ghost={midi:t.midi-(t.acc-from.acc),note:from}; render();
      await PA.sleep(900*D); if(!alive())return;
      A.msg+=t.raised?`<br>🌙「${PA.nmH(from)}」は短調なので半音上げて<b>「${PA.nmH(t)}」</b>！`:`<br>⚠️「${PA.nmH(from)}」は調号で<b>「${PA.nmH(t)}」</b>になるよ！`;
      A.ghost=null;
    }
    A.tones.push(t.k); upd(); PA.playNote(t.midi,0,1.1,0.22);
    await PA.sleep(1300*D); if(!alive())return;
  }
  A.frog=null;
  upd(`🎉 <b>できあがり！</b>${PA.keyName(key)}の${c.label}は<b class="big">${PA.namesH(tones)}</b>`);
  PA.chord(tones.map(t=>t.midi));
  await PA.sleep(1500*D); if(!alive())return;
  state.msg=A.msg; state.anim=null; render();
}

/* ===== 操作 ===== */
PA.mountBar({title:'和音のしくみ',app:'chord-build'});
PA.onSettings=render;
PA.onStopDown=stop;
PA.onStopCancel=render; // ⏹ をおしたのに指がずれたとき画面をもどす
PA.onKeySheet=()=>PA.openKeySheet({minor:state.minor,idx:state.keyIdx,both:true,onPick:(minor,idx)=>{
  stop(); state.minor=minor; state.keyIdx=idx; state.msg=null; save(); render(); PA.chord(chordTones(curKey(),state.chord).map(t=>t.midi));
}});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v, tones=()=>chordTones(curKey(),state.chord).map(t=>t.midi);
  if(a==='chord'){stop();state.chord=v;state.msg=null;save();render();PA.chord(tones());}
  else if(a==='play'){PA.chord(tones());}
  else if(a==='arp'){PA.chord(tones(),{arp:true});}
  else if(a==='build'){build();}
  else if(a==='stop'){stop();render();}
  else if(a==='speed'){state.speed=v;save();render();}
});
render();
// ほかのアプリの「つくりかたを見る」から来たとき：えらばれた調・和音でアニメをはじめる
// iPhone などではこのページをタッチするまで音が出ないので、音が出せるようになってからはじめる
// （音がとまっているあいだに音をよやくすると、あとでいっぺんに鳴ってしまう）
if(PA.store.get('chord-build-auto',false)) (async()=>{
  PA.store.set('chord-build-auto',false);
  const t0=token; // まっているあいだにほかの操作をしたらやめる
  if(PA.settings.sound){ // パソコンなどですぐ音が出せるならそのままはじめる
    PA.audio();
    for(let i=0;i<5&&!PA.audioRunning();i++) await PA.sleep(30);
  }
  if(token!==t0) return;
  if(!PA.settings.sound||PA.audioRunning()){build();return;}
  state.autoWait=true; render();
  const EV=['pointerup','touchend','keydown'];
  let busy=false;
  const off=()=>EV.forEach(t=>document.removeEventListener(t,go,true));
  async function go(e){
    if(!state.autoWait){off();return;}
    // ボタン・リンク・シートはそれぞれの操作にまかせる（つくりかた／調・和音をかえると待ちはおわる）
    const t=e&&e.target;
    if(t&&t.closest&&t.closest('button,a,dialog,.appbar,[data-act],[data-pa],[data-m]')) return;
    if(busy) return; busy=true;
    PA.audio(); // core もこのタッチで音を起こすので、動きだすのを少しまつ
    for(let i=0;i<15&&PA.settings.sound&&!PA.audioRunning();i++) await PA.sleep(30);
    busy=false;
    if(!state.autoWait){off();return;}
    if(PA.settings.sound&&!PA.audioRunning()) return; // まだ音が出せない：つぎのタッチをまつ
    off(); build();
  }
  EV.forEach(t=>document.addEventListener(t,go,true));
})();
</script>
</body>
</html>
