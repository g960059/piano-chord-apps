<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf8f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>カデンツ</title>
<link rel="stylesheet" href="assets/app.css">
<style>
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.formseg button{line-height:1.25;padding-block:6px}
.formseg button small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.seqlabel{margin:0 0 -4px;font-size:14px;color:var(--sub)}
.seq{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.scard{border-radius:14px;padding:6px 2px;background:var(--l);color:var(--c);border:3px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:72px;min-width:0}
.scard .num{font-size:24px;font-weight:800;line-height:1.15}
.scard .nm{font-size:11.5px;font-weight:700;line-height:1.3;text-align:center;display:flex;flex-direction:column-reverse;align-items:center} /* 1音1行。がくふと おなじく 下が ひくい音 */
.scard .nm span{display:block;white-space:nowrap}
.scard.on{background:var(--c);color:#fff;transform:translateY(-3px);box-shadow:0 4px 10px rgba(40,30,50,.15)}
.hero{border-top:6px solid var(--c)}
.hero-top{display:flex;gap:12px;align-items:center}
.hk{font-weight:700;font-size:15px}
.hn{font-size:clamp(22px,6.4vw,32px);font-weight:800;color:var(--c);line-height:1.25}
.hl{font-size:15px;font-weight:700}
.hl b{color:var(--c);font-size:20px}
.tag{display:inline-block;vertical-align:middle;margin-right:6px;padding:1px 8px;border-radius:999px;background:var(--soft2);color:var(--sub);font-size:12px;font-weight:700;line-height:1.6}
.hand{margin:0 0 2px;font-size:15px;font-weight:700}
.handblk{margin:10px auto 0}
.handblk:first-of-type{margin-top:0} /* 広い画面では 名前を けんばんの 左はしに そろえる */
.kbw{margin:0 auto}
.staffw{margin:0 auto}
.actionbar .btn{padding-inline:4px;gap:4px;overflow:hidden}
.actionbar .btn.nx{flex-grow:.6}
.nw{white-space:nowrap}
.msgs{display:grid;margin-top:10px}
.msgs>.msg{grid-area:1/1;display:flex;align-items:center} /* 高さは いちばん長い メッセージに そろえ、短い文は たて まん中に */
.lbl-n{display:none}
@media (max-width:359px){
  .actionbar{gap:6px}
  .actionbar .btn{font-size:14px;gap:2px;padding-inline:3px;letter-spacing:-.03em}
  .lbl-w{display:none}.lbl-n{display:inline}
}
.more ul{margin:0;padding-left:1.3em}
.more li{margin:6px 0}
/* 📖 用語メモ（くわしく 知りたい人むけ。ふだんは とじておく） */
.terms>summary small{font-weight:400;font-size:12px;color:var(--sub);margin-left:8px}
.terms dl{margin:0}
.terms dt{font-weight:800;margin:12px 0 2px}
.terms dt:first-child{margin-top:2px}
.terms dd{margin:0;line-height:1.65;overflow-wrap:break-word}
.terms dd ul{margin:4px 0 0}
.terms dd li{margin:4px 0}
.terms rt{font-weight:400;font-size:.6em;color:var(--sub)}
@media (min-width:600px){
  .seq{gap:8px}
  .scard .nm{font-size:13px}
  .scard .num{font-size:28px}
}
</style>
</head>
<body>
<header class="appbar" id="appbar"></header>
<main class="page" id="view"></main>
<div class="actionbar" id="actions"></div>
<script src="assets/core.js"></script>
<script>
/* カデンツ：Ⅰ → Ⅳ → Ⅰ → Ⅴ7 → Ⅰ を「なめらかな形（伴奏の形）」と「基本の形（ねもと）」で 聴いて・見る */
const SEQ=['I','IV','I','V7','I'];
const LABEL={I:'Ⅰ',IV:'Ⅳ',V7:'Ⅴ7'};
const FORMS=['inv','root'];
const saved=PA.store.get('cadence',{})||{};
const state={minor:!!saved.minor,keyIdx:0,form:FORMS.includes(saved.form)?saved.form:'inv',speed:saved.speed==='slow'?'slow':'normal',step:0,playing:false,more:false}; // more：💡の ひらきぐあい（ほぞんしない）
if(Number.isInteger(saved.keyIdx)&&saved.keyIdx>=0&&saved.keyIdx<PA.keyCount(state.minor)) state.keyIdx=saved.keyIdx;
if(Number.isInteger(saved.step)&&saved.step>=0&&saved.step<SEQ.length) state.step=saved.step; // 🐸 から ‹ で もどっても おなじ和音から
const save=()=>PA.store.set('cadence',{minor:state.minor,keyIdx:state.keyIdx,form:state.form,speed:state.speed,step:state.step});
const curKey=()=>PA.keyOf(state.minor,state.keyIdx,60); // 主音は ド4〜シ4

/* 右手：音階の なんばんめ（0＝主音、-1＝主音の ひとつ下）。左手：根音（ド3〜シ3） */
function cadData(key,form){
  const RH=form==='inv'?{I:[0,2,4],IV:[0,3,5],V7:[-1,3,4]}:{I:[0,2,4],IV:[3,5,7],V7:[4,6,8,10]};
  const ROOT={I:0,IV:3,V7:4};
  return SEQ.map(ch=>{
    const rh=RH[ch].map(k=>PA.at(key.scale,k)), r=PA.at(key.scale,ROOT[ch]);
    return {ch,rh,lh:[{...r,midi:48+PA.mod(r.midi,12)}]};
  });
}
const midisOf=d=>[...d.lh,...d.rh].map(n=>n.midi);
const isWhite=m=>!PA.BLACK.has(PA.mod(m,12));
const whiteCount=(lo,hi)=>{let c=0;for(let m=lo;m<=hi;m++) if(isWhite(m)) c++;return c;};
// 右手のけんばんの はんい：5つの和音 ぜんぶが入る（とちゅうで 鍵盤が うごかない）
function rhRange(data){
  const ms=data.flatMap(d=>d.rh.map(n=>n.midi));
  let lo=Math.min(...ms), hi=Math.max(...ms);
  if(!isWhite(lo)) lo--; if(!isWhite(hi)) hi++;
  for(let side=0;whiteCount(lo,hi)<8&&side<4;side++){ // スマホの はばに おさまるだけ まわりを足す
    if(side%2===0){lo--;while(!isWhite(lo))lo--;} else {hi++;while(!isWhite(hi))hi++;}
  }
  return [lo,hi];
}
const notesSpan=ns=>ns.map(n=>`<span>${PA.nmH(n)}</span>`).join('');

/* ===== 画面 ===== */
function stepMsg(key,data,step,form){
  const cur=data[step], prev=step>0?data[step-1]:null, lab=LABEL[cur.ch];
  const common=prev?cur.rh.filter(n=>prev.rh.some(p=>p.midi===n.midi)):[];
  // 5つの メッセージは 同じ場所に かさねるので（いちばん長いものの 高さになる）、和音ごとに かわることだけ 書く
  const ms=[];
  if(form==='inv'&&common.length) ms.push(`🟡「${PA.namesH(common)}」は 前の和音と おなじ けんばん → <b>そのまま</b> 動かさない！`);
  const r=cur.rh.find(n=>n.raised);
  if(r) ms.push(`🌙 短調なので、7ばんめの音は 半音上げて <b>「${PA.nmH(r)}」</b>にするよ。`);
  if(!ms.length) ms.push(step===0?'まずは Ⅰ。ここから スタート！':`${lab} は 根音「${PA.nmH(cur.lh[0])}」から ひとつとばしで つむよ。`);
  return {html:ms.join('<br>'),common};
}
function staffMinW(key){
  const ns=PA.sigInfo(key).letters.length, nx=50+ns*10+(ns?24:14), W=nx+SEQ.length*66+8;
  return Math.round(W*0.64);
}
/* 📖 用語メモ：正式な 名前（いまの 調・和音の 音を れいに） */
const yomi=(w,y)=>`<ruby>${w}<rt>${y}</rt></ruby>`; // ふりがな
const fn=(t,c)=>`<b style="color:${c}">${t}</b>`;
const ROOT_DEG={I:0,IV:3,V7:4};
const ROLE={0:'根音',2:'第3音',4:'第5音',6:'第7音'};
function termsHTML(key,data,step,form){
  const cur=data[step], lab=LABEL[cur.ch], lo=cur.rh[0], role=ROLE[PA.mod(lo.k-ROOT_DEG[cur.ch],7)];
  const INV={'第3音':'第1転回形','第5音':'第2転回形','第7音':'第3転回形'};
  const dg=d=>`「${PA.nmH(PA.at(key.scale,d))}」`;
  const T=fn('T',PA.COL.I), S=fn('S',PA.COL.IV), D=fn('D',PA.COL.V);
  const rhNow=role==='根音'
    ?`いまの ${lab} は 右手も いちばん下が 根音「${PA.nmH(lo)}」（基本形の ならび）。`
    :`いまの ${lab} の 右手だけを 見ると、いちばん下が ${role}「${PA.nmH(lo)}」で ${INV[role]}と おなじ ならび。`;
  return `<details class="more terms" data-d="terms"><summary>📖 用語メモ<small>正式な よびかた</small></summary><dl>
    <dt>T・S・D（和音の ${yomi('機能','きのう')}）</dt>
    <dd><ul>
      <li>${fn('T トニック',PA.COL.I)}＝Ⅰ（Ⅵ も T の なかま）：いちばん 落ちつく 和音。</li>
      <li>${fn('S サブドミナント',PA.COL.IV)}＝Ⅳ：T から はなれて、D や T へ すすむ。</li>
      <li>${fn('D ドミナント',PA.COL.V)}＝Ⅴ・Ⅴ7：T へ もどりたくなる。</li>
    </ul>すすみかたは ${T}→${S}・${D}、${S}→${D}・${T}、${D}→${T}。${D} から ${S} へは すすまない。</dd>
    <dt>カデンツ</dt>
    <dd>${T} で はじまり ${T} に もどる 和音の まとまり（型）。和声では ${T}→${D}→${T}（第1種）、${T}→${S}→${D}→${T}（第2種）、${T}→${S}→${T}（第3種）の 3つを カデンツと いう。この ページの Ⅰ→Ⅳ→Ⅰ→Ⅴ7→Ⅰ は 第3種と 第1種を つないだ 形。</dd>
    <dt>${yomi('終止形','しゅうしけい')}</dt>
    <dd>フレーズの 終わりかたの 名前。<ul>
      <li><b>${yomi('全終止','ぜんしゅうし')}</b>：Ⅴ（Ⅴ7）→ Ⅰ。しっかり おわる 感じ。この ページの さいごの Ⅴ7 → Ⅰ。</li>
      <li><b>${yomi('半終止','はんしゅうし')}</b>：Ⅴ で 区切る。まだ つづく 感じ。</li>
      <li><b>${yomi('変終止','へんしゅうし')}</b>：Ⅳ → Ⅰ。やわらかく おわる（「アーメン」の ひびき）。</li>
      <li><b>${yomi('偽終止','ぎしゅうし')}</b>：Ⅴ → Ⅵ など。Ⅰ に すすむと 見せて、ちがう和音へ。</li>
    </ul></dd>
    <dt>${yomi('基本形','きほんけい')}・${yomi('転回形','てんかいけい')}</dt>
    <dd>いちばん低い音が 根音なら <b>基本形</b>、第3音なら <b>第1転回形</b>、第5音なら <b>第2転回形</b>（Ⅴ7 は 第7音なら <b>第3転回形</b>）。形は 和音ぜんたいの いちばん低い音で きまる。この ページでは 左手が 根音を ひくので、🤲 なめらかな形 も 和音としては 基本形。${form==='inv'?'上の「転回形」は 右手だけの ならびの こと。'+rhNow+`なめらかな形の Ⅴ7 は 第5音${dg(1)}を ${yomi('省略','しょうりゃく')}している。`:''}</dd>
    <dt>${yomi('共通音','きょうつうおん')}</dt>
    <dd>となりあう 2つの和音に ふくまれる おなじ音（🟡 の わく）。和声では 共通音は おなじ高さで のこす（<b>${yomi('保留','ほりゅう')}</b>）のが 基本。Ⅰ と Ⅳ では 主音${dg(0)}、Ⅰ と Ⅴ・Ⅴ7 では 属音${dg(4)}。</dd>
  </dl></details>`;
}
let lastStep=-1;
function render(){
  const key=curKey(), data=cadData(key,state.form), step=state.step, cur=data[step], col=PA.COL[cur.ch], lab=LABEL[cur.ch];
  const M=stepMsg(key,data,step,state.form);
  let h=`<div class="stack">
    <div class="toprow">${PA.keyChip(key)}<span class="note" style="margin:0">${PA.keyEn(key)}</span></div>
    ${PA.seg('form',[['inv','🤲 なめらかな形<small>伴奏の形</small>'],['root','🧱 基本の形<small>ねもと</small>']],state.form,'full formseg')}
    <p class="note" style="margin:-4px 2px 0">${state.form==='inv'?'ならびかたが かわっても（右手は 転回形の ならび）、つかう音は おなじ 和音の音だよ。':'基本の形は、どれも 根音（いちばん下）から ひとつとばしで つんだ形。'}</p>
    <p class="seqlabel">Ⅰ → Ⅳ → Ⅰ → Ⅴ7 → Ⅰ　タップすると その和音が 鳴るよ</p>
    <div class="seq">`+data.map((d,i)=>`<button class="scard ${i===step?'on':''}" style="--c:${PA.COL[d.ch]};--l:${PA.LCOL[d.ch]}" data-act="step" data-v="${i}" aria-pressed="${i===step}" aria-label="${i+1}つめ ${LABEL[d.ch]}"><span class="num">${LABEL[d.ch]}</span><span class="nm">${notesSpan(d.rh)}</span></button>`).join('')+`</div>
    <section class="card hero" style="--c:${col}">
      <div class="hero-top"><span class="badge" style="--c:${col}">${lab}</span>
        <div style="min-width:0"><div class="hk">${PA.keyName(key)}の カデンツ　${step+1}つめ</div>
          <div class="hn"><span class="tag">右手</span>${cur.rh.map(n=>`<span class="nw">${PA.nmH(n)}</span>`).join(' ・ ')}</div>
          <div class="hl"><span class="tag">左手</span><b class="nw">${PA.nmH(cur.lh[0])}</b></div></div></div>
      <div class="msgs">${data.map((_,i)=>`<div class="msg" ${i===step?'':'aria-hidden="true" style="visibility:hidden"'}><span>${i===step?M.html:stepMsg(key,data,i,state.form).html}</span></div>`).join('')}</div>
      <div class="row" style="margin-top:10px">${PA.seg('speed',[['normal','🐇 ふつう'],['slow','🐢 ゆっくり']],state.speed)}</div>
    </section>`;
  // けんばん：上＝右手、下＝左手（がくふと 同じ ならび）
  const rmarks=new Map(), lmarks=new Map();
  cur.rh.forEach(n=>{const isC=state.form==='inv'&&M.common.some(x=>x.midi===n.midi);
    rmarks.set(n.midi,{fill:col,label:PA.nm(n),focus:true,ring:isC?'#f4a100':null,sub:isC?'そのまま':'',subColor:'#c98500'});});
  cur.lh.forEach(n=>{const blk=PA.BLACK.has(PA.mod(n.midi,12)); // 黒鍵は うすい色だと 見えないので、こい色＋うすく
    lmarks.set(n.midi,blk?{fill:col,light:true,tc:'#fff',label:PA.nm(n),sub:'左手',subColor:col,focus:true}
                         :{fill:PA.LCOL[cur.ch],tc:col,label:PA.nm(n),sub:'左手',subColor:col,focus:true});});
  const [rlo,rhi]=rhRange(data);
  const kb=(lo,hi,marks,sk,hand)=>`<div class="handblk" style="max-width:${whiteCount(lo,hi)*54}px"><div class="hand">${hand}</div><div class="scroll" data-sk="${sk}"><div class="kbw">${PA.kbSVG(lo,hi,marks)}</div></div></div>`;
  h+=`<section class="card"><h2>🎹 けんばん<small>こい色＝右手、うすい色＝左手。🟡のわく＝そのまま</small></h2>
    ${kb(rlo,rhi,rmarks,'kbr','✋ 右手')}
    ${kb(48,59,lmarks,'kbl','🤚 左手')}</section>`;
  const cols=data.map((d,i)=>({notes:d.rh,lh:d.lh,color:PA.COL[d.ch],accColor:'#d1495b',op:i===step?1:0.28,label:LABEL[d.ch],labelColor:PA.COL[d.ch]}));
  h+=`<section class="card"><h2>🎼 がくふ<small>いま ひいている和音が こい色。上が右手、下が左手</small></h2>
    <div class="scroll" data-sk="staff"><div class="staffw" style="min-width:${staffMinW(key)}px">${PA.staffSVG(key,cols,{grand:true,colW:66})}</div></div></section>`;
  h+=`<details class="more" data-d="tips" ${state.more?'open':''}><summary>💡 カデンツの ポイント</summary><ul>
      <li>左手は、和音の <b>根音</b>（基本の形で いちばん下に くる音）を ひくよ。</li>
      <li><b>🤲 なめらかな形</b>：前の和音と おなじ けんばんは <b>そのまま</b>。手が あまり 動かないので、伴奏で よく つかうよ。</li>
      <li>なめらかな形の <b>Ⅴ7</b> は、「${PA.nmH(PA.at(key.scale,1))}」を はぶいて 3つで ひくことが 多いよ。</li>
      <li><b>🧱 基本の形</b>：どれも 根音から <b>ひとつとばし</b>で つんだ形。</li>
      ${key.minor?`<li><b>🌙 短調</b>の Ⅴ7 は、7ばんめの音「${PA.nmH(key.natLT)}」を <b>半音上げて</b>「${PA.nmH(key.lt)}」に する。</li>`:''}
    </ul>
    <p style="margin:10px 0 0"><button class="btn small" data-act="howto">🐸 ${lab} の つくりかたを 見る</button></p></details>${termsHTML(key,data,step,state.form)}</div>`;
  const view=document.getElementById('view');
  PA.paint(view,h,state.minor+':'+state.keyIdx+':'+state.form);
  // 和音が かわったら 右手のけんばんを その和音の まん中へ（左手・がくふの 位置は そのまま）
  if(step!==lastStep){const b=view.querySelector('[data-sk="kbr"]'); if(b) PA.placeScroll(b);}
  lastStep=step;
  PA.paint(document.getElementById('actions'),
    (state.playing?`<button class="btn" data-act="stop">⏹ とめる</button>`:`<button class="btn primary" data-act="cplay" aria-label="ながして聴く">▶️ <span class="lbl-w">ながして聴く</span><span class="lbl-n">ながす</span></button>`)+
    `<button class="btn" data-act="again">🔊 もういちど</button><button class="btn nx" data-act="next" aria-label="つぎの和音">つぎ ➡</button>`,'bar');
}

/* ===== 音 ===== */
let token=0;
function stop(){token++;state.playing=false;PA.stopSound();}
const playStep=i=>PA.chord(midisOf(cadData(curKey(),state.form)[i]));
async function playCadence(){
  stop(); const my=token; state.playing=true;
  const data=cadData(curKey(),state.form), D=state.speed==='slow'?1.6:1;
  for(let i=0;i<data.length;i++){
    state.step=i; render();
    PA.chord(midisOf(data[i]));
    await PA.sleep((i===data.length-1?1600:1150)*D); if(my!==token) return;
  }
  state.playing=false; render();
}

/* ===== 操作 ===== */
PA.mountBar({title:'カデンツ',app:'cadence'});
PA.onSettings=render;
PA.onStopDown=stop;
PA.onStopCancel=render; // ⏹ を おしたのに click が 来なかったとき（指が ずれた）画面を もどす
PA.onKeySheet=()=>PA.openKeySheet({minor:state.minor,idx:state.keyIdx,both:true,onPick:(minor,idx)=>{
  stop(); state.minor=minor; state.keyIdx=idx; state.step=0; save(); render(); playStep(0);
}});
// 💡の ひらきぐあいを おぼえる（描きかえで とじないように）。toggle は バブルしないので capture
// 📖 用語メモ（data-d="terms"）は べつ（PA.paint が ひらきぐあいを たもつ）
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.d==='tips') state.more=d.open;},true);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v;
  if(a==='cplay'){playCadence();}
  else if(a==='stop'){stop();render();}
  else if(a==='step'){stop();state.step=+v;save();render();playStep(state.step);}
  else if(a==='again'){if(state.playing){stop();render();}playStep(state.step);}
  else if(a==='next'){stop();state.step=(state.step+1)%SEQ.length;save();render();playStep(state.step);}
  else if(a==='form'){stop();state.form=v;save();render();playStep(state.step);}
  else if(a==='speed'){state.speed=v;save();render();}
  else if(a==='howto'){
    stop(); save(); const ch=SEQ[state.step];
    PA.store.set('chord-build',{minor:state.minor,keyIdx:state.keyIdx,chord:ch,speed:state.speed});
    PA.store.set('chord-build-auto',true); PA.go('chord-build.html');
  }
});
render();
</script>
</body>
</html>
