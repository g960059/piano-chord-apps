<style>

.rec small{font-size:13px;color:var(--sub);font-weight:700}
/* 2回めから：せっていは1行にたたむ（おすとひらく） */
.topsum{padding:0}
.topbtn{display:flex;align-items:center;gap:6px;width:100%;min-height:52px;padding:6px 8px 6px 16px;border-radius:18px;text-align:left;font-weight:800;font-size:15px;line-height:1.3}

.topbtn .ts-go{flex:none;padding:6px 12px;border-radius:999px;background:var(--soft);font-size:14px}

/* まちがえたとき：えらんだ和音とせいかいをおなじ高さでくらべる */

.newbest{margin-top:10px;text-align:center;font-weight:800;color:#a86a00}
.warnnote{margin:4px 0 0;padding:8px 12px;border-radius:12px;background:var(--redl);color:#8f2233;font-weight:800;font-size:15.5px}

.fullbtn{width:100%;margin-top:10px}

.rkrow .nm .nmt{min-width:0;word-break:keep-all;overflow-wrap:anywhere} /* ながいなまえは2行に（とちゅうできらない） */
.rkrow .nm .you{flex:none;display:inline-block;margin-left:6px;white-space:nowrap;padding:0 8px;border-radius:999px;background:var(--night);color:#fff;font-size:12px;vertical-align:2px}
.rkrow .sc{text-align:right;line-height:1.25;white-space:nowrap}
.rkrow .sc b{font-size:15px}
.rkrow .sc small{display:block;font-size:12.5px;color:var(--sub);font-weight:700}

.mebox{margin-top:12px;padding-top:10px;border-top:2px dashed var(--line)}

.hero{border-top:6px solid #c98500;scroll-margin-top:64px}

.pdots,.rdots{display:inline-flex;align-items:center;gap:5px;vertical-align:middle}

.rinfo{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:8px;font-size:14px;color:var(--sub);font-weight:700}

.echoices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0 0}

  background:var(--soft2);color:var(--c);border:3px solid transparent;font-weight:800;line-height:1.25;text-align:center}
.echoice .em{font-size:30px;line-height:1.1}
.echoice .wd{font-size:20px}
.echoice .lb{font-size:15px;font-weight:700;color:var(--sub)}
.echoice.right .lb,.echoice.wrong .lb{color:inherit}
.echoices.many{gap:8px}
.echoices.many .echoice{min-height:84px;padding:8px 4px;border-radius:16px}
.echoices.many .echoice .em{font-size:24px}
.echoices.many .echoice .wd{font-size:17px}
.echoices.many .echoice .lb{font-size:13.5px}
.echoice.right{background:#dcf5e8;border-color:var(--ok);color:#137a4f}
.echoice.wrong{background:#fde4e7;border-color:var(--ng);color:#a3273a}
.echoice[disabled]{cursor:default}
.echoice.wait[disabled]{opacity:.55}
.fb{margin-top:12px;scroll-margin-top:72px}
.fb.still{animation:none}
.fb .sm{font-size:15px}
.chmsg{margin-top:10px;border-radius:14px;padding:10px 14px;font-size:16px;font-weight:700;background:var(--hint);border:2px dashed var(--hintline)}
.celebrate{margin-top:10px;border-radius:16px;padding:14px;text-align:center;background:linear-gradient(135deg,#fff3c4,#ffe0ef);font-size:19px;font-weight:800;line-height:1.45;animation:pop .5s ease}
.celebrate .fx{display:block;font-size:30px;letter-spacing:4px}
.celebrate.still{animation:none}
.resrow{margin-top:10px}
.resrow .btn{width:100%}
.kbwrap{margin-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--sub);margin-top:4px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.cmp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cmp .btn{flex-direction:column;gap:0;color:var(--c);padding:6px 6px;font-size:15px;border-radius:16px;min-height:56px}
.cmp .btn small{font-size:12.5px;font-weight:700;color:var(--sub)}
.hints{margin:8px 0 0;padding:0;list-style:none;font-size:15px}
.hints li{padding:5px 0;border-bottom:1px solid var(--line)}
.hints li:last-child{border-bottom:none}
@media (max-width:420px){.echoice{min-height:92px}}
@media (prefers-reduced-motion:reduce){.celebrate,.hearts .gone{animation:none}}
@media (min-width:700px){
  .seg.lvseg{grid-template-columns:repeat(4,1fr)}
  .echoices.n2{grid-template-columns:repeat(2,1fr)}
  .echoices.n3{grid-template-columns:repeat(3,1fr)}
  .echoices.n3 .echoice:last-child{grid-column:auto}
  .echoices.n4{grid-template-columns:repeat(4,1fr)}
  /* 5こ：3つ＋2つ（下の2つはまん中に） */
  .echoices.n5{grid-template-columns:repeat(6,1fr)}
  .echoices.n5 .echoice,.echoices.n5 .echoice:last-child{grid-column:span 2}
  .echoices.n5 .echoice:nth-child(4){grid-column:2/span 2}
  .echoices.n8{grid-template-columns:repeat(4,1fr)}
  /* 10こ：4つ＋4つ＋2つ（下の2つはまん中に） */
  .echoices.n10{grid-template-columns:repeat(8,1fr)}
  .echoices.n10 .echoice{grid-column:span 2}
  .echoices.n10 .echoice:nth-child(9){grid-column:3/span 2}
  .echoices.many .echoice{min-height:96px}
  .cmp{grid-template-columns:repeat(5,1fr)}
}

<body>
<header class="appbar" id="appbar"></header>
<main class="page" id="view"></main>
<div class="actionbar" id="actions"></div>
<script src="assets/core.js"></script>
<script src="assets/ear-game.js"></script>
<script>
/* 和音の聴きわけ：10しゅるいの和音を「ひびきの感じ」で当てる（レベル1〜8）。
 * 毎回根音・転回形・高さをかえるので、音名を計算せずに耳で答えるれんしゅうになる。
 * 📝 れんしゅう＝すきなレベルをえらぶ。なんどでもきける。こたえる前に「くらべてきく」をつかうと「ヒントでできた」
 *   （⭐ はふえないが、れんぞくはそのまま）。「📝 きょうの5もん」で5もんの回とけっかのカード。
 * 🏆 チャレンジ＝ランキング（もとの「和音ききわけ」）。ライフ3つ。5もんれんぞく正解でつぎのレベルへ、
 *   まちがえたらライフがへって1つ前のレベルへ。ライフ0でおわり → ニックネームでランキングにのせる。
 *   きまり（しゅるいの列・ライフ・レベル・もういちどきける回数）は assets/ear-game.js（サーバー src/worker.js とおなじ）。
 *   POST api/run でもらった seed からしゅるいをきめ、おわったら POST api/score に答えの列をおくる（サーバーが採点しなおす）。
 *   サーバーにつながらない（オフライン・file://・ふつうの静的サーバー）ときは、ランキングなしであそべる。
 *   こたえるまで「くらべてきく」はつかえない。
 * 📊 ランキング＝GET api/ranking（今週・ぜんぶ、上位50人とじぶんの順位）。
 * きろく：PA.store 'ear'（せってい・れんしゅう・とちゅうのチャレンジ）、'ear-best'（じぶんのチャレンジのきろく）、
 *   'ear-player'（ランダムな端末の番号）、'ear-name'（さいごにつかったニックネーム）、'ear-rank-intro'（なまえのせつめいを見た）。
 * つづりは3度ずつ（sus4は根音・4度・5度）つみかさねて正しく書き、重嬰・重変（x・𝄫）が出ない根音だけをつかう。
 * リンク：mode＝practice｜challenge、level＝1〜8（れんしゅう）、n＝1〜20（れんしゅうの回）。 */
/* ===== ここから test/ear.test.mjs もよむ（画面をつかわないところ） ===== */
const mod=PA.mod;
// ints：[根音からの文字のかず, 根音からの高さ]
const T={
  maj:{label:'長三和音',word:'明るい',emoji:'☀️',color:'#e8553d',sym:'',desc:'元気でまっすぐなひびき',ints:[[0,0],[2,4],[4,7]]},
  min:{label:'短三和音',word:'さびしい',emoji:'🌧️',color:'#3b4fa8',sym:'m',desc:'しずかで、さびしいひびき',ints:[[0,0],[2,3],[4,7]]},
  dim:{label:'減三和音',word:'きゅうくつ',emoji:'😖',color:'#8a5a2b',sym:'dim',desc:'せまくてきゅうくつ。ちょっとこわい',ints:[[0,0],[2,3],[4,6]]},
  aug:{label:'増三和音',word:'ふしぎ',emoji:'🌀',color:'#0d7f86',sym:'aug',desc:'ゆめの中みたいにゆらゆら。どこへ行くかわからない、ふしぎなひびき',ints:[[0,0],[2,4],[4,8]]},
  sus4:{label:'sus4',word:'ふわっと',emoji:'🎈',color:'#1e8a5a',sym:'sus4',desc:'「サスフォー」とよむよ。第3音のかわりに、文字で1つ上の音をのせた和音。ういていて、まだおわらない感じ',ints:[[0,0],[3,5],[4,7]]},
  dom7:{label:'Ⅴ7',word:'次へ行きたい',emoji:'➡️',color:PA.COL.V7,sym:'7',desc:'「次の和音へ行きたい！」とひっぱる',ints:[[0,0],[2,4],[4,7],[6,10]],fam:'V7'},
  maj7:{label:'長七',word:'おしゃれ',emoji:'✨',color:'#a86a00',sym:'M7',desc:'キラキラおしゃれ。明るくて、すこしせつない',ints:[[0,0],[2,4],[4,7],[6,11]]},
  min7:{label:'短七',word:'やさしいおとな',emoji:'🌙',color:'#2b6cb0',sym:'m7',desc:'やわらかくて、おとなっぽい',ints:[[0,0],[2,3],[4,7],[6,10]]},
  hdim7:{label:'半減七',word:'くもり・なぞ',emoji:'🌫️',color:'#5f6577',sym:'m7(♭5)',desc:'くもり空みたいな、なぞめいたひびき',ints:[[0,0],[2,3],[4,6],[6,10]]},
  dim7:{label:'減七',word:'ドキドキ',emoji:'😱',color:'#b0307a',sym:'dim7',desc:'あやしくてドキドキ。もりあがる場面やこわい場面で',ints:[[0,0],[2,3],[4,6],[6,9]],fam:'DIM'}
};
const ORDER=['maj','min','dim','aug','sus4','dom7','maj7','min7','hdim7','dim7'];
/* レベル：desc＝ボタンの小さな説明、replays＝🏆 チャレンジでこたえる前にもういちどきける回数（なし＝なんどでも。れんしゅうはいつもなんどでも）、
 * wide＝ひろい高さとひらいた形、arp＝さいしょはばらばらに鳴らす
 * name・types・replays・wide・arp は assets/ear-game.js の LEVELS とおなじ（ランキングの採点につかう。かえるときは両方。test/ear-game.test.mjs） */
const LEVELS=[null,
  {name:'はじめて',desc:'明るい・ドキドキ',types:['maj','dim7']},
  {name:'3しゅるい',desc:'明るい・さびしい・ドキドキ',types:['maj','min','dim7']},
  {name:'4しゅるい',desc:'明るい・さびしい・次へ・ドキドキ',types:['maj','min','dom7','dim7']},
  {name:'三和音4つ',desc:'明るい・さびしい・きゅうくつ・ふしぎ',types:['maj','min','dim','aug']},
  {name:'5しゅるい',desc:'明るい・さびしい・ふわっと・次へ・ドキドキ',types:['maj','min','sus4','dom7','dim7'],replays:3},
  {name:'七の和音',desc:'次へ・おしゃれ・おとな・ドキドキ',types:['dom7','maj7','min7','dim7'],replays:3,wide:true},
  {name:'8しゅるい',desc:'三和音4つ・七の和音4つ',types:['maj','min','dim','aug','dom7','maj7','min7','hdim7'],replays:2,wide:true},
  {name:'ぜんぶ',desc:'10しゅるいぜんぶ',types:ORDER.slice(),replays:2,wide:true,arp:true}];
const MAXLV=8, CLEAR=5;
// もういちどきける回数（null＝なんどでも）。回数がきまるのはチャレンジだけ
const replaysOf=(lv,mode)=>mode==='ch'&&LEVELS[lv].replays!=null?LEVELS[lv].replays:null;

/* ===== 短調のⅤ7・減七とⅠへの解決（Ⅴの家族とおなじきまり） ===== */
const FAM={V7:{ks:[4,6,8,10]},DIM:{ks:[6,8,10,12]}};
// 主音が高い調では、和音を1オクターブ下に置く
const famShift=key=>key.tonicMidi+7>70?-7:0;
const famTones=(key,f)=>FAM[f].ks.map(k=>PA.at(key.harm,k+famShift(key)));
// 解決：根音はそのまま（Ⅰの第5音）、導音→主音、第5音→主音、第7音→第3音、第9音→第5音
const RESOLVE={V7:{4:4,6:7,8:7,10:9},DIM:{6:7,8:7,10:9,12:11}};
const KEYS=PA.MINOR_KEYS.map((_,i)=>PA.minorKey(i)); // 主音はラ3〜ソ♯4
// 重嬰（x）が出る調（嬰ト短調・嬰ニ短調）はつかわない
const FAM_KEYS=KEYS.filter(k=>['V7','DIM'].every(f=>famTones(k,f).every(n=>Math.abs(n.acc)<=1))).map(k=>k.idx);
const FAM_NO=['①','②','③']; // 減七の3つのなかま（minor-family とおなじよびかた）
// 嬰ニ短調（重嬰が出る）をつかわないので、ミ♭7だけは調なしでつくる（根音の高さ12こぜんぶが出るように）
const EB7=[2,-1];

/* ===== 根音から和音をつくる（つづりは文字で3度ずつ） ===== */
// 根音のこうほ：ド♭・ファ♭・ミ♯・シ♯は根音にしない
const ROOTS=[];
for(let L=0;L<7;L++) for(const a of [-1,0,1]) if(!((L===0||L===3)&&a<0)&&!((L===2||L===6)&&a>0)) ROOTS.push([L,a]);
function build([L,a],type,base=55){
  const rpc=mod(PA.NAT[L]+a,12), r=base+mod(rpc-base,12);
  return T[type].ints.map(([lo,s])=>{const LL=(L+lo)%7;return {letter:LL,acc:PA.spell(LL,rpc+s),midi:r+s};});
}
// しゅるいごとに、x・𝄫 が出ない根音だけ
const ROOTS_BY={};
ORDER.forEach(t=>{ROOTS_BY[t]=ROOTS.filter(rt=>build(rt,t).every(n=>Math.abs(n.acc)<=1));});
// r：乱数（[0,1) をかえす関数）。なければ Math.random（🏆 チャレンジはサーバーのたねからつくった乱数をわたす）
const pick=(a,r)=>a[Math.floor((r||Math.random)()*a.length)];
function pickRoot(type,r){
  // 高さ（黒鍵・白鍵）を同じかくりつでえらんでから、つづりをえらぶ
  const rs=ROOTS_BY[type], pcs=[...new Set(rs.map(([L,a])=>mod(PA.NAT[L]+a,12)))];
  const pc=pick(pcs,r), cs=rs.filter(([L,a])=>mod(PA.NAT[L]+a,12)===pc);
  // おなじ高さなら、♯・♭がすくないつづりを（同じかずならランダム）
  const nAcc=rt=>build(rt,type).filter(n=>n.acc).length, best=Math.min(...cs.map(nAcc));
  return pick(cs.filter(rt=>nAcc(rt)===best),r);
}
// くらべてきく：おなじ「ド」からつくった10しゅるい（音名は出さない）
const CMP={}; ORDER.forEach(t=>{CMP[t]=T[t].ints.map(([,s])=>60+s);});

const isInt=(v,lo,hi)=>Number.isInteger(v)&&v>=lo&&v<=hi;
function sameTones(want,notes){
  return want.length===notes.length&&want.every(w=>notes.filter(n=>n.letter===w.letter&&n.acc===w.acc).length===1);
}
// 保存されたもんだいがただしい形かたしかめる
function validQ(q,lv){
  const L=LEVELS[lv];
  if(!L||!q||typeof q!=='object'||q.lv!==lv||!L.types.includes(q.type)||!Array.isArray(q.notes)) return false;
  const t=T[q.type], n=q.notes;
  if(n.length!==t.ints.length) return false;
  if(!n.every((x,i)=>x&&typeof x==='object'&&isInt(x.letter,0,6)&&isInt(x.acc,-1,1)&&isInt(x.midi,36,96)
    &&mod(PA.NAT[x.letter]+x.acc-x.midi,12)===0&&(i===0||x.midi>n[i-1].midi))) return false;
  if(n[n.length-1].midi-n[0].midi>=24) return false;
  const r=q.root;
  if(!r||typeof r!=='object'||!isInt(r.letter,0,6)||!isInt(r.acc,-1,1)) return false;
  if(!sameTones(build([r.letter,r.acc],q.type),n)) return false;
  if(typeof q.open!=='boolean') return false;
  if(t.fam&&!(q.type==='dom7'&&q.keyIdx==null&&r.letter===EB7[0]&&r.acc===EB7[1])){
    if(!FAM_KEYS.includes(q.keyIdx)) return false;
    const ref=famTones(KEYS[q.keyIdx],t.fam);
    return n.every(x=>Number.isInteger(x.k)&&ref.some(f=>f.k===x.k&&f.letter===x.letter&&f.acc===x.acc&&mod(f.midi-x.midi,12)===0))
      &&new Set(n.map(x=>x.k)).size===n.length;
  }
  return q.keyIdx==null&&ROOTS_BY[q.type].some(([L,a])=>L===r.letter&&a===r.acc);
}

/* ===== もんだいをつくる ===== */
// 転回形・高さ（wide のときはひろい高さと、ひらいた形も）をランダムに
function voice(notes,lv,r){
  const L=LEVELS[lv]; r=r||Math.random;
  notes=notes.map(n=>({...n}));
  const inv=Math.floor(r()*notes.length);
  for(let i=0;i<inv;i++) notes[i].midi+=12;
  notes.sort((a,b)=>a.midi-b.midi);
  let open=false;
  // ひらいた形：下から2ばんめの音を1オクターブ上へ（いちばん下の音はそのまま）
  if(L.wide&&r()<0.5){notes[1].midi+=12;notes.sort((a,b)=>a.midi-b.midi);open=true;}
  const [loMin,loMax,topMax]=L.wide?[45,67,88]:[50,64,79];
  const lo=notes[0].midi, hi=notes[notes.length-1].midi, opts=[];
  for(let s=-48;s<=48;s+=12) if(lo+s>=loMin&&lo+s<=loMax&&hi+s<=topMax) opts.push(s);
  const s=pick(opts,r); notes.forEach(n=>n.midi+=s);
  return {notes,open};
}
// れんしゅう：しゅるいもランダム（前とおなじなら60% でえらびなおす）
function makeQ(lv,prevType,mode){
  const types=LEVELS[lv].types;
  let type=pick(types);
  if(prevType===type&&Math.random()<0.6) type=pick(types);
  return makeQOf(type,lv,mode);
}
/* しゅるいをきめて和音をつくる。🏆 チャレンジはしゅるいを assets/ear-game.js（サーバーのたね）できめ、
 * 根音・転回形・高さは r（べつの乱数）できめる。おなじ r ならおなじ和音（とちゅうからもどすときおなじもんだいになる） */
function makeQOf(type,lv,mode,r){
  r=r||Math.random;
  const t=T[type];
  let base,keyIdx=null,root;
  if(type==='dom7'&&Math.floor(r()*(FAM_KEYS.length+1))===FAM_KEYS.length){
    base=build(EB7,type); root={letter:EB7[0],acc:EB7[1]};
  }else if(t.fam){
    keyIdx=pick(FAM_KEYS,r);
    base=famTones(KEYS[keyIdx],t.fam).map(n=>({letter:n.letter,acc:n.acc,midi:n.midi,k:n.k}));
    const rk=t.fam==='V7'?4:6, rn=base.find(n=>mod(n.k,7)===rk);
    root={letter:rn.letter,acc:rn.acc};
  }else{
    const [L,a]=pickRoot(type,r);
    base=build([L,a],type); root={letter:L,acc:a};
  }
  const v=voice(base,lv,r);
  return {type,lv,mode,open:v.open,keyIdx,root,notes:v.notes};
}
/* まちがえたとき「えらんだ和音」を、もんだいとおなじ根音・おなじつみかたで鳴らす（ちがうのはしゅるいだけ）。
 * もんだいの音が根音・3ばんめ（sus4は4ばんめ）・5ばんめ・7ばんめのどれで、根音からなんオクターブはなれているかをそのままつかう。
 * 三和音 → 七の和音：7ばんめは5ばんめとおなじオクターブにたす（いちばん下の音はかわらない）。七の和音 → 三和音：7ばんめをとる。
 * かえす：midi の高さ（下からじゅんに） */
function abNotes(q,type){
  const rpc=mod(PA.NAT[q.root.letter]+q.root.acc,12), from=T[q.type].ints;
  const rn=q.notes.find(n=>mod(n.midi-rpc,12)===0);
  const oct=from.map(([,s])=>{const n=q.notes.find(x=>mod(x.midi-rn.midi-s,12)===0);return n?n.midi-rn.midi-s:0;});
  return T[type].ints.map(([,s],i)=>rn.midi+s+oct[Math.min(i,oct.length-1)]).sort((a,b)=>a-b);
}
// リンクのパラメータ（先生がおくる）：ただしい値だけ。level・n はれんしゅうのせってい
function readLink(p){
  const o={mode:null,level:null,n:null}, s=k=>p&&typeof p[k]==='string'?p[k]:'';
  if(s('mode')==='practice') o.mode='free'; else if(s('mode')==='challenge') o.mode='ch';
  if(/^[1-8]$/.test(s('level'))) o.level=+s('level');
  if(/^\d{1,2}$/.test(s('n'))&&+s('n')>=1&&+s('n')<=20) o.n=+s('n');
  if(o.mode==='ch'){o.level=null;o.n=null;} // チャレンジはいつもレベル1かつづきから
  else if(o.level!=null||o.n!=null) o.mode='free';
  return o;
}
/* ===== ここまで ===== */

/* ===== 🏆 チャレンジ（ランキング）のきまりは assets/ear-game.js（サーバー src/worker.js とおなじファイル） =====
 * 上の LEVELS（しゅるい・もういちどきける回数・wide・arp）と ORDER が ear-game.js とおなじことは test/ear-game.test.mjs でたしかめる。 */
const EG=window.EarGame, CH=EG.CHALLENGE;
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const isSeed=v=>Number.isInteger(v)&&v>=-2147483648&&v<=4294967295;
const RUN_KEEP=12*3600e3; // とちゅうのチャレンジをのこす時間（ランキングにのせられるのははじめてから2時間まで）

/* ===== 状態（保存する：和音クイズとおなじきまり） ===== */
// mode：'free'＝📝 れんしゅう、'ch'＝🏆 チャレンジ、'rank'＝📊 ランキング
// q・answer・left・resShown・hinted：いま見えているもんだい（チャレンジのときはチャレンジのもんだい）
// hinted：こたえる前に「くらべてきく」をつかった（れんしゅうだけ）
// lvBest[lv]：れんしゅうでそのレベルのさいこうれんぞく（CLEAR いじょうで ✓）、lvRun：いまのレベルのれんぞく
// topOpen：上のせっていのカードをひらいているか（はじめてのときだけひらいて出す。2回めからは1行にたたむ）
// sessLv：📝 きょうの5もんをはじめたときのレベル（けっかのカードとリンクにつかう）、sessMix：とちゅうでレベルをかえた
const state={mode:'free',level:1,q:null,answer:null,left:null,right:0,hint:0,total:0,streak:0,resShown:false,qn:0,fresh:false,askedAt:0,
  hinted:false,lvBest:[0,0,0,0,0,0,0,0,0],lvRun:0,topOpen:true,sessLv:0,sessMix:false};
/* 🏆 チャレンジ（1回ぶん）。ライフ3つ・5もんれんぞく正解でレベルアップ・まちがえたら1つ前のレベルへ。
 *  phase：'intro'（はじめる前）｜'connecting'（サーバーにつないでいる）｜'offline'（つながらなかった）｜'play'｜'result'
 *  runId（サーバーの番号。ランキングなしのときは null）・seed（しゅるいの列のたね）・offline・offWhy（'net'＝つながらない｜'busy'＝こみあっている｜'time'＝2時間すぎた）・startedAt
 *  run：EG.createRun(seed)（しゅるいとライフ・レベル）、vrng：音の乱数（mulberry32(voiceSeed(seed))）
 *  heard：いまのもんだいを1回きいた（まだなら「▶️ きく」。この1回めは「もういちど」にかぞえない）
 *  event：さいごにこたえたときのできごと（ok・up・master・down・over）、capped：600もんこたえた
 *  q・answer・left・resShown：れんしゅう・ランキングを見ているあいだとっておくチャレンジのもんだい
 *  best：チャレンジでクリアしたいちばん上のレベル（レベルのボタンの 🏆）
 *  けっか：newBest・endedEarly・name（{cands,sel,pick,custom}）・sending・sendError・submitted（サーバーのへんじ）・closed（{kind:'already'|'gone',msg}） */
const ch={phase:'intro',voice:null,runId:null,seed:0,offline:false,offWhy:'',startedAt:0,run:null,vrng:null,heard:false,event:null,capped:false,
  q:null,answer:null,left:null,resShown:false,best:0,connectError:'',connectBusy:false,newBest:false,endedEarly:false,
  name:{cands:[],sel:0,pick:0,custom:''},sending:false,sendError:null,submitted:null,closed:null};
// 📊 ランキング：period＝'week'｜'all'、data[period]＝{top, me, week}
const rk={period:'week',data:{week:null,all:null},loading:false,error:null,req:0};
const curLevel=()=>state.mode==='ch'&&ch.run?ch.run.state.level:state.level;
const normQ=(q,lv)=>({type:q.type,lv,mode:q.mode,open:q.open,keyIdx:q.keyIdx==null?null:q.keyIdx,root:{letter:q.root.letter,acc:q.root.acc},
  notes:q.notes.map(x=>({letter:x.letter,acc:x.acc,midi:x.midi,...(x.k!=null?{k:x.k}:{})}))});

/* ----- チャレンジのもんだい：しゅるいは ear-game.js、音は vrng ----- */
// seed と答えからもどす（音の乱数もおなじじゅんにすすめるので、つぎのもんだいもおなじ和音になる）
function rebuildRun(seed,answers){
  const run=EG.createRun(seed), vrng=EG.mulberry32(EG.voiceSeed(seed));
  for(let i=0;i<answers.length&&!run.state.over;i++){makeQOf(run.type(),run.state.level,'ch',vrng);run.answer(answers[i]);}
  return {run,vrng};
}
const chNewQ=()=>makeQOf(ch.run.type(),ch.run.state.level,'ch',ch.vrng);
// いま見えているチャレンジのもんだい（れんしゅうを見ているときはとっておいたもの）
const chView=()=>state.mode==='ch'?{q:state.q,answer:state.answer,left:state.left,resShown:state.resShown}:{q:ch.q,answer:ch.answer,left:ch.left,resShown:ch.resShown};
function chHide(){
  ch.q=state.q; ch.answer=state.answer; ch.left=state.left; ch.resShown=state.resShown;
  state.q=null; state.answer=null; state.left=null; state.resShown=false;
}
function chShow(){
  // とちゅうなのにもんだいがない（ふつうはない）：つぎのもんだいを用意して「▶️ きく」をまつ
  if(ch.phase==='play'&&ch.run&&!ch.q){ch.q=chNewQ();ch.answer=null;ch.left=replaysOf(ch.q.lv,'ch');ch.heard=false;}
  state.q=ch.q; state.answer=ch.answer; state.left=ch.left; state.resShown=ch.resShown; state.hinted=false; state.askedAt=0; state.qn++;
  ch.q=null; ch.answer=null; ch.left=null; ch.resShown=false;
}
const unsent=()=>!NO_RANK&&!!ch.run&&ch.phase==='result'&&!ch.offline&&!ch.submitted&&!ch.closed&&ch.run.answers.length>0;
function chSaved(){
  if(!ch.run||!(ch.phase==='play'||unsent())) return null;
  const v=chView();
  return {voice:ch.voice,runId:ch.runId,seed:ch.seed,offline:ch.offline,offWhy:ch.offWhy,startedAt:ch.startedAt,answers:ch.run.answers.slice(),phase:ch.phase,
    q:v.answer?v.q:null,answer:v.answer||null,event:v.answer?ch.event:null,resShown:!!(v.answer&&v.resShown),
    left:v.answer?null:v.left,heard:!v.answer&&ch.heard,newBest:ch.newBest,endedEarly:ch.endedEarly};
}
function chRestore(c){
  if(!isObj(c)) return;
  const ok=isSeed(c.seed)&&typeof c.offline==='boolean'&&(c.offline?c.runId==null:typeof c.runId==='string'&&UUID_RE.test(c.runId))
    &&Number.isFinite(c.startedAt)&&Array.isArray(c.answers)&&c.answers.length<=CH.maxAnswers&&c.answers.every(EG.isTypeId)
    &&(c.phase==='play'||c.phase==='result');
  if(!ok||c.startedAt>Date.now()+6e4||Date.now()-c.startedAt>RUN_KEEP) return;
  if(c.phase==='result'&&!c.answers.length) return;
  const rb=rebuildRun(c.seed,c.answers);
  const off=c.offline||NO_RANK; // アプリ：ウェブのひかえからもどしたチャレンジも、ランキングなし
  // 音色のない前の版の記録は、合成の音で鳴らしていた
  Object.assign(ch,{voice:c.voice==='piano'?'piano':'synth',runId:off?null:c.runId,seed:c.seed,offline:off,offWhy:off?(c.offWhy==='time'||c.offWhy==='busy'?c.offWhy:'net'):'',startedAt:c.startedAt,
    run:rb.run,vrng:rb.vrng,heard:false,event:null,capped:false,q:null,answer:null,left:null,resShown:false,
    newBest:c.newBest===true,endedEarly:c.endedEarly===true,sending:false,sendError:null,submitted:null,closed:null});
  const st=rb.run.state;
  if(c.phase==='result'||st.over||rb.run.answers.length>=CH.maxAnswers){
    // けっかを見る前にとじたときはここでじこベストをきろく（けっかの画面でとじたときはもうきろくずみ）
    if(c.phase==='result') finishRun(ch.endedEarly,false); else finishRun(false,true);
    return;
  }
  ch.phase='play';
  const last=st.history[st.history.length-1];
  if(c.answer&&last&&validQ(c.q,last.level)&&c.q.mode==='ch'&&c.q.type===last.type&&c.answer===last.answer&&c.event===last.event){
    // こたえあわせを見ていた（「Ⅴの家族で見る」からもどったなど）：おなじこたえあわせを出す
    ch.q=normQ(c.q,last.level); ch.answer=c.answer; ch.event=c.event; ch.resShown=c.resShown===true&&ch.q.keyIdx!=null; ch.heard=true;
  }else{
    ch.q=chNewQ();
    const R=replaysOf(ch.q.lv,'ch');
    ch.left=R==null?null:isInt(c.left,0,R)?c.left:R; ch.heard=c.heard===true;
  }
}
function chClear(){
  Object.assign(ch,{voice:null,phase:'intro',runId:null,seed:0,offline:false,offWhy:'',startedAt:0,run:null,vrng:null,heard:false,event:null,capped:false,
    q:null,answer:null,left:null,resShown:false,connectError:'',connectBusy:false,newBest:false,endedEarly:false,sending:false,sendError:null,submitted:null,closed:null});
  if(state.mode==='ch'){state.q=null;state.answer=null;state.left=null;state.resShown=false;}
}

function load(){
  const d0=PA.store.get('ear',{}), d=isObj(d0)?d0:{};
  if(d.mode==='free'||d.mode==='ch'||(d.mode==='rank'&&!NO_RANK)) state.mode=d.mode;
  if(isInt(d.level,1,MAXLV)) state.level=d.level;
  if(isInt(d.total,0,1e6)&&isInt(d.right,0,d.total)&&isInt(d.streak,0,d.right)){state.right=d.right;state.total=d.total;state.streak=d.streak;
    if(isInt(d.hint,0,d.total-d.right)) state.hint=d.hint;}
  if(Array.isArray(d.lvBest)&&d.lvBest.length===MAXLV+1&&d.lvBest.every(x=>isInt(x,0,1e6))) state.lvBest=d.lvBest.slice();
  if(isInt(d.lvRun,0,1e6)){state.lvRun=d.lvRun;state.lvBest[state.level]=Math.max(state.lvBest[state.level],d.lvRun);}
  state.topOpen=d.seen!==true;
  if(isInt(d.sessLv,1,MAXLV)){state.sessLv=d.sessLv;state.sessMix=d.sessMix===true;}
  if(d.rkPeriod==='week'||d.rkPeriod==='all') rk.period=d.rkPeriod;
  const c=isObj(d.ch)?d.ch:{};
  if(isInt(c.best,0,MAXLV)) ch.best=c.best;
  // れんしゅうのもんだい：「Ⅴの家族で見る」からもどったときも、さっきのもんだいとこたえをそのまま出す
  if(state.mode==='free'&&validQ(d.q,state.level)&&d.q.mode==='free'){
    state.q=normQ(d.q,state.level);
    if(LEVELS[state.level].types.includes(d.answer)) state.answer=d.answer;
    state.resShown=!!state.answer&&state.q.keyIdx!=null&&d.resShown===true;
    state.hinted=d.hinted===true;
    state.qn=1;
  }
  // v3までのチャレンジ（ライフなし・ランキングなし）はつづけない。とちゅうのチャレンジ（v4）はつづきから
  if(d.v===4) chRestore(c.run);
  if(state.mode==='ch') chShow();
}
const save=()=>PA.store.set('ear',{v:4,mode:state.mode,level:state.level,right:state.right,hint:state.hint,total:state.total,streak:state.streak,
  lvBest:state.lvBest,lvRun:state.lvRun,seen:true,sessLv:state.sessLv,sessMix:state.sessMix,rkPeriod:rk.period,
  ch:{best:ch.best,run:chSaved()},
  q:state.mode==='free'?state.q:null,answer:state.mode==='free'?state.answer:null,resShown:state.mode==='free'&&state.resShown,hinted:state.hinted});

function newEar(){
  const lv=curLevel();
  state.q=makeQ(lv,state.q&&state.q.type,state.mode);
  state.answer=null; state.resShown=false; state.left=replaysOf(lv,state.mode); state.hinted=false; state.qn++; save();
}
// チャレンジがピアノではじまったのに、まだ録音が読めていない（とちゅうでページをひらきなおした）：
// 読めるまで、チャレンジの音を出すボタン（CH_SOUND）はうけつけない（音色がとちゅうでかわらないように・回数だけへらないように）。
// 読めなければ、このチャレンジはさいごまで合成の音にする（あとから読めてもかえない）
const CH_SOUND=new Set(['chhear','eplay','earp','eans','eab','eres','ecmp','enew']);
const chGated=()=>state.mode==='ch'&&ch.phase==='play'&&ch.voice==='piano'&&!PA.pianoReady();
let chGateBusy=false;
function chGateLoad(){
  if(chGateBusy||!chGated()) return;
  chGateBusy=true;
  PA.loadPiano().then(ok=>{
    chGateBusy=false;
    if(!ok&&ch.phase==='play'&&ch.voice==='piano'){ch.voice='synth';save();}
    render();

function playEar(arp=false){
  const q=state.q; if(!q) return;
  PA.stopSound(); PA.chord(q.notes.map(n=>n.midi),arp?{arp:true}:{dur:2.2});
}
// 問題の和音とおなじ高さで解決する：鳴っている1つ1つの音が、そのオクターブのままとなりの音へすすむ
function resInfo(){
  const q=state.q; if(!q||q.keyIdx==null) return null;
  const k=KEYS[q.keyIdx], f=T[q.type].fam, sh=famShift(k);
  return q.notes.map(n=>{const t=PA.at(k.harm,RESOLVE[f][n.k-sh]+sh);return {...t,midi:t.midi+(n.midi-PA.at(k.harm,n.k).midi)};})
    .sort((a,b)=>a.midi-b.midi);
}
function playRes(){
  const q=state.q, res=resInfo(); if(!res) return;
  PA.stopSound(); PA.chord(q.notes.map(n=>n.midi),{dur:1.3}); PA.chord(res.map(n=>n.midi),{when:1.25,dur:2.2});
}

/* ===== ランキングのサーバー（/api/*。ないところ＝file://・ふつうの静的サーバーでは「オフライン」） ===== */
const NET_MSG='インターネットにつながらなかったよ';
const OFF_MSG='いまはランキングにのせられないよ（オフライン）';
const BUSY_MSG='いまはランキングがこみあっているよ。すこしまってから、もういちどためしてね';
// サーバーはあって、ことわられた（回数が多すぎるなど）。404・501・JSON でない答え・つながらないときは「オフライン」
const isBusy=e=>!!(e&&e.detail&&e.status>=400&&e.status!==404&&e.status!==501);
const canNet=()=>/^https?:$/.test(location.protocol)&&typeof fetch==='function';
// iOS アプリ（PA.native）にはランキングを入れない：📊 を出さず、チャレンジはサーバーにつながずに「じぶんのきろく」だけ（api() もよばない）
const NO_RANK=PA.native;
const errOf=(status,message,detail)=>Object.assign(new Error(message),{status,detail:detail||''});
function api(path,opt){
  opt=opt||{};
  if(!canNet()) return Promise.reject(errOf(0,OFF_MSG));
  return new Promise((resolve,reject)=>{
    let done=false;
    const ctl=typeof AbortController==='function'?new AbortController():null;
    const finish=(f,v)=>{if(done) return;done=true;clearTimeout(timer);f(v);};
    const timer=setTimeout(()=>{if(ctl){try{ctl.abort();}catch(e){}}finish(reject,errOf(0,NET_MSG));},opt.timeout||10000);
    const init={method:opt.method||'GET',cache:'no-store',credentials:'same-origin'};
    if(ctl) init.signal=ctl.signal;
    if(opt.body!==undefined){init.headers={'Content-Type':'application/json'};init.body=JSON.stringify(opt.body);}
    fetch(path,init).then(res=>res.json().then(d=>d,()=>null).then(data=>{
      if(!res.ok){
        // ランキングのサーバーのエラー（日本語のメッセージ）か、サーバーがない（404・501など）か
        const m=isObj(data)&&typeof data.error==='string'&&data.error.trim()?data.error.trim().slice(0,200):'';
        finish(reject,errOf(res.status,m||(res.status>=500&&res.status!==501?'サーバーがいそがしいみたい。すこしまってから、もういちどためしてね':OFF_MSG),m));
      }else if(!isObj(data)) finish(reject,errOf(res.status,OFF_MSG));
      else finish(resolve,data);
    })).catch(()=>finish(reject,errOf(0,NET_MSG)));
  });
}
// 端末の ID（ランダム。名前や個人の情報とはむすびつけない）
function uuid(){
  try{if(window.crypto&&typeof crypto.randomUUID==='function') return crypto.randomUUID();}catch(e){}
  const b=new Uint8Array(16);
  try{crypto.getRandomValues(b);}catch(e){for(let i=0;i<16;i++) b[i]=Math.floor(Math.random()*256);}
  b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;
  const h=Array.from(b,x=>(x<16?'0':'')+x.toString(16)).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
function playerId(){
  const s=PA.store.get('ear-player',null);
  if(typeof s==='string'&&UUID_RE.test(s)) return s.toLowerCase();
  const id=uuid(); PA.store.set('ear-player',id); return id;
}
function randomSeed(){
  try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0];}catch(e){return Math.floor(Math.random()*4294967296);}
}

/* ----- じぶんのきろく（この端末の中。ランキングとはべつ）：PA.store 'ear-best'＝{all:rec, week:{id, rec}} ----- */
const validRec=r=>isObj(r)&&isInt(r.level,1,MAXLV)&&typeof r.mastered==='boolean'&&isInt(r.correct,0,CH.maxAnswers)&&isInt(r.total,r.correct,CH.maxAnswers)&&Number.isFinite(r.at);
function loadBest(){
  const d=PA.store.get('ear-best',{}), o=isObj(d)?d:{};
  return {all:validRec(o.all)?o.all:null,week:isObj(o.week)&&typeof o.week.id==='string'&&validRec(o.week.rec)?o.week:null};
}
const weekBest=b=>b.week&&b.week.id===EG.weekId()?b.week.rec:null;
// 新しいじこベスト（ぜんぶ）なら true（おなじ点なら先のきろくをのこす）
function recordBest(r){
  const b=loadBest(), rec={level:r.level,mastered:r.mastered,correct:r.correct,total:r.total,at:Date.now()};
  const better=old=>!old||EG.scoreKey(rec)>EG.scoreKey(old), newAll=better(b.all);
  if(newAll) b.all=rec;
  if(better(weekBest(b))) b.week={id:EG.weekId(),rec};
  PA.store.set('ear-best',b);
  return newAll;
}

/* ----- チャレンジのすすみかた ----- */
function chConnect(){
  if(ch.phase==='connecting') return;
  PA.stopSound(); chClear(); ch.phase='connecting'; save(); render();
  if(PA.settings.voice==='piano') PA.loadPiano(); // つなぐあいだに読んでおく（はじめた時の音色でさいごまで）
  api('api/run',{method:'POST',body:{}}).then(d=>{
    if(typeof d.runId!=='string'||!UUID_RE.test(d.runId)||!isSeed(d.seed)) throw errOf(0,OFF_MSG);
    if(ch.phase==='connecting') chBegin(d.runId.toLowerCase(),d.seed,false);
  }).catch(e=>{
    if(ch.phase!=='connecting') return;
    ch.phase='offline'; ch.connectError=e&&e.detail?e.detail:''; ch.connectBusy=isBusy(e); save(); render();
  });
}
function chBegin(runId,seed,offline){
  const rb=rebuildRun(seed,[]);
  // とちゅうでピアノの録音が読めても音色がかわらないように、はじめた時の音色でさいごまで鳴らす（render で PA.lockVoice）
  Object.assign(ch,{phase:'play',voice:PA.voice(),runId,seed,offline,offWhy:offline?(ch.connectBusy?'busy':'net'):'',startedAt:Date.now(),run:rb.run,vrng:rb.vrng,connectError:'',connectBusy:false,
    newBest:false,endedEarly:false,sending:false,sendError:null,submitted:null,closed:null});
  chAsk(state.mode==='ch');
}
// つぎのもんだい。play＝すぐ鳴らす（ほかを見ているときは鳴らさず「▶️ きく」をまつ）
function chAsk(play){
  const q=chNewQ(), R=replaysOf(q.lv,'ch');
  ch.event=null; ch.capped=false; ch.heard=!!play;
  if(state.mode==='ch'){state.q=q;state.answer=null;state.left=R;state.resShown=false;state.hinted=false;state.qn++;}
  else{ch.q=q;ch.answer=null;ch.left=R;ch.resShown=false;}
  state.askedAt=Date.now(); save(); render();
  if(play&&state.mode==='ch'){
    playEar(!!LEVELS[q.lv].arp);
    reveal(document.querySelector('#view .echoices'),document.querySelector('#view .hero'));
  }
}
// おわり：けっかへ（record＝じこベストをきろくする）
function finishRun(early,record){
  if(state.mode==='ch'){state.q=null;state.answer=null;state.left=null;state.resShown=false;}
  ch.q=null; ch.answer=null; ch.left=null; ch.resShown=false; ch.event=null; ch.heard=false;
  ch.phase='result'; ch.endedEarly=!!early;
  // ランキングにのせられるのははじめてから2時間まで（サーバーとおなじ）
  if(!ch.offline&&Date.now()-ch.startedAt>CH.runTtlMs){ch.offline=true;ch.offWhy='time';ch.runId=null;}
  if(record) ch.newBest=recordBest(ch.run.result());
  initName();
}
function chResult(early){
  PA.stopSound(); finishRun(early,true); save(); render(); scrollTop();
}

/* ----- なまえ（ランキングにのせるニックネーム。きまりは EG.checkName＝サーバーとおなじ） ----- */
function nickList(n,keep){
  const out=keep.slice();
  for(let g=0;out.length<n&&g<200;g++){const s=EG.makeNickname(Math.random);if(out.indexOf(s)<0) out.push(s);}
  return out;
}
const savedName=()=>EG.checkName(String(PA.store.get('ear-name','')||''));
function initName(){
  const sv=savedName();
  ch.name={cands:nickList(sv.ok?4:3,sv.ok?[sv.name]:[]),sel:0,pick:0,custom:''};
  ch.sending=false; ch.sendError=null; ch.submitted=null; ch.closed=null;
}
const currentName=()=>{const n=ch.name;return EG.checkName(n.sel==='custom'?n.custom:n.cands[n.sel]);};
// 漢字だけ3〜5文字は本名かも：とめはしないが、ニックネームをすすめる（サーバーのきまりはかえない）
const looksReal=name=>/^\p{Script=Han}{3,5}$/u.test(name);
function nameMsg(raw){
  if(!raw||!raw.trim()) return {text:'',soft:false};
  const c=EG.checkName(raw);
  if(!c.ok) return {text:c.error,soft:false};
  return looksReal(c.name)?{text:'本名じゃないかな？ニックネームがおすすめだよ',soft:true}:{text:'',soft:false};
}
function chSubmit(){
  if(!unsent()||ch.sending) return;
  const nm=currentName();
  if(!nm.ok){ch.sendError=nm.error;render();showError();return;}
  if(Date.now()-ch.startedAt>CH.runTtlMs){
    ch.closed={kind:'gone',msg:'始めてから2時間たったので、ランキングにはのせられないよ。またチャレンジしてね'};
    save(); render(); scrollTop(); return;
  }
  ch.sending=true; ch.sendError=null; render();
  const run=ch.run, runId=ch.runId;
  // おくっているあいだにべつのチャレンジをはじめたら、まえのへんじでいまのチャレンジをかえない
  const replaced=()=>ch.run!==run||ch.runId!==runId;
  api('api/score',{method:'POST',body:{runId,playerId:playerId(),name:nm.name,answers:run.answers.slice(),elapsedMs:Math.max(0,Math.round(Date.now()-ch.startedAt))}})
    .then(d=>{
      rk.data={week:null,all:null}; // つぎに見るとき新しいランキングを
      if(replaced()) return;
      ch.submitted=d; PA.store.set('ear-name',nm.name); PA.store.set('ear-rank-intro',true);
    },e=>{
      if(replaced()) return;
      if(e.status===409){
        // まえにおくったときにとどいていたが、へんじがとちゅうでなくなった（電波がよわいなど）
        ch.closed={kind:'already',msg:''}; PA.store.set('ear-name',nm.name); rk.data={week:null,all:null};
      }else if(e.status===404||e.status===410) ch.closed={kind:'gone',msg:e.message};
      else ch.sendError=e.message||NET_MSG;
    })
    .then(()=>{
      if(replaced()) return;
      ch.sending=false; save(); render();
      if(ch.sendError) showError(); else scrollTop();
    });
}
// おくれなかったときのメッセージを、下のボタンバーにかくれないところまで
function showError(){

/* ----- 📊 ランキング ----- */
const validRow=r=>isObj(r)&&isInt(r.rank,1,1e9)&&typeof r.name==='string'&&isInt(r.level,0,99)&&isInt(r.correct,0,1e6);
function loadRanking(){

function feedbackHTML(){

      <button class="btn" style="--c:${E.color}" data-act="eab" data-v="right" aria-label="正解：${E.word}（${E.label}）をきく"><span>${PA.icon('repeat')}正解</span><small>${E.emoji} ${E.word}<wbr>（${E.label}）</small></button></div></div>`;
  }

  if(K) h+=`<div class="resrow"><button class="btn" data-act="eres">${PA.icon('listen')}Ⅰへすすむ音もきく</button></div>`;
  if(res) h+=`<div class="msg" style="margin-top:10px">${PA.keyName(K)}のⅠへ：<b>${PA.namesH(q.notes)}</b> → <b style="color:#e8553d">${PA.namesH(res.filter((n,i)=>res.findIndex(x=>x.midi===n.midi)===i))}</b></div>`;
  const marks=new Map();
  if(res) res.forEach(n=>marks.set(n.midi,{fill:'#fff',ring:'#e8553d',tc:'#e8553d',label:PA.nm(n),focus:true,sr:'すすんだ先'}));
  q.notes.forEach(n=>{const r=res&&res.some(x=>x.midi===n.midi);marks.set(n.midi,{fill:E.color,label:PA.nm(n),focus:true,ring:r?'#e8553d':undefined,sr:r?'この和音・すすんだ先':'この和音'});});
  const all=[...marks.keys()], mn=Math.min(...all), mx=Math.max(...all);

  h+=`<div class="kbwrap"><div class="scroll" data-sk="kb">${PA.kbSVG(lo,hi,marks)}</div>
    <div class="legend"><span><i style="background:${E.color}"></i>この和音</span>${res?`<span><i style="border:3px solid #e8553d"></i>すすんだ先（Ⅰ）</span>`:''}${PA.once('tap-sound','<span>さわると音が出るよ</span>')}</div></div>`;

  return h;
}

      +`<span role="img" aria-label="${CLEAR}もん中${streak}もんれんぞく正解">${dots(CLEAR,streak,'pdots')}</span></div>`;
    // ひらきなおしたピアノのチャレンジで、録音を読んでいるあいだ（ボタンはうけつけない）
    if(chGated()) score+=`<div class="msg" role="status" style="margin-top:8px">⏳ ピアノの音を用意しているよ。少しまってね</div>`;
  }
  else score=`<div class="score"><b>⭐ ${state.right} / ${state.total}</b>${state.hint?`<span class="sub" aria-label="ヒントでできた${state.hint}もん">💡 ${state.hint}</span>`:''}<span class="sub">れんぞく${state.streak}</span></div>`;
  const R=replaysOf(lv,state.mode);
  let h=`<section class="card hero"><div class="qhead"><h2>👂 この和音はどれ？</h2>${score}</div>`;
  if(inCh&&ch.offline&&!NO_RANK) h+=`<span class="offtag">${ch.offWhy==='time'?'⏰ 2時間をすぎたのでランキングなし':ch.offWhy==='busy'?'⏳ こみあっているので、ランキングなしであそんでいるよ':'📴 オフライン：ランキングなしであそんでいるよ'}</span>`;
  if(!inCh) h+=`<div class="sessline">${sess.n()?sess.progressHTML():'<button type="button" class="btn small" data-act="esess">'+PA.icon('session')+'きょうの5もん</button>'}</div>`;
  if(!q) h+=`<div class="msg" style="margin-top:10px">下の<b>${PA.icon('play')}始める</b>をおすと、和音が鳴るよ。</div>`;
  else if(waitHear()) h+=`<div class="msg" style="margin-top:10px">下の<b>${PA.icon('play')}きく</b>をおすと、和音が鳴るよ。</div>`;
  else if(!state.answer){
    if(R!=null) h+=`<div class="rinfo" role="status" aria-label="もういちどきけるのは、あと${state.left}回">もういちどきける${dots(R,state.left,'rdots')}${state.left?'':' <span>あとはこたえよう！</span>'}</div>`;
    else h+=`<div class="rinfo">🔁 ${inCh?'このレベルは':'れんしゅうは'}、なんどでもきけるよ</div>`;
  }
  h+=soundHintHTML();
  h+=`<div class="echoices n${types.length}${types.length>5?' many':''}">${types.map(choiceHTML).join('')}</div>`;
  if(q&&state.answer) h+=feedbackHTML();
  return h+`</section>`;
}
function actionsHTML(){
  const q=state.q;
  if(sumView()) return ''; // けっかのカードに「もういちど」「じゆうにれんしゅう」があるので、下のボタン列はかくす
  if(state.mode==='rank') return `<button class="btn" data-act="rreload"${rk.loading?' disabled':''}>${PA.icon('refresh')}さいしんにする</button><button class="btn night" data-act="emode" data-v="ch">${PA.icon('trophy')}チャレンジ</button>`;
  if(state.mode==='ch'){
    if(ch.phase==='intro') return `${NO_RANK?'':'<button class="btn" data-act="emode" data-v="rank">'+PA.icon('chart')+'ランキング</button>'}<button class="btn night" data-act="chstart" data-hot="next">${PA.icon('flag')}スタート</button>`;
    if(ch.phase==='connecting') return `<button class="btn night" disabled>${PA.icon('wait')}じゅんび中…</button>`;
    if(ch.phase==='offline') return `<button class="btn" data-act="chstart">${PA.icon('retry')}もういちどつなぐ</button><button class="btn night" data-act="choff" data-hot="next">${PA.icon('play')}のせずにあそぶ</button>`;
    if(ch.phase==='result'){
      if(unsent()) return `<button class="btn primary" data-act="nsend"${ch.sending||!currentName().ok?' disabled':''}>${ch.sending?PA.icon('wait')+'おくっています…':PA.icon('send')+'ランキングにのせる'}</button>`;
      return `${NO_RANK?'':'<button class="btn" data-act="emode" data-v="rank">'+PA.icon('chart')+'ランキング</button>'}<button class="btn night" data-act="chstart" data-hot="next">${PA.icon('retry')}もういちど</button>`;
    }
    if(q&&!ch.heard) return `<button class="btn night" data-act="chhear" data-hot="listen next">${PA.icon('play')}きく</button>`;
  }
  if(!q) return `<button class="btn night" data-act="enew" data-hot="listen next">${PA.icon('play')}始める</button>`;
  if(state.answer){
    let next=PA.icon('next')+'次';
    if(state.mode==='ch'){
      if(ch.run.state.over||ch.capped) next=PA.icon('flag')+'けっかを見る';
      else if(ch.event==='up') next=`${PA.icon('next')}レベル${ch.run.state.level}へ`;
      else if(ch.event==='down') next=PA.icon('next')+'つづける';
    }else if(sess.finished()) next=PA.icon('session')+'けっかを見る';
    return `<button class="btn fit" data-act="eplay" data-hot="listen">${PA.icon('repeat')}きく</button><button class="btn fit" data-act="earp">${PA.icon('music')}ばらばら</button><button class="btn primary fit" data-act="enew" data-hot="next">${next}</button>`;
  }
  const off=state.left===0?' disabled':'';
  return `<button class="btn night" data-act="eplay" data-hot="listen"${off}>${PA.icon('repeat')}もういちどきく</button><button class="btn" data-act="earp"${off}>${PA.icon('music')}ばらばらにきく</button>`;
}
function render(){
  PA.lockVoice(state.mode==='ch'&&ch.phase==='play'?ch.voice:null); // チャレンジの画面だけ、はじめた時の音色（れんしゅう・せっていはふつうの音色）
  chGateLoad();
  // チャレンジでこたえる前は「くらべてきく」をつかえない。れんしゅうではつかえるが「ヒントでできた」になる
  const open=!!state.q&&!state.answer&&!sumView(), lock=open&&state.mode==='ch';
  const cmp=state.mode==='rank'?'':`<section class="card">
      <h2>🎧 くらべてきく<small>同じ「${PA.nmH({letter:0,acc:0})}」からつくった10しゅるい</small></h2>
      ${lock?'<p class="note" style="margin:0 0 8px">🏆 チャレンジでは、こたえた後できけるよ</p>':open?PA.once('hint-rule',`<p class="note" style="margin:0 0 8px">💡 ${PA.HINT_NOTE}</p>`):''}
      <div class="cmp">${ORDER.map(t=>`<button class="btn" style="--c:${T[t].color}" data-act="ecmp" data-v="${t}" aria-label="${T[t].label}（${T[t].word}）をきく"${lock?' disabled':''}><span>${T[t].emoji} ${T[t].label}</span><small>${T[t].word}</small></button>`).join('')}</div>
      <details class="more" style="margin-top:10px"><summary>💡 ひびきのことばヒント</summary>
        <ul class="hints">${ORDER.map(t=>`<li>${T[t].emoji} <b style="color:${T[t].color}">${T[t].label}</b>：${T[t].desc}</li>`).join('')}</ul></details>
    </section>`;
  const h=`<div class="stack">
    ${topCardHTML()}
    ${heroHTML()}
    ${cmp}
  </div>`;
  PA.paint(document.getElementById('view'),h,'ear:'+state.mode+':'+(state.mode==='ch'?ch.phase:'')+':'+state.qn);
  state.fresh=false;
  const bar=document.getElementById('actions'), bh=actionsHTML();
  bar.hidden=!bh; PA.paint(bar,bh,'bar');
}

/* ===== 操作 ===== */
// el がアプリバーと下のボタン列のあいだに見えていなければ、target を上にそろえてスクロール
function reveal(el,target,bottomOnly){
  if(!el||!target||!el.getBoundingClientRect) return;
  const r=el.getBoundingClientRect(), bar=document.getElementById('appbar'), ab=document.getElementById('actions');
  const top=bar?bar.offsetHeight:0, bottom=innerHeight-(ab?ab.offsetHeight:0);
  if(r.bottom>bottom||(!bottomOnly&&r.top<top)) target.scrollIntoView({block:'start',behavior:PA.reduceMotion()?'auto':'smooth'});
}
function scrollTop(){try{window.scrollTo(0,0);}catch(e){}}
function ask(){
  if(state.mode==='ch'){chAsk(true);return;}
  state.askedAt=Date.now(); newEar(); render(); playEar(!!LEVELS[state.q.lv].arp);
  reveal(document.querySelector('#view .echoices'),document.querySelector('#view .hero'));
}
PA.mountBar({title:'和音の聴きわけ',app:'ear'});
PA.onSettings=render;
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act, v=el.dataset.v;
  if(CH_SOUND.has(a)&&chGated()){PA.announce('ピアノの音を用意しているよ。少しまってね');chGateLoad();return;}
  if(a==='etop'){
    state.topOpen=v==='open'; render();
    // ひらいたら、カードのいちばん上（えらんでいるれんしゅう・チャレンジ）へフォーカス。とじたら PA.paint が1行のボタンへもどす
    if(state.topOpen){const f=document.querySelector('#view [data-act="emode"][aria-pressed="true"]');if(f) f.focus({preventScroll:true});}
  }
  else if(a==='emode'){
    if((v!=='free'&&v!=='ch'&&(v!=='rank'||NO_RANK))||v===state.mode) return;
    PA.stopSound(); setMode(v); render(); if(!el.closest('.seg')) scrollTop();
  }
  else if(a==='elevel'){
    const lv=+v; if(!isInt(lv,1,MAXLV)||lv===state.level||state.mode!=='free') return;
    PA.stopSound(); setLevel(lv); render();
  }
  else if(a==='esess'){if(state.mode!=='free')return;sessStart(5);ask();}
  else if(a==='session-again'){if(state.mode!=='free')return;sessStart(sess.n()||5);ask();}
  else if(a==='session-free'){if(state.mode!=='free')return;sessClear();ask();}
  // 🏆 チャレンジ
  else if(a==='chstart'){if(state.mode!=='ch'||ch.phase==='play'||ch.phase==='connecting'||unsent()) return;if(NO_RANK){PA.stopSound();chClear();chBegin(null,randomSeed(),true);return;}chConnect();}
  else if(a==='choff'){if(state.mode!=='ch'||ch.phase!=='offline') return;chBegin(null,randomSeed(),true);}
  else if(a==='chhear'){
    if(state.mode!=='ch'||ch.phase!=='play'||!state.q||ch.heard) return;
    if(!PA.settings.sound){PA.announce('音がオフだよ');return;} // 鳴らないのに「きいた」にしない
    ch.heard=true; state.askedAt=Date.now(); save(); render(); playEar(!!LEVELS[state.q.lv].arp);
    reveal(document.querySelector('#view .echoices'),document.querySelector('#view .hero'));
  }
  else if(a==='chend'){
    if(state.mode!=='ch'||ch.phase!=='play'||!ch.run) return;
    if(!ch.run.answers.length){PA.stopSound();chClear();save();render();return;} // 1もんもこたえていない：けっかはなしでやめる
    chResult(true);
  }
  else if(a==='chreset'){
    if(state.mode!=='ch') return;
    ch.best=0; PA.store.set('ear-best',{}); save(); render();
  }
  else if(a==='npick'){const i=+v;if(unsent()&&isInt(i,0,ch.name.cands.length-1)){ch.name.sel=i;ch.name.pick=i;ch.sendError=null;render();}}
  else if(a==='nroll'){
    if(!unsent()) return;
    const sv=savedName();
    ch.name.cands=nickList(ch.name.cands.length,sv.ok?[sv.name]:[]);
    ch.name.pick=sv.ok?Math.min(1,ch.name.cands.length-1):0;
    if(ch.name.sel!=='custom') ch.name.sel=ch.name.pick;
    ch.sendError=null; render();
  }
  else if(a==='nsend') chSubmit();
  else if(a==='nskip'){if(unsent()){chClear();save();render();scrollTop();}}
  // 📊 ランキング
  else if(a==='rper'){if((v==='week'||v==='all')&&v!==rk.period){rk.period=v;save();loadRanking();render();}}
  else if(a==='rreload'){if(state.mode==='rank'&&!rk.loading){loadRanking();render();}}
  else if(a==='enew'){
    if(state.mode==='ch'){
      if(ch.phase!=='play'||!state.answer) return;
      if(ch.run.state.over||ch.capped){chResult(false);return;}
    }
    // 5もんおわったら：つぎのもんだいのかわりにけっかのカード
    else if(sess.finished()&&state.q&&state.answer){
      PA.stopSound(); state.q=null; state.answer=null; state.resShown=false; state.hinted=false; save(); render();
      const c=document.querySelector('#view .sess-card'); if(c) c.scrollIntoView({block:'start',behavior:PA.reduceMotion()?'auto':'smooth'});
      return;
    }
    else if(state.mode!=='free') return;
    ask();
  }
  else if(a==='eplay'||a==='earp'){
    if(!state.q||waitHear()) return;
    // 「つぎ」の2どおしで、その場所に出たボタンがおされて回数がへらないように
    if(!state.answer&&Date.now()-(state.askedAt||0)<600) return;
    // 音がオフのときは鳴らないので、のこりの回数はへらさない（「🔇 音がオフだよ」はいつも出ている）
    if(!PA.settings.sound){PA.announce('音がオフだよ');return;}
    if(!state.answer&&state.left!=null){if(state.left<=0)return;state.left--;save();render();}
    playEar(a==='earp');
  }
  else if(a==='eans'){
    const q=state.q;
    if(!q||state.answer||!LEVELS[q.lv].types.includes(v)) return;
    if(state.mode==='ch'){
      if(ch.phase!=='play'||!ch.heard||!ch.run||ch.run.type()!==q.type) return;
      state.answer=v;
      const r=ch.run.answer(v);
      PA.answerFx(v===q.type);
      ch.event=r.event; ch.capped=!ch.run.state.over&&ch.run.answers.length>=CH.maxAnswers;
      if(r.event==='up'||r.event==='master') ch.best=Math.max(ch.best,q.lv);
    }else{
      state.answer=v; const ok=v===q.type; PA.answerFx(ok);
      state.total++;
      if(!ok){state.streak=0;state.lvRun=0;}
      else if(!state.hinted){state.right++;state.streak++;state.lvRun++;if(state.lvRun>state.lvBest[q.lv]) state.lvBest[q.lv]=state.lvRun;}
      else state.hint++;
      // ヒントでできた：⭐ はふえないが、れんぞくもそのまま（💡 の数にかぞえる）
      if(sess.active()) sess.record({ok,hint:ok&&state.hinted,label:`レベル${q.lv}　${T[q.type].word}（${T[q.type].label}）${PA.namesT(q.notes)}${ok?'':`　選んだ：${T[v].word}`}`});
    }
    save(); state.fresh=true; render(); playEar();
    const fb=document.querySelector('#view .fb'); reveal(fb,fb,true);
  }
  else if(a==='eab'){
    const q=state.q; if(!q||!state.answer||state.answer===q.type) return;
    PA.stopSound(); PA.chord(abNotes(q,v==='pick'?state.answer:q.type),{dur:2.2});
  }
  else if(a==='eres'){if(!state.q||state.q.keyIdx==null||!state.answer)return;state.resShown=true;save();render();playRes();}
  else if(a==='efam'){
    const q=state.q; if(!q||q.keyIdx==null) return;
    PA.stopSound(); PA.store.set('minor-family',{keyIdx:q.keyIdx,fam:T[q.type].fam}); PA.go('minor-family.html');
  }
  else if(a==='ecmp'){
    const c=CMP[v]; if(!c) return;
    if(state.mode==='ch'&&state.q&&!state.answer) return;
    // 音がオフのときは鳴らないので「ヒントでできた」にもしない
    if(!PA.settings.sound){PA.announce('音がオフだよ');return;}
    // れんしゅうでこたえる前にきいたら「ヒントでできた」
    if(state.mode==='free'&&state.q&&!state.answer&&!state.hinted){state.hinted=true;save();}
    PA.stopSound(); PA.chord(c,{dur:2});
  }
});
// なまえの自分で入れるらん：入力中は描きなおさない（日本語の変換がとぎれないように）
document.addEventListener('input',e=>{
  const t=e.target; if(!t||t.id!=='nameInput'||!unsent()) return;
  const empty=t.value.trim()==='';
  // 入れてけしたら、まえにえらんでいたこうほにもどす（なにもえらばれていないままにしない）
  ch.name.custom=t.value; ch.name.sel=empty?ch.name.pick:'custom'; ch.sendError=null;
  const m=nameMsg(t.value), er=document.getElementById('nameErr');
  if(er){er.textContent=m.text;er.classList.toggle('soft',m.soft);}
  t.classList[empty?'remove':'add']('on');
  document.querySelectorAll('#view [data-act="npick"]').forEach(b=>{
    const on=empty&&+b.dataset.v===ch.name.pick;
    b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on));
  });
  const eb=document.querySelector('#view .namecard .errbox'); if(eb) eb.parentNode.removeChild(eb);
  const sb=document.querySelector('#actions [data-act="nsend"]'); if(sb&&!ch.sending) sb.disabled=!currentName().ok;
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!e.target||e.target.id!=='nameInput') return;
  // 日本語の変換をきめる Enter（Safari は isComposing が false で keyCode 229）ではおくらない
  if(e.isComposing||e.keyCode===229) return;
  e.preventDefault();
  if(ch.name.sel==='custom'&&currentName().ok) chSubmit();
});
render();
</script>
