<script>
/* 副属和音：目標の和音（Ⅱ・Ⅲ・Ⅳ・Ⅴ・Ⅵ／短調はⅢ・Ⅳ・Ⅴ・Ⅵ・Ⅶ）をいっときの主和音（Ⅰ）と考えて、その調のⅤ7（またはⅦ7）を前におく。
 * 和音のつづり・高さ・解決はぜんぶ PA.henka（Ⅴ7/Ⅴは PA.chroma のドッペルドミナントとおなじ音）。
 * ながれ（Ⅰ → 副属和音 → 目標 → … → Ⅴ7 → Ⅰ）の前後の和音は、調の音でつくり、連続5度・8度・対斜・増2度がないならびをさがす */
const H=PA.henka, ROMAN=H.ROMAN;
const SEC='#8a4fe0', TGT='#0f8a8a', I_COL=PA.COL.I, V_COL='#3b4fa8', OTHER='#8a6d3b', RED='#d1495b', LOW='#2f7ee8';
const LIGHT={[SEC]:'#dccbf6',[TGT]:'#bfe6e6',[I_COL]:'#f8c9bd',[V_COL]:'#cdd5f3',[OTHER]:'#eadcc4'};
const DARK={[SEC]:'#4b2390',[TGT]:'#0b5c5c',[I_COL]:'#8f2a17',[V_COL]:'#24316f',[OTHER]:'#5a4524'};
const KINDS=['V7','vii7','vii7h'];
const KNAME={V7:'Ⅴ7',vii7:'減七',vii7h:'半減七'};

const saved=(d=>d&&typeof d==='object'?d:{})(PA.store.get('secondary',{}));
const state={minor:saved.minor===true,keyIdx:0,target:5,kind:'V7',res:0,anim:null,prog:null,mode:'target',msg:null,autoWait:false,ab:null,abOk:0,abN:0};
if(Number.isInteger(saved.keyIdx)&&saved.keyIdx>=0&&saved.keyIdx<PA.keyCount(state.minor)) state.keyIdx=saved.keyIdx;
if(KINDS.includes(saved.kind)) state.kind=saved.kind;
const curKey=()=>PA.keyOf(state.minor,state.keyIdx);
if(Number.isInteger(saved.target)&&H.targets(curKey()).includes(saved.target)) state.target=saved.target;
const save=()=>PA.store.set('secondary',{minor:state.minor,keyIdx:state.keyIdx,target:state.target,kind:state.kind});
// えらんだ形がこの目標でつかえない（半減七は長三和音で長9度が調の音のときだけ）ときは減七
const effKind=key=>H.secondary(key,state.target,state.kind)?state.kind:'vii7';
state.kind=effKind(curKey()); // 表示する形と保存する形をそろえる

/* ===== 音のしらべかた ===== */
const pcN=n=>PA.mod(PA.NAT[n.letter]+n.acc,12);
const sigOf=(key,L)=>key.sig[L]||0;
const chg=(key,n)=>n.acc-sigOf(key,n.letter); // ＞0＝調号より半音上げた、＜0＝下げた
const midisOf=ns=>[...new Set(ns.map(n=>n.midi))];
const stackOrder=ns=>[ns[0],ns[3],ns[1],ns[2]]; // PA.henka のならび [ベース | 上の3つ] → 3度ずつつみかさねたじゅん
const shortLab=s=>String(s).replace('（自然）','');
const roleName=r=>String(r).replace(/（.*$/,'');
const dia=(key,n)=>({...n,acc:sigOf(key,n.letter),midi:n.midi-chg(key,n),tag:null}); // 調の音にもどした音

/* ===== 名前 ===== */
const cls=(key,n)=>n.tag==='lt'||chg(key,n)>0?'up':chg(key,n)<0?'lo':'';
const nmC=(key,n)=>`<span class="nw ${cls(key,n)}">${PA.nmH(n)}</span>`;
const nmW=n=>`<span class="nw">${PA.nmH(n)}</span>`;
const q=n=>`「${nmW(n)}」`;
const qC=(key,n)=>`「${nmC(key,n)}」`;
const namesC=(key,ns,sep='・')=>ns.map(n=>nmC(key,n)).join(sep);
const namesW=(ns,sep='・')=>ns.map(nmW).join(sep);
// 目標の和音・いっときの調
function info(key){
  const t=state.target, k=effKind(key), X=H.secondary(key,t,k), R=H.resolveSecondary(key,t,k), T=H.targetTriad(key,t);
  const tmin=H.targetIsMinor(key,t), root=T[0];
  const tk={l:root.letter,a:root.acc,minor:tmin};
  const lab=H.label(key,'secondary',t,k), tl=H.label(key,'target',t), tkName=PA.keyName(tk), pm=PA.keyName({...tk,minor:true});
  // 目標が長三和音の減七は、いっときの調（長調）のⅦ7ではなく、その同主短調のⅦ7（長調のⅦ7は半減七）
  const vb=k==='vii7'&&!tmin;
  return {t,k,X,R,T,tmin,root,tk,tkName,tkEn:PA.keyEn(tk),pm,vb,src:vb?pm:tkName,lab,tl,tls:ROMAN[t-1],sym:H.symbol(key,'secondary',t,k),tsym:H.symbol(key,'target',t),jun:lab.startsWith(H.JUN)};
}
// 「どの調のどの和音か」（例：ト長調のⅤ7、ト短調のⅦ7（減七））
const srcWhat=I=>I.k==='V7'?`${I.tkName}のⅤ7`:`${I.src}のⅦ7（${KNAME[I.k]}）`;
// コードネーム（調の音だけの形のめやす）
function symOf(ns){
  const d=i=>PA.mod(ns[i].midi-ns[0].midi,12), r=PA.LET_EN[ns[0].letter]+PA.ACC[ns[0].acc];
  const S={'4-7-10':'7','3-7-10':'m7','3-6-10':'m7(♭5)','4-7-11':'maj7','3-6-9':'dim7','3-7-11':'mM7','4-8-11':'aug(maj7)'}[d(1)+'-'+d(2)+'-'+d(3)];
  return PA.H(r+(S||''));
}
// 調の音だけでつくった七の和音の和音記号。短調は調号（自然的短音階）の音なので、第7音（導音にしない音）をふくむ和音は「（自然）」
const diaLabel=(key,X)=>{
  const d=PA.mod(stackOrder(X)[0].letter-key.l,7);
  return ROMAN[d]+'7'+(key.minor&&[0,2,4,6].includes(d)?'（自然）':'');
};
// いちばん下の音（Ⅴ7は根音、Ⅶ7は導音）を半音かえたか。かえたなら「調の音だけ」の形は根音からちがう和音
const lowChanged=(key,I)=>!!chg(key,stackOrder(I.X)[0]);
// 調の音だけ → 副属和音（どの音を半音上げ・下げしたか）
function shapeChain(key,I){
  const st=stackOrder(I.X), d=st.map(n=>dia(key,n)), changed=st.filter(n=>chg(key,n));
  const res=`${namesC(key,st)}（${I.sym}）＝${I.lab}`;
  if(!changed.length) return `<div class="der"><div class="dr q-s">調の音だけでできる：${namesW(st)}（${I.sym}）</div></div>`;
  const how=changed.map(n=>`${qC(key,n)}は${q(dia(key,n))}を半音${chg(key,n)>0?'上げた':'下げた'}音`).join('<br>');
  if(I.k!=='V7'&&lowChanged(key,I)){
    // 導音そのものが調にない音：「調の音だけ」の形は根音からちがう和音なので出さない
    const lt=st[0];
    return `<div class="der"><div class="dr q-s">${I.src}の導音${qC(key,lt)}（${I.tl}の根音${q(I.T[0])}の半音下）からひとつとばしで4つ：<br><b>${res}</b></div><div class="dn2">${how}</div></div>`;
  }
  const hw=changed.map(n=>`${q(dia(key,n))}を半音${chg(key,n)>0?'上げる':'下げる'}`).join('・');
  return `<div class="der"><div class="dr q-d">調の音だけ：${namesW(d)}（${symOf(d)}）＝${diaLabel(key,I.X)}</div>`+
    `<div class="da"><span aria-hidden="true">⬇</span> ${hw}</div><div class="dr q-s"><b>${res}</b></div></div>`;
}

/* ===== ながれ（前後の和音を調の音でつくり、声のすすみをさがす） ===== */
// 調の三和音・Ⅴ7（長調＝長音階、短調＝自然的短音階。Ⅴ・Ⅴ7は短調でも導音を上げる）
function degChord(key,d,seventh){
  const sc=key.minor&&d!==5?key.nat:key.scale, at=k=>sc[PA.mod(d-1+k,7)];
  const lab=d===1?'Ⅰ':d===5?(seventh?'Ⅴ7':'Ⅴ'):H.targets(key).includes(d)?H.label(key,'target',d):ROMAN[d-1];
  const ms=[['R',at(0),'根音'],['3',at(2),'第3音'],['5',at(4),'第5音']]; if(seventh) ms.push(['7',at(6),'第7音']);
  return {lab,ms:ms.map(([mem,n,r])=>({letter:n.letter,acc:n.acc,mem,role:shortLab(lab)+'の'+r,tag:d===5&&mem==='3'?'lt':mem==='7'?'seventh':null}))};
}
const keyLtPc=key=>PA.mod(key.tpc+11,12);
const inR=(m,lo,hi)=>{const r=[];for(let x=lo;x<=hi;x++) if(PA.mod(x,12)===m) r.push(x);return r;};
// 4声のならべかた：ベース＝根音、上の3声＝［根音・第3音・第5音］など（重ねる音でペナルティ）
// o.bass＝'3' で第1転回形（Ⅰ6：根音か第5音を重ねる）、o.complete＝七の和音の4つの音をぜんぶ（減七・半減七）
function voicings(key,ch,o={}){
  const by={}; ch.ms.forEach(m=>by[m.mem]=m);
  const bm=o.bass||'R';
  const sets=by['7']?(o.complete?[['3','5','7',0]]:[['3','5','7',0],['R','3','7',2]])
    :bm==='3'?[['R','R','5',0],['R','5','5',2]]
    :[['R','3','5',0],['3','5','5',3],['R','R','3',4],['3','3','5',6]];
  const note=(m,midi)=>({letter:m.letter,acc:m.acc,midi,role:m.role,tag:m.tag});
  const out=[], seen=new Set(), lt=keyLtPc(key);
  for(const b of inR(pcN(by[bm]),40,55)) for(const [a,c,e,pen] of sets){
    const mems=[a,c,e], dbl=[bm,...mems].filter((x,i,arr)=>arr.indexOf(x)!==i);
    if(dbl.some(x=>by[x].tag||pcN(by[x])===lt)) continue; // 導音・第7音は重ねない
    for(const x of inR(pcN(by[a]),55,79)) for(const y of inR(pcN(by[c]),55,79)) for(const z of inR(pcN(by[e]),55,79)){
      const u=[[a,x],[c,y],[e,z]].sort((p,r)=>p[1]-r[1]);
      if(!(u[0][1]<u[1][1]&&u[1][1]<u[2][1])||u[0][1]<=b) continue;
      if(u[1][1]-u[0][1]>12||u[2][1]-u[1][1]>12||u[0][1]-b>24) continue;
      const ns=[note(by[bm],b),...u.map(([m,midi])=>note(by[m],midi))], id=ns.map(n=>n.midi).join(',');
      if(seen.has(id)) continue; seen.add(id);
      out.push({ns,pen});
    }
  }
  return out;
}
// PA.henka の和音はそのまま（音域におさまるときだけ、ベース・上の声をオクターブうごかした形も候補に）
function fixedCands(ns,pen=6){
  const out=[];
  for(const sb of [0,-12,12]) for(const su of [0,-12,12]){
    const m=ns.map((n,i)=>({...n,midi:n.midi+(i?su:sb)})), up=m.slice(1).map(n=>n.midi);
    if((sb||su)&&(m[0].midi<40||m[0].midi>55||Math.min(...up)<55||Math.max(...up)>79)) continue;
    if(m[0].midi>=Math.min(...up)) continue;
    out.push({ns:m,pen:(sb?pen:0)+(su?pen:0)});
  }
  return out;
}
// 2つの和音のあいだの声のすすみ（だめなら Infinity）
// o.secToV7：副属和音 → 調のⅤ7（Ⅴ7/Ⅴ → Ⅴ7）。導音はおなじ声で半音下がってⅤ7の第7音になってもよい（対斜をさける）
function trans(key,P,N,pIsV,strict,o={}){
  const A=P.ns, B=N.ns, lt=keyLtPc(key);
  let pen=0;
  for(let i=0;i<4;i++){
    const d=B[i].midi-A[i].midi, st=PA.stepOf(B[i])-PA.stepOf(A[i]), ad=Math.abs(d), as=Math.abs(st);
    if(ad>12) return Infinity;
    if(i&&ad>7) pen+=(ad-7)*2;
    if(i===3&&ad>4) pen+=ad-4;
    if((as===1&&ad===3)||(as===3&&ad===6)){if(strict) return Infinity;pen+=20;} // 増2度・増4度
    if(as===4&&ad===6) pen+=4;
    const ltv=A[i].tag==='lt'||(pIsV&&pcN(A[i])===lt);
    const toV7=o.secToV7&&A[i].tag==='lt'&&B[i].tag==='seventh'&&B[i].letter===A[i].letter&&B[i].acc===A[i].acc-1&&d===-1;
    if(ltv&&!toV7&&!(d===0&&st===0)&&!(d===1&&st===1)) return Infinity; // 導音は半音上へ（つぎもおなじ音ならそのまま）
    if(['seventh','b9','ninth'].includes(A[i].tag)&&!(st===-1&&(d===-1||d===-2))) return Infinity; // 第7音・第9音は下へ
    if(i>0&&i<3&&(B[i].midi>A[i+1].midi||B[i].midi<A[i-1].midi)) pen+=3;
  }
  for(let i=0;i<4;i++) for(let j=i+1;j<4;j++){
    const a=PA.mod(A[j].midi-A[i].midi,12), b=PA.mod(B[j].midi-B[i].midi,12);
    if(a===b&&(a===0||a===7)&&A[i].midi!==B[i].midi&&A[j].midi!==B[j].midi) return Infinity; // 連続5度・8度
  }
  for(let j=1;j<4;j++) if(PA.mod(A[j].midi-A[0].midi,12)===6&&PA.mod(B[j].midi-B[0].midi,12)===7) return Infinity; // バスをふくむ減5度→完全5度
  const ds=B[3].midi-A[3].midi, db=B[0].midi-A[0].midi;
  if(ds*db>0&&[0,7].includes(PA.mod(B[3].midi-B[0].midi,12))&&Math.abs(ds)>2) pen+=4; // 外声の隠伏
  // 対斜：おなじ文字で変化記号がかわるときは、おなじ声で
  for(const p of A) for(const n of B){
    if(p.letter!==n.letter||p.acc===n.acc) continue;
    if(!A.some((x,i)=>x.letter===p.letter&&x.acc===p.acc&&B[i].letter===n.letter&&B[i].acc===n.acc)){if(strict) return Infinity;pen+=10;}
  }
  return pen+B.reduce((s,n,i)=>s+Math.abs(n.midi-A[i].midi)*(i?1:.5),0);
}
function voiceItems(key,items,strict){
  const dp=[items[0].cands.map(c=>({cost:c.pen+Math.abs(c.ns[3].midi-72)*.3,prev:-1}))];
  for(let k=1;k<items.length;k++){
    dp.push(items[k].cands.map(c=>{
      let best={cost:Infinity,prev:-1};
      items[k-1].cands.forEach((p,i)=>{
        const pc=dp[k-1][i].cost; if(!isFinite(pc)) return;
        const v=pc+trans(key,p,c,items[k-1].isV,strict,{secToV7:!!items[k-1].sec&&!!items[k].v7})+c.pen;
        if(v<best.cost) best={cost:v,prev:i};
      });
      return best;
    }));
  }
  const last=dp[dp.length-1]; let bi=-1;
  last.forEach((x,i)=>{if(isFinite(x.cost)&&(bi<0||x.cost<last[bi].cost)) bi=i;});
  if(bi<0) return null;
  const pick=[];
  for(let k=items.length-1;k>=0;k--){pick[k]=items[k].cands[bi];bi=dp[k][bi].prev;}
  return items.map((it,k)=>({lab:it.lab+(pick[k].inv?'6':''),col:it.col,ns:pick[k].ns,sec:!!it.sec,tgt:!!it.tgt,strict}));
}
// i6：はじめのⅠは第1転回形（Ⅰ6）も候補に（いちばん下が導音の減七の前など、対斜や増音程をさけるため）
const genItem=(key,d,seventh,i6)=>{
  const ch=degChord(key,d,seventh), c=voicings(key,ch);
  if(i6) voicings(key,ch,{bass:'3'}).forEach(v=>c.push({...v,pen:v.pen+6,inv:1}));
  return {lab:ch.lab,col:d===1?I_COL:d===5?V_COL:OTHER,cands:c,isV:d===5,v7:d===5&&!!seventh};

// 副属和音・目標は PA.henka の形（おなじ高さ）をいちばんに。だめなときだけ、おなじ音でならべかえた形（ペナルティつき）
const MEM=['R','5','7','3']; // PA.henka のならび [根音|5,7,3]（Ⅶ7は [導音|第5音,第7音,第9音] をⅦ7から見た根音・5・7・3）
const reVoice=(key,ns,o)=>voicings(key,{ms:ns.map((n,i)=>({...n,mem:o.mem[i]}))},o).map(v=>({...v,pen:v.pen+12}));
const secItem=(key,t,k)=>{const X=H.secondary(key,t,k);return {lab:H.label(key,'secondary',t,k),col:SEC,cands:[...fixedCands(X),...reVoice(key,X,{mem:MEM,complete:k!=='V7'})],sec:true};};
const resItem=(key,t,k)=>{
  const T=H.targetTriad(key,t);

// 目標のあと：Ⅴ7 → Ⅰへ（Ⅲ・Ⅵ・Ⅶのあとは下属の和音をはさむ）
const AFTER={false:{2:[],3:[4],4:[],5:[],6:[4]},true:{3:[4],4:[],5:[],6:[4],7:[3,4]}};
const CHAIN={false:[6,5],true:[4,5]}; // 2つつなげる：長調Ⅴ7/Ⅵ → Ⅵ → Ⅴ7/Ⅴ → Ⅴ7、短調Ⅴ7/Ⅳ → Ⅳ → Ⅴ7/Ⅴ → Ⅴ7
const progCache=new Map();
function progOf(key,mode,t,k){
  const id=[key.minor,key.idx,mode,t,k].join(':');
  if(progCache.has(id)) return progCache.get(id);

  if(mode==='chain'){
    const [a,b]=CHAIN[key.minor];

  let r=null;
  for(const pre of [[],[4],[6]]){
    r=voiceItems(key,[genItem(key,1,false,true),...pre.map(d=>genItem(key,d)),...body],true);

const curProg=key=>progOf(key,state.mode,state.target,effKind(key));

const abCache=new Map();
function abSeqs(key){
  const k=effKind(key), id=[key.minor,key.idx,state.target,k].join(':');
  if(abCache.has(id)) return abCache.get(id);
  const p=progOf(key,'ab',state.target,k); if(!p) return null;
  const xi=p.findIndex(c=>c.sec), X=p[xi].ns, same=X.every(n=>!chg(key,n)), toDia=ns=>ns.map(n=>chg(key,n)?dia(key,n):n);
  const D0=toDia(X);
  let seq=p.map((c,i)=>i===xi?D0:c.ns);
  if(!same){
    const Dh=toDia(H.secondary(key,state.target,k));
    const inRange=ns=>ns[0].midi>=40&&ns[0].midi<=55&&ns.slice(1).every(n=>n.midi>=55&&n.midi<=79);
    const dItem={lab:'?',col:OTHER,cands:[...(inRange(D0)?[{ns:D0,pen:0}]:[]),...fixedCands(Dh),...reVoice(key,Dh,{mem:MEM,complete:k!=='V7'})]};
    const r1=voiceItems(key,p.map((c,i)=>i===xi?dItem:{lab:c.lab,col:c.col,cands:[{ns:c.ns,pen:0}],isV:false}),true);
    const pre=xi===1?[]:[/^Ⅳ/.test(p[1].lab)?4:6];

}

const isWhite=m=>!PA.BLACK.has(PA.mod(m,12));
function kbRange(ms,minWhite=12){
  let lo=Math.min(...ms)-1, hi=Math.max(...ms)+1;
  while(!isWhite(lo)) lo--; while(!isWhite(hi)) hi++;
  const wc=()=>{let c=0;for(let m=lo;m<=hi;m++) if(isWhite(m)) c++;return c;};
  for(let s=0;wc()<minWhite&&s<14;s++){if(s%2){lo--;while(!isWhite(lo))lo--;}else{hi++;while(!isWhite(hi))hi++;}}
  return [lo,hi];
}
// ベースは左手（うすい色）。赤＝導音・半音上げた音、青＝半音下げた音
function marksOf(key,ns,col,o={}){
  const mk=new Map();
  ns.forEach((n,i)=>{
    if(mk.has(n.midi)) return;
    const c=o.plain?0:chg(key,n), lt=!o.plain&&n.tag==='lt';
    const m={fill:lt||c>0?RED:c<0?LOW:col,label:PA.nm(n),focus:true};
    if(i===0){if(!lt&&!c){m.fill=LIGHT[col]||'#eee';m.tc=DARK[col]||'#3a3245';}m.sub='左手';m.subColor=col;}
    if(lt){m.sub='導音';m.subColor=RED;}
    mk.set(n.midi,m);
  });
  return mk;
}

/* ===== がくふ（大譜表。いちばん下の音とド4より下の音はヘ音記号）＋矢印 ===== */
const prep=(key,n,plain)=>({letter:n.letter,acc:n.acc,midi:n.midi,raised:(!plain&&(n.tag==='lt'||chg(key,n)>0))||undefined});
// cols:[{notes,color,label,op}]、arrows:[{c1,n1,c2,n2,color,text,dash}]（n1・n2は cols の音そのもの）
function staff(key,cols,arrows=[],o={}){
  const cw=o.cw||110;
  const sc=cols.map(c=>{
    const lo=c.notes.length?c.notes.reduce((a,b)=>b.midi<a.midi?b:a):null;
    const lh=c.notes.filter(n=>n===lo||n.midi<60), tr=c.notes.filter(n=>!lh.includes(n));
    const col={notes:tr.map(n=>prep(key,n,c.plain)),lh:lh.map(n=>prep(key,n,c.plain)),color:c.color,ltColor:RED,accColor:RED,label:c.label,labelColor:c.color,op:c.op};
    return {col,tr,lh};
  });
  const ns=PA.sigInfo(key).letters.length, nx=50+ns*10+(ns?24:14);
  const tw=t=>[...(t||'')].reduce((w,ch)=>w+(ch.charCodeAt(0)>255?14:8.5),0);
  const pad=Math.max(44,...arrows.map(a=>tw(a.text)-cw/2+22));
  let svg=PA.staffSVG(key,sc.map(s=>s.col),{grand:true,autoCarry:true,colW:cw,minW:Math.max(o.minW||0,arrows.length?nx+cols.length*cw+pad:0)});
  const posOf=(ci,n)=>{
    const s=sc[ci]; if(!s) return null;
    const inT=s.tr.includes(n), arr=inT?s.tr:s.lh.includes(n)?s.lh:null; if(!arr) return null;
    const P=arr.map(m=>({m,s:PA.stepOf(m)})).sort((a,b)=>a.s-b.s);
    let ps=-99,po=false; P.forEach(p=>{p.off=(p.s-ps===1&&!po);po=p.off;ps=p.s;});
    const p=P.find(p=>p.m===n);
    return {x:nx+ci*cw+cw/2+(p.off?13:0),y:inT?96-(p.s-30)*5:178-(p.s-26)*5};
  };
  let add=''; const cs=new Set();
  arrows.forEach(a=>{
    const p=posOf(a.c1,a.n1), r=posOf(a.c2,a.n2); if(!p||!r) return;
    cs.add(a.color);
    add+=`<path d="M${p.x+12} ${p.y} L${r.x-22} ${r.y}" stroke="${a.color}" stroke-width="2.4" fill="none" stroke-dasharray="${a.dash||''}" marker-end="url(#sd${a.color.slice(1)})"/>`;
    if(a.text) add+=`<text x="${r.x+14}" y="${r.y+5}" font-size="14" font-weight="800" fill="${a.color}">${a.text}</text>`;
  });
  if(cs.size) add+=`<defs>${[...cs].map(c=>`<marker id="sd${c.slice(1)}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${c}"/></marker>`).join('')}</defs>`;
  svg=svg.replace(/<\/svg>$/,add+'</svg>');
  // 小さくなりすぎないように（文字が読めるように）横スクロールにする
  const m=svg.match(/viewBox="0 0 ([\d.]+) /), W=m?+m[1]:400;
  return `<div class="scroll" data-sk="${o.sk||'staff'}"><div style="min-width:${Math.round(W*0.66)}px">${svg}</div></div>`;
}
// 副属和音 → 目標の矢印（導音は半音上へ、第7音・第9音は下へ）
function resArrows(X,R){
  const a=[];
  X.forEach((n,i)=>{
    if(n.tag==='lt') a.push({c1:0,n1:n,c2:1,n2:R[i],color:RED,text:'半音↑'});
    else if(['seventh','b9','ninth'].includes(n.tag)) a.push({c1:0,n1:n,c2:1,n2:R[i],color:SEC,text:'↓'});
  });
  return a;
}

  const sop=prog.map(s=>s.ns[3]);
  h+=`<div class="row" style="margin-top:8px"><button class="btn small night" data-act="prog">${PA.icon('play')}ながれを鳴らす</button></div>`;
  let dn='';
  if(state.mode==='chain'){ // Ⅴ7/Ⅴ → Ⅴ7：導音が半音下がってⅤ7の第7音に
    const j=prog.findIndex((s,i)=>s.sec&&i>0&&prog.slice(0,i).some(x=>x.sec)), li=j>=0?prog[j].ns.findIndex(n=>n.tag==='lt'):-1;
    const a=li>=0?prog[j].ns[li]:null, b=a&&prog[j+1]?prog[j+1].ns[li]:null;
    if(a&&b&&b.letter===a.letter&&b.acc===a.acc-1) dn=`<br>${PA.H(prog[j].lab)}の導音${qC(key,a)}は、次がⅤ7なので、同じ声で半音下がってⅤ7の第7音${q(b)}になるよ（べつの声で${q(b)}を出すと、${q(a)}と${q(b)}がちがう声でぶつかって、にごるから）。`;
  }

}
function abCard(key,I){

  const ok=ab.answer===ab.sec, ob=ab.sec==='A'?'B':'A', lt=I.X.find(n=>n.tag==='lt');

      <b>${ab.sec}</b>が${I.lab}：${namesC(key,stackOrder(I.X))}、<b>${ob}</b>が${dl}：${namesW(D)}。

function overview(key){
  const ts=H.targets(key), ek=effKind(key);

  ts.forEach(t=>{

      const s=H.secondary(key,t,k);

      const on=t===state.target&&k===ek;
      return `<td><button class="cellbtn ${on?'on':''}" data-act="pick" data-v="${t}:${k}" aria-pressed="${on}">${H.symbol(key,'secondary',t,k)}<small>${PA.H(H.label(key,'secondary',t,k).split('/')[0])}</small></button></td>`;
    }).join('')+`</tr>`;
  });
  return h+`</tbody></table><p class="note">ボタンをおすと、その副属和音にかわるよ。「—」は使わない形。</p></details>`;
}
function tipsHTML(key){
  return `<details class="more" data-d="tips"><summary>💡 おぼえておこう</summary><ul>
    <li><b>副属和音</b>は、Ⅰ以外の和音を<b>いっときのⅠ</b>と考えて、その調のⅤ7（またはⅦ7）を前においた和音。</li>
    <li>和音記号は「Ⅴ7/Ⅱ」（ⅡのⅤ7）のように、<b>／の右に目標</b>を書くよ。</li>
    <li>目標になれるのは<b>長三和音か短三和音</b>だけ。減三和音（${key.minor?'短調のⅡ':'長調のⅦ'}）はいっときのⅠにならないよ。</li>
    <li>いちばんだいじな音は目標の<b>導音</b>（目標の根音の半音下）。目標へは半音上へすすむよ（Ⅴ7/Ⅴ → Ⅴ7のときだけは、同じ声で半音下がってⅤ7の第7音になる）。</li>
    ${key.minor?'<li>短調のⅢ・Ⅶは、導音を上げない調号の音だけでつくった長三和音。「Ⅲ（自然）」「Ⅶ（自然）」と書いて、導音を上げたときのⅢ・Ⅶと区別するよ。</li>':''}
    <li>${H.JUN}のしるしは「同じ主音の短調から音をかりた」いみ。いっときの調が<b>長調</b>で、Ⅶ7（減七）にするために第9音をその短調からかりて、しかもその音がもとの${PA.keyName(key)}にもないときだけ、つくよ。</li>
    <li>ダブルシャープは楽譜と同じ「<span class="ds">x</span>」、ダブルフラットは「${PA.H('𝄫')}」であらわしているよ。</li>
    <li>右上の ⚙️ で、音の名前（ドレミ／CDE／ハニホ）と基準の音（ラ＝440〜443Hz）を選べるよ。</li>
  </ul></details>`;
}
// 📖 ことばメモ：本や楽譜で見かける名前を、やさしいことばで。例はいまの調・えらんだ副属和音で
function termsHTML(key,I){
  const lt=I.X.find(n=>n.tag==='lt');
  const F=PA.nmH({letter:3,acc:0}), Fs=PA.nmH({letter:3,acc:1}); // 対斜の例（ファとファ♯）
  return `<details class="more" data-d="terms"><summary>📖 ことばメモ（本や楽譜で見かける名前）</summary>
    <p class="note" style="margin:0 0 4px">例は${PA.keyName(key)}の${I.lab}（${I.sym}）だよ。</p><ul>
    <li><b>副属和音</b>（セカンダリー・ドミナント） … Ⅰ以外の和音を「いっときのⅠ」と考えて、その前におくⅤ7（またはⅦ7）。いまは${I.lab}＝${srcWhat(I)}。</li>
    <li><b>導音</b> … すぐ上の音へ半音でのぼりたがる音。${qC(key,lt)}は${I.tkName}の導音で、${I.tl}の根音へのぼるよ。</li>
    <li><b>減七</b>・<b>半減七</b> … どちらも導音からひとつとばしで4つかさねたⅦ7。Ⅴ9から根音をはぶいた形。第9音が半音低いほう（短調の形）なら減七、高いほう（長調の形）なら半減七。</li>
    <li><b>○</b>（準固有） … 同じ主音の短調から音をかりたしるし。${I.jun?`いまの${I.lab}は、第9音を${I.pm}からかりているよ。`:`いっときの調が長調で、第9音を同じ主音の短調からかりて、その音がもとの調にもないときだけ、つくよ。${I.k==='vii7'&&I.tmin?`いまはいっときの調が短調なので、第9音はもともと${I.tkName}の音。`:I.vb?`いまの第9音は${PA.keyName(key)}の音でもあるので、つかないよ。`:''}`}</li>
    ${key.minor?'<li><b>Ⅲ（自然）</b>・<b>Ⅶ（自然）</b> … 導音を上げない、調号の音だけの音階（<b>自然的短音階</b>）でつくった長三和音。導音を半音上げた音階（<b>和声的短音階</b>）だと、ⅢもⅦもちがうひびきの和音になるよ。</li>':''}
    <li><b>Ⅰ6</b> … Ⅰの第3音をいちばん下にした形（第1転回形）。Ⅰ¹と書く本もあるよ。</li>
    <li><b>対斜</b> … 同じ文字の音（たとえば「${F}」と「${Fs}」）が、ちがう声でつづけて出てぶつかること。にごって聞こえるので、さける。同じ声で半音動かせば、だいじょうぶ。</li>
  </ul></details>`;
}
// 変化和音クイズへ：副属和音だけのレベルはないので、いちばん近い 🎹 レベル5（ぜんぶ：副属和音も出る）。

/* ===== 画面 ===== */
let lastActions='';
function allMidis(key,I){
  const ms=[...I.X,...I.R,...I.T];
  ['target','chain'].forEach(m=>{const p=progOf(key,m,state.target,I.k);if(p) p.forEach(c=>ms.push(...c.ns));});
  return ms.map(n=>n.midi);
}
function render(){
  const key=curKey(), I=info(key), prog=curProg(key), A=state.anim, [lo,hi]=kbRange(allMidis(key,I));
  let h=`<div class="stack">
    <div class="toprow">${PA.keyChip(key)}<span class="note" style="margin:0">${PA.keyEn(key)}</span></div>
    <section class="card selcard">
      <p class="sellab">🎯 目標の和音（どの和音をよぶ？）</p>
      ${PA.seg('target',H.targets(key).map(t=>[t,`${ROMAN[t-1]}<small>${H.symbol(key,'target',t)}</small>`]),state.target,'full tseg')}
      <p class="sellab" style="margin-top:4px">🧩 前におく和音の形</p>
      <div class="seg full kseg" role="group">${KINDS.map(k=>{const ok=!!H.secondary(key,I.t,k);return `<button class="${I.k===k?'on':''}" data-act="kind" data-v="${k}" aria-pressed="${I.k===k}" ${ok?'':'disabled'}>${KNAME[k]}<small>${k==='V7'?'Ⅴの七の和音':k==='vii7'?'Ⅶ7・くらいひびき':'Ⅶ7・やわらかいひびき'}</small></button>`;}).join('')}</div>
      ${kindNote(key,I)}
    </section>
    ${heroCard(key,I)}`;
  let marks;
  if(A) marks=A.marks;
  else if(state.prog&&prog){const s=prog[state.prog.i];marks=marksOf(key,s.ns,s.col,{plain:!s.sec&&!s.tgt});}
  else if(state.res===1) marks=marksOf(key,I.R,TGT);
  else marks=marksOf(key,I.X,SEC);
  h+=`<section class="card"><h2>🎹 けんばん<small>${kbCaption(key,I,prog)}</small></h2><div class="scroll" data-sk="kb">${PA.kbSVG(lo,hi,marks)}</div></section>`;
  h+=staffCard(key,I);
  h+=doppelCard(key,I);
  h+=progCard(key,I,prog);
  h+=abCard(key,I);
  h+=tryCard(key);
  h+=overview(key);
  h+=tipsHTML(key);
  h+=termsHTML(key,I);
  h+=linksCard(I);
  h+=`</div>`;
  PA.paint(document.getElementById('view'),h,['secondary',state.minor,state.keyIdx,state.target,I.k,state.mode].join(':'));
  if(state.anim||state.prog) PA.follow(document.getElementById('view')); // 鳴っている和音の鍵が見えるように
  renderActions(I);
}
function renderActions(I){
  const busy=state.anim||state.prog;
  const acts=(busy?`<button class="btn" data-act="stop">${PA.icon('stop')}とめる</button>`:`<button class="btn night" data-act="build">🐸 つくりかた</button>`)+
    `<button class="btn" data-act="play" data-hot="listen">${PA.icon('listen')}いっしょに</button><button class="btn primary" data-act="resolve">${PA.icon('next')}${PA.H(shortLab(I.tls))}へ</button>`;
  if(acts!==lastActions){PA.paint(document.getElementById('actions'),acts,'bar');lastActions=acts;}
}

/* ===== 鳴らす ===== */
let token=0;
function stop(){token++;state.anim=null;state.prog=null;state.autoWait=false;PA.stopSound();}
function playChord(){stop();state.res=0;state.msg=null;render();PA.chord(midisOf(info(curKey()).X),{dur:2});}
async function playResolve(){
  stop(); const my=token, I=info(curKey());
  state.res=0; render();
  PA.chord(midisOf(I.X),{dur:1.4});
  await PA.sleep(1300); if(my!==token) return;
  state.res=1; render();
  PA.chord(midisOf(I.R),{dur:2.2});
  await PA.sleep(2300); if(my!==token) return;
  state.res=0; render(); // けんばんを副属和音（赤い導音）にもどす
}
async function playProg(){
  stop(); const my=token, prog=curProg(curKey()); if(!prog) return;
  state.res=0;
  for(let i=0;i<prog.length;i++){
    state.prog={i}; render();
    const last=i===prog.length-1;
    PA.chord(midisOf(prog[i].ns),{dur:last?2.2:1.3});
    await PA.sleep(last?2200:1100); if(my!==token) return;
  }
  await PA.sleep(300); if(my!==token) return;
  state.prog=null; render();
}
// 聴きくらべ：答えがわからないように、けんばんには出さない
function playAB(v){
  if(!state.ab) return;
  const s=abSeqs(curKey()); if(!s) return;
  stop(); state.res=0; render();
  const seq=v===state.ab.sec?s.sec:s.dia;
  seq.forEach((ns,i)=>PA.chord(midisOf(ns),{when:i*1.1,dur:i===seq.length-1?2.2:1.2}));
}

/* ===== つくりかたアニメ ===== */
async function runBuild(){
  stop(); const my=token, alive=()=>my===token, wait=async ms=>{await PA.sleep(ms);return alive();};
  const key=curKey(), I=info(key), st=stackOrder(I.X), lt=I.X.find(n=>n.tag==='lt');
  const A={cols:[],arrows:[],marks:new Map(),msg:'',kbCap:'',staffCap:'',hn:[]};
  state.anim=A; state.res=0; state.msg=null;
  const upd=m=>{if(m!==undefined)A.msg=m;render();};
  // ① 目標の和音をいっときのⅠに
  A.cols=[{notes:I.T,color:TGT,label:shortLab(I.tl)}]; A.marks=marksOf(key,I.T,TGT); A.hn=I.T.slice(1);
  A.staffCap=`目標：${I.tl}`; A.kbCap=`<b style="color:${TGT}">${I.tl}</b>（${I.tkName}のⅠ）`;
  upd(`<b>①</b>目標は${I.tl}「${namesW(I.T.slice(1))}」。この和音を<b>いっときのⅠ（主和音）</b>と考えると…<b class="tg">${I.tkName}</b>のⅠだね。`);
  PA.chord(midisOf(I.T),{dur:1.8}); if(!await wait(2100)) return;
  // ② その調のⅤ7（Ⅶ7）をひとつずつ
  const head=I.k==='V7'?`<b>②</b>${I.tkName}の<b>Ⅴ7</b>をつくるよ。根音は${I.tl}の根音${q(I.T[0])}から5度上の${q(I.X[0])}。`
    :`<b>②</b>${I.vb?`${I.tkName}と同じ主音の短調（${I.pm}）`:I.src}の<b>Ⅶ7（${KNAME[I.k]}）</b>をつくるよ。導音${qC(key,lt)}（${I.tl}の根音${q(I.T[0])}の半音下）からひとつとばしで4つ。<br><small>名前はⅤ9から見たよびかた：根音をはぶいたので、いちばん下の導音が第3音</small>`;
  A.staffCap=srcWhat(I);
  for(let i=0;i<4;i++){
    const shown=new Set(st.slice(0,i+1)), part=I.X.filter(n=>shown.has(n)), n=st[i], c=chg(key,n);
    A.cols=[{notes:part,color:SEC}]; A.marks=marksOf(key,part,SEC); A.hn=st.slice(0,i+1);
    A.kbCap=`${roleName(n.role)}${qC(key,n)}`;
    let line=`${i?'ひとつとばして':''}${roleName(n.role)}${qC(key,n)}`;
    if(n.tag==='lt') line+=`＝${I.tkName}の<b class="up">導音</b>`;
    if(c) line+=`（調の${q(dia(key,n))}を半音${c>0?'上げた':'下げた'}音）`;
    upd(head+`<br>${i+1}. ${line}`); PA.playNote(n.midi,0,1.1,0.22);
    if(!await wait(1500)) return;
  }
  A.cols=[{notes:I.X,color:SEC,label:shortLab(I.lab)}]; A.kbCap=`<b style="color:${SEC}">${I.lab}</b>`;
  upd(`${head}<br>できた！これが<b>${I.lab}</b>（${I.sym}）。`); PA.chord(midisOf(I.X),{dur:1.8});
  if(!await wait(2000)) return;
  // ③ 目標へすすむ
  A.cols=[{notes:I.X,color:SEC,label:shortLab(I.lab)},{notes:I.R,color:TGT,label:shortLab(I.tl)}];
  A.arrows=resArrows(I.X,I.R); A.staffCap=`${I.lab} → ${I.tl}`;
  upd(`<b>③</b>${I.tl}へすすむと…導音${qC(key,lt)}は半音上の${q(I.R[I.X.indexOf(lt)])}へ。`);
  PA.chord(midisOf(I.X),{dur:1.3}); if(!await wait(1200)) return;
  A.marks=marksOf(key,I.R,TGT); A.hn=stackOrder(I.X); A.kbCap=`<b style="color:${TGT}">${I.tl}</b>`; render();
  PA.chord(midisOf(I.R),{dur:2.2}); if(!await wait(2400)) return;
  state.msg=staticMsgDone(key,I); state.anim=null; render();
}

  state.res=0; state.msg=null; state.ab=null; save(); render();
  PA.chord(midisOf(info(curKey()).X),{dur:2});
}});
function pick(t,k){
  stop(); state.target=t; if(k) state.kind=k; state.kind=effKind(curKey()); state.res=0; state.msg=null; state.ab=null; save(); render();
  PA.chord(midisOf(info(curKey()).X),{dur:2});
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){ // おなじ調をひらく（リンクはそのまま進む）
    if(g.dataset.go==='doppel'){
      stop();
      const p=PA.store.get('doppel',{});
      PA.store.set('doppel',{...(p&&typeof p==='object'?p:{}),minor:state.minor,keyIdx:state.keyIdx,raised:true});
    }
    return;
  }
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act, v=el.dataset.v, key=curKey();
  if(a==='target'){const t=+v;if(!H.targets(key).includes(t))return;pick(t);}
  else if(a==='kind'){if(!KINDS.includes(v)||!H.secondary(key,state.target,v))return;pick(state.target,v);}
  else if(a==='pick'){const [t,k]=String(v).split(':');if(!H.targets(key).includes(+t)||!KINDS.includes(k)||!H.secondary(key,+t,k))return;pick(+t,k);PA.scrollTop();}
  else if(a==='play'){
    if(state.anim){PA.chord(midisOf(state.anim.cols[state.anim.cols.length-1].notes),{dur:2});return;} // アニメ中はとめずに鳴らす
    playChord();
  }
  else if(a==='resolve') playResolve();
  else if(a==='build') runBuild();
  else if(a==='stop'){stop();render();}
  else if(a==='prog') playProg();
  else if(a==='mode'){if(v!=='target'&&v!=='chain')return;stop();state.mode=v;render();}
  else if(a==='qnext'){stop();state.ab={sec:Math.random()<0.5?'A':'B',answer:null};render();}
  else if(a==='abplay') playAB(v);
  else if(a==='qchoose'){if(state.ab&&state.ab.answer==null&&(v==='A'||v==='B')){stop();state.ab.answer=v;state.abN++;if(v===state.ab.sec)state.abOk++;render();}}
});
render();
// ほかのアプリから「つくりかたを見る」で来たとき：えらばれた調・和音でアニメをはじめる
// iPhone などではこのページをタッチするまで音が出ないので、音が出せるようになってからはじめる
// （音がとまっているあいだに音をよやくすると、あとでいっぺんに鳴ってしまう）
if(PA.store.get('secondary-auto',false)) (async()=>{
  PA.store.set('secondary-auto',false);
  const t0=token; // まっているあいだにほかの操作をしたらやめる
  if(PA.settings.sound){ // パソコンなどですぐ音が出せるならそのままはじめる
    PA.audio();
    for(let i=0;i<5&&!PA.audioRunning();i++) await PA.sleep(30);
  }
  if(token!==t0) return;
  if(!PA.settings.sound||!PA.audio()||PA.audioRunning()){runBuild();return;} // 音が出せないブラウザでは待たずにはじめる
  state.autoWait=true; render();
  const EV=['pointerup','touchend','keydown'];
  let busy=false;
  const off=()=>EV.forEach(t=>document.removeEventListener(t,go,true));
  async function go(e){
    if(!state.autoWait){off();return;}
    const t=e&&e.target;
    if(t&&t.closest&&t.closest('button,a,dialog,summary,.appbar,[data-act],[data-pa],[data-m]')) return;
    if(busy) return; busy=true;
    PA.audio();
    for(let i=0;i<15&&PA.settings.sound&&!PA.audioRunning();i++) await PA.sleep(30);
    busy=false;
    if(!state.autoWait){off();return;}
    if(PA.settings.sound&&PA.audio()&&!PA.audioRunning()) return; // まだ音が出せない：つぎのタッチをまつ
    off(); runBuild();
  }
  EV.forEach(t=>document.addEventListener(t,go,true));
})();
</script>
