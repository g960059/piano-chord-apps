<script src="assets/core.js"></script>
<script>
/* 短調クイズ：短調のⅤの家族（Ⅴ・Ⅴ7・Ⅴ9・減七）をけんばんでおさえる／7ばんめにつける記号をえらぶ
 * リンクのパラメータ（先生の宿題用。その1回だけ。ちがう値はすてる）：
 *   mode＝chord（和音をおさえる）｜mark（記号をえらぶ）、key＝m0〜m12（その短調だけ出す。記号をえらぶときと、
 *   和音を1つだけえらんだときは、おなじもんだいがつづかないようにさいしょの1もんだけその調。あとは tier の調）、
 *   chord＝V,V7,V9,DIM（カンマでいくつでも）、tier＝easy｜normal｜hard｜all、n＝1〜20（📝 n もんの回）
 *   key があって mode がないときは和音をおさえる（にがてふくしゅう：その調をつづけてれんしゅう）
 *   例：minor-quiz.html?mode=mark&key=m3&n=3 */
// Ⅴの家族：和声的短音階のなんばんめをひとつとばしで（4＝第5音から）
const FAM={
  V:{label:'Ⅴ',ks:[4,6,8],title:'Ⅴ'},
  V7:{label:'Ⅴ7',ks:[4,6,8,10],title:'Ⅴ7'},
  V9:{label:'Ⅴ9',ks:[4,6,8,10,12],title:'Ⅴ9'},
  DIM:{label:'減七',ks:[6,8,10,12],title:'減七の和音（Ⅴ9から根音をはぶいた和音）'}
};
const FAM_KEYS=['V','V7','V9','DIM'];
// 主音が高い調では、和音を1オクターブ下に置いて五線の中におさめる
const famShift=key=>key.tonicMidi+7>70?-7:0;
const famTones=(key,f)=>FAM[f].ks.map(k=>PA.at(key.harm,k+famShift(key)));
const MARK={1:'♯',0:'♮',2:'𝄪'};
const MARK_NAME={1:'シャープ',0:'ナチュラル',2:'ダブルシャープ'};
const MARKS=[1,0,2,-1]; // えらぶ記号（ふだんのじゅん）
const QUIZ='minor-quiz', KD=PA.keyDeck, MODES=['minor']; // 短調だけ：「ぜんぶ」は短調の13の書きかた
const TYPES=['chord','mark'];
const TIER_IDS=KD.TIERS.map(t=>t.id);
// まえの「調号の数（〜つまで）」＝0〜N の調 → 出る調がいちばん近いむずかしさ（ちがう調の数が少ないもの）。
// まえのきほん（2つまで）は「やさしい」（イ・ホ・ニ短調）に。ロ・ト短調はへるけれど、いきなりむずかしくしない
const LEVEL_TIER=new Map([[0,'easy'],[1,'easy'],[2,'easy'],[3,'normal'],[4,'all'],[5,'all'],[7,'all']]);
const KEYS=Array.from({length:PA.keyCount(true)},(_,i)=>PA.minorKey(i)); // 主音はラ3〜ソ♯4
const KB_LO=53, KB_HI=86; // ファ3〜レ6（こたえはぜんぶこの中）
const mod=PA.mod;
const isBlack=m=>PA.BLACK.has(mod(m,12));
const AFTER_END=10*6e4; // おわった回のけっかを、読みなおしても出す時間（core とおなじ10分）

/* ===== 状態 ===== */
// fixKey＝この調だけ出す（リンクの key・チェック表のます）。peeked＝こたえるまえに「つくりかた」を見た
// fixUsed＝さいしょの1もんだけ fixKey のとき（fixOnce）、もうその調を出した
const Q={type:'chord',tier:'all',weak:true,peeked:false,fams:{V:true,V7:true,V9:false,DIM:false},fixKey:null,fixUsed:false,q:null,id:0,picked:new Set(),checked:false,result:null,lastOk:null,right:0,total:0,streak:0,hint:0,chosen:null,sumShow:false,sessDoneId:null};
let fixQid=0; // fixOnce のさいしょの1もん（その調）のもんだい番号。🔑 はこのもんだいのあいだだけ出す
const isInt=(v,lo,hi)=>Number.isInteger(v)&&v>=lo&&v<=hi;
const saved=(d=>d&&typeof d==='object'&&!Array.isArray(d)?d:{})(PA.store.get('minor-quiz',{}));
const minorId=v=>{const p=KD.parse(v);return p&&p.minor?p.id:null;}; // m0〜m12だけ
(function(){
  const d=saved;
  if(TYPES.includes(d.type)) Q.type=d.type;
  if(TIER_IDS.includes(d.tier)) Q.tier=d.tier;
  else if(LEVEL_TIER.has(d.level)) Q.tier=LEVEL_TIER.get(d.level);
  if(typeof d.weak==='boolean') Q.weak=d.weak;
  if(d.fams&&typeof d.fams==='object'){
    FAM_KEYS.forEach(f=>{if(typeof d.fams[f]==='boolean')Q.fams[f]=d.fams[f];});
    if(!FAM_KEYS.some(f=>Q.fams[f])) Q.fams.V7=true;
  }
  if(isInt(d.total,0,1e6)&&isInt(d.right,0,d.total)&&isInt(d.streak,0,d.right)){Q.total=d.total;Q.right=d.right;Q.streak=d.streak;
    if(isInt(d.hint,0,d.total-d.right)) Q.hint=d.hint;}
})();
// ふだんの設定（保存する）。リンクのしゅるい・むずかしさ・和音は ov（その1回だけ）に入れて、ふだんの設定はかえない
const base={type:Q.type,tier:Q.tier,fams:Object.assign({},Q.fams)};
const cleanOv=o=>{ // ov の形をたしかめる（ゆるした値だけ）
  if(!o||typeof o!=='object') return null;
  const r={};
  if(TYPES.includes(o.type)) r.type=o.type;
  if(TIER_IDS.includes(o.tier)) r.tier=o.tier;
  if(o.fams&&typeof o.fams==='object'){const f={};FAM_KEYS.forEach(k=>{f[k]=o.fams[k]===true;});if(FAM_KEYS.some(k=>f[k])) r.fams=f;}
  return Object.keys(r).length?r:null;
};
// リンクのパラメータ（ゆるした値だけ。この1回につかい、ほぞんした設定はかえない）
const P=PA.params(), linkKey=minorId(P.key);
// いったん Q にのせて、ふだんの設定とちがうところだけ ov にとる（Q はあとの applyEff でかさねなおす）
const linkOv=(function(){
  if(TYPES.includes(P.mode)) Q.type=P.mode;
  // key だけで mode のないリンク（ホームのにがてふくしゅう「3もんずつ」）：和音をおさえるでその調をつづけて出す
  else if(linkKey) Q.type='chord';
  if(TIER_IDS.includes(P.tier)) Q.tier=P.tier;
  if(P.chord){
    const fs=P.chord.split(',').map(s=>s.trim().toUpperCase()).filter(f=>FAM_KEYS.includes(f));
    if(fs.length) FAM_KEYS.forEach(f=>{Q.fams[f]=fs.includes(f);});
  }
  const fd=FAM_KEYS.some(f=>Q.fams[f]!==base.fams[f]);
  return cleanOv({type:Q.type!==base.type?Q.type:null,tier:Q.tier!==base.tier?Q.tier:null,fams:fd?Q.fams:null});
})();
let ov=null;
// いまの設定＝ふだんの設定の上に ov をかさねたもの
const applyEff=()=>{Q.type=ov&&ov.type||base.type;Q.tier=ov&&ov.tier||base.tier;Q.fams=Object.assign({},ov&&ov.fams||base.fams);};
// じぶんでかえた設定：ふだんの設定にのこし、そのことはもうリンクの値をつかわない
const setBase=(k,v)=>{base[k]=k==='fams'?Object.assign({},v):v; if(ov){delete ov[k]; if(!Object.keys(ov).length) ov=null;}};
// リンクの1回がおわった：ふだんの設定にもどす。いまの設定がかわったら true
function endOv(){
  if(!ov) return false;
  const was=JSON.stringify([Q.type,Q.tier,Q.fams]); ov=null; applyEff();
  if(JSON.stringify([Q.type,Q.tier,Q.fams])===was) return false;
  deck.setOptions({tier:Q.tier}); return true;
}
// 📝 れんしゅうの回：リンクに n があればはじめる（おなじリンクのとちゅうならつづき）
let sess=(()=>{
  const n=PA.paramInt('n',1,20);
  if(n) return PA.session(QUIZ,{n});
  const s=PA.session(QUIZ), st=s.state();
  // n のないひらきかた：とちゅうの回はつづける。おわった回は、おわってすぐ（「もどる」の読みなおし）だけけっかを出す
  if(st&&s.finished()&&!(st.endedAt!=null&&Date.now()-st.endedAt<AFTER_END)) s.clear();
  return s;
})();
const sessOn=()=>sess.active()||sess.finished();
// リンクで来たひらきかた（このれきしのページ）。読みなおしてもおぼえている
let fromLinkVisit=false; try{fromLinkVisit=!!(history.state&&history.state.mqLink);}catch(e){}
// リンクの値：リンクで来たらその値。なければ、つづきの回かおなじリンクの読みなおしのときだけのこした値
ov=PA.fromLink()?linkOv:(sessOn()||fromLinkVisit?cleanOv(saved.ov):null);
applyEff();
// この調だけ：リンクの key。なければ、つづきの回か、おなじリンクの読みなおしでえらんでいた調
Q.fixKey=linkKey||(sessOn()||fromLinkVisit?minorId(saved.fixKey):null);
// 記号のもんだいは1つの調に1もん。和音も1つだけなら1もん。このときは fixKey をさいしょの1もんだけつかう
// （おなじもんだいを3〜5かいくりかえさない。2もんめからはふくろの調＝えらんだむずかしさ）
const onceMode=()=>Q.type==='mark'||FAM_KEYS.filter(f=>Q.fams[f]).length===1;
const fixOnce=()=>!!Q.fixKey&&onceMode();
// もう出したか：読みなおし・おなじ回のつづきではおぼえておく。新しいリンクの key ならはじめから
Q.fixUsed=!!Q.fixKey&&Q.fixKey===minorId(saved.fixKey)&&saved.fixUsed===true&&(!linkKey||(sess.active()&&sess.count()>0));
// リンクのパラメータは1回だけつかう：アドレスからけす（「つくりかたを見る」からもどって読みなおしても、
// きりかえたもんだい・やめた回・チェック表からはじめた回をリンクでもとにもどさない）
if(location.search){try{history.replaceState({mqLink:true},'',location.pathname+location.hash);}catch(e){}}
Q.sumShow=sess.finished();
// スコアと、まだこたえていないもんだいも保存する（「つくりかたを見る」からもどったときつづけられるように）
const save=()=>PA.store.set('minor-quiz',{type:base.type,tier:base.tier,weak:Q.weak,fams:base.fams,ov:ov,right:Q.right,total:Q.total,streak:Q.streak,hint:Q.hint,fixKey:Q.fixKey,fixUsed:Q.fixUsed,
  q:Q.q?{keyIdx:Q.q.keyIdx,fam:Q.q.fam,type:Q.type}:null,fixQ:!!Q.q&&fixQid===Q.id,answered:Q.result!==null,peeked:Q.peeked,deck:deckState()});
const openD={}; // ひらいている<details>（描きなおしてもとじないように）

/* ===== もんだい（調は PA.keyDeck のふくろから。fixKey のときはその調だけ。fixOnce のときはさいしょの1もんだけ） ===== */
const deck=KD.create({quiz:QUIZ,tier:Q.tier,modes:MODES,weak:Q.weak});
const keyIdOf=q=>KD.id(true,q.keyIdx);
const restoreDeck=s=>deck.restore(s); // ひらきなおしてもふくろのつづきから。もどせたら true
const deckState=()=>deck.state();
const hasBag=restoreDeck(saved.deck); // ひらきなおしてもふくろのつづきから
let lastQ=null; // ひらいたとき、まえに出ていたもんだい（つづけておなじもんだいにしない）
function newQuestion(){
  // けっかを見ないでほかのもんだいへ（せっていをかえたなど）：おわった回はしまう
  if(sess.finished()){sess.clear(); endOv();} // 回がおわった：リンクの設定もおしまい
  Q.sumShow=false;
  const prev=Q.q||lastQ, pid=prev?keyIdOf(prev):null;
  // さいしょの1もんにこたえないままかえた（しゅるい・和音）：つぎもその調から
  if(Q.q&&Q.result===null&&keyIdOf(Q.q)===Q.fixKey) Q.fixUsed=false;
  // れんしゅうの回のそとでさいしょの1もんがおわった：もうふつう（🔑 もけす）。回のあいだは「もういちど」のためにのこす
  if(fixOnce()&&Q.fixUsed&&!sess.active()){Q.fixKey=null;Q.fixUsed=false;}
  const once=fixOnce();
  let k=Q.fixKey&&!(once&&Q.fixUsed)?KD.parse(Q.fixKey):null;
  fixQid=once&&k?Q.id+1:0;
  Q.fixUsed=once; // fixOnce なら、いま出したかもう出した。そうでなければつぎに fixOnce になったときまたさいしょから
  // まえとちがう調をとる（まえの調はふくろにのこる）。ふつうは deck がつづけて同じ調を出さない
  if(!k) k=deck.draw(x=>x.id!==pid)||deck.draw();
  if(!k||!k.minor) k={minor:true,idx:0};
  let fams=FAM_KEYS.filter(f=>Q.fams[f]); if(!fams.length) fams=['V7'];
  if(prev&&k.idx===prev.keyIdx&&fams.length>1) fams=fams.filter(f=>f!==prev.fam); // 調がおなじなら和音をかえる
  lastQ=null;
  const q={keyIdx:k.idx,fam:fams[Math.floor(Math.random()*fams.length)]};
  Object.assign(Q,{q,id:Q.id+1,picked:new Set(),checked:false,result:null,lastOk:null,chosen:null,peeked:false});
}
(function(){ // まだこたえていないもんだいをそのままつづける
  const q=saved.q;
  if(!q||typeof q!=='object'||!isInt(q.keyIdx,0,KEYS.length-1)||!FAM_KEYS.includes(q.fam)) return;
  const id=keyIdOf(q), fixNow=Q.fixKey&&!(fixOnce()&&Q.fixUsed);
  const fits=fixNow?id===Q.fixKey:deck.ids.includes(id)||id===Q.fixKey;
  // おなじしゅるいのもんだい（和音／記号）のときだけ（「見た」しるしをほかのもんだいにつけない）
  if(!saved.answered&&!Q.sumShow&&q.type===Q.type&&Q.fams[q.fam]&&fits){
    Q.q={keyIdx:q.keyIdx,fam:q.fam};Q.id++;Q.peeked=saved.peeked===true;
    if(fixOnce()&&id===Q.fixKey&&(!Q.fixUsed||saved.fixQ===true)){Q.fixUsed=true;fixQid=Q.id;} // さいしょの1もんをつづける
    if(!hasBag&&id!==Q.fixKey) deck.draw(x=>x.id===id); // ふくろのきろくがないときも、この調は「出た」ことに
  }
  else lastQ={keyIdx:q.keyIdx,fam:q.fam};
})();
// もんだいのことば（けっかのカードにのこす。ただの文字）
const qLabel=()=>{const key=KEYS[Q.q.keyIdx];return Q.type==='mark'?`${PA.keyName(key)}の7ばんめの記号`:`${PA.keyName(key)}の${FAM[Q.q.fam].label}`;};
// さいしょの答えだけかぞえる（Q.result がまだ null のときによぶ）。
// こたえるまえに「つくりかた」を見てできた＝ヒントでできた：⭐はふえないけれど、れんぞくもきれない（チェック表は 💡）
function scoreFirst(ok){
  const hint=ok&&Q.peeked;
  Q.result=ok; Q.total++;
  if(ok&&!hint){Q.right++;Q.streak++;}
  else if(hint) Q.hint++;
  else if(!ok) Q.streak=0;
  deck.record(keyIdOf(Q.q),ok,hint?{hint:true}:undefined);
  const r=sess.active()?sess.record({ok,hint,label:qLabel(),key:keyIdOf(Q.q)}):null;
  if(r&&r.finished) Q.sessDoneId=Q.id; // このもんだいで回がおわった
}
// 調号だけの小さな五線（こたえる前にヒーローの中で見せる）。上下のあきをけずって低くする
const sigStaff=key=>PA.staffSVG(key,[],{minW:130,maxScale:1}).replace(/viewBox="0 0 (\d+(?:\.\d+)?) \d+(?:\.\d+)?"/,'viewBox="0 38 $1 100"');
const nameForMidi=(m,key)=>PA.nm(PA.spellMidi(m,key));
function gradeChord(t){
  const ans=new Set(t.map(n=>mod(n.midi,12))), pk=new Set([...Q.picked].map(m=>mod(m,12)));
  const extra=[...pk].filter(p=>!ans.has(p)), missing=t.filter(n=>!pk.has(mod(n.midi,12)));
  return {ok:!extra.length&&!missing.length,ans,pk,extra,missing};
}
function checkChord(){
  const key=KEYS[Q.q.keyIdx], f=Q.q.fam, t=famTones(key,f), ok=gradeChord(t).ok;
  Q.checked=true; Q.lastOk=ok; PA.answerFx(ok);
  if(Q.result===null) scoreFirst(ok);
  if(ok) PA.chord(t.map(n=>n.midi));
  PA.announce(ok?`正解！${PA.keyName(key)}の${FAM[f].label}は${PA.namesT(t)}`:`ざんねん。こたえは${PA.namesT(t)}`);
}
// ヒントでできたときのひとこと
const hintDone=()=>Q.result===true&&Q.peeked?`<br>💡 つくりかたを見てからできたので「ヒントでできた」になるよ。次は見ないでやってみよう！`:'';
// こたえあわせのメッセージ（描くたびにつくるので、音名の設定をかえてもあう）
function chordMsg(key,f,t){
  const g=gradeChord(t), pk=g.pk, extra=g.extra, missing=g.missing;
  if(Q.lastOk) return `🎉 正解！${PA.keyName(key)}の${FAM[f].label}は<b>${PA.namesH(t)}</b>`+hintDone();
  const hints=[];
  if(missing.some(n=>n.raised)&&extra.includes(mod(key.natLT.midi,12)))
    hints.push(`7ばんめ「${PA.nmH(key.natLT)}」を半音上げるのを、わすれていない？${PA.keyName(key)}では<b>${PA.nmH(key.lt)}</b>（${PA.H(MARK[key.ltType])}${MARK_NAME[key.ltType]}）だよ。`);
  else if(missing.some(n=>n.raised)){
    let m=`導音（7ばんめを上げた音）は<b>${PA.nmH(key.lt)}</b>（${PA.H(MARK[key.ltType])}${MARK_NAME[key.ltType]}）だよ。主音「${PA.nmH(key.nat[0])}」のすぐ下（となり）。`;
    if(extra.includes(mod(key.nat[0].midi,12))) m+=`<br>上げるのはすぐ上のけんばんまで。主音まで上げすぎていない？`;
    hints.push(m);
  }
  const root=PA.at(key.harm,4), nin=PA.at(key.harm,12), pnin=PA.at(key.par.scale,12);
  if(f==='DIM'&&pk.has(mod(root.midi,12))) hints.push(`減七はⅤ9から根音「${PA.nmH(root)}」を<b>はぶいた</b>和音だよ。`);
  if((f==='V9'||f==='DIM')&&!pk.has(mod(nin.midi,12))&&extra.includes(mod(pnin.midi,12)))
    hints.push(`${FAM[f].label}のいちばん上の音（第9音）は6ばんめ「${PA.nmH(nin)}」で、調号どおり。「${PA.nmH(pnin)}」は${PA.keyName(key.par)}の音だよ。`);
  if(pk.size!==t.length) hints.push(`${FAM[f].label}は<b>${t.length}つ</b>の音だよ（いま${pk.size}つ）。`);
  return `🤔 おしい！こたえは<b>${PA.namesH(t)}</b><br>`+(hints.join('<br>')||(f==='DIM'?`導音「${PA.nmH(key.lt)}」からひとつとばしで4つ（根音「${PA.nmH(root)}」ははぶく）。`:`音階の5ばんめ「${PA.nmH(root)}」からひとつとばしで、かさねてみよう。`));
}

const markWord=a=>a===2?'ダブルシャープ':a===1?'シャープ':a===0?'ナチュラル':'フラット';

    <li><b>Ⅴ</b>は音階の5ばんめ（根音）からひとつとばしで3つ。<b>Ⅴ7</b>は、もうひとつとばして4つ。<b>Ⅴ9</b>は、さらにもう1つのせて5つ。</li>
    <li><b>減七</b>はⅤ9からいちばん下の根音を<b>はぶいた</b>4つの音。</li>

}
// 短調のチェック表（たたんでおく）。おなじ音の調（嬰ニ短調・変ホ短調）は1つのます。ますをおすとその調を3もん
// （onceMode ではその調からはじめて3もん。core のことばをなおす）
const PICK_NOTE='その調を3もん、れんしゅうできます。', PICK_SR='を3もんれんしゅう（';
function checkHTML(){
  const T=KD.tally(QUIZ,{modes:MODES});
  let table=KD.checkTableHTML(QUIZ,{modes:MODES,pickable:true,title:'🌙 12の短調'});
  if(onceMode()) table=table.split(PICK_NOTE).join('その調から始めて3もん、れんしゅうできます（2もんめからは、ほかの調も出ます）。').split(PICK_SR).join('から始めて3もんれんしゅう（');
  return `<details class="more" data-d="check" ${openD.check?'open':''}><summary>📋 短調チェック表<small>できた調${T.good}／${T.total}・にがてな調がわかるよ</small></summary>${table}</details>`;
}
function markView(key){
  const done=Q.chosen!=null;
  let h=`<section class="card hero"><div class="qtitle"><span class="qkey">${PA.keyName(key)}</span><span class="qsig">（${PA.sigLabel(key)}）</span></div>
    <p class="qtext">7ばんめ「<b>${PA.nmH(key.natLT)}</b>」を主音の半音下にするには、どの記号をつける？</p>
    <div class="qstaff">${PA.staffSVG(key,[{notes:[done?key.lt:key.natLT],color:done?'#d1495b':'#3b4fa8',accColor:'#d1495b',accRing:true},{notes:[PA.at(key.nat,7)],color:'#3b4fa8'}],{minW:220,colW:70})}</div>
    <div class="choices">`+MARKS.map(a=>{
      let cls=''; if(done){if(a===key.ltType)cls='right';else if(a===Q.chosen)cls='wrong';}
      return `<button class="choice ${cls}" data-act="qmark" data-v="${a}" ${done?'disabled':''}>${cls==='right'?'⭕ ':cls==='wrong'?'❌ ':''}${markGlyph(a)}<span class="cn">${markWord(a)}</span></button>`;
    }).join('')+`</div>`;
  if(done){
    const sacc=key.sig[key.natLT.letter]||0, d=Q.chosen-sacc, cn=PA.nmH({letter:key.natLT.letter,acc:Q.chosen});
    const why=Q.lastOk?'':d>=2?`「${cn}」だと主音「${PA.nmH(key.nat[0])}」と同じ高さ（かそれより上）になっちゃう。上げるのはすぐ上のけんばんまで。<br>`:d===0?`その記号だと「${PA.nmH(key.natLT)}」のまま。上がらないよ。<br>`:`それだと「${cn}」で下がっちゃう。<br>`;
    h+=`<div class="fb ${Q.lastOk?'good':'bad'}" role="status">${Q.lastOk?'🎉 正解！':'🤔 おしい！'}${why}${PA.keyName(key)}では「${PA.nmH(key.natLT)}」に${PA.H(MARK[key.ltType])}をつけて<b>${PA.nmH(key.lt)}</b>。
      ${key.ltType===0?'調号の♭をとると半音上がるよ。':key.ltType===2?'調号でもう♯がついているので、もう1つ上げてダブルシャープ。':'調号に何もついていない音なので、♯で上げるよ。'}</div>
      <div class="row" style="margin-top:10px"><button class="btn small" data-act="qexplain">🐸 つくりかたを見る</button></div>`;
  }
  return h+`</section>`;
}
function chordView(key){
  const f=Q.q.fam, t=famTones(key,f), marks=new Map(), set=(m,o)=>marks.set(m,Object.assign(marks.get(m)||{},o));
  if(!Q.checked){
    Q.picked.forEach(m=>set(m,{fill:isBlack(m)?'#e9a800':'#ffd66b',label:nameForMidi(m,key),tc:'#3a3245',sr:'選んだ'}));
    // はじめに見せる位置：主音（どの和音にも入らない音）のあたり。こたえの鍵には何もつけない
    set(PA.at(key.harm,7+famShift(key)).midi,{focus:true});
  }else{
    const g=gradeChord(t);
    Q.picked.forEach(m=>{const ok=g.ans.has(mod(m,12));set(m,{fill:ok?'#22a06b':'#d1495b',tc:'#fff',label:(ok?'○':'×')+nameForMidi(m,key),sr:ok?'選んだ・正解':'選んだ・まちがい',focus:true});});
    t.forEach(n=>{if(!g.pk.has(mod(n.midi,12))&&!marks.has(n.midi)) set(n.midi,{fill:isBlack(n.midi)?undefined:'#fff',label:PA.nm(n),tc:'#3b4fa8',ring:'#3b4fa8',sr:'たりない音',focus:true});});
  }
  const names=[...Q.picked].sort((a,b)=>a-b).map(m=>PA.H(nameForMidi(m,key)));
  return `<section class="card hero"><div class="qhead"><div class="qtitle"><span class="qkey">${PA.keyName(key)}</span>の<span class="badge qbadge">${FAM[f].label}</span>は？</div>
    ${Q.checked?'':`<div class="sigstaff">${sigStaff(key)}</div>`}</div>
    <p class="note">${PA.sigLabel(key)}・${t.length}つの音${f==='DIM'?'（Ⅴ9から根音をはぶいた和音）':''}</p>
    <p class="inst">${Q.checked?'<b style="color:#22a06b">緑の○</b>＝あたり、<b style="color:#d1495b">赤の×</b>＝ちがう音、<b style="color:#3b4fa8">青わく</b>＝たりない音':`けんばんをタップして<b>${t.length}つ</b>の音をおさえよう（もういちどタップすると、けせる）`}</p>
    <div class="scroll" data-sk="kb">${PA.kbSVG(KB_LO,KB_HI,marks)}</div>
    <div class="picked">おさえた音：<b>${names.length?names.join('・'):'まだなし'}</b></div>
    ${Q.checked?`<div class="fb ${Q.lastOk?'good':'bad'}" role="status">${chordMsg(key,f,t)}</div>`:''}
    <div class="row" style="margin-top:10px"><button class="btn small" data-act="qexplain">🐸 つくりかたを見る</button></div>
    ${Q.result===null?`<p class="hintnote">${PA.HINT_NOTE}</p>`:''}
  </section>
  ${Q.checked?`<section class="card"><h2>🎼 がくふ<small>${PA.keyName(key)}の${FAM[f].label}（赤い音＝導音）</small></h2>
    <div class="qstaff">${PA.staffSVG(key,[{notes:t,color:'#3b4fa8',ltColor:'#d1495b',accColor:'#d1495b'}],{minW:200,maxScale:1.3})}</div></section>`:''}`;
}

const sessLast=()=>Q.sessDoneId===Q.id&&sess.finished()&&!Q.sumShow;

function topHTML(){
  // ヒントでできたもんだいはべつに出す（まちがいに見えないように）
  const sc=`<div class="score">⭐ ${Q.hint?`じぶんで${Q.right}・💡 ヒントで${Q.hint}／${Q.total}もん`:`${Q.right}／${Q.total}`}　<span>れんぞく${Q.streak}</span> <span class="stars">${'🌟'.repeat(Math.min(Q.streak,10))}</span></div>`;
  const ss=sess.active()?`<div class="sessrow">${sess.progressHTML()}<button class="btn small" data-act="sessstop">やめる</button></div>`
    :sessLast()?`<div class="sessrow">${sess.progressHTML()}</div>`
    :Q.sumShow?'':`<button class="btn small" data-act="sess5">${PA.icon('session')}きょうの5もん</button>`;
  const fk=Q.fixKey?KD.parse(Q.fixKey):null;
  const fix=!fk||fixOnce()&&(Q.sumShow||Q.fixUsed&&fixQid!==Q.id)?'':fixOnce()?`<div class="fixrow"><span class="chip">🔑 さいしょは${PA.keyName(KEYS[fk.idx])}</span><button class="btn small" data-act="qunfix">ふつうにもどす</button></div>`
    :`<div class="fixrow"><span class="chip">🔑 ${PA.keyName(KEYS[fk.idx])}だけ</span><button class="btn small" data-act="qunfix">ほかの調も出す</button></div>`;
  return `<div class="toprow">${sc}${ss}</div>${fix}`;
}
function render(){
  if(!Q.q&&!Q.sumShow) newQuestion(); // けっかのカードのあいだはもんだいをつくらない（ふくろをへらさない）
  const key=Q.q?KEYS[Q.q.keyIdx]:KEYS[0];
  let h=`<div class="stack">${PA.seg('qtype',[['chord',PA.icon('piano')+'和音をおさえる'],['mark',PA.icon('hand')+'記号を選ぶ']],Q.type,'full')}${topHTML()}`;
  if(Q.sumShow) h+=sess.summaryHTML({title:'短調クイズ',page:QUIZ,params:linkParams(),settings:settingsText()})+checkHTML()+`</div>`;
  else h+=`${settingsHTML()}
    ${Q.type==='mark'?markView(key):chordView(key)}
    ${tipsHTML()}
    ${checkHTML()}</div>`;
  PA.paint(document.getElementById('view'),h,Q.type+':'+Q.id+(Q.sumShow?':sum':''));
  renderActions(key);
  save();
}
function renderActions(key){
  const bar=document.getElementById('actions');
  const last=sessLast();
  const next=lab=>last?`<button class="btn primary wide" data-act="qsum" data-hot="next">${PA.icon('session')}けっかを見る</button>`:`<button class="btn primary wide" data-act="qnext" data-hot="next">${lab}</button>`;
  let h='';
  if(Q.sumShow) h='';
  else if(Q.type==='mark'){
    if(Q.chosen!=null) h=next(PA.icon('next')+'次の問題')+`<button class="btn" data-act="qplaylt" data-hot="listen">${PA.icon('listen')}${PA.nmH(key.lt)}→${PA.nmH(key.nat[0])}</button>`;
  }else if(!Q.checked){
    h=`<button class="btn ok wide" data-act="qcheck" data-hot="check" ${Q.picked.size?'':'disabled'}>${PA.icon('check')}こたえあわせ</button><button class="btn" data-act="qtry" data-hot="listen" ${Q.picked.size?'':'disabled'}>${PA.icon('listen')}きく</button><button class="btn" data-act="qclear" ${Q.picked.size?'':'disabled'}>${PA.icon('erase')}けす</button>`;
  }else{
    h=next(PA.icon('next')+'次へ')+`${Q.lastOk?'':`<button class="btn" data-act="qretry">${PA.icon('retry')}もういちど</button>`}<button class="btn" data-act="qplay" data-hot="listen">${PA.icon('listen')}こたえ</button>`;
  }
  PA.paint(bar,h,'bar'); bar.hidden=!h; // フォーカスのもどし先は core がきめる
}
const showFb=()=>{const fb=document.querySelector('#view .fb'); if(fb&&fb.scrollIntoView) fb.scrollIntoView({block:'nearest',behavior:PA.reduceMotion()?'auto':'smooth'});};
const playLT=k=>{PA.playNote(k.lt.midi,0,0.9,0.24);PA.playNote(k.lt.midi+1,0.8,1.4,0.24);};
// 新しいもんだいで上から（回のはじまり・つぎへ）
const fresh=()=>{PA.stopSound();newQuestion();render();PA.scrollTop();};

/* ===== 操作 ===== */
PA.mountBar({title:'短調クイズ',app:'minor-quiz'});
PA.onPageShow=()=>{PA.stopSound();location.reload();}; // 「もどる」でもどったら読みなおす（べつのページですすめたきろくを古いきろくで上書きしない）
PA.onSettings=render;
PA.onKey=m=>{ // 音は core が鳴らす
  if(Q.sumShow||Q.type!=='chord'||Q.checked) return;
  if(PA.midiIn){while(m<KB_LO)m+=12;while(m>KB_HI)m-=12;} // 電子ピアノ：画面のけんばんの高さへ
  Q.picked.has(m)?Q.picked.delete(m):Q.picked.add(m);
  render();
};
document.addEventListener('toggle',e=>{const d=e.target; if(d&&d.dataset&&d.dataset.d) openD[d.dataset.d]=d.open;},true);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act, v=el.dataset.v;
  switch(a){
    case 'qtype': {
      if(Q.type===v||!TYPES.includes(v)) return;
      PA.stopSound(); Q.type=v; setBase('type',v);
      save(); newQuestion(); break; // おわった回（けっかを見ないでほかへ）は newQuestion がしまう
    }
    case 'qtier': if(Q.tier===v||!TIER_IDS.includes(v)) return; PA.stopSound(); Q.tier=v; setBase('tier',v); Q.fixKey=null; deck.setOptions({tier:v}); save(); newQuestion(); break;
    case 'qweak': {Q.weak=!Q.weak; const s=deckState(); deck.setOptions({weak:Q.weak}); restoreDeck(s); break;} // 今のもんだいもふくろののこりもそのまま。つぎのふくろから
    case 'qunfix': {const once=fixOnce(); Q.fixKey=null; Q.fixUsed=false; if(Q.result!==null&&!once) newQuestion(); break;} // こたえるまえのもんだいはそのまま（fixOnce はつぎからもうふつう）
    case 'keystats-reset': if(v!==QUIZ) return; deck.reset(); render(); return; // 2回おすしくみ（data-confirm）は core
    case 'kd-pick': { // チェック表のます：その調を3もん（onceMode ではその調からはじめて3もん）
      const id=minorId(v); if(!id) return;
      Q.fixKey=id; Q.fixUsed=false; sess=PA.session(QUIZ,{sig:'key='+id}); sess.start(3);
      fresh(); PA.announce(`${PA.keyName(KEYS[KD.parse(id).idx])}${onceMode()?'から始めて':'を'}3もんれんしゅう`); return;
    }
    case 'sess5': sess=PA.session(QUIZ); sess.start(5); Q.fixUsed=false; fresh(); PA.announce('きょうの5もん、始め！'); return;
    case 'sessstop': sess.clear(); if(endOv()) newQuestion(); break; // リンクの設定もおしまい（かわったら新しいもんだい）
    case 'qsum': if(!sess.finished()) return; PA.stopSound(); Q.sumShow=true; render(); PA.scrollTop(); return;
    case 'session-again': {const n=sess.n()||5; sess.start(n); Q.fixUsed=false; fresh(); return;}
    case 'session-free': sess.clear(); Q.fixKey=null; endOv(); fresh(); return; // ふだんの設定にもどして
    case 'qfam': if(!FAM[v]) return; if(Q.fams[v]&&FAM_KEYS.filter(f=>Q.fams[f]).length===1) return; PA.stopSound(); Q.fams[v]=!Q.fams[v]; setBase('fams',Q.fams); save(); newQuestion(); break;
    case 'qreset': Q.right=Q.total=Q.streak=Q.hint=0; break;
    case 'qcheck': if(Q.checked||!Q.picked.size) return; checkChord(); render(); showFb(); return;
    case 'qclear': Q.picked=new Set(); break;
    case 'qtry': PA.chord([...Q.picked].sort((x,y)=>x-y)); return;
    case 'qnext': fresh(); return;
    case 'qretry': Q.picked=new Set(); Q.checked=false; Q.lastOk=null; break;
    case 'qplay': PA.chord(famTones(KEYS[Q.q.keyIdx],Q.q.fam).map(n=>n.midi)); return;
    case 'qplaylt': playLT(KEYS[Q.q.keyIdx]); return;
    case 'qmark': {
      if(Q.chosen!=null||!MARKS.includes(+v)) return;
      const k=KEYS[Q.q.keyIdx], ch=+v, ok=ch===k.ltType;
      Q.chosen=ch; Q.lastOk=ok; scoreFirst(ok); PA.answerFx(ok);
      PA.announce(ok?`正解！${markWord(k.ltType)}で${PA.nm(k.lt)}`:`ざんねん。こたえは${markWord(k.ltType)}で${PA.nm(k.lt)}`);
      playLT(k); render(); showFb(); return;
    }
    case 'qexplain': { // Ⅴの家族で、この調・和音の「つくりかた」をはじめから
      PA.stopSound();
      if(Q.result===null) Q.peeked=true; // こたえるまえに見た：このあとできたら「ヒントでできた」（×にはしない）
      save();
      const prev=PA.store.get('minor-family',{});
      PA.store.set('minor-family',Object.assign({},prev&&typeof prev==='object'?prev:{},{keyIdx:Q.q.keyIdx,fam:Q.type==='chord'?Q.q.fam:'V'}));
      PA.store.set('minor-family-auto',true);
      PA.go('minor-family.html'); return;
    }
    default: return;
  }
  render();
});
render();
</script>
