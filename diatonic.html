<script>
/* 7つの 和音：音階の 1〜7ばんめ から「ひとつとばし」で つくる Ⅰ〜Ⅶ。ひびき（明るい・くらい・ドキドキ）と 3つの なかま
 * 保存（'diatonic'）：minor・keyIdx・deg（0〜6）・prog（ながれ） */

// <dia-logic>（test/diatonic.test.mjs が ここだけ 切りだして、24調 ぜんぶ たしかめる）
const DIA=(function(){
  const ROM=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ'];
  // 短調：Ⅴ・Ⅶ は 7ばんめを 上げた 音階、ほか（Ⅲ も）は 調号どおりの 音階
  const scaleFor=(key,d)=>key.minor?(d===4||d===6?key.harm:key.nat):key.scale;
  const tones=(key,d)=>[0,2,4].map(j=>PA.at(scaleFor(key,d),d+j));
  // ひびき（なかの 計算だけ。画面には 数字を 出さない）
  const quality=ns=>{const a=ns[1].midi-ns[0].midi,b=ns[2].midi-ns[0].midi;
    return a===4&&b===7?'maj':a===3&&b===7?'min':a===3&&b===6?'dim':a===4&&b===8?'aug':'?';};
  // 3つの なかま（さいしょが 中心の 和音）
  const FAMS=[{head:0,ds:[0,5,2]},{head:3,ds:[3,1]},{head:4,ds:[4,6]}];
  const famOf=d=>FAMS.findIndex(f=>f.ds.includes(d));
  // 2つの 和音で おなじ 音（つづりも おなじ）
  const common=(key,a,b)=>{const B=tones(key,b);return tones(key,a).filter(n=>B.some(m=>m.letter===n.letter&&m.acc===n.acc));};
  const sym=ns=>{const r=PA.LET_EN[ns[0].letter]+PA.ACC[ns[0].acc], q=quality(ns);return r+(q==='min'?'m':q==='dim'?'dim':q==='aug'?'aug':'');};
  // ----- ながれ（右手は なめらかに、左手は 根音） -----
  const PROGS={basic:[0,3,4,0],fam:[0,5,3,1,4,0]};
  const shift=(n,o)=>({...n,midi:n.midi+12*o,k:n.k+7*o});
  // 右手：3つの 音の ならび（てんかいも）。いちばん下が 主音の ±7 の はんい
  const uppers=(key,d)=>{
    const t=tones(key,d), out=[];
    for(let inv=0;inv<3;inv++){
      const v=[0,1,2].map(j=>inv+j<3?t[inv+j]:shift(t[inv+j-3],1));
      for(let o=-2;o<=1;o++){const w=v.map(n=>shift(n,o));if(w[0].midi>=key.tonicMidi-7&&w[0].midi<=key.tonicMidi+7) out.push(w);}
    }
    return out;
  };
  // 左手：根音を ミ2〜シ3（40〜59）で、右手より 3つ 以上 下
  const basses=(key,d,lo)=>{const r=tones(key,d)[0], out=[];for(let o=-4;o<=1;o++){const b=shift(r,o);if(b.midi>=40&&b.midi<=59&&b.midi<=lo-3) out.push(b);}return out;};
  // 2つの 声が 5度・8度の まま うごくか（どちらも うごく とき）
  const parallels=(A,B)=>{let c=0;
    for(let i=0;i<A.length;i++) for(let j=i+1;j<A.length;j++){
      const a=PA.mod(A[j]-A[i],12), b=PA.mod(B[j]-B[i],12);
      if((a===0||a===7)&&a===b&&A[i]!==B[i]&&A[j]!==B[j]) c++;
    }
    return c;};
  const voices=c=>[c.lh[0].midi,...c.rh.map(n=>n.midi)];
  const flow=(key,pid)=>{
    const seq=PROGS[pid]||PROGS.basic;
    const cand=seq.map((d,i)=>{
      const us=i===0?[tones(key,0)]:uppers(key,d), out=[];
      us.forEach(rh=>basses(key,d,rh[0].midi).filter(b=>i>0||(b.midi>=48&&b.midi<=59)).forEach(b=>out.push({d,rh,lh:[b]})));
      return out;
    });
    // いちばん よい ならびを えらぶ（平行の 5度・8度 → 左手の 大きな とび → 右手の うごき → 左手の うごき）
    const cost=(p,c)=>{const A=voices(p),B=voices(c);let s=parallels(A,B)*1000;
      const bl=Math.abs(B[0]-A[0]); if(bl>=10) s+=60;
      for(let i=1;i<A.length;i++) s+=Math.abs(B[i]-A[i]);
      return s+bl*0.4;};
    let best=cand[0].map(c=>({s:0,path:[c]}));
    for(let i=1;i<cand.length;i++){
      best=cand[i].map(c=>{let m=null;best.forEach(b=>{const s=b.s+cost(b.path[b.path.length-1],c);if(!m||s<m.s) m={s,path:b.path.concat([c])};});return m;});
    }
    return best.reduce((a,b)=>b.s<a.s?b:a).path;
  };
  // ----- たしかめ（3つの もんだい） -----
  const pick=(arr,rnd)=>arr[Math.floor(rnd()*arr.length)];
  const shuffle=(arr,rnd)=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
  const quiz=rnd=>{
    const d1=pick([1,2,5,6],rnd), others=shuffle([0,1,2,3,4,5,6].filter(x=>x!==d1),rnd).slice(0,3);
    const d2=pick([1,2,5,6].filter(x=>x!==d1),rnd), d3=pick([0,1,2,3,4,5,6].filter(x=>x!==d1&&x!==d2),rnd);
    return [
      {type:'notes',d:d1,choices:shuffle([d1].concat(others),rnd),ans:d1,pick:null},
      {type:'fam',d:d2,choices:[0,1,2],ans:famOf(d2),pick:null},
      {type:'feel',d:d3,choices:['maj','min','dim'],ans:null,pick:null} // ans は 調で きまる（page で quality から）
    ];
  };
  return {ROM,scaleFor,tones,quality,FAMS,famOf,common,sym,PROGS,flow,parallels,quiz};
})();
// </dia-logic>

const ROM=DIA.ROM;
const NEU='#6f6579', NEUL='#efeaf2', LT='#d1495b';
const colOf=d=>d===0?PA.COL.I:d===3?PA.COL.IV:d===4?PA.COL.V:NEU;
const lcolOf=d=>d===0?PA.LCOL.I:d===3?PA.LCOL.IV:d===4?PA.LCOL.V:NEUL;
const FAMC=[PA.COL.I,PA.COL.IV,PA.COL.V], FAML=[PA.LCOL.I,PA.LCOL.IV,PA.LCOL.V];
const FAMN=['Ⅰの なかま','Ⅳの なかま','Ⅴの なかま'], FAMW=['おちつく','ひろがる','Ⅰに もどりたくなる'];
const FEEL={maj:{em:'☀️',w:'明るい',n:'長三和音',y:'ちょうさんわおん'},min:{em:'☁️',w:'くらい',n:'短三和音',y:'たんさんわおん'},dim:{em:'💓',w:'ドキドキ',n:'減三和音',y:'げんさんわおん'},aug:{em:'❓',w:'ふしぎ',n:'増三和音',y:'ぞうさんわおん'}};
const feelOf=(key,d)=>FEEL[DIA.quality(DIA.tones(key,d))];

const saved=(x=>x&&typeof x==='object'?x:{})(PA.store.get('diatonic',{}));
const state={minor:!!saved.minor,keyIdx:0,deg:0,prog:saved.prog==='fam'?'fam':'basic',step:-1,playing:false,quiz:null};
if(Number.isInteger(saved.keyIdx)&&saved.keyIdx>=0&&saved.keyIdx<PA.keyCount(state.minor)) state.keyIdx=saved.keyIdx;
if(Number.isInteger(saved.deg)&&saved.deg>=0&&saved.deg<7) state.deg=saved.deg;
const save=()=>PA.store.set('diatonic',{minor:state.minor,keyIdx:state.keyIdx,deg:state.deg,prog:state.prog});
const curKey=()=>PA.keyOf(state.minor,state.keyIdx,60); // 主音は ド4〜シ4（和音のしくみ と おなじ 高さ）
const newQuiz=()=>{state.quiz=DIA.quiz(Math.random);};
const yomi=(w,y)=>`<ruby>${w}<rt>${y}</rt></ruby>`; // ふりがな
const q=n=>`「${PA.nmH(n)}」`;
const stackNames=ns=>ns.map(n=>`<span>${PA.nmH(n)}</span>`).join('');
const namesW=(ns,sep)=>ns.map(n=>`<span class="nw">${PA.nmH(n)}</span>`).join(sep);

/* ===== ことば ===== */
function chordMsg(key,d){
  const t=DIA.tones(key,d), ms=[`${PA.keyName(key)}の <b>${ROM[d]}</b> は、音階の <b>${d+1}ばんめ${q(t[0])}</b>から ひとつとばしで 3つ → <b class="big">${PA.namesH(t)}</b>`];
  const r=t.find(n=>n.raised);
  if(r) ms.push(`🌙 短調の Ⅴ・Ⅶ は、7ばんめ${q(key.natLT)}を 半音上げて <b>${q(r)}</b>に するよ。<a href="minor-why.html">なぜ？</a>`);
  else if(key.minor&&d===2) ms.push(`🌙 Ⅲ では 7ばんめ${q(key.natLT)}を 上げないで、調号の まま つかうよ。`);
  return ms.join('<br>');
}
function famNote(key,f){
  const F=DIA.FAMS[f];
  return F.ds.filter(d=>d!==F.head).map(d=>`${ROM[d]} は ${ROM[F.head]} と <b class="nw">${PA.namesH(DIA.common(key,d,F.head))}</b> が おなじ`).join('、')+'。';
}
function tipsHTML(key){
  const pat=minor=>{const k=PA.keyOf(minor,0,60);return [0,1,2,3,4,5,6].map(d=>`${ROM[d]}${feelOf(k,d).em}`).join(' ');};
  const li=[
    `<b>ローマ数字 ＝ 音階の なんばんめ</b>。1ばんめから 7ばんめまで、どの 音からも ひとつとばしで 3つ つめるので、和音は <b>7つ</b>。`,
    `がくふでは どれも <b>線・線・線</b> か <b>間・間・間</b>。7つ ならべると、かいだんみたいに 1つずつ 上がるよ。`,
    `<b>ひびきの ならびは どの 長調でも おなじ</b>：${pat(false)}。ハ長調（白いけんばん だけ）で おぼえると かんたん。`,
    `この アプリの <b>短調</b>は どの調でも：${pat(true)}。`,
    `<b>なかま</b>は「おなじ 音が 2つ ある」和音。だから にた はたらきを するよ。${famNote(key,0)}`,
    `${key.minor?`🌙 <b>短調の Ⅴ・Ⅶ</b> は 7ばんめ${q(key.natLT)}を 半音上げて ${q(key.lt)}。Ⅴ が 明るく なって、Ⅰ に もどりたい 気もちが 強く なるよ。`:`🌙 <b>短調</b>では Ⅴ・Ⅶ だけ 7ばんめを 半音上げるよ。調を 短調に して 見てみよう。`}`
  ];
  return `<details class="more tips" data-d="tips"><summary>💡 おぼえかたの コツ</summary><ol>${li.map(x=>`<li>${x}</li>`).join('')}</ol></details>`;
}
/* 📖 ことばメモ：本や 楽譜で 見かける 名前を やさしく（いまの 調の 音を れいに） */
function termsHTML(key){
  const W=(L,a)=>PA.nmH({letter:L,acc:a||0}), t=d=>PA.namesH(DIA.tones(key,d));
  const mifa=`<b style="color:#c98500">${W(2)}${W(3)}・${W(6)}${W(0)}</b>`;
  return `<details class="more terms" data-d="terms"><summary>📖 ことばメモ（本や 楽譜で 見かける 名前）</summary><dl>
    <dt>${yomi('三和音','さんわおん')}</dt>
    <dd>ひとつとばしで 3つ かさねた 和音。この ページの Ⅰ〜Ⅶ は ぜんぶ 三和音。</dd>
    <dt>${yomi('主要三和音','しゅようさんわおん')}・${yomi('副三和音','ふくさんわおん')}</dt>
    <dd>Ⅰ・Ⅳ・Ⅴ を <b>主要三和音</b>、Ⅱ・Ⅲ・Ⅵ・Ⅶ を <b>副三和音</b> と いうよ。副三和音は、それぞれ Ⅰ・Ⅳ・Ⅴ の どれかの なかま。</dd>
    <dt>3度（ひろい 3度・せまい 3度）</dt>
    <dd>${W(0)}・${W(1)}・${W(2)} の ように、文字で 数えて 3つ はなれた 2つの 音が <b>3度</b>。3度には <b>ひろい 3度</b>（長3度）と <b>せまい 3度</b>（短3度）が ある。白いけんばんだけ なら、間に ${mifa}（白鍵どうしが となり）が 入ると せまい 3度。たとえば ${W(0)}→${W(2)} は ひろい、${W(2)}→${W(4)} は せまい。</dd>
    <dt>${yomi('長三和音','ちょうさんわおん')}・${yomi('短三和音','たんさんわおん')}・${yomi('減三和音','げんさんわおん')}</dt>
    <dd><ul style="margin:4px 0 0;padding-left:1.2em">
      <li>☀️ <b>長三和音</b>（明るい）… 下が ひろい 3度、上が せまい 3度。れい ${W(0)}・${W(2)}・${W(4)}</li>
      <li>☁️ <b>短三和音</b>（くらい）… 下が せまい 3度、上が ひろい 3度。れい ${W(5)}・${W(0)}・${W(2)}</li>
      <li>💓 <b>減三和音</b>（ドキドキ）… 下も 上も せまい 3度。れい ${W(6)}・${W(1)}・${W(3)}</li>
    </ul></dd>
    <dt>${yomi('主和音','しゅわおん')}・${yomi('下属和音','かぞくわおん')}・${yomi('属和音','ぞくわおん')}</dt>
    <dd>Ⅰ・Ⅳ・Ⅴ の べつの よびかた。いまの 調では Ⅰ＝${t(0)}、Ⅳ＝${t(3)}、Ⅴ＝${t(4)}。</dd>
    <dt>${yomi('根音','こんおん')}</dt>
    <dd>ひとつとばしで つんだ ときの いちばん下の 音。Ⅵ なら 6ばんめ、Ⅱ なら 2ばんめの 音が 根音。</dd>${key.minor?`
    <dt>${yomi('和声的短音階','わせいてき たんおんかい')}</dt>
    <dd>7ばんめを 半音上げた 短調の 音階。この アプリの 短調の Ⅴ・Ⅶ は この 音階から つくるよ。Ⅲ も この 音階で つくると ${yomi('増三和音','ぞうさんわおん')}（下も 上も ひろい 3度の、ふしぎな ひびき）に なるので、ふつうは 調号どおりの ${t(2)} を つかう。</dd>`:''}
  </dl></details>`;
}

/* ===== 画面 ===== */
function staffBox(svg,name,scale){
  const m=svg.match(/viewBox="0 0 ([\d.]+) /), W=m?+m[1]:400;
  return `<div class="scroll" data-sk="${name}"><div style="min-width:${Math.round(W*scale)}px;margin:0 auto">${svg}</div></div>`;
}
function famCard(key){
  const d0=state.deg, fl=DIA.flow(key,state.prog), f0=DIA.famOf(d0);
  let h=`<section class="card"><h2>👪 3つの なかま<small>おなじ 音が 2つ ある 和音は、にた はたらきを するよ</small></h2>`;
  h+=DIA.FAMS.map((F,f)=>`<div class="frow ${f===f0?'on':''}" style="--fc:${FAMC[f]};--fl:${FAML[f]}"><h3>${FAMN[f]}<small>${FAMW[f]}</small></h3>
    <div class="fmem" role="group" aria-label="${FAMN[f]}">${F.ds.map(d=>`<button class="${d===d0?'on':''}" style="--c:${colOf(d)}" data-act="fdeg" data-v="${d}" aria-pressed="${d===d0}" aria-label="${ROM[d]} ${PA.namesT(DIA.tones(key,d))}">${ROM[d]}</button>`).join('')}</div>
    <p class="note">${famNote(key,f)}</p></div>`).join('');
  h+=`<h2 style="margin-top:16px">🎧 ながれで 聴く<small>上の 色の 線＝なかま。タップすると その 和音が 鳴るよ</small></h2>`;
  h+=PA.seg('prog',[['basic','Ⅰ・Ⅳ・Ⅴ だけ'],['fam','なかまも つかう']],state.prog,'full');
  h+=`<div class="seq" style="--n:${fl.length}">`+fl.map((c,i)=>`<button class="scard ${i===state.step?'on':''}" style="--c:${colOf(c.d)};--l:${lcolOf(c.d)};--fc:${FAMC[DIA.famOf(c.d)]}" data-act="pstep" data-v="${i}" aria-pressed="${i===state.step}" aria-label="${i+1}つめ ${ROM[c.d]}"><span class="num">${ROM[c.d]}</span><span class="nm"><span class="lh">${PA.nmH(c.lh[0])}</span>${stackNames(c.rh)}</span></button>`).join('')+`</div>`;
  h+=`<p class="flow">${state.prog==='fam'
    ?'おちつく（Ⅰ・Ⅵ）→ ひろがる（Ⅳ・Ⅱ）→ もどりたくなる（Ⅴ）→ おちつく（Ⅰ）。<b>Ⅵ・Ⅱ</b> を はさむと、おなじ ながれでも 色が ふえるよ。'
    :'おちつく（Ⅰ）→ ひろがる（Ⅳ）→ もどりたくなる（Ⅴ）→ おちつく（Ⅰ）。いつもの ながれ。'}</p>`;
  const cols=fl.map((c,i)=>({notes:c.rh,lh:c.lh,color:colOf(c.d),accColor:LT,op:state.step<0||i===state.step?1:0.3,label:ROM[c.d],labelColor:colOf(c.d)}));
  h+=`<div style="margin-top:8px">${staffBox(PA.staffSVG(key,cols,{grand:true,colW:58}),'pstaff',0.62)}</div>`;
  h+=`<div class="row" style="margin-top:8px">${state.playing?`<button class="btn" data-act="stop">⏹ とめる</button>`:`<button class="btn night" data-act="cplay">▶️ ながして 聴く</button>`}</div></section>`;
  return h;
}
function linksCard(key){
  return `<section class="card"><h2>🔗 この あと つかうよ<small>Ⅱ・Ⅲ・Ⅵ も、あとの ページで たくさん 出てくる</small></h2><div class="links">
    <a class="btn" href="ending.html"><span>🏁 おわりかた<small>偽終止：Ⅴ7 の あと、Ⅰ の かわりに なかまの Ⅵ へ</small></span></a>
    <a class="btn" href="doppel.html"><span>🔺 Ⅱ7と ドッペルドミナント<small>Ⅱ に もうひとつ 音を のせた Ⅱ7</small></span></a>
    <a class="btn" href="secondary.html"><span>🎯 副属和音<small>Ⅱ・Ⅲ・Ⅵ などの 前に つける Ⅴ7</small></span></a>
  </div></section>`;
}
function quizCard(key){
  const Q=state.quiz;
  const rows=Q.map((x,i)=>{
    const t=DIA.tones(key,x.d), ans=x.type==='feel'?DIA.quality(t):x.ans, done=x.pick!=null;
    let qt='', label=c=>'', fb='', c3=x.type!=='notes';
    if(x.type==='notes'){qt=`${PA.keyName(key)}の ${ROM[x.d]} は？`;label=c=>namesW(DIA.tones(key,c),'・');}
    else if(x.type==='fam'){qt=`${ROM[x.d]} は どの なかま？`;label=c=>FAMN[c];}
    else{qt=`${PA.keyName(key)}の ${ROM[x.d]} の ひびきは？`;label=c=>`${FEEL[c].em} ${FEEL[c].w}`;}
    if(done){
      const ok=x.pick===ans;
      if(x.type==='notes') fb=`${ROM[x.d]} は ${x.d+1}ばんめ${q(t[0])}から ひとつとばし → <b>${PA.namesH(t)}</b>`;
      else if(x.type==='fam'){const F=DIA.FAMS[ans];fb=`${ROM[x.d]} は ${ROM[F.head]} と <b>${PA.namesH(DIA.common(key,x.d,F.head))}</b> が おなじ → <b>${FAMN[ans]}</b>（${FAMW[ans]}）`;}
      else fb=`${ROM[x.d]}（${PA.namesH(t)}）は <b>${FEEL[ans].em} ${FEEL[ans].w}</b>（${FEEL[ans].n}）`;
      fb=`<div class="fb ${ok?'good':'bad'}" role="status">${ok?'⭕ せいかい！':'❌ ざんねん。'} ${fb}</div>`;
    }
    const ch=x.choices.map(c=>{
      const cls=done?(c===ans?'right':c===x.pick?'wrong':''):'';
      return `<button class="choice ${cls}" data-act="qpick" data-v="${i}:${c}" ${done?'aria-disabled="true"':''}>${cls==='right'?'⭕ ':cls==='wrong'?'❌ ':''}${label(c)}</button>`;
    }).join('');
    return `<div class="qbox"><p class="qtext"><span>Q${i+1}. ${qt}</span>${x.type==='feel'?`<button class="btn small" data-act="qplay" data-v="${x.d}" aria-label="${ROM[x.d]} を 聴く">🔊 聴く</button>`:''}</p>
      <div class="choices ${c3?'c3':''}">${ch}</div>${fb}</div>`;
  }).join('');
  return `<section class="card"><h2>✅ たしかめよう<small>えらぶと すぐ こたえが 出るよ</small></h2>${rows}
    <div class="row" style="margin-top:12px"><button class="btn small" data-act="qnew">🔄 ほかの もんだい</button></div></section>`;
}
let lastDeg=-1;
function render(){
  const key=curKey(), d=state.deg, t=DIA.tones(key,d), col=colOf(d), F=feelOf(key,d), f=DIA.famOf(d);
  let h=`<div class="stack">
    <div class="toprow">${PA.keyChip(key)}<span class="note" style="margin:0">${PA.keyEn(key)}</span></div>
    <div class="chords" role="group" aria-label="7つの 和音">`+[0,1,2,3,4,5,6].map(k=>{
      const tk=DIA.tones(key,k), fe=feelOf(key,k);
      return `<button class="cbtn ${k===d?'on':''}" style="--c:${colOf(k)};--l:${lcolOf(k)}" data-act="deg" data-v="${k}" aria-pressed="${k===d}" aria-label="${ROM[k]} ${PA.namesT(tk)} ${fe.w}"><span class="num">${ROM[k]}</span><span class="fe" aria-hidden="true">${fe.em}</span><span class="nm">${stackNames(tk)}</span></button>`;
    }).join('')+`</div>
    <p class="note legend">☀️ 明るい　☁️ くらい　💓 ドキドキ${key.minor?`　🌙 Ⅴ・Ⅶ は 7ばんめを 半音上げる（<a href="minor-why.html">なぜ？</a>）`:''}</p>
    <section class="card hero" style="--c:${col}">
      <div class="hero-top"><span class="badge" style="--c:${col}">${ROM[d]}</span>
        <div style="min-width:0"><div class="hk">${PA.keyName(key)}の ${ROM[d]}</div><div class="hn">${namesW(t,'&nbsp;・ ')}</div><div class="hs">コードネーム ${PA.H(DIA.sym(t))}</div></div></div>
      <div class="tags"><span class="tag">${F.em} ${F.w}（${F.n}）</span><span class="tag fam" style="--fc:${FAMC[f]};--fl:${FAML[f]}">${FAMN[f]}・${FAMW[f]}</span></div>
      <div class="msg" style="margin-top:10px">${chordMsg(key,d)}</div>
    </section>`;
  const marks=new Map();
  t.forEach(n=>marks.set(n.midi,{fill:col,label:PA.nm(n),focus:true,sub:n.raised?'半音上げ':'',subColor:LT}));
  h+=`<section class="card"><h2>🎹 けんばん<small>さわると 音が出るよ。オレンジの印＝白鍵どうしが となり</small></h2><div class="scroll" data-sk="kb">${PA.kbSVG(60,88,marks)}</div></section>`;
  const st=PA.stepOf(t[0]);
  const cols=[0,1,2,3,4,5,6].map(k=>({notes:DIA.tones(key,k),color:colOf(k),ltColor:LT,accColor:LT,op:k===d?1:0.28,label:ROM[k],labelColor:colOf(k)}));
  h+=`<section class="card"><h2>🎼 がくふ<small>7つ ならべると かいだん。いまの 和音が こい色</small></h2>${staffBox(PA.staffSVG(key,cols,{colW:52}),'staff',0.6)}
    <p class="note">${ROM[d]} は ひとつとばし だから <b>${(st-30)%2===0?'線・線・線':'間・間・間'}</b>。</p></section>`;
  h+=famCard(key)+linksCard(key)+quizCard(key)+tipsHTML(key)+termsHTML(key)+`</div>`;
  const view=document.getElementById('view');
  PA.paint(view,h,state.minor+':'+state.keyIdx);
  if(d!==lastDeg) PA.follow(view); // 和音が かわったら 鍵盤を その和音へ（見えていれば 動かさない）
  lastDeg=d;
  PA.paint(document.getElementById('actions'),
    `<button class="btn primary" data-act="play" data-hot="listen">🔊 いっしょに</button><button class="btn" data-act="arp">🎶 ひとつずつ</button><button class="btn" data-act="next" data-hot="next" aria-label="つぎの和音">つぎ ➡</button>`,'bar');
}

/* ===== 音 ===== */
let token=0;
function stop(){token++;state.playing=false;state.step=-1;PA.stopSound();}
const degMidis=()=>DIA.tones(curKey(),state.deg).map(n=>n.midi);
const flowMidis=c=>[...c.lh,...c.rh].map(n=>n.midi);
async function playFlow(){
  stop(); const my=token, fl=DIA.flow(curKey(),state.prog); state.playing=true;
  for(let i=0;i<fl.length;i++){
    state.step=i; render();
    const last=i===fl.length-1;
    PA.chord(flowMidis(fl[i]),last?{dur:3}:{});
    await PA.sleep(last?2000:1150); if(my!==token) return;
  }
  state.playing=false; render();
}

/* ===== 操作 ===== */
PA.mountBar({title:'7つの 和音',app:'diatonic'});
PA.onSettings=render;
PA.onPageShow=render;
PA.onStopDown=stop;
PA.onStopCancel=render; // ⏹ を おしたのに 指が ずれたとき 画面を もどす
PA.onKeySheet=()=>PA.openKeySheet({minor:state.minor,idx:state.keyIdx,both:true,onPick:(minor,idx)=>{
  stop(); state.minor=minor; state.keyIdx=idx; newQuiz(); save(); render(); PA.chord(degMidis());
}});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v;
  if(a==='deg'||a==='fdeg'){const k=+v;if(!(k>=0&&k<7))return;stop();state.deg=k;save();render();PA.chord(degMidis());}
  else if(a==='play'){stop();render();PA.chord(degMidis());}
  else if(a==='arp'){stop();render();PA.chord(degMidis(),{arp:true});}
  else if(a==='next'){stop();state.deg=(state.deg+1)%7;save();render();PA.chord(degMidis());}
  else if(a==='cplay'){playFlow();}
  else if(a==='stop'){stop();render();}
  else if(a==='prog'){if(v!=='basic'&&v!=='fam')return;stop();state.prog=v;save();render();}
  else if(a==='pstep'){const fl=DIA.flow(curKey(),state.prog), i=+v;if(!fl[i])return;stop();state.step=i;render();PA.chord(flowMidis(fl[i]));}
  else if(a==='qpick'){
    const p=String(v).split(':'), x=state.quiz[+p[0]]; if(!x||x.pick!=null) return;
    x.pick=x.type==='feel'?p[1]:+p[1]; render();
  }
  else if(a==='qplay'){const k=+v;if(k>=0&&k<7)PA.chord(DIA.tones(curKey(),k).map(n=>n.midi));}
  else if(a==='qnew'){newQuiz();render();}
});
newQuiz(); save(); render();
</script>
