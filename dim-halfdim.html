<script>
/* Ⅴ9の根音省略（ファイル名・保存の名前は、まえの「dim-halfdim」のまま）
 * 先生の教えかた（docs/TEACHER-FEEDBACK.md の4・2026-10-31の答えの3）：
 *   ⓪ はじめに「根音」と「省略」の意味を教える（「Ⅴ9の根音省略」ということばがわかるように）
 *   ① 短調で Ⅴ → Ⅴ7 → Ⅴ9 → 根音をはぶく → これが減七 → Ⅰへすすむ
 *   ② 同じ主音の長調とくらべる：Ⅴ・Ⅴ7はまったく同じ音。ちがうのはⅤ9の第9音（音階の6ばんめ：長調♮6・短調♭6）だけ。
 *      だから根音をはぶくと、短調は減七、長調は減七にならない。
 *   長調の形は「長調の形（減七にならない）」とよぶ。「半減七」ということばは画面に出さない。Ⅶ7という見かたは「もっとくわしく」だけ。
 * 和音のつづり・高さ・Ⅰへのすすみかたは PA.henka（viiCompare・vii7・vii7ToI・v9・minorOf）。
 * けんばん・がくふ・聴きくらべは、Ⅴ9を根音からひとつとばしにつんだ形（密集。根音はシ3〜シ♭4）で鳴らす。
 * 保存（'dim-halfdim'）：{minor, keyIdx}（まえとおなじ）。リンク：key（M0〜M12・m0〜m12） */
const H=PA.henka;
const SUN='#c46a00', NIGHT='#3b4fa8', DIFF='#b0307a', LT='#d1495b', PUR='#8a4fe0', ICOL=PA.COL.I, GHOST='#857c8f';
const LIGHT={[SUN]:'#f6d9b5',[NIGHT]:'#c9d0f0',[ICOL]:'#f8c9bd'}, DARK={[SUN]:'#7a4100',[NIGHT]:'#24316f',[ICOL]:'#8f2a17'};
// H.vii7のならび [導音 | 4, 6, 2] を、下からひとつとばしのじゅん（導音・2・4・6）に
const ORDER=[0,3,1,2];
// つくるじゅん（短調）。staff＝がくふの下の名前
const STEPS=[{label:'Ⅴ',staff:'Ⅴ'},{label:'Ⅴ7',staff:'Ⅴ7'},{label:'Ⅴ9',staff:'Ⅴ9'},{label:'省略',staff:'減七'},{label:'Ⅰへ',staff:'Ⅰ'}];
const C_MINOR=PA.MINOR_KEYS.findIndex(([l,a])=>l===0&&a===0); // はじめての人はハ短調（ハ長調とくらべる）

const saved=PA.store.get('dim-halfdim',null), sv=saved&&typeof saved==='object'&&!Array.isArray(saved)?saved:{};
const state={minor:true,keyIdx:C_MINOR,step:0,side:'min',play:null,res:0,anim:null,autoWait:false,done:false,ab:null,abOk:0,abN:0};
// play：'maj'｜'min'＝その和音を鳴らしている。res：1＝Ⅴ9（根音なし）、2＝Ⅰ（解決）を鳴らしている
if(typeof sv.minor==='boolean'&&Number.isInteger(sv.keyIdx)&&sv.keyIdx>=0&&sv.keyIdx<PA.keyCount(sv.minor)){state.minor=sv.minor;state.keyIdx=sv.keyIdx;}
const save=()=>PA.store.set('dim-halfdim',{minor:state.minor,keyIdx:state.keyIdx});
// 先生のリンク：key＝調（M0〜M12長調、m0〜m12短調）。ちがう値はつかわない。いまの設定にもする
(()=>{
  const k=PA.keyDeck.parse(PA.params().key); if(!k) return;
  state.minor=k.minor; state.keyIdx=k.idx; save();
})();
const curKey=()=>PA.keyOf(state.minor,state.keyIdx); // 長調の主音はド4〜シ4、短調はラ3〜ソ♯4

/* ===== 調 ===== */
// おなじ主音の長調（嬰ハ・嬰ト・嬰ニ長調など、調のリストにない調もつくる）
function majorOf(l,a){
  const i=PA.MAJOR_KEYS.findIndex(([L,A])=>L===l&&A===a);
  if(i>=0) return PA.majorKey(i);
  const tpc=PA.mod(PA.NAT[l]+a,12), tonicMidi=60+PA.mod(tpc-60,12), scale=PA.buildScale(l,tpc,tonicMidi,PA.MAJ), sig={};
  scale.forEach(n=>sig[n.letter]=n.acc);
  return {idx:-1,l,a,tpc,tonicMidi,minor:false,scale,sig,enh:true};
}
const listed=k=>(k.minor?PA.MINOR_KEYS:PA.MAJOR_KEYS).some(([L,A])=>L===k.l&&A===k.a);
const sigOK=k=>Object.values(k.sig).every(a=>Math.abs(a)<=1); // 調号に x・♭♭がいらない
const dblMark=k=>Object.values(k.sig).some(a=>a>1)?'<span class="ds">x</span>':PA.H('𝄫'); // 調号に入る重嬰／重変
// おなじ高さの主音で、調のリストにある調（名前だけ）
const enhName=k=>{const L=k.minor?PA.MINOR_KEYS:PA.MAJOR_KEYS, i=L.findIndex(([l,a])=>PA.mod(PA.NAT[l]+a,12)===k.tpc);return i<0?'':PA.keyName(PA.keyOf(k.minor,i));};

/* ===== 和音（PA.henka から） ===== */
const pcM=m=>PA.mod(m,12);
const above=(pc,from)=>from+PA.mod(pc-from-1,12)+1;
const below=(pc,from)=>from-(PA.mod(from-pc-1,12)+1);
// 密集の形：根音（Ⅴ9の根音＝音階の5ばんめ）をシ3〜シ♭4におき、上へひとつとばしで導音・2・4・6（つづりはそのまま）
function closeStack(ch,rootN){
  const root={...rootN,midi:59+PA.mod(H.pcOf(rootN)-59,12)};
  const notes=[]; let m=root.midi;
  ORDER.map(i=>ch[i]).forEach(n=>{m=above(pcM(n.midi),m);notes.push({...n,midi:m});});
  return {notes,root};
}
// 密集の形のⅠ：導音→主音（上へ）、ほかの3つは下へ（H.vii7ToI とおなじ音・おなじつづり）
function closeRes(s){
  return s.stack.map((n,j)=>{
    const r=s.res[ORDER[j]], pc=H.pcOf(r);
    return {letter:r.letter,acc:r.acc,role:r.role,midi:j===0?above(pc,n.midi):below(pc,n.midi)};
  });
}
const cache={};
function pairOf(key){
  const id=key.minor+':'+key.idx;
  if(cache[id]) return cache[id];
  let majK=key.minor?majorOf(key.l,key.a):key, minK=key.minor?key:H.minorOf(key.l,key.a), respell=false;
  // 変ニ長調・変ト長調：同主短調の調号に♭♭が入るので、おなじけんばんの♯の主音（嬰ハ・嬰ヘ）でくらべる
  if(!key.minor&&!sigOK(minK)){
    const l=(key.l+6)%7, a=PA.spell(l,key.tpc);
    majK=majorOf(l,a); minK=H.minorOf(l,a); respell=true;
  }
  const cmp=H.viiCompare(key.minor?key:majK); // 長調の形と減七をおなじ高さで
  const side=(id,k,ref,col,name)=>{
    // それぞれの調のⅤ9（根音なし）とⅠを、viiCompare とおなじ高さにそろえる（ふつうは0）
    const raw=H.vii7(k), d=ref[0].midi-raw[0].midi, sh=ns=>ns.map(n=>({...n,midi:n.midi+d}));
    const ch=sh(raw), res=sh(H.vii7ToI(k)), v9=H.v9(k), st=closeStack(ch,v9[0]);
    const s={id,k,ch,res,col,name,v9Roles:ch.map(n=>n.role),stack:st.notes,root:st.root,sym:H.symbol(k,'vii7'),six:st.notes[ORDER.indexOf(cmp.diff)]};
    s.closeRes=closeRes(s);
    return s;
  };
  const P={key,respell,majK,minK,cmp,di:ORDER.indexOf(cmp.diff),maj:side('maj',majK,cmp.half,SUN,'長調の形'),min:side('min',minK,cmp.dim,NIGHT,'減七')};
  return cache[id]=P;
}
const midis=ns=>[...new Set(ns.map(n=>n.midi))];
// つくるじゅんの音（i＝STEPS の番号）：Ⅴ＝根音・導音・2、Ⅴ7＝＋4、Ⅴ9＝＋6、省略＝根音なしの4つ、Ⅰへ＝密集のⅠ
const stepNotes=(s,i)=>i===0?[s.root,s.stack[0],s.stack[1]]:i===1?[s.root,...s.stack.slice(0,3)]:i===2?[s.root,...s.stack]:i===3?s.stack:s.closeRes;
// 減七か（となりどうしがぜんぶ短3度。中の計算だけ。画面には「減七」だけ出す）
const isDim7=ns=>ns.every((n,i)=>i===0||ns[i].midi-ns[i-1].midi===3);
const sameName=(a,b)=>a.letter===b.letter&&a.acc===b.acc;

/* ===== 名前 ===== */
const kn=k=>PA.keyName(k);
const nmW=n=>`<span class="nw">${PA.nmH(n)}</span>`;
const q=n=>`「${nmW(n)}」`;
const namesW=(ns,sep='・')=>ns.map(nmW).join(sep);
// ちがう音（第9音）に色、導音は赤
const namesC=(ns,six,sep='・')=>ns.map(n=>six&&n===six?`<span class="nw dn">${PA.nmH(n)}</span>`:n.tag==='lt'?`<span class="nw up">${PA.nmH(n)}</span>`:nmW(n)).join(sep);
const namesD=(s,sep='・')=>namesC(s.stack,s.six,sep);
const stripP=r=>String(r).replace(/（.*$/,'');
// 「ひとつずつくらべる」の小さいことば（core.js の役わり名をやさしく）
const SUBTXT={'たかいほう':'長調の形','ひくいほう':'短調の形（半音低い）'};

/* ===== けんばん ===== */
const isWhite=m=>!PA.BLACK.has(PA.mod(m,12));
function kbRange(ms,minWhite=10){
  let lo=Math.min(...ms)-1, hi=Math.max(...ms)+1;
  while(!isWhite(lo)) lo--; while(!isWhite(hi)) hi++;
  const wc=()=>{let c=0;for(let m=lo;m<=hi;m++) if(isWhite(m)) c++;return c;};
  for(let s=0;wc()<minWhite&&s<12;s++){if(s%2){lo--;while(!isWhite(lo))lo--;}else{hi++;while(!isWhite(hi))hi++;}}
  return [lo,hi];
}
function keyRange(P){
  const ms=[];
  [P.maj,P.min].forEach(s=>{ms.push(...s.stack.map(n=>n.midi),s.root.midi,...s.closeRes.map(n=>n.midi),...s.ch.map(n=>n.midi),...s.res.map(n=>n.midi));});
  return kbRange(ms);
}
// 密集の和音：導音は赤、第9音は赤むらさき（o.diff）、o.ghost＝はぶいた根音、o.was＝もとの音
function stackMarks(ns,col,o={}){
  const mk=new Map();
  if(o.was) mk.set(o.was.midi,{fill:'#fff',ring:DIFF,tc:DIFF,label:PA.nm(o.was),sub:'長調の音',subColor:GHOST});
  if(o.ghost) mk.set(o.ghost.midi,{fill:'#f4efe8',ring:'#b3a99c',tc:GHOST,label:PA.nm(o.ghost),sub:'はぶく',subColor:GHOST,sr:'はぶいた根音'});
  ns.forEach(n=>{
    const lt=n.tag==='lt', d=o.diff&&n.midi===o.diff.midi;
    const m={fill:d?DIFF:lt?LT:col,label:PA.nm(n),focus:true};
    if(lt){m.sub='導音';m.subColor=LT;}
    if(d&&o.dsub){m.sub=o.dsub;m.subColor=DIFF;}
    mk.set(n.midi,m);
  });
  return mk;
}
// 2つをかさねて見せる：おなじ3つ＋第9音（長調・短調）
function overlayMarks(P){
  const mk=stackMarks(P.maj.stack.filter(n=>n!==P.maj.six),PUR);
  mk.set(P.maj.six.midi,{fill:SUN,ring:DIFF,label:PA.nm(P.maj.six),focus:true,sub:'長調',subColor:SUN});
  mk.set(P.min.six.midi,{fill:NIGHT,ring:DIFF,label:PA.nm(P.min.six),focus:true,sub:'短調',subColor:NIGHT});
  return mk;
}
// 4声（Ⅰへの解決）：ベースは左手（うすい色）。導音は赤いわく。
// フォーカスは上の3つ（右手）だけ：ベースまで入れるとスマホのはばにおさまらないので、左手は名前を上の字で出す
function voiceMarks(ns,col){
  const m=new Map();
  ns.forEach((n,i)=>{
    const lt=n.tag==='lt';
    if(i===0) m.set(n.midi,{fill:LIGHT[col]||'#eee',tc:DARK[col]||'#3a3245',label:PA.nm(n),sub:'左手',subColor:col,ring:lt?LT:undefined});
    else if(!m.has(n.midi)) m.set(n.midi,{fill:lt?LT:col,label:PA.nm(n),focus:true});
  });
  return m;
}
// いまのじゅんばん（短調）のけんばん
function stepMarks(P,i){
  const N=P.min;
  if(i===4) return stackMarks(N.closeRes,ICOL);
  return stackMarks(stepNotes(N,i),NIGHT,{ghost:i===3?N.root:null,diff:i>=2?N.six:null,dsub:'第9音'});
}

/* ===== がくふ ===== */
function staffBox(svg,name){
  // 小さくなりすぎないように（文字が読めるように）横スクロールにする
  const m=svg.match(/viewBox="0 0 ([\d.]+) /), W=m?+m[1]:400;
  return `<div class="scroll" data-sk="${name}"><div style="min-width:${Math.round(W*0.66)}px">${svg}</div></div>`;
}
// ヘ音記号の矢印（PA.staffSVG の矢印はト音記号だけなので、おなじ位置をここで計算する）
function bassArrows(svg,key,cols,o,arrows){
  const ns=o.noSig?0:PA.sigInfo(key).letters.length, nx=50+ns*10+(ns?24:14), cw=o.colW||70, BT=96+82;
  const pos=(ci,n)=>({x:nx+ci*cw+cw/2,y:BT-(PA.stepOf(n)-26)*5});
  let s=''; const cs=new Set();
  arrows.forEach(a=>{
    const p=pos(a.c1,cols[a.c1].lh[a.i1]), r=pos(a.c2,cols[a.c2].lh[a.i2]); cs.add(a.color);
    s+=`<path d="M${p.x+12} ${p.y} L${r.x-22} ${r.y}" stroke="${a.color}" stroke-width="2.2" fill="none" stroke-dasharray="${a.dash||''}" marker-end="url(#dh-${a.color.slice(1)})"/>`;
    if(a.text) s+=`<text x="${r.x+14}" y="${r.y+5}" font-size="14" font-weight="800" fill="${a.color}">${a.text}</text>`;
  });
  s+=`<defs>${[...cs].map(c=>`<marker id="dh-${c.slice(1)}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${c}"/></marker>`).join('')}</defs>`;
  return svg.replace(/<\/svg>$/,s+'</svg>');
}
// つくるじゅん（短調・調号つき）：Ⅴ・Ⅴ7・Ⅴ9・減七・Ⅰ。いまの列にうすい色、まだの列はうすく。導音の臨時記号は赤
function stepStaff(P,cur){
  const N=P.min, k=N.k, noSig=!sigOK(k);
  const cols=STEPS.map((st,j)=>({notes:stepNotes(N,j).map(n=>({...n,raised:n.tag==='lt'})),color:j===4?ICOL:NIGHT,ltColor:LT,accColor:LT,
    label:st.staff,labelColor:j===4?ICOL:NIGHT,op:cur>=0&&j>cur?0.28:1,hl:j===cur?'#eef0fb':null}));

// ならべた形（調号なし）：ちがう音だけ赤むらさきの音符と臨時記号
function cmpStaff(P){

  const cols=[
    {notes:mark(P.maj),color:SUN,ltColor:DIFF,accColor:DIFF,accRing:true,label:'長調',labelColor:SUN},
    {notes:mark(P.min),color:NIGHT,ltColor:DIFF,accColor:DIFF,accRing:true,label:'短調（減七）',labelColor:NIGHT}];
  const cw=130, svg=PA.staffSVG(P.majK,cols,{noSig:true,autoCarry:true,colW:cw,minW:320});
  // 矢印はここで描く（♭♭のような2つぶんの臨時記号にかさならないように、手前で止める）。ト音記号だけ（TB＝110）・調号なし
  const nx=64, a=P.maj.six, y=110-(PA.stepOf(a)-30)*5, x1=nx+cw/2+12, x2=nx+cw+cw/2-34;
  const arrow=`<path d="M${x1} ${y} L${x2} ${y}" stroke="${DIFF}" stroke-width="2.2" fill="none" marker-end="url(#dh-cmp)"/>`+
    `<text x="${nx+cw+cw/2+14}" y="${y+5}" font-size="14" font-weight="800" fill="${DIFF}">半音↓</text>`+
    `<defs><marker id="dh-cmp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${DIFF}"/></marker></defs>`;
  return staffBox(svg.replace(/<\/svg>$/,arrow+'</svg>'),'cmpstaff');
}
// 根音をはぶいたⅤ9 → Ⅰ（4声。ト音記号に上の3つ、ヘ音記号にベース）
function resStaff(s){
  const k=s.k, noSig=!sigOK(k);
  const col=(ns,o)=>({notes:ns.slice(1).map(n=>({...n,raised:n.tag==='lt'})),lh:[{...ns[0],raised:ns[0].tag==='lt'}],color:o.color,ltColor:LT,accColor:LT,label:o.label,sub:o.sub,labelColor:o.color});
  const cols=[col(s.ch,{color:s.col,label:'Ⅴ9',sub:'根音省略'}),col(s.res,{color:ICOL,label:'Ⅰ'})];
  const o={grand:true,autoCarry:true,colW:150,minW:340,noSig,arrows:[
    {c1:0,i1:0,c2:1,i2:0,color:s.col},
    {c1:0,i1:1,c2:1,i2:1,color:DIFF},
    {c1:0,i1:2,c2:1,i2:2,color:'#b3a99c',dash:'4 4'}]};
  let svg=PA.staffSVG(k,cols,o);
  svg=bassArrows(svg,k,cols,o,[{c1:0,i1:0,c2:1,i2:0,color:LT,text:'半音↑'}]);
  return staffBox(svg,'resstaff');
}

function chainHTML(s,minor){
  const ns=s.stack, white=ns.map(n=>({...n,acc:0,midi:n.midi-n.acc}));
  const sig=ns.map(n=>{const a=s.k.sig[n.letter]||0;return {...n,acc:a,midi:n.midi-n.acc+a};});
  // 調号に x・♭♭が入る調（調号を書かない調）は「音階の音にする」
  const st=[['白鍵だけ',white],[sigOK(s.k)?'調号をつける':'音階の音にする',sig]];
  if(minor) st.push(['導音を上げる',ns]);
  const out=[];
  st.forEach(([lab,xs],i)=>{
    if(i>0&&xs.every((n,j)=>n.acc===st[i-1][1][j].acc)) return;
    const d=isDim7(xs);
    out.push(`<span class="chip ${d?'q-d':''}">${out.length?lab:'白鍵だけ'}：${xs.map(n=>PA.nmH(n)).join(PA.settings.naming==='ja'?'・':'')}${d?'（減七）':''}</span>`); // ハニホは字が2つの音名があるので「・」でわける
  });
  return out.join('<span class="chip arrow" aria-hidden="true">→</span>');
}

  // リストにない短調（変イ短調）は、おなじけんばんの短調でひらく
  const m=P.minK, via=m&&m.enh&&m.idx>=0?`<small class="via">${kn(PA.minorKey(m.idx))}でひらくよ（同じけんばん）</small>`:'';
  return `<details class="card fold" data-d="links"><summary><h2><span aria-hidden="true">🔗</span> つながるアプリ<small>Ⅴの家族・異名同音の読みかえ</small></h2></summary><div class="links">
    <button class="btn" data-act="go" data-v="minor-family"><span aria-hidden="true">🏠</span> Ⅴの家族<small>短調のⅤ・Ⅴ7・Ⅴ9・減七と、減七の3つのなかま</small>${via}</button>
    <button class="btn" data-act="go" data-v="enharmonic"><span aria-hidden="true">🔀</span> 異名同音の読みかえ<small>同じ減七が、4つの短調のⅤ9（根音なし）になる</small>${via}</button>
  </div></details>`;
}
// 「ためしてみる」：短調クイズで、いまの短調の減七とⅤ9をおさえる（5もん）
const minorIdx=()=>state.minor?state.keyIdx:pairOf(curKey()).minK.idx;
function tryCard(P){
  const mi=minorIdx(), key=Number.isInteger(mi)&&mi>=0?PA.keyDeck.id(true,mi):null;
  return PA.tryHTML({to:'minor-quiz',params:{mode:'chord',key,chord:'DIM,V9',n:5},
    sub:`けんばんで、${kn(key?PA.minorKey(mi):P.minK)}の減七とⅤ9をおさえてみよう。5問。`,
    btn:PA.icon('target')+'5問ためしてみる',
    links:[{to:'ear',params:{level:6},label:PA.icon('ear')+'減七を耳で聴きわける（七の和音）'}]});
}
function moreHTML(P){
  const M=P.maj, N=P.min;
  return `<details class="more" data-d="more"><summary>💡 もっとくわしく</summary><ul>
    <li><b>減七の名前のわけ</b>：いちばん下といちばん上のはばが、ふつうの7度よりせまい（けんばんでは6度と同じはば）ので「減七」とよぶよ。</li>
    <li>根音をはぶいたⅤ9は、導音からひとつとばしに4つつんだ形なので、<b>Ⅶ7</b>と書く本もあるよ。でもはたらきはⅤのなかま。だからⅤと同じようにⅠへすすむよ。</li>
    <li><b>長調で減七を使う</b>こともあるよ。${kn(N.k)}（同じ主音の短調）から第9音${q(N.six)}をかりた和音で、準固有和音（記号は${H.label(P.majK,'borrowed','vii_dim7')}）。<a href="borrowed.html">🎁 準固有和音</a></li>
    <li><b>短調で${q(M.six)}？</b>：短調で${q(M.six)}を使うには、6ばんめを半音上げることになる。短調のⅤ9としてはふつう使わないよ。</li>
    <li><b>コードネーム</b>（ポピュラー音楽などで使う、アルファベットの名前）では、${kn(N.k)}の減七は「${N.sym}」、${kn(M.k)}の形は「${M.sym}」と書くよ。和音記号（Ⅴ9など）とはべつの書きかただよ。</li>
    <li>ダブルシャープは「<span class="ds">x</span>」、ダブルフラットは「${PA.H('𝄫')}」と書くよ。</li>
    <li>けんばんと「がくふでくらべる」は、根音から上へひとつとばしにつんだ形で、「Ⅰへすすむ」は4つの声（左手1つ・右手3つ）の形で鳴らしているよ。</li>
    <li>右上の ⚙️ で、音の名前（ドレミ／CDE／ハニホ）と基準の音（ラ＝440〜443Hz）を選べるよ。</li>
  </ul></details>`;
}
// 📖 ことばメモ：本や楽譜で見かける名前を、やさしいことばで（いまの調の音をれいに）。よみかたは小さく
function termsHTML(P){
  const N=P.min, W=n=>PA.nmH({letter:n,acc:0});
  return `<details class="more terms" data-d="terms"><summary>📖 ことばメモ（本や楽譜で見かける名前）</summary><dl>
    <dt>属九の和音<span class="yomi">（ぞくきゅうのわおん）</span></dt>
      <dd>Ⅴ9のこと。Ⅴ7の上に、もうひとつとばして第9音をのせた5つの音の和音。</dd>
    <dt>根音省略形<span class="yomi">（こんおんしょうりゃくけい）</span></dt>
      <dd>和音から根音をはぶいた形のこと。短調で「Ⅴ9の根音省略形」と書いてあったら、このページの減七のこと。</dd>
    <dt>減七の和音<span class="yomi">（げんしちのわおん）</span></dt>
      <dd>4つの音が、ぜんぶ同じ間かくでかさなった七の和音。短調のⅤ9から根音をはぶくとこの形。例：${kn(N.k)}（${namesW(N.stack)}）。</dd>
    <dt>解決<span class="yomi">（かいけつ）</span></dt>
      <dd>ドキドキする和音が、おちつく和音（Ⅰなど）へすすむこと。このページの「Ⅰへすすむ」のこと。</dd>
    <dt>短3度<span class="yomi">（たん3ど）</span></dt>
      <dd>減七のとなりどうしの間かくの名前。白鍵でいうと「${W(1)}と${W(3)}」「${W(2)}と${W(4)}」の間かく。</dd>
  </dl></details>`;
}
let lastActions='';
function render(){
  const key=curKey(), P=pairOf(key);
  const with_=P.respell?`${kn(P.majK)}（同じけんばん）と${kn(P.minK)}で`:state.minor?`同じ主音の${kn(P.majK)}と`:`同じ主音の${kn(P.minK)}でつくって、`;
  let h=`<div class="stack">
    <div class="toprow">${PA.keyChip(key)}<span class="note" style="margin:0">${PA.keyEn(key)}・${with_}くらべる</span></div>`;
  // いつもひらいているのは、主役（短調でつくる・けんばん・長調とくらべる・がくふ・ためしてみる）だけ。ほかはたたんで下に
  h+=heroCard(P)+kbCard(P)+cmpCard(P)+staffCmpCard(P)+tryCard(P)+resCard(P)+abCard(P)+tableCard(P)+shapeCard(P)+linksCard(P)+moreHTML(P)+termsHTML(P);
  h+=`</div>`;
  PA.paint(document.getElementById('view'),h,'dh:'+state.minor+':'+state.keyIdx);
  PA.follow(document.getElementById('view')); // 光る鍵が見えるように（見えていれば動かさない。鳴らしおわってもとの形にもどったときも）
  const last=state.step===STEPS.length-1;
  const acts=(state.anim?`<button class="btn" data-act="stop">${PA.icon('stop')}とめる</button>`:`<button class="btn night" data-act="build"><span aria-hidden="true">🐸</span> つくりかた</button>`)+
    `<button class="btn" data-act="stepplay" data-hot="listen">${PA.icon('listen')}きく</button>`+
    (last?`<button class="btn primary" data-act="tocmp"><span aria-hidden="true">☀️</span> 長調では？</button>`:`<button class="btn primary" data-act="stepnext" data-hot="next">${PA.icon('next')}つぎへ</button>`);
  if(acts!==lastActions){PA.paint(document.getElementById('actions'),acts,'bar');lastActions=acts;}
}

/* ===== 鳴らす ===== */
let token=0;
function stop(){token++;state.anim=null;state.autoWait=false;state.play=null;state.res=0;PA.stopSound();}
// つくるじゅんの音：Ⅴ〜Ⅴ9は下からじゅんに鳴らしてから和音、はぶく・Ⅰは和音
async function playStep(i){
  stop(); const my=token, ns=stepNotes(pairOf(curKey()).min,i);
  state.step=i; state.done=false; render();
  if(i<=2){PA.chord(midis(ns),{arp:true,gap:0.28});await PA.sleep(ns.length*280+250);if(my!==token) return;}
  PA.chord(midis(ns),{dur:2});
}
async function playSide(id){
  stop(); const my=token, s=pairOf(curKey())[id];
  state.play=id; render(); PA.chord(midis(s.stack),{dur:2});
  await PA.sleep(2200); if(my!==token) return;
  state.play=null; render();
}
async function playCompare(){
  stop(); const my=token, P=pairOf(curKey());
  for(const id of ['maj','min']){
    state.play=id; render(); PA.chord(midis(P[id].stack),{dur:id==='min'?2.2:1.6});
    await PA.sleep(id==='min'?2200:1600); if(my!==token) return;
  }
  state.play='both'; render(); await PA.sleep(1800); if(my!==token) return;
  state.play=null; render();
}
async function playResolve(){
  stop(); const my=token, s=pairOf(curKey())[state.side];
  state.res=1; render(); PA.chord(midis(s.ch),{dur:1.4});
  await PA.sleep(1300); if(my!==token) return;
  state.res=2; render(); PA.chord(midis(s.res),{dur:2.2});
  await PA.sleep(2300); if(my!==token) return;
  state.res=0; render();
}
// 聴きくらべ：答えがわからないように、けんばんには出さない
function playAB(v){
  if(!state.ab) return;
  stop(); render();
  const P=pairOf(curKey()), s=v===state.ab.dim?P.min:P.maj;
  PA.chord(midis(s.stack),{dur:2});
}

/* ===== つくりかたアニメ ===== */
async function runBuild(){
  stop(); const my=token, alive=()=>my===token, wait=async ms=>{await PA.sleep(ms);return alive();};
  const P=pairOf(curKey()), M=P.maj, N=P.min, root=N.root;
  // marks・msg は関数でもつ（とちゅうで音の名前の設定をかえても、いまの名前で描きなおせるように）。step＝がくふで光らせる列
  const A={marks:()=>new Map(),msg:()=>'',kbCap:'',step:0}; state.anim=A; state.done=false;
  const upd=m=>{if(m!==undefined)A.msg=m;render();};
  const v9N=[root,...N.stack], v9M=[M.root,...M.stack];
  const NAMES=['根音','第3音（導音）','第5音','第7音','第9音'], DONE={2:'Ⅴ',3:'Ⅴ7',4:'Ⅴ9'};
  // ① 短調のⅤ9を1つずつつむ（3つでⅤ、4つでⅤ7、5つでⅤ9）
  const head=()=>`<b>🌙 ${kn(N.k)}</b>：音階の5ばんめ${q(root)}から、ひとつとばしにつむよ。`;
  A.kbCap=`${kn(N.k)}のⅤ9をつむ`;
  for(let i=0;i<v9N.length;i++){
    A.step=Math.max(0,i-2);
    A.marks=()=>stackMarks(v9N.slice(0,i+1),NIGHT,{diff:i>=4?N.six:null,dsub:'第9音'});
    upd(()=>head()+`<br>${i+1}. ${q(v9N[i])}（${NAMES[i]}）${DONE[i]?`… <b>${DONE[i]}</b>`:''}`); PA.playNote(v9N[i].midi,0,1.1,0.22);
    if(!await wait(1100)) return;
    if(DONE[i]){PA.chord(midis(v9N.slice(0,i+1)),{dur:1.3});if(!await wait(1300)) return;}
  }
  // ② 根音をはぶく → 減七
  A.step=3; A.marks=()=>stepMarks(P,3); A.kbCap=`${kn(N.k)}：根音省略`;
  upd(()=>stepMsg(P,3)); PA.chord(midis(N.stack)); if(!await wait(2600)) return;
  // ③ 長調では：Ⅴ・Ⅴ7は同じ。第9音だけ半音高い
  A.marks=()=>stackMarks(v9M,SUN,{diff:M.six,dsub:'第9音'}); A.kbCap=`${kn(M.k)}のⅤ9`;
  upd(()=>`<b>☀️ ${kn(M.k)}では？</b> 同じ主音の長調でも、Ⅴ・Ⅴ7はまったく同じ音。<br>ちがうのは第9音だけ：長調の音階の6ばんめは${q(M.six)}（${q(N.six)}より半音高い）。`);
  PA.playNote(M.six.midi,0,1.1,0.24); if(!await wait(1100)) return;
  PA.chord(midis(v9M)); if(!await wait(2400)) return;
  // ④ 長調で根音をはぶく → 減七にならない
  A.marks=()=>stackMarks(M.stack,SUN,{ghost:M.root,diff:M.six,dsub:'第9音'}); A.kbCap=`${kn(M.k)}：根音省略`;
  upd(()=>`根音${q(M.root)}を省略すると… <b class="big">${namesW(M.stack)}</b><br>いちばん上の${q(M.six)}が高いぶん、間かくがそろわない。だから<b style="color:${SUN}">長調では減七にならない</b>よ。`);
  PA.chord(midis(M.stack)); if(!await wait(2600)) return;
  // ⑤ かさねてくらべる
  A.marks=()=>overlayMarks(P); A.kbCap='2つをかさねると';
  upd(()=>doneMsg(P));
  PA.chord(midis(M.stack),{dur:1.6}); if(!await wait(1600)) return;
  PA.chord(midis(N.stack),{dur:2.2}); if(!await wait(2400)) return;
  state.done=true; state.anim=null; render();
}

/* ===== 操作 ===== */
PA.mountBar({title:'Ⅴ9の根音省略',app:'dim-halfdim'});
PA.onSettings=()=>{for(const k in cache) delete cache[k];render();};
PA.onPageShow=()=>{stop();render();}; // 「もどる」でもどってきたとき、とちゅうの画面をのこさない
PA.onStopDown=stop;
PA.onStopCancel=render; // ⏹ をおしたのに click が来なかったとき画面をもどす
PA.onKeySheet=()=>PA.openKeySheet({minor:state.minor,idx:state.keyIdx,both:true,onPick:(minor,idx)=>{
  stop(); state.minor=minor; state.keyIdx=idx; state.ab=null; state.done=false; save(); playStep(state.step);
}});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){goFamily();return;} // 文の中のリンク（そのまま進む）
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v;
  if(a==='step'){const i=+v;if(Number.isInteger(i)&&i>=0&&i<STEPS.length) playStep(i);}
  else if(a==='stepplay') playStep(state.step);
  else if(a==='stepnext') playStep(Math.min(state.step+1,STEPS.length-1));
  else if(a==='tocmp'){
    const c=document.getElementById('cmp');
    if(c&&c.scrollIntoView) c.scrollIntoView({block:'start',behavior:PA.reduceMotion()?'auto':'smooth'});
    playCompare();
  }
  else if(a==='side'){if(v==='maj'||v==='min') playSide(v);}
  else if(a==='resolve') playResolve();
  else if(a==='rside'){if(v!=='maj'&&v!=='min')return;state.side=v;playResolve();}
  else if(a==='build') runBuild();
  else if(a==='stop'){stop();render();}
  else if(a==='qnext'){stop();state.ab={dim:Math.random()<0.5?'A':'B',answer:null};render();}
  else if(a==='abplay') playAB(v);
  else if(a==='qchoose'){if(state.ab&&state.ab.answer==null&&(v==='A'||v==='B')){stop();state.ab.answer=v;state.abN++;if(v===state.ab.dim)state.abOk++;render();}}
  else if(a==='go'){
    stop(); render();
    if(v==='minor-family'){goFamily();PA.go('minor-family.html');}
    else if(v==='enharmonic'){
      // おなじ主音の短調の減七でひらく（家族はむこうのページが調からきめる）
      const mi=minorIdx();
      if(Number.isInteger(mi)&&mi>=0){const p=PA.store.get('enharmonic',{})||{};PA.store.set('enharmonic',{...(typeof p==='object'?p:{}),keyIdx:mi});}
      PA.go('enharmonic.html');
    }
  }
});
// Ⅴの家族は短調だけ：くらべている短調の減七をひらく（リストにない変イ短調は、おなじけんばんの嬰ト短調）
function goFamily(){
  const mi=minorIdx();
  const mf=PA.store.get('minor-family',{})||{};
  PA.store.set('minor-family',{...(typeof mf==='object'?mf:{}),keyIdx:Number.isInteger(mi)&&mi>=0?mi:Number.isInteger(mf.keyIdx)?mf.keyIdx:0,fam:'DIM'});
}
render();
// ほかのアプリの「つくりかたを見る」から来たとき：えらばれた調でアニメをはじめる
// iPhone などではこのページをタッチするまで音が出ないので、音が出せるようになってからはじめる
// （音がとまっているあいだに音をよやくすると、あとでいっぺんに鳴ってしまう）
if(PA.store.get('dim-halfdim-auto',false)) (async()=>{
  PA.store.set('dim-halfdim-auto',false);
  const t0=token; // まっているあいだにほかの操作をしたらやめる
  if(PA.settings.sound){ // パソコンなどですぐ音が出せるならそのままはじめる
    PA.audio();
    for(let i=0;i<5&&!PA.audioRunning();i++) await PA.sleep(30);
  }
  if(token!==t0) return;
  if(!PA.settings.sound||!PA.audio()||PA.audioRunning()){runBuild();return;} // 音が出せないブラウザでは待たずにはじめる
  state.autoWait=true; render();
  const EV=['pointerup','touchend','keydown'];
  let busy=false;
  const off=()=>EV.forEach(t=>document.removeEventListener(t,go,true));
  async function go(e){
    if(!state.autoWait){off();return;}
    // ボタン・リンク・シート・けんばんはそれぞれの操作にまかせる（つくりかた／調をかえると待ちはおわる）
    const t=e&&e.target;
    if(t&&t.closest&&t.closest('button,a,dialog,summary,.appbar,[data-act],[data-pa],[data-m]')) return;
    if(busy) return; busy=true;
    PA.audio(); // core もこのタッチで音を起こすので、動きだすのを少しまつ
    for(let i=0;i<15&&PA.settings.sound&&!PA.audioRunning();i++) await PA.sleep(30);
    busy=false;
    if(!state.autoWait){off();return;}
    if(PA.settings.sound&&PA.audio()&&!PA.audioRunning()) return; // まだ音が出せない：つぎのタッチをまつ
    off(); runBuild();
  }
  EV.forEach(t=>document.addEventListener(t,go,true));
})();
</script>
</body>
