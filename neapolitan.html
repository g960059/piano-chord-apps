<header class="appbar" id="appbar"></header>
<main class="page" id="view"></main>

<script src="assets/core.js"></script>
<script>
/* ナポリの六：Ⅱ6の根音を半音下げた和音（♭Ⅱの第1転回形）。ベースは第4音で、Ⅳ・Ⅱ6とおなじ下属（S）の場所におく。
 * 和音のつづり・高さ・Ⅴへのすすみかたは PA.henka（ナポリ・Ⅰ6/4・準固有）。
 * カデンツのⅠ・Ⅴ7は PA.henka の和音から声部をとなりへうごかしてつくる（連続5度・8度なし：test でたしかめる） */
const H=PA.henka;
const N_COL=PA.COL.IV, SRC_COL='#7a8d84', V_COL='#3b4fa8', V7_COL=PA.COL.V7, I_COL=PA.COL.I, LOW='#2f7ee8', LT='#d1495b', BOR='#b4600b', GHOST='#9b9184';
const LIGHT={[N_COL]:'#bfe8d3',[SRC_COL]:'#dde5e1',[V_COL]:'#c9d0f0',[I_COL]:'#f8c9bd'};
const DARK={[N_COL]:'#11603e',[SRC_COL]:'#3d4d45',[V_COL]:'#24316f',[I_COL]:'#8f2a17'};
const SRCS=['ii6','iv'], PATHS=['direct','i64'];

const saved=PA.store.get('neapolitan',{})||{};
const state={minor:saved.minor===true,keyIdx:0,src:'ii6',path:'direct',cadPath:'direct',anim:null,msg:null,autoWait:false,
  playing:false,alt:null,res:null,cad:null,cmp:null,ab:null,abOk:0,abN:0,abPlaying:null};
if(Number.isInteger(saved.keyIdx)&&saved.keyIdx>=0&&saved.keyIdx<PA.keyCount(state.minor)) state.keyIdx=saved.keyIdx;
if(SRCS.includes(PA.store.get('neapolitan-src','ii6'))) state.src=PA.store.get('neapolitan-src','ii6');
if(PATHS.includes(PA.store.get('neapolitan-path','direct'))) state.path=PA.store.get('neapolitan-path','direct');
if(PATHS.includes(PA.store.get('neapolitan-cpath','direct'))) state.cadPath=PA.store.get('neapolitan-cpath','direct');
const save=()=>PA.store.set('neapolitan',{minor:state.minor,keyIdx:state.keyIdx});
const curKey=()=>PA.keyOf(state.minor,state.keyIdx);

/* ===== 音のよびかた ===== */
const nH=n=>{const c=n.tag==='low'?'lo':n.tag==='lt'?'up':n.tag==='borrowed'?'bor':'';return `<span class="nw ${c}">${PA.nmH(n)}</span>`;};
const q=n=>`「${nH(n)}」`;
const namesC=(ns,sep='・')=>ns.map(nH).join(sep);
// 和音記号（藝大式・PA.rn）：Ⅰの第2転回形＝Ⅰ²、Ⅱの第1転回形＝Ⅱ¹、ナポリの六＝Ⅱの根音下方変位・第1転回形（長調は○も）
const I64P={deg:1,inv:2}, I64H=PA.rn(I64P);
const II6P={deg:2,inv:1}, II6H=PA.rn(II6P);
const n6P=key=>H.rnParts(key,'N6'), N6H=key=>PA.rn(n6P(key));
const parMinor=key=>PA.keyName({...key,minor:true}); // おなじ主音の短調
const sigAcc=(key,L)=>key.sig[L]||0;
const pcN=n=>PA.mod(PA.NAT[n.letter]+n.acc,12);
const midisOf=ns=>[...new Set(ns.map(n=>n.midi))];
// 下からじゅんに、おなじつづりは1つだけ（ベースとおなじ音を2つ書かない）
const uniqNames=ns=>{const seen=new Set();return ns.filter(n=>{const k=n.letter+':'+n.acc;if(seen.has(k))return false;seen.add(k);return true;});};

/* ===== 和音（PA.henka から） ===== */
const n6Of=key=>H.neapolitan(key); // [第4音 | 第4音, ♭6, ♭2]
const scaleOf=key=>key.minor?key.nat:key.scale; // 調の音階（短調は自然的短音階＝調号の音）
// 音 n をつづり s にかえる（いちばん近い高さ。文字がおなじなら変化記号のぶんだけ）
const re=(n,s,role,tag)=>({letter:s.letter,acc:s.acc,midi:n.midi+PA.mod(pcN(s)-pcN(n)+6,12)-6,role,tag:tag||null});
/* もとの和音（ナポリとおなじならび・おなじ高さ）：src＝'ii6'（Ⅱ6：第4音・第6音・第2音）／'iv'（Ⅳ：第4音・第6音・主音）
 * borrow＝true は長調で第6音を同主短調からかりた形（○Ⅱ6・○Ⅳ）。短調の第6音はもともと調号の♭6 */
function srcChord(key,src,borrow){
  const [b,f,s6,r2]=n6Of(key), S=scaleOf(key);
  const six=key.minor?{...s6,tag:null}:borrow?{...s6,tag:'borrowed'}:re(s6,S[5],'',null);
  if(src==='iv') return [{...b,role:'根音（いちばん下）',tag:null},{...f,role:'根音',tag:null},{...six,role:'第3音'+(six.tag==='borrowed'?'（下げた第6音）':'')},re(r2,S[0],'第5音')];
  return [{...b,role:'第3音（いちばん下）',tag:null},{...f,role:'第3音',tag:null},{...six,role:'第5音'+(six.tag==='borrowed'?'（下げた第6音）':'')},re(r2,S[1],'根音')];
}
// もとの和音の記号の部品（○Ⅳ・○Ⅱ¹・Ⅳ・Ⅱ¹）
const srcLabel=(key,src,borrow)=>borrow&&!key.minor?H.rnParts(key,'borrowed',src==='iv'?'iv':'ii_dim'):(src==='iv'?{deg:4}:II6P);
function srcSym(key,src,borrow){
  if(!key.minor) return H.symbol(key,borrow?'borrowed':'diatonic',src==='iv'?'iv':'ii_dim');
  const s=srcChord(key,src,false);
  return src==='iv'?H.chordName(s[0],'m'):H.chordName(s[3],'dim',s[0]);
}
/* Ⅴへ：［ナポリ, (Ⅰ6/4), Ⅴ］。すぐすすむときはカデンツとおなじⅤ7（第5音なし）：上の第4音をそのままのこして第7音にする。
 * （Ⅴの三和音だと、♭2のすぐあとにほかの声で♮2が鳴る対斜になり、第4音を上げるとベースと連続8度になる） */
const toV7=key=>cadSeq(key,'direct')[2].ns;
function stagesOf(key,path){
  const s=[{id:'n6',notes:n6Of(key),color:N_COL,label:n6P(key),name:'ナポリの六'}];
  if(path==='i64'){const [i64,v]=H.viaI64(key);s.push({id:'i64',notes:i64,color:V_COL,label:I64P,name:I64H},{id:'V',notes:v,color:V_COL,label:'Ⅴ',name:'Ⅴ'});}
  else s.push({id:'V',notes:toV7(key),color:V_COL,label:'Ⅴ7',name:'Ⅴ7'});
  return s;
}
/* カデンツ：Ⅰ → N6 → (Ⅰ6/4) → Ⅴ7 → Ⅰ
 * 主音から lo 文字・so 半音上のつづりへ、まえの和音のおなじ声から dir（up／down／hold＝そのまま／bass＝ベースの音域のまん中に近いほう）でうごく */
const sp=(key,lo,so)=>{const L=PA.mod(key.l+lo,7);return {letter:L,acc:PA.spell(L,key.tpc+so)};};
function vl(key,from,lo,so,dir,role,tag){
  const s=sp(key,lo,so), p=pcN(s), f=from.midi;
  const up=f+PA.mod(p-f-1,12)+1, down=f-(PA.mod(f-p-1,12)+1);
  let m=dir==='up'?up:dir==='down'?down:f;
  if(dir==='bass'){ // ベース40〜55の中でまん中（47）に近いほう
    const ok=[up,down].filter(x=>x>=40&&x<=55);
    m=(ok.length?ok:[up,down]).reduce((a,x)=>Math.abs(x-47)<Math.abs(a-47)?x:a);
  }
  return {...s,midi:m,role,tag:tag||null};
}
function cadSeq(key,path){
  const th=key.minor?3:4, n6=n6Of(key);
  // Ⅰ：上の3つの声はとなりへ上がってナポリへ（第3音→第4音、第5音→♭6、主音→♭2）
  const I0=[vl(key,n6[0],0,0,'bass','Ⅰの根音'),vl(key,n6[1],2,th,'down','Ⅰの第3音'),vl(key,n6[2],4,7,'down','Ⅰの第5音'),vl(key,n6[3],0,0,'down','Ⅰの根音')];
  const seq=[{lab:'Ⅰ',col:I_COL,ns:I0,d:1},{id:'n6',lab:n6P(key),col:N_COL,ns:n6,d:1.3}];
  let V7, I2;
  if(path==='i64'){
    const i64=H.viaI64(key)[0];
    // Ⅰ6/4 → Ⅴ7：6度は下へ（第3音→Ⅴの第5音）、8度→7度（第5音→第7音）、4度は下へ（主音→導音）
    V7=[vl(key,i64[0],4,7,'hold','Ⅴの根音'),vl(key,i64[1],1,2,'down','Ⅴの第5音'),vl(key,i64[2],3,5,'down','Ⅴの第7音','seventh'),vl(key,i64[3],6,11,'down','Ⅴの第3音（導音）','lt')];
    // 4つの音がそろったⅤ7 → Ⅰ：根音を3つ（第5音ははぶく）
    I2=[vl(key,V7[0],0,0,'bass','Ⅰの根音'),vl(key,V7[1],0,0,'down','Ⅰの根音'),vl(key,V7[2],2,th,'down','Ⅰの第3音'),vl(key,V7[3],0,0,'up','Ⅰの根音')];
    seq.push({lab:I64P,col:V_COL,ns:i64,d:1.1});
  }else{
    // ナポリ → Ⅴ7：上の第4音はそのままのこってⅤ7の第7音に、♭6 → 第5音、♭2 → 導音（減3度下へ）
    V7=[vl(key,n6[0],4,7,'up','Ⅴの根音'),{...n6[1],role:'Ⅴの第7音',tag:'seventh'},vl(key,n6[2],4,7,'down','Ⅴの根音'),vl(key,n6[3],6,11,'down','Ⅴの第3音（導音）','lt')];
    // Ⅴ7（第5音なし）→ Ⅰ：第7音は下へ、根音はそのまま（Ⅰの第5音）、導音は上へ
    I2=[vl(key,V7[0],0,0,'bass','Ⅰの根音'),vl(key,V7[1],2,th,'down','Ⅰの第3音'),vl(key,V7[2],4,7,'hold','Ⅰの第5音'),vl(key,V7[3],0,0,'up','Ⅰの根音')];
  }
  seq.push({lab:'Ⅴ7',col:V_COL,ns:V7,d:1.1},{lab:'Ⅰ',col:I_COL,ns:I2,d:2.2});
  return seq;
}
// この調で出てくる音がぜんぶ入るけんばんのはんい（白鍵から白鍵まで）
const whiteDown=m=>{while(PA.BLACK.has(PA.mod(m,12)))m--;return m;};
const whiteUp=m=>{while(PA.BLACK.has(PA.mod(m,12)))m++;return m;};
function keyRange(key){
  const L=[n6Of(key),toV7(key),...H.viaI64(key)];
  SRCS.forEach(s=>{L.push(srcChord(key,s,false),srcChord(key,s,true));});
  PATHS.forEach(p=>cadSeq(key,p).forEach(c=>L.push(c.ns)));
  const ms=L.flat().map(n=>n.midi);
  return [whiteDown(Math.min(...ms)-2),whiteUp(Math.max(...ms)+2)];
}

/* ===== がくふ（大譜表。いちばん下の音とド4より下の音はヘ音記号）＋矢印 ===== */
// hl＝色をつける音（ふつうは導音）。hlColor の色になる
const prep=(n,c)=>({letter:n.letter,acc:n.acc,midi:n.midi,raised:(c.hl?c.hl(n):n.tag==='lt')||undefined});
// cols:[{notes,color,label,op,hl,hlColor}]、arrows:[{c1,n1,c2,n2,color,text,dash,dy}]（n1・n2は cols の音そのもの）
function staff(key,cols,arrows=[],o={}){
  const cw=o.cw||110;
  const sc=cols.map(c=>{
    const lo=c.notes.length?c.notes.reduce((a,b)=>b.midi<a.midi?b:a):null;
    const lh=c.notes.filter(n=>n===lo||n.midi<60), tr=c.notes.filter(n=>!lh.includes(n));
    const hc=c.hlColor||LT;
    const col={notes:tr.map(n=>prep(n,c)),lh:lh.map(n=>prep(n,c)),color:c.color,ltColor:hc,accColor:hc,label:c.label,labelColor:c.color,op:c.op};
    return {col,tr,lh};
  });
  // 矢印（ヘ音記号の音にもつけられるように、core のがくふとおなじ位置を計算する）
  const ns=PA.sigInfo(key).letters.length, nx=50+ns*10+(ns?24:14);
  const tw=t=>[...(t||'')].reduce((w,ch)=>w+(ch.charCodeAt(0)>255?14:8.5),0);
  const pad=Math.max(44,...arrows.filter(a=>!a.mid).map(a=>tw(a.text)-cw/2+22));
  let svg=PA.staffSVG(key,sc.map(s=>s.col),{grand:true,autoCarry:true,colW:cw,minW:Math.max(o.minW||0,arrows.length?nx+cols.length*cw+pad:0)});
  const posOf=(ci,n)=>{
    const s=sc[ci]; if(!s) return null;
    const inT=s.tr.includes(n), arr=inT?s.tr:s.lh.includes(n)?s.lh:null; if(!arr) return null;
    const P=arr.map(m=>({m,s:PA.stepOf(m)})).sort((a,b)=>a.s-b.s);
    let ps=-99,po=false; P.forEach(p=>{p.off=(p.s-ps===1&&!po);po=p.off;ps=p.s;});
    const p=P.find(p=>p.m===n);
    return {x:nx+ci*cw+cw/2+(p.off?13:0),y:inT?96-(p.s-30)*5:178-(p.s-26)*5,inT};
  };
  let add='';
  const cs=new Set();
  arrows.forEach(a=>{
    const p=posOf(a.c1,a.n1), r=posOf(a.c2,a.n2); if(!p||!r) return;
    const id='np'+a.color.slice(1); cs.add(a.color);
    add+=`<path d="M${p.x+12} ${p.y} L${r.x-22} ${r.y}" stroke="${a.color}" stroke-width="2.4" fill="none" stroke-dasharray="${a.dash||''}" marker-end="url(#${id})"/>`;
    if(!a.text) return;
    // 字の場所：ふつうは行き先の音の右。そこからべつの矢印が出るときは音の上（矢印と重ならないように）。
    // mid＝矢印のまん中の下（ヘ音記号の音なら上：2つの五線のあいだ）
    if(a.mid) add+=`<text x="${(p.x+r.x)/2-5}" y="${(p.y+r.y)/2+(r.inT?22:-12)}" text-anchor="middle" font-size="13" font-weight="800" fill="${a.color}">${a.text}</text>`;
    else{
      const busy=arrows.some(b=>b!==a&&b.c1===a.c2&&b.n1===a.n2);
      add+=`<text x="${r.x+14}" y="${busy?r.y-11:r.y+5+(a.dy||0)}" font-size="14" font-weight="800" fill="${a.color}">${a.text}</text>`;
    }
  });
  if(cs.size) add+=`<defs>${[...cs].map(c=>`<marker id="np${c.slice(1)}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${c}"/></marker>`).join('')}</defs>`;
  svg=svg.replace(/<\/svg>$/,add+'</svg>');
  // 小さくなりすぎないように（文字が読めるように）横スクロールにする
  const m=svg.match(/viewBox="0 0 ([\d.]+) /), W=m?+m[1]:400;
  return `<div class="scroll" data-sk="${o.sk||'staff'}"><div style="min-width:${Math.round(W*0.66)}px">${svg}</div></div>`;
}
const isLow=n=>n.tag==='low';

/* ===== けんばんの印 ===== */
// ベース（ならびの0番）は左手（うすい色）、上の声はフォーカス。青＝下げた根音、赤＝導音、subs(n,i)＝下の小さな字
function chordMarks(ns,col,o={}){
  const m=new Map();
  ns.forEach((n,i)=>{
    if(i===0){if(o.noBass) return;m.set(n.midi,{fill:LIGHT[col]||'#eee',tc:DARK[col]||'#3a3245',label:PA.nm(n),sub:'左手',subColor:col});return;}
    if(m.has(n.midi)) return;
    const fill=n.tag==='low'?LOW:n.tag==='lt'?LT:n.tag==='borrowed'?BOR:col;
    const k={fill,label:PA.nm(n),focus:true};
    const s=o.subs&&o.subs(n,i); if(s){k.sub=s[0];k.subColor=s[1]||fill;}
    m.set(n.midi,k);
  });
  return m;
}
const n6Subs=(n,i)=>i===3?['根音',LOW]:i===2?['第5音',n.tag==='borrowed'?BOR:N_COL]:i===1?['第3音',N_COL]:null;
const BOR_CAP='<span class="bor">オレンジ＝かりた音</span>';

  m+=key.minor?'':`長調では第5音${q(ii[2])}も<b>${parMinor(key)}</b>（同じ主音の短調）からかりて${q(n6[2])}にするよ。`;
  m+=`<br>記号は<b>${N6H(key)}</b>。Ⅱの左下のチョンは根音を半音下げたしるし、右上の1は第1転回形（いちばん下が第3音）。`;
  m+=`ベースは音階の4ばんめ${q(b)}で、<b>Ⅳや${II6H}と同じところ</b>に入るなかま。Ⅴの前で使うよ。`;

// 📖 ことばメモ：本や楽譜で見かける名前を、やさしいことばで。例はいまの調の音で
function termsHTML(key){
  const n6=n6Of(key), r=n6[3], lt=toV7(key)[3];
  const span=[0,1,2].map(i=>PA.nm({letter:PA.mod(r.letter-i,7),acc:0})).join('・'); // 減3度を文字で数える（下へ）
  // けんばんでおなじはばの2度（上の音を書きかえる。♯♯・♭♭になるときは下の音を書きかえる）
  const pcN=n=>PA.mod(PA.NAT[n.letter]+n.acc,12);
  let s2=[{letter:PA.mod(lt.letter+1,7),acc:PA.spell(PA.mod(lt.letter+1,7),pcN(r))},lt];
  if(Math.abs(s2[0].acc)>1){const L=PA.mod(r.letter-1,7);s2=[r,{letter:L,acc:PA.spell(L,pcN(lt))}];}
  const w2=Math.abs(s2[0].acc)>1||Math.abs(s2[1].acc)>1?'2度':`${q(s2[0])}から${q(s2[1])}（2度）`;
  return `<details class="more" data-d="terms"><summary>📖 ことばメモ（本や楽譜で見かける名前）</summary>
    <p class="note" style="margin:0 0 4px">例は${PA.keyName(key)}の音だよ。</p><ul>
    <li><b>ナポリの六</b>（${N6H(key)}） … Ⅱの根音を半音下げた長三和音（<b>ナポリの和音</b>ともいう）を、第3音がいちばん下になるようにおいた形。${PA.keyName(key)}ではコードネーム${H.symbol(key,'N6')}。</li>
    <li><b>根音下方変位</b> … 和音の根音を半音下げること。記号では大きい数字の左下にチョンをつけるよ。</li>
    <li><b>右上の小さい数字</b>（転回形） … どの音をいちばん下におくかのしるし。1＝第3音がいちばん下（第1転回形・六の和音）、2＝第5音がいちばん下（第2転回形・四六の和音）。</li>
    <li><b>終止四六</b> … Ⅴの前におく${I64H}。Ⅰの音だけど、ベースがⅤの根音なので、Ⅴのなかまになるよ。</li>
    <li><b>減3度</b> … ${q(r)}から${q(lt)}は文字で数えて3つ（${span}）なので3度。でもふつうの3度よりせまいので「減」3度。けんばんでは${w2}と同じはばだよ。</li>
    <li><b>カデンツ</b>（終止形） … 曲やフレーズのおわりかたの和音のならび。ナポリの六は、Ⅳや${II6H}のかわりにⅤの前におくよ。</li>
    ${key.minor?'':`<li><b>準固有和音</b>・<b>○</b> … 同じ主音の短調からかりた和音。○はそのしるし。${PA.keyName(key)}は${parMinor(key)}からかりるよ（${PA.rn(srcLabel(key,'ii6',true))}など）。</li>`}
    <li><b>共通音</b> … となりの和音にもある同じ音。同じ声でそのままのこすと、なめらか。ナポリの${q(n6[1])}は、そのままⅤ7の第7音になるよ。</li>
  </ul></details>`;
}

  </div></details>`;
}
// がくふの下に：その楽譜にダブルシャープ・ダブルフラットが出ているときだけ、書きかたのメモ（出ていなければ ''）
function accNote(ns){
  const dfl=uniqNames(ns.filter(n=>n&&n.acc===-2)), dsh=ns.some(n=>n&&n.acc===2);
  if(!dsh&&!dfl.length) return '';
  let h=`<p class="note">`;
  if(dsh) h+=`<span class="ds">x</span>はダブルシャープ（重嬰）の楽譜での書き方です。`;
  if(dfl.length) h+=`${PA.H('𝄫')}はダブルフラット（重変）。この調では正しく書くとどうしても出てきます（${dfl.map(n=>`${PA.nmH(n)}＝${PA.nmH(PA.spellMidi(n.midi,PA.majorKey(0)))}の鍵`).join('、')}）。`;
  return h+`</p>`;
}

/* ===== 画面 ===== */
let lastActions='';
function kbCard(key){
  const A=state.anim, [lo,hi]=keyRange(key);
  let mk, cap;
  if(A){mk=A.marks;cap=A.kbCap||'';}
  else if(state.abPlaying){mk=new Map();cap=`${state.abPlaying}をきいているよ（けんばんは、かくしてあるよ）`;}
  else if(state.alt){mk=chordMarks(state.alt.notes,state.alt.color);cap=state.alt.cap||'';}
  else{mk=chordMarks(n6Of(key),N_COL,{subs:n6Subs});cap=`ナポリの六。<span class="lo">青＝半音下げた根音</span>${key.minor?'':'、'+BOR_CAP}。`;}
  return `<section class="card"><h2>🎹 けんばん<small>${cap}　左手はいちばん下の音。${PA.once('tap-sound','さわると音が出るよ')}</small></h2><div class="scroll" data-sk="kb">${PA.kbSVG(lo,hi,mk)}</div></section>`;
}
function render(){
  const key=curKey(), A=state.anim;
  let h=`<div class="stack">
    <div class="toprow">${PA.keyChip(key)}<span class="note" style="margin:0">${PA.keyEn(key)}</span></div>
    ${heroCard(key)}${kbCard(key)}${staffCard(key)}${placeCard(key)}${cadCard(key)}${abCard(key)}${tryCard(key)}
    ${nameDetails(key)}${key.minor?'':borrowDetails(key)}${tipsHTML(key)}${termsHTML(key)}${PA.rnHelp()}${linksCard()}</div>`;
  PA.paint(document.getElementById('view'),h,'neapolitan:'+state.minor+':'+state.keyIdx);
  if(A||state.playing) PA.follow(document.getElementById('view')); // 音の高さがかわっても鍵が見えるように
  const acts=(A||state.playing?`<button class="btn" data-act="stop">${PA.icon('stop')}とめる</button>`:`<button class="btn night" data-act="build">🐸 つくりかた</button>`)+
    `<button class="btn" data-act="play" data-hot="listen">${PA.icon('listen')}いっしょに</button><button class="btn primary" data-act="resolve">${PA.icon('next')}${state.path==='i64'?I64H+'→Ⅴ':'Ⅴへ'}</button>`;
  if(acts!==lastActions){PA.paint(document.getElementById('actions'),acts,'bar');lastActions=acts;}
}

/* ===== 鳴らす ===== */
let token=0;
function stop(){token++;state.anim=null;state.autoWait=false;state.playing=false;state.alt=null;state.res=null;state.cad=null;state.cmp=null;state.abPlaying=null;PA.stopSound();}
// 和音をじゅんに鳴らす。seq:[{notes,color,cap,res,cad,ms}]、show＝false ならけんばんに出さない（聴きわけ）、extra＝はじめに state へ
async function playSeq(seq,o={}){
  stop(); const my=token;
  state.playing=true; Object.assign(state,o.extra||{});
  for(let i=0;i<seq.length;i++){
    const s=seq[i], last=i===seq.length-1;
    state.alt=o.show===false?null:s; state.res=s.res==null?null:s.res; state.cad=s.cad==null?null:s.cad; render();
    PA.chord(midisOf(s.notes),{dur:last?2.2:(s.ms||1300)/1000+0.1});
    await PA.sleep(s.ms||1300); if(my!==token) return;
  }
  await PA.sleep(900); if(my!==token) return;
  state.playing=false; state.alt=null; state.res=null; state.cad=null; state.cmp=null; state.abPlaying=null; render();
}
const capOf=(lab,col,ns)=>`<b style="color:${col}">${PA.rnH(lab)}</b>：${namesC(uniqNames(ns.slice(1)),'・')}（左手${nH(ns[0])}）`;
function playResolve(path){
  const key=curKey(), st=stagesOf(key,path);
  playSeq(st.map((s,i)=>({notes:s.notes,color:s.color,res:i,cap:capOf(s.name,s.color,s.notes)})));
}
function playCad(){
  const key=curKey(), seq=cadSeq(key,state.cadPath);
  playSeq(seq.map((s,i)=>({notes:s.ns,color:s.col,cad:i,ms:s.d*1000,cap:`カデンツ${i+1}/${seq.length}：`+capOf(s.lab,s.col,s.ns)})));
}
function playCmp(id){
  const key=curKey(), ns=id==='n6'?n6Of(key):srcChord(key,id,false), lab={iv:'Ⅳ',ii6:II6P,n6:'ナポリの六'}[id], col=id==='n6'?N_COL:SRC_COL, V=toV7(key);
  playSeq([{notes:ns,color:col,cap:capOf(lab,col,ns)},{notes:V,color:V_COL,cap:capOf('Ⅴ7',V_COL,V)}],{extra:{cmp:id}});
}
// 聴きくらべ：答えがわからないように、けんばんには出さない（ナポリの印もかくす）
function playAB(v){
  const ab=state.ab; if(!ab||!['A','B'].includes(v)) return;
  const key=curKey(), ns=v===ab.n6?n6Of(key):srcChord(key,ab.other,false);
  playSeq([{notes:ns},{notes:toV7(key)}],{show:false,extra:{abPlaying:v}});
}

/* ===== つくりかたアニメ ===== */
async function runBuild(){
  stop(); const my=token, alive=()=>my===token;
  const key=curKey(), src=state.src, isII=src==='ii6', n6=n6Of(key);
  const S0=srcChord(key,src,false), S1=key.minor?null:srcChord(key,src,true);
  const L0=srcLabel(key,src,false), L1=S1?srcLabel(key,src,true):null, L0H=PA.rn(L0), L1H=L1&&PA.rn(L1);
  const A={cols:[{notes:[]}],arrows:[],marks:new Map(),msg:'',kbCap:'',staffCap:''};
  state.anim=A; state.msg=null;
  const upd=m=>{if(m!==undefined)A.msg=m;render();};
  const wait=async ms=>{await PA.sleep(ms);return alive();};
  // ① もとの和音（Ⅱ¹かⅣ）を根音・第3音・第5音のじゅんにつみかさねる
  const head=isII?`<b>①</b>まず${PA.keyName(key)}の<b>${II6H}</b>をつくるよ。音階の2ばんめ${q(S0[3])}からひとつとばしで3つ（Ⅱ）。それを第3音${q(S0[0])}がいちばん下になるようにおいた形（第1転回形）だよ。`
    :`<b>①</b>まず${PA.keyName(key)}の<b>Ⅳ</b>をつくるよ。音階の4ばんめ${q(S0[0])}からひとつとばしで3つ。`;
  A.staffCap=L0H+'（'+srcSym(key,src,false)+'）'; A.kbCap=L0H;
  upd(head); if(!await wait(1500)) return;
  const steps=isII?[[[3],`根音${q(S0[3])}（音階の2ばんめ）`],[[0,1],`第3音${q(S0[0])}。いちばん下（ベース）にもおいて2つにする`],[[2],`第5音${q(S0[2])}`]]
    :[[[0,1],`根音${q(S0[0])}（音階の4ばんめ）。いちばん下（ベース）にもおいて2つにする`],[[2],`第3音${q(S0[2])}`],[[3],`第5音${q(S0[3])}`]];
  const have=new Set();
  for(let i=0;i<steps.length;i++){
    const [idx,line]=steps[i]; idx.forEach(j=>have.add(j));
    const ns=S0.filter((_,j)=>have.has(j));
    A.cols=[{notes:ns,color:SRC_COL}]; A.arrows=[];
    A.marks=chordMarks(have.has(0)?ns:[null,...ns],SRC_COL,{noBass:!have.has(0)});
    upd(head+`<br>${i+1}. ${i?'ひとつとばして':''}${line}`);
    idx.forEach((j,k)=>PA.playNote(S0[j].midi,k*0.25,1.1,0.22));
    if(!await wait(1500)) return;
  }
  A.cols=[{notes:S0,color:SRC_COL,label:L0}];
  upd(`これが${L0H}（${srcSym(key,src,false)}）。ベース${q(S0[0])}は${isII?'Ⅳ':II6H}と同じ音。どちらも<b>Ⅴの前におくなかま</b>だね。`);
  PA.chord(midisOf(S0)); if(!await wait(2200)) return;
  let prev=S0, prevL=L0;
  // ② 長調だけ：第6音を同主短調からかりて半音下げる
  if(S1){
    A.cols=[{notes:S0,color:SRC_COL,label:L0,op:.5},{notes:S1,color:SRC_COL,label:L1,hl:n=>n.tag==='borrowed',hlColor:BOR}];
    A.arrows=[{c1:0,n1:S0[2],c2:1,n2:S1[2],color:BOR,text:'半音↓'}];
    A.marks=chordMarks(S1,SRC_COL); A.marks.get(S1[2].midi).fill=BOR; A.marks.get(S1[2].midi).sub='かりた'; A.marks.get(S1[2].midi).subColor=BOR;
    A.marks.set(S0[2].midi,{fill:'#fff',ring:BOR,tc:BOR,label:PA.nm(S0[2]),sub:'もとの音',subColor:GHOST});
    A.staffCap=`${isII?'第5音':'第3音'}を半音下げる（${L1H}）`; A.kbCap='オレンジ＝かりた音';
    upd(`<b>②</b>${isII?'第5音':'第3音'}${q(S0[2])}を<b class="bor">半音下げて</b>${q(S1[2])}にするよ。${q(S1[2])}は<b>${parMinor(key)}</b>（同じ主音の短調）からかりてきた音（${L1H}：<b>○</b>は同じ主音の短調からかりた和音のしるし）。`);
    PA.playNote(S1[2].midi,0,1.1,0.24); if(!await wait(1100)) return;
    PA.chord(midisOf(S1)); if(!await wait(2200)) return;
    prev=S1; prevL=L1;
  }
  // ③ 根音を半音下げる（Ⅱ6）／第5音を半音上げて♭2にかえる（Ⅳ）
  const from=prev[3], n=n6[3];
  A.cols=[{notes:prev,color:SRC_COL,label:prevL,op:.5},{notes:n6,color:N_COL,label:n6P(key),hl:isLow,hlColor:LOW}];
  A.arrows=[{c1:0,n1:from,c2:1,n2:n,color:LOW,text:isII?'半音↓':'半音↑'}];
  A.marks=chordMarks(n6,N_COL,{subs:(x,i)=>i===3?[isII?'半音下げ':'半音上げ',LOW]:null});
  A.marks.set(from.midi,{fill:'#fff',ring:LOW,tc:LOW,label:PA.nm(from),sub:'もとの音',subColor:GHOST});
  A.staffCap=isII?'根音を半音下げる':'第5音を半音上げる'; A.kbCap='<span class="lo">青＝新しい根音</span>'+(key.minor?'':'、'+BOR_CAP);
  const n3=S1?'③':'②';
  upd(isII?`<b>${n3}</b>根音${q(from)}を<b class="lo">半音下げて</b>${q(n)}にすると…${key.minor?`<br>（短調では第5音${q(n6[2])}は${KEY_NOTE}だね）`:''}`
    :`<b>${n3}</b>第5音${q(from)}のかわりに、半音上の${q(n)}をのせると…${key.minor?`<br>（短調では第3音${q(n6[2])}は${KEY_NOTE}だね）`:''}`);
  PA.playNote(n.midi,0,1.1,0.24); if(!await wait(1100)) return;
  PA.chord(midisOf(n6));
  const done=`🎉 <b>できあがり！</b>${PA.keyName(key)}のナポリの六は<b class="big">${namesC(uniqNames(n6))}</b><br>`+
    `${q(n)}を根音にした長三和音（コードネーム${H.symbol(key,'bII')}）。Ⅱの根音を下げたので左下にチョン、いちばん下が第3音${q(n6[0])}なので右上に<b>1</b>。記号は<b>${N6H(key)}</b>。`+
    (isII?'':`Ⅳから見ると、いちばん下から5度の音のかわりに6度の音をのせた形だね。`)+`「Ⅴへ」で聴いてみよう！`;
  upd(done); if(!await wait(2400)) return;
  state.msg=done; state.anim=null; render();
}

/* ===== 操作 ===== */
PA.mountBar({title:'ナポリの六',app:'neapolitan'});
PA.onSettings=render;
PA.onPageShow=()=>{stop();render();}; // 「もどる」でもどってきたとき、とちゅうの画面をのこさない
PA.onStopDown=stop;
PA.onStopCancel=render; // ⏹ をおしたのに click が来なかったとき画面をもどす
PA.onKeySheet=()=>PA.openKeySheet({minor:state.minor,idx:state.keyIdx,both:true,onPick:(minor,idx)=>{
  stop(); state.minor=minor; state.keyIdx=idx; state.msg=null; state.ab=null; save(); render(); PA.chord(midisOf(n6Of(curKey())),{dur:2});
}});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){ // おなじ調をひらく（リンクはそのまま進む）
    if(g.dataset.go==='aug6'){const p=PA.store.get('aug6',{}), t=p&&['it','fr','ger'].includes(p.type)?p.type:'it';PA.store.set('aug6',{minor:state.minor,keyIdx:state.keyIdx,type:t});}
    if(g.dataset.go==='borrowed'&&!state.minor) PA.store.set('borrowed',{keyIdx:state.keyIdx,id:'ii_dim'}); // 準固有は長調だけ
    return;
  }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v;
  if(a==='play'){
    if(state.anim){const c=state.anim.cols[state.anim.cols.length-1].notes;if(c.length)PA.chord(midisOf(c),{dur:2});return;} // アニメ中はとめずに鳴らす
    stop(); render(); PA.chord(midisOf(n6Of(curKey())),{dur:2});
  }
  else if(a==='resolve'){
    const p=PATHS.includes(v)?v:state.path;
    state.path=p; PA.store.set('neapolitan-path',p); playResolve(p);
  }
  else if(a==='build') runBuild();
  else if(a==='stop'){stop();render();}
  else if(a==='src'){if(!SRCS.includes(v))return;stop();state.src=v;state.msg=null;PA.store.set('neapolitan-src',v);render();}
  else if(a==='cpath'){if(!PATHS.includes(v))return;stop();state.cadPath=v;PA.store.set('neapolitan-cpath',v);render();}
  else if(a==='cplay') playCad();
  else if(a==='cmp'){if(['iv','ii6','n6'].includes(v)) playCmp(v);}
  else if(a==='qnext'){stop();state.ab={n6:Math.random()<0.5?'A':'B',other:Math.random()<0.5?'ii6':'iv',answer:null};render();}
  else if(a==='abplay') playAB(v);
  else if(a==='qchoose'){if(state.ab&&state.ab.answer==null){stop();state.ab.answer=v;state.abN++;if(v===state.ab.n6)state.abOk++;render();}}
  else if(a==='go'){
    stop(); render();
    if(v==='aug6'){const p=PA.store.get('aug6',{}), t=p&&['it','fr','ger'].includes(p.type)?p.type:'it';PA.store.set('aug6',{minor:state.minor,keyIdx:state.keyIdx,type:t});PA.go('aug6.html');}
  }
});
const AUTO=PA.store.get('neapolitan-auto',false);
if(AUTO) state.src='ii6'; // 「つくりかたを見る」はいつもⅡ6から（保存はしない）
render();
// ほかのアプリの「つくりかたを見る」から来たとき：えらばれた調でアニメをはじめる
// iPhone などではこのページをタッチするまで音が出ないので、音が出せるようになってからはじめる
// （音がとまっているあいだに音をよやくすると、あとでいっぺんに鳴ってしまう）
if(AUTO) (async()=>{
  PA.store.set('neapolitan-auto',false);
  const t0=token; // まっているあいだにほかの操作をしたらやめる
  if(PA.settings.sound){ // パソコンなどですぐ音が出せるならそのままはじめる
    PA.audio();
    for(let i=0;i<5&&!PA.audioRunning();i++) await PA.sleep(30);
  }
  if(token!==t0) return;
  if(!PA.settings.sound||!PA.audio()||PA.audioRunning()){runBuild();return;} // 音が出せないブラウザでは待たずにはじめる
  state.autoWait=true; render();
  const EV=['pointerup','touchend','keydown'];
  let busy=false;
  const off=()=>EV.forEach(t=>document.removeEventListener(t,go,true));
  async function go(e){
    if(!state.autoWait){off();return;}
    // ボタン・リンク・シート・けんばんはそれぞれの操作にまかせる（つくりかた／調をかえると待ちはおわる）
    const t=e&&e.target;
    if(t&&t.closest&&t.closest('button,a,dialog,summary,.appbar,[data-act],[data-pa],[data-m]')) return;
    if(busy) return; busy=true;
    PA.audio(); // core もこのタッチで音を起こすので、動きだすのを少しまつ
    for(let i=0;i<15&&PA.settings.sound&&!PA.audioRunning();i++) await PA.sleep(30);
    busy=false;
    if(!state.autoWait){off();return;}
    if(PA.settings.sound&&PA.audio()&&!PA.audioRunning()) return; // まだ音が出せない：つぎのタッチをまつ
    off(); runBuild();
  }
  EV.forEach(t=>document.addEventListener(t,go,true));
})();
</script>
