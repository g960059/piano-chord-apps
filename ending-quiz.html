<body>
<header class="appbar" id="appbar"></header>
<main class="page" id="view"></main>
<div class="actionbar" id="actions"></div>
<script src="assets/core.js"></script>
<script>
/* おわりかたクイズ：4つの和音のならびを 👂 きいて／🎼 見て、おわりかた（終止）の名前を当てる。和音は PA.ending（core.js）から
 * 保存（'ending-quiz'）：mode（'ear'｜'see'）・level（1〜4）・tier（PA.keyDeck のむずかしさ）・weak・sc（モードごとのスコア）・openSet・
 *   いまのもんだい q {minor, keyIdx, pat（PA.ending.PATTERNS の id）}・ans（えらんだこたえ）・hint・played・step・
 *   deck（調のふくろののこり）・cBag（こたえのふくろののこり）・lastCat・lastPat・pin・pinFrom（'link'＝n のないリンクの key：つぎにひらいてものこる。'pick'＝チェック表のます・n のあるリンクの key：その回のあいだだけ）
 * 調のきろくは PA.keyDeck（'keystats-ending-quiz'）。れんしゅうの回（📝 きょうの5もん・チェック表の3もん・リンクの n）は PA.session
 * リンク：mode＝ear｜see、level＝1〜4、tier＝easy｜normal｜hard｜all、key＝M0〜M12・m0〜m12（その調だけ。短調ならレベル4）、n＝1〜20（れんしゅうの回）。
 *   よんだらアドレスからはずす（「もどる」の読みなおしでまたはじめないように） */
const E=PA.ending, KD=PA.keyDeck, QUIZ='ending-quiz', mod=PA.mod;
const LEVELS=[
  {lv:1,short:'全・半・変格',choices:['full','half','plagal'],modes:['major'],desc:'全終止・半終止・変格終止の3つ（長調）'},
  {lv:2,short:'＋偽終止',choices:['full','half','plagal','deceptive'],modes:['major'],desc:'全終止・半終止・変格終止・偽終止の4つ（長調）'},
  {lv:3,short:'完全・不完全',choices:['perfect','imperfect','half','plagal','deceptive'],modes:['major'],desc:'全終止を完全終止と不完全終止にわけて5つ（長調）'},
  {lv:4,short:'＋短調',choices:['perfect','imperfect','half','plagal','deceptive','phrygian'],modes:['major','minor'],desc:'短調も出るよ。フリギア終止（短調だけ）も入れて6つ'}
];
const LV=lv=>LEVELS.find(L=>L.lv===lv)||LEVELS[0];
// こたえ（えらぶ名前）→ 出すならび
const PATS={full:['perfect','imperfectA','imperfectB'],perfect:['perfect'],imperfect:['imperfectA','imperfectB'],half:['half'],plagal:['plagal'],deceptive:['deceptive'],phrygian:['phrygian']};
const catOf=(pat,lv)=>{const c=E.pattern(pat).type;return LV(lv).choices.includes(c)?c:'full';}; // レベル1・2では完全・不完全は「全終止」
// さいごの2つの和音の目じるし（まちがえたときに「えらんだほうはこう」）
const SIGN={full:'Ⅴ（Ⅴ7）→ Ⅰ',perfect:'Ⅴ7 → Ⅰで、どちらもいちばん下が根音、Ⅰのいちばん上が主音',imperfect:'Ⅴ7 → Ⅰだけど、Ⅰのいちばん上が主音ではないか、Ⅴ7のいちばん下が根音ではない',half:'Ⅴでとまる',plagal:'Ⅳ → Ⅰ',deceptive:'Ⅴ7 → Ⅵ',phrygian:'短調のⅣ（てんかい）→ Ⅴ'};
const TIER_IDS=KD.TIERS.map(t=>t.id);
const isInt=(v,lo,hi)=>Number.isInteger(v)&&v>=lo&&v<=hi;
const keyOfQ=q=>PA.keyOf(q.minor,q.keyIdx,60);
const keyIdOf=q=>KD.id(q.minor,q.keyIdx);
const dataOf=q=>{const p=E.pattern(q.pat);return E.build(keyOfQ(q),p.type,p.variant);};
// えらんだこたえのならび（おなじ調・おなじ高さ）。全終止は完全終止の形で。短調だけのおわりかたを長調でえらんだときは null
const chosenData=(key,c)=>E.build(key,c==='full'?'perfect':c,'A');
const T=id=>E.type(id);
const yomi=(w,y)=>`<ruby>${w}<rt>${y}</rt></ruby>`;

/* ===== リンク（先生がおくる宿題）：たしかめてからつかう。この1回のせってい（ほぞんもする） ===== */
const P=PA.params(), LINK={};
if(P.mode==='ear'||P.mode==='see') LINK.mode=P.mode;
{const lv=PA.paramInt('level',1,LEVELS.length); if(lv!=null) LINK.level=lv;}
if(TIER_IDS.includes(P.tier)) LINK.tier=P.tier;
{const k=KD.parse(P.key); if(k) LINK.key=k.id;}
const LINK_N=PA.paramInt('n',1,20);
const FROM_LINK=Object.keys(LINK).length>0||LINK_N!=null;
// れんしゅうの回：リンクに n があればはじめる（おなじリンクのとちゅうならつづき）。なければのこっている回をよむだけ
let sess=LINK_N?PA.session(QUIZ,{n:LINK_N}):PA.session(QUIZ);

/* ===== 状態 ===== */
// pin：この調だけ出す（n のないリンクの key＝'link'、チェック表のます・n のあるリンクの key＝'pick'＝その回のあいだだけ）
const Q={mode:'ear',level:1,tier:'easy',weak:true,openSet:false,sc:{ear:{right:0,hint:0,total:0,streak:0},see:{right:0,hint:0,total:0,streak:0}},
  q:null,qid:0,ans:null,hint:false,played:false,step:0,muteHint:false,fresh:false,recorded:false,playing:false,cmp:null,sum:false,pin:null,pinFrom:null};
let deck=null, cBag=[], lastCat=null, lastPat=null;
const restoreDeck=s=>deck.restore(s); // ひらきなおしてもふくろのつづきから。もどせたら true
const deckState=()=>deck.state();
const pinOf=()=>Q.pin?KD.parse(Q.pin):null;
const pinKey=()=>{const k=pinOf();return k?PA.keyOf(k.minor,k.idx,60):null;};
const validQ=q=>!!q&&typeof q==='object'&&typeof q.minor==='boolean'&&isInt(q.keyIdx,0,PA.keyCount(q.minor)-1)&&!!E.pattern(q.pat);
// そのもんだいがいまのレベル・調のせっていで出せるか
const inPool=q=>{const p=E.pattern(q.pat);return PATS[catOf(q.pat,Q.level)].includes(q.pat)&&E.allowed(keyOfQ(q),p.type)&&LV(Q.level).modes.includes(q.minor?'minor':'major')
  &&(Q.pin?keyIdOf(q)===Q.pin:deck.ids.includes(keyIdOf(q)));};
function setPin(id,from){
  Q.pin=id; Q.pinFrom=id?from:null;
  if(id&&KD.parse(id).minor&&!LV(Q.level).modes.includes('minor')) Q.level=4; // 短調はレベル4だけ
}
(function load(){
  const raw=PA.store.get(QUIZ,{}), d=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};
  if(['ear','see'].includes(d.mode)) Q.mode=d.mode;
  if(isInt(d.level,1,LEVELS.length)) Q.level=d.level;
  if(TIER_IDS.includes(d.tier)) Q.tier=d.tier;
  if(typeof d.weak==='boolean') Q.weak=d.weak;
  Q.openSet=d.openSet===true;
  ['ear','see'].forEach(m=>{const s=d.sc&&d.sc[m];if(s&&isInt(s.total,0,1e6)&&isInt(s.right,0,s.total)&&isInt(s.streak,0,s.right)) Q.sc[m]={right:s.right,hint:isInt(s.hint,0,s.total-s.right)?s.hint:0,total:s.total,streak:s.streak};});
  // おわった回：おわってすぐ（「もどる」で読みなおした）ならけっかのカード。前におわった回はかたづける（pin をもどすまえに）
  if(sess.finished()){const st=sess.state(); if(st&&st.endedAt!=null&&Date.now()-st.endedAt<10*6e4) Q.sum=true; else sess.clear();}
  // リンクのせっていがあればそちらを
  if(LINK.mode) Q.mode=LINK.mode;
  if(LINK.level) Q.level=LINK.level;
  if(LINK.tier) Q.tier=LINK.tier;
  if(LINK.key) setPin(LINK.key,LINK_N?'pick':'link'); // n のあるリンクはその回のあいだだけ
  else{
    const k=KD.parse(d.pin), from=d.pinFrom==='link'?'link':'pick', st=sess.state();
    if(k&&LV(Q.level).modes.includes(k.minor?'minor':'major')){
      if(from==='link'&&!FROM_LINK) setPin(k.id,'link'); // 前にひらいたリンクの調（ほかのリンクできたらすてる）
      else if(from==='pick'&&sess.n()&&st&&st.sig.split('&').indexOf('key='+k.id)>=0) setPin(k.id,'pick'); // チェック表の3もん・n のあるリンクの回のとちゅう（か、おわってすぐ）
    }
  }
  deck=KD.create({quiz:QUIZ,tier:Q.tier,modes:LV(Q.level).modes,weak:Q.weak});
  const hasBag=restoreDeck(d.deck); // ひらきなおしてもふくろのつづきから
  const ch0=LV(Q.level).choices; // こたえのふくろもつづきから
  if(Array.isArray(d.cBag)) cBag=d.cBag.slice(0,20).filter(c=>ch0.includes(c));
  if(ch0.includes(d.lastCat)) lastCat=d.lastCat;
  if(typeof d.lastPat==='string'&&E.pattern(d.lastPat)) lastPat=d.lastPat;
  // とちゅうのもんだい（「しくみを見る」からもどったときなど）はそのまま
  if(validQ(d.q)&&inPool(d.q)){
    startQ({minor:d.q.minor,keyIdx:d.q.keyIdx,pat:d.q.pat});
    if(!hasBag&&!Q.pin) deck.draw(x=>x.id===keyIdOf(Q.q)); // ふくろのきろくがないときも、この調は「出た」ことに
    const ch=LV(Q.level).choices;
    if(ch.includes(d.ans)){Q.ans=d.ans;Q.recorded=true;}
    Q.hint=d.hint===true;
    Q.played=d.played===true;
    if(isInt(d.step,0,3)) Q.step=d.step;
  }
})();
// リンクのせっていはつかいおわったので、アドレスからはずす（「もどる」の読みなおしでまたはじめからにならないように。
// n がなければのこっている回のつづきをよむので、とちゅうの回はきえない）
if(FROM_LINK||location.search){try{history.replaceState(history.state,'',PA.url(QUIZ)+location.hash);}catch(e){}}
function save(){
  PA.store.set(QUIZ,{mode:Q.mode,level:Q.level,tier:Q.tier,weak:Q.weak,openSet:Q.openSet,sc:Q.sc,
    q:Q.q?{minor:Q.q.minor,keyIdx:Q.q.keyIdx,pat:Q.q.pat}:null,ans:Q.ans,hint:Q.hint,played:Q.played,step:Q.step,
    deck:deckState(),cBag,lastCat,lastPat,pin:Q.pin,pinFrom:Q.pin?Q.pinFrom:null});
}

/* ===== もんだい ===== */
function startQ(q){Object.assign(Q,{q,qid:Q.qid+1,ans:null,hint:false,played:false,step:0,muteHint:false,recorded:false,cmp:null});}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
// こたえのふくろ：レベルのこたえを1つずつ入れてまぜる（どれもおなじくらい出る）。新しいふくろの1つめはまえとちがうこたえ
// key＝調がきまっているとき（その調でつくれないこたえは入れない）
function nextCat(key){
  const ch=LV(Q.level).choices.filter(c=>!key||E.allowed(key,c));
  cBag=cBag.filter(c=>ch.includes(c));
  if(!cBag.length){cBag=shuffle([...ch]);if(cBag.length>1&&cBag[0]===lastCat) cBag.push(cBag.shift());}
  return lastCat=cBag.shift();
}
function newQ(){
  const pk=pinOf(), c=nextCat(pk?PA.keyOf(pk.minor,pk.idx,60):null), prev=Q.q, prevId=prev?keyIdOf(prev):null;
  let pats=PATS[c].filter(p=>p!==lastPat); if(!pats.length) pats=PATS[c]; // おなじならびをつづけない
  const pat=pats[Math.floor(Math.random()*pats.length)];
  const fit=p=>E.allowed(PA.keyOf(p.minor,p.idx,60),E.pattern(pat).type);
  const k=pk||deck.draw(p=>fit(p)&&p.id!==prevId)||deck.draw(fit)||{minor:c==='phrygian',idx:0};
  lastPat=pat;
  startQ({minor:k.minor,keyIdx:k.idx,pat});
}
const qLabel=q=>`${PA.keyName(keyOfQ(q))}の${T(catOf(q.pat,Q.level)).name}`; // けっかのカードのもんだいの名前（ただの文字）
// 見て当てるでヒント（ローマ数字）を見てからせいかい＝「ヒントでできた」：⭐ のせいかいはふえないが、れんぞくもきれない。まちがいはふつうの ×
function answer(v){
  const ok=v===catOf(Q.q.pat,Q.level), hint=ok&&Q.mode==='see'&&Q.hint, s=Q.sc[Q.mode];
  Q.ans=v; s.total++; PA.answerFx(ok);
  if(ok&&!hint){s.right++;s.streak++;} else if(hint) s.hint=(s.hint||0)+1; else s.streak=0;
  if(!Q.recorded){
    Q.recorded=true; deck.record(keyIdOf(Q.q),ok,{hint});
    if(sess.active()) sess.record({ok,hint,label:qLabel(Q.q),key:keyIdOf(Q.q)});
  }
}

/* ===== 音 ===== */
let token=0, playAt=0;
const freshPlay=()=>Date.now()-playAt<600; // 2どおしの2回めで ⏹ をおしてすぐとまらないように
function stop(){token++;Q.playing=false;Q.cmp=null;PA.stopSound();}
// 4つの和音をながす。show＝カード・けんばん・がくふもうごかす。cmp＝くらべて聴くボタン（'mine'｜'right'）
async function playSeq(d,show,cmp){
  stop(); const my=token;
  Q.playing=true; Q.cmp=cmp||null; playAt=Date.now();
  if(cmp&&!show) render(); else renderActions();
  for(let i=0;i<d.length;i++){
    const last=i===d.length-1;
    if(show){Q.step=i;render();}
    PA.chord([...d[i].lh,...d[i].rh].map(n=>n.midi),last?{dur:3}:{});
    await PA.sleep(last?2000:1150); if(my!==token) return;
  }
  Q.playing=false; Q.cmp=null; if(show||cmp) render(); else renderActions();
}
const playAll=show=>playSeq(dataOf(Q.q),show);
const playStep=i=>{const d=dataOf(Q.q);PA.stopSound();PA.chord([...d[i].lh,...d[i].rh].map(n=>n.midi),i===3?{dur:3}:{});};

/* ===== 画面 ===== */
const showLabels=()=>Q.mode==='see'?(Q.hint||!!Q.ans):!!Q.ans; // ローマ数字を見せるか
const isWhite=m=>!PA.BLACK.has(mod(m,12));
const whiteCount=(lo,hi)=>{let c=0;for(let m=lo;m<=hi;m++) if(isWhite(m)) c++;return c;};
function rangeOf(ms,minW=8){
  let lo=Math.min(...ms), hi=Math.max(...ms);
  if(!isWhite(lo)) lo--; if(!isWhite(hi)) hi++;
  for(let side=0;whiteCount(lo,hi)<minW&&side<8;side++){
    if(side%2===0){lo--;while(!isWhite(lo))lo--;} else {hi++;while(!isWhite(hi))hi++;}
  }
  return [lo,hi];
}
// いまのせってい（リンク・先生に見せる文）
const linkParams=()=>{const p={mode:Q.mode,level:Q.level};if(Q.pin) p.key=Q.pin; else p.tier=Q.tier;return p;};
function settingsText(){
  const tr=KD.TIERS.find(t=>t.id===Q.tier), pk=pinKey();
  return [Q.mode==='ear'?'きいて当てる':'見て当てる','レベル'+Q.level+'（'+LV(Q.level).choices.map(c=>T(c).name).join('・')+'）',
    pk?'調：'+PA.keyName(pk):'調のむずかしさ：'+tr.name+'（調号'+tr.min+'〜'+tr.max+'）'].join('・');
}
function lvHTML(){
  const L=LV(Q.level);
  return `<div class="seg lvseg" role="group" aria-label="問題のレベル">${LEVELS.map(x=>`<button class="${x.lv===Q.level?'on':''}" data-act="qlevel" data-v="${x.lv}" aria-pressed="${x.lv===Q.level}" aria-label="レベル${x.lv}：${x.desc}"><small>レベル</small><span class="lvn">${x.lv}</span><small>${x.short}</small></button>`).join('')}</div>
    <p class="lvdesc"><b>レベル${L.lv}</b>：${L.desc}</p>`;
}
function choiceHTML(c){
  const M=T(c), A=Q.ans, right=Q.q?catOf(Q.q.pat,Q.level):null;
  let cls=''; if(A){if(c===right)cls='right';else if(c===A)cls='wrong';else cls='dim';}
  return `<button class="echoice ${cls}" style="--c:${M.color}" data-act="eans" data-v="${c}" ${A?'disabled':''} aria-label="${M.name}（${M.nick}）"><span class="em" aria-hidden="true">${M.emoji}</span><span class="wd">${yomi(M.name,M.yomi)}</span><span class="lb">「${M.nick}」</span></button>`;
}
// くらべて聴くボタン（えらんだ／せいかい）
function abBtn(v,label,M){
  const on=Q.cmp===v;
  return `<button class="btn ${on?'on':''}" style="--c:${M.color}" data-act="ecmp" data-v="${v}" aria-pressed="${on}"><span>${on?PA.icon('stop')+'とめる':label}</span><small>${M.emoji} ${M.name}</small></button>`;
}
function fbHTML(key,data){
  const p=E.pattern(Q.q.pat), right=catOf(Q.q.pat,Q.level), ok=Q.ans===right, M=T(right), D=T(p.type);
  let h=`<div class="fb ${ok?'good':'bad'}${Q.fresh?'':' still'}" id="fb" role="status">${ok?(Q.mode==='see'&&Q.hint?'🎉 正解！（💡 ヒントでできた）':'🎉 正解！'):'🤔 おしい！'}こたえは<b>${yomi(M.name,M.yomi)}</b>「${M.nick}」`;
  h+=`<span class="sm">${data.map(c=>`<span class="nw">${E.labelText(c)}</span>`).join(' → ')}</span>`;
  if(right==='full') h+=`<span class="sm">さいごが<b>${E.labelText(data[2])} → ${E.labelText(data[3])}</b>。だから<b>${M.name}</b></span><span class="sm">くわしくいうと、${D.name}（レベル3から分けるよ）</span>`;
  else h+=`<span class="sm">${E.why(key,p.type,p.variant)}。だから<b>${M.name}</b></span>`;
  if(!ok){
    const A=T(Q.ans), mine=chosenData(key,Q.ans);
    h+=Q.ans==='half'&&right==='phrygian'
      ?`<span class="sm">Ⅴでとまるのは半終止と同じ。でもⅣ（てんかい）から、いちばん下が半音下がってⅤにとまるので、フリギア終止。</span>`
      :`<span class="sm">選んだ${A.name}は、さいごが${SIGN[Q.ans]}。</span>`;
    // おなじ調・おなじ高さでくらべて聴く
    h+=`<div class="abrow">${mine?abBtn('mine',PA.icon('repeat')+'選んだおわりかた',A):`<p class="abnone">🌙 ${A.name}は短調だけのおわりかた。${PA.keyName(key)}では鳴らせないよ。</p>`}${abBtn('right',PA.icon('repeat')+'正解のおわりかた',M)}</div>`;
  }
  h+=`<div class="row"><button class="btn small" data-act="howto">${PA.icon('flag')}おわりかたのしくみを見る</button></div></div>`;
  return h;
}
// 4つの和音（カード・けんばん・がくふ）。labels＝ローマ数字を見せる
function scoreHTML(key,data,labels){
  const step=Q.step, cur=data[step], col=labels?PA.COL[cur.ch]:'#3a3245', ink='#5b5266', light='#f1ebf6';
  const nmS=c=>`<span class="lh">${PA.nmH(c.lh[0])}</span>`+c.rh.map(n=>`<span>${PA.nmH(n)}</span>`).join('');
  let h=`<section class="card"><h2>🎼 4つの和音${labels?PA.once('tap-sound','<small>タップすると、その和音が鳴るよ</small>'):`<small>ローマ数字はかくしてあるよ。${PA.once('tap-sound','タップすると、その和音が鳴るよ')}</small>`}</h2><div class="seq">`+data.map((c,i)=>{
    const cc=labels?PA.COL[c.ch]:ink, ll=labels?PA.LCOL[c.ch]:light;
    return `<button class="scard ${i===step?'on':''}" style="--c:${cc};--l:${ll}" data-act="qstep" data-v="${i}" aria-pressed="${i===step}" aria-label="${i+1}つめ${labels?E.labelText(c):''}"><span class="num">${labels?PA.rnH(c.label):i+1}</span>${labels&&c.inv?'<span class="inv">てんかい</span>':''}<span class="nm">${nmS(c)}</span></button>`;
  }).join('')+`</div>`;
  const cols=data.map((c,i)=>({notes:c.rh,lh:c.lh,color:labels?PA.COL[c.ch]:ink,accColor:'#d1495b',op:i===step?1:0.35,label:labels?E.rnOf(c):String(i+1),sub:labels&&c.inv?'てんかい':'',labelColor:labels?PA.COL[c.ch]:'#a99f93'}));
  const ns=PA.sigInfo(key).letters.length, W=50+ns*10+(ns?24:14)+4*66+8;
  h+=`<div class="scroll" data-sk="staff" style="margin-top:12px"><div class="staffw" style="min-width:${Math.round(W*0.64)}px">${PA.staffSVG(key,cols,{grand:true,colW:66})}</div></div>`;
  const rm=new Map(), lm=new Map();
  cur.rh.forEach(n=>rm.set(n.midi,{fill:col,label:PA.nm(n),focus:true}));
  cur.lh.forEach(n=>{const blk=PA.BLACK.has(mod(n.midi,12));
    lm.set(n.midi,blk?{fill:col,light:true,tc:'#fff',label:PA.nm(n),sub:'左手',subColor:col,focus:true}:{fill:labels?PA.LCOL[cur.ch]:light,tc:col,label:PA.nm(n),sub:'左手',subColor:col,focus:true});});
  const [rlo,rhi]=rangeOf(data.flatMap(c=>c.rh.map(n=>n.midi))), [llo,lhi]=rangeOf(data.map(c=>c.lh[0].midi));
  const kb=(lo,hi,marks,sk,hand)=>`<div class="handblk" style="max-width:${whiteCount(lo,hi)*54}px"><div class="hand">${hand}</div><div class="scroll" data-sk="${sk}"><div class="kbw">${PA.kbSVG(lo,hi,marks)}</div></div></div>`;
  h+=`<div style="margin-top:12px">${kb(rlo,rhi,rm,'kbr',`✋ 右手（${step+1}つめ）`)}${kb(llo,lhi,lm,'kbl','🤚 左手')}</div></section>`;
  return h;
}

// 調のチェック表（レベル1〜3は長調だけ → 「長調チェック表」）。ますをおすとその調を3もん

  return KD.checkTableHTML(QUIZ,{modes,pickable:true})+(modes.includes('minor')?'':`<p class="note" style="margin:-4px 6px 0">🌙 短調はレベル4で出るよ。</p>`);

// スコアの下：れんしゅうの回のすすみぐあい、または「📝 きょうの5もん」
const sessHTML=()=>`<div class="sessrow">${sess.active()||sess.finished()?sess.progressHTML():`<button class="btn small" data-act="sess5">${PA.icon('session')}きょうの5もん</button>`}</div>`;
function render(){
  if(!Q.q) newQ();
  const view=document.getElementById('view');
  if(Q.sum&&sess.finished()){ // れんしゅうの回がおわった：けっかのカード
    const h=`<div class="stack">${sess.summaryHTML({title:'おわりかたクイズ',page:'ending-quiz',params:linkParams(),settings:settingsText()})}${settingsHTML()}${checkHTML()}</div>`;
    PA.paint(view,h,'sum');
    renderActions();
    return;
  }
  Q.sum=false;
  const q=Q.q, key=keyOfQ(q), data=dataOf(q), L=LV(Q.level), s=Q.sc[Q.mode], labels=showLabels();
  let h=`<div class="stack">${PA.seg('qmode',[['ear',PA.icon('ear')+'きいて当てる'],['see',PA.icon('eye')+'見て当てる']],Q.mode,'full')}
    <section class="card hero">${lvHTML()}
      <div class="score">⭐ ${s.right} / ${s.total}もん正解${s.hint?` <span class="note" style="margin:0">💡 ヒントでできた${s.hint}</span>`:''} <span class="note" style="margin:0">れんぞく${s.streak}</span></div>
      ${sessHTML()}
      <div class="qtitle"><span class="qkey">${PA.keyName(key)}</span><span>のおわりかたは？</span></div>
      <p class="qsub">（${PA.sigLabel(key)}）${Q.mode==='ear'?'和音が4つ鳴るよ。さいごのほうをよく聴こう。'+PA.once('ending-replay','なんかい聴いてもいいよ。'):'がくふとけんばんを見て当てよう。'}</p>`;
  if(Q.muteHint&&!PA.settings.sound) h+=`<div class="rinfo soundhint" role="status">🔇 音がオフだよ<button type="button" class="btn small" data-pa="sound-on">${PA.icon('listen')}音を出す</button></div>`;
  if(Q.mode==='see'&&Q.hint&&!Q.ans) h+=`<div class="msg" role="status" style="margin-top:10px">💡 ヒント：ローマ数字を出したよ。<b>さいごの2つ</b>を見よう。</div>`;
  // 見て当てる：がくふ・けんばんを先に、こたえはその下に（見てからえらぶ）
  const ans=`<div class="echoices ${L.choices.length%2?'odd':''}">${L.choices.map(choiceHTML).join('')}</div>`+(Q.ans?fbHTML(key,data):'');
  if(Q.mode==='see') h+=`</section>${scoreHTML(key,data,labels)}<section class="card"><h2>✋ どれかな？</h2>${ans}${!Q.ans&&!Q.hint?PA.once('hint-rule',`<p class="note hintnote">💡 ヒント：${PA.HINT_NOTE}</p>`):''}</section>`;
  else h+=`${ans}</section>${Q.ans?scoreHTML(key,data,labels):''}`;
  h+=settingsHTML()+checkHTML()+tipsHTML()+`</div>`;
  PA.paint(view,h,Q.qid+':'+Q.mode+':'+(Q.ans?1:0)+':'+(labels?1:0));
  PA.follow(view);
  Q.fresh=false;
  renderActions();
}
let lastActions=null;
function renderActions(){
  let a;
  const bar=document.getElementById('actions');
  const playBtn=lbl=>Q.playing?`<button class="btn" data-act="stop" data-hot="listen">${PA.icon('stop')}とめる</button>`:`<button class="btn night" data-act="eplay" data-hot="listen">${lbl}</button>`;
  if(Q.sum) a=''; // けっかのカードのボタンをつかう
  else if(Q.ans) a=playBtn(PA.icon('play')+'もういちど聴く')+`<button class="btn primary" data-act="enew" data-hot="next">${PA.icon('next')+(sess.finished()?'けっかを見る':'次')}</button>`;
  else if(Q.mode==='ear') a=playBtn(Q.played?PA.icon('repeat')+'もういちど聴く':PA.icon('play')+'聴く');
  else a=`<button class="btn" data-act="qhint" ${Q.hint?'disabled':''}>${PA.icon('hint')}ヒント</button>`+playBtn(PA.icon('play')+'聴く');
  bar.style.display=a?'':'none';
  if(a!==lastActions){PA.paint(bar,a,'bar');lastActions=a;}
}
// あたらしい問題：1回のスクロールで、問題の行とこたえのボタンが見えるところへ
// （👂 はこたえのボタンを ⬇のバーの上まで。でもたての画面では問題の行を上のバーにかくさない。
//   よこのひくい画面は問題の行を上に、入りきらなければボタンを優先）
function showQ(){
  const t=document.querySelector('.qtitle'), g=document.querySelector('.echoices');
  const ab=document.getElementById('actions'), hb=document.getElementById('appbar');
  const land=matchMedia('(max-height:500px) and (orientation:landscape)').matches;
  const abs=el=>scrollY+el.getBoundingClientRect().top;
  const hbB=hb?hb.getBoundingClientRect().bottom:0, view=innerHeight-(ab?ab.offsetHeight:0);
  let y=land&&t?abs(t)-hbB-6:0;
  if(Q.mode==='ear'&&g&&t){
    const need=scrollY+g.getBoundingClientRect().bottom+24-view; // ボタンの下はしをバーの上に
    y=land?Math.max(y,need):Math.max(0,Math.min(need,abs(t)-hbB-8));
  }
  window.scrollTo(0,Math.max(0,y)); // すぐに1回（音をながすあいだ描きなおすので、なめらかなスクロールはとちゅうでとまる）
}
function reveal(el){
  if(!el||!el.getBoundingClientRect) return;
  const r=el.getBoundingClientRect(), ab=document.getElementById('actions'), bottom=innerHeight-(ab?ab.offsetHeight:0);
  if(r.bottom>bottom&&el.scrollIntoView) el.scrollIntoView({block:'nearest'});
}

/* ===== 操作 ===== */
PA.mountBar({title:'おわりかたクイズ',app:'ending-quiz'});
PA.onSettings=render;
PA.onPageShow=()=>{stop();location.reload();}; // 「もどる」でもどったら読みなおす（べつのページですすめたきろくを古いきろくで上書きしない）
PA.onStopDown=()=>{if(!freshPlay()) stop();};
PA.onStopCancel=render;
// 聴く：なんかいでも。音がオフのときはおしえるだけ
function listen(){
  if(!PA.settings.sound){Q.muteHint=true;render();return;}
  Q.muteHint=false;
  if(Q.mode==='ear'&&!Q.ans&&!Q.played){Q.played=true;save();render();}
  playAll(Q.mode==='see'||!!Q.ans);
}
// あたらしいもんだいを出して、きいて当てるならすぐ鳴らす
function goNext(){
  newQ(); save(); askedAt=Date.now(); render();
  if(Q.mode==='ear') listen();
  showQ();
}
let askedAt=0;
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act, v=el.dataset.v;
  switch(a){
    case 'qmode': if(Q.mode===v||!['ear','see'].includes(v)) return; stop(); Q.mode=v; newQ(); break;
    case 'qlevel': {
      const lv=+v; if(lv===Q.level||!isInt(lv,1,LEVELS.length)) return; stop();
      const same=LV(lv).modes.join()===LV(Q.level).modes.join(); Q.level=lv; cBag=[];
      const pk=pinOf(); if(pk&&pk.minor&&!LV(lv).modes.includes('minor')) setPin(null); // 短調の調だけだったら、ほかの調も
      if(!same) deck.setOptions({modes:LV(lv).modes}); newQ(); break; // 長調だけどうしなら調のふくろはそのまま
    }
    case 'qtier': if(Q.pin||Q.tier===v||!TIER_IDS.includes(v)) return; stop(); Q.tier=v; deck.setOptions({tier:v}); newQ(); break; // 調を1つにきめているときは出さない
    case 'qweak': {Q.weak=!Q.weak; const s=deckState(); deck.setOptions({weak:Q.weak}); restoreDeck(s); break;} // 今のもんだいもふくろののこりもそのまま。つぎのふくろから
    case 'qreset': Q.sc[Q.mode]={right:0,hint:0,total:0,streak:0}; break;
    case 'unpin': if(!Q.pin) return; stop(); setPin(null); newQ(); break;
    case 'keystats-reset': if(v!==QUIZ) return; deck.reset(); break; // 2回おすたしかめは core
    case 'kd-pick': { // チェック表のます：その調を3もん
      const k=KD.parse(v); if(!k||!LV(Q.level).modes.includes(k.minor?'minor':'major')) return;
      stop(); setPin(k.id,'pick'); Q.sum=false; cBag=[];
      sess=PA.session(QUIZ,{sig:'key='+k.id}); sess.start(3);
      goNext(); return;
    }
    case 'sess5': stop(); if(Q.pinFrom==='pick') setPin(null); sess=PA.session(QUIZ,{sig:''}); sess.start(5); Q.sum=false; goNext(); return;
    case 'session-again': if(!sess.n()) return; stop(); sess.start(sess.n()); Q.sum=false; goNext(); return;
    case 'session-free': stop(); sess.clear(); Q.sum=false; if(Q.pinFrom==='pick') setPin(null); goNext(); return;
    case 'eplay':
      if(Q.playing) return;
      if(!Q.ans&&Date.now()-askedAt<600) return; // 「つぎ」の2どおしですぐ鳴りなおさないように
      listen(); return;
    case 'stop': if(freshPlay()) return; stop(); render(); return;
    case 'ecmp': { // まちがえたとき：えらんだおわりかた／せいかいをおなじ調・高さで聴く
      if(!Q.ans||(v!=='mine'&&v!=='right')) return;
      if(Q.cmp===v){if(freshPlay()) return; stop(); render(); return;}
      const d=v==='mine'?chosenData(keyOfQ(Q.q),Q.ans):dataOf(Q.q); if(!d) return;
      if(!PA.settings.sound){Q.muteHint=true;render();return;}
      playSeq(d,v==='right',v); return;
    }
    case 'qhint': if(Q.mode!=='see'||Q.ans) return; Q.hint=true; break;
    case 'qstep': {const i=+v; if(!isInt(i,0,3)) return; stop(); Q.step=i; save(); render(); if(!PA.settings.sound){Q.muteHint=true;render();} else playStep(i); return;}
    case 'eans': {
      if(Q.ans||!LV(Q.level).choices.includes(v)) return;
      stop(); answer(v); save(); Q.fresh=true; Q.step=3; render();
      if(PA.settings.sound) playStep(3);
      reveal(document.getElementById('fb')); return;
    }
    case 'enew': {
      stop();
      if(sess.finished()){Q.sum=true; save(); render(); PA.scrollTop(); return;} // さいごのもんだいのあと：けっかのカード
      goNext(); return;
    }
    case 'howto': {
      stop(); save(); const p=E.pattern(Q.q.pat), o=PA.store.get('ending',{});
      PA.store.set('ending',{...(o&&typeof o==='object'?o:{}),minor:Q.q.minor,keyIdx:Q.q.keyIdx,type:p.type,variant:p.variant||'A',step:0});
      PA.go('ending.html'); return;
    }
    default: return;
  }
  save(); render();
});
document.addEventListener('toggle',e=>{if(e.target.id==='qsetd'&&Q.openSet!==e.target.open){Q.openSet=e.target.open;save();}},true);
if(!Q.q) newQ();
save(); render();
if(Q.mode==='ear'&&!Q.ans&&!Q.sum&&!window.scrollY) showQ(); // ひらいたときも、こたえのボタンが見えるように
</script>
</body>
